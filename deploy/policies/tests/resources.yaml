# Fixtures for `kyverno test deploy/policies/tests`: one compliant pod shaped like the chart's output and one pod per
# violation the policies must reject.
apiVersion: v1
kind: Pod
metadata: {name: good, namespace: meridian}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: app
      image: ghcr.io/meridian-org/ledger-service@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 250m, memory: 640Mi}, limits: {memory: 640Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: latest-tag, namespace: tools}
spec:
  containers:
    - name: app
      image: busybox:latest
---
