# PLT-GITOPS: values shared by every deployed environment of infra/helm/meridian-router (same layering as
# base/meridian.yaml). The router's digest comes from global.image.digests.cell-router in deploy/<env>/images.yaml.
image:
  registry: "ghcr.io/meridian-org"       # deploy/pipeline.yaml registry
  requireDigest: true
  pullPolicy: IfNotPresent
