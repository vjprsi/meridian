# Generated by tools/observability.py from docs/operations/SLO_SLA.md; edit the generator, not this file.
# Prometheus rule file (also packaged as a PrometheusRule by infra/helm/meridian, values observability.*).
groups:
  - name: "meridian-journeys"
    rules:
      - alert: "J2CardAuthP99High"
        expr: "histogram_quantile(0.99, sum by (le, cell) (rate(http_server_requests_seconds_bucket{job=\"card-authorization-service\",uri=\"/v1/card-authorizations\"}[5m]))) > 0.25"
        for: "5m"
        labels:
          severity: "page"
          journey: "J2"
        annotations:
          summary: "Card authorisation p99 above 250 ms in cell {{ $labels.cell }}"
          runbook: "docs/operations/RUNBOOKS.md#11-card-authorisation-degradation"
      - alert: "J2CardAuthStandInHigh"
        expr: |-
          sum by (cell) (rate(meridian_cards_authorization_duration_seconds_count{stand_in="true"}[10m]))
          /
          sum by (cell) (rate(meridian_cards_authorization_duration_seconds_count[10m])) > 0.05
        for: "10m"
        labels:
          severity: "ticket"
          journey: "J2"
        annotations:
          summary: "More than 5 % of card authorisations decided in stand-in (ledger unavailable?)"
          runbook: "docs/operations/RUNBOOKS.md#11-card-authorisation-degradation"
      - alert: "J1PaymentInitiationErrors"
        expr: |-
          sum by (cell) (rate(meridian_payments_initiations_total{outcome="error"}[10m]))
          /
          sum by (cell) (rate(meridian_payments_initiations_total[10m])) > 0.01
        for: "10m"
        labels:
          severity: "ticket"
          journey: "J1"
        annotations:
          summary: "More than 1 % of payment initiations end in a server error"
          runbook: "docs/operations/RUNBOOKS.md#5-stuck-payments"
      - alert: "J5EodSweepFailed"
        expr: "sum by (cell) (increase(meridian_eod_sweep_runs_total{status!=\"SUCCEEDED\"}[30m])) > 0"
        for: "0m"
        labels:
          severity: "page"
          journey: "J5"
        annotations:
          summary: "An EOD sweep finished {{ $labels.status }} in cell {{ $labels.cell }}"
          runbook: "docs/operations/RUNBOOKS.md#4-end-of-day-eod-failure-handling"
      - alert: "J5EodLate"
        expr: "time() - max by (cell) (max_over_time(meridian_eod_sweep_last_success_timestamp_seconds[3d])) > 26 * 3600"
        for: "15m"
        labels:
          severity: "page"
          journey: "J5"
        annotations:
          summary: "No successful EOD sweep for more than 26 h in cell {{ $labels.cell }}"
          runbook: "docs/operations/RUNBOOKS.md#4-end-of-day-eod-failure-handling"
      - alert: "J4StepUpChallengeSpike"
        expr: |-
          sum by (channel) (rate(meridian_auth_step_up_challenges_total[10m])) > 0.2
          and
          sum by (channel) (rate(meridian_auth_step_up_challenges_total[10m]))
            > 5 * sum by (channel) (rate(meridian_auth_step_up_challenges_total[1d] offset 1d))
        for: "15m"
        labels:
          severity: "ticket"
          journey: "J4"
        annotations:
          summary: "Step-up challenges on the {{ $labels.channel }} channel at 5x yesterday's rate"
          runbook: "../compliance/THREAT_MODEL.md"
      - alert: "J4MfaVerificationFailures"
        expr: "sum(rate(meridian_identity_mfa_verifications_total{outcome=~\"invalid_code|factor_locked\"}[10m])) > 0.5"
        for: "10m"
        labels:
          severity: "ticket"
          journey: "J4"
        annotations:
          summary: "MFA verification failures above 0.5/s (code guessing or a broken factor)"
          runbook: "../compliance/THREAT_MODEL.md"
      - alert: "J4LoginFailureRatioHigh"
        expr: |-
          sum(rate(keycloak_user_events_total{event="login",error!=""}[10m]))
          /
          sum(rate(keycloak_user_events_total{event="login"}[10m])) > 0.3
          and
          sum(rate(keycloak_user_events_total{event="login"}[10m])) > 0.1
        for: "10m"
        labels:
          severity: "ticket"
          journey: "J4"
        annotations:
          summary: "More than 30 % of IdP logins fail (credential stuffing or IdP fault)"
          runbook: "../compliance/THREAT_MODEL.md"
      - alert: "J6CellUnhealthy"
        expr: "meridian_router_cell_healthy == 0"
        for: "30s"
        labels:
          severity: "page"
          journey: "J6"
        annotations:
          summary: "Cell {{ $labels.cell }} is unhealthy for the router"
          runbook: "../MULTI_REGION.md#5-failover-runbook-game-day"
      - alert: "J7SearchIndexerLag"
        expr: "max by (cell) (meridian_search_indexer_last_lag_ms) > 60000"
        for: "10m"
        labels:
          severity: "ticket"
          journey: "J7"
        annotations:
          summary: "Search indexer more than 60 s behind"
      - alert: "WorkflowApprovalQueueStale"
        expr: "max by (cell) (meridian_workflow_approvals_oldest_age_seconds) > 86400"
        for: "30m"
        labels:
          severity: "ticket"
        annotations:
          summary: "An approval request has been PENDING for more than 24 h"
