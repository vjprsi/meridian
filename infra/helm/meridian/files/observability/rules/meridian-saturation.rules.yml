# Generated by tools/observability.py from docs/operations/SLO_SLA.md; edit the generator, not this file.
# Prometheus rule file (also packaged as a PrometheusRule by infra/helm/meridian, values observability.*).
groups:
  - name: "meridian-saturation"
    rules:
      - alert: "MeridianTargetDown"
        expr: "up{job=~\".+-service|edge-gateway|cell-router|data-mover\"} == 0"
        for: "5m"
        labels:
          severity: "page"
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} cannot be scraped"
          runbook: "docs/operations/RUNBOOKS.md#3-deployment-rollback"
      - alert: "MeridianHttp5xxHigh"
        expr: |-
          sum by (job, cell) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (job, cell) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: "10m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} answers more than 5 % 5xx"
      - alert: "MeridianDbPoolPending"
        expr: "max by (job, instance) (hikaricp_connections_pending) > 0"
        for: "5m"
        labels:
          severity: "page"
        annotations:
          summary: "{{ $labels.job }} threads are waiting for a database connection"
          runbook: "docs/operations/RUNBOOKS.md#8-database-connection-exhaustion"
      - alert: "MeridianDbPoolTimeouts"
        expr: "sum by (job) (increase(hikaricp_connections_timeout_total[5m])) > 0"
        for: "0m"
        labels:
          severity: "page"
        annotations:
          summary: "{{ $labels.job }} timed out acquiring database connections"
          runbook: "docs/operations/RUNBOOKS.md#8-database-connection-exhaustion"
      - alert: "MeridianDbPoolNearlyExhausted"
        expr: "max by (job, instance) (hikaricp_connections_active / hikaricp_connections_max) > 0.9"
        for: "15m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} uses more than 90 % of its connection pool"
          runbook: "docs/operations/RUNBOOKS.md#8-database-connection-exhaustion"
      - alert: "MeridianKafkaConsumerLagHigh"
        expr: "max by (job, client_id) (kafka_consumer_fetch_manager_records_lag_max) > 10000"
        for: "10m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} consumer is more than 10k records behind"
          runbook: "docs/operations/RUNBOOKS.md#7-kafka-consumer-lag-audit-catch-up"
      - alert: "MeridianAuditConsumerLagCritical"
        expr: "max(kafka_consumer_fetch_manager_records_lag_max{job=\"audit-service\"}) > 50000"
        for: "1h"
        labels:
          severity: "page"
        annotations:
          summary: "audit-service consumer more than 50k records behind for 1 h"
          runbook: "docs/operations/RUNBOOKS.md#7-kafka-consumer-lag-audit-catch-up"
      - alert: "MeridianOutboxBacklog"
        expr: "max by (job) (meridian_outbox_oldest_age_seconds) > 60"
        for: "10m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} has unpublished outbox events older than 60 s"
          runbook: "docs/operations/RUNBOOKS.md#7-kafka-consumer-lag-audit-catch-up"
      - alert: "MeridianOutboxStuck"
        expr: "max by (job) (meridian_outbox_oldest_age_seconds) > 300"
        for: "5m"
        labels:
          severity: "page"
        annotations:
          summary: "{{ $labels.job }} outbox relay stuck (events older than 5 min)"
          runbook: "docs/operations/RUNBOOKS.md#7-kafka-consumer-lag-audit-catch-up"
      - alert: "MeridianOutboxRelayFailing"
        expr: "sum by (job) (increase(meridian_outbox_relay_failures_total[5m])) > 0"
        for: "10m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} cannot publish outbox events to Kafka"
          runbook: "docs/operations/RUNBOOKS.md#7-kafka-consumer-lag-audit-catch-up"
      - alert: "MeridianDataMoverRunFailed"
        expr: "sum(increase(meridian_mover_runs_total{outcome=\"failed\"}[15m])) > 0"
        for: "0m"
        labels:
          severity: "ticket"
        annotations:
          summary: "A tenant move copy FAILED in the data mover (schema drift, target not empty or verification mismatch)"
          runbook: "docs/operations/RUNBOOKS.md#9-tenant-move-and-cell-failover"
      - alert: "MeridianOutboxRelayPausedLong"
        expr: "max by (job, cell) (meridian_outbox_relay_paused) == 1"
        for: "30m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} relay paused for 30 min (expected only in a warm standby cell; after a promotion it means the promotion is stuck)"
          runbook: "docs/operations/RUNBOOKS.md#9-tenant-move-and-cell-failover"
      - alert: "MeridianJvmHeapHigh"
        expr: |-
          sum by (job, instance) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (job, instance) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: "15m"
        labels:
          severity: "ticket"
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} heap above 90 %"
