    enabled: true
    database: "card_vault_db"
    schema: "card_vault"
    zone: "cde"
    keyManagement: true
    allowedCallers:          # GAP-02: who may connect (from the code; tools/helm_chart.py)
      - {name: "card-authorization-service", zone: "cde"}
      - {name: "card-service", zone: "cde"}
      - {name: "card-threeds-service", zone: "cde"}
      - {name: "card-tokenization-service", zone: "cde"}
    secretName: "meridian-card-vault-service-secrets"
    secretEnv:
      MERIDIAN_CARDS_VAULT_MASTER_KEY: "master-key"
    env:
      MERIDIAN_CARD_VAULT_ALLOWED_CLIENTS: "meridian-console,svc-card-authorization-service,svc-card-service,svc-card-threeds-service,svc-card-tokenization-service"
  - name: card-authorization-service
    domain: "cards"
    enabled: true
    database: "card_auth_db"
    schema: "card_auth"
    replicas: 3
    cpu: "1"
    memory: "1Gi"
