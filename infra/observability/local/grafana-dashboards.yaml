# Local stack only (infra/local/compose.yaml mounts this into the otel-lgtm container): provisions the generated
# Meridian dashboards (infra/observability/grafana/dashboards) into a "Meridian" folder next to the image's own.
apiVersion: 1

providers:
  - name: Meridian
    folder: Meridian
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/meridian/dashboards
      foldersFromFilesStructure: false
