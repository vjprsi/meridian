# Applications and screens. Every entry in `apis` must be an existing operationId
# (python tools/generate.py fails otherwise). Front ends: React 19 + Next.js (web), Flutter (mobile).

apps:
  # ======================================================================= customer mobile
  - id: customer-mobile
    name: Customer Mobile App
    platform: iOS, Android (Flutter)
    users: Retail customers
    phase: 2
    screens:
      - name: Splash, device binding and passkey login
        priority: P0
        apis: [customerDevicesCreate, customerCredentialsPasskeysRegistrationOptions, customerCredentialsPasskeys, mfaFactorsVerify]
      - name: Onboarding - phone and OTP
        priority: P0
        apis: [onboardingApplicationsCreate, customerContactsSendVerification, customerContactsVerify]
      - name: Onboarding - ID capture, selfie and liveness
        priority: P0
        apis: [onboardingApplicationsNextStep, kycDocumentsCreate, documentsUploadUrl, kycChecksCreate]
      - name: Onboarding - personal details, address, consents
        priority: P0
        apis: [onboardingApplicationsUpdate, customerAddressesCreate, consentsCreate, onboardingApplicationsSubmit]
      - name: Onboarding status and tier upgrade
        apis: [onboardingApplicationsGet, customersTierHistory, walletsUpgradeTier]
      - name: Home dashboard (balances, pots, cards, insights)
        priority: P0
        apis: [depositAccountsList, depositAccountsBalance, walletsBalance, savingsPotsList, cardsList, notificationsList]
      - name: Account details and transactions
        priority: P0
        apis: [depositAccountsGet, depositAccountsTransactions, ledgerAccountsEntries]
      - name: Transaction details and receipt
        apis: [paymentsGet, paymentsReceipt, walletTransactionsReceipt, cardAuthorizationsGet]
      - name: Send money - P2P to phone or alias
        priority: P0
        apis: [payeeAliasesResolve, walletTransactionsQuote, walletTransactionsP2p, walletTransactionsConfirm]
      - name: Send money - bank transfer
        priority: P0
        apis: [payeesList, payeesCreate, payeeVerificationsCreate, paymentsValidate, paymentsCreate, paymentsTracker]
      - name: International transfer and FX quote
        apis: [remittanceCorridorsQuote, fxQuotesCreate, fxQuotesAccept, paymentsCreate]
      - name: Scan to pay (QR)
        priority: P0
        apis: [paymentQrCodesDecode, paymentQrCodesPay, merchantQrCodesDecode, merchantQrCodesPay]
      - name: Request money and payment links
        apis: [requestsToPayCreate, requestsToPayList, requestsToPayAccept, requestsToPayDecline, paymentLinksCreate]
      - name: Pay bills and buy airtime
        priority: P0
        apis: [billersList, billersProducts, billersValidateReference, billInquiriesCreate, billPaymentsCreate, airtimeTopupsCreate]
      - name: Scheduled payments and standing orders
        apis: [standingOrdersList, standingOrdersCreate, standingOrdersPause, standingOrdersResume, standingOrdersCancel]
      - name: Savings pots and goals
        apis: [savingsPotsList, savingsPotsCreate, savingsPotsDeposit, savingsPotsWithdraw, savingsPotRulesCreate]
      - name: Term deposits
        apis: [productsList, termDepositsCreate, termDepositsList, termDepositsBreakQuote, termDepositsBreak]
      - name: Cards - list, details, freeze
        priority: P0
        apis: [cardsList, cardsGet, cardsFreeze, cardsUnfreeze, cardVaultReveal]
      - name: Cards - controls and limits
        apis: [cardControlsList, cardControlsCreate, cardControlsUpdate, cardSpendLimitsCreate, cardSpendLimitsUpdate]
      - name: Cards - order virtual or physical card
        apis: [cardsCreate, cardsOrderPhysical, cardOrdersGet]
      - name: Cards - PIN, replace, add to wallet
        apis: [cardsPin, cardsReplace, cardTokensPushProvision]
      - name: Dispute a card transaction
        apis: [cardDisputesCreate, cardDisputeEvidenceCreate, cardDisputesGet]
      - name: Loans - offers and apply
        apis: [productsEligibilityCheck, loanApplicationsQuickQuote, loanApplicationsCreate, loanApplicationsSubmit, loanOffersAccept]
      - name: Loans - my loans, schedule, repay
        apis: [loansList, loansGet, loansSchedule, loansRepay, loansPrepaymentQuote]
      - name: Credit line and BNPL
        apis: [creditLinesGet, creditLinesDraw, creditLinesRepay, creditLinesStatements, bnplPlansList]
      - name: Statements and documents
        apis: [statementsList, statementsDownload, taxCertificatesList, taxCertificatesDownload]
      - name: Notifications inbox and preferences
        apis: [notificationsList, notificationsMarkRead, notificationPreferencesList, notificationPreferencesUpdate]
      - name: Profile, addresses and contacts
        apis: [customersGet, customersUpdate, customerAddressesList, customerAddressesUpdate, customerContactsList]
      - name: Security - devices, passkeys, PIN
        apis: [customerDevicesList, customerDevicesRevoke, customerCredentialsList, customerCredentialsPin]
      - name: Privacy and consents
        apis: [consentsList, consentsWithdraw, privacyRequestsCreate, obConsentsList, obConsentsRevoke]
      - name: Help, chat and complaints
        apis: [knowledgeArticlesSearch, serviceCasesCreate, serviceCasesList, complaintsCreate]

  # ======================================================================= customer web
  - id: customer-web
    name: Customer Web Banking
    platform: Web (React + Next.js)
    users: Retail customers
    phase: 2
    screens:
      - name: Login with passkey or password + MFA
        priority: P0
        apis: [customerCredentialsPasskeys, mfaFactorsVerify]
      # signed-in screens use the customer channel (/v1/me, customer-channel-service) only
      - name: Accounts overview
        priority: P0
        apis: [myAccountsList, myAccountsHoldings, myAccountsBalance, myWalletsList, myCardsList, myLoansList]
      - name: Transaction search and export
        apis: [myAccountsTransactions, myAccountsAddStatements, myAccountsStatementsDownload]
      - name: Payments and transfers
        priority: P0
        apis: [myPayeesList, myPayeesCreate, myPaymentsValidate, myPaymentsCreate, myPaymentsList, myPaymentsReceipt,
               myStandingOrdersCreate]
      - name: Statements, certificates and letters
        apis: [myAccountsStatements, taxCertificatesList, myAccountsConfirmationLetter]
      - name: Cards management
        apis: [myCardsList, myCardsFreeze, myCardsUnfreeze, myCardsChannels, myCardsReplaceLimits, myCardsReportLost]
      - name: Loans and credit
        apis: [myLoansList, myLoansSchedule, myLoansRepay, creditLinesGet]
      - name: Insights, budgets and rewards
        apis: [myInsightsSpending, myInsightsCards, myBudgetsList, myBudgetsCreate, myRewardsPointsAccounts]
      - name: Secure inbox and notifications
        apis: [myThreadsList, myThreadsCreate, myThreadsMessages, myThreadsAddMessages, myNotificationsList]
      - name: Third-party access (open banking)
        apis: [obConsentsList, obConsentsRevoke, obConsentsAccessLog]
      - name: Settings and security
        apis: [myProfileGet, myProfileUpdate, myContactsList, myDevicesList, myDevicesRevoke,
               myNotificationPreferencesReplace, myKycProfile, myActivityList]

  # ======================================================================= business portal
  - id: business-portal
    name: Business Banking Portal
    platform: Web (React + Next.js), port 13500
    users: SME owners, finance teams
    phase: 3
    screens:
      - name: Business onboarding (KYB, directors, UBOs)
        priority: P0
        apis: [onboardingApplicationsCreate, customerRelationshipsCreate, customersOwnershipTree, kycDocumentsCreate, onboardingApplicationsSubmit]
      # signed-in screens use the business channel (/v1/business, business-channel-service) only
      - name: Cash position dashboard
        priority: P0
        apis: [businessMeGet, businessCashPositionGet, businessAccountsList, businessAccountsBalance, businessApprovalQueueList]
      - name: Accounts, transactions and accounting export
        priority: P0
        apis: [businessAccountsGet, businessAccountsTransactions, businessAccountsExport]
      - name: Team users, roles and approval matrix
        priority: P0
        apis: [businessUsersList, businessUsersCreate, businessUsersUpdate, businessUsersSuspend, businessUsersReactivate,
               businessUsersRemove, businessUsersEntitlements, businessUsersReplaceEntitlements,
               businessUsersRemoveEntitlements, businessApprovalRulesList, businessApprovalRulesCreate,
               businessApprovalRulesReplace, businessApprovalRulesDelete]
      - name: Payments with multi-level approvals
        priority: P0
        apis: [businessPayeesList, businessPayeesCreate, businessPayeesDelete, businessPaymentsList, businessPaymentsCreate,
               businessPaymentsSubmit, businessApprovalQueueList, businessPaymentsApprove, businessPaymentsReject,
               businessPaymentsCancel, businessPaymentsRelease, businessPaymentsApprovals, businessPaymentsDownstream]
      - name: Bulk payments and payroll upload
        apis: [businessBulkPaymentsCreate, businessPaymentsSubmit, businessPaymentsApprove, businessBulkPaymentsReport]
      - name: Collections - virtual accounts and payment links
        apis: [businessVirtualAccountsList, businessVirtualAccountsCreate, businessVirtualAccountsTransactions,
               businessVirtualAccountsClose, businessPaymentLinksList, businessPaymentLinksCreate,
               businessPaymentLinksDisable, businessPaymentLinksPayments]
      - name: Direct debit mandates and collections
        apis: [businessMandatesList, businessMandatesCreate, businessMandatesCancel, businessMandatesCollections,
               businessMandatesAddCollections]
      - name: FX and international payments
        apis: [businessFxQuotesCreate, businessFxQuotesList, businessFxDealsList, businessPaymentsCreate]
      - name: Expense cards for employees
        apis: [businessCardProductsList, businessCardsList, businessCardsCreate, businessCardsFreeze, businessCardsUnfreeze,
               businessCardsClose, businessCardsChannels, businessCardsReplaceLimits, businessCardsAuthorizations]
      - name: Business loans and credit lines
        apis: [businessLoansList, businessLoansSchedule, businessLoansRepay, businessCreditLinesList,
               businessCreditLinesDrawdowns, businessCreditLinesDraw, businessCreditLinesRepay]
      - name: Statements and accounting export
        apis: [businessAccountsStatements, businessAccountsAddStatements, businessAccountsStatementsDownload,
               businessAccountsExport]
      - name: API keys and webhooks for the business
        apis: [businessApiClientsList, businessApiClientsCreate, businessApiClientsAddKeys, businessApiClientsKeysRevoke,
               businessWebhooksCreate, businessWebhooksAddSubscriptions, businessWebhooksDeliveries]
      - name: Security log
        apis: [businessActivityList]

  # ======================================================================= agent app
  - id: agent-app
    name: Agent App
    platform: Android, POS terminals, USSD fallback
    users: Agents, sub-agents, super-agents
    phase: 2
    # every screen uses the agent channel (/v1/agent, agent-channel-service) only
    screens:
      - name: Agent login, device binding and till open
        priority: P0
        apis: [agentMeGet, agentMeOutlets, agentMeDevicesCreate, agentMeDevicesGet, agentMeTillsList, agentMeTillsOpen]
      - name: Agent dashboard (float, cash, commissions)
        priority: P0
        apis: [agentMeFloatBalance, agentMeFloats, agentMeCommissionBalance, agentMePerformance, agentMeCommissionsSummary]
      - name: Cash-in for customer
        priority: P0
        apis: [agentMeCustomersLookup, agentMeTransactionsQuote, agentMeCashInCreate, agentMeTransactionsReceipt]
      - name: Cash-out for customer
        priority: P0
        apis: [agentMeCustomersLookup, agentMeCashOutCreate, agentMeCashOutConfirm, agentMeCashOutCancel, agentMeTransactionsReceipt]
      - name: Assisted customer onboarding (offline capable)
        priority: P0
        apis: [agentMeJourneysList, agentMeApplicationsCreate, agentMeApplicationsNextStep, agentMeApplicationsAddSteps,
               agentMeApplicationsDocuments, agentMeApplicationsSubmit, agentMeOfflineBatchesCreate]
      - name: Bill payment and airtime for walk-in customers
        apis: [agentMeBillersList, agentMeBillersProducts, agentMeBillPaymentsCreate, agentMeAirtimeCreate]
      - name: Float top-up and rebalancing requests
        apis: [agentMeFloatRequestsCreate, agentMeFloatRequestsList, agentMeCashRequestsCreate]
      - name: Sub-agents (super-agents, read-only)
        apis: [agentMeSubAgents, agentMePerformance]
      - name: Till close and end-of-day report
        apis: [agentMeTillsClose, agentMeTransactionsList]
      - name: Device and security
        apis: [agentMeDevicesList, agentMeDevicesHeartbeat, agentMeDevicesRevoke, agentMeActivity]

  # ======================================================================= merchant app
  - id: merchant-app
    name: Merchant App
    platform: Web PWA (React + Next.js), mobile-first, port 13600
    users: Merchants and cashiers
    phase: 3
    screens:
      - name: Merchant onboarding
        priority: P0
        apis: [merchantsCreate, kycDocumentsCreate, merchantStoresCreate]
      # signed-in screens use the merchant channel (/v1/merchant, merchant-channel-service) only
      - name: Sign-in and store picker
        priority: P0
        apis: [merchantAppMeGet, merchantAppStoresList, merchantAppTerminalsList]
      - name: Collect payment (dynamic QR)
        priority: P0
        apis: [merchantAppSalesCreate, merchantAppSalesGet, merchantAppSalesCancel]
      - name: Payment links
        apis: [merchantAppPaymentLinksCreate, merchantAppPaymentLinksList, merchantAppPaymentLinksCancel]
      - name: Sales and transactions
        priority: P0
        apis: [merchantAppSalesList, merchantAppTransactionsList, merchantAppTransactionsGet]
      - name: Refunds
        apis: [merchantAppTransactionsRefundable, merchantAppRefundsCreate, merchantAppRefundsList, merchantAppRefundsApprove,
               merchantAppRefundsReject, merchantAppRefundsCancel]
      - name: Settlements, reports and fees
        apis: [merchantAppSettlementsList, merchantAppSettlementsGet, merchantAppSettlementsReport, merchantAppFeesGet,
               merchantAppFeesStatement]
      - name: Stores, tills and terminals
        apis: [merchantAppStoresList, merchantAppTerminalsList, merchantAppTerminalsDeactivate]
      - name: Staff and roles
        apis: [merchantAppStaffList, merchantAppStaffCreate, merchantAppStaffUpdate, merchantAppStaffReplaceStores,
               merchantAppStaffSuspend, merchantAppStaffReactivate, merchantAppStaffRemove]
      - name: Payout account
        apis: [merchantAppPayoutAccountGet, merchantAppPayoutAccountEligibleAccounts, merchantAppPayoutChangesList,
               merchantAppPayoutChangesCreate, merchantAppPayoutChangesApprove, merchantAppPayoutChangesReject]
      - name: Developers (API keys and webhooks)
        apis: [merchantAppApiClientsList, merchantAppApiClientsCreate, merchantAppApiClientsAddKeys,
               merchantAppApiClientsKeysRevoke, merchantAppWebhooksList, merchantAppWebhooksCreate,
               merchantAppWebhooksAddSubscriptions, merchantAppWebhooksDeliveries]
      - name: Security log
        apis: [merchantAppActivityList]

