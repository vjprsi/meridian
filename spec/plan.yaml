decisions:
  - {id: D01, title: "Product name and brand", options: "Meridian Core (placeholder) / other", recommendation: "Decide before public developer portal launch (S11)"}
  - {id: D02, title: "Launch market(s) and anchor client type", options: "Neobank / telco wallet / card program", recommendation: "Telco wallet or neobank in one market: exercises ledger, wallets and payments first"}
  - {id: D03, title: "Ledger database engine", options: "CockroachDB / YugabyteDB / PostgreSQL 18 + Citus / TigerBeetle (as posting kernel)", recommendation: "Benchmark in S07; keep ledger behind a repository port so the engine can change"}
  - {id: D04, title: "Backend language and framework", options: "Java + Spring Boot / Kotlin / Go", recommendation: "Java 25 + Spring Boot 4", status: Decided, decision: "Java 25 LTS + Spring Boot 4 for every service (user decision)"}
  - {id: D05, title: "Primary cloud and first region", options: "AWS / GCP / Azure", recommendation: "AWS first, portability checks in CI"}
  - {id: D06, title: "KYC, bureau, card bureau and sanctions providers for market 1", options: "Per market shortlist", recommendation: "Two providers per capability behind adapters"}
  - {id: D07, title: "Commercial model", options: "Per active account / per transaction / platform fee + usage", recommendation: "Platform fee + per active account + per transaction tiers"}
  - {id: D08, title: "Front-end framework for web apps", options: "React 19 + Next.js / Angular", recommendation: "React 19 + Next.js + TypeScript"}
  - {id: D09, title: "Mobile approach", options: "Native (SwiftUI/Compose) + KMP / Flutter / React Native", recommendation: "Flutter for white-label speed, native modules for security features"}

risks:
  - {id: R01, risk: "Ledger correctness bug loses or misstates money", impact: Critical, likelihood: Medium, mitigation: "Property-based tests, continuous verification job, hash chain, shadow run in pilot"}
  - {id: R02, risk: "Scope too broad; GA slips", impact: High, likelihood: High, mitigation: "Strict phase gates; cards and wallets first; partner for acquiring and treasury"}
  - {id: R03, risk: "Scheme and PCI certification delays card launch", impact: High, likelihood: Medium, mitigation: "Start certification in Phase 1; sponsor BIN partner"}
  - {id: R04, risk: "No licence to hold funds", impact: High, likelihood: Medium, mitigation: "Launch with licensed partner banks; act as technology provider"}
  - {id: R05, risk: "Distributed SQL misses TPS targets", impact: High, likelihood: Medium, mitigation: "Benchmark early (D03); repository port; sharding by account"}
  - {id: R06, risk: "Shortage of payments and card-processing talent", impact: Medium, likelihood: High, mitigation: "Hire senior domain experts early; scheme consultants"}
  - {id: R07, risk: "Country-specific rules cause rework", impact: Medium, likelihood: High, mitigation: "Country packs as configuration from day one"}
  - {id: R08, risk: "Spec and code drift apart", impact: Medium, likelihood: Medium, mitigation: "Contract-first codegen from generated OpenAPI; CI fails on drift"}
