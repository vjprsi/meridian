decisions:
  - {id: D01, title: "Product name and brand", options: "Meridian Core (placeholder) / other", recommendation: "Meridian Core as platform; two editions", status: Decided, decision: "Platform name Meridian Core; two go-to-market editions off one codebase: Banking Edition and Wallet Edition (user, 2026-11-03)"}
  - {id: D02, title: "Launch market(s) and anchor client type", options: "Neobank / telco wallet / card program", recommendation: "Telco wallet or neobank in one market: exercises ledger, wallets and payments first", status: Decided, decision: "Wallet Edition (telco/mobile-money) is the anchor; demo tenant uses a country-neutral, configurable, English-first starter pack with optional per-country overlay (user, 2026-11-03)"}
  - {id: D03, title: "Ledger database engine", options: "CockroachDB / YugabyteDB / PostgreSQL 18 + Citus / TigerBeetle (as posting kernel)", recommendation: "Benchmark in S07; keep ledger behind a repository port so the engine can change"}
  - {id: D04, title: "Backend language and framework", options: "Java + Spring Boot / Kotlin / Go", recommendation: "Java 25 + Spring Boot 4", status: Decided, decision: "Java 25 LTS + Spring Boot 4 for every service (user decision)"}
  - {id: D05, title: "Primary cloud and first region", options: "AWS / GCP / Azure", recommendation: "AWS first, portability checks in CI"}
  - {id: D06, title: "KYC, bureau, card bureau and sanctions providers for market 1", options: "Per market shortlist", recommendation: "Two providers per capability behind adapters"}
  - {id: D07, title: "Commercial model", options: "Per active account / per transaction / platform fee + usage", recommendation: "Platform fee + per active account + per transaction tiers"}
  - {id: D08, title: "Front-end framework for web apps", options: "React 19 + Next.js / Angular", recommendation: "React 19 + Next.js + TypeScript"}
  - {id: D09, title: "Mobile approach", options: "Native (SwiftUI/Compose) + KMP / Flutter / React Native", recommendation: "Flutter for white-label speed, native modules for security features"}
  - {id: D-ED-01, title: "Editions are deployment profiles, not forks", status: Decided, decision: "One codebase (io.meridian.*). An edition = service-enablement set + feature flags + tenant starter pack + channel/app set + Helm values. Add an `editions` attribute to spec; generator emits per-edition values + ArgoCD ApplicationSet"}
  - {id: D-ED-02, title: "Edition names", status: Decided, decision: "Platform: Meridian Core. Editions: Banking Edition (banks/large fintechs) and Wallet Edition (MNOs/mobile money/small fintechs = mobiquity Pay equivalent). No separate wallet sub-brand for now (Q1)"}
  - {id: D-ED-03, title: "Wallet e-money accounting", status: Decided, decision: "Wallet Edition uses an IND-series system-account template (trust/suspense/income/expense/rewards/churn/unclaimed/interest/tax) mapped onto the existing double-entry ledger; no new ledger engine (D-ED-03)"}
  - {id: D-ED-04, title: "Reuse vs new services for wallet gaps", status: Decided, decision: "Extend existing services to close wallet gaps; new concerns only where genuinely distinct (savings-circle sub-domain; license engine, deferred)"}
  - {id: D-ED-05, title: "Cards & nano-loans in Wallet MVP", status: Decided, decision: "Deferred from the Wallet Edition MVP; shipped as fast-follow add-ons (Q4)"}
  - {id: D-ED-06, title: "Wave 1 feature placement", status: Decided, decision: "Wave 1 designed in docs/WAVE1_IMPLEMENTATION_PLAN.md. WE-PRICE-1 lands in the wallets domain (wallet-service FeeCalculator for fees, commission-service CommissionEngine for commissions), not pricing-rules-service/product (that is a generic DMN engine off the money path). WE-LIMIT-1 compiles two-tier TCP into limits-service LimitEngine rules reusing limit_usage. Order: WE-HIER-1 (domain/category/grade) first, then WE-LIMIT-1/WE-PRICE-1 key off it; WE-FLOAT-1 parallel"}
  # Wave 2 finance/design decisions — full rationale + sources in docs/WALLET_CORE_DECISIONS.md
  - {id: D-ED-07, title: "Unclaimed e-money stays a liability (no capital/income sweep)", status: Decided, decision: "Unclaimed value remains a liability in 2720/IND06 until returned to the owner or lawfully escheated to the regulator; never recognised as issuer income or swept to share capital 3000. IND01->3000 stays reserved for operator capital only. Optional default-off per-tenant escheatment action moves aged unclaimed to gl.escheatment; otherwise it ages in 2720 and is covered by the safeguarding reconciliation (D-ED-12)"}
  - {id: D-ED-08, title: "Auto-rollback of an unredeemed authorisation refunds fee+tax", status: Decided, decision: "On automatic expiry rollback of a never-delivered authorisation/voucher, refund total_debit_amount (principal+fee+tax), not principal only, because the chargeable service was not rendered. Gated refund-fee-on-expiry (default true). Fee is earned only on successful dispense/claim. Manual reversals of completed txns follow the dispute outcome (D-ED-13)"}
  - {id: D-ED-09, title: "Cardless ATM settles suspense->clearing GL (daily), wallet path optional", status: Decided, decision: "Recommended: suspense(2710)->ATM settlement/clearing GL (reserved settlement_ledger_account_id), daily-settled to the acquirer and reconciled (WE-RECON-1). Agent/branch cash-out keeps the settlement float wallet path. Config atm-settlement-mode: CLEARING_GL|WALLET (default WALLET to preserve current behaviour)"}
  - {id: D-ED-10, title: "ETM roll-forward parks unconfirmed amount in a recon suspense; RED auto-opens a repair", status: Decided, decision: "Roll-forward recognises the payment + completes fulfilment but routes the not-yet-confirmed amount through an ETM settlement-suspense GL (a tracked, reconciling balance cleared against the rail settlement file by WE-RECON-1), never a silent write-off; a later confirmed failure clears it via the compensating reversal. A RED/needs-intervention order auto-opens a payment_repair (compensating workflow) in addition to the alert, reusing the existing repair/recall flow (no new approval type). Settled rollback = camt.056 recall; in-flight = cancel; direct refund only for already-captured funds where recall is N/A"}
  - {id: D-ED-11, title: "Commission sharing (CP/CR) posts one commission_earning leg per beneficiary", status: Decided, decision: "CommissionEngine decomposes a shared commission into one commission_earning row per hierarchy beneficiary (Merchant/Agent->Aggregator/Super-agent->Service Provider), each with its share_basis and keyed to the originating txn, payable from the commission wallet on payout; CR legs sum to CP (a partition of the already-charged pool, no new money). Milestone/joining/telescopic earnings use the same per-leg model"}
  - {id: D-ED-12, title: "Safeguarding reconciliation EOD daily A-(B+C+D+E)=0 with typed breaks + shortfall alarm", status: Decided, decision: "Daily EOD reconciliation of trust bank balance A against outstanding e-money liabilities B+C+D+E (customer 2700 + suspense 2710 + unclaimed 2720 + agent/distributor float); target 0 (100% backing). Breaks typed timing (hold/auto-clear) vs amount/missing/duplicate (exception queue: owner, priority, SLA, notes, audit) with ageing; a shortfall (A<liabilities) raises a critical regulator-reportable safeguarding alarm. Reconciliation records immutable/audited"}
  - {id: D-ED-13, title: "Wallet correction + dispute workflow (GSMA-aligned)", status: Decided, decision: "Correction workflow = maker-checker reversal/correction for wrong-recipient / duplicate / fraudulent-erroneous deduction via the existing wallet REVERSAL path; dispute tracker case type RAISED->UNDER_INVESTIGATION->RESOLVED|REJECTED|WITHDRAWN with reason codes, evidence file (txn ids/receipts/counterparty), published SLA timers, repeat-claimant flag. Provider-initiated reversals under a written policy; no bank-style auto-chargeback"}
  - {id: D-ED-14, title: "All Wave 2 wallet-core behaviour additive + per-tenant gated, default=current", status: Decided, decision: "Every Wave 2 item ships behind a per-tenant flag whose default preserves today's behaviour (atm-settlement-mode WALLET, escheatment off), except safe-by-default conduct fixes (refund-fee-on-expiry true). Spec-first; regression gate = existing ITs + journeys; Banking Edition untouched"}

risks:
  - {id: R01, risk: "Ledger correctness bug loses or misstates money", impact: Critical, likelihood: Medium, mitigation: "Property-based tests, continuous verification job, hash chain, shadow run in pilot"}
  - {id: R02, risk: "Scope too broad; GA slips", impact: High, likelihood: High, mitigation: "Strict phase gates; cards and wallets first; partner for acquiring and treasury"}
  - {id: R03, risk: "Scheme and PCI certification delays card launch", impact: High, likelihood: Medium, mitigation: "Start certification in Phase 1; sponsor BIN partner"}
  - {id: R04, risk: "No licence to hold funds", impact: High, likelihood: Medium, mitigation: "Launch with licensed partner banks; act as technology provider"}
  - {id: R05, risk: "Distributed SQL misses TPS targets", impact: High, likelihood: Medium, mitigation: "Benchmark early (D03); repository port; sharding by account"}
  - {id: R06, risk: "Shortage of payments and card-processing talent", impact: Medium, likelihood: High, mitigation: "Hire senior domain experts early; scheme consultants"}
  - {id: R07, risk: "Country-specific rules cause rework", impact: Medium, likelihood: High, mitigation: "Country packs as configuration from day one"}
  - {id: R08, risk: "Spec and code drift apart", impact: Medium, likelihood: Medium, mitigation: "Contract-first codegen from generated OpenAPI; CI fails on drift"}
