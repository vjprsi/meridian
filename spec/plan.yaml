# Roadmap steps, cross-cutting tasks, requirements, decisions and risks.
# Feeds tracker/Meridian_Tracker.xlsx. Status/owner/dates edited in Excel are preserved on regeneration.

steps:
  - {id: S01, phase: 0, name: "Specification foundation", status: Done,
     deliverables: "Conventions, spec format, generator (DDL, OpenAPI, AsyncAPI, data dictionary), Excel tracker, ledger domain as reference spec",
     exit: "python tools/generate.py runs clean; tracker opens in Excel"}
  - {id: S02, phase: 0, name: "Complete domain specifications", status: Done,
     deliverables: "All domains specified: platform, party, product, accounts, payments, wallets, cards, lending, risk, reporting/servicing — every table, column, enum, API and event",
     exit: "Strict validation passes with zero unresolved references; every requirement mapped (no Gap rows)"}
  - {id: S03, phase: 0, name: "Apps and screens catalogue", status: Done,
     deliverables: "All web/mobile apps and screens with the API operations each screen calls",
     exit: "Every screen references existing operation ids"}
  - {id: S04, phase: 0, name: "Monorepo and build scaffold", status: Done,
     deliverables: "Gradle multi-module monorepo, version catalog, shared libs (meridian-common, meridian-events, meridian-test), OpenAPI codegen per service, ArchUnit rules, CI pipeline",
     exit: "All service modules compile from generated interfaces; CI green"}
  - {id: S05, phase: 0, name: "Local developer platform", status: In progress,
     deliverables: "docker-compose: PostgreSQL 18, Kafka + Schema Registry, Temporal, Keycloak, Redis, OpenSearch, Grafana LGTM stack; seed tenant",
     exit: "make up brings the full stack up in under 5 minutes"}
  - {id: S05B, phase: 0, name: "Enterprise gap closure", status: Done,
     deliverables: "New domains: operations (business day/EOD batch, file gateway, search, archive), engagement (rewards, referrals, PFM insights, campaigns/offers, secure inbox), treasury (MM/FX/securities deals, liquidity LCR/NSFR, ALM, FTP)",
     exit: "Strict validation passes; OPS/ENG/TRY requirements traced"}
  - {id: S06, phase: 1, name: "Platform services", status: Done,
     deliverables: "Tenant, identity and access, configuration, audit, reference data, documents, workflow/approvals, webhooks, notifications",
     exit: "A tenant can be provisioned, users log in with SSO+MFA, every change is audited"}
  - {id: S07, phase: 1, name: "Ledger and GL services", status: Done,
     deliverables: "ledger-service, gl-service with property-based tests, hash chain and continuous verification",
     exit: "1,000 TPS sustained in staging; zero unbalanced journals"}
  - {id: S08, phase: 1, name: "Party, onboarding and KYC", status: Done,
     deliverables: "customer-service, onboarding-service, kyc-service with provider adapters",
     exit: "Tier 0 to Tier 3 onboarding works end to end in sandbox"}
  - {id: S09, phase: 1, name: "Product Studio and pricing", status: Done,
     deliverables: "product-catalog-service, pricing/rules engine, WASM scripting runtime, simulation",
     exit: "A deposit and a wallet product can be designed, simulated and published with maker-checker"}
  - {id: S10, phase: 1, name: "Deposits and accounts", status: Done,
     deliverables: "deposit-service: current, savings, term deposits, interest accrual, fees, statements, standing orders",
     exit: "Accounts accrue and capitalise interest correctly against golden test sets"}
  - {id: S10B, phase: 1, name: "Contract hardening", status: Done,
     deliverables: "Generator: json[]/json*/typed arrays, object/MIME/binary responses, query params, request_only/response_only, [public] callbacks; platform, party, product, accounts, ledger, operations specs hardened and service workarounds removed",
     exit: "No wrapped lists, raw-request parsing or 204-with-body hacks in hardened domains; full build green"}
  - {id: S11, phase: 1, name: "Back-office console v1 and developer portal v1", status: In progress,
     deliverables: "Console: customer 360, accounts, ledger explorer, approvals; developer portal with sandbox and keys",
     exit: "Ops can service a customer end to end from the console"}
  - {id: S12, phase: 2, name: "Payments hub", status: Done,
     deliverables: "payment-service, rail adapters (2 launch-market rails), ISO 20022 model, payees, mandates, FX quotes, bulk payments",
     exit: "Instant payment out and in on the launch rail in staging"}
  - {id: S13, phase: 2, name: "Wallets, agents and USSD",
     deliverables: "wallet-service, agent-network-service, commission-service, biller-service, merchant-service, USSD gateway",
     exit: "Cash-in, cash-out, P2P, bill pay and commissions work on USSD and app"}
  - {id: S14, phase: 2, name: "Risk, limits and notifications", status: Done,
     deliverables: "fraud-service (rules), transaction monitoring, sanctions screening, case management, limits service, notification channels",
     exit: "Every payment is screened and scored before release"}
  - {id: S15, phase: 2, name: "Customer and agent apps", status: In progress,
     deliverables: "Customer mobile app (iOS/Android), web banking, agent app with offline mode",
     exit: "Pilot users complete all Flow A, C, E journeys"}
  - {id: S16, phase: 2, name: "Pilot go-live",
     deliverables: "Production cell, runbooks, SOC 2 Type I, regulator sign-off, pilot client live",
     exit: "Gate G2 passed"}
  - {id: S17, phase: 3, name: "Card issuing and processing", status: In progress,
     deliverables: "card-service, authorization-service, clearing, tokenisation, 3DS, disputes, PCI vault, scheme certification",
     exit: "Gate G3: PCI DSS L1 + scheme certification, first live card program"}
  - {id: S18, phase: 3, name: "Lending and collections", status: Done,
     deliverables: "loan-origination-service, loan-service, credit lines, collections-service, collateral, bureau adapters",
     exit: "Loan lifecycle (Flow D) passes golden tests"}
  - {id: S19, phase: 3, name: "Reconciliation, ML fraud, business and merchant channels", status: In progress,
     deliverables: "reconciliation-service, ML fraud scoring, business banking portal, merchant app",
     exit: "Daily reconciliation auto-match rate above 98%"}
  - {id: S20, phase: 4, name: "Multi-region cells and deployment models", status: In progress,
     deliverables: "Active-active regions, cell router, dedicated and self-hosted packaging",
     exit: "Region failover RTO under 5 minutes, RPO 0 in game day"}
  - {id: S21, phase: 4, name: "Regulatory packs, open banking and AI copilots", status: In progress,
     deliverables: "Regulatory reporting packs for 3 countries, open banking APIs, ops/disputes/AML copilots",
     exit: "Reports accepted by regulators in test submissions"}
  - {id: S22, phase: 4, name: "GA hardening and certification",
     deliverables: "SOC 2 Type II, ISO 27001, 10,000 TPS per cell load test, pen test, documentation",
     exit: "Gate G4: general availability"}
  - {id: S23, phase: 2, name: "Wallet Edition (mobiquity-equivalent) packaging and MVP",
     deliverables: "Edition deployment profiles (service set + feature flags + wallet starter pack + channel set + Helm values, one codebase); close MVP wallet gaps G-01..G-10 (e-money system accounts, operator float/O2C, unregistered/voucher flows, two-tier TCP, pricing extensions, configurable domain/category/grade, agent/ATM cash-out, Order&Pay ambiguous settlement, txn correction+dispute tracker, trust/e-money safeguarding reconciliation); wallet demo tenant + 12 live journeys. See docs/EDITIONS_AND_MOBIQUITY_ALIGNMENT.md",
     exit: "Wallet Edition profile boots the wallet service set; demo tenant seeded idempotently from the wallet starter pack; 12 wallet journeys pass live end to end; build green; ledger G1 unchanged"}

tasks:
  - {id: PLT-SPEC-CONVENTIONS, phase: 0, type: Spec, title: "Engineering conventions (docs/CONVENTIONS.md)", priority: P0, est: 1, status: Done}
  - {id: PLT-SPEC-GENERATOR, phase: 0, type: Tooling, title: "Spec generator: DDL, OpenAPI 3.1, AsyncAPI 3, data dictionary", priority: P0, est: 3, status: Done}
  - {id: PLT-SPEC-TRACKER, phase: 0, type: Tooling, title: "Excel tracker generation with preserved manual edits", priority: P0, est: 1, status: Done}
  - {id: PLT-MONOREPO, phase: 0, type: Platform, title: "Gradle monorepo, version catalog, convention plugins", priority: P0, est: 3, status: Done}
  - {id: PLT-LIB-COMMON, phase: 0, type: Platform, title: "meridian-common: Money/BigDecimal, ids (UUIDv7), errors (RFC 9457), tenancy context, idempotency", priority: P0, est: 5, depends: PLT-MONOREPO, status: Done}
  - {id: PLT-LIB-EVENTS, phase: 0, type: Platform, title: "meridian-events: CloudEvents envelope, outbox writer, Kafka publisher/consumer base", priority: P0, est: 4, depends: PLT-MONOREPO, status: Done}
  - {id: PLT-LIB-TEST, phase: 0, type: Platform, title: "meridian-test: Testcontainers fixtures, tenant fixtures, contract test helpers", priority: P0, est: 3, depends: PLT-MONOREPO, status: Done}
  - {id: PLT-CODEGEN, phase: 0, type: Platform, title: "OpenAPI → Spring interfaces/DTO generation per service in Gradle", priority: P0, est: 2, depends: PLT-MONOREPO, status: Done}
  - {id: PLT-CI, phase: 0, type: DevOps, title: "CI: build, test, spec/contract checks, Helm + image smoke; Semgrep (OWASP, Java, secrets), gitleaks, CycloneDX SBOM (Gradle aggregate + npm), Trivy SCA + image scan, cosign keyless signing + SBOM attestation on main, CODEOWNERS, Dependabot (GAP-04 closed in CI; branch protection is a GitHub setting)", priority: P0, est: 4, depends: PLT-MONOREPO, status: Done}
  - {id: PLT-DEV-TOOLS, phase: 0, type: DevOps, title: "Portable toolchain in D:/DevTools:JDK 25, Gradle 9.8, kubectl, Helm, OpenTofu, Temporal CLI, k9s, DBeaver (tools/setup/install-dev-tools.ps1)", priority: P0, est: 1, status: Done}
  - {id: PLT-LOCAL-STACK, phase: 0, type: DevOps, title: "Docker Compose local stack (infra/local): Postgres 18, Kafka, Schema Registry, Kafka console, Valkey, Temporal, Keycloak, OpenSearch, Grafana LGTM, Mailpit, SeaweedFS S3", priority: P0, est: 3, status: Done}
  - {id: PLT-DB-VERIFY, phase: 0, type: Test, title: "Apply all generated DDL to Postgres 18 (tools/db/apply-ddl.sh) + behaviour smoke test: RLS, append-only, optimistic locking, enums, custom fields", priority: P0, est: 1, status: Done}
  - {id: PLT-CUSTOM-FIELDS, phase: 0, type: Spec, title: "custom_field_1..5 on every table and API (writable, filterable) + custom_field_definition per tenant", priority: P0, est: 1, status: Done}
  - {id: PLT-SEED-TENANT, phase: 1, type: Platform, title: "Seed data: demo tenant, legal entity, branch, currencies, calendars, products, users in Keycloak", priority: P1, est: 3}
  - {id: PLT-IAC, phase: 1, type: DevOps, title: "Terraform/OpenTofu cell module: EKS, networking, Postgres, MSK, KMS, observability", priority: P0, est: 10}
  - {id: PLT-GITOPS, phase: 1, type: DevOps, title: "GitOps change management (GAP-05): deploy/ per environment and cell (dev, staging, prod-eu1 primary + standby), digest-pinned images, Argo CD AppProjects (RBAC, sync windows) + ApplicationSets (dev/staging auto-sync, prod manual), promote.yml (dev pin after green main CI, staging/prod promotion PRs with the same digests, rollback mode) gated by cosign signature + SBOM attestation + Trivy + render/kubeconform/Kyverno, generated change records (tools/release.py), deploy-check.yml (provenance, 2 prod approvals), Kyverno admission policies, CODEOWNERS deploy/prod; open outside the repo: GitHub environments / ruleset / promotion app, Argo CD + Kyverno install (PLT-IAC)", priority: P1, est: 5, depends: PLT-IAC, status: Done}
  - {id: PLT-ROLLOUTS, phase: 2, type: DevOps, title: "Argo Rollouts canary per cell (analysis on SLO burn-rate metrics, automatic abort) on top of PLT-GITOPS", priority: P2, est: 3, depends: PLT-GITOPS}
  - {id: PLT-GATEWAY, phase: 1, type: Platform, title: "API gateway (Envoy/Kong): OAuth2, rate limits, idempotency, mTLS", priority: P0, est: 5}
  - {id: PLT-OBSERVABILITY, phase: 1, type: Platform, title: "Prometheus registry + histograms on every service, business SLIs, Grafana dashboards, multi-window burn-rate and saturation alerts (infra/observability, Helm PrometheusRule) done; open: OpenTelemetry collector / Prometheus / Alertmanager deployment and paging routes (PLT-IAC), Keycloak realm metrics-listener", priority: P1, est: 4, status: In progress}
  - {id: PLT-DATA-LAKE, phase: 2, type: Data, title: "Debezium → Kafka → Iceberg lakehouse, dbt canonical model", priority: P1, est: 10}
  - {id: PLT-DESIGN-SYSTEM, phase: 1, type: Web/Mobile, title: "Design system: tokens, React components, theming, dark mode, WCAG 2.2 AA", priority: P0, est: 10}
  - {id: PLT-SDKS, phase: 2, type: API, title: "Generated SDKs: TypeScript, Python, Java, Go, C#, Swift, Kotlin + CLI", priority: P1, est: 8}
  - {id: PLT-SANDBOX, phase: 1, type: API, title: "Sandbox with test clocks and scheme/rail simulators", priority: P1, est: 10}
  - {id: PLT-MCP, phase: 3, type: API, title: "MCP server over sandbox and read APIs for AI agents", priority: P2, est: 4}

  - {id: PLT-CRUD-ENGINE, phase: 0, type: Platform, title: "Generic tenant-scoped CRUD engine (json_populate_record/row_to_json) wired into generated API default methods via custom methodBody template; ETag/If-Match, idempotency, keyset paging", priority: P0, est: 4, status: Done}
  - {id: PLT-TEST-RLS, phase: 0, type: Test, title: "Integration tests connect as meridian_app (RLS enforced) with Testcontainers Postgres 18 + Kafka", priority: P0, est: 1, status: Done}
  - {id: LED-HOLD-EXPIRY, phase: 1, domain: ledger, service: ledger-service, type: Service, title: "Hold expiry job: release holds past expires_at (system job needs cross-tenant ops role)", priority: P1, est: 2, status: Done}
  - {id: LED-VERIFY, phase: 1, domain: ledger, service: ledger-service, type: Service, title: "Ledger verification: recompute balances from entries, seal hash chain per ledger, report", priority: P1, est: 3, status: Done}
  - {id: LED-EOD-SNAPSHOT, phase: 1, domain: ledger, service: ledger-service, type: Service, title: "End-of-day balance snapshots (driven by business-day-service EOD run)", priority: P1, est: 2, status: Done}
  - {id: LED-PERF, phase: 1, domain: ledger, service: ledger-service, type: Test, title: "Load test: 1,000 TPS sustained posting (gate G1), k6/Gatling scenario", priority: P0, est: 3, status: Done}
  - {id: PLT-EDGE-GATEWAY, phase: 0, type: Platform, title: "Edge gateway (platform/edge-gateway): 2,480 spec-generated routes, streaming proxy, 404/405/503/504 problem+json, /openapi.yaml", priority: P0, est: 2, status: Done}
  - {id: PLT-DEV-LAUNCHER, phase: 1, type: DevOps, title: "Dev launcher: start/stop any set of services + gateway locally with health checks", priority: P1, est: 2, status: Done}
  - {id: PLT-AUTHZ-SCOPES, phase: 1, type: Security, title: "Per-operation OAuth2 scopes generated from spec (@RequiredScope) enforced by ScopeInterceptor; domain wildcard and meridian:admin", priority: P0, est: 1, status: Done}
  - {id: PLT-KEYCLOAK-REALM, phase: 1, type: Security, title: "Keycloak realm generated from spec (49 scopes, console PKCE client, service and read-only clients, tenant claim) imported by local stack; JWT mode verified live", priority: P0, est: 1, status: Done}
  - {id: PLT-MULTI-TENANT-USERS, phase: 1, type: Security, title: "Per-user tenant claim from identity-service (replace hardcoded demo-tenant claim); token exchange for platform operators", priority: P1, est: 3}

# Services whose business logic is implemented and covered by integration tests (all their build tasks Done).  - {id: WEB-CONSOLE-FOUNDATION, phase: 1, type: Web/Mobile, title: "Console foundation: Next.js 16 + React 19 + Tailwind 4, typed API client generated from OpenAPI (190k lines of types), OIDC PKCE + dev auth, design tokens (light/dark), problem+json error banner", priority: P0, est: 4, status: Done}
  - {id: WEB-CONSOLE-E2E, phase: 1, type: Test, title: "Playwright E2E of console against live services: ledger, accounts, posting, customer, approvals, products, audit", priority: P1, est: 2, status: Done}
  - {id: PLT-S2S-AUTH, phase: 1, type: Security, title: "Service-to-service auth: client-credentials tokens with meridian:internal scope, tenant delegation via X-Tenant-Id only for internal tokens; verified live in JWT mode", priority: P0, est: 2, status: Done}
  - {id: PLT-CLOCKS, phase: 1, type: Platform, title: "Clocks.now(): persisted timestamps at PostgreSQL microsecond precision (fixes effective-date races)", priority: P0, est: 1, status: Done}
  - {id: PLT-EOD-PACK, phase: 1, type: Platform, title: "Standard EOD job pack (53 domain jobs in banking order) + cross-tenant EOD sweeps with trigger policies (G8)", priority: P0, est: 4, status: Done}
  - {id: PLT-APPROVALS-LIB, phase: 1, type: Platform, title: "libs/meridian-approvals: central maker-checker through workflow-service inbox (G11)", priority: P0, est: 2, status: Done}
  - {id: PLT-APPROVALS-ROLLOUT, phase: 1, type: Platform, title: "Route every service's four-eyes flows through central approvals (G11 rollout)", priority: P0, est: 5, status: Done}
  - {id: PLT-STARTER-PACKS, phase: 1, type: Platform, title: "Tenant starter packs (generic + KE): ledger chart and routing, products, fees, tier limits, limit rules, commissions, notifications, EOD pack, approval policies; idempotent, resumable, maker-checker respected", priority: P0, est: 4, status: Done}
  - {id: PLT-SEARCH-FEED, phase: 1, type: Platform, title: "Search indexing feed from domain events (97 event types, 17 kinds, PII-safe, tenant-isolated)", priority: P0, est: 3, status: Done}
  - {id: PLT-TENANT-LEDGER-SETTINGS, phase: 1, type: Platform, title: "Per-tenant ledger routing in all services (config-service namespace ledger); no placeholder accounts; 422 when missing", priority: P0, est: 3, status: Done}
  - {id: PLT-BUSINESS-DATES, phase: 1, type: Platform, title: "Business date from business-day-service (BusinessDates) instead of UTC today; payment and deposit adopted", priority: P1, est: 1, status: In progress}
  - {id: PLT-E2E-JOURNEYS, phase: 1, type: Quality, title: "Live end-to-end journeys through the gateway (setup + 7 business journeys)", priority: P0, est: 3, status: Done}
  - {id: SEC-REVIEW-2026-10, phase: 2, type: Security, title: "OWASP API Top 10 + banking security review (docs/SECURITY_REVIEW.md): 40 findings (2 Critical, 10 High, 16 Medium, 12 Low)", priority: P0, est: 1, status: Done}
  - {id: SEC-FIX-CRITICAL, phase: 2, type: Security, title: "Fix SEC-01/02 (committed vault key and signing secrets: fail-fast, KeyProvider, Helm secrets), SEC-08/09 (SSRF outbound URL policy), SEC-10 (OTP not persisted), SEC-11 (vault reveal scopes + step-up)", priority: P0, est: 3, status: Done}
  - {id: SEC-FIX-MONEY, phase: 2, type: Security, title: "Fix SEC-03..07, SEC-12 (approval payload trust, FX quote binding, concurrent reversals/returns/refunds, ledger account PATCH bypass)", priority: P0, est: 3, status: Done}
  - {id: SEC-FIX-MEDIUM, phase: 2, type: Security, title: "Fix Medium/Low findings SEC-13..SEC-40 (dev-mode default, audience checks, operator role split, X-Forwarded-For trust, callback replay protection, idempotency scoping, ...)", priority: P1, est: 5, status: Done}
  - {id: CHN-CUSTOMER-BFF, phase: 2, type: Security, title: "Customer channel BFF (/v1/me) with object-level authorization, customer identity, step-up", priority: P0, est: 4, status: Done}
  - {id: CHN-CUSTOMER-SIGNUP, phase: 2, type: Feature, title: "customer-web sign-up on the public applicant surface (/v1/onboarding/public/applications)", priority: P1, est: 2, status: Done}
  - {id: CHN-CUSTOMER-MFA, phase: 2, type: Security, title: "Customer MFA/passkeys and Keycloak acr step-up levels (acr 1 password, acr 2 WebAuthn/passkey/TOTP; RFC 9470 challenges, per-operation policy, amr); customer sessions (sid registry, sign out one/everywhere, Keycloak admin client) and new-device alerts; seeded public RETAIL_ONLINE journey in starter packs", priority: P1, est: 3, status: Done}
  - {id: CHN-CUSTOMER-MFA-2, phase: 2, type: Security, title: "Customer MFA follow-ups: first-factor enrolment bound to a verified phone or cooling-off after a new factor, SMS OTP factor, recovery codes, alerts on factor changes (Keycloak events), passwordless passkey first factor; applicant decision follow-up after submit", priority: P2, est: 3}
  - {id: CHN-AGENT-BFF, phase: 2, type: Security, title: "Agent channel BFF: agent identity, outlet/till/float scoping, device signing keys for offline batches", priority: P1, est: 4, status: Done}
  - {id: REG-PACKS-KE-NG-GB, phase: 4, type: Regulatory, title: "Regulatory packs KE_CBK, NG_CBN, GB_PRA (21 reports: capital, liquidity, large exposures, FS, CTR/STR, complaints, agent/mobile money) with install/upgrade, GL mapping overrides, calendars; layouts illustrative pending regulator taxonomy validation", priority: P1, est: 6, status: Done}
  - {id: REG-PACKS-CERTIFY, phase: 4, type: Regulatory, title: "Validate pack layouts against current regulator taxonomies (CBK, CBN, PRA/BoE XBRL), test submissions; connected-client grouping; pre-aggregated sources for large books", priority: P1, est: 8}
  - {id: PERF-G1-RERUN, phase: 2, type: Quality, title: "Ledger G1 load test re-run after security hardening: 1,792 postings/s, no regression", priority: P1, est: 1, status: Done}
  - {id: CHN-BUSINESS-BFF, phase: 3, type: Feature, title: "Business channel (/v1/business, 94 ops): business users/roles/entitlements, approval matrix, multi-level payment release, bulk/payroll, FX, mandates, collections, employee cards, loans, exports, business API keys/webhooks; web/business-portal", priority: P1, est: 8, status: Done}
  - {id: CHN-BUSINESS-FOLLOWUPS, phase: 3, type: Feature, title: "Business channel follow-ups: staff provisioning of business admins, M2M business API access, webhook events without customer_id, approval matrix for repay/draw/mandates, business-date daily limits, KYB via channel", priority: P2, est: 5, status: Done}
  - {id: CHN-BUSINESS-REMAINING, phase: 3, type: Feature, title: "Business remaining: payroll SALA category purpose, virtual-account credit events, IdP automation for business M2M clients, typed responses for approval-wrapped operations", priority: P3, est: 2}
  - {id: CHN-MERCHANT-BFF, phase: 3, type: Feature, title: "Merchant channel (/v1/merchant, 62 ops): owner/manager/cashier roles with store scoping, QR sales, payment links, four-eyes refunds with cumulative cap, settlements/fees, payout-account change approval, staff, API keys/webhooks; web/merchant-app PWA", priority: P1, est: 6, status: Done}
  - {id: CHN-MERCHANT-FOLLOWUPS, phase: 3, type: Feature, title: "Merchant follow-ups: merchant disputes, store on wallet transactions, server-side paging, bank checker visibility of merchant refunds, bank review of payout changes, push sale status", priority: P2, est: 4}
  - {id: MR-CELLS-ROUTER, phase: 4, type: Platform, title: "Multi-region: cell registry + placement + standby, four-eyes tenant move workflow, platform/cell-router (JWT tenant routing, failover, frozen-tenant 503), OpenTofu region module (Aurora Global, MSK Replicator, S3 CRR, Route 53), router Helm chart, docs/MULTI_REGION.md", priority: P1, est: 8, status: Done}
  - {id: MR-GAME-DAY, phase: 4, type: Platform, title: "Game day readiness (engineering): per-tenant data mover (platform/data-mover, data-lifecycle move API, RLS extract + idempotent import, S3 prefix copy, row-count + SHA-256 verification, confirm-copy; TenantMoverIT), fault injection (tools/gameday/faults.py + AWS FIS templates, expected alerts), RPO probe tenant, RTO dashboard + alerts, standby promotion without restart (CellRole / StandbyGate, registry watcher, ops endpoint), outbox replay retention (published_at, replay by original ce_id, purge); MSK SASL/IAM in charts and router Keycloak client (earlier)", priority: P1, est: 10, status: Done}
  - {id: MR-GAME-DAY-RUN, phase: 4, type: Platform, title: "Run the regional game day on a staging region pair and record RTO/RPO; control-plane DR (tenant-service + workflow-service region pair, fast break-glass channel); reverse MSK Replicator; CDE-scoped data mover; replay hardening (collections delinquency, notification dedupe index, fraud features, router cell rows); cross-region ledger benchmark", priority: P1, est: 8, depends: MR-GAME-DAY}
  - {id: FRAUD-ML, phase: 3, type: Feature, title: "ML fraud scoring: Kafka-fed feature store, pure-Java LR + GBDT (XGBoost/LightGBM dumps) with Saabas contributions, champion/challenger/shadow via ai-platform, fallback to rules, PSI monitoring, label feedback; p99 < 0.02 ms inference", priority: P1, est: 6, status: Done}
  - {id: FRAUD-PAYMENTS, phase: 2, type: Security, title: "Score every payment with fraud-service before release (payment-service had sanctions + limits but no fraud call)", priority: P0, est: 2, status: Done}
  - {id: FRAUD-FOLLOWUPS, phase: 2, type: Security, title: "Fraud follow-ups: auto-rescore degraded holds, no double scoring of wallet payouts, pseudonymise raw identifiers (keyed HMAC per tenant) + migration", priority: P1, est: 2, status: Done}
