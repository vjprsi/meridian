  # Wave 2 — transactions (MVP)
  - {id: WE-TXN-1, phase: 2, domain: wallets, service: wallet-service, type: Feature, title: "Unregistered/voucher flows (G-03, MQ-FIN-4/14/17): wallet_voucher holds value in e-money suspense (2710) against an MSISDN under a hashed one-time passcode (PBKDF2, never plaintext). Three send flows (cash-in-others, P2P on-the-fly, transfer-between-unregistered) issue via the engine priced/limited/TCP'd as the equivalent registered CASH_IN/P2P with suspense as counterparty; claim-by-registration posts VOUCHER_CLAIM suspense->new wallet; gated per-tenant rollback scheduler posts VOUCHER_ROLLBACK suspense->sender on expiry (or leaves to age to unclaimed per config). Additive spec (table/enums/apis/events); gl.suspense wired via wallet starter pack. No new approval resource type (issuance=normal txn, claim=auto on registration, rollback=automatic/idempotent). WE-TXN-2 agent cash-out reuses the claim entry point + ISSUED status seam. Unit tests green (VoucherPolicy 7); existing cash-in/P2P/pricing unit tests green; 7 Docker ITs compile but not run (no Docker). Deferred: claim-at-expiry-instant vs rollback race hardening (intermediate status), UNCLAIMED rollback relies on WE-FLOAT-1 settlement run", priority: P0, est: 5, status: Done}
  - {id: WE-TXN-2, phase: 2, domain: wallets, service: wallet-service, type: Feature, title: "Agent passcode cash-out, ATM OTP cash-out with auto-rollback, authorisation codes (cardless/pre-authorised) (G-07): wallet_cashout_authorisation holds value in e-money suspense (2710, reusing WE-TXN-1 routing) against a hashed one-time code (PBKDF2, never plaintext). Three mechanisms (AGENT_PASSCODE/ATM_OTP/AUTH_CODE) all issue a CASH_OUT hold leg via the engine priced/limited/TCP'd as a registered cash-out with suspense as counterparty; redeem posts CASHOUT_SETTLE suspense->agent-float/ATM-settlement-wallet/payee once the code verifies; gated per-tenant auto-rollback scheduler posts CASHOUT_ROLLBACK suspense->customer on expiry (chiefly unredeemed ATM OTPs). Reuses WE-TXN-1 claim/ISSUED seam + CashoutAuthPolicy mirrors VoucherPolicy. Additive spec (table/enums CashoutAuthType+CashoutAuthStatus+2 WalletTxnType/apis/events); no new approval resource type (issuance=normal txn, redeem/rollback automatic/idempotent). Unit tests green (CashoutAuthPolicy 7); wallet-service compiles. DEFERRED: controller hand-written as plain @RestController (not the generated *Api) so the module compiles pre-regen - host regenerates contract from spec then it can implement WalletCashoutAuthorisationsApi; Docker ITs not written/run (no Docker); ATM GL->GL dispense (suspense->bank-clearing) deferred - MVP settles ATM OTP to a settlement float WALLET (settlement_ledger_account_id column reserved); partial capture of an auth code deferred (full-amount capture); redeem-at-expiry-instant vs auto-rollback-scheduler race hardening deferred (needs an intermediate REDEEMING status locked before the settle posting; same open item as WE-TXN-1). FINANCE: confirm ATM dispense should settle to bank-clearing GL vs a settlement float wallet, and whether hold-leg fee/tax should be refunded on auto-rollback (currently retained, mirroring WE-TXN-1)", priority: P0, est: 4, status: Done}
  - {id: WE-ETM-1, phase: 2, domain: payments, service: payment-service, type: Feature, title: "Order & Pay (ETM) state segregation (order/payment/fulfilment) + ambiguous-case settlement (retry/rollback/roll-forward, PG heartbeat) + green/yellow/red alerts (G-08): payment_order holds the order (what is bought), the payment (money movement in the existing payment table) and the fulfilment (delivery) as SEPARATE lifecycle states (OrderStatus + FulfilmentStatus), so paid-but-not-fulfilled / fulfilled-but-not-paid / both-done are representable. Payment leg created via PaymentProcessor.initiate and reversed via the existing ReturnService.recall (settled) / PaymentProcessor.cancel (in-flight) paths - no parallel money engine. Ambiguous PG outcomes resolved deterministically by pure OrderSettlementPolicy: effective (stale-adjusted) PG heartbeat + fulfilment-deadline + retry budget -> RETRY (live gateway, retries left) / WAIT (dead gateway, pre-deadline) / ROLL_FORWARD (deadline or retries exhausted + fulfilment started: treat as settled, complete fulfilment) / ROLLBACK (deadline or retries exhausted, nothing delivered: reverse+cancel) - so a forced fulfilment timeout auto-resolves rather than sticking. GREEN/YELLOW/RED alert derived + alert_changed events on transition. Gated per tenant (meridian.payment.etm.enabled default OFF = current behaviour) with a gated idempotent per-tenant AmbiguousSettlementResolver scheduler (mirrors FraudRescoreJob; tenant discovery via idempotency_key) also exposed at POST /v1/payment-orders/resolve-ambiguous. Idempotency: create keyed on idempotency_key; resolver re-checks ambiguous flag under row lock, deterministic decision, deterministic reversal keys (recall/cancel self-idempotent) so overlapping passes never double-post. Additive spec (5 enums OrderStatus/FulfilmentStatus/OrderSettlementAction/OrderAlertLevel/PgHeartbeatStatus; tables payment_order + payment_order_event; resource payment-orders; 10 events). Unit tests green (OrderSettlementPolicyTest 13); payment-service compiles. DEFERRED: controller hand-written as plain @RestController (not generated PaymentOrdersApi) so module compiles pre-regen - host regenerates contract then it can implement PaymentOrdersApi + the CRUD list/get served by the generated controller (a convenience get + events listing are hand-provided meanwhile), no behaviour change; settled-payment rollback currently INITIATES the reversal via camt.056 recall (counterparty-async) rather than a synchronous ledger reversal - full synchronous reversal deferred; redeem/resolve-at-expiry-instant vs resolver race hardening deferred (needs an intermediate RESOLVING status locked before the reversal posting; same open item as WE-TXN-1/2); Docker ITs not written/run (no Docker). FINANCE/design: confirm (a) roll-forward's accounting when the payment in fact never settled (treats as settled - residual exposure to the merchant), (b) whether a RED/needs-intervention order should auto-open a payment_repair item vs only surface the alert (MVP only alerts), (c) whether rollback of a settled order payment should be a recall or a direct refund/return posting", priority: P0, est: 5, status: Done}
  - {id: WE-OPS-1, phase: 2, domain: risk, service: case-management-service, type: Feature, title: "Wallet transaction-correction workflow + dispute tracker for non-card wallet transactions (G-09, D-ED-13): EXTENDS case-management-service (no parallel case engine). (1) Maker-checker wallet_txn_correction reverses a specific non-card wallet transaction for a GSMA reason (WRONG_RECIPIENT/DUPLICATE/FRAUDULENT/ERRONEOUS_AMOUNT/OTHER): create=maker request, approve=checker (four-eyes, different user), which executes ONCE through the existing wallet-service reversal path (POST /v1/wallet-transactions/{id}/reverse via a thin WalletReversalPort/WalletReversalClient on ServiceClient - case-management never posts ledger entries) and links the resulting REVERSAL txn id. Reuses the platform approval mechanism exactly like the disposition maker-checker (Approvals + CorrectionApprovalHandler mirrors DispositionApprovalHandler). Idempotent: deterministic idempotency_key per correction; execution re-checks status + existing reversal id under row lock (DisputeRules.canExecute) so retries/re-delivered approvals never double-reverse. (2) Dispute tracker wallet_dispute (RAISED->UNDER_INVESTIGATION->RESOLVED|REJECTED|WITHDRAWN) with GSMA reason code, evidence file (wallet_dispute_evidence: transaction ids/receipts/counterparty/notes), published SLA timers (raised_at, due_at from per-tenant SLA hours, sla_breached), and a repeat-claimant flag (claimant disputes in a rolling window over a configurable threshold). Resolution triggers a correction (reuse of capability 1) or closes NO_ACTION; provider-initiated, no bank-style auto-chargeback. Pure lifecycle/reason/SLA/repeat-claimant/correction-guard rules in domain/DisputeRules.java (NO DB, unit-tested). Additive + per-tenant gated (meridian.casemanagement.dispute.enabled default OFF = current behaviour preserved, D-ED-14). Spec-first: 5 enums (WalletCorrectionReason/WalletDisputeStatus/WalletDisputeEvidenceType/WalletDisputeResolutionType/WalletCorrectionStatus), 3 tables (wallet_dispute + wallet_dispute_evidence + wallet_txn_correction), 2 resources (wallet-disputes + wallet-txn-corrections), 12 events. Unit tests green (DisputeRulesTest 8); case-management-service compiles. DEFERRED: controllers hand-written as plain @RestController (not the generated WalletDisputesApi/WalletTxnCorrectionsApi) so the module compiles pre-regen - host regenerates contract from spec then they can implement the generated *Api + CRUD list/get/update served by the generated controller (create + actions hand-provided meanwhile, no behaviour change); live wallet-service reverse call goes through the documented WalletReversalPort seam but is NOT integration-wired (no Docker/ITs run); correction FAILED status + async retry path reserved (approve executes synchronously in one tx; on reverse error the tx rolls back to PENDING_APPROVAL, retryable) - canExecute already allows execute from FAILED; dispute SLA-breach sweep exposed as DisputeService.markSlaBreached (idempotent, forward-only) but NO scheduler wired (host can add a gated per-tenant job mirroring FraudRescoreJob). FINANCE/design: confirm (a) per-tenant SLA default (120h/5d) and repeat-claimant threshold (3)/window (30d), (b) whether a partial-amount correction needs its own reason vs reusing the dispute reason, (c) whether a repeat-claimant flag should auto-open an AML/fraud aml_case referral vs only surface for manual review (MVP only flags + emits repeat_claimant_flagged)", priority: P0, est: 4, status: Done}
  - {id: WE-RECON-1, phase: 2, domain: operations, service: reconciliation-service, type: Feature, title: "Trust / e-money safeguarding EOD reconciliation A-(B+C+D+E) + mismatch alarm (G-10): every business day proves the trust/safeguarding bank balance A fully backs the outstanding e-money liabilities B(wallet 2700/IND04)+C(suspense 2710/IND02)+D(unclaimed 2720/IND06)+E(agent float) - the regulatory 100%-backing check (Kenya daily, MAS PSA, FCA CASS 15). Pure SafeguardingPolicy in domain/ (no DB deps) computes A-(B+C+D+E) and classifies: |result|<=tolerance=BALANCED (100%+ backed); result<-tolerance=SHORTFALL (CRITICAL regulator-reportable alarm event + high-priority break); small positive surplus within timing band=held TIMING break (auto-clears next cycle); surplus beyond band or a surplus that didn't clear from a prior cycle=persistent AMOUNT break escalated to the existing recon_exception queue with ageing (same 0-1/2-7/8-30/31+ buckets). The per-tenant liability component set is configurable (recon_safeguarding_config.liability_components) with B..E as Wallet-Edition defaults. SafeguardingService mirrors EodService: immutable/audited recon_safeguarding_run snapshot (A,B,C,D,E, result, status, as-of date, source refs), idempotent per (tenant,config,business_date) with forward-only status (re-run returns/advances the same record, write-once snapshot), opens/refreshes a high-priority break in the EXISTING exception queue+lifecycle (no new maker-checker type) via new reasons SAFEGUARDING_SHORTFALL/SURPLUS, emits ledger.recon_safeguarding.completed + .shortfall. A..E sourced live from gl-service by GL code via new thin GlBalanceGateway (following LedgerGateway/ServiceClient; A also from a trust recon source's statement closing balance), OR accepted as component figures on the POST /run request as a documented fallback/override so the feature is testable and the integration point explicit. Additive + per-tenant GATED: safeguarding only runs for tenants with an active recon_safeguarding_config, hooked best-effort into the existing EOD trigger (business-day-service RECON_DAILY -> POST /eod) so default behaviour is unchanged. Implements D-ED-12 (this recon) and D-ED-07 (unclaimed 2720 stays a LIABILITY, a backing component, never income/capital). Additive spec (2 enums SafeguardingStatus+SafeguardingComponentRole, 2 reasons added to ReconExceptionReason, 2 tables recon_safeguarding_config+recon_safeguarding_run, 2 cols added to recon_exception + recon_run_id relaxed to nullable, 2 resources safeguarding-configs+safeguarding-runs w/ POST /run, 2 events). Unit tests green (SafeguardingPolicyTest 11/11); reconciliation-service compiles. DEFERRED: controllers hand-written as plain @RestController (SafeguardingRunsController) not the generated *Api so the module compiles pre-regen - host regenerates contract from spec then it can implement SafeguardingRunsApi + the CRUD list/get for safeguarding-configs/runs served by the generated controller (a convenience get + the /run action are hand-provided meanwhile), no behaviour change; recon_exception.recon_run_id relaxed nn->nullable needs the host migration to ALTER COLUMN DROP NOT NULL on regen; live gl-service balance read (GET /v1/gl/accounts?code -> GET /v1/gl/balances) not integration-tested (no Docker) - request-figure fallback is the tested path; Docker ITs not written/run (no Docker); multi-currency safeguarding (per-currency A..E sets) deferred - MVP sums within one configured currency; no scheduled bean added (reuses the external business-day-service EOD trigger) so no @ConditionalOnProperty gate - gating is presence of an active config. FINANCE/design: confirm (a) a within-tolerance NEGATIVE is de-minimis BALANCED not a micro-shortfall (current: -tolerance<=diff treated as backed), (b) whether a transient negative attributable to a known in-flight funding credit should be a TIMING break rather than always a CRITICAL shortfall (current: any negative beyond tolerance always alarms, conservative regulatory reading), (c) whether a persistent positive surplus (own money sitting in the trust account) should auto-open a sweep/adjustment vs only an AMOUNT break (MVP only breaks), (d) exact per-jurisdiction tolerance + timing-band values (currently per-tenant config, default 0)", priority: P0, est: 3, status: Done}
  - {id: WE-FIN-1, phase: 2, domain: wallets, service: wallet-service, type: Feature, title: "Wire the Wave 2 finance decisions D-ED-08/09/10 (docs/WALLET_CORE_DECISIONS.md), all additive + per-tenant gated (D-ED-14). D-ED-08 (fee-refund-on-expiry, default TRUE): an auto expiry rollback of a never-redeemed cash-out authorisation (CashoutAuthorisationService.rollback) AND a never-claimed voucher returned to the sender (VoucherService.rollback) now refund the FULL total_debit_amount (principal + fee + tax), not principal only, because the chargeable service was never rendered. Principal stays suspense->customer/sender (CASHOUT_ROLLBACK / VOUCHER_ROLLBACK); the fee and tax are refunded by symmetrically reversing the hold/send-leg income legs - DEBIT gl.fee-income -> CREDIT customer/sender (CASHOUT_FEE_REFUND / VOUCHER_FEE_REFUND, key -fee-refund) and DEBIT gl.tax-payable -> CREDIT customer/sender (-tax-refund) - each a keyed zero-fee SYSTEM engine movement, so no suspense over-draw and no double refund on retry. Pure guard CashoutAuthPolicy/VoucherPolicy.refundFeeOnExpiry(enabled,status) (fee refunded only while ISSUED). D-ED-09 (atm-settlement-mode, default WALLET = unchanged): a cardless ATM OTP redeem in CLEARING_GL mode settles GL->GL (one journal entry DEBIT suspense 2710 / CREDIT gl.atm-clearing, key coa-<id>-settle) instead of to a settlement float wallet; the clearing GL is reserved on settlement_ledger_account_id at issue and the journal entry recorded on new settlement_journal_entry_id (no wallet_transaction, so redeem_transaction_id stays null); agent passcode / auth code always wallet-settled. Pure CashoutAuthPolicy.atmSettlesToClearingGl. D-ED-10 (ETM): on ROLL_FORWARD of a never-positively-confirmed payment, the not-yet-confirmed amount is recorded on new payment_order.settlement_suspense_amount + a SUSPENSE_PARKED settlement event naming the etm.settlement-suspense GL (gated etm.roll-forward-suspense, default true; OBSERVATIONAL - no money engine invented, the actual suspense GL leg is a documented host wiring note since OrderService posts all money via PaymentProcessor, never a GL leg directly); and a transition of the health alert into RED auto-opens a payment_repair via RepairService.autoOpenForOrder (gated etm.auto-open-repair, default true; idempotent - at most one OPEN/IN_REPAIR per order payment; order-level tracker, does NOT move the payment to IN_REPAIR). Pure OrderSettlementPolicy.parkRollForwardSuspense + autoOpenRepair. Spec-first: added wallet_cashout_authorisation.settlement_journal_entry_id + re-scoped settlement_ledger_account_id; payment_order.settlement_suspense_amount; config flags in WalletProperties (gl.atm-clearing, cashout-auth.refund-fee-on-expiry/atm-settlement-mode, voucher.refund-fee-on-expiry) + PaymentProperties.Etm (settlement-suspense GL, roll-forward-suspense, auto-open-repair) + application.yml docs. Unit tests green (CashoutAuthPolicyTest +2, VoucherPolicyTest +1, OrderSettlementPolicyTest +2); both modules compile. D-ED-07 (unclaimed stays a liability) + D-ED-11 (commission one earning leg per beneficiary) VERIFIED already satisfied - no behaviour change. DEFERRED/host: GL->GL ATM settlement uses ledger-service directly (no wallet_transaction row) by design; ETM roll-forward suspense GL posting is a wiring note (field+event only) for the host to post against etm.settlement-suspense; regen needed for the 3 new spec columns + enum/openapi; Docker ITs not run (no Docker)", priority: P0, est: 2, depends: "WE-TXN-1, WE-TXN-2, WE-ETM-1", status: Done}
  - {id: WE-FIN-2, phase: 2, domain: wallets, service: agent-network-service, type: Feature, title: "Align the unclaimed-settlement sweep with D-ED-07 (docs/WALLET_CORE_DECISIONS.md), additive + safe. Unclaimed e-money (2720 / IND06) is a customer liability and must never become issuer income or share capital; the only lawful exit (besides return to the owner) is escheatment to the regulator/state. Added an ESCHEATMENT settle_to target that credits a new e-money due-to-regulator liability GL (gl.escheatment / 2760) and made it the DEFAULT when settle_to is null/blank (replacing the former CAPITAL default), so the compliant behaviour is default and backed by a seeded account. CAPITAL (IND01) and INCOME (IND03) remain explicit, operator-selected (now conscious non-default) options - existing runs passing settle_to: CAPITAL/INCOME behave exactly as before. Pure StockRules.finalStage/finalAccount extended (ESCHEATMENT -> UNCLAIMED_TO_ESCHEATMENT / Account.ESCHEATMENT as the default branch); UnclaimedSettlementService validation accepts ESCHEATMENT + defaults to it, stages() routes the final leg via a switch on finalAccount (ESCHEATMENT->gl.escheatment, INCOME->gl.income, CAPITAL->gl.capital), reusing the existing account()/postJournal pattern - no new money path. Maker-checker + deterministic idempotency keys unchanged. Config: AgentNetworkProperties.Gl gains escheatment + the gl.escheatment per-tenant binding (config-service namespace ledger). Spec-first: wallets.yaml unclaimed_settlement_run.settle_to default=ESCHEATMENT + description and /plan doc updated. Starter pack wallet-2026.11.0 seeds ledger account 2760 'E-money due to regulator (escheatment)' (LIABILITY, CREDIT) and wires gl.escheatment to it. Unit tests green (StockRulesTest finalStage/finalAccount cover default->ESCHEATMENT, explicit ESCHEATMENT, CAPITAL, INCOME); agent-network-service + tenant-service compile. DEFERRED/host: regen needed for the settle_to default change (DB default 'CAPITAL' -> 'ESCHEATMENT' in generated schema; runtime unaffected since the service always sets settle_to explicitly); escheatment account id not persisted on the run row (no column; recorded per-line on target_ledger_account_id); Docker ITs not run (no Docker)", priority: P0, est: 1, depends: "WE-FLOAT-1", status: Done}
