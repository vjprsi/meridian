requirements:
  LED-01: {module: Ledger, priority: M, text: "Immutable, append-only double-entry journal; every posting balances per currency and legal entity"}
  LED-02: {module: Ledger, priority: M, text: "Real-time balances: ledger, available, pending, reserved, overdraft limit; read under 10 ms"}
  LED-03: {module: Ledger, priority: M, text: "Multi-currency accounts and postings with FX rate snapshot per entry"}
  LED-04: {module: Ledger, priority: M, text: "Holds and authorisations with expiry, partial capture, incremental auth and reversal"}
  LED-05: {module: Ledger, priority: M, text: "Value date vs booking date; back- and future-dated postings with interest recalculation"}
  LED-06: {module: Ledger, priority: M, text: "Idempotency key on every posting; exactly-once booking under retries"}
  LED-07: {module: Ledger, priority: M, text: "Reversals and corrections only by compensating entries"}
  LED-08: {module: Ledger, priority: S, text: "Sub-ledgers and virtual accounts with unlimited hierarchy"}
  LED-09: {module: Ledger, priority: S, text: "Point-in-time balance query for any account at any timestamp"}
  GL-01: {module: General ledger, priority: M, text: "Configurable chart of accounts per legal entity; product-to-GL mapping rules"}
  GL-02: {module: General ledger, priority: M, text: "Automatic GL posting from every ledger event; real-time trial balance"}
  GL-03: {module: General ledger, priority: M, text: "Continuous close; EOD, EOM and EOY are logical cut-offs"}
  GL-04: {module: General ledger, priority: M, text: "Accruals, IFRS 9 ECL provisions (stages 1-3), income recognition"}
  GL-05: {module: General ledger, priority: S, text: "Inter-entity and inter-branch accounting with automatic due-to/due-from"}
  GL-06: {module: General ledger, priority: S, text: "Export to ERP (SAP, Oracle, NetSuite) via files and APIs"}
  REC-01: {module: Reconciliation, priority: M, text: "Automated matching of ledger vs scheme files, bank statements and partner reports"}
  REC-02: {module: Reconciliation, priority: M, text: "Configurable match rules with tolerances; exception queues with ageing"}
  REC-03: {module: Reconciliation, priority: S, text: "AI-suggested matches for unresolved breaks"}
  CIF-01: {module: Customer, priority: M, text: "Individuals, sole traders, companies, trusts, groups; relationships (director, UBO, guardian, joint holder)"}
  CIF-02: {module: Customer, priority: M, text: "Single customer view across products and entities"}
  CIF-03: {module: Customer, priority: M, text: "Tiered KYC levels with limits per tier"}
  CIF-04: {module: Customer, priority: M, text: "Consent management and data privacy: access, export, erasure where lawful"}
  CIF-05: {module: Customer, priority: S, text: "Household and group views for relationship managers"}
  ONB-01: {module: Onboarding, priority: M, text: "Configurable onboarding journeys per product and country (no-code flow builder)"}
  ONB-02: {module: Onboarding, priority: M, text: "Document capture, OCR, liveness and face match via pluggable providers"}
  ONB-03: {module: Onboarding, priority: M, text: "Sanctions, PEP and adverse-media screening at onboarding and on change"}
  ONB-04: {module: Onboarding, priority: M, text: "KYB with registry lookups and UBO discovery"}
  ONB-05: {module: Onboarding, priority: M, text: "Onboarding risk scoring; auto-approve, refer or reject"}
  ONB-06: {module: Onboarding, priority: S, text: "Periodic KYC refresh and document-expiry workflows"}
  ONB-07: {module: Onboarding, priority: S, text: "Agent-assisted onboarding offline with later sync"}
  PRD-01: {module: Product Studio, priority: M, text: "Versioned product catalogue; accounts stay on their version until migrated"}
  PRD-02: {module: Product Studio, priority: M, text: "No-code templates for deposits, wallets, cards, loans, lines, BNPL, overdraft"}
  PRD-03: {module: Product Studio, priority: M, text: "Parameters: interest, fees, limits, eligibility, tax, statements, dormancy"}
  PRD-04: {module: Product Studio, priority: M, text: "Rules engine for pricing and eligibility (DMN-compatible decision tables)"}
  PRD-05: {module: Product Studio, priority: S, text: "Sandboxed WASM scripts for custom behaviour with simulation"}
  PRD-06: {module: Product Studio, priority: M, text: "Product simulation over a multi-year horizon before launch"}
  PRD-07: {module: Product Studio, priority: S, text: "Bundles and packages"}
  PRC-01: {module: Pricing, priority: M, text: "Daily interest accrual with day-count conventions and compounding"}
  PRC-02: {module: Pricing, priority: M, text: "Event, periodic and tiered fees, waivers, caps"}
  PRC-03: {module: Pricing, priority: M, text: "Withholding tax and VAT/GST on fees per jurisdiction"}
  PRC-04: {module: Pricing, priority: S, text: "Relationship pricing and promotional rates"}
  DEP-01: {module: Deposits, priority: M, text: "Account lifecycle: open, active, dormant, frozen, blocked, closed"}
  DEP-02: {module: Deposits, priority: M, text: "Joint accounts, minor accounts, authorised signatories with mandates"}
  DEP-03: {module: Deposits, priority: M, text: "Term deposits: placement, auto-renewal, premature withdrawal penalties"}
  DEP-04: {module: Deposits, priority: M, text: "Arranged and unarranged overdrafts with limits and interest"}
  DEP-05: {module: Deposits, priority: M, text: "Standing orders, scheduled and recurring payments, sweeps and savings pots"}
  DEP-06: {module: Deposits, priority: M, text: "Statements (PDF, CSV, camt.053), interest certificates, tax documents"}
