          - "GET /{mandate_id} | One mandate of the business | | payment_mandate"
          - "POST /{mandate_id}/cancel | Cancel a mandate (MAKER or ADMIN) | reason string(255) nn | payment_mandate"
          - "GET /{mandate_id}/collections | Collections under one mandate | | direct_debit_collection[]"
          - "POST /{mandate_id}/collections | Schedule a collection under an active collection mandate (MAKER or ADMIN; step-up) | amount amount nn, due_date date nn, sequence_type string(4) | direct_debit_collection"

      - resource: business-virtual-accounts
        path: /v1/business/virtual-accounts
