          - "GET /{link_id} | One payment link | | payment_link"
          - "POST /{link_id}/disable | Disable a payment link (MAKER or ADMIN) | reason string(255) | payment_link"
          - "GET /{link_id}/payments | Payments received through one link | | payment[]"

      - resource: business-cards
        path: /v1/business/cards
        table: business_action
        description: Expense cards for employees, linked to the business's accounts (issued and controlled by ADMIN users)
        ops: []
        actions:
          - "GET / | Expense cards of the business on accounts the user may see (closed and replaced cards excluded) | | card[]"
          - "POST / | Issue a virtual expense card for an employee on an account of the business (ADMIN; step-up) | card_product_id uuid nn, deposit_account_id uuid nn, cardholder_name string(26) nn, nickname string(64) | card"
          - "GET /{card_id} | One expense card | | card"
          - "POST /{card_id}/freeze | Freeze an expense card (ADMIN) | | card"
          - "POST /{card_id}/unfreeze | Unfreeze an expense card (ADMIN; step-up) | | card"
          - "POST /{card_id}/close | Close an expense card for good (ADMIN; step-up) | reason string(255) | card"
          - "GET /{card_id}/controls | Controls of one card | | card_control[]"
          - "PUT /{card_id}/channels/{channel} | Block or allow a channel (ECOM, POS, ATM, CONTACTLESS) on one card (ADMIN) | blocked bool nn | card_control"
          - "GET /{card_id}/limits | Spend limits of one card | | card_spend_limit[]"
          - "PUT /{card_id}/limits | Set the spend limit for one period and channel of one card (ADMIN; step-up) | period enum:CardLimitPeriod nn, channel enum:CardChannel, max_amount amount nn | card_spend_limit"
          - "GET /{card_id}/authorizations | Authorisations on one card | | card_authorization[]"

      - resource: business-card-products
        path: /v1/business/card-products
        table: business_action
        description: Card products expense cards can be issued on
        ops: []
        actions:
          - "GET / | Active card products | | card_product[]"

      - resource: business-loans
        path: /v1/business/loans
        table: business_action
