          - "POST / | Open a virtual account on an account the user may initiate on (MAKER or ADMIN) | master_account_id uuid nn, purpose enum:VirtualAccountPurpose nn, owner_reference string(128), expected_amount amount, single_use bool, expires_at ts | virtual_account"
          - "GET /{virtual_account_id} | One virtual account | | virtual_account"
          - "GET /{virtual_account_id}/transactions | Credits routed through one virtual account | | ledger_entry[]"
          - "POST /{virtual_account_id}/close | Close a virtual account (MAKER or ADMIN) | reason string(255) | virtual_account"

      - resource: business-payment-links
        path: /v1/business/payment-links
