domain: wallets
title: Wallets, Agents and Merchants
phase: 2
description: >
  Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system
  wallets with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission
  engine; biller catalogue, bill payments and airtime; merchant acceptance (QR, terminals, payment links)
  and settlement; USSD and SMS channels; G2P and bulk disbursements; interoperability with national
  switches and other wallets. Every money movement posts through the ledger.

enums:
  WalletType: [CUSTOMER, MERCHANT, AGENT, SUPER_AGENT, FLOAT, COMMISSION, ESCROW, G2P, TREASURY]
  WalletStatus: [PENDING, ACTIVE, DORMANT, SUSPENDED, BLOCKED, CLOSED]
  WalletTxnType: [P2P, CASH_IN, CASH_OUT, MERCHANT_PAYMENT, BILL_PAYMENT, AIRTIME, G2P, BULK_DISBURSEMENT,
                  WALLET_TO_BANK, BANK_TO_WALLET, FLOAT_TRANSFER, COMMISSION_PAYOUT, INTEROP_OUT, INTEROP_IN,
                  REFUND, REVERSAL, FEE, ADJUSTMENT, LOAN_DISBURSEMENT, LOAN_REPAYMENT]
  WalletTxnStatus: [INITIATED, PENDING_CONFIRMATION, PENDING_APPROVAL, PROCESSING, COMPLETED, FAILED,
                    REVERSED, EXPIRED, CANCELLED]
  WalletChannel: [USSD, SMS, APP, WEB, API, AGENT_APP, POS, QR, BULK, SYSTEM]
  WalletLegRole: [PAYER, PAYEE, FEE, COMMISSION, TAX, FLOAT]
  WalletLinkStatus: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, REMOVED]
  PinResetStatus: [REQUESTED, VERIFIED, COMPLETED, REJECTED, EXPIRED]
  AgentLevel: [SUPER_AGENT, AGENT, SUB_AGENT]   # WE-HIER-1: legacy fixed levels, kept as a compat shadow of the configurable hierarchy
  AgentStatus: [ONBOARDING, ACTIVE, SUSPENDED, TERMINATED]
  HierarchyConfigStatus: [DRAFT, PENDING_APPROVAL, ACTIVE, RETIRED]   # WE-HIER-1: maker-checker lifecycle of hierarchy config (domain, category, grade)
  BearerRole: [PAYER, PAYEE, INITIATOR]   # WE-HIER-1: who in a transaction a service preference applies to
  ServiceClass: [FINANCIAL, NON_FINANCIAL]   # WE-HIER-1: a category/grade service is a money movement or an enquiry
  NonFinancialService: [BALANCE_ENQUIRY, MINI_STATEMENT, STATEMENT_REQUEST, PIN_CHANGE, PIN_RESET, REGISTRATION,
                        KYC_UPGRADE, PROFILE_UPDATE, OTHER]   # WE-HIER-1: non-financial services a category/grade may perform
  OutletStatus: [ACTIVE, INACTIVE, CLOSED]
  FloatRequestType: [TOP_UP, REBALANCE, WITHDRAW, TRANSFER, ALLOCATE, DEALLOCATE]   # WE-FLOAT-1: ALLOCATE = O2C capital/parent -> child float; DEALLOCATE = float -> trust
  FloatRequestStatus: [REQUESTED, APPROVED, REJECTED, COMPLETED, CANCELLED, FAILED]
  # WE-FLOAT-1 (G-02, MQ-STK-1..14): operator stock / e-money float management
  StockOperationType: [STOCK_CREATION, REIMBURSEMENT]   # creation = bank trust -> capital; reimbursement = e-money -> physical cash
  StockOperationStatus: [REQUESTED, APPROVED, REJECTED, COMPLETED, CANCELLED, FAILED]
  StockInstrument: [CASH, CHEQUE, DD, BANK_TRANSFER]   # funding instrument of a stock operation / allocation (DD = demand draft)
  SweepRunStatus: [PENDING_APPROVAL, RUNNING, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED, CANCELLED]   # auto-deallocation and unclaimed-settlement batch runs
  SweepLineStatus: [SWEPT, FAILED, SKIPPED]   # one line of a sweep / settlement run (SWEPT = money moved)
  UnclaimedSettlementStage: [SUSPENSE_TO_UNCLAIMED, UNCLAIMED_TO_CAPITAL, UNCLAIMED_TO_INCOME]   # aging stage: IND02 -> IND06 -> (IND01 | IND03)
  AgentService: [CASH_IN, CASH_OUT, ONBOARDING, BILL_PAY, AIRTIME, MERCHANT_PAYMENT, FLOAT_SALE]
  TillVarianceStatus: [BALANCED, OVER, SHORT]
  PinConfirmationMethod: [PIN, OTP, SYSTEM]
  CommissionPayoutRunStatus: [PENDING_APPROVAL, RUNNING, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED, CANCELLED]
  CommissionPayoutLineStatus: [PAID, FAILED]
  ApprovalDecision: [APPROVED, REJECTED]
  UssdInputType: [TEXT, NUMBER, AMOUNT, MSISDN, PIN]
  InteropPartyType: [MSISDN, ACCOUNT, ALIAS]
  BillerChecksum: [NONE, LUHN, MOD97, MOD11]
  AgentTillStatus: [OPEN, CLOSED, SUSPENDED]
  AgentDeviceType: [POS, SMARTPHONE, TABLET, FEATURE_PHONE]
  AgentDeviceStatus: [ACTIVE, INACTIVE, LOST, RETIRED]
  CashRequestType: [CASH_DELIVERY, CASH_PICKUP]
  CommissionBasis: [FLAT, PERCENTAGE, TIERED, FLAT_PLUS_PERCENTAGE]
  CommissionBeneficiary: [AGENT, SUPER_AGENT, SUB_AGENT, MERCHANT, BILLER, PLATFORM, CUSTOMER, AGGREGATOR, SERVICE_PROVIDER]   # WE-PRICE-1: AGGREGATOR / SERVICE_PROVIDER added for commission sharing (PE-14)
  CommissionPlanStatus: [DRAFT, PENDING_APPROVAL, ACTIVE, RETIRED]
  PayoutFrequency: [REALTIME, DAILY, WEEKLY, MONTHLY]
  # WE-PRICE-1 (G-05, MQ-PE-7/11/13/14/16/18): pricing-engine extensions. All additive; defaults reproduce today's output.
  SlabMode: [BAND, TELESCOPIC]   # PE-7: BAND = tier band charges the whole base (today); TELESCOPIC = sum of per-slice charges
  ChargeScope: [INSTRUMENT, CUMULATIVE]   # PE-7: INSTRUMENT = this transaction; CUMULATIVE = f(after) - f(before) over an accumulation window
  AccumulationPeriod: [DAILY, WEEKLY, MONTHLY, YEARLY, LIFETIME]   # PE-7: window a CUMULATIVE charge accumulates over
  ChargeDirection: [DEBIT, CREDIT]   # PE-7: side the (telescopic) charge applies to
  RemoteTxnType: [ONSITE, OFFSITE, NOT_CLASSIFIED]   # PE-16: cell-ID / LAC classification of a cash-in/out versus the outlet
  MilestonePeriod: [DAILY, WEEKLY, MONTHLY, LIFETIME]   # PE-18: window the nth-transaction count is measured in
  JoiningMilestone: [REGISTER, FIRST_CASH_IN, FIRST_DEBIT]   # PE-11: the three fire-once joining-commission milestones
  InactiveRewardTrigger: [IMMEDIATE, AFTER_FIRST_DEBIT, AFTER_DURATION]   # PE-13: when a cash-in-to-inactive reward is released
  BillerCategory: [ELECTRICITY, WATER, GAS, TELECOM, AIRTIME, DATA, TV, INTERNET, EDUCATION, GOVERNMENT, TAX,
                   INSURANCE, LOAN, OTHER]
  BillerStatus: [ACTIVE, SUSPENDED, RETIRED]
  BillerIntegration: [API, ISO8583, FILE, AGGREGATOR]
  BillPaymentStatus: [INITIATED, VALIDATED, PROCESSING, PENDING_PROVIDER, COMPLETED, FAILED, REVERSED]
  SettlementFrequency: [REALTIME, DAILY, WEEKLY, MONTHLY, ON_DEMAND]
  WalletSettlementStatus: [PENDING, CALCULATED, APPROVED, PAID, FAILED, REJECTED]
  MerchantStatus: [ONBOARDING, ACTIVE, SUSPENDED, TERMINATED]
  MerchantType: [INDIVIDUAL, SOLE_TRADER, COMPANY, GOVERNMENT, NGO]
  MerchantTerminalStatus: [ACTIVE, INACTIVE, LOST, RETIRED]
  QrType: [STATIC, DYNAMIC]
  MerchantRefundStatus: [REQUESTED, PENDING_BANK_APPROVAL, APPROVED, COMPLETED, REJECTED, FAILED]
  UssdMenuStatus: [DRAFT, PUBLISHED, RETIRED]
  UssdNodeType: [MENU, INPUT, CONFIRM, ACTION, END]
  UssdSessionStatus: [ACTIVE, COMPLETED, TIMED_OUT, ABORTED, FAILED]
  SmsDirection: [INBOUND, OUTBOUND]
  SmsStatus: [QUEUED, SENT, DELIVERED, FAILED, RECEIVED]
  DisbursementProgramStatus: [DRAFT, ACTIVE, SUSPENDED, CLOSED]
  DisbursementBatchStatus: [DRAFT, VALIDATING, VALIDATED, PENDING_APPROVAL, APPROVED, PROCESSING, COMPLETED,
                            PARTIALLY_COMPLETED, FAILED, CANCELLED, REJECTED]
  BeneficiaryValidation: [PENDING, VALID, INVALID, NAME_MISMATCH, DUPLICATE]
  BeneficiaryPayoutStatus: [PENDING, PAID, FAILED, SKIPPED, RETURNED]
  InteropSwitchType: [NATIONAL_SWITCH, MOJALOOP_HUB, WALLET_PARTNER, BANK_PARTNER]
  InteropDirection: [OUTBOUND, INBOUND]
  InteropQuoteStatus: [PENDING, ACCEPTED, REJECTED, EXPIRED]
  InteropTransferStatus: [QUOTE_REQUESTED, QUOTED, RESERVED, COMMITTED, ABORTED, FAILED, EXPIRED]

services:
  # ------------------------------------------------------------------ wallet-service
  - name: wallet-service
    database: wallet_db
    description: >
      Wallet lifecycle, KYC-tier limits, PINs, linked bank accounts and every wallet money movement
      (P2P, cash-in/out, merchant, bill, airtime, G2P, wallet-to-bank, reversals). Each transaction is
      broken into legs and posted atomically to the ledger.
    tables:
      - name: wallet
        prefix: wal
        description: A stored-value account held by a customer, merchant, agent or the platform
        fr: [WAL-01, CIF-03, LND-07]
        columns:
          - "wallet_number string(32) nn uq ro | Public wallet number (server-generated, Luhn check digit)"
          - "wallet_type enum:WalletType nn | Kind of wallet"
          - "customer_id uuid ref=customer idx | Owning customer (customer wallets)"
          - "agent_id uuid ref=agent idx | Owning agent (agent, super-agent, float and commission wallets)"
          - "merchant_id uuid ref=merchant idx | Owning merchant (merchant wallets)"
          - "msisdn phone idx pii | Mobile number bound to the wallet (E.164)"
          - "alias string(64) | Optional handle used for P2P lookup"
          - "display_name string(160) nn | Name shown to payers for confirmation"
          - "currency currency nn | Wallet currency"
          - "product_id uuid ref=product | Wallet product"
          - "product_version_id uuid ref=product_version | Product version the wallet is on"
          - "ledger_account_id uuid ref=ledger_account ro | Ledger account holding the balance (opened on first activation)"
          - "kyc_tier int nn default=0 | KYC tier (0 = phone only) driving limits; changed later only by /upgrade-tier"
          - "kyc_profile_id uuid ref=kyc_profile ro | KYC profile that verified the current tier"
          - "status enum:WalletStatus nn default=PENDING ro | Lifecycle status (changed only by actions)"
          - "status_reason string(255) ro | Reason for the current status"
          - "is_default bool nn default=true | Default wallet of the owner for this currency"
          - "pin_hash string(255) secret | PBKDF2-HMAC-SHA256 hash of the wallet PIN (salt and iterations encoded)"
          - "has_pin bool nn default=false ro | Whether a PIN is set"
          - "pin_set_at ts ro | Time the PIN was last set"
          - "pin_failed_attempts int nn default=0 hide | Consecutive failed PIN attempts"
          - "pin_locked_until ts ro | PIN locked until this time after too many failures"
          - "language string(8) | Preferred language for USSD/SMS"
          - "opened_channel enum:WalletChannel | Channel the wallet was opened on"
          - "opened_by_agent_id uuid ref=agent | Agent who registered the wallet"
          - "category_id uuid ref=domain_category idx | WE-HIER-1: domain category placing the wallet in the configurable hierarchy (empty = any)"
          - "grade_id uuid ref=grade idx | WE-HIER-1: grade of the wallet holder (empty = un-registered / any)"
          - "activated_at ts ro | First activation time"
          - "last_activity_at ts ro | Last customer-initiated transaction"
          - "dormant_since ts ro | Time the wallet became dormant"
          - "credit_score int ro | Transaction-based score for nano-loan offers"
          - "closed_at ts ro | Closing time"
          - "metadata json | Client-defined key/value metadata"
        unique: [[tenant_id, ledger_account_id]]
        request_only:
          - "pin string(12) | Initial PIN (4-6 digits, not trivial); stored only as a PBKDF2 hash"

      - name: wallet_tier_limit
        prefix: wtl
        description: Balance and transaction limits per KYC tier, wallet type and transaction type
        fr: [WAL-01, CIF-03, LIM-01]
        columns:
          - "kyc_tier int nn | KYC tier"
          - "wallet_type enum:WalletType nn | Wallet type"
          - "txn_type enum:WalletTxnType | Transaction type (empty = all debits)"
          - "currency currency nn | Currency"
          - "max_balance amount | Maximum wallet balance"
          - "per_txn_min amount | Minimum amount per transaction"
          - "per_txn_max amount | Maximum amount per transaction"
          - "daily_amount amount | Maximum amount per day"
          - "daily_count int | Maximum transactions per day"
          - "monthly_amount amount | Maximum amount per month"
          - "monthly_count int | Maximum transactions per month"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
        unique: [[tenant_id, kyc_tier, wallet_type, txn_type, currency, valid_from]]

      - name: wallet_fee_rule
        prefix: wfr
        description: Customer fee charged on a wallet transaction; the most specific matching active rule wins
        fr: [WAL-01, PRC-02]
        columns:
          - "code string(32) nn | Rule code"
          - "txn_type enum:WalletTxnType nn | Transaction type"
          - "channel enum:WalletChannel | Channel (empty = any)"
          - "wallet_type enum:WalletType | Payer wallet type (empty = any)"
          - "kyc_tier int | Payer KYC tier (empty = any)"
          - "currency currency nn | Currency"
          - "min_amount amount | Applies from this transaction amount (inclusive)"
          - "max_amount amount | Applies up to this transaction amount (inclusive)"
          - "basis enum:CommissionBasis nn default=FLAT | Calculation basis"
          - "flat_fee amount | Flat fee (FLAT, FLAT_PLUS_PERCENTAGE)"
          - "percentage rate | Percentage of the amount, 0.01 = 1% (PERCENTAGE, FLAT_PLUS_PERCENTAGE)"
          - "tiers json[] | Tier table for TIERED: [{from, to, flat, percentage}]"
          - "min_fee amount | Minimum fee"
          - "max_fee amount | Maximum fee"
          - "tax_rate rate | Tax (excise / VAT) on the fee, 0.15 = 15%"
          - "priority int nn default=100 | Lower wins among equally specific rules"
          - "tier_mode enum:SlabMode nn default=BAND | WE-PRICE-1 (PE-7): BAND = band charges the whole amount (today); TELESCOPIC = sum of per-slice charges across the tier table"
          - "charge_scope enum:ChargeScope nn default=INSTRUMENT | WE-PRICE-1 (PE-7): INSTRUMENT = this transaction; CUMULATIVE = f(cumulative_before + amount) - f(cumulative_before)"
          - "accumulation_period enum:AccumulationPeriod | WE-PRICE-1 (PE-7): window a CUMULATIVE charge accumulates over (empty = LIFETIME)"
          - "charge_direction enum:ChargeDirection | WE-PRICE-1 (PE-7): side the charge applies to (empty = any)"
          - "milestone_from_nth int | WE-PRICE-1 (PE-18): applies from the nth matching transaction in the window (inclusive; empty = no milestone gate)"
          - "milestone_to_nth int | WE-PRICE-1 (PE-18): applies up to the nth matching transaction (inclusive; empty = unbounded)"
          - "milestone_period enum:MilestonePeriod | WE-PRICE-1 (PE-18): window the nth count is measured in (empty = LIFETIME)"
          - "milestone_count_scope string(32) | WE-PRICE-1 (PE-18): what the count is scoped to (SERVICE = this txn_type, ALL = any debit; empty = SERVICE)"
          - "remote_txn_type enum:RemoteTxnType | WE-PRICE-1 (PE-16): applies only to this onsite/offsite classification (empty = any)"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
          - "is_active bool nn default=true | Active"
        unique: [[tenant_id, code, valid_from]]

      - name: wallet_transaction
        prefix: wtx
        description: A wallet money movement of any type, with its full lifecycle
        fr: [WAL-01, WAL-02, WAL-05, WAL-06, WAL-07, PAY-01, LND-07]
        columns:
          - "reference string(32) nn uq ro | Human-readable transaction reference shown on receipts (server-generated)"
          - "txn_type enum:WalletTxnType nn | Transaction type"
          - "status enum:WalletTxnStatus nn default=INITIATED ro | Lifecycle status"
          - "channel enum:WalletChannel nn | Initiating channel"
          - "payer_wallet_id uuid fk=wallet | Debited wallet"
          - "payee_wallet_id uuid fk=wallet | Credited wallet"
          - "payee_msisdn phone pii | Payee mobile number as entered"
          - "payee_name string(160) pii ro | Payee name shown for confirmation"
          - "payee_external_ref string(64) | External account / meter / bank reference"
          - "counterparty_ledger_account_id uuid ref=ledger_account | Internal ledger account on the other side when the counterparty is not a wallet (switch settlement, bank clearing, deposit account)"
          - "amount amount nn | Principal amount"
          - "currency currency nn | Currency"
          - "fee_amount amount nn default=0 ro | Fee charged to the payer"
          - "tax_amount amount nn default=0 ro | Tax on the fee"
          - "commission_amount amount nn default=0 ro | Total commission generated"
          - "total_debit_amount amount ro | Amount + fee + tax debited from the payer"
          - "fx_rate rate ro | FX rate applied for cross-currency transfers"
          - "settlement_amount amount ro | Amount credited in the payee currency"
          - "settlement_currency currency ro | Payee currency"
          - "initiator_type string(32) nn | CUSTOMER, AGENT, MERCHANT, SYSTEM, BULK, STAFF"
          - "initiated_by string(64) ro | Principal that initiated the transaction"
          - "kyc_tier int ro | Payer KYC tier at initiation"
          - "agent_id uuid ref=agent idx | Agent involved (cash-in / cash-out)"
          - "agent_outlet_id uuid ref=agent_outlet idx | Outlet where the transaction took place"
          - "merchant_id uuid ref=merchant idx | Merchant paid"
          - "biller_id uuid ref=biller | Biller paid"
          - "bill_payment_id uuid ref=bill_payment | Bill payment"
          - "disbursement_beneficiary_id uuid ref=disbursement_beneficiary | Bulk disbursement line"
          - "interop_transfer_id uuid ref=interop_transfer | Interoperable transfer"
          - "wallet_bank_link_id uuid fk=wallet_bank_link | Linked bank account (wallet-to-bank / bank-to-wallet)"
          - "payment_id uuid ref=payment ro | Bank payment (wallet-to-bank / bank-to-wallet)"
          - "loan_id uuid ref=loan | Nano-loan disbursed or repaid"
          - "original_transaction_id uuid fk=wallet_transaction idx | Transaction reversed or refunded"
          - "journal_entry_id uuid ref=journal_entry ro | Ledger posting"
          - "hold_id uuid ref=hold ro | Funds hold while pending confirmation"
          - "limit_check_id uuid ref=limit_check ro | Limit reservation in limits-service"
          - "fraud_score_id uuid ref=fraud_score ro | Fraud evaluation"
          - "fraud_decision string(16) ro | Fraud decision (ALLOW, REVIEW, BLOCK, STEP_UP)"
          - "idempotency_key string(128) nn ro | Client key"
          - "description string(255) | Narrative"
          - "customer_note string(160) | Note from payer to payee"
          - "confirmation_method enum:PinConfirmationMethod ro | How a pending transaction must be confirmed"
          - "confirmation_otp_hash string(128) secret | Hash of the OTP sent for OTP confirmation"
          - "confirmation_attempts int nn default=0 ro | Failed confirmation attempts"
          - "confirmation_expires_at ts ro | Deadline for PIN/OTP confirmation"
          - "completed_at ts ro | Completion time"
          - "failure_code string(64) ro | Stable failure code"
          - "failure_reason string(255) ro | Failure description"
          - "reversed_amount amount nn default=0 ro | Amount reversed so far"
          - "reversal_requested_by string(64) ro | Maker of a pending reversal request"
          - "reversal_requested_at ts ro | Time the reversal was requested"
          - "reversal_requested_amount amount ro | Amount requested for reversal"
          - "reversal_reason string(255) ro | Reason of the reversal request"
          - "risk_score rate ro | Fraud score 0..1"
          - "device_id uuid ref=customer_device | Device used"
          - "ip_address inet | Source IP (app / web)"
          - "geo_lat rate | Latitude at initiation"
          - "geo_lon rate | Longitude at initiation"
          - "cell_id string(32) | WE-PRICE-1 (PE-16): serving cell id reported at initiation (cash-in / cash-out)"
          - "lac_id string(32) | WE-PRICE-1 (PE-16): location area code reported at initiation"
          - "remote_txn_type enum:RemoteTxnType ro | WE-PRICE-1 (PE-16): onsite/offsite classification against the outlet cell/lac (server-derived)"
          - "metadata json | Client-defined key/value metadata"
        unique: [[tenant_id, idempotency_key]]
        indexes: [[payer_wallet_id, created_at], [payee_wallet_id, created_at], [txn_type, status]]
        request_only:
          - "pin string(12) | Payer PIN, verified and never stored"
          - "two_phase bool | Reserve the funds with a ledger hold and wait for /confirm or /cancel (cash-out, interop, provider calls)"

      - name: wallet_transaction_leg
        prefix: wlg
        description: One debit or credit leg of a wallet transaction (principal, fee, tax, commission). Append-only.
        immutable: true
        fr: [WAL-01, LED-01]
        columns:
          - "wallet_transaction_id uuid nn fk=wallet_transaction idx | Parent transaction"
          - "leg_no int nn | Leg number"
          - "role enum:WalletLegRole nn | Purpose of the leg"
          - "wallet_id uuid fk=wallet idx | Wallet affected (empty for internal accounts)"
          - "ledger_account_id uuid nn ref=ledger_account | Ledger account posted"
          - "direction enum:EntryDirection nn | Debit or credit"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "journal_entry_id uuid ref=journal_entry | Ledger journal entry carrying the leg"
          - "beneficiary_type string(32) | AGENT, SUPER_AGENT, PLATFORM, BILLER, TAX_AUTHORITY"
          - "description string(255) | Narrative"
        unique: [[wallet_transaction_id, leg_no]]

      - name: wallet_bank_link
        prefix: wbl
        description: A bank account linked to a wallet for wallet-to-bank and bank-to-wallet transfers
        fr: [PAY-01, WAL-08]
        columns:
          - "wallet_id uuid nn fk=wallet idx | Wallet"
          - "bank_code string(32) nn | Bank / sort code / IFSC / BIC"
          - "bank_name string(160) | Bank name"
          - "account_number string(34) nn pii | Account number or IBAN"
          - "account_name string(160) pii ro | Account holder name returned by name enquiry"
          - "deposit_account_id uuid ref=deposit_account | Internal deposit account when held on Meridian"
          - "currency currency nn | Account currency"
          - "status enum:WalletLinkStatus nn default=PENDING_VERIFICATION ro | Status"
          - "status_reason string(255) ro | Reason for the current status"
          - "verification_method string(32) nn default=NAME_ENQUIRY | NAME_ENQUIRY, MICRO_DEPOSIT, OPEN_BANKING, MANUAL"
          - "verification_code_hash string(128) secret | Hash of the micro-deposit code"
          - "verification_attempts int nn default=0 ro | Failed verification attempts"
          - "verified_by string(64) ro | Principal that verified the link"
          - "verified_at ts ro | Verification time"
          - "mandate_reference string(64) | Direct-debit mandate for bank-to-wallet pulls"
          - "is_default bool nn default=false | Default link"

      - name: wallet_pin_reset
        prefix: wpr
        description: A PIN reset request verified by OTP, agent or ID check
        fr: [WAL-03]
        columns:
          - "wallet_id uuid nn fk=wallet idx | Wallet"
          - "channel enum:WalletChannel nn | Channel of the request"
          - "status enum:PinResetStatus nn default=REQUESTED ro | Status"
          - "verification_method string(32) nn | OTP, ID_CHECK, AGENT, SECURITY_QUESTIONS"
          - "agent_id uuid ref=agent | Agent who verified the customer"
          - "document_id uuid ref=document | ID document captured"
          - "otp_hash string(128) secret | Hash of the OTP sent to the wallet msisdn"
          - "otp_attempts int nn default=0 ro | OTP attempts used"
          - "notification_id uuid ref=notification ro | OTP notification"
          - "expires_at ts nn ro | Request expiry (database clock)"
          - "verified_by string(64) ro | Principal that verified the customer"
          - "verified_at ts ro | Verification time"
          - "completed_at ts ro | Completion time"
          - "rejected_reason string(255) ro | Rejection reason"

      - name: wallet_favorite
        prefix: wfv
        description: A saved payee (wallet, biller account, merchant, bank account) for quick payments
        fr: [PAY-01, WAL-05]
        columns:
          - "wallet_id uuid nn fk=wallet idx | Owner wallet"
          - "nickname string(64) nn | Display name"
          - "favorite_type string(32) nn | WALLET, BILLER, MERCHANT, BANK, AIRTIME"
          - "target_wallet_id uuid fk=wallet | Saved wallet"
          - "target_msisdn phone pii | Saved mobile number"
          - "biller_id uuid ref=biller | Saved biller"
          - "merchant_id uuid ref=merchant | Saved merchant"
          - "payee_id uuid ref=payee | Saved bank payee"
          - "account_reference string(64) | Meter / account number at the biller"

      - name: wallet_status_history
        prefix: wsh
        description: Immutable history of wallet status changes
        immutable: true
        fr: [WAL-01, ADM-03]
        columns:
          - "wallet_id uuid nn fk=wallet idx | Wallet"
          - "from_status enum:WalletStatus | Previous status"
          - "to_status enum:WalletStatus nn | New status"
          - "reason string(255) | Reason"
          - "changed_by string(64) | Principal"
          - "approval_request_id uuid ref=approval_request | Maker-checker approval"

    apis:
      - resource: wallets
        path: /v1/wallets
        table: wallet
        ops: [list, get, create, update]
        filters: [wallet_type, status, customer_id, agent_id, merchant_id, msisdn, currency, kyc_tier, wallet_number, alias]
        actions:
          - "GET /lookup?msisdn:phone&alias:string(64)&wallet_number:string(32)&currency:currency | Resolve an active wallet by msisdn, alias or wallet number for payee name confirmation | | wallet"
          - "GET /{id}/balance | Current balance (posted, available, held) from the ledger | | account_balance"
          - "GET /{id}/transactions?from:ts&to:ts&txn_type:enum:WalletTxnType&status:enum:WalletTxnStatus | Transactions of the wallet (as payer or payee), newest first | | wallet_transaction[]"
          - "GET /{id}/limits?txn_type:enum:WalletTxnType | Effective tier limits with used and remaining daily/monthly amount and count: {kyc_tier, wallet_type, currency, limits[{txn_type, per_txn_min, per_txn_max, max_balance, daily_amount, daily_used, daily_remaining, daily_count, daily_count_used, monthly_amount, monthly_used, monthly_remaining, monthly_count, monthly_count_used}]} | | object"
          - "GET /{id}/status-history | Status change history | | wallet_status_history[]"
          - "GET /{id}/statement?from:date!&to:date! | Mini statement from the ledger: {wallet_id, from, to, opening_balance, closing_balance, total_credits, total_debits, entries[]} | | object"
          - "POST /{id}/upgrade-tier | Upgrade the KYC tier after verification (tiers only go up) | kyc_tier int nn, kyc_profile_id uuid nn"
          - "POST /{id}/activate | Activate a pending or dormant wallet; opens the ledger account on first activation | reason string(255)"
          - "POST /{id}/suspend | Suspend the wallet (ledger account frozen for debits) | reason string(255) nn"
          - "POST /{id}/block | Block the wallet (fraud or legal; ledger account fully frozen) | reason string(255) nn"
          - "POST /{id}/reactivate | Lift a suspension or block (checker: a different principal from the one who suspended or blocked) | reason string(255) nn"
          - "POST /{id}/close | Close a wallet, sweeping any residual balance to another wallet of the same currency | reason string(255) nn, sweep_to_wallet_id uuid"
          - "POST /{id}/set-pin | Set or change the wallet PIN (current_pin required when a PIN exists) | new_pin string(12) nn, current_pin string(12)"
          - "POST /{id}/verify-pin | Verify the wallet PIN; failures count towards the lockout: {valid, remaining_attempts, locked_until} | pin string(12) nn | object"
          - "POST /{id}/statements | Request a full statement delivered by notification: {notification_id, entry_count, from_date, to_date} | from_date date nn, to_date date nn, format string(8) | object"
          - "POST /eod/dormancy?business_date:date! | End of day - mark active wallets without customer activity for the dormancy period dormant (idempotent per business date) | | object"

      - resource: wallet-transactions
        path: /v1/wallet-transactions
        table: wallet_transaction
        ops: [list, get, create]
        filters: [txn_type, status, channel, payer_wallet_id, payee_wallet_id, agent_id, agent_outlet_id, merchant_id, biller_id, reference, original_transaction_id, bill_payment_id, disbursement_beneficiary_id, interop_transfer_id]
        actions:
          - "POST /quote | Fee and tax quote before initiation: {txn_type, amount, currency, fee_amount, tax_amount, total_debit_amount, fee_rule_id, remote_txn_type, payee_name, limits_ok, limit_violation} | txn_type enum:WalletTxnType nn, amount amount nn, currency currency nn, payer_wallet_id uuid, payee_wallet_id uuid, payee_msisdn phone, channel enum:WalletChannel, agent_outlet_id uuid, cell_id string(32), lac_id string(32) | object"
          - "GET /summary?txn_type:enum:WalletTxnType&status:enum:WalletTxnStatus&merchant_id:uuid&agent_id:uuid&agent_outlet_id:uuid&biller_id:uuid&wallet_id:uuid&from:ts&to:ts | Counts and sums grouped by txn_type, status and currency: {groups[{txn_type, status, currency, count, amount, fee_amount, tax_amount, distinct_payers}]} | | object"
          - "POST /p2p | Send money to another wallet by msisdn, alias or wallet id | payer_wallet_id uuid nn, payee_wallet_id uuid, payee_msisdn phone, payee_alias string(64), amount amount nn, currency currency nn, channel enum:WalletChannel, description string(255), customer_note string(160), pin string(12)"
          - "POST /cash-in | Agent cash-in: the agent float wallet pays e-value to a customer wallet | agent_wallet_id uuid nn, agent_outlet_id uuid, payee_msisdn phone nn, amount amount nn, currency currency nn, channel enum:WalletChannel, pin string(12), cell_id string(32), lac_id string(32)"
          - "POST /cash-out | Customer cash-out at an agent outlet: funds are held on the customer wallet until the customer confirms with PIN | agent_wallet_id uuid nn, agent_outlet_id uuid, payer_wallet_id uuid nn, amount amount nn, currency currency nn, channel enum:WalletChannel, cell_id string(32), lac_id string(32)"
          - "POST /wallet-to-bank | Transfer to a linked, verified bank account | payer_wallet_id uuid nn, wallet_bank_link_id uuid nn, amount amount nn, currency currency nn, description string(255), pin string(12)"
          - "POST /bank-to-wallet | Pull funds from a linked, verified bank account | payee_wallet_id uuid nn, wallet_bank_link_id uuid nn, amount amount nn, currency currency nn, description string(255)"
          - "POST /{id}/confirm | Confirm a pending transaction with PIN or OTP (SYSTEM confirmation for upstream services); captures the hold | pin string(12), otp string(8)"
          - "POST /{id}/cancel | Cancel a transaction awaiting confirmation; releases the hold | reason string(255)"
          - "POST /{id}/request-reversal | Request a full or partial reversal of a completed transaction (maker) | reason string(255) nn, amount amount"
          - "POST /{id}/reverse | Reverse a completed transaction with compensating postings (checker: a different principal from the reversal maker, or from the initiator when no request exists); returns the REVERSAL transaction | reason string(255) nn, amount amount"
          - "POST /expire-pending | Expire transactions whose confirmation deadline passed and release their holds | | object"
          - "GET /{id}/legs | Ledger legs of the transaction | | wallet_transaction_leg[]"
          - "GET /{id}/receipt | Printable receipt for the transaction | | text/plain"

      - resource: wallet-tier-limits
        path: /v1/wallet-tier-limits
        table: wallet_tier_limit
        ops: [list, get, create, update, delete]
        filters: [kyc_tier, wallet_type, txn_type, currency]

      - resource: wallet-fee-rules
        path: /v1/wallet-fee-rules
        table: wallet_fee_rule
        ops: [list, get, create, update, delete]
        filters: [txn_type, channel, currency, is_active, code]

      - resource: wallet-bank-links
        path: /v1/wallet-bank-links
        table: wallet_bank_link
        ops: [list, get, create, update]
        filters: [wallet_id, status, bank_code]
        actions:
          - "POST /{id}/verify | Verify ownership by name enquiry (on-us deposit account), micro-deposit code or manual check (checker differs from the creator) | verification_code string(16)"
          - "POST /{id}/remove | Remove the link | reason string(255)"

      - resource: wallet-pin-resets
        path: /v1/wallet-pin-resets
        table: wallet_pin_reset
        ops: [list, get, create]
        filters: [wallet_id, status, agent_id]
        actions:
          - "POST /{id}/verify | Verify the customer by OTP (sent on create) or ID document / agent check | otp string(8), document_id uuid"
          - "POST /{id}/complete | Set the new PIN and unlock the wallet PIN | new_pin string(12) nn"
          - "POST /{id}/reject | Reject the reset request | reason string(255) nn"

      - resource: wallet-favorites
        path: /v1/wallet-favorites
        table: wallet_favorite
        ops: [list, get, create, update, delete]
        filters: [wallet_id, favorite_type]

    events:
      - "wallets.wallet.created | wallet | A wallet was opened"
      - "wallets.wallet.activated | wallet | WE-PRICE-1 (PE-11): a wallet was activated for the first time (REGISTER joining-commission milestone)"
      - "wallets.wallet.status_changed | wallet | A wallet was activated, suspended, blocked, made dormant or closed"
      - "wallets.wallet.tier_upgraded | wallet | A wallet moved to a higher KYC tier"
      - "wallets.wallet.pin_changed | wallet | A wallet PIN was set or changed"
      - "wallets.wallet.pin_locked | wallet | A wallet PIN was locked after too many failed attempts"
      - "wallets.wallet_transaction.initiated | wallet_transaction | A wallet transaction was initiated"
      - "wallets.wallet_transaction.completed | wallet_transaction | A wallet transaction completed and was posted"
      - "wallets.wallet_transaction.failed | wallet_transaction | A wallet transaction failed"
      - "wallets.wallet_transaction.cancelled | wallet_transaction | A pending wallet transaction was cancelled or expired"
      - "wallets.wallet_transaction.reversal_requested | wallet_transaction | A reversal of a wallet transaction was requested"
      - "wallets.wallet_transaction.reversed | wallet_transaction | A wallet transaction was reversed"
      - "wallets.wallet_bank_link.verified | wallet_bank_link | A bank account link was verified"
      - "wallets.wallet_bank_link.removed | wallet_bank_link | A bank account link was removed"
      - "wallets.wallet_pin_reset.requested | wallet_pin_reset | A wallet PIN reset was requested"
      - "wallets.wallet_pin_reset.completed | wallet_pin_reset | A wallet PIN was reset"

  # ------------------------------------------------------------------ agent-network-service
  - name: agent-network-service
    database: agent_db
    description: >
      Agent hierarchy (super-agent, agent, sub-agent), outlets with geo-location, territories, float
      management and rebalancing, tills and cash counts, agent devices / POS, agent KYB documents,
      cash-in-transit requests and daily performance.
    tables:
      - name: agent_territory
        prefix: atr
        description: Geographic territory used to organise and manage the agent network
        fr: [WAL-01]
        columns:
          - "code string(32) nn uq | Territory code"
          - "name string(120) nn | Name"
          - "parent_id uuid fk=agent_territory idx | Parent territory"
          - "territory_level string(32) nn | COUNTRY, REGION, DISTRICT, ZONE"
          - "country country nn | Country"
          - "manager_user_id uuid ref=app_user | Territory manager"
          - "geo_boundary json | GeoJSON polygon"

      - name: agent
        prefix: agt
        description: A cash-in/cash-out agent business at any level of the hierarchy
        fr: [WAL-01, WAL-02, ONB-04]
        columns:
          - "agent_code string(32) nn uq ro | Agent code used at the till and on USSD (server-generated)"
          - "agent_level enum:AgentLevel nn | Level in the hierarchy"
          - "parent_agent_id uuid fk=agent idx | Direct parent (agent for sub-agents, super-agent for agents)"
          - "super_agent_id uuid fk=agent idx ro | Top-level super-agent (derived from the hierarchy)"
          - "legal_name string(200) nn | Registered business name"
          - "trading_name string(200) | Trading name"
          - "customer_id uuid ref=customer | Business party record (KYB)"
          - "registration_number string(64) | Company registration number"
          - "tax_id string(64) pii | Tax identification number"
          - "contact_name string(160) pii | Main contact"
          - "contact_msisdn phone nn pii | Main contact mobile"
          - "contact_email email pii | Main contact email"
          - "agent_territory_id uuid fk=agent_territory idx | Territory"
          - "distribution_domain_id uuid fk=distribution_domain idx | WE-HIER-1: distribution domain (empty = any; derived from category)"
          - "category_id uuid fk=domain_category idx | WE-HIER-1: domain category placing the agent in the configurable hierarchy (empty = legacy agent_level)"
          - "grade_id uuid fk=grade idx | WE-HIER-1: grade within the category (empty = unresolved; set by /assign-grade)"
          - "branch_id uuid ref=branch | Sponsoring bank branch"
          - "currency currency nn | Operating currency of the float and commission wallets"
          - "float_wallet_id uuid ref=wallet ro | Main float wallet (opened in wallet-service on activation)"
          - "commission_wallet_id uuid ref=wallet ro | Wallet receiving commissions (opened on activation)"
          - "commission_plan_id uuid ref=commission_plan ro | Commission plan (set by /assign-commission-plan)"
          - "commission_plan_effective_from date ro | Date the commission plan applies from"
          - "status enum:AgentStatus nn default=ONBOARDING ro | Status (changed only by actions)"
          - "status_reason string(255) ro | Reason for the current status"
          - "contract_start date | Agency contract start"
          - "contract_end date | Agency contract end"
          - "max_float_amount amount | Maximum float the agent may hold"
          - "kyc_status string(32) ro | PENDING, VERIFIED, REJECTED, EXPIRED (derived from KYB documents)"
          - "risk_rating string(16) | LOW, MEDIUM, HIGH"
          - "onboarded_at ts ro | Activation time"
          - "terminated_at ts ro | Termination time"
          - "metadata json | Client-defined key/value metadata"

      - name: agent_outlet
        prefix: aot
        description: A physical point of service operated by an agent
        fr: [WAL-02, ONB-07]
        columns:
          - "agent_id uuid nn fk=agent idx | Operating agent"
          - "outlet_code string(32) nn uq ro | Outlet code (server-generated)"
          - "name string(160) nn | Outlet name"
          - "address_line1 string(200) | Address line 1"
          - "address_line2 string(200) | Address line 2"
          - "city string(100) | City"
          - "region string(100) | Region / state"
          - "postal_code string(20) | Postal code"
          - "country country nn | Country"
          - "latitude rate | Latitude (-90..90)"
          - "longitude rate | Longitude (-180..180)"
          - "cell_id string(32) | WE-PRICE-1 (PE-16): serving cell id of the outlet, matched against the transaction for onsite/offsite classification"
          - "lac_id string(32) | WE-PRICE-1 (PE-16): location area code of the outlet"
          - "agent_territory_id uuid fk=agent_territory idx | Territory"
          - "opening_hours json | Opening hours per weekday, e.g. {MON: [08:00, 18:00]}"
          - "services enum:AgentService[] | Services offered at the outlet"
          - "float_wallet_id uuid ref=wallet | Outlet-level float wallet when separate from the agent"
          - "contact_msisdn phone pii | Outlet phone"
          - "photo_document_id uuid ref=document | Storefront photo"
          - "status enum:OutletStatus nn default=ACTIVE ro | Status"
          - "closed_reason string(255) ro | Reason the outlet was closed"
        indexes: [[latitude, longitude]]
        response_only:
          - "distance_m int | Distance in metres from the search point (nearby search only)"

      - name: agent_float
        prefix: afl
        description: Float position configuration and alerting for an agent or outlet float wallet
        fr: [WAL-02]
        columns:
          - "agent_id uuid nn fk=agent idx | Agent"
          - "agent_outlet_id uuid fk=agent_outlet | Outlet (empty = agent-level float)"
          - "wallet_id uuid nn ref=wallet uq | Float wallet"
          - "currency currency nn | Currency"
          - "min_balance amount | Balance below which cash-in is refused"
          - "max_balance amount | Maximum float"
          - "low_float_alert_threshold amount | Alert threshold"
          - "auto_rebalance bool nn default=false | Request rebalancing automatically when low"
          - "rebalance_amount amount | Amount requested by an automatic rebalance (default: max_balance - balance)"
          - "rebalance_source_agent_id uuid fk=agent | Default source of rebalancing (usually the super-agent)"
          - "last_balance amount ro | Balance seen at the last check"
          - "last_checked_at ts ro | Last balance check"
          - "last_alert_at ts ro | Last low-float alert"

      - name: agent_float_request
        prefix: afr
        description: A float top-up, rebalance, withdrawal or transfer between agents
        fr: [WAL-02]
        columns:
          - "request_type enum:FloatRequestType nn | Request type"
          - "requesting_agent_id uuid nn fk=agent idx | Agent requesting"
          - "source_agent_id uuid fk=agent idx | Agent providing float (rebalance / transfer)"
          - "source_wallet_id uuid ref=wallet | Source wallet (default: source agent float, or the treasury wallet for bank-funded top-ups)"
          - "target_wallet_id uuid nn ref=wallet | Target wallet"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "funding_method string(32) | BANK_TRANSFER, CASH_DEPOSIT, SUPER_AGENT, WALLET"
          - "bank_reference string(64) | Bank deposit reference"
          - "proof_document_id uuid ref=document | Deposit slip"
          - "status enum:FloatRequestStatus nn default=REQUESTED ro | Status"
          - "approved_by string(64) ro | Approver"
          - "approved_at ts ro | Approval time"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Resulting float transfer"
          - "completed_at ts ro | Execution time"
          - "rejection_reason string(255) ro | Rejection or cancellation reason"
          - "failure_reason string(255) ro | Execution failure reason"
          - "idempotency_key string(128) ro | Idempotency-Key of the create request (lets a client reconcile an unknown outcome)"
        unique: [[tenant_id, idempotency_key]]

      - name: agent_till
        prefix: atl
        description: A cash till at an outlet, opened and closed per shift with cash counts
        fr: [WAL-02]
        columns:
          - "agent_outlet_id uuid nn fk=agent_outlet idx | Outlet"
          - "till_number string(32) nn uq | Till number"
          - "operator_user_id uuid ref=app_user ro | Operator on shift"
          - "status enum:AgentTillStatus nn default=CLOSED ro | Status"
          - "currency currency nn | Currency"
          - "opened_at ts ro | Shift start"
          - "closed_at ts ro | Shift end"
          - "opening_cash amount ro | Declared cash at opening"
          - "cash_in_total amount ro | Cash received from customers during the shift (cash-in)"
          - "cash_out_total amount ro | Cash paid to customers during the shift (cash-out)"
          - "expected_cash amount ro | Opening cash + cash-in - cash-out"
          - "declared_cash amount ro | Declared cash at closing"
          - "variance amount ro | Declared minus expected"
          - "variance_status enum:TillVarianceStatus ro | Balanced, over or short"
          - "denominations json ro | Cash count by denomination, e.g. {\"1000\": 12, \"500\": 3}"

      - name: agent_device
        prefix: adv
        description: A POS terminal or phone used by an agent
        fr: [WAL-02, ONB-07]
        columns:
          - "agent_id uuid nn fk=agent idx | Agent"
          - "agent_outlet_id uuid fk=agent_outlet | Outlet"
          - "device_type enum:AgentDeviceType nn | Device type"
          - "serial_number string(64) nn uq | Serial number"
          - "imei string(20) | IMEI"
          - "model string(64) | Model"
          - "os_version string(32) | OS version"
          - "app_version string(32) | Agent app version"
          - "sim_msisdn phone | SIM number"
          - "status enum:AgentDeviceStatus nn default=ACTIVE ro | Status"
          - "status_reason string(255) ro | Reason for the current status"
          - "assigned_at ts | Assignment time"
          - "last_seen_at ts ro | Last heartbeat"
          - "last_latitude rate ro | Last known latitude"
          - "last_longitude rate ro | Last known longitude"

      - name: agent_kyc_document
        prefix: akd
        description: KYB document held for an agent (licence, tax certificate, contract)
        fr: [ONB-04, ONB-06]
        columns:
          - "agent_id uuid nn fk=agent idx | Agent"
          - "document_type string(48) nn | BUSINESS_LICENSE, TAX_CERTIFICATE, ID, PROOF_OF_ADDRESS, CONTRACT"
          - "document_id uuid nn ref=document | Stored document"
          - "expires_at date | Expiry date"
          - "verified bool nn default=false ro | Verified"
          - "verified_by string(64) ro | Verifier"
          - "verified_at ts ro | Verification time"

      - name: cash_management_request
        prefix: cmr
        description: Cash-in-transit delivery or pickup request for an outlet
        fr: [WAL-02]
        columns:
          - "agent_outlet_id uuid nn fk=agent_outlet idx | Outlet"
          - "request_type enum:CashRequestType nn | Delivery or pickup"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "denominations json | Requested denominations"
          - "requested_for ts | Requested time"
          - "status enum:FloatRequestStatus nn default=REQUESTED ro | Status"
          - "cit_provider string(64) | Cash-in-transit company"
          - "cit_reference string(64) | CIT reference"
          - "approved_by string(64) ro | Approver"
          - "completed_at ts ro | Completion time"
          - "cancel_reason string(255) ro | Cancellation reason"

      - name: agent_performance_daily
        prefix: apd
        description: Daily KPIs per agent and outlet (append-only)
        immutable: true
        fr: [WAL-02, WAL-04]
        columns:
          - "agent_id uuid nn fk=agent idx | Agent"
          - "agent_outlet_id uuid fk=agent_outlet | Outlet"
          - "business_date date nn | Business date"
          - "currency currency nn | Currency"
          - "cash_in_count int nn default=0 | Cash-in transactions"
          - "cash_in_amount amount nn default=0 | Cash-in value"
          - "cash_out_count int nn default=0 | Cash-out transactions"
          - "cash_out_amount amount nn default=0 | Cash-out value"
          - "onboarding_count int nn default=0 | Customers registered"
          - "bill_pay_count int nn default=0 | Bill payments"
          - "commission_earned amount nn default=0 | Commission earned"
          - "active_customers int nn default=0 | Distinct customers served"
        unique: [[agent_id, agent_outlet_id, business_date]]

      # ---------------------------------------------------------------- WE-HIER-1: configurable Domain -> Category -> Grade (G-06)
      - name: distribution_domain
        prefix: ddm
        description: >
          WE-HIER-1 (MQ-DOM-1/2): a top-level distribution domain of the configurable agent/customer hierarchy
          (e.g. the factory "Distribution" domain). Maker-checker; the code is permanent.
        fr: [WAL-01, WAL-02]
        columns:
          - "code string(32) nn | Domain code (permanent; immutability enforced in-service)"
          - "name string(120) nn | Name"
          - "description text | Description"
          - "priority int nn default=100 | Lower wins when domains are otherwise equal"
          - "status enum:HierarchyConfigStatus nn default=DRAFT ro | Maker-checker lifecycle status"
          - "submitted_by string(64) ro | Maker who submitted the domain"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejection_reason string(255) ro | Reason the last submission was rejected"
          - "retired_at ts ro | Retirement time"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"
          - "metadata json | Client-defined key/value metadata"
        unique: [[tenant_id, code]]

      - name: domain_category
        prefix: dct
        description: >
          WE-HIER-1 (MQ-HIER-1/2): an n-level category inside a distribution domain. A root category (level 1) is the
          domain owner; deeper levels report to a parent category (derived level, cycle-guarded). Maker-checker.
        fr: [WAL-01, WAL-02]
        columns:
          - "distribution_domain_id uuid nn fk=distribution_domain idx | Owning domain"
          - "code string(32) nn | Category code (permanent; immutability enforced in-service)"
          - "name string(120) nn | Name"
          - "description text | Description"
          - "parent_category_id uuid fk=domain_category idx | Parent category (empty = level-1 owner of the domain)"
          - "level int nn default=1 ro | Depth in the chain (derived: 1 for an owner, parent.level + 1 otherwise)"
          - "is_owner bool nn default=false ro | True for the single level-1 owner category of the domain"
          - "priority int nn default=100 | Lower wins among sibling categories"
          - "status enum:HierarchyConfigStatus nn default=DRAFT ro | Maker-checker lifecycle status"
          - "submitted_by string(64) ro | Maker who submitted the category"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejection_reason string(255) ro | Reason the last submission was rejected"
          - "retired_at ts ro | Retirement time"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"
        unique: [[tenant_id, distribution_domain_id, code]]

      - name: category_service_preference
        prefix: csp
        description: >
          WE-HIER-1 (MQ-DOM-2): the service map of a category per bearer role (payer / payee / initiator); which
          financial transaction types or non-financial services the category may perform.
        fr: [WAL-01, WAL-02]
        columns:
          - "domain_category_id uuid nn fk=domain_category idx | Category"
          - "bearer_role enum:BearerRole nn | Role this preference applies to (PAYER, PAYEE, INITIATOR)"
          - "service_class enum:ServiceClass nn | FINANCIAL or NON_FINANCIAL"
          - "txn_type enum:WalletTxnType | Financial transaction type (empty = any; FINANCIAL only)"
          - "non_financial_service enum:NonFinancialService | Non-financial service (NON_FINANCIAL only)"
          - "allowed bool nn default=true | Whether the service is allowed (false = explicitly denied)"
          - "priority int nn default=100 | Lower wins among overlapping preferences"
          - "status enum:HierarchyConfigStatus nn default=ACTIVE ro | Lifecycle status (covered by its category's approval)"
          - "submitted_by string(64) ro | Maker"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (via the owning category)"
        unique: [[tenant_id, domain_category_id, bearer_role, service_class, txn_type, non_financial_service]]

      - name: grade
        prefix: grd
        description: >
          WE-HIER-1 (MQ-GRADE-1/2): a grade within a category (the finest classification of an agent, wallet or
          merchant). Exactly one grade per tenant is the un-registered grade (default for un-onboarded holders).
          Maker-checker; the code is permanent; a grade cannot be deleted while referenced.
        fr: [WAL-01, WAL-02]
        columns:
          - "domain_category_id uuid nn fk=domain_category idx | Category this grade belongs to"
          - "code string(32) nn | Grade code (permanent; immutability enforced in-service)"
          - "name string(120) nn | Name"
          - "description text | Description"
          - "priority int nn default=100 | Lower wins among grades of a category"
          - "is_unregistered bool nn default=false | The singleton un-registered grade (one per tenant)"
          - "default_commission_plan_id uuid ref=commission_plan | Commission plan applied to holders of this grade by default"
          - "status enum:HierarchyConfigStatus nn default=DRAFT ro | Maker-checker lifecycle status"
          - "submitted_by string(64) ro | Maker who submitted the grade"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejection_reason string(255) ro | Reason the last submission was rejected"
          - "retired_at ts ro | Retirement time"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"
          - "metadata json | Client-defined key/value metadata"
        unique: [[tenant_id, code]]

      - name: grade_service
        prefix: grs
        description: >
          WE-HIER-1 (MQ-GRADE-2): the service map of a grade; which financial transaction types or non-financial
          services a grade may perform, optionally per bearer role. Narrows the category's preferences.
        fr: [WAL-01, WAL-02]
        columns:
          - "grade_id uuid nn fk=grade idx | Grade"
          - "service_class enum:ServiceClass nn | FINANCIAL or NON_FINANCIAL"
          - "txn_type enum:WalletTxnType | Financial transaction type (empty = any; FINANCIAL only)"
          - "non_financial_service enum:NonFinancialService | Non-financial service (NON_FINANCIAL only)"
          - "bearer_role enum:BearerRole | Role (empty = any)"
          - "allowed bool nn default=true | Whether the service is allowed"
          - "priority int nn default=100 | Lower wins among overlapping services"
          - "status enum:HierarchyConfigStatus nn default=ACTIVE ro | Lifecycle status (covered by its grade's approval)"
          - "submitted_by string(64) ro | Maker"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (via the owning grade)"
        unique: [[tenant_id, grade_id, service_class, txn_type, non_financial_service, bearer_role]]

      # ---------------------------------------------------------------- WE-FLOAT-1: operator stock / e-money float (G-02)
      - name: stock_operation
        prefix: sto
        description: >
          WE-FLOAT-1 (MQ-STK-1/4/14): an operator-level e-money stock operation. STOCK_CREATION mints e-money against a
          physical bank deposit (DEBIT 1150 bank clearing / CREDIT the capital pool wallet IND01); REIMBURSEMENT converts
          e-money back to cash (DEBIT the entity wallet / CREDIT capital, then DEBIT capital / CREDIT 1150). Maker-checker;
          money moves only on approval; idempotent retry on an unknown (5xx) wallet-service outcome. Account roles are
          per-tenant config (namespace ledger, key agent-network-service): bank_clearing, capital_wallet_id.
        fr: [WAL-02]
        columns:
          - "operation_type enum:StockOperationType nn | Stock creation or reimbursement"
          - "instrument enum:StockInstrument nn | Funding instrument (cash, cheque, demand draft, bank transfer)"
          - "entity_wallet_id uuid ref=wallet | Business-user / agent wallet debited on reimbursement (empty for stock creation)"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "bank_reference string(64) | Bank deposit / instrument reference"
          - "proof_document_id uuid ref=document | Deposit slip / cheque image"
          - "status enum:StockOperationStatus nn default=REQUESTED ro | Status"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "capital_wallet_id uuid ref=wallet ro | Capital pool wallet (IND01) resolved at approval from config"
          - "bank_clearing_ledger_account_id uuid ref=ledger_account ro | Bank clearing GL (1150) resolved at approval from config"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Capital-leg transaction (creation credit / reimbursement entity->capital)"
          - "bank_wallet_transaction_id uuid ref=wallet_transaction ro | Bank-clearing leg transaction (reimbursement capital->1150)"
          - "completed_at ts ro | Execution time"
          - "rejection_reason string(255) ro | Rejection or cancellation reason"
          - "failure_reason string(255) ro | Execution failure reason"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"
          - "idempotency_key string(128) ro | Idempotency-Key of the create request (lets a client reconcile an unknown outcome)"
        unique: [[tenant_id, idempotency_key]]

      - name: stock_sweep_run
        prefix: ssr
        description: >
          WE-FLOAT-1 (MQ-STK-6): an auto-deallocation batch. /plan builds a PENDING_APPROVAL run of float wallets whose
          balance exceeds their min residual; a checker approves (money never moves unattended, even when the scheduler
          built the plan) and each candidate is swept float -> trust (2700). Per-line idempotent.
        fr: [WAL-02]
        columns:
          - "currency currency nn | Currency of the swept float wallets"
          - "min_residual amount | Minimum residual balance kept per wallet (default from config / agent_float.min_balance)"
          - "status enum:SweepRunStatus nn default=PENDING_APPROVAL ro | Status"
          - "triggered_by string(32) nn default=MANUAL | SCHEDULER or MANUAL"
          - "candidate_count int ro | Float wallets above their residual"
          - "total_amount amount ro | Total sweepable amount"
          - "swept_count int ro | Wallets swept"
          - "swept_amount amount ro | Amount swept"
          - "failed_count int ro | Wallets whose sweep failed"
          - "trust_ledger_account_id uuid ref=ledger_account ro | Trust GL (2700) resolved at approval from config"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "cancel_reason string(255) ro | Cancellation / rejection reason"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"

      - name: stock_sweep_line
        prefix: ssl
        description: Amount swept from one float wallet to trust in an auto-deallocation run. Append-only; a retry appends a new line.
        immutable: true
        fr: [WAL-02]
        columns:
          - "stock_sweep_run_id uuid nn fk=stock_sweep_run idx | Run"
          - "float_wallet_id uuid nn ref=wallet | Float wallet swept"
          - "agent_id uuid ref=agent | Owning agent"
          - "balance_before amount nn | Float balance before the sweep"
          - "min_residual amount nn | Residual kept"
          - "amount amount nn | Amount swept to trust"
          - "currency currency nn | Currency"
          - "line_status enum:SweepLineStatus nn | SWEPT, FAILED or SKIPPED"
          - "wallet_transaction_id uuid ref=wallet_transaction | Sweep transaction (float -> trust)"
          - "failure_reason string(255) | Failure reason"

      - name: unclaimed_settlement_run
        prefix: usr
        description: >
          WE-FLOAT-1 (MQ-STK-13): aging of unregistered / unclaimed e-money. /plan builds a PENDING_APPROVAL run; a checker
          approves and GL->GL journals post via ledger-service: suspense 2710 -> unclaimed 2720 after suspense_age_days,
          then unclaimed 2720 -> capital (IND01) or income (IND03) after unclaimed_age_days.
        fr: [WAL-02]
        columns:
          - "currency currency nn | Currency"
          - "suspense_age_days int nn | Days in suspense before -> unclaimed"
          - "unclaimed_age_days int nn | Days in unclaimed before -> final destination"
          - "settle_to string(16) nn default=CAPITAL | Final destination of aged unclaimed funds: CAPITAL (IND01) or INCOME (IND03)"
          - "status enum:SweepRunStatus nn default=PENDING_APPROVAL ro | Status"
          - "line_count int ro | Journal lines planned"
          - "total_amount amount ro | Total amount aged"
          - "settled_count int ro | Lines posted"
          - "settled_amount amount ro | Amount posted"
          - "failed_count int ro | Lines whose posting failed"
          - "suspense_ledger_account_id uuid ref=ledger_account ro | Suspense GL (2710) resolved at approval"
          - "unclaimed_ledger_account_id uuid ref=ledger_account ro | Unclaimed GL (2720) resolved at approval"
          - "capital_ledger_account_id uuid ref=ledger_account ro | Capital GL (IND01) resolved at approval"
          - "income_ledger_account_id uuid ref=ledger_account ro | Income GL (IND03) resolved at approval"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "cancel_reason string(255) ro | Cancellation / rejection reason"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"

      - name: unclaimed_settlement_line
        prefix: usl
        description: One GL->GL journal posted by an unclaimed-settlement run. Append-only; a retry appends a new line.
        immutable: true
        fr: [WAL-02]
        columns:
          - "unclaimed_settlement_run_id uuid nn fk=unclaimed_settlement_run idx | Run"
          - "stage enum:UnclaimedSettlementStage nn | Aging stage posted by this line"
          - "source_ledger_account_id uuid nn ref=ledger_account | Debited account"
          - "target_ledger_account_id uuid nn ref=ledger_account | Credited account"
          - "amount amount nn | Amount posted"
          - "currency currency nn | Currency"
          - "line_status enum:SweepLineStatus nn | SWEPT, FAILED or SKIPPED"
          - "journal_entry_id uuid ref=journal_entry | Resulting ledger journal entry"
          - "failure_reason string(255) | Failure reason"

    apis:
      - resource: agents
        path: /v1/agents
        table: agent
        ops: [list, get, create, update]
        filters: [agent_level, parent_agent_id, super_agent_id, status, agent_territory_id, agent_code, risk_rating, customer_id]
        actions:
          - "POST /{id}/activate | Activate an onboarded or suspended agent (checker differs from the creator; at least one verified KYB document); opens float and commission wallets on first activation | comment string(500)"
          - "POST /{id}/suspend | Suspend the agent and its wallets | reason string(255) nn"
          - "POST /{id}/terminate | Terminate the agency contract (no active sub-agents, zero float) | reason string(255) nn, effective_date date"
          - "POST /{id}/assign-commission-plan | Assign an active commission plan | commission_plan_id uuid nn, effective_from date nn"
          - "POST /{id}/assign-grade | WE-HIER-1: place the agent on an ACTIVE grade (and its category/domain) of the configurable hierarchy | grade_id uuid nn, reason string(255)"
          - "POST /{id}/move | WE-HIER-1: move the agent to another category (and optionally grade) within the same domain (single move; bulk is a fast-follow) | category_id uuid nn, grade_id uuid, reason string(255)"
          - "GET /{id}/sub-agents | Direct children in the hierarchy | | agent[]"
          - "GET /{id}/hierarchy | Upline (parent chain to the super-agent) and downline tree: {agent, upline[], downline[{agent, children[]}]} | | object"
          - "GET /{id}/outlets | Outlets of the agent | | agent_outlet[]"
          - "GET /{id}/float | Float positions | | agent_float[]"
          - "GET /{id}/performance?from:date&to:date | Daily KPIs in a date range | | agent_performance_daily[]"
          - "POST /eod/performance?business_date:date! | End of day - aggregate daily KPIs per agent and outlet from wallet transactions and commission earnings (idempotent per business date) | | object"

      - resource: agent-territories
        path: /v1/agent-territories
        table: agent_territory
        ops: [list, get, create, update]
        filters: [parent_id, territory_level, country, manager_user_id, code]

      - resource: agent-outlets
        path: /v1/agent-outlets
        table: agent_outlet
        ops: [list, get, create, update]
        filters: [agent_id, status, agent_territory_id, city, outlet_code]
        actions:
          - "GET /nearby?lat:rate!&lon:rate!&radius_m:int&service:enum:AgentService | Active outlets of active agents within radius_m (default 5000, max 50000) of a point, nearest first (Haversine) | | agent_outlet[]"
          - "POST /{id}/close | Close the outlet (no open tills) | reason string(255) nn"

      - resource: agent-floats
        path: /v1/agent-floats
        table: agent_float
        ops: [list, get, create, update]
        filters: [agent_id, agent_outlet_id, wallet_id]
        actions:
          - "POST /{id}/check | Read the float balance from the ledger, raise the low-float alert and request an automatic rebalance when due: {balance, available, status, alert_raised, rebalance_request_id} | | object"

      - resource: agent-float-requests
        path: /v1/agent-float-requests
        table: agent_float_request
        ops: [list, get, create]
        filters: [request_type, requesting_agent_id, source_agent_id, status, idempotency_key]
        actions:
          - "POST /{id}/approve | Approve (checker differs from the maker) and execute the float movement in wallet-service | comment string(500)"
          - "POST /{id}/reject | Reject the request | reason string(255) nn"
          - "POST /{id}/cancel | Cancel a pending request | reason string(255)"

      - resource: agent-tills
        path: /v1/agent-tills
        table: agent_till
        ops: [list, get, create]
        filters: [agent_outlet_id, status, operator_user_id, till_number]
        actions:
          - "POST /{id}/open | Open the till for a shift with an opening cash count | operator_user_id uuid nn, opening_cash amount nn, denominations json"
          - "POST /{id}/close | Close the till with a cash count; expected cash comes from the shift's cash-in/cash-out transactions | declared_cash amount nn, denominations json"

      - resource: agent-devices
        path: /v1/agent-devices
        table: agent_device
        ops: [list, get, create, update]
        filters: [agent_id, agent_outlet_id, status, device_type, serial_number]
        actions:
          - "POST /{id}/heartbeat | Record a heartbeat with the last known location | latitude rate, longitude rate, app_version string(32)"
          - "POST /{id}/report-lost | Report a device lost and block it | reason string(255)"
          - "POST /{id}/retire | Retire a device | reason string(255)"

      - resource: agent-kyc-documents
        path: /v1/agent-kyc-documents
        table: agent_kyc_document
        ops: [list, get, create, delete]
        filters: [agent_id, document_type, verified]
        actions:
          - "POST /{id}/verify | Mark the document verified (checker differs from the uploader; not expired) | comment string(500)"

      - resource: cash-management-requests
        path: /v1/cash-management-requests
        table: cash_management_request
        ops: [list, get, create, update]
        filters: [agent_outlet_id, request_type, status]
        actions:
          - "POST /{id}/approve | Approve the cash-in-transit request (checker differs from the maker) | comment string(500)"
          - "POST /{id}/complete | Confirm the cash delivery or pickup | cit_reference string(64)"
          - "POST /{id}/cancel | Cancel the request | reason string(255)"

      # ---------------------------------------------------------------- WE-HIER-1: hierarchy configuration
      - resource: distribution-domains
        path: /v1/distribution-domains
        table: distribution_domain
        ops: [list, get, create, update]
        filters: [status, code]
        actions:
          - "POST /{id}/submit | Submit a draft domain for approval"
          - "POST /{id}/approve | Approve and activate the domain (checker differs from the submitter) | comment string(500)"
          - "POST /{id}/reject | Return a submitted domain to draft | reason string(255) nn"
          - "POST /{id}/retire | Retire the domain | | distribution_domain"
          - "GET /{id}/categories | The domain's category tree: {domain, categories[{category, children[]}]} | | object"

      - resource: domain-categories
        path: /v1/domain-categories
        table: domain_category
        ops: [list, get, create, update]
        filters: [distribution_domain_id, parent_category_id, status, level, is_owner, code]
        actions:
          - "POST /{id}/submit | Submit a draft category for approval"
          - "POST /{id}/approve | Approve and activate the category (checker differs from the submitter) | comment string(500)"
          - "POST /{id}/reject | Return a submitted category to draft | reason string(255) nn"
          - "POST /{id}/retire | Retire the category | | domain_category"
          - "GET /{id}/categories | The subtree rooted at this category: {category, children[]} | | object"
          - "GET /{id}/service-preferences | Service preferences of the category | | category_service_preference[]"

      - resource: category-service-preferences
        path: /v1/category-service-preferences
        table: category_service_preference
        ops: [list, get, create, update, delete]
        filters: [domain_category_id, bearer_role, service_class, txn_type, non_financial_service, allowed]

      - resource: grades
        path: /v1/grades
        table: grade
        ops: [list, get, create, update, delete]
        filters: [domain_category_id, status, is_unregistered, code]
        actions:
          - "GET /unregistered | The tenant's un-registered grade (lazily bootstrapped so it never 404s) | | grade"
          - "POST /{id}/submit | Submit a draft grade for approval"
          - "POST /{id}/approve | Approve and activate the grade (checker differs from the submitter) | comment string(500)"
          - "POST /{id}/reject | Return a submitted grade to draft | reason string(255) nn"
          - "POST /{id}/retire | Retire the grade | | grade"
          - "GET /{id}/services | Services of the grade | | grade_service[]"

      - resource: grade-services
        path: /v1/grade-services
        table: grade_service
        ops: [list, get, create, update, delete]
        filters: [grade_id, service_class, txn_type, non_financial_service, bearer_role, allowed]

      # ---------------------------------------------------------------- WE-FLOAT-1: operator stock / e-money float
      - resource: stock-operations
        path: /v1/stock-operations
        table: stock_operation
        ops: [list, get, create]
        filters: [operation_type, instrument, status, entity_wallet_id, idempotency_key]
        actions:
          - "POST /{id}/approve | Approve (checker differs from the maker) and post the stock operation legs in wallet-service | comment string(500)"
          - "POST /{id}/reject | Reject the operation | reason string(255) nn"
          - "POST /{id}/cancel | Cancel a pending operation | reason string(255)"

      - resource: stock-sweep-runs
        path: /v1/stock-sweep-runs
        table: stock_sweep_run
        ops: [list, get]
        filters: [status, currency, triggered_by]
        actions:
          - "POST /plan | Build a PENDING_APPROVAL auto-deallocation run of float wallets above their min residual (idempotent per key) | currency currency nn, min_residual amount | stock_sweep_run"
          - "POST /{id}/approve | Approve (checker differs from the maker) and sweep each candidate float wallet to the trust account | comment string(500)"
          - "POST /{id}/reject | Reject (cancel) a run awaiting approval | reason string(255) nn"
          - "GET /{id}/lines | Lines of the run | | stock_sweep_line[]"

      - resource: unclaimed-settlements
        path: /v1/unclaimed-settlements
        table: unclaimed_settlement_run
        ops: [list, get]
        filters: [status, currency]
        actions:
          - "POST /plan | Build a PENDING_APPROVAL unclaimed-settlement run aging suspense to unclaimed and unclaimed to capital/income (idempotent per key) | currency currency nn, suspense_age_days int, unclaimed_age_days int, settle_to string(16) | unclaimed_settlement_run"
          - "POST /{id}/approve | Approve (checker differs from the maker) and post the aging journals via ledger-service | comment string(500)"
          - "POST /{id}/reject | Reject (cancel) a run awaiting approval | reason string(255) nn"
          - "GET /{id}/lines | Lines of the run | | unclaimed_settlement_line[]"

    events:
      - "wallets.agent.onboarded | agent | An agent was activated"
      - "wallets.agent.status_changed | agent | An agent was suspended, reactivated or terminated"
      - "wallets.agent.commission_plan_assigned | agent | A commission plan was assigned to an agent"
      - "wallets.agent_outlet.closed | agent_outlet | An outlet was closed"
      - "wallets.agent_float.low_balance | agent_float | A float wallet fell below its alert threshold"
      - "wallets.agent_float_request.approved | agent_float_request | A float request was approved and executed"
      - "wallets.agent_float_request.rejected | agent_float_request | A float request was rejected or cancelled"
      - "wallets.agent_till.opened | agent_till | A till was opened for a shift"
      - "wallets.agent_till.closed | agent_till | A till was closed with a cash count"
      - "wallets.agent_device.lost | agent_device | A device was reported lost"
      - "wallets.agent_kyc_document.verified | agent_kyc_document | An agent KYB document was verified"
      - "wallets.cash_management_request.completed | cash_management_request | A cash delivery or pickup was completed"
      - "wallets.distribution_domain.activated | distribution_domain | A distribution domain became active"
      - "wallets.distribution_domain.retired | distribution_domain | A distribution domain was retired"
      - "wallets.domain_category.activated | domain_category | A domain category became active"
      - "wallets.domain_category.retired | domain_category | A domain category was retired"
      - "wallets.grade.activated | grade | A grade became active"
      - "wallets.grade.retired | grade | A grade was retired"
      - "wallets.agent.grade_assigned | agent | A grade (and its category/domain) was assigned to an agent"
      - "wallets.agent.hierarchy_moved | agent | An agent was moved to another category/grade in the hierarchy"
      - "wallets.stock_operation.completed | stock_operation | A stock creation or reimbursement completed and was posted"
      - "wallets.stock_operation.rejected | stock_operation | A stock operation was rejected or cancelled"
      - "wallets.stock_sweep_run.completed | stock_sweep_run | An auto-deallocation sweep run finished"
      - "wallets.unclaimed_settlement.completed | unclaimed_settlement_run | An unclaimed-settlement run finished"

  # ------------------------------------------------------------------ commission-service
  - name: commission-service
    database: commission_db
    description: >
      Multi-level commission engine: versioned plans with rules by transaction type, channel, tier,
      agent level, territory and biller; real-time accrual on every completed transaction; periodic or
      real-time payout runs to commission wallets with tax withholding.
    tables:
      - name: commission_plan
        prefix: cpl
        description: A versioned set of commission rules assigned to agents, merchants or billers
        fr: [WAL-04]
        columns:
          - "code string(32) nn | Plan code"
          - "name string(120) nn | Name"
          - "description text | Description"
          - "version int nn default=1 ro | Version (a clone gets the next version of the code)"
          - "parent_plan_id uuid fk=commission_plan ro | Version this plan was cloned from"
          - "applies_to string(32) nn | AGENT, MERCHANT, BILLER, ALL"
          - "currency currency nn | Currency"
          - "payout_frequency enum:PayoutFrequency nn default=DAILY | Payout frequency"
          - "status enum:CommissionPlanStatus nn default=DRAFT ro | Status"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
          - "submitted_by string(64) ro | Maker who submitted the plan"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejection_reason string(255) ro | Reason the last submission was rejected"
          - "retired_at ts ro | Retirement time"
        unique: [[tenant_id, code, version]]

      - name: commission_rule
        prefix: crl
        description: One commission rule; the most specific matching rule per beneficiary wins
        fr: [WAL-04]
        columns:
          - "commission_plan_id uuid nn fk=commission_plan idx | Plan"
          - "name string(120) nn | Rule name"
          - "priority int nn default=100 | Lower wins among equally specific rules"
          - "txn_type enum:WalletTxnType nn | Transaction type"
          - "channel enum:WalletChannel | Channel (empty = any)"
          - "kyc_tier int | Customer KYC tier (empty = any)"
          - "agent_level enum:AgentLevel | Agent level of the transacting agent (empty = any)"
          - "category_id uuid ref=domain_category | WE-HIER-1: domain category of the transacting agent (empty = any)"
          - "grade_id uuid ref=grade | WE-HIER-1: grade of the transacting agent (empty = any)"
          - "agent_territory_id uuid ref=agent_territory | Territory of the transacting agent (empty = any)"
          - "biller_id uuid ref=biller | Biller (empty = any)"
          - "min_amount amount | Applies from this transaction amount"
          - "max_amount amount | Applies up to this transaction amount"
          - "basis enum:CommissionBasis nn | Calculation basis"
          - "flat_amount amount | Flat commission"
          - "percentage rate | Percentage of the base (0.005 = 0.5%)"
          - "tiers json[] | Tier table for TIERED basis: [{from, to, flat, percentage}]"
          - "cap_amount amount | Maximum commission per transaction"
          - "base string(16) nn default=FEE | Base of the percentage: AMOUNT or FEE"
          - "beneficiary enum:CommissionBeneficiary nn | Who earns it (AGENT = transacting agent, SUB_AGENT / SUPER_AGENT resolved through the hierarchy)"
          - "beneficiary_wallet_id uuid ref=wallet | Fixed wallet credited for PLATFORM, BILLER or CUSTOMER beneficiaries"
          - "beneficiary_share rate nn default=1 | Share of the computed commission for this beneficiary"
          - "funded_by string(32) nn default=FEE | FEE, PLATFORM, BILLER, MERCHANT"
          - "tax_withholding_rate rate | Withholding tax on commission"
          - "tier_mode enum:SlabMode nn default=BAND | WE-PRICE-1 (PE-7): BAND = band charges the whole base (today); TELESCOPIC = sum of per-slice charges"
          - "charge_scope enum:ChargeScope nn default=INSTRUMENT | WE-PRICE-1 (PE-7): INSTRUMENT = this transaction; CUMULATIVE = f(cumulative_before + base) - f(cumulative_before)"
          - "accumulation_period enum:AccumulationPeriod | WE-PRICE-1 (PE-7): window a CUMULATIVE commission accumulates over (empty = LIFETIME)"
          - "charge_direction enum:ChargeDirection | WE-PRICE-1 (PE-7): side the commission applies to (empty = any)"
          - "milestone_from_nth int | WE-PRICE-1 (PE-18): applies from the nth matching transaction in the window (inclusive; empty = no milestone gate)"
          - "milestone_to_nth int | WE-PRICE-1 (PE-18): applies up to the nth matching transaction (inclusive; empty = unbounded)"
          - "milestone_period enum:MilestonePeriod | WE-PRICE-1 (PE-18): window the nth count is measured in (empty = LIFETIME)"
          - "milestone_count_scope string(32) | WE-PRICE-1 (PE-18): count scope (SERVICE = this txn_type, ALL = any; empty = SERVICE)"
          - "remote_txn_type enum:RemoteTxnType | WE-PRICE-1 (PE-16): applies only to this onsite/offsite classification (empty = any)"
          - "inactive_customer_only bool nn default=false | WE-PRICE-1 (PE-13): rule fires only when the credited customer is inactive"
          - "inactive_days int | WE-PRICE-1 (PE-13): days of inactivity that qualify the customer as inactive"
          - "reward_trigger enum:InactiveRewardTrigger | WE-PRICE-1 (PE-13): when the reward is released (IMMEDIATE, AFTER_FIRST_DEBIT, AFTER_DURATION)"
          - "reward_delay_days int | WE-PRICE-1 (PE-13): delay in days for AFTER_DURATION release"
          - "share_enabled bool nn default=false | WE-PRICE-1 (PE-14): this rule participates in a Merchant->Aggregator->SP commission-sharing split (CP/CR journal posted at accrual)"
          - "is_active bool nn default=true | Active"

      - name: commission_earning
        prefix: cer
        description: Commission accrued for one beneficiary on one transaction. Append-only; clawbacks are negative rows.
        immutable: true
        fr: [WAL-04]
        columns:
          - "commission_plan_id uuid fk=commission_plan idx | Plan (empty for a joining-commission earning, PE-11)"
          - "commission_rule_id uuid fk=commission_rule idx | Rule applied (empty for a joining-commission earning, PE-11)"
          - "wallet_transaction_id uuid ref=wallet_transaction idx | Source transaction (empty for a REGISTER joining-commission earning, PE-11)"
          - "txn_type enum:WalletTxnType | Transaction type (empty for a REGISTER joining-commission earning, PE-11)"
          - "beneficiary enum:CommissionBeneficiary nn | Beneficiary type"
          - "joining_commission_id uuid fk=joining_commission | WE-PRICE-1 (PE-11): joining-commission configuration this earning came from"
          - "joining_milestone enum:JoiningMilestone | WE-PRICE-1 (PE-11): which joining milestone fired (REGISTER, FIRST_CASH_IN, FIRST_DEBIT)"
          - "beneficiary_agent_id uuid ref=agent idx | Agent beneficiary"
          - "beneficiary_merchant_id uuid ref=merchant | Merchant beneficiary"
          - "beneficiary_wallet_id uuid nn ref=wallet idx | Wallet to pay"
          - "base_amount amount nn | Base the commission was computed on"
          - "commission_amount amount nn | Gross commission (negative for clawback)"
          - "tax_amount amount nn default=0 | Withholding tax"
          - "net_amount amount nn | Net commission"
          - "currency currency nn | Currency"
          - "payout_frequency enum:PayoutFrequency nn | Payout frequency of the plan"
          - "is_clawback bool nn default=false | Clawback of an earlier earning (reversal)"
          - "clawback_of_id uuid fk=commission_earning | Earning clawed back"
          - "share_group_id uuid idx | WE-PRICE-1 (PE-14): groups the earnings of one commission-sharing split (reversed together)"
          - "share_role string(32) | WE-PRICE-1 (PE-14): role in the sharing split (MERCHANT, AGGREGATOR, SERVICE_PROVIDER)"
          - "ledger_entry_id uuid ref=journal_entry | WE-PRICE-1 (PE-14): CP/CR ledger journal entry posted for this shared earning"
          - "earned_at ts nn | Transaction completion time"
          - "payout_due_on date nn | Payout date per plan frequency"
        unique: [[wallet_transaction_id, commission_rule_id, beneficiary_wallet_id, is_clawback]]

      - name: joining_commission
        prefix: jcm
        description: >
          WE-PRICE-1 (PE-11): joining-commission configuration rewarding the registering business user for a new
          customer's registration, first cash-in and first debit. Maker-checker (clones the commission_plan approval
          lifecycle). Each milestone carries its own amount; payout goes to the registering agent's commission wallet.
        fr: [WAL-04]
        columns:
          - "code string(32) nn | Configuration code"
          - "name string(120) nn | Name"
          - "currency currency nn | Currency"
          - "applies_to_grade_id uuid ref=grade | Grade of the new customer this applies to (empty = any)"
          - "applies_to_category_id uuid ref=domain_category | Category of the new customer this applies to (empty = any)"
          - "register_amount amount nn default=0 | Reward when the customer is registered/activated (REGISTER)"
          - "first_cash_in_amount amount nn default=0 | Reward on the customer's first cash-in (FIRST_CASH_IN)"
          - "first_debit_amount amount nn default=0 | Reward on the customer's first debit (FIRST_DEBIT)"
          - "beneficiary enum:CommissionBeneficiary nn default=AGENT | Who is rewarded (AGENT = the registering business user)"
          - "tax_withholding_rate rate | Withholding tax on the joining commission"
          - "status enum:CommissionPlanStatus nn default=DRAFT ro | Maker-checker lifecycle status"
          - "submitted_by string(64) ro | Maker who submitted the configuration"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejection_reason string(255) ro | Reason the last submission was rejected"
          - "retired_at ts ro | Retirement time"
          - "approval_request_id uuid ro ref=approval_request | Central approval request (workflow-service)"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
        unique: [[tenant_id, code]]

      - name: customer_milestone_state
        prefix: cms
        description: >
          WE-PRICE-1 (PE-11): one row per customer wallet tracking the fire-once joining-commission milestones. Each
          *_earning_id is set exactly once (the first time the milestone fires) under a per-wallet advisory lock.
        immutable: false
        fr: [WAL-04]
        columns:
          - "customer_wallet_id uuid nn ref=wallet uq | Customer wallet"
          - "joining_commission_id uuid fk=joining_commission | Configuration applied"
          - "registering_agent_id uuid ref=agent | Business user who registered the customer (wallet.opened_by_agent_id)"
          - "register_earning_id uuid fk=commission_earning ro | Earning created for REGISTER (set-once)"
          - "first_cash_in_earning_id uuid fk=commission_earning ro | Earning created for FIRST_CASH_IN (set-once)"
          - "first_debit_earning_id uuid fk=commission_earning ro | Earning created for FIRST_DEBIT (set-once)"
          - "registered_at ts ro | When REGISTER fired"
          - "first_cash_in_at ts ro | When FIRST_CASH_IN fired"
          - "first_debit_at ts ro | When FIRST_DEBIT fired"

      - name: pending_commission_reward
        prefix: pcr
        description: >
          WE-PRICE-1 (PE-13): a cash-in-to-inactive-customer reward held for deferred release (AFTER_FIRST_DEBIT or
          AFTER_DURATION). The EOD POST /pending-commission-rewards/release-due turns due rewards into earnings.
        fr: [WAL-04]
        columns:
          - "wallet_transaction_id uuid nn ref=wallet_transaction idx | Source transaction"
          - "commission_plan_id uuid nn fk=commission_plan | Plan"
          - "commission_rule_id uuid nn fk=commission_rule | Rule"
          - "customer_wallet_id uuid ref=wallet idx | Inactive customer credited"
          - "beneficiary enum:CommissionBeneficiary nn | Beneficiary type"
          - "beneficiary_agent_id uuid ref=agent | Agent beneficiary"
          - "beneficiary_wallet_id uuid nn ref=wallet | Wallet to pay"
          - "base_amount amount nn | Base the commission was computed on"
          - "commission_amount amount nn | Gross commission"
          - "tax_amount amount nn default=0 | Withholding tax"
          - "net_amount amount nn | Net commission"
          - "currency currency nn | Currency"
          - "payout_frequency enum:PayoutFrequency nn | Payout frequency of the plan"
          - "reward_trigger enum:InactiveRewardTrigger nn | Release trigger"
          - "release_due_on date | Earliest release date (AFTER_DURATION); null for AFTER_FIRST_DEBIT"
          - "status string(16) nn default=PENDING ro | PENDING, RELEASED, CANCELLED"
          - "released_earning_id uuid fk=commission_earning ro | Earning created on release"
          - "released_at ts ro | Release time"
        unique: [[wallet_transaction_id, commission_rule_id, beneficiary_wallet_id]]

      - name: commission_payout_run
        prefix: cpr
        description: A payout run paying accrued commissions to beneficiary wallets
        fr: [WAL-04]
        columns:
          - "payout_frequency enum:PayoutFrequency nn | Frequency covered"
          - "period_start date nn | Earnings due from"
          - "period_end date nn | Earnings due to (inclusive)"
          - "currency currency nn | Currency"
          - "status enum:CommissionPayoutRunStatus nn default=PENDING_APPROVAL ro | Status"
          - "earning_count int ro | Unpaid earnings included"
          - "beneficiary_count int ro | Beneficiaries to pay"
          - "total_amount amount ro | Total net to pay"
          - "paid_count int ro | Beneficiaries paid"
          - "paid_amount amount ro | Net paid"
          - "failed_count int ro | Beneficiaries whose payout failed"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "cancel_reason string(255) ro | Cancellation reason"
          - "journal_entry_id uuid ref=journal_entry ro | Summary posting (when paid as one ledger entry)"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"

      - name: commission_payout_line
        prefix: cpn
        description: Amount paid to one beneficiary in a payout run attempt. Append-only; a retry appends a new line.
        immutable: true
        fr: [WAL-04]
        columns:
          - "commission_payout_run_id uuid nn fk=commission_payout_run idx | Run"
          - "beneficiary_wallet_id uuid nn ref=wallet | Wallet paid"
          - "beneficiary_agent_id uuid ref=agent | Agent paid"
          - "attempt int nn default=1 | Attempt number for this beneficiary in the run"
          - "earning_count int nn | Earnings included"
          - "earning_ids uuid[] nn | Earnings settled by this line"
          - "gross_amount amount nn | Gross commission"
          - "tax_amount amount nn | Tax withheld"
          - "net_amount amount nn | Net paid"
          - "currency currency nn | Currency"
          - "payout_status enum:CommissionPayoutLineStatus nn | PAID or FAILED"
          - "wallet_transaction_id uuid ref=wallet_transaction | Payout transaction"
          - "failure_reason string(255) | Failure reason"

    apis:
      - resource: commission-plans
        path: /v1/commission-plans
        table: commission_plan
        ops: [list, get, create, update]
        filters: [status, applies_to, currency, code]
        actions:
          - "GET /{id}/rules | Rules of the plan | | commission_rule[]"
          - "POST /{id}/submit | Submit a draft plan with at least one active rule for approval"
          - "POST /{id}/approve | Approve and activate the plan (checker differs from the submitter); the previous active version of the code is retired | comment string(500)"
          - "POST /{id}/reject | Return a submitted plan to draft | reason string(255) nn"
          - "POST /{id}/retire | Retire the plan | effective_date date"
          - "POST /{id}/clone | Create a new draft version (rules copied) from this plan | | commission_plan"
          - "POST /{id}/simulate | Simulate commissions for a hypothetical transaction: {commission_plan_id, txn_type, amount, fee_amount, currency, total_commission, earnings[{commission_rule_id, beneficiary, beneficiary_agent_id, beneficiary_wallet_id, base_amount, commission_amount, tax_amount, net_amount}]} | txn_type enum:WalletTxnType nn, amount amount nn, fee_amount amount, channel enum:WalletChannel, agent_id uuid, kyc_tier int, biller_id uuid, remote_txn_type enum:RemoteTxnType, txn_count_daily int, txn_count_weekly int, txn_count_monthly int, txn_count_lifetime int, cumulative_amount_before amount | object"

      - resource: commission-rules
        path: /v1/commission-rules
        table: commission_rule
        ops: [list, get, create, update, delete]
        filters: [commission_plan_id, txn_type, beneficiary, is_active]

      - resource: commission-earnings
        path: /v1/commission-earnings
        table: commission_earning
        ops: [list, get]
        filters: [commission_plan_id, wallet_transaction_id, beneficiary_agent_id, beneficiary_wallet_id, beneficiary, payout_due_on, is_clawback]
        actions:
          - "POST /accrue | Accrue commissions for a completed wallet transaction, or claw them back for a REVERSED one (idempotent per transaction; also driven by wallets.wallet_transaction.completed / reversed events): {wallet_transaction_id, status, earnings[]} | wallet_transaction_id uuid nn, txn_type enum:WalletTxnType nn, status enum:WalletTxnStatus nn, amount amount nn, fee_amount amount, currency currency nn, channel enum:WalletChannel, kyc_tier int, agent_id uuid, merchant_id uuid, biller_id uuid, completed_at ts, remote_txn_type enum:RemoteTxnType, txn_count_daily int, txn_count_weekly int, txn_count_monthly int, txn_count_lifetime int, cumulative_amount_before amount, payee_wallet_id uuid, payee_kyc_tier int, customer_wallet_id uuid, opened_by_agent_id uuid, customer_inactive_days int | object"
          - "GET /summary?beneficiary_agent_id:uuid&beneficiary_wallet_id:uuid&from:date&to:date | Earned, clawed back and unpaid totals per beneficiary wallet and currency: {groups[{beneficiary_wallet_id, currency, earned, clawed_back, net, unpaid}]} | | object"
          - "POST /release-due?business_date:date! | WE-PRICE-1 (PE-13): release every pending inactive-customer reward due on or before the business date into commission earnings (idempotent per business date): {business_date, released, failed_ids} | | object"

      - resource: joining-commissions
        path: /v1/joining-commissions
        table: joining_commission
        ops: [list, get, create, update]
        filters: [status, currency, code]
        actions:
          - "POST /{id}/submit | Submit a draft joining-commission configuration for approval"
          - "POST /{id}/approve | Approve and activate the configuration (checker differs from the submitter; the previous active version of the code is retired) | comment string(500)"
          - "POST /{id}/reject | Return a submitted configuration to draft | reason string(255) nn"
          - "POST /{id}/retire | Retire the configuration | effective_date date"

      - resource: pending-commission-rewards
        path: /v1/pending-commission-rewards
        table: pending_commission_reward
        ops: [list, get]
        filters: [status, customer_wallet_id, beneficiary_wallet_id, reward_trigger, release_due_on]

      - resource: commission-payout-runs
        path: /v1/commission-payout-runs
        table: commission_payout_run
        ops: [list, get, create]
        filters: [status, payout_frequency, currency]
        actions:
          - "POST /{id}/approve | Approve (checker differs from the maker) and execute the payout run to the beneficiaries' commission wallets | comment string(500)"
          - "POST /{id}/cancel | Cancel a run awaiting approval | reason string(255)"
          - "POST /{id}/retry-failed | Retry beneficiaries whose payout failed"
          - "GET /{id}/lines | Lines of the run | | commission_payout_line[]"

    events:
      - "wallets.commission_plan.submitted | commission_plan | A commission plan was submitted for approval"
      - "wallets.commission_plan.activated | commission_plan | A commission plan version became active"
      - "wallets.commission_plan.retired | commission_plan | A commission plan version was retired"
      - "wallets.commission_earning.accrued | commission_earning | Commission was accrued (or clawed back) on a transaction"
      - "wallets.joining_commission.activated | joining_commission | WE-PRICE-1 (PE-11): a joining-commission configuration version became active"
      - "wallets.pending_commission_reward.released | pending_commission_reward | WE-PRICE-1 (PE-13): a deferred inactive-customer reward was released into an earning"
      - "wallets.commission_payout_run.approved | commission_payout_run | A commission payout run was approved"
      - "wallets.commission_payout_run.completed | commission_payout_run | A commission payout run finished"

  # ------------------------------------------------------------------ biller-service
  - name: biller-service
    database: biller_db
    description: >
      Biller catalogue (utilities, telecom, TV, government, education), airtime and bundle products,
      bill inquiry and validation, bill payments and airtime top-ups with provider integration and
      retries, and periodic settlement to billers.
    tables:
      - name: biller
        prefix: blr
        description: A company or agency that customers can pay bills to
        fr: [WAL-05]
        columns:
          - "biller_code string(32) nn uq | Biller code"
          - "name string(160) nn | Display name"
          - "category enum:BillerCategory nn | Category"
          - "country country nn | Country"
          - "currency currency nn | Currency"
          - "integration_type enum:BillerIntegration nn | How payments reach the biller"
          - "aggregator_name string(64) | Aggregator when integration is AGGREGATOR"
          - "connection_config json hide | Endpoint and credentials reference (secrets in Vault)"
          - "supports_inquiry bool nn default=true | Supports bill inquiry"
          - "supports_partial_payment bool nn default=false | Accepts less than the amount due"
          - "supports_overpayment bool nn default=false | Accepts more than the amount due"
          - "min_amount amount | Minimum payment"
          - "max_amount amount | Maximum payment"
          - "account_reference_label string(64) | Label shown to the customer, e.g. Meter number"
          - "account_reference_regex string(128) | Validation pattern (full match)"
          - "account_reference_checksum enum:BillerChecksum nn default=NONE | Check-digit algorithm of the account reference"
          - "inquiry_validity_minutes int nn default=30 | How long a bill inquiry can be paid against"
          - "settlement_wallet_id uuid ref=wallet | Biller collection wallet"
          - "settlement_frequency enum:SettlementFrequency nn default=DAILY | Settlement frequency"
          - "fee_bearer string(16) nn default=CUSTOMER | CUSTOMER, BILLER, SHARED"
          - "logo_document_id uuid ref=document | Logo"
          - "display_order int | Order in menus"
          - "status enum:BillerStatus nn default=ACTIVE ro | Status"
          - "status_reason string(255) ro | Reason for the current status"

      - name: biller_product
        prefix: bpr
        description: A fixed product sold through a biller (airtime denomination, data bundle, TV package)
        fr: [WAL-05]
        columns:
          - "biller_id uuid nn fk=biller idx | Biller"
          - "product_code string(32) nn | Provider product code"
          - "name string(160) nn | Name"
          - "product_type string(32) nn | AIRTIME, DATA_BUNDLE, TV_PACKAGE, TOKEN, FIXED_BILL"
          - "denomination amount | Fixed price (empty = open amount)"
          - "currency currency nn | Currency"
          - "validity_days int | Validity of the bundle"
          - "description string(500) | Description"
          - "is_active bool nn default=true | Active"
        unique: [[biller_id, product_code]]

      - name: bill_inquiry
        prefix: biq
        description: A bill lookup at the biller returning the customer name and amount due
        fr: [WAL-05]
        columns:
          - "biller_id uuid nn fk=biller idx | Biller"
          - "account_reference string(64) nn | Account / meter / policy number"
          - "customer_name string(160) pii ro | Name returned by the biller"
          - "amount_due amount ro | Amount due"
          - "currency currency ro | Currency"
          - "due_date date ro | Due date"
          - "inquiry_reference string(64) ro | Biller inquiry reference to quote on payment"
          - "response_code string(32) ro | Biller response code (00 = found)"
          - "response_message string(255) ro | Biller response text"
          - "expires_at ts ro | Inquiry validity (database clock)"
          - "raw_response json hide | Raw biller response"

      - name: biller_settlement
        prefix: bst
        description: Settlement of collected bill payments to a biller for a period
        fr: [WAL-05]
        columns:
          - "biller_id uuid nn fk=biller idx | Biller"
          - "period_start date nn | From"
          - "period_end date nn | To (inclusive)"
          - "currency currency nn | Currency"
          - "payment_count int ro | Bill payments included"
          - "topup_count int ro | Airtime top-ups included"
          - "gross_amount amount ro | Collected"
          - "fee_amount amount ro | Fees retained"
          - "commission_amount amount ro | Commissions retained"
          - "net_amount amount ro | Net payable to the biller"
          - "status enum:WalletSettlementStatus nn default=PENDING ro | Status (REJECTED releases its payments for a new settlement)"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejected_by string(64) ro | Checker who rejected the settlement"
          - "rejection_reason string(255) ro | Why the settlement was rejected"
          - "payment_reference string(64) ro | Bank payment reference"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Settlement transaction out of the collection wallet"
          - "paid_at ts ro | Payment time"
          - "report_document_id uuid ref=document ro | Settlement report"

      - name: bill_payment
        prefix: bpy
        description: A payment of a bill from a wallet to a biller
        fr: [WAL-05]
        columns:
          - "biller_id uuid nn fk=biller idx | Biller"
          - "biller_product_id uuid fk=biller_product | Product (fixed bills and bundles)"
          - "bill_inquiry_id uuid fk=bill_inquiry | Inquiry the payment is based on"
          - "payer_wallet_id uuid nn ref=wallet idx | Paying wallet"
          - "channel enum:WalletChannel nn default=APP | Initiating channel"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Wallet transaction (funds held until the biller accepts)"
          - "account_reference string(64) nn | Account / meter number"
          - "customer_name string(160) pii | Name on the bill"
          - "amount amount nn | Amount paid"
          - "currency currency nn | Currency"
          - "fee_amount amount nn default=0 ro | Fee"
          - "status enum:BillPaymentStatus nn default=INITIATED ro | Status"
          - "provider_reference string(64) ro idx | Biller transaction reference"
          - "token string(128) ro | Prepaid token (e.g. electricity) returned by the biller"
          - "receipt_number string(64) ro | Biller receipt number"
          - "retry_count int nn default=0 ro | Provider retries"
          - "completed_at ts ro | Completion time"
          - "failure_reason string(255) ro | Failure reason"
          - "reversal_reason string(255) ro | Reversal reason"
          - "reversed_at ts ro | Reversal time"
          - "biller_settlement_id uuid fk=biller_settlement ro | Settlement that paid it out"
          - "idempotency_key string(128) nn ro | Client key"
        unique: [[tenant_id, idempotency_key]]
        request_only:
          - "pin string(12) | Payer PIN, passed to wallet-service and never stored"

      - name: airtime_topup
        prefix: atu
        description: An airtime or data top-up for any mobile number
        fr: [WAL-05]
        columns:
          - "biller_id uuid nn fk=biller idx | Mobile operator"
          - "biller_product_id uuid fk=biller_product | Bundle, if any"
          - "payer_wallet_id uuid nn ref=wallet idx | Paying wallet"
          - "channel enum:WalletChannel nn default=APP | Initiating channel"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Wallet transaction"
          - "target_msisdn phone nn pii | Number topped up"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "status enum:BillPaymentStatus nn default=INITIATED ro | Status"
          - "provider_reference string(64) ro | Operator reference"
          - "retry_count int nn default=0 ro | Operator retries"
          - "completed_at ts ro | Completion time"
          - "failure_reason string(255) ro | Failure reason"
          - "biller_settlement_id uuid fk=biller_settlement ro | Settlement that paid it out"
          - "idempotency_key string(128) nn ro | Client key"
        unique: [[tenant_id, idempotency_key]]
        request_only:
          - "pin string(12) | Payer PIN, passed to wallet-service and never stored"

    apis:
      - resource: billers
        path: /v1/billers
        table: biller
        ops: [list, get, create, update]
        filters: [category, country, status, integration_type, biller_code]
        actions:
          - "GET /{id}/products | Products of the biller | | biller_product[]"
          - "POST /{id}/validate-reference | Validate an account reference (pattern and check digit) and fetch the bill from the biller | account_reference string(64) nn | bill_inquiry"
          - "POST /{id}/activate | Activate the biller"
          - "POST /{id}/suspend | Suspend the biller | reason string(255) nn"

      - resource: biller-products
        path: /v1/biller-products
        table: biller_product
        ops: [list, get, create, update]
        filters: [biller_id, product_type, is_active]

      - resource: bill-inquiries
        path: /v1/bill-inquiries
        table: bill_inquiry
        ops: [list, get, create]
        filters: [biller_id, account_reference]

      - resource: bill-payments
        path: /v1/bill-payments
        table: bill_payment
        ops: [list, get, create]
        filters: [biller_id, status, payer_wallet_id, account_reference, provider_reference, biller_settlement_id]
        actions:
          - "POST /{id}/retry | Retry a payment pending at the provider"
          - "POST /{id}/reverse | Reverse a completed (disputed) payment back to the payer wallet, or close a pending one by releasing the held funds | reason string(255) nn"
          - "GET /{id}/receipt | Receipt with token and biller reference | | text/plain"

      - resource: airtime-topups
        path: /v1/airtime-topups
        table: airtime_topup
        ops: [list, get, create]
        filters: [biller_id, status, payer_wallet_id, target_msisdn]
        actions:
          - "POST /{id}/retry | Retry a top-up pending at the operator"

      - resource: biller-settlements
        path: /v1/biller-settlements
        table: biller_settlement
        ops: [list, get, create]
        filters: [biller_id, status]
        actions:
          - "POST /{id}/approve | Approve the settlement (checker differs from the maker) | comment string(500)"
          - "POST /{id}/reject | Reject the settlement (checker differs from the maker); its payments are released for a new settlement | reason string(255) nn"
          - "POST /{id}/mark-paid | Record the bank payment of the settlement and move the net amount out of the collection wallet | payment_reference string(64) nn"
          - "GET /{id}/payments | Payments included | | bill_payment[]"

    events:
      - "wallets.biller.status_changed | biller | A biller was activated or suspended"
      - "wallets.bill_payment.completed | bill_payment | A bill payment was accepted by the biller"
      - "wallets.bill_payment.failed | bill_payment | A bill payment failed"
      - "wallets.bill_payment.reversed | bill_payment | A bill payment was reversed"
      - "wallets.airtime_topup.completed | airtime_topup | An airtime top-up was delivered"
      - "wallets.airtime_topup.failed | airtime_topup | An airtime top-up failed"
      - "wallets.biller_settlement.approved | biller_settlement | A biller settlement was approved"
      - "wallets.biller_settlement.rejected | biller_settlement | A biller settlement was rejected"
      - "wallets.biller_settlement.paid | biller_settlement | A biller settlement was paid"

  # ------------------------------------------------------------------ merchant-service
  - name: merchant-service
    database: merchant_db
    description: >
      Merchant onboarding and acceptance: stores, terminals, EMVCo static/dynamic QR codes and payment
      links; merchant discount rate fee plans; periodic settlement to wallet or bank; refunds.
    tables:
      - name: merchant_fee_plan
        prefix: mfp
        description: Merchant discount rate and fees charged to merchants
        fr: [WAL-06, PRC-02]
        columns:
          - "code string(32) nn uq | Plan code"
          - "name string(120) nn | Name"
          - "currency currency nn | Currency"
          - "mdr_percentage rate nn default=0 | Merchant discount rate (0.01 = 1%)"
          - "fixed_fee amount nn default=0 | Fixed fee per payment"
          - "min_fee amount | Minimum fee per payment"
          - "max_fee amount | Maximum fee per payment"
          - "refund_fee amount | Fee per refund"
          - "settlement_fee amount | Fee per settlement"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
          - "is_active bool nn default=true | Active"

      - name: merchant
        prefix: mer
        description: A business accepting wallet payments
        fr: [WAL-06, ONB-04]
        columns:
          - "merchant_code string(32) nn uq ro | Merchant code / till number (server-generated)"
          - "legal_name string(200) nn | Registered name"
          - "trading_name string(200) nn | Name shown to payers"
          - "merchant_type enum:MerchantType nn | Merchant type"
          - "mcc string(4) nn | ISO 18245 merchant category code"
          - "customer_id uuid ref=customer | Business party record (KYB)"
          - "registration_number string(64) | Company registration number"
          - "tax_id string(64) pii | Tax identification number"
          - "contact_name string(160) pii | Main contact"
          - "contact_msisdn phone pii | Main contact mobile"
          - "contact_email email pii | Main contact email"
          - "website string(255) | Website"
          - "address json | Registered address"
          - "city string(100) | City (EMVCo tag 60)"
          - "country country nn | Country"
          - "currency currency nn | Acceptance currency"
          - "settlement_wallet_id uuid ref=wallet ro | Merchant wallet receiving payments (opened in wallet-service on activation)"
          - "settlement_account_id uuid ref=deposit_account | Bank account for settlement sweeps"
          - "settlement_frequency enum:SettlementFrequency nn default=DAILY | Settlement frequency"
          - "merchant_fee_plan_id uuid fk=merchant_fee_plan | Fee plan"
          - "acquiring_agent_id uuid ref=agent | Agent who onboarded the merchant"
          - "category_id uuid ref=domain_category idx | WE-HIER-1: domain category placing the merchant in the configurable hierarchy (empty = any)"
          - "grade_id uuid ref=grade idx | WE-HIER-1: grade of the merchant (empty = any)"
          - "risk_rating string(16) | LOW, MEDIUM, HIGH"
          - "daily_limit amount | Maximum daily collections"
          - "status enum:MerchantStatus nn default=ONBOARDING ro | Status (changed only by actions)"
          - "status_reason string(255) ro | Reason for the current status (for ONBOARDING: why the checker returned it for rework)"
          - "onboarding_rejected_by string(64) ro | Checker who last returned the onboarding for rework"
          - "onboarded_at ts ro | Activation time"
          - "logo_document_id uuid ref=document | Logo"
          - "metadata json | Client-defined key/value metadata"

      - name: merchant_store
        prefix: mst
        description: A physical or online store of a merchant
        fr: [WAL-06]
        columns:
          - "merchant_id uuid nn fk=merchant idx | Merchant"
          - "store_code string(32) nn uq | Store code"
          - "name string(160) nn | Name"
          - "mcc string(4) | MCC override for this store"
          - "address json | Address"
          - "city string(100) | City"
          - "country country nn | Country"
          - "latitude rate | Latitude"
          - "longitude rate | Longitude"
          - "contact_msisdn phone pii | Store phone"
          - "status enum:OutletStatus nn default=ACTIVE | Status"

      - name: merchant_terminal
        prefix: mtm
        description: A POS, soft-POS, e-commerce or vending terminal of a merchant
        fr: [WAL-06]
        columns:
          - "merchant_id uuid nn fk=merchant idx | Merchant"
          - "merchant_store_id uuid fk=merchant_store idx | Store"
          - "terminal_id string(16) nn uq | Terminal id"
          - "terminal_type string(32) nn | POS, SOFT_POS, ECOMMERCE, VENDING"
          - "serial_number string(64) | Serial number"
          - "app_version string(32) | App version"
          - "status enum:MerchantTerminalStatus nn default=ACTIVE ro | Status"
          - "status_reason string(255) ro | Reason for the current status"
          - "last_seen_at ts ro | Last heartbeat"

      - name: merchant_qr
        prefix: mqr
        description: An EMVCo merchant-presented QR code (static or dynamic)
        fr: [WAL-06, PAY-07]
        columns:
          - "merchant_id uuid nn fk=merchant idx | Merchant"
          - "merchant_store_id uuid fk=merchant_store | Store"
          - "merchant_terminal_id uuid fk=merchant_terminal | Terminal"
          - "qr_type enum:QrType nn | Static (any amount) or dynamic (one payment)"
          - "payload text ro | EMVCo QR payload string (TLV with CRC-16/CCITT-FALSE in tag 63)"
          - "amount amount | Fixed amount for dynamic QR"
          - "currency currency nn | Currency"
          - "reference string(25) | Bill / order reference embedded in the QR (tag 62.01)"
          - "expires_at ts | Expiry for dynamic QR"
          - "scan_count int nn default=0 ro | Times paid"
          - "last_paid_at ts ro | Last payment time"
          - "is_active bool nn default=true ro | Active (deactivated by /deactivate or after a dynamic QR is paid)"

      - name: merchant_payment_link
        prefix: mpl
        description: A shareable link that lets anyone pay a merchant
        fr: [WAL-06, PAY-07]
        columns:
          - "merchant_id uuid nn fk=merchant idx | Merchant"
          - "link_code string(32) nn uq ro | Short code in the URL (server-generated)"
          - "url string(500) ro | Full payment URL"
          - "amount amount | Fixed amount (empty = payer enters it)"
          - "currency currency nn | Currency"
          - "description string(255) | What is being paid for"
          - "reference string(64) | Merchant order reference"
          - "max_uses int | Maximum payments (empty = unlimited)"
          - "use_count int nn default=0 ro | Payments received"
          - "expires_at ts | Expiry"
          - "is_active bool nn default=true ro | Active (deactivated by /deactivate or when max_uses is reached)"

      - name: merchant_settlement
        prefix: mse
        description: Periodic settlement of merchant collections net of fees and refunds
        fr: [WAL-06]
        columns:
          - "merchant_id uuid nn fk=merchant idx | Merchant"
          - "period_start date nn | From"
          - "period_end date nn | To (inclusive)"
          - "currency currency nn | Currency"
          - "payment_count int ro | Payments included"
          - "gross_amount amount ro | Gross collections"
          - "mdr_amount amount ro | Merchant discount fees"
          - "refund_amount amount ro | Refunds"
          - "net_amount amount ro | Net payable"
          - "status enum:WalletSettlementStatus nn default=PENDING ro | Status (REJECTED releases its payments for a new settlement)"
          - "settlement_wallet_id uuid ref=wallet ro | Wallet the collections sit in"
          - "settlement_account_id uuid ref=deposit_account ro | Bank account paid (empty = net stays in the wallet)"
          - "approved_by string(64) ro | Checker"
          - "approved_at ts ro | Approval time"
          - "rejected_by string(64) ro | Checker who rejected the settlement"
          - "rejection_reason string(255) ro | Why the settlement was rejected"
          - "payment_id uuid ref=payment ro | Bank payment when settled to bank"
          - "fee_wallet_transaction_id uuid ref=wallet_transaction ro | MDR fee transaction"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Settlement transaction to the bank account"
          - "paid_at ts ro | Payment time"
          - "failure_reason string(255) ro | Failure reason"
          - "report_document_id uuid ref=document ro | Settlement report"

      - name: merchant_refund
        prefix: mrf
        description: A full or partial refund of a merchant payment
        fr: [WAL-06]
        columns:
          - "merchant_id uuid nn fk=merchant idx | Merchant"
          - "original_transaction_id uuid nn ref=wallet_transaction idx | Payment refunded"
          - "amount amount nn | Refund amount"
          - "currency currency nn | Currency"
          - "reason string(255) nn | Reason"
          - "status enum:MerchantRefundStatus nn default=REQUESTED ro | REQUESTED -> COMPLETED (or PENDING_BANK_APPROVAL after the merchant's own approval when the bank reviews it) -> COMPLETED; REJECTED, FAILED"
          - "merchant_approved_by string(64) ro | Merchant-side approver (merchant app four-eyes) when the bank's checkers review the refund"
          - "merchant_approved_at ts ro | Merchant-side approval time"
          - "bank_review_reason string(64) ro | Why the bank's checkers review the refund in central approvals (AMOUNT_THRESHOLD, MERCHANT_RISK)"
          - "approved_by string(64) ro | Approver"
          - "approved_at ts ro | Approval time"
          - "rejection_reason string(255) ro | Rejection reason"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Refund transaction"
          - "completed_at ts ro | Completion time"
          - "failure_reason string(255) ro | Failure reason"
          - "idempotency_key string(128) nn ro | Client key"
        unique: [[tenant_id, idempotency_key]]

    apis:
      - resource: merchants
        path: /v1/merchants
        table: merchant
        ops: [list, get, create, update]
        filters: [merchant_type, mcc, status, acquiring_agent_id, merchant_code, country, customer_id]
        actions:
          - "POST /{id}/activate | Activate the merchant (checker differs from the creator); opens the merchant wallet on first activation | comment string(500)"
          - "POST /{id}/reject-onboarding | Return an ONBOARDING merchant to the maker for rework (checker differs from the creator); it stays ONBOARDING with the reason in status_reason | reason string(255) nn"
          - "POST /{id}/suspend | Suspend acceptance | reason string(255) nn"
          - "POST /{id}/terminate | Terminate the merchant | reason string(255) nn"
          - "GET /{id}/stores | Stores of the merchant | | merchant_store[]"
          - "GET /{id}/transactions?from:ts&to:ts | Payments received (wallet transactions of the merchant) | | wallet_transaction[]"
          - "GET /{id}/settlements | Settlements | | merchant_settlement[]"

      - resource: merchant-stores
        path: /v1/merchant-stores
        table: merchant_store
        ops: [list, get, create, update]
        filters: [merchant_id, status, city]

      - resource: merchant-terminals
        path: /v1/merchant-terminals
        table: merchant_terminal
        ops: [list, get, create, update]
        filters: [merchant_id, merchant_store_id, status, terminal_id]
        actions:
          - "POST /{id}/deactivate | Deactivate the terminal | reason string(255)"

      - resource: merchant-qr-codes
        path: /v1/merchant-qr-codes
        table: merchant_qr
        ops: [list, get, create]
        filters: [merchant_id, merchant_store_id, qr_type, is_active]
        actions:
          - "POST /{id}/deactivate | Deactivate the QR code"
          - "POST /decode | Decode a scanned EMVCo QR payload (CRC verified) into payment details: {crc_valid, payload_format, point_of_initiation (11 static / 12 dynamic), merchant_qr_id, merchant_id, merchant_code, merchant_name, merchant_city, mcc, country, currency, amount, reference, payable, reason, tags{}} | payload text nn | object"
          - "POST /pay | Pay a merchant QR from a wallet (amount required for static QR, must match for dynamic QR) | payload text nn, payer_wallet_id uuid nn, amount amount, currency currency, pin string(12), channel enum:WalletChannel | wallet_transaction"

      - resource: merchant-payment-links
        path: /v1/merchant-payment-links
        table: merchant_payment_link
        ops: [list, get, create, update]
        filters: [merchant_id, is_active, link_code]
        actions:
          - "POST /{id}/deactivate | Deactivate the link"
          - "POST /{id}/pay | Pay a payment link from a wallet | payer_wallet_id uuid nn, amount amount, pin string(12), channel enum:WalletChannel | wallet_transaction"

      - resource: merchant-fee-plans
        path: /v1/merchant-fee-plans
        table: merchant_fee_plan
        ops: [list, get, create, update]
        filters: [is_active, currency, code]

      - resource: merchant-settlements
        path: /v1/merchant-settlements
        table: merchant_settlement
        ops: [list, get, create]
        filters: [merchant_id, status]
        actions:
          - "POST /{id}/approve | Approve the settlement (checker differs from the maker) | comment string(500)"
          - "POST /{id}/reject | Reject the settlement (checker differs from the maker); its period can be settled again | reason string(255) nn"
          - "POST /{id}/pay | Collect the MDR fee and pay the net amount to the settlement bank account (or leave it in the wallet)"
          - "GET /{id}/report | Download the settlement report | | text/csv"

      - resource: merchant-refunds
        path: /v1/merchant-refunds
        table: merchant_refund
        ops: [list, get, create]
        filters: [merchant_id, status, original_transaction_id]
        actions:
          - "POST /{id}/approve | Approve (checker differs from the maker) and execute the refund; a merchant app user's approval of a refund the bank reviews moves it to PENDING_BANK_APPROVAL instead (bank checkers decide) | comment string(500)"
          - "POST /{id}/reject | Reject the refund | reason string(255) nn"

    events:
      - "wallets.merchant.onboarded | merchant | A merchant was activated"
      - "wallets.merchant.status_changed | merchant | A merchant was suspended or terminated"
      - "wallets.merchant.onboarding_rejected | merchant | A merchant onboarding was returned to the maker for rework"
      - "wallets.merchant_qr.paid | merchant_qr | A merchant QR code was paid"
      - "wallets.merchant_payment_link.paid | merchant_payment_link | A payment link was paid"
      - "wallets.merchant_settlement.approved | merchant_settlement | A merchant settlement was approved"
      - "wallets.merchant_settlement.rejected | merchant_settlement | A merchant settlement was rejected"
      - "wallets.merchant_settlement.paid | merchant_settlement | A merchant settlement was paid"
      - "wallets.merchant_refund.completed | merchant_refund | A merchant refund was completed"
      - "wallets.merchant_refund.rejected | merchant_refund | A merchant refund was rejected"
      - "wallets.merchant_refund.pending_bank_approval | merchant_refund | A refund approved inside the merchant waits for the bank's checkers"

  # ------------------------------------------------------------------ channel-service
  - name: channel-service
    database: channel_db
    description: >
      USSD and SMS channels for feature phones: per-tenant, per-language menu trees with versioning and
      a simulator, MNO gateway callbacks and session state, SMS keyword commands, and an SMS log.
    tables:
      - name: ussd_menu
        prefix: umn
        description: A versioned USSD menu tree for one short code and language
        fr: [WAL-03]
        columns:
          - "code string(32) nn | Menu code"
          - "name string(120) nn | Name"
          - "short_code string(16) nn | Dialled code, e.g. *123#"
          - "language string(8) nn | Language"
          - "version int nn default=1 ro | Version (a clone gets the next version for the short code and language)"
          - "cloned_from_id uuid fk=ussd_menu ro | Version this menu was cloned from"
          - "root_node_key string(64) nn | Key of the first node"
          - "session_timeout_seconds int nn default=120 | Session timeout"
          - "status enum:UssdMenuStatus nn default=DRAFT ro | Status"
          - "published_at ts ro | Publication time"
          - "published_by string(64) ro | Publisher (checker, differs from the maker)"
          - "submitted_by string(64) ro | Maker who submitted the draft for publication"
          - "submitted_at ts ro | Submission time (empty when no publication is pending)"
          - "rejected_by string(64) ro | Checker who rejected the last submission"
          - "rejection_reason string(500) ro | Why the last submission was rejected"
          - "retired_at ts ro | Time a newer version replaced it"
        unique: [[tenant_id, short_code, language, version]]

      - name: ussd_menu_node
        prefix: und
        description: A screen in a USSD menu tree
        fr: [WAL-03]
        columns:
          - "ussd_menu_id uuid nn fk=ussd_menu idx | Menu"
          - "node_key string(64) nn | Node key"
          - "parent_node_key string(64) | Parent node"
          - "node_type enum:UssdNodeType nn | MENU lists its children by option_number; INPUT stores the reply under context_key; CONFIRM accepts 1 (yes) or 2 (no); ACTION runs action_code; END closes the session"
          - "option_number int | Option number in the parent menu"
          - "label string(182) nn | Text shown (182-character USSD limit); {placeholders} are filled from the session context"
          - "prompt string(182) | Input prompt"
          - "input_type enum:UssdInputType | Kind of input (PIN inputs are never stored)"
          - "input_validation string(128) | Regex the input must match"
          - "context_key string(64) | Session context variable the input is stored under (default: node_key)"
          - "action_code string(64) | Action executed, e.g. BALANCE, P2P_SEND, CASH_OUT, AIRTIME, MINI_STATEMENT, CHANGE_PIN"
          - "next_node_key string(64) | Next node after input"
          - "requires_pin bool nn default=false | Ask for the PIN before the action"
          - "min_kyc_tier int | Hide the node below this tier"
          - "display_order int | Order among siblings"
        unique: [[ussd_menu_id, node_key]]

      - name: ussd_session
        prefix: uss
        description: One USSD dialogue between a subscriber and the platform
        fr: [WAL-03]
        columns:
          - "session_id string(64) nn uq | MNO session id"
          - "msisdn phone nn pii idx | Subscriber"
          - "short_code string(16) nn | Dialled code"
          - "mno string(32) | Mobile network operator"
          - "ussd_menu_id uuid fk=ussd_menu | Menu version served"
          - "current_node_key string(64) ro | Current node"
          - "wallet_id uuid ref=wallet | Resolved wallet"
          - "language string(8) | Language"
          - "status enum:UssdSessionStatus nn default=ACTIVE ro | Status"
          - "context json hide | Inputs collected so far (PINs never stored)"
          - "step_count int nn default=0 ro | Steps taken"
          - "started_at ts nn default=now | Start"
          - "last_activity_at ts ro | Last request (database clock; drives the timeout)"
          - "ended_at ts ro | End"
          - "end_reason string(64) ro | Why the session ended"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Transaction created"

      - name: ussd_session_step
        prefix: ust
        description: One request/response step of a USSD session. Append-only.
        immutable: true
        fr: [WAL-03]
        columns:
          - "ussd_session_id uuid nn fk=ussd_session idx | Session"
          - "step_no int nn | Step number"
          - "node_key string(64) nn | Node served"
          - "user_input string(182) | Input received (masked on PIN nodes)"
          - "response_text string(182) | Text returned"
          - "latency_ms int | Processing time"
        unique: [[ussd_session_id, step_no]]

      - name: sms_command
        prefix: smc
        description: A keyword command customers can send by SMS (e.g. BAL, SEND)
        fr: [WAL-03]
        columns:
          - "keyword string(32) nn | Keyword (matched case-insensitively)"
          - "short_code string(16) nn | Short code"
          - "language string(8) nn | Language"
          - "action_code string(64) nn | Action executed: BALANCE, P2P_SEND, MINI_STATEMENT, HELP"
          - "syntax string(255) | Syntax, e.g. SEND amount msisdn pin"
          - "help_text string(160) | Help reply"
          - "requires_pin bool nn default=true | PIN required in the message"
          - "is_active bool nn default=true | Active"
        unique: [[tenant_id, keyword, short_code, language]]

      - name: sms_message
        prefix: sms
        description: Inbound and outbound SMS log
        fr: [WAL-03, NOT-01]
        columns:
          - "direction enum:SmsDirection nn | Direction"
          - "msisdn phone nn pii idx | Subscriber"
          - "short_code string(16) | Short code / sender id"
          - "body text pii | Message text (PINs masked)"
          - "status enum:SmsStatus nn | Status"
          - "mno string(32) | Network operator"
          - "provider string(32) | SMS gateway"
          - "provider_message_id string(64) ro idx | Gateway message id"
          - "sms_command_id uuid fk=sms_command | Command matched (inbound)"
          - "reply_to_id uuid fk=sms_message | Inbound message this outbound message answers"
          - "wallet_transaction_id uuid ref=wallet_transaction | Related transaction"
          - "notification_id uuid ref=notification | Related notification (outbound)"
          - "segments int | SMS segments"
          - "cost amount | Cost"
          - "currency currency | Cost currency"
          - "sent_at ts ro | Sent time"
          - "delivered_at ts ro | Delivery time"
          - "failure_reason string(255) ro | Failure reason"

    apis:
      - resource: ussd-menus
        path: /v1/ussd-menus
        table: ussd_menu
        ops: [list, get, create, update]
        filters: [short_code, language, status, code]
        actions:
          - "GET /{id}/nodes | Nodes of the menu | | ussd_menu_node[]"
          - "POST /{id}/submit | Submit the draft version and its tree for publication (maker) | comment string(500)"
          - "POST /{id}/publish | Publish the draft version after validating the tree (checker differs from the maker); the previously published version is retired | comment string(500)"
          - "POST /{id}/reject | Reject the submitted draft (checker); it stays DRAFT for rework | reason string(500) nn"
          - "POST /{id}/clone | Create a new draft version with copies of all nodes | | ussd_menu"
          - "POST /{id}/simulate | Run the menu in a simulator with scripted inputs (no session stored, actions dry-run unless execute_actions): {screens[{step, node_key, input, text, end}], ended, final_node_key} | msisdn phone nn, inputs string(182)[] nn, execute_actions bool | object"

      - resource: ussd-menu-nodes
        path: /v1/ussd-menu-nodes
        table: ussd_menu_node
        ops: [list, get, create, update, delete]
        filters: [ussd_menu_id, node_type, parent_node_key]

      - resource: ussd-sessions
        path: /v1/ussd-sessions
        table: ussd_session
        ops: [list, get]
        filters: [msisdn, status, short_code, wallet_id, mno]
        actions:
          - "GET /{id}/steps | Steps of the session | | ussd_session_step[]"
          - "POST /callback?tenant_id:uuid! | [public] MNO gateway callback (HMAC-SHA256 (hex) of the canonical JSON body (keys sorted, no whitespace) in X-Gateway-Signature; tenant_id is part of the callback URL registered with the gateway) that processes one USSD request and returns the next screen as 'CON <text>' (continue) or 'END <text>' | session_id string(64) nn, msisdn phone nn, short_code string(16) nn, input string(182), mno string(32) | text/plain"
          - "POST /expire | Time out sessions idle longer than their menu timeout | | object"

      - resource: sms-commands
        path: /v1/sms-commands
        table: sms_command
        ops: [list, get, create, update, delete]
        filters: [keyword, short_code, is_active]

      - resource: sms-messages
        path: /v1/sms-messages
        table: sms_message
        ops: [list, get]
        filters: [direction, msisdn, status, sms_command_id, provider_message_id]
        actions:
          - "POST /inbound?tenant_id:uuid! | [public] SMS gateway webhook for inbound messages (HMAC-SHA256 (hex) of the canonical JSON body (keys sorted, no whitespace) in X-Gateway-Signature): parses the keyword command, runs it and queues the reply: {inbound_id, reply_id, command, reply} | msisdn phone nn, short_code string(16) nn, body text nn, provider_message_id string(64), mno string(32) | object"
          - "POST /delivery-reports?tenant_id:uuid! | [public] SMS gateway delivery receipts (HMAC-SHA256 (hex) of the canonical JSON body (keys sorted, no whitespace) in X-Gateway-Signature); status only moves forward: {sms_message_id, status} | provider_message_id string(64) nn, status enum:SmsStatus nn, failure_reason string(255) | object"

    events:
      - "wallets.ussd_menu.published | ussd_menu | A USSD menu version was published"
      - "wallets.ussd_menu.submitted | ussd_menu | A USSD menu draft was submitted for publication"
      - "wallets.ussd_menu.rejected | ussd_menu | A submitted USSD menu draft was rejected"
      - "wallets.ussd_session.completed | ussd_session | A USSD session ended"
      - "wallets.sms_message.received | sms_message | An inbound SMS command was received"
      - "wallets.sms_message.delivery_updated | sms_message | An outbound SMS was delivered or failed"

  # ------------------------------------------------------------------ disbursement-service
  - name: disbursement-service
    database: disbursement_db
    description: >
      Government-to-person, payroll, social-transfer and humanitarian bulk disbursements: programs with
      funding wallets, batch upload, beneficiary validation (wallet exists, name match, tier, duplicates),
      multi-level approval, execution with retries and reporting.
    tables:
      - name: disbursement_program
        prefix: dpg
        description: A disbursement program with its sponsor, funding wallet and rules
        fr: [WAL-07]
        columns:
          - "code string(32) nn uq | Program code"
          - "name string(160) nn | Name"
          - "sponsor_name string(200) nn | Ministry, NGO or employer"
          - "program_type string(32) nn | G2P, PAYROLL, SOCIAL_TRANSFER, HUMANITARIAN, B2C_PAYOUT"
          - "funding_wallet_id uuid nn ref=wallet | Funding wallet"
          - "currency currency nn | Currency"
          - "max_amount_per_beneficiary amount | Cap per beneficiary per batch"
          - "require_name_match bool nn default=true | Reject when the wallet name does not match"
          - "require_kyc_tier int | Minimum KYC tier of the receiving wallet"
          - "approval_levels int nn default=2 | Approvals needed per batch (each by a different principal, none the submitter)"
          - "auto_create_wallets bool nn default=false | Open Tier 0 wallets for unregistered beneficiaries"
          - "status enum:DisbursementProgramStatus nn default=DRAFT ro | Status (changed only by actions)"
          - "status_reason string(255) ro | Reason for the current status"
          - "start_date date | Start"
          - "end_date date | End"

      - name: disbursement_batch
        prefix: dbt
        description: A batch of payments to many beneficiaries under a program
        fr: [WAL-07, PAY-01]
        columns:
          - "disbursement_program_id uuid nn fk=disbursement_program idx | Program"
          - "batch_reference string(64) nn uq ro | Batch reference (server-generated)"
          - "description string(255) | Description"
          - "file_document_id uuid ref=document ro | Uploaded beneficiary file"
          - "file_name string(255) ro | Name of the uploaded file"
          - "file_sha256 string(64) ro | SHA-256 of the uploaded content (re-uploading the same file is rejected)"
          - "currency currency nn | Currency"
          - "scheduled_for ts | Execution time"
          - "status enum:DisbursementBatchStatus nn default=DRAFT ro | Status"
          - "total_count int ro | Lines"
          - "total_amount amount ro | Total amount"
          - "valid_count int ro | Valid lines"
          - "valid_amount amount ro | Total amount of valid lines"
          - "invalid_count int ro | Invalid lines"
          - "duplicate_count int ro | Duplicate lines"
          - "paid_count int ro | Paid lines"
          - "failed_count int ro | Failed lines"
          - "paid_amount amount ro | Amount paid"
          - "fee_amount amount ro | Fees"
          - "approval_request_id uuid ref=approval_request ro | Approval workflow"
          - "approvals_required int ro | Approvals needed (from the program)"
          - "approvals_received int nn default=0 ro | Approvals given so far"
          - "submitted_by string(64) ro | Maker who submitted the batch"
          - "submitted_at ts ro | Submission time"
          - "approved_by string(64) ro | Final approver"
          - "rejection_reason string(255) ro | Rejection reason"
          - "cancel_reason string(255) ro | Cancellation reason"
          - "started_at ts ro | Execution start"
          - "completed_at ts ro | Execution end"

      - name: disbursement_batch_approval
        prefix: dba
        description: One approval or rejection decision on a disbursement batch. Append-only.
        immutable: true
        fr: [WAL-07]
        columns:
          - "disbursement_batch_id uuid nn fk=disbursement_batch idx | Batch"
          - "level int nn | Approval level (1..approval_levels)"
          - "decision enum:ApprovalDecision nn | Decision"
          - "decided_by string(64) nn | Approver"
          - "comment string(500) | Comment or rejection reason"
        unique: [[disbursement_batch_id, level, decided_by]]

      - name: disbursement_beneficiary
        prefix: dbn
        description: One beneficiary line of a disbursement batch
        fr: [WAL-07]
        columns:
          - "disbursement_batch_id uuid nn fk=disbursement_batch idx | Batch"
          - "line_no int nn | Line number in the file"
          - "beneficiary_reference string(64) | Program beneficiary id"
          - "msisdn phone pii idx | Mobile number"
          - "national_id string(64) pii | National id"
          - "full_name string(200) pii | Name in the file"
          - "wallet_id uuid ref=wallet ro | Resolved wallet"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "narrative string(255) | Narrative"
          - "validation_status enum:BeneficiaryValidation nn default=PENDING ro | Validation result"
          - "validation_message string(255) ro | Validation detail"
          - "matched_name string(200) pii ro | Name on the resolved wallet"
          - "payout_status enum:BeneficiaryPayoutStatus nn default=PENDING ro | Payout status"
          - "attempt_count int nn default=0 ro | Payout attempts"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Payout transaction"
          - "paid_at ts ro | Payment time"
          - "failure_reason string(255) ro | Failure reason"
        unique: [[disbursement_batch_id, line_no]]

    apis:
      - resource: disbursement-programs
        path: /v1/disbursement-programs
        table: disbursement_program
        ops: [list, get, create, update]
        filters: [status, program_type, code]
        actions:
          - "POST /{id}/activate | Activate the program (the funding wallet must be active in the program currency)"
          - "POST /{id}/suspend | Suspend the program | reason string(255) nn"
          - "POST /{id}/close | Close the program (no batch in flight) | reason string(255)"
          - "GET /{id}/batches | Batches of the program | | disbursement_batch[]"

      - resource: disbursement-batches
        path: /v1/disbursement-batches
        table: disbursement_batch
        ops: [list, get, create]
        filters: [disbursement_program_id, status, batch_reference]
        actions:
          - "POST /{id}/upload | Upload the beneficiary CSV (header msisdn,amount and optional full_name,national_id,beneficiary_reference,narrative) replacing any lines of a draft batch | content text nn, file_name string(255), file_document_id uuid"
          - "POST /{id}/validate | Validate beneficiaries (wallet exists and is active, name match, KYC tier, amount cap, duplicates)"
          - "POST /{id}/submit | Submit the validated batch for approval"
          - "POST /{id}/approve | Approve the batch at the current level (each level by a different principal, never the submitter); the final approval executes the batch from the program funding wallet | comment string(500)"
          - "POST /{id}/reject | Reject the batch | reason string(255) nn"
          - "POST /{id}/cancel | Cancel the batch before execution | reason string(255)"
          - "POST /{id}/retry-failed | Retry failed lines"
          - "GET /{id}/approvals | Approval decisions on the batch | | disbursement_batch_approval[]"
          - "GET /{id}/beneficiaries?validation_status:enum:BeneficiaryValidation&payout_status:enum:BeneficiaryPayoutStatus | Lines of the batch | | disbursement_beneficiary[]"
          - "GET /{id}/report | Download the execution report (one row per line with validation and payout outcome) | | text/csv"

      - resource: disbursement-beneficiaries
        path: /v1/disbursement-beneficiaries
        table: disbursement_beneficiary
        ops: [list, get, create, update]
        filters: [disbursement_batch_id, validation_status, payout_status, msisdn, wallet_id]

    events:
      - "wallets.disbursement_program.status_changed | disbursement_program | A disbursement program was activated, suspended or closed"
      - "wallets.disbursement_batch.validated | disbursement_batch | A disbursement batch was validated"
      - "wallets.disbursement_batch.submitted | disbursement_batch | A disbursement batch was submitted for approval"
      - "wallets.disbursement_batch.approved | disbursement_batch | A disbursement batch was approved"
      - "wallets.disbursement_batch.rejected | disbursement_batch | A disbursement batch was rejected"
      - "wallets.disbursement_batch.cancelled | disbursement_batch | A disbursement batch was cancelled"
      - "wallets.disbursement_batch.completed | disbursement_batch | A disbursement batch finished executing"
      - "wallets.disbursement_beneficiary.paid | disbursement_beneficiary | A beneficiary was paid"
      - "wallets.disbursement_beneficiary.failed | disbursement_beneficiary | A beneficiary payout failed"

  # ------------------------------------------------------------------ interop-service
  - name: interop-service
    database: interop_db
    description: >
      Interoperability with national switches, Mojaloop hubs and partner wallets/banks: participant
      directory, party lookup, quotes, two-phase transfers (reserve, commit, abort) with liquidity and
      net-debit-cap control, and inbound callbacks.
    tables:
      - name: interop_switch
        prefix: isw
        description: A connected switch or partner network
        fr: [WAL-08]
        columns:
          - "code string(32) nn uq | Switch code"
          - "name string(160) nn | Name"
          - "switch_type enum:InteropSwitchType nn | Type"
          - "country country | Country"
          - "currency currency | Settlement currency"
          - "protocol string(32) nn | MOJALOOP_FSPIOP, ISO20022, ISO8583, PROPRIETARY_API"
          - "participant_id string(64) nn | Our FSP / participant id on the switch"
          - "endpoint_url string(500) | Switch endpoint (empty = built-in simulator)"
          - "connection_config json hide | Certificates and credentials reference (secrets in Vault)"
          - "settlement_account_id uuid ref=ledger_account | Settlement position account in the ledger"
          - "liquidity_limit amount | Prefunded liquidity"
          - "net_debit_cap amount | Net debit cap set by the switch"
          - "fee_flat amount nn default=0 | Our flat fee on outbound transfers"
          - "fee_percentage rate nn default=0 | Our percentage fee on outbound transfers"
          - "quote_validity_seconds int nn default=60 | Quote validity"
          - "transfer_timeout_seconds int nn default=60 | Time a reserved transfer waits for the fulfilment"
          - "last_directory_sync_at ts ro | Last participant directory refresh"
          - "is_active bool nn default=true | Active"

      - name: interop_participant
        prefix: ipt
        description: Another wallet, bank or MFI reachable through a switch
        fr: [WAL-08]
        columns:
          - "interop_switch_id uuid nn fk=interop_switch idx | Switch"
          - "fsp_id string(64) nn | Participant id"
          - "name string(160) nn | Name"
          - "participant_type string(32) nn | WALLET, BANK, MFI"
          - "currency currency | Currency"
          - "supports_lookup bool nn default=true | Supports party lookup"
          - "is_active bool nn default=true | Active"
        unique: [[interop_switch_id, fsp_id]]

      - name: interop_quote
        prefix: iqt
        description: A quote for an interoperable transfer (fees and amounts agreed before transfer)
        fr: [WAL-08]
        columns:
          - "interop_switch_id uuid nn fk=interop_switch idx | Switch"
          - "quote_id string(64) nn uq ro | Quote id on the switch (generated for outbound, taken from the switch for inbound)"
          - "direction enum:InteropDirection nn ro | Outbound (created by the API) or inbound (created by a switch callback)"
          - "payer_wallet_id uuid ref=wallet | Payer wallet (outbound)"
          - "payer_fsp_id string(64) ro | Payer participant (inbound)"
          - "payee_wallet_id uuid ref=wallet ro | Payee wallet resolved for an inbound quote"
          - "payee_party_type enum:InteropPartyType nn | MSISDN, ACCOUNT, ALIAS"
          - "payee_party_id string(64) nn pii | Payee identifier"
          - "payee_fsp_id string(64) | Payee participant"
          - "payee_name string(160) pii ro | Payee name returned by lookup"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "payee_receive_amount amount ro | Amount the payee receives"
          - "fee_amount amount ro | Fees"
          - "ilp_condition string(128) ro | Cryptographic condition for the transfer (base64url SHA-256 of the fulfilment)"
          - "fulfilment string(128) hide | Fulfilment we reveal on commit (inbound quotes only)"
          - "status enum:InteropQuoteStatus nn default=PENDING ro | Status"
          - "rejection_reason string(255) ro | Why the quote was rejected"
          - "expires_at ts ro | Expiry (database clock)"

      - name: interop_transfer
        prefix: itr
        description: A two-phase transfer to or from another participant
        fr: [WAL-08, PAY-01]
        columns:
          - "interop_switch_id uuid nn fk=interop_switch idx | Switch"
          - "interop_quote_id uuid fk=interop_quote | Quote"
          - "transfer_id string(64) nn uq ro | Transfer id on the switch (generated for outbound)"
          - "direction enum:InteropDirection nn ro | Outbound (created by the API) or inbound (created by a switch callback)"
          - "payer_wallet_id uuid ref=wallet | Payer wallet (outbound)"
          - "payee_wallet_id uuid ref=wallet ro | Payee wallet (inbound)"
          - "counterparty_fsp_id string(64) nn | Other participant"
          - "counterparty_party_id string(64) pii | Other party identifier"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "fee_amount amount ro | Fees charged to the payer"
          - "ilp_condition string(128) ro | Condition the fulfilment must satisfy"
          - "status enum:InteropTransferStatus nn default=QUOTE_REQUESTED ro | Status"
          - "wallet_transaction_id uuid ref=wallet_transaction ro | Wallet transaction"
          - "hold_id uuid ref=hold ro | Funds reserved while pending"
          - "fulfilment string(128) hide | Fulfilment proving the commit"
          - "expires_at ts ro | Expiry (database clock)"
          - "completed_at ts ro | Completion time"
          - "error_code string(32) ro | Switch error code"
          - "error_description string(255) ro | Error description"
          - "idempotency_key string(128) nn ro | Client key (or switch transfer id for inbound)"
        unique: [[tenant_id, idempotency_key]]

    apis:
      - resource: interop-switches
        path: /v1/interop-switches
        table: interop_switch
        ops: [list, get, create, update]
        filters: [switch_type, country, is_active, code]
        actions:
          - "GET /{id}/participants | Participants reachable through the switch | | interop_participant[]"
          - "POST /{id}/sync-participants | Refresh the participant directory from the switch: {added, updated, deactivated, total} | | object"
          - "GET /{id}/position | Net position against the net debit cap and liquidity: {settlement_balance, reserved_outbound, committed_outbound, committed_inbound, net_position, net_debit_cap, headroom, liquidity_limit, currency} | | object"

      - resource: interop-participants
        path: /v1/interop-participants
        table: interop_participant
        ops: [list, get, create, update]
        filters: [interop_switch_id, fsp_id, participant_type, is_active]

      - resource: interop-quotes
        path: /v1/interop-quotes
        table: interop_quote
        ops: [list, get, create]
        filters: [interop_switch_id, direction, payer_wallet_id, status, quote_id]
        actions:
          - "POST /lookup-party | Resolve a payee by MSISDN, account or alias through the switch: {found, party_type, party_id, fsp_id, fsp_name, name, currency} | interop_switch_id uuid nn, party_type enum:InteropPartyType nn, party_id string(64) nn | object"
          - "POST /callbacks?tenant_id:uuid! | [public] Inbound quote request (QUOTE_REQUEST, we are the payee) or response (QUOTE_RESPONSE / QUOTE_ERROR for our outbound quote) from the switch; HMAC-SHA256 (hex) of the canonical JSON body (keys sorted, no whitespace) in X-Switch-Signature keyed with the switch secret: {quote_id, status, ilp_condition, payee_receive_amount, fee_amount, expires_at} | switch_code string(32) nn, payload json nn | object"

      - resource: interop-transfers
        path: /v1/interop-transfers
        table: interop_transfer
        ops: [list, get, create]
        filters: [interop_switch_id, direction, status, payer_wallet_id, payee_wallet_id, counterparty_fsp_id, transfer_id]
        actions:
          - "POST /{id}/abort | Abort a reserved transfer and release the funds | reason string(255) nn"
          - "POST /expire | Abort reserved transfers past their expiry and expire stale quotes | | object"
          - "POST /callbacks?tenant_id:uuid! | [public] Inbound transfer prepare (TRANSFER_PREPARE, we are the payee) or result of our outbound transfer (TRANSFER_FULFIL with the fulfilment, or TRANSFER_ERROR); HMAC-SHA256 (hex) of the canonical JSON body (keys sorted, no whitespace) in X-Switch-Signature keyed with the switch secret: {transfer_id, status, fulfilment} | switch_code string(32) nn, payload json nn | object"

    events:
      - "wallets.interop_quote.received | interop_quote | An inbound quote request was received"
      - "wallets.interop_transfer.reserved | interop_transfer | Funds were reserved for an outbound interoperable transfer"
      - "wallets.interop_transfer.committed | interop_transfer | An interoperable transfer was committed"
      - "wallets.interop_transfer.aborted | interop_transfer | An interoperable transfer was aborted or expired"
