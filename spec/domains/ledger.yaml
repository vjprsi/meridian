domain: ledger
title: Ledger and Accounting
phase: 1
description: >
  The single source of truth for money. A real-time, append-only double-entry ledger that every
  other service posts through, the general ledger and period close, and automated reconciliation.

enums:
  NormalBalance: [DEBIT, CREDIT]
  EntryDirection: [DEBIT, CREDIT]
  LedgerStatus: [ACTIVE, LOCKED, ARCHIVED]
  LedgerAccountType: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE, OFF_BALANCE]
  LedgerAccountStatus: [ACTIVE, FROZEN_DEBIT, FROZEN_CREDIT, FROZEN, CLOSED]
  JournalEntryType: [STANDARD, REVERSAL, ADJUSTMENT, ACCRUAL, FEE, INTEREST, FX, TRANSFER, CARD_SETTLEMENT,
                     PAYMENT, LOAN, OPENING_BALANCE, MIGRATION, CORRECTION]
  HoldType: [CARD_AUTHORIZATION, PAYMENT, MANUAL, LEGAL, CHEQUE, RESERVATION]
  HoldStatus: [ACTIVE, PARTIALLY_CAPTURED, CAPTURED, RELEASED, EXPIRED]
  GlAccountClass: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE, CONTINGENT]
  GlAccountStatus: [ACTIVE, INACTIVE, CLOSED]
  PeriodType: [DAY, MONTH, QUARTER, YEAR]
  PeriodStatus: [OPEN, SOFT_CLOSED, CLOSED, REOPENED]
  RunStatus: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, PARTIALLY_SUCCEEDED]
  EclStage: [STAGE_1, STAGE_2, STAGE_3, POCI]
  ReconSourceType: [BANK_STATEMENT, CARD_SCHEME, PAYMENT_RAIL, PARTNER_REPORT, INTERNAL_LEDGER, WALLET_OPERATOR]
  ReconFileFormat: [CAMT_053, CAMT_054, MT940, MT942, BAI2, CSV, VISA_BASE2, MASTERCARD_T112, JSON, CUSTOM]
  ReconFileStatus: [RECEIVED, PARSING, PARSED, FAILED, MATCHED]
  ReconMatchType: [ONE_TO_ONE, ONE_TO_MANY, MANY_TO_ONE, MANY_TO_MANY, MANUAL]
  ReconExceptionStatus: [OPEN, INVESTIGATING, RESOLVED, WRITTEN_OFF, IGNORED]
  ReconExceptionReason: [MISSING_INTERNAL, MISSING_EXTERNAL, AMOUNT_MISMATCH, DATE_MISMATCH, DUPLICATE,
                         CURRENCY_MISMATCH, AMBIGUOUS, SAFEGUARDING_SHORTFALL, SAFEGUARDING_SURPLUS, OTHER]
  ReconRuleSetStatus: [DRAFT, PENDING_APPROVAL, PUBLISHED, SUPERSEDED, REJECTED]
  ReconAdjustmentKind: [ADJUSTMENT, WRITE_OFF]
  ReconAdjustmentStatus: [PENDING_APPROVAL, APPROVED, REJECTED]
  # WE-RECON-1 (G-10): outcome of the trust / e-money safeguarding stock reconciliation A-(B+C+D+E), ordered by
  # severity (forward-only within a business day). BALANCED = 100%+ backed within tolerance; SHORTFALL = A < liabilities
  # (CRITICAL, regulator-reportable); TIMING = a small surplus expected to auto-clear; AMOUNT = a persistent surplus.
  SafeguardingStatus: [BALANCED, TIMING, AMOUNT, SHORTFALL]
  # Role of a safeguarding component: A is the backing trust bank balance, B..E are the e-money liability components.
  SafeguardingComponentRole: [TRUST_BANK, WALLET_LIABILITY, EMONEY_SUSPENSE, EMONEY_UNCLAIMED, AGENT_FLOAT,
                              OTHER_LIABILITY]

services:
  # ------------------------------------------------------------------ ledger-service
  - name: ledger-service
    database: ledger_db
    description: >
      Posting engine and balance service. The only component allowed to change balances. Enforces
      double-entry, idempotency, holds and available-balance rules; publishes every posting.
    tables:
      - name: ledger
        prefix: ldg
        description: A book of accounts for one legal entity (a tenant may run several ledgers)
        fr: [LED-01, GL-05]
        columns:
          - "code string(32) nn uq | Short unique code, e.g. MAIN-USD"
          - "name string(120) nn | Display name"
          - "legal_entity_id uuid nn ref=legal_entity idx | Legal entity that owns this book"
          - "base_currency currency nn | Reporting currency for base-amount conversion"
          - "status enum:LedgerStatus nn default=ACTIVE | Lifecycle status"
          - "description text | Free-text description"
          - "metadata json | Client-defined key/value metadata"

      - name: ledger_account
        prefix: lac
        description: An account in the ledger: customer accounts, wallets, cards, loans, internal and GL control accounts
        fr: [LED-01, LED-02, LED-03, LED-08]
        columns:
          - "ledger_id uuid nn fk=ledger idx | Ledger book (immutable after creation)"
          - "code string(64) nn uq | Account code / number inside the ledger"
          - "name string(160) nn | Display name"
          - "account_type enum:LedgerAccountType nn | Accounting class (immutable after creation)"
          - "normal_balance enum:NormalBalance nn | Side that increases the balance (immutable after creation)"
          - "currency currency nn | Account currency (single-currency accounts; immutable after creation)"
          - "parent_id uuid fk=ledger_account idx | Parent for hierarchies, sub-ledgers and virtual accounts"
          - "gl_account_id uuid ref=gl_account idx | GL control account this account rolls up to"
          - "owner_type string(40) | Business object owning this account, e.g. DEPOSIT_ACCOUNT, WALLET, CARD, LOAN (immutable after creation)"
          - "owner_id uuid idx | Id of the owning business object in its service (immutable after creation)"
          - "status enum:LedgerAccountStatus nn default=ACTIVE ro | Posting restrictions (changed by /freeze, /unfreeze, /close)"
          - "allow_negative bool nn default=false | Whether available balance may go below zero (set at creation; changed only by the owning service via POST /{id}/overdraft-limit, never by PATCH)"
          - "overdraft_limit amount nn default=0 | Arranged overdraft; available = balance + limit - holds (set at creation; changed only by the owning service via POST /{id}/overdraft-limit, never by PATCH)"
          - "min_balance amount nn default=0 | Minimum balance that must remain (immutable after creation)"
          - "opened_at ts nn default=now | Opening time (immutable after creation)"
          - "closed_at ts ro | Closing time (set by /close)"
          - "metadata json | Client-defined key/value metadata"
        indexes: [[owner_type, owner_id]]

      - name: journal_entry
        prefix: je
        description: One balanced, atomic set of ledger entries (a ledger transaction). Append-only.
        immutable: true
        fr: [LED-01, LED-05, LED-06, LED-07]
        columns:
          - "ledger_id uuid nn fk=ledger idx | Ledger book"
          - "idempotency_key string(128) nn ro | Taken from the Idempotency-Key header; a replay returns the original entry"
          - "entry_type enum:JournalEntryType nn default=STANDARD | Business classification"
          - "description string(500) | Narrative shown on statements"
          - "effective_at ts nn default=now | Economic time of the transaction (default: now)"
          - "value_date date nn default=now | Date interest starts or stops counting (default: today)"
          - "booked_at ts nn default=now ro | Time the ledger committed the entry"
          - "reversal_of_id uuid fk=journal_entry uq ro | Entry this one reverses (set by POST /{id}/reverse); unique, so an entry can be reversed only once (SEC-05)"
          - "source_service string(64) nn ro | Service or client that requested the posting (from the caller identity)"
          - "source_type string(64) | Business object type, e.g. PAYMENT, CARD_AUTHORIZATION"
          - "source_id uuid idx | Business object id"
          - "correlation_id string(128) idx | Trace / saga correlation id"
          - "reference string(128) idx | External reference for reconciliation (e.g. ISO 20022 end-to-end id, bank or scheme reference); copied to every ledger entry"
          - "entry_count int nn ro | Number of ledger entries"
          - "total_debits amount nn ro | Sum of debits in base currency (equals credits)"
          - "hash string(64) ro | SHA-256 over this entry and the previous hash (tamper evidence)"
          - "prev_hash string(64) ro | Hash of the previous journal entry in the ledger"
          - "metadata json | Client-defined key/value metadata"
          - "uetr string(36) ro | Payment refs (from external_refs): SWIFT gpi / ISO 20022 UETR, lower-case UUID; copied to every ledger entry"
          - "end_to_end_id string(35) ro | Payment refs: ISO 20022 end-to-end id; copied to every ledger entry"
          - "instruction_id string(35) ro | Payment refs: ISO 20022 instruction id; copied to every ledger entry"
          - "bank_reference string(64) ro | Payment refs: bank / clearing-system reference (account servicer reference on the statement); copied to every ledger entry"
          - "scheme_reference string(64) ro | Payment refs: card-scheme or rail reference (ARN, scheme transaction id, rail transaction id); copied to every ledger entry"
          - "batch_id string(64) ro | Payment refs: batch / bulk payment / settlement file id grouping the postings of one batch booking; copied to every ledger entry"
          - "counterparty_name string(140) pii ro | Payment refs: counterparty (creditor of an outbound, debtor of an inbound payment) name; copied to every ledger entry"
          - "counterparty_account_hash string(80) ro | Payment refs: tenant-keyed HMAC of the normalised counterparty account (h1:<hex>, meridian.refs.counterparty-key); the account itself is never stored; copied to every ledger entry"
          - "counterparty_account_last4 string(4) ro | Payment refs: last four characters of the counterparty account (display only); copied to every ledger entry"
          - "purpose_code string(35) ro | Payment refs: ISO 20022 purpose / category purpose code; copied to every ledger entry"
        request_only:
          - "external_refs json | Structured payment references, validated and stored in the typed columns above (immutable once posted): {uetr, end_to_end_id, instruction_id, bank_reference, scheme_reference, batch_id, counterparty_name, counterparty_account, purpose_code}. counterparty_account (IBAN / account number / wallet id) is stored only as counterparty_account_hash + counterparty_account_last4. Unknown keys are refused"
        unique: [[tenant_id, ledger_id, idempotency_key]]
        indexes: [[ledger_id, effective_at], [source_type, source_id]]
        nested:
          - "entries list:ledger_entry nn | Debit and credit lines; must balance per currency"

      - name: ledger_entry
        prefix: le
        description: One debit or credit line of a journal entry against one ledger account. Append-only.
        immutable: true
        fr: [LED-01, LED-02, LED-03]
        columns:
          - "journal_entry_id uuid nn fk=journal_entry idx ro | Parent journal entry"
          - "ledger_account_id uuid nn fk=ledger_account | Account posted to"
          - "line_no int nn ro | Line number within the journal entry (order sent)"
          - "direction enum:EntryDirection nn | Debit or credit"
          - "amount amount nn | Positive amount in the account currency"
          - "currency currency nn | Account currency"
          - "fx_rate rate | Rate to ledger base currency at posting time"
          - "base_amount amount nn ro | Amount in ledger base currency (amount x fx_rate)"
          - "effective_at ts nn ro | Copied from the journal entry for range queries"
          - "value_date date nn ro | Copied from the journal entry (reconciliation matches on value date)"
          - "reference string(128) ro | Copied from the journal entry (reconciliation matches on reference)"
          - "entry_type enum:JournalEntryType ro | Copied from the journal entry (reconciliation pairs reversals)"
          - "uetr string(36) ro | Copied from the journal entry: SWIFT gpi / ISO 20022 UETR, lower-case UUID"
          - "end_to_end_id string(35) ro | Copied from the journal entry: ISO 20022 end-to-end id"
          - "instruction_id string(35) ro | Copied from the journal entry: ISO 20022 instruction id"
          - "bank_reference string(64) ro | Copied from the journal entry: bank / clearing-system reference (account servicer reference on the statement)"
          - "scheme_reference string(64) ro | Copied from the journal entry: card-scheme or rail reference (ARN, scheme transaction id, rail transaction id)"
          - "batch_id string(64) ro | Copied from the journal entry: batch / bulk payment / settlement file id grouping the postings of one batch booking"
          - "counterparty_name string(140) pii ro | Copied from the journal entry: counterparty (creditor of an outbound, debtor of an inbound payment) name"
          - "counterparty_account_hash string(80) ro | Copied from the journal entry: tenant-keyed HMAC of the normalised counterparty account (h1:<hex>, meridian.refs.counterparty-key); the account itself is never stored"
          - "counterparty_account_last4 string(4) ro | Copied from the journal entry: last four characters of the counterparty account (display only)"
          - "purpose_code string(35) ro | Copied from the journal entry: ISO 20022 purpose / category purpose code"
          - "account_version bigint nn ro | Account balance version after this entry (gapless per account)"
          - "balance_after amount nn ro | Posted balance of the account after this entry"
          - "description string(500) | Line narrative"
        unique: [[ledger_account_id, account_version]]
        indexes: [[ledger_account_id, effective_at]]

      - name: account_balance
        prefix: bal
        description: Current balances per ledger account, updated in the same transaction as each posting
        fr: [LED-02, LED-04]
        columns:
          - "ledger_account_id uuid nn fk=ledger_account uq | Account"
          - "currency currency nn | Account currency"
          - "posted_debits amount nn default=0 ro | Lifetime posted debits"
          - "posted_credits amount nn default=0 ro | Lifetime posted credits"
          - "posted_balance amount nn default=0 ro | Posted (ledger) balance in normal-balance terms"
          - "pending_debits amount nn default=0 ro | Active holds and pending debits"
          - "pending_credits amount nn default=0 ro | Pending credits not yet available"
          - "available_balance amount nn default=0 ro | Posted - pending debits + overdraft limit"
          - "account_version bigint nn default=0 ro | Last applied ledger entry version"
          - "last_entry_at ts ro | Time of the last posting"

      - name: hold
        prefix: hld
        description: A reservation of funds (card authorisation, pending payment, legal block) reducing available balance
        fr: [LED-04]
        columns:
          - "ledger_account_id uuid nn fk=ledger_account idx | Account the funds are reserved on"
          - "hold_type enum:HoldType nn | Reason for the hold"
          - "amount amount nn | Held amount (can be incremented)"
          - "currency currency nn | Currency"
          - "captured_amount amount nn default=0 ro | Amount converted into postings"
          - "status enum:HoldStatus nn default=ACTIVE ro | Lifecycle status"
          - "source_type string(64) | Business object type, e.g. CARD_AUTHORIZATION"
          - "source_id uuid idx | Business object id"
          - "idempotency_key string(128) nn ro | Taken from the Idempotency-Key header"
          - "description string(500) | Narrative"
          - "expires_at ts | Automatic release time"
          - "released_at ts ro | Time released or expired"
          - "metadata json | Client-defined key/value metadata"
        unique: [[tenant_id, idempotency_key]]

      - name: hold_event
        prefix: hle
        description: Immutable history of a hold (placed, incremented, captured, released, expired)
        immutable: true
        fr: [LED-04]
        columns:
          - "hold_id uuid nn fk=hold idx | Hold"
          - "event_type string(32) nn | PLACED, INCREMENTED, CAPTURED, PARTIALLY_CAPTURED, RELEASED, EXPIRED"
          - "amount amount nn | Amount affected by this event"
          - "journal_entry_id uuid fk=journal_entry | Posting created on capture"
          - "reason string(255) | Reason supplied by the caller"

      - name: balance_snapshot
        prefix: bsn
        description: End-of-day balance per account; used for statements, interest and point-in-time queries
        immutable: true
        fr: [LED-09, GL-03]
        columns:
          - "ledger_account_id uuid nn fk=ledger_account | Account"
          - "as_of_date date nn | Business date of the snapshot"
          - "currency currency nn | Currency"
          - "opening_balance amount nn | Balance at start of day"
          - "total_debits amount nn | Debits during the day"
          - "total_credits amount nn | Credits during the day"
          - "closing_balance amount nn | Balance at end of day"
          - "available_balance amount nn | Available balance at end of day"
          - "account_version bigint nn | Last entry version included"
        unique: [[ledger_account_id, as_of_date]]

      - name: ledger_eod_run
        prefix: leod
        description: End-of-day processing of one ledger for one business date (hold expiry, balance snapshots)
        immutable: true
        fr: [LED-04, LED-09, GL-03, OPS-01]
        columns:
          - "ledger_id uuid nn fk=ledger idx | Ledger processed"
          - "business_date date nn | Business date closed"
          - "status enum:RunStatus nn | Outcome"
          - "holds_expired int nn default=0 | Holds released because they passed expires_at"
          - "snapshots_written int nn default=0 | Balance snapshots written"
          - "snapshots_skipped int nn default=0 | Accounts already snapshotted for the date (idempotent rerun)"
          - "started_at ts nn | Start time"
          - "finished_at ts nn | End time"
          - "error text | Failure detail"

      - name: ledger_verification
        prefix: lver
        description: Result of an integrity verification of a ledger (balances, versions, balancing, content hashes)
        immutable: true
        fr: [LED-01, LED-02, ADM-03]
        columns:
          - "ledger_id uuid nn fk=ledger idx | Ledger verified"
          - "accounts_checked int nn | Accounts whose balance was recomputed from entries"
          - "entries_checked int nn | Journal entries checked"
          - "balance_mismatches int nn | Accounts whose stored balance differs from the sum of entries"
          - "version_gaps int nn | Accounts with non-consecutive entry versions"
          - "unbalanced_entries int nn | Journal entries whose debits and credits differ in a currency"
          - "hash_mismatches int nn | Journal entries whose content hash no longer matches (tampering)"
          - "chain_head string(64) nn | SHA-256 chain over all entry hashes in booking order"
          - "passed bool nn | True when every check passed"
          - "details json | First findings per check (capped)"

    apis:
      - resource: ledgers
        path: /v1/ledgers
        table: ledger
        ops: [list, get, create, update]
        filters: [status, legal_entity_id, base_currency]
        actions:
          - "POST /{id}/lock | Lock a ledger against new postings | reason string(255) nn"
          - "POST /{id}/verify | Verify integrity: recompute balances, versions, balancing and content hashes | | ledger_verification"
          - "POST /{id}/eod | Run end-of-day for a business date: expire holds, write balance snapshots | business_date date nn | ledger_eod_run"
          - "POST /end-of-day | Run end-of-day for every ledger of the tenant (or of one legal entity, or one ledger) for a business date; ledgers already closed for the date are skipped, failures are listed | business_date date nn, legal_entity_id uuid, ledger_id uuid | object"

      - resource: ledger-accounts
        path: /v1/ledger-accounts
        table: ledger_account
        ops: [list, get, create, update]
        filters: [ledger_id, account_type, currency, status, owner_type, owner_id, parent_id, gl_account_id]
        actions:
          - "GET /{id}/balance | Current balances (ledger, available, pending) | | account_balance"
          - "GET /{id}/balance-at?at:ts! | Point-in-time balance at a timestamp | | account_balance"
          - "GET /{id}/balance-history?from:date&to:date | Daily balance snapshots in a date range | | balance_snapshot[]"
          - "GET /{id}/entries?from:ts&to:ts | Ledger entries for this account, newest first | | ledger_entry[]"
          - "POST /{id}/freeze | Restrict debits, credits or both (idempotent: an account already in the target status is returned unchanged) | status enum:LedgerAccountStatus nn, reason string(255) nn"
          - "POST /{id}/unfreeze | Remove posting restrictions (idempotent: an ACTIVE account is returned unchanged) | reason string(255) nn"
          - "POST /{id}/overdraft-limit | Set the arranged overdraft limit (and optionally allow_negative) and recompute the available balance. Service identity only: callable by the service owning the account (X-Meridian-Service with an internal token, e.g. deposit-service applying an approved overdraft facility); user tokens get 403 service_identity_required (idempotent: the same values return the account unchanged) | limit amount nn, allow_negative bool, reason string(255)"
          - "POST /{id}/close | Close an account with zero balance | reason string(255)"

      - resource: journal-entries
        path: /v1/journal-entries
        table: journal_entry
        description: Post balanced transactions. Body carries the entries array (see LedgerEntry).
        ops: [list, get, create]
        filters: [ledger_id, entry_type, source_type, source_id, correlation_id, reference, uetr, end_to_end_id, instruction_id, bank_reference, scheme_reference, batch_id, counterparty_account_hash]
        actions:
          - "POST /{id}/reverse | Reverse a journal entry with a compensating entry | reason string(255) nn, effective_at ts"
          - "GET /{id}/entries | Lines of a journal entry | | ledger_entry[]"
          - "POST /batch | Post up to 1,000 journal entries, each atomic on its own (item i uses key <Idempotency-Key>:<i>); returns per-item results | entries json[] nn | object"

      - resource: ledger-entries
        path: /v1/ledger-entries
        table: ledger_entry
        ops: [list, get]
        filters: [ledger_account_id, journal_entry_id, direction, currency]

      - resource: holds
        path: /v1/holds
        table: hold
        ops: [list, get, create]
        filters: [ledger_account_id, hold_type, status, source_type, source_id]
        actions:
          - "POST /{id}/increment | Increase a hold (e.g. incremental card authorisation) | amount amount nn, reason string(255)"
          - "POST /{id}/capture | Capture all or part of a hold: debit the held account, credit the counter account (reference and external_refs as on POST /v1/journal-entries) | amount amount nn, counter_account_id uuid nn, description string(500), release_remainder bool, reference string(128), external_refs json"
          - "POST /{id}/release | Release the remaining held amount | reason string(255)"
          - "GET /{id}/events | History of the hold | | hold_event[]"

      - resource: ledger-eod-runs
        path: /v1/ledger-eod-runs
        table: ledger_eod_run
        ops: [list, get]
        filters: [ledger_id, business_date, status]

      - resource: ledger-verifications
        path: /v1/ledger-verifications
        table: ledger_verification
        ops: [list, get]
        filters: [ledger_id, passed]

      - resource: balance-snapshots
        path: /v1/balance-snapshots
        table: balance_snapshot
        ops: [list, get]
        filters: [ledger_account_id, as_of_date]

    events:
      - "ledger.ledger.created | ledger | A ledger book was created"
      - "ledger.ledger.verified | ledger_verification | A ledger integrity verification finished"
      - "ledger.eod.completed | ledger_eod_run | End-of-day processing finished for a ledger and business date"
      - "ledger.ledger_account.created | ledger_account | A ledger account was opened"
      - "ledger.ledger_account.status_changed | ledger_account | An account was frozen, unfrozen or closed"
      - "ledger.ledger_account.overdraft_limit_changed | ledger_account | The arranged overdraft limit of an account changed"
      - "ledger.journal_entry.posted | journal_entry | A balanced journal entry was committed"
      - "ledger.journal_entry.reversed | journal_entry | A journal entry was reversed"
      - "ledger.balance.changed | account_balance | Posted or available balance changed"
      - "ledger.hold.placed | hold | Funds were reserved"
      - "ledger.hold.captured | hold | A hold was captured into postings"
      - "ledger.hold.released | hold | A hold was released or expired"

  # ------------------------------------------------------------------ gl-service
  - name: gl-service
    database: gl_db
    description: >
      Chart of accounts per legal entity, product-to-GL mapping, real-time GL aggregation from ledger events,
      accounting periods and continuous close, trial balance, IFRS 9 provisions and ERP export.
    tables:
      - name: gl_account
        prefix: gla
        description: General ledger account in a legal entity's chart of accounts
        fr: [GL-01]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Legal entity"
          - "code string(32) nn | GL code, e.g. 2100-010"
          - "name string(160) nn | GL account name"
          - "account_class enum:GlAccountClass nn | Accounting class"
          - "parent_id uuid fk=gl_account idx | Parent node in the chart"
          - "level int nn default=1 | Depth in the hierarchy"
          - "is_postable bool nn default=true | Leaf accounts accept postings; headers do not"
          - "currency currency | Restrict to one currency; empty = multi-currency"
          - "regulatory_code string(64) | Mapping code for regulatory returns"
          - "erp_code string(64) | Mapping code for the ERP"
          - "is_retained_earnings bool nn default=false | Designated retained-earnings account (postable EQUITY, at most one per legal entity); the year-end close transfers the net profit or loss here"
          - "status enum:GlAccountStatus nn default=ACTIVE | Status"
        unique: [[tenant_id, legal_entity_id, code]]

      - name: gl_mapping_rule
        prefix: glm
        description: Maps ledger account types / products / transaction types to GL accounts
        fr: [GL-01, GL-02]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Legal entity"
          - "priority int nn default=100 | Lower wins when several rules match"
          - "product_id uuid ref=product idx | Product (empty = any)"
          - "ledger_account_type enum:LedgerAccountType | Ledger account class (empty = any)"
          - "owner_type string(40) | Owning business object type (empty = any)"
          - "entry_type enum:JournalEntryType | Journal entry type (empty = any)"
          - "balance_sign string(10) | POSITIVE or NEGATIVE: route overdrawn balances to an asset GL"
          - "gl_account_id uuid nn fk=gl_account | Target GL account"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"

      - name: accounting_period
        prefix: per
        description: Accounting period per legal entity; closing is a logical cut-off with no downtime
        fr: [GL-03]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Legal entity"
          - "period_type enum:PeriodType nn | Day, month, quarter or year"
          - "start_date date nn | First business date"
          - "end_date date nn | Last business date"
          - "status enum:PeriodStatus nn default=OPEN | Status"
          - "closed_at ts ro | Time the period was closed"
          - "closed_by string(64) ro | Who closed it (maker)"
          - "approved_by string(64) ro | Who approved the close (checker)"
        unique: [[tenant_id, legal_entity_id, period_type, start_date]]

      - name: gl_balance
        prefix: glb
        description: GL balance per account, period and currency, aggregated in real time from ledger events
        fr: [GL-02, GL-03]
        columns:
          - "gl_account_id uuid nn fk=gl_account | GL account"
          - "accounting_period_id uuid nn fk=accounting_period | Period"
          - "currency currency nn | Currency"
          - "opening_balance amount nn default=0 ro | Opening balance"
          - "debits amount nn default=0 ro | Period debits"
          - "credits amount nn default=0 ro | Period credits"
          - "closing_balance amount nn default=0 ro | Closing balance"
          - "base_closing_balance amount nn default=0 ro | Closing balance in entity base currency"
          - "last_event_at ts ro | Last ledger event applied"
        unique: [[gl_account_id, accounting_period_id, currency]]

      - name: gl_journal
        prefix: glj
        description: >-
          GL-level journal (aggregated from ledger postings or manual GL adjustments). Append-only. Manual journals
          post to the GL balances only once a gl_journal_approval exists for them; a gl_journal_rejection closes a
          manual journal without posting it (it no longer blocks the period close).
        immutable: true
        fr: [GL-02, GL-05]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Legal entity"
          - "accounting_period_id uuid nn fk=accounting_period | Period"
          - "journal_type string(32) nn | AUTO_AGGREGATE, MANUAL_ADJUSTMENT, ACCRUAL, PROVISION, INTER_ENTITY, REVALUATION, YEAR_END_CLOSE (AUTO_AGGREGATE and YEAR_END_CLOSE are system-only)"
          - "source_journal_entry_id uuid ref=journal_entry idx | Ledger journal entry, when derived"
          - "description string(500) | Narrative"
          - "value_date date nn | Value date"
        nested:
          - "lines list:gl_journal_line nn | Debit and credit lines; must balance per currency"

      - name: gl_journal_line
        prefix: gjl
        description: Debit or credit line of a GL journal. Append-only.
        immutable: true
        fr: [GL-02]
        columns:
          - "gl_journal_id uuid nn fk=gl_journal idx ro | GL journal"
          - "gl_account_id uuid nn fk=gl_account idx | GL account"
          - "direction enum:EntryDirection nn | Debit or credit"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "fx_rate rate | Rate to the entity base currency (default 1)"
          - "base_amount amount nn ro | Amount in entity base currency (amount x fx_rate)"
          - "cost_center string(32) | Cost centre"
          - "branch_id uuid ref=branch | Branch dimension"
          - "product_id uuid ref=product | Product dimension"

      - name: gl_journal_approval
        prefix: gja
        description: Checker sign-off of a GL journal (four-eyes); posts the journal to the GL balances. Append-only.
        immutable: true
        fr: [GL-02, GL-05]
        columns:
          - "gl_journal_id uuid nn fk=gl_journal uq ro | Approved GL journal (one approval per journal)"
          - "approved_by string(64) nn ro | Checker (system:<process> for system journals such as provisions)"
          - "comment string(500) | Checker comment"

      - name: gl_journal_rejection
        prefix: gjr
        description: Checker rejection of a manual GL journal (four-eyes); the journal never posts. Append-only.
        immutable: true
        fr: [GL-02, GL-05]
        columns:
          - "gl_journal_id uuid nn fk=gl_journal uq ro | Rejected GL journal (one decision per journal)"
          - "rejected_by string(64) nn ro | Checker"
          - "reason string(500) nn | Why the journal was rejected"

      - name: period_close_run
        prefix: pcr
        description: Execution of an EOD / EOM / EOY close with its checklist steps
        fr: [GL-03, GL-04]
        columns:
          - "accounting_period_id uuid nn fk=accounting_period idx | Period being closed"
          - "status enum:RunStatus nn default=QUEUED ro | Run status"
          - "started_at ts ro | Start time"
          - "finished_at ts ro | End time"
          - "steps json ro | Checklist: accruals, revaluation, provisions, recon checks, trial balance"
          - "error text ro | Error details"

      - name: ecl_provision
        prefix: ecl
        description: IFRS 9 expected credit loss provision per exposure and reporting date
        immutable: true
        fr: [GL-04]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Legal entity"
          - "reporting_date date nn | Reporting date"
          - "exposure_type string(32) nn | LOAN, CREDIT_LINE, CARD, OVERDRAFT"
          - "exposure_id uuid nn idx | Loan / account id"
          - "stage enum:EclStage nn | IFRS 9 stage"
          - "ead amount nn | Exposure at default"
          - "pd rate nn | Probability of default (12-month or lifetime)"
          - "lgd rate nn | Loss given default"
          - "ecl_amount amount nn | Expected credit loss"
          - "currency currency nn | Currency"
          - "model_version string(32) nn | Model version used"
          - "gl_journal_id uuid fk=gl_journal | Provision posting"
        unique: [[tenant_id, exposure_id, reporting_date]]

      - name: erp_export
        prefix: erp
        description: GL export batch sent to an external ERP (SAP, Oracle, NetSuite)
        fr: [GL-06]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Legal entity"
          - "accounting_period_id uuid nn fk=accounting_period | Period"
          - "target_system string(32) nn | SAP, ORACLE, NETSUITE, DYNAMICS, CSV"
          - "status enum:RunStatus nn default=QUEUED ro | Status"
          - "file_uri string(500) ro | Location of the generated file"
          - "line_count int ro | Lines exported"
          - "checksum string(64) ro | SHA-256 of the file"

    apis:
      - resource: gl-accounts
        path: /v1/gl/accounts
        table: gl_account
        ops: [list, get, create, update]
        filters: [legal_entity_id, account_class, parent_id, status, code]
      - resource: gl-mapping-rules
        path: /v1/gl/mapping-rules
        table: gl_mapping_rule
        ops: [list, get, create, update, delete]
        filters: [legal_entity_id, product_id, gl_account_id]
        actions:
          - "POST /simulate | Show which GL account a posting would map to: returns {gl_account, mapping_rule, as_of} | legal_entity_id uuid, product_id uuid, ledger_account_type enum:LedgerAccountType, entry_type enum:JournalEntryType, owner_type string(40), balance_sign string(10), as_of date | object"
      - resource: accounting-periods
        path: /v1/gl/periods
        table: accounting_period
        ops: [list, get, create]
        filters: [legal_entity_id, period_type, status]
        actions:
          - "POST /{id}/close | Start the period close (maker): checklist incl. year-end transfer of P&L to retained earnings | | period_close_run"
          - "POST /{id}/approve-close | Approve the close (checker) | comment string(500)"
          - "POST /{id}/reopen | Reopen a closed period (requires approval) | reason string(500) nn"
          - "GET /{id}/trial-balance | Trial balance for the period: {accounting_period_id, balanced, currencies[{currency, debits, credits, balanced}], lines[GL balance + account code, name, class]} | | object"
      - resource: gl-balances
        path: /v1/gl/balances
        table: gl_balance
        ops: [list, get]
        filters: [gl_account_id, accounting_period_id, currency]
      - resource: gl-journals
        path: /v1/gl/journals
        table: gl_journal
        ops: [list, get, create]
        filters: [legal_entity_id, accounting_period_id, journal_type, source_journal_entry_id]
        actions:
          - "GET /{id}/lines | Lines of a GL journal | | gl_journal_line[]"
          - "POST /{id}/approve | Approve a manual GL journal (checker, four-eyes) and post it to the GL balances | comment string(500) | gl_journal_approval"
          - "POST /{id}/reject | Reject a manual GL journal (checker, four-eyes); it never posts and no longer blocks the period close | reason string(500) nn | gl_journal_rejection"
      - resource: gl-journal-approvals
        path: /v1/gl/journal-approvals
        table: gl_journal_approval
        ops: [list, get]
        filters: [gl_journal_id, approved_by]
      - resource: gl-journal-rejections
        path: /v1/gl/journal-rejections
        table: gl_journal_rejection
        ops: [list, get]
        filters: [gl_journal_id, rejected_by]
      - resource: period-close-runs
        path: /v1/gl/close-runs
        table: period_close_run
        ops: [list, get]
        filters: [accounting_period_id, status]
      - resource: ecl-provisions
        path: /v1/gl/ecl-provisions
        table: ecl_provision
        ops: [list, get]
        filters: [legal_entity_id, reporting_date, stage, exposure_type, exposure_id]
        actions:
          - "POST /calculate | Run the ECL calculation for a reporting date; exposures [{exposure_type, exposure_id, stage, ead, pd_12m, pd_lifetime (or pd), lgd, currency}] (omitted = roll forward the latest provisions); with both GL accounts the ECL change is posted as a PROVISION journal. Returns {legal_entity_id, reporting_date, model_version, exposures, total_ecl{ccy}, gl_journal_id, period_close_run_id, provisions[]} | legal_entity_id uuid nn, reporting_date date nn, exposures json[], provision_expense_gl_account_id uuid, allowance_gl_account_id uuid | object"
      - resource: erp-exports
        path: /v1/gl/erp-exports
        table: erp_export
        ops: [list, get, create]
        filters: [legal_entity_id, accounting_period_id, status]
        actions:
          - "GET /{id}/download | Download the export file (CSV; checksum in X-Checksum-SHA256) | | text/csv"

    events:
      - "ledger.gl_journal.posted | gl_journal | A GL journal was posted"
      - "ledger.gl_journal.approved | gl_journal_approval | A manual GL journal was approved (four-eyes) and posted"
      - "ledger.gl_journal.rejected | gl_journal_rejection | A manual GL journal was rejected (four-eyes) and will not post"
      - "ledger.erp_export.completed | erp_export | An ERP export file was generated"
      - "ledger.accounting_period.closed | accounting_period | An accounting period was closed"
      - "ledger.accounting_period.reopened | accounting_period | A closed period was reopened"
      - "ledger.period_close_run.completed | period_close_run | A close run finished"
      - "ledger.ecl_provision.calculated | ecl_provision | ECL provisions were calculated"

  # ------------------------------------------------------------------ reconciliation-service
  - name: reconciliation-service
    database: recon_db
    description: >
      Imports external statements and settlement files, matches them against internal ledger records with
      configurable rules (and AI suggestions), and manages breaks in ageing exception queues.
    tables:
      - name: recon_source
        prefix: rsr
        description: A configured external source to reconcile (bank account, scheme, rail, partner)
        fr: [REC-01]
        columns:
          - "name string(120) nn | Display name"
          - "source_type enum:ReconSourceType nn | Kind of source"
          - "file_format enum:ReconFileFormat nn | Expected file format"
          - "ledger_account_id uuid ref=ledger_account idx | Internal account it reconciles against"
          - "currency currency | Currency"
          - "delivery_channel string(32) | SFTP, API, EMAIL, MANUAL_UPLOAD"
          - "schedule_cron string(64) | When files are expected"
          - "parser_config json | Column mapping and parsing options"
          - "is_active bool nn default=true | Active"

      - name: recon_file
        prefix: rfl
        description: An imported statement or settlement file
        fr: [REC-01]
        columns:
          - "recon_source_id uuid nn fk=recon_source idx | Source"
          - "file_name string(255) nn | Original file name"
          - "file_uri string(500) nn ro | Storage location"
          - "checksum string(64) nn ro | SHA-256, used to reject duplicates"
          - "statement_date date | Statement / settlement date"
          - "opening_balance amount | Opening balance stated in the file"
          - "closing_balance amount | Closing balance stated in the file"
          - "record_count int ro | Lines parsed"
          - "status enum:ReconFileStatus nn default=RECEIVED ro | Processing status"
          - "error text ro | Parsing error"
          - "statement_id string(64) ro | Statement / notification id stated in the file (camt Stmt/Id or Ntfctn/Id, MT940/MT942 :20:)"
          - "sequence_no string(32) ro | Statement sequence (camt ElctrncSeqNb, MT940 :28C:); with statement_id it identifies the statement"
          - "account_id string(64) ro | Account identification stated in the file (IBAN, MT940 :25:)"
          - "movements_total amount ro | Net of the parsed lines (credits - debits), checked against opening and closing balances"
        unique: [[tenant_id, checksum], [tenant_id, recon_source_id, statement_id, sequence_no]]

      - name: recon_record
        prefix: rrc
        description: One external line (statement line, settlement record). Append-only.
        immutable: true
        fr: [REC-01]
        columns:
          - "recon_file_id uuid nn fk=recon_file idx | File"
          - "recon_source_id uuid nn fk=recon_source idx | Source"
          - "external_ref string(128) | Bank / scheme reference"
          - "end_to_end_id string(64) idx | ISO 20022 end-to-end id when present"
          - "value_date date nn | Value date"
          - "booking_date date | Booking date"
          - "direction enum:EntryDirection nn | Debit or credit from the source's view"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "counterparty string(255) | Counterparty name / account"
          - "narrative string(500) | Description"
          - "raw json | Original parsed line"
          - "line_no int | Position of the line in the file"
          - "instruction_id string(64) | Instruction id (ISO 20022 InstrId)"
          - "uetr string(36) idx | Unique end-to-end transaction reference (SWIFT gpi / ISO 20022 UETR)"
          - "counterparty_account string(64) | Counterparty IBAN / account number"
          - "transaction_code string(32) | Bank transaction code (camt BkTxCd, MT940 transaction type)"
          - "is_reversal bool nn default=false | Reversal of an earlier booking (camt RvslInd, MT940 RC / RD)"
          - "charges_amount amount | Charges deducted by the bank, when stated"
          - "original_amount amount | Instructed amount before charges / FX conversion, when stated"
          - "original_currency currency | Currency of original_amount"
          - "batch_count int | Transactions summarised by a batch booking"

      - name: recon_rule
        prefix: rrl
        description: Matching rule, evaluated in priority order
        fr: [REC-02]
        columns:
          - "recon_source_id uuid fk=recon_source idx | Source (empty = all sources)"
          - "name string(120) nn | Rule name"
          - "priority int nn default=100 | Lower runs first"
          - "match_type enum:ReconMatchType nn | Cardinality"
          - "match_fields json[] nn | Fields that must be equal: amount, value_date, currency, direction, end_to_end_id, external_ref, reference"
          - "amount_tolerance amount nn default=0 | Allowed absolute amount difference"
          - "date_tolerance_days int nn default=0 | Allowed value-date difference"
          - "auto_confirm bool nn default=true | Confirm matches without review"
          - "is_active bool nn default=true | Active"

      - name: recon_rule_set
        prefix: rrs
        description: >
          Versioned, ordered matching configuration (exact keys, reference extraction, fuzzy scoring, one-to-many /
          many-to-one with bounded subset-sum, reversal pairing, fee / FX tolerances). Published with four-eyes
          through central approvals; a published version is immutable and supersedes the previous one of its scope.
        fr: [REC-02]
        columns:
          - "recon_source_id uuid fk=recon_source idx | Source (empty = tenant default for every source)"
          - "name string(120) nn | Name"
          - "version int nn default=1 ro | Version within the scope, assigned on create"
          - "status enum:ReconRuleSetStatus nn default=DRAFT ro | Lifecycle"
          - "auto_match_threshold rate nn default=0.9 | Minimum confidence to auto-confirm a match"
          - "suggest_threshold rate nn default=0.5 | Minimum confidence to propose a match for review"
          - "rules json[] | Ordered rule definitions [{code, type, ...}] (empty on create: the standard template); type: EXACT_KEY, REFERENCE_EXTRACT, FUZZY, ONE_TO_MANY, MANY_TO_ONE, REVERSAL_PAIR"
          - "description text | Notes"
          - "checksum string(64) ro | SHA-256 of the configuration (approval fingerprint)"
          - "submitted_by string(64) ro | Maker who submitted it"
          - "submitted_at ts ro | Submission time"
          - "approval_request_id uuid ro | Central approval request"
          - "approved_by string(64) ro | Checker who published it"
          - "published_at ts ro | Publication time"
          - "superseded_at ts ro | When a newer version replaced it"
          - "rejected_by string(64) ro | Checker who rejected it"
          - "rejection_reason string(500) ro | Why it was rejected"
        unique: [[tenant_id, recon_source_id, version]]

      - name: recon_run
        prefix: rrn
        description: A matching run over a source and date range
        fr: [REC-01, REC-02]
        columns:
          - "recon_source_id uuid nn fk=recon_source idx | Source"
          - "from_date date nn | Range start"
          - "to_date date nn | Range end"
          - "status enum:RunStatus nn default=QUEUED ro | Status"
          - "matched_count int ro | Records matched"
          - "exception_count int ro | Breaks raised"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"
          - "recon_rule_set_id uuid fk=recon_rule_set ro | Rule set version applied (empty = legacy rules)"
          - "business_date date ro | Business date when started by end of day"
          - "external_count int ro | External records considered"
          - "suggested_count int ro | External records with a suggestion below the auto-match threshold"
          - "auto_match_rate rate ro | Auto-matched / considered external records"
          - "metrics json ro | Per-rule counts, confidence statistics and break reasons"

      - name: recon_match
        prefix: rmt
        description: A confirmed link between external records and internal ledger entries. Append-only.
        immutable: true
        fr: [REC-02, REC-03]
        columns:
          - "recon_run_id uuid fk=recon_run idx | Run that produced it (empty when manual)"
          - "recon_rule_id uuid fk=recon_rule | Rule that matched"
          - "match_type enum:ReconMatchType nn | Cardinality"
          - "external_record_ids json[] nn | recon_record ids (sorted)"
          - "internal_entry_ids json[] nn | ledger_entry ids (sorted)"
          - "difference amount nn default=0 | Residual difference within tolerance"
          - "confidence rate | AI / rule confidence 0..1"
          - "confirmed_by string(64) | Who confirmed a manual or suggested match"
          - "unmatched_at ts | Set via a new compensating match record when undone"
          - "recon_rule_set_id uuid fk=recon_rule_set ro | Rule set version that produced it"
          - "rule_code string(64) ro | Rule of the rule set"
          - "explanation json ro | Why: rule, matched keys and score components (amount, date, name, reference)"

      - name: recon_exception
        prefix: rex
        description: A reconciliation break awaiting investigation
        fr: [REC-02, REC-03]
        columns:
          - "recon_run_id uuid fk=recon_run idx | Matching run that raised it (empty for a safeguarding stock-reconciliation break, which is not tied to a line-matching run)"
          - "recon_safeguarding_run_id uuid ref=recon_safeguarding_run idx | Safeguarding run that raised it (WE-RECON-1), when the break is a safeguarding shortfall / surplus (soft ref: recon_exception and recon_safeguarding_run reference each other, so this side is not an enforced FK to avoid a circular constraint)"
          - "reason enum:ReconExceptionReason nn | Break reason"
          - "status enum:ReconExceptionStatus nn default=OPEN | Status"
          - "external_record_id uuid fk=recon_record | External record, if any"
          - "internal_entry_id uuid ref=ledger_entry | Internal entry, if any"
          - "amount amount nn | Break amount"
          - "currency currency nn | Currency"
          - "age_days int nn default=0 ro | Days open"
          - "assigned_to string(64) idx | Assignee"
          - "suggested_match json ro | AI-suggested counterpart records with confidence"
          - "resolution_note text | How it was resolved"
          - "resolved_at ts ro | Resolution time"

      - name: recon_adjustment
        prefix: radj
        description: >
          A requested ledger adjustment or write-off for a break. Four-eyes: the approver (direct or through central
          approvals) must differ from the requester; on approval the journal entry is posted to ledger-service and
          the break closes (RESOLVED for an adjustment, WRITTEN_OFF for a write-off).
        fr: [REC-03]
        columns:
          - "recon_exception_id uuid nn fk=recon_exception idx | Break"
          - "kind enum:ReconAdjustmentKind nn | Adjustment (books the missing side) or write-off"
          - "status enum:ReconAdjustmentStatus nn default=PENDING_APPROVAL ro | Lifecycle"
          - "amount amount nn | Amount adjusted or written off"
          - "currency currency nn | Currency"
          - "ledger_id uuid ref=ledger | Ledger to post into (empty: write-off without a posting)"
          - "entries json[] | Balanced journal lines [{ledger_account_id, direction, amount, currency}]"
          - "reason text nn | Justification"
          - "requested_by string(64) ro | Maker"
          - "approval_request_id uuid ro | Central approval request"
          - "approved_by string(64) ro | Checker"
          - "decided_at ts ro | Decision time"
          - "rejection_reason string(500) ro | Why it was rejected"
          - "journal_entry_id uuid ref=journal_entry ro | Posted journal entry"

      - name: recon_safeguarding_config
        prefix: sgc
        description: >
          WE-RECON-1 (G-10, decision D-ED-12): per-tenant configuration of the trust / e-money safeguarding stock
          reconciliation A-(B+C+D+E). Defines how the backing trust bank balance A is sourced and the ordered set of
          e-money liability components B..E that must sum to the backing requirement, plus the de-minimis and timing
          tolerances. Additive and gated: with no active config the tenant runs no safeguarding reconciliation. The
          Wallet-Edition default component set is wallet liability (GL 2700 / IND04), e-money suspense (GL 2710 /
          IND02), e-money unclaimed (GL 2720 / IND06, a LIABILITY per decision D-ED-07) and agent / distributor float.
        fr: [REC-01]
        columns:
          - "name string(120) nn | Display name"
          - "is_active bool nn default=false | The per-tenant gate: when true the safeguarding reconciliation runs at EOD"
          - "legal_entity_id uuid ref=legal_entity idx | Legal entity whose GL balances back the figures"
          - "currency currency | Currency of the safeguarding account set (empty = sum across currencies)"
          - "trust_recon_source_id uuid fk=recon_source | Recon source whose latest statement closing balance is A (the trust bank figure), when A is ingested"
          - "trust_gl_code string(32) | GL code of the trust / safeguarding bank account, when A is read from gl-service instead"
          - "liability_components json[] nn | Ordered backing components B..E [{role (SafeguardingComponentRole), gl_code, label}]; the Wallet-Edition default set is 2700, 2710, 2720 and the agent float"
          - "tolerance amount nn default=0 | De-minimis absolute band treated as BALANCED (rounding)"
          - "timing_tolerance amount nn default=0 | Surplus band treated as an auto-clearing TIMING break rather than an AMOUNT break"
          - "schedule_enabled bool nn default=true | Whether the EOD job runs this config automatically"
        unique: [[tenant_id, name]]

      - name: recon_safeguarding_run
        prefix: sgr
        description: >
          WE-RECON-1 (G-10): one immutable, audited safeguarding stock-reconciliation record for a config and business
          date - the component snapshot (A and each of B..E), the result A-(B+C+D+E), the status and the source
          references. Idempotent per (tenant, config, business date): a re-run returns the same record and only
          advances the status forward (never regresses it within the day); the component snapshot is write-once.
          A SHORTFALL emits a CRITICAL, regulator-reportable event and opens a high-priority recon_exception.
        fr: [REC-01, REC-03]
        columns:
          - "recon_safeguarding_config_id uuid nn fk=recon_safeguarding_config idx | Config applied"
          - "business_date date nn | As-of business date"
          - "status enum:SafeguardingStatus nn | Reconciliation outcome"
          - "currency currency | Currency"
          - "trust_balance amount nn ro | A - trust / safeguarding bank balance (write-once snapshot)"
          - "liability_total amount nn ro | B+C+D+E - total e-money liability (write-once snapshot)"
          - "difference amount nn ro | A-(B+C+D+E); zero (within tolerance) = fully backed, negative = shortfall"
          - "components json[] nn ro | Per-component snapshot [{role, label, amount}] (write-once)"
          - "tolerance amount nn ro | De-minimis tolerance applied"
          - "timing_tolerance amount nn ro | Timing-surplus tolerance applied"
          - "backed bool nn ro | Whether the e-money was fully backed (difference >= -tolerance)"
          - "alarm_raised bool nn default=false | Whether a safeguarding shortfall alarm was emitted"
          - "recon_exception_id uuid fk=recon_exception | The high-priority break opened for a shortfall / persistent surplus, if any"
          - "age_days int nn default=0 ro | Days the break has been open"
          - "source_refs json ro | References for A and the GL balances (statement / GL snapshot)"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"
        unique: [[tenant_id, recon_safeguarding_config_id, business_date]]

    apis:
      - resource: recon-sources
        path: /v1/reconciliation/sources
        table: recon_source
        ops: [list, get, create, update]
        filters: [source_type, ledger_account_id, is_active]
      - resource: recon-files
        path: /v1/reconciliation/files
        table: recon_file
        ops: [list, get]
        filters: [recon_source_id, status, statement_date]
        actions:
          - "POST /import | Import a statement or settlement file, sent as raw content (CSV, camt.053/054 XML, JSON per the source's file_format) or as pre-parsed records [{value_date, direction, amount, currency, external_ref, end_to_end_id, booking_date, counterparty, narrative}]; de-duplicated by SHA-256 and parsed synchronously (status PARSED or FAILED) | recon_source_id uuid nn, file_name string(255) nn, content text, records json[], statement_date date, opening_balance amount, closing_balance amount | recon_file"
          - "GET /{id}/records | Parsed records of a file | | recon_record[]"
          - "POST /{id}/reprocess | Parse a failed file again"
      - resource: recon-rules
        path: /v1/reconciliation/rules
        table: recon_rule
        ops: [list, get, create, update, delete]
        filters: [recon_source_id, is_active]
      - resource: recon-rule-sets
        path: /v1/reconciliation/rule-sets
        table: recon_rule_set
        ops: [list, get, create, update]
        filters: [recon_source_id, status]
        actions:
          - "POST /{id}/submit | Submit a DRAFT (or REJECTED) version for four-eyes approval through central approvals | | recon_rule_set"
          - "POST /{id}/approve | Publish a submitted version (approver must differ from the submitter); the published version of the same scope is superseded | | recon_rule_set"
          - "POST /{id}/reject | Reject a submitted version back to the maker | reason string(500) nn | recon_rule_set"
          - "POST /{id}/simulate | Dry-run this version over a source and value-date range without storing anything: auto-match rate, suggestions and per-rule counts | recon_source_id uuid nn, from_date date nn, to_date date nn | object"
      - resource: recon-runs
        path: /v1/reconciliation/runs
        table: recon_run
        ops: [list, get, create]
        filters: [recon_source_id, status, business_date]
        actions:
          - "POST /eod?business_date:date! | End of day - reconcile every active source linked to a ledger account over its look-back window ending on business_date (idempotent per business date and source); returns records_processed, records_failed, auto-match rate and breaks raised | | object"
          - "GET /metrics?from_date:date!&to_date:date!&recon_source_id:uuid | Auto-match rate per run, source and rule, and open-break ageing (0-1, 2-7, 8-30, 31+ days) by reason | | object"
      - resource: recon-matches
        path: /v1/reconciliation/matches
        table: recon_match
        ops: [list, get, create]
        filters: [recon_run_id, match_type]
        actions:
          - "POST /{id}/unmatch | Undo a match (records return to the queue) | reason string(255) nn"
      - resource: recon-exceptions
        path: /v1/reconciliation/exceptions
        table: recon_exception
        ops: [list, get, update]
        filters: [recon_run_id, reason, status, assigned_to]
        actions:
          - "POST /{id}/assign | Assign to an investigator | assigned_to string(64) nn"
          - "POST /{id}/resolve | Resolve with a note, without a posting (adjustments and write-offs go through /v1/reconciliation/adjustments with four-eyes) | resolution_note text nn"
          - "POST /{id}/accept-suggestion | Confirm the suggested match | | recon_match"
      - resource: recon-adjustments
        path: /v1/reconciliation/adjustments
        table: recon_adjustment
        ops: [list, get, create]
        filters: [recon_exception_id, status, kind]
        actions:
          - "POST /{id}/approve | Approve (approver must differ from the requester): posts the journal entry and closes the break | | recon_adjustment"
          - "POST /{id}/reject | Reject the request; the break stays open | reason string(500) nn | recon_adjustment"
      - resource: safeguarding-configs
        path: /v1/reconciliation/safeguarding-configs
        table: recon_safeguarding_config
        ops: [list, get, create, update]
        filters: [is_active, legal_entity_id]
      - resource: safeguarding-runs
        path: /v1/reconciliation/safeguarding-runs
        table: recon_safeguarding_run
        ops: [list, get]
        filters: [recon_safeguarding_config_id, status, business_date]
        actions:
          - "POST /run?business_date:date! | WE-RECON-1 (G-10): run the trust / e-money safeguarding stock reconciliation A-(B+C+D+E) for a business date over every active config (or recon_safeguarding_config_id when given); idempotent per (tenant, config, business date). Component figures may be supplied as a documented fallback / override when a live GL read is not wired: trust_balance is A, components is the B..E set [{role, label, amount}]; omitted figures are read live from gl-service. A zero result (within tolerance) is BALANCED; a negative result is a SHORTFALL (CRITICAL, regulator-reportable, opens a high-priority break); a small surplus is a held TIMING break; a persistent surplus is an AMOUNT break in the exception queue | recon_safeguarding_config_id uuid, trust_balance amount, components json[] | object"

    events:
      - "ledger.recon_file.parsed | recon_file | A statement file was parsed"
      - "ledger.recon_run.completed | recon_run | A reconciliation run finished"
      - "ledger.recon_match.created | recon_match | External records and ledger entries were matched (rule, accepted suggestion or manual)"
      - "ledger.recon_match.unmatched | recon_match | A match was undone by a compensating record"
      - "ledger.recon_exception.raised | recon_exception | A reconciliation break was raised"
      - "ledger.recon_exception.resolved | recon_exception | A break was resolved"
      - "ledger.recon_rule_set.submitted | recon_rule_set | A rule set version was submitted for approval"
      - "ledger.recon_rule_set.published | recon_rule_set | A rule set version was approved and published"
      - "ledger.recon_rule_set.rejected | recon_rule_set | A submitted rule set version was rejected"
      - "ledger.recon_adjustment.requested | recon_adjustment | An adjustment or write-off was requested for a break"
      - "ledger.recon_adjustment.approved | recon_adjustment | An adjustment or write-off was approved and posted"
      - "ledger.recon_adjustment.rejected | recon_adjustment | An adjustment or write-off request was rejected"
      - "ledger.recon_safeguarding.completed | recon_safeguarding_run | A trust / e-money safeguarding stock reconciliation A-(B+C+D+E) completed (WE-RECON-1, G-10)"
      - "ledger.recon_safeguarding.shortfall | recon_safeguarding_run | A safeguarding shortfall was detected (A < e-money liabilities): CRITICAL, regulator-reportable"
      - "ledger.recon_eod.completed | recon_run | End-of-day reconciliation finished for a business date (counts and auto-match rate)"
