domain: treasury
title: Treasury and ALM
phase: 4
description: >
  Front-to-back treasury: money market, FX and securities deals with confirmations and settlement,
  counterparty limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and
  asset-liability management (repricing gap, NII/EVE sensitivity) with funds transfer pricing.

enums:
  TreasuryCounterpartyType: [BANK, CENTRAL_BANK, BROKER, CORPORATE, FUND, SOVEREIGN, SUPRANATIONAL, INTERNAL]
  TreasuryCounterpartyStatus: [PENDING_APPROVAL, ACTIVE, SUSPENDED, CLOSED]
  TreasuryDealStatus: [CAPTURED, VERIFIED, CONFIRMED, SETTLED, MATURED, CANCELLED, AMENDED]
  TreasuryDealType: [MONEY_MARKET, FX, SECURITY]
  TreasuryMmDealType: [PLACEMENT, BORROWING, CALL_PLACEMENT, CALL_BORROWING, REPO, REVERSE_REPO, CD_ISSUED, CD_PURCHASED]
  TreasuryRateType: [FIXED, FLOATING]
  TreasuryRolloverType: [NONE, PRINCIPAL_ONLY, PRINCIPAL_AND_INTEREST]
  TreasuryFxDealType: [SPOT, FORWARD, SWAP, NDF]
  TreasuryFxLegType: [NEAR, FAR]
  TreasuryBuySell: [BUY, SELL]
  TreasurySecurityType: [GOVERNMENT_BOND, TREASURY_BILL, CORPORATE_BOND, COVERED_BOND, SUPRANATIONAL_BOND, COMMERCIAL_PAPER, CERTIFICATE_OF_DEPOSIT]
  TreasuryAccountingClass: [HTM, AFS, FVTPL, AMORTISED_COST, FVOCI]
  TreasuryHqlaLevel: [L1, L2A, L2B, NONE]
  TreasuryTradeStatus: [PENDING, SETTLED, MATURED, SOLD, CANCELLED]
  TreasuryConfirmationStatus: [PENDING, SENT, RECEIVED, MATCHED, UNMATCHED, DISPUTED, CANCELLED]
  TreasuryConfirmationChannel: [SWIFT, EMAIL, PLATFORM, MANUAL]
  TreasuryConfirmationDirection: [OUTBOUND, INBOUND]
  TreasurySettlementStatus: [PENDING, INSTRUCTED, SETTLED, FAILED, CANCELLED]
  TreasurySettlementFlowType: [PRINCIPAL_OUT, PRINCIPAL_IN, INTEREST_IN, INTEREST_OUT, FX_PAY, FX_RECEIVE, NDF_PAY, NDF_RECEIVE, SECURITY_CASH_PAY, SECURITY_CASH_RECEIVE]
  TreasuryLimitType: [SETTLEMENT, PRE_SETTLEMENT, MONEY_MARKET, FX, ISSUER, COUNTRY, TENOR]
  TreasuryLimitStatus: [PENDING_APPROVAL, ACTIVE, SUSPENDED, EXPIRED]
  TreasuryUtilisationReason: [RESERVE, RELEASE, REFRESH]
  TreasuryEodJob: [MARK_TO_MARKET, INTEREST_ACCRUAL, MATURITY_PROCESSING, LIMIT_UTILISATION_REFRESH, LIQUIDITY_POSITION_SNAPSHOT]
  TreasuryEodRunStatus: [RUNNING, COMPLETED, COMPLETED_WITH_ERRORS]
  LiquidityPositionType: [ACTUAL, PROJECTED, FORECAST]
  LiquidityFlowCategory: [DEPOSITS, LOANS, PAYMENTS, CARDS, WALLETS, TREASURY_DEALS, SECURITIES, FEES, OTHER]
  LiquidityRatioStatus: [DRAFT, CALCULATED, REVIEWED, APPROVED, SUBMITTED]
  LiquidityStressSeverity: [MILD, MODERATE, SEVERE, IDIOSYNCRATIC, MARKET_WIDE, COMBINED]
  AlmShockType: [PARALLEL_UP, PARALLEL_DOWN, STEEPENER, FLATTENER, SHORT_UP, SHORT_DOWN, CUSTOM]
  AlmMeasure: [NII, EVE, EAR]
  AlmAssumptionType: [PREPAYMENT, DEPOSIT_DECAY, NON_MATURITY_REPRICING, EARLY_WITHDRAWAL, DRAWDOWN]
  FtpCurveType: [BASE, LIQUIDITY_PREMIUM, CONTINGENT_LIQUIDITY, MATCHED_MATURITY]
  FtpMethod: [MATCHED_MATURITY, POOLED, BEHAVIOURAL, FIXED_SPREAD]
  FtpExposureType: [DEPOSIT_ACCOUNT, TERM_DEPOSIT, LOAN, CREDIT_LINE]

services:
  # ------------------------------------------------------------------ treasury-deal-service
  - name: treasury-deal-service
    database: treasury_deal_db
    description: >
      Front and middle office for treasury: counterparties and limits, money market, FX and securities
      deals, confirmations (MT300/MT320) and settlement instructions; posts to the ledger on settlement,
      accrual and maturity, and releases payment instructions through payment-service.
    tables:
      - name: treasury_counterparty
        prefix: tcp
        description: Treasury counterparty (bank, central bank, broker, corporate) with identifiers and rating
        fr: [TRY-01, TRY-02]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Our legal entity dealing with the counterparty"
          - "code string(32) nn uq | Short code"
          - "name string(200) nn | Legal name"
          - "counterparty_type enum:TreasuryCounterpartyType nn | Type"
          - "bic string(11) idx | SWIFT BIC (8 or 11 characters; required for SWIFT confirmations)"
          - "lei string(20) idx | Legal Entity Identifier (ISO 17442, validated check digits)"
          - "country_code country nn | Country of incorporation (COUNTRY limits)"
          - "parent_counterparty_id uuid fk=treasury_counterparty | Group parent for aggregated limits"
          - "external_rating string(10) | External credit rating, e.g. AA-"
          - "rating_agency string(32) | Agency for the rating"
          - "internal_rating string(10) | Internal rating grade"
          - "isda_signed bool nn default=false | ISDA master agreement in place (required for forwards, swaps and NDFs)"
          - "csa_signed bool nn default=false | Credit support annex in place"
          - "gmra_signed bool nn default=false | GMRA in place (required for repos)"
          - "status enum:TreasuryCounterpartyStatus nn default=PENDING_APPROVAL ro | Status (driven by approve / suspend / reactivate)"
          - "approval_request_id uuid ref=approval_request | Onboarding approval"
          - "approved_by string(64) ro | Checker who approved onboarding (four-eyes)"
          - "approved_at ts ro | Approval time"
          - "status_reason string(255) ro | Reason of the last suspension or reactivation"
          - "notes text | Notes"

      - name: treasury_ssi
        prefix: ssi
        description: Standing settlement instructions per counterparty and currency (used only once verified)
        fr: [TRY-01]
        columns:
          - "treasury_counterparty_id uuid nn fk=treasury_counterparty idx | Counterparty"
          - "currency currency nn | Currency"
          - "beneficiary_bic string(11) nn | Beneficiary bank BIC"
          - "beneficiary_account string(64) nn | Beneficiary account / IBAN"
          - "intermediary_bic string(11) | Intermediary bank BIC"
          - "our_nostro_account_id uuid ref=nostro_account | Our nostro used to settle"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
          - "is_default bool nn default=true | Default SSI for the currency"
          - "verified_by string(64) ro | Four-eyes verifier (set by verify; cleared when payment details change)"
          - "verified_at ts ro | Verification time"
        unique: [[tenant_id, treasury_counterparty_id, currency, valid_from]]

      - name: treasury_counterparty_limit
        prefix: tcl
        description: Credit / settlement / tenor limit on a counterparty (or its group); usable once approved
        fr: [TRY-02]
        columns:
          - "treasury_counterparty_id uuid nn fk=treasury_counterparty idx | Counterparty (or group parent)"
          - "limit_type enum:TreasuryLimitType nn | Limit type"
          - "currency currency nn | Limit currency"
          - "limit_amount amount nn | Approved limit"
          - "max_tenor_days int | Maximum tenor allowed (TENOR limits; optional cap on any limit)"
          - "utilised_amount amount nn default=0 ro | Current utilisation"
          - "available_amount amount nn default=0 ro | Limit minus utilisation"
          - "warning_threshold_pct rate nn default=0.8 | Warn at this share of the limit"
          - "valid_from date nn | Effective from"
          - "valid_to date | Expiry"
          - "status enum:TreasuryLimitStatus nn default=PENDING_APPROVAL ro | Status (approve activates)"
          - "approved_by string(64) ro | Credit approver (four-eyes)"
          - "approved_at ts ro | Approval time"
          - "refreshed_at ts ro | Last utilisation refresh (end of day)"
        unique: [[tenant_id, treasury_counterparty_id, limit_type, currency, valid_from]]

      - name: treasury_limit_utilisation
        prefix: tlu
        description: Immutable record of a deal consuming or releasing a counterparty limit
        immutable: true
        fr: [TRY-02]
        columns:
          - "treasury_counterparty_limit_id uuid nn fk=treasury_counterparty_limit idx | Limit"
          - "deal_type enum:TreasuryDealType nn | Deal family"
          - "deal_id uuid nn idx | Deal consuming the limit"
          - "reason enum:TreasuryUtilisationReason nn | Reserve on capture, release on maturity / cancel, end-of-day refresh"
          - "amount amount nn | Utilisation change (negative releases)"
          - "currency currency nn | Currency"
          - "utilised_after amount nn | Utilisation after this change"
          - "breach bool nn default=false | Change breached the limit"
          - "override_approval_id uuid ref=approval_request | Approval for a breach"

      - name: money_market_deal
        prefix: mmd
        description: Money market placement, borrowing, call, repo or CD with full lifecycle
        fr: [TRY-01, GL-02]
        columns:
          - "deal_ref string(32) nn uq ro | Deal reference (server-generated)"
          - "legal_entity_id uuid nn ref=legal_entity | Booking entity"
          - "treasury_counterparty_id uuid nn fk=treasury_counterparty idx | Counterparty"
          - "deal_type enum:TreasuryMmDealType nn | Placement, borrowing, repo, ..."
          - "currency currency nn | Currency"
          - "principal amount nn | Principal amount"
          - "trade_date date nn | Trade date"
          - "value_date date nn | Value (start) date"
          - "maturity_date date | Maturity date (empty for call deals until called)"
          - "is_call bool nn default=false | Call (open-ended) deal"
          - "notice_days int | Notice period for call deals"
          - "rate_type enum:TreasuryRateType nn default=FIXED | Fixed or floating"
          - "interest_rate rate nn | All-in rate (annual, decimal)"
          - "rate_index string(32) | Index for floating deals, e.g. SOFR"
          - "spread rate | Spread over index"
          - "day_count enum:DayCountBasis nn default=ACT_360 | Day-count basis"
          - "interest_amount amount ro | Interest to maturity (paid at maturity)"
          - "maturity_amount amount ro | Principal plus interest at maturity"
          - "accrued_interest amount nn default=0 ro | Accrued interest to accrued_through"
          - "accrued_through date ro | Last date included in accrued_interest"
          - "rollover_type enum:TreasuryRolloverType nn default=NONE | Rollover instruction at maturity"
          - "rolled_from_deal_id uuid fk=money_market_deal ro | Previous deal when rolled"
          - "rolled_into_deal_id uuid fk=money_market_deal ro | New deal when this one was rolled"
          - "collateral_description text | Repo collateral details"
          - "dealer_id uuid nn ref=app_user | Dealer"
          - "nostro_account_id uuid ref=nostro_account | Our nostro (default: SSI nostro)"
          - "verified_by string(64) ro | Back-office verifier (four-eyes)"
          - "verified_at ts ro | Verification time"
          - "confirmed_at ts ro | Confirmation time"
          - "settled_at ts ro | Start-leg settlement time"
          - "matured_at ts ro | Maturity processing time"
          - "status enum:TreasuryDealStatus nn default=CAPTURED ro | Lifecycle status"
          - "ledger_account_id uuid ref=ledger_account ro | Ledger account carrying the deal"
          - "settlement_journal_entry_id uuid ref=journal_entry ro | Posting on settlement"
          - "maturity_journal_entry_id uuid ref=journal_entry ro | Posting on maturity"
          - "cancel_reason string(255) ro | Cancellation reason"
        indexes: [[maturity_date, status], [value_date]]

      - name: treasury_fx_deal
        prefix: tfx
        description: Treasury FX deal (spot, forward, swap, NDF) with its legs — distinct from customer FX in payments
        fr: [TRY-01, GL-02]
        columns:
          - "deal_ref string(32) nn uq ro | Deal reference (server-generated)"
          - "legal_entity_id uuid nn ref=legal_entity | Booking entity"
          - "treasury_counterparty_id uuid nn fk=treasury_counterparty idx | Counterparty"
          - "deal_type enum:TreasuryFxDealType nn | Spot, forward, swap or NDF"
          - "trade_date date nn | Trade date"
          - "dealer_id uuid nn ref=app_user | Dealer"
          - "non_deliverable bool nn default=false | NDF: net cash settlement in settlement_currency at the fixing (always true for deal_type NDF)"
          - "settlement_currency currency | NDF settlement currency"
          - "fixing_date date | NDF fixing date"
          - "fixing_source string(64) | NDF fixing source"
          - "fixing_rate rate ro | NDF fixing rate recorded by fix"
          - "ndf_settlement_amount amount ro | NDF net settlement amount in settlement_currency (positive = we receive)"
          - "status enum:TreasuryDealStatus nn default=CAPTURED ro | Lifecycle status"
          - "verified_by string(64) ro | Back-office verifier (four-eyes)"
          - "verified_at ts ro | Verification time"
          - "confirmed_at ts ro | Confirmation time"
          - "mtm_value amount ro | Latest mark-to-market in mtm_currency (positive = asset)"
          - "mtm_currency currency ro | Currency of mtm_value (quote currency of the near leg)"
          - "mtm_date date ro | Valuation date"
          - "cancel_reason string(255) ro | Cancellation reason"
        nested:
          - "legs list:treasury_fx_deal_leg nn | One leg for spot / forward / NDF, NEAR and FAR legs for swaps"

      - name: treasury_fx_deal_leg
        prefix: tfl
        description: A leg of a treasury FX deal (one for spot/forward, two for swaps)
        fr: [TRY-01]
        columns:
          - "treasury_fx_deal_id uuid nn fk=treasury_fx_deal idx ro | Deal"
          - "leg_type enum:TreasuryFxLegType nn default=NEAR | Near or far leg"
          - "buy_sell enum:TreasuryBuySell nn | Our direction on the base currency"
          - "base_currency currency nn | Base currency"
          - "base_amount amount nn | Base amount"
          - "quote_currency currency nn | Quote currency"
          - "quote_amount amount ro | Quote amount (base_amount x deal_rate)"
          - "deal_rate rate nn | All-in rate (quote units per base unit)"
          - "spot_rate rate | Spot component"
          - "forward_points rate | Forward points in pips (0.0001; 0.01 for JPY quotes): deal_rate = spot_rate + points x pip"
          - "value_date date nn | Settlement date"
          - "settlement_status enum:TreasurySettlementStatus nn default=PENDING ro | Settlement status"
          - "journal_entry_id uuid ref=journal_entry ro | Settlement posting"
        unique: [[treasury_fx_deal_id, leg_type]]

      - name: treasury_security
        prefix: sec
        description: Security master record (bonds, bills, CP, CDs)
        fr: [TRY-01]
        columns:
          - "isin string(12) nn uq | ISIN (ISO 6166, validated check digit)"
          - "name string(200) nn | Security name"
          - "security_type enum:TreasurySecurityType nn | Type"
          - "issuer_name string(200) nn | Issuer"
          - "issuer_counterparty_id uuid fk=treasury_counterparty | Issuer as counterparty (issuer limits)"
          - "currency currency nn | Currency"
          - "coupon_rate rate | Coupon rate (empty for discount instruments)"
          - "coupon_frequency int | Coupons per year (1, 2, 4 or 12)"
          - "issue_date date | Issue date"
          - "maturity_date date nn | Maturity"
          - "day_count enum:DayCountBasis nn default=ACT_ACT_ISDA | Day count"
          - "hqla_level enum:TreasuryHqlaLevel nn default=NONE | Basel HQLA level"
          - "last_price rate ro | Last clean price (% of nominal)"
          - "last_price_date date ro | Price date"

      - name: securities_holding
        prefix: shl
        description: Position in a security by portfolio and accounting classification (maintained by trade settlement)
        fr: [TRY-01, GL-02]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Entity"
          - "treasury_security_id uuid nn fk=treasury_security idx | Security"
          - "portfolio string(64) nn | Portfolio / book"
          - "accounting_class enum:TreasuryAccountingClass nn | HTM, AFS, FVTPL, ..."
          - "nominal amount nn default=0 ro | Face value held"
          - "average_price rate ro | Weighted average clean purchase price (% of nominal)"
          - "book_value amount nn default=0 ro | Book value (nominal x average price)"
          - "market_value amount ro | Clean market value at valuation_date"
          - "accrued_interest amount nn default=0 ro | Accrued coupon at valuation_date"
          - "unrealised_pnl amount ro | Market value minus book value (P&L for FVTPL, OCI for AFS / FVOCI)"
          - "realised_pnl amount nn default=0 ro | Cumulative realised P&L from sales"
          - "is_encumbered bool nn default=false ro | Pledged as collateral (encumber action)"
          - "encumbrance_reason string(255) ro | Reason of the last encumbrance change"
          - "ledger_account_id uuid ref=ledger_account | Ledger account"
          - "valuation_date date ro | Valuation date"
        unique: [[tenant_id, treasury_security_id, portfolio, accounting_class]]

      - name: securities_trade
        prefix: str
        description: Purchase or sale of a security that changes a holding (holding resolved or opened on capture)
        fr: [TRY-01, GL-02]
        columns:
          - "deal_ref string(32) nn uq ro | Trade reference (server-generated)"
          - "legal_entity_id uuid nn ref=legal_entity | Booking entity"
          - "treasury_security_id uuid nn fk=treasury_security idx | Security traded"
          - "portfolio string(64) nn | Portfolio / book"
          - "accounting_class enum:TreasuryAccountingClass nn | Classification of the holding"
          - "securities_holding_id uuid nn fk=securities_holding idx ro | Holding affected"
          - "treasury_counterparty_id uuid nn fk=treasury_counterparty | Counterparty / broker"
          - "buy_sell enum:TreasuryBuySell nn | Buy or sell"
          - "nominal amount nn | Nominal traded"
          - "clean_price rate nn | Clean price (% of nominal)"
          - "dirty_price rate ro | Dirty price (% of nominal)"
          - "accrued_interest amount nn ro | Accrued interest paid / received (security day count)"
          - "settlement_amount amount nn ro | Dirty settlement amount"
          - "simple_yield rate ro | Simple yield to maturity at the clean price"
          - "currency currency nn ro | Currency (from the security)"
          - "trade_date date nn | Trade date"
          - "settlement_date date nn | Settlement date"
          - "dealer_id uuid nn ref=app_user | Dealer"
          - "status enum:TreasuryTradeStatus nn default=PENDING ro | Status"
          - "realised_pnl amount ro | Realised P&L on sale"
          - "settled_at ts ro | Settlement time"
          - "cancel_reason string(255) ro | Cancellation reason"
          - "journal_entry_id uuid ref=journal_entry ro | Settlement posting"

      - name: treasury_deal_confirmation
        prefix: tdc
        description: Confirmation of a treasury deal (SWIFT MT300 FX, MT320 MM, MT541/543 securities) and matching
        fr: [TRY-01]
        columns:
          - "deal_type enum:TreasuryDealType nn | Deal family"
          - "deal_id uuid idx | Deal confirmed (empty for an inbound confirmation not yet matched)"
          - "channel enum:TreasuryConfirmationChannel nn default=SWIFT | Channel"
          - "message_type string(16) | MT300, MT320, MT541, MT543, ..."
          - "our_reference string(35) nn | Our SWIFT reference (field 20 outbound, field 21 inbound)"
          - "their_reference string(35) | Counterparty reference"
          - "direction enum:TreasuryConfirmationDirection nn | OUTBOUND (generated) or INBOUND (received)"
          - "status enum:TreasuryConfirmationStatus nn default=PENDING ro | Matching status"
          - "fields json | Inbound confirmation fields from the counterparty's perspective (parsed from message_text when absent)"
          - "message_text text | Raw message (MT text) — generated for outbound, received for inbound"
          - "mismatch_fields json[] ro | Fields that did not match: [{field, ours, theirs}]"
          - "dispute_reason string(500) ro | Reason given when disputed"
          - "sent_at ts ro | Sent time"
          - "matched_at ts ro | Match time"
          - "raw_message_document_id uuid ref=document | Stored raw message"

      - name: treasury_settlement
        prefix: tst
        description: Settlement instruction generated for a treasury deal cash flow
        fr: [TRY-01, GL-02]
        columns:
          - "deal_type enum:TreasuryDealType nn | Deal family"
          - "deal_id uuid nn idx | Deal"
          - "flow_type enum:TreasurySettlementFlowType nn | Cash flow"
          - "direction enum:EntryDirection nn | Pay (CREDIT nostro) or receive (DEBIT nostro)"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "value_date date nn | Settlement date"
          - "treasury_ssi_id uuid fk=treasury_ssi | Counterparty SSI used"
          - "nostro_account_id uuid ref=nostro_account | Our nostro"
          - "payment_id uuid ref=payment ro | Outgoing payment created by instruct"
          - "status enum:TreasurySettlementStatus nn default=PENDING ro | Status"
          - "journal_entry_id uuid ref=journal_entry ro | Ledger posting"
          - "instructed_at ts ro | Release time"
          - "settled_at ts ro | Confirmed settled"
          - "settlement_reference string(64) ro | Nostro statement reference"
          - "failure_reason string(255) ro | Failure reason"
        unique: [[tenant_id, deal_id, flow_type, value_date]]
        indexes: [[value_date, status]]

      - name: treasury_eod_run
        prefix: ter
        description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
        fr: [TRY-01, TRY-02, OPS-01]
        columns:
          - "job enum:TreasuryEodJob nn | Job"
          - "business_date date nn | Business date processed"
          - "status enum:TreasuryEodRunStatus nn default=RUNNING ro | Outcome; COMPLETED runs are replayed, others may be re-run"
          - "attempts int nn default=1 ro | Executions for this job and date"
          - "result json ro | Counts and per-item errors of the last execution"
          - "started_at ts nn default=now ro | Start of the last execution"
          - "completed_at ts ro | End of the last execution"
        unique: [[tenant_id, job, business_date]]

    apis:
      - resource: treasury-counterparties
        path: /v1/treasury/counterparties
        table: treasury_counterparty
        ops: [list, get, create, update]
        filters: [counterparty_type, status, country_code, bic, lei, legal_entity_id]
        actions:
          - "POST /{id}/approve | Approve counterparty onboarding (checker; not the maker) | comment string(500)"
          - "POST /{id}/suspend | Suspend dealing with a counterparty | reason string(255) nn"
          - "POST /{id}/reactivate | Reactivate a suspended counterparty | reason string(255) nn"
          - "GET /{id}/exposure | Aggregated exposure: limits with utilisation and headroom, outstanding deals by family | | object"
      - resource: treasury-ssis
        path: /v1/treasury/ssis
        table: treasury_ssi
        ops: [list, get, create, update]
        filters: [treasury_counterparty_id, currency, is_default]
        actions:
          - "POST /{id}/verify | Four-eyes verification of an SSI (checker; not the maker) | comment string(500)"
      - resource: treasury-counterparty-limits
        path: /v1/treasury/limits
        table: treasury_counterparty_limit
        ops: [list, get, create, update]
        filters: [treasury_counterparty_id, limit_type, currency, status]
        actions:
          - "POST /{id}/approve | Approve the limit (credit checker; not the maker) | comment string(500)"
          - "POST /check | Pre-deal limit check of a prospective exposure (no reservation) | treasury_counterparty_id uuid nn, limit_type enum:TreasuryLimitType nn, amount amount nn, currency currency nn, tenor_days int | object"
          - "GET /{id}/utilisations | Utilisation history | | treasury_limit_utilisation[]"
      - resource: treasury-limit-utilisations
        path: /v1/treasury/limit-utilisations
        table: treasury_limit_utilisation
        ops: [list, get]
        filters: [treasury_counterparty_limit_id, deal_id, breach, reason]
      - resource: money-market-deals
        path: /v1/treasury/money-market-deals
        table: money_market_deal
        ops: [list, get, create, update]
        filters: [treasury_counterparty_id, deal_type, currency, status, value_date, maturity_date, legal_entity_id]
        actions:
          - "POST /{id}/verify | Back-office verification (checker; not the capturing dealer)"
          - "POST /{id}/confirm | Mark confirmed (requires a matched inbound confirmation unless confirmed manually with a reference) | manual_reference string(64)"
          - "POST /{id}/settle | Settle the start leg: settlement instructions and ledger posting"
          - "POST /{id}/rollover | Roll over at maturity into a new deal | new_rate rate nn, new_maturity_date date, rollover_type enum:TreasuryRolloverType nn | money_market_deal"
          - "POST /{id}/mature | Process maturity: repay principal and interest"
          - "POST /{id}/call | Call an open-ended deal; maturity = call_date + notice_days | call_date date nn"
          - "POST /{id}/cancel | Cancel a deal before settlement (releases limits) | reason string(255) nn"
          - "POST /{id}/accrue | Recalculate accrued interest through a date | as_of date nn"
          - "GET /{id}/confirmation-message | MT320 confirmation text for the deal | | text/plain"
      - resource: treasury-fx-deals
        path: /v1/treasury/fx-deals
        table: treasury_fx_deal
        ops: [list, get, create, update]
        filters: [treasury_counterparty_id, deal_type, status, trade_date, legal_entity_id]
        actions:
          - "GET /{id}/legs | Legs of the deal | | treasury_fx_deal_leg[]"
          - "POST /{id}/verify | Back-office verification (checker; not the capturing dealer)"
          - "POST /{id}/confirm | Mark confirmed (requires a matched inbound confirmation unless confirmed manually with a reference) | manual_reference string(64)"
          - "POST /{id}/settle | Settle the due leg | leg_type enum:TreasuryFxLegType nn"
          - "POST /{id}/fix | Record the NDF fixing and compute the net settlement amount | fixing_rate rate nn"
          - "POST /{id}/revalue | Mark to market (market_rate default: reference-data REVALUATION rate) | valuation_date date nn, market_rate rate"
          - "POST /{id}/cancel | Cancel the deal (releases limits) | reason string(255) nn"
          - "GET /{id}/confirmation-message | MT300 confirmation text for the deal | | text/plain"
      - resource: treasury-fx-deal-legs
        path: /v1/treasury/fx-deal-legs
        table: treasury_fx_deal_leg
        ops: [list, get]
        filters: [treasury_fx_deal_id, value_date, settlement_status, base_currency, quote_currency]
      - resource: treasury-securities
        path: /v1/treasury/securities
        table: treasury_security
        ops: [list, get, create, update]
        filters: [isin, security_type, currency, hqla_level, maturity_date]
        actions:
          - "POST /{id}/prices | Record a market price | price rate nn, price_date date nn"
          - "GET /{id}/analytics?clean_price:rate!&settlement_date:date!&nominal:amount | Accrued interest, dirty price, settlement amount and simple yield | | object"
      - resource: securities-holdings
        path: /v1/treasury/holdings
        table: securities_holding
        ops: [list, get]
        filters: [treasury_security_id, portfolio, accounting_class, legal_entity_id, is_encumbered]
        actions:
          - "POST /revalue | Revalue holdings at a valuation date (last prices, accrued coupon, unrealised P&L) | valuation_date date nn, legal_entity_id uuid nn | object"
          - "POST /{id}/encumber | Pledge or release as collateral | is_encumbered bool nn, reason string(255)"
      - resource: securities-trades
        path: /v1/treasury/securities-trades
        table: securities_trade
        ops: [list, get, create]
        filters: [securities_holding_id, treasury_security_id, treasury_counterparty_id, buy_sell, status, trade_date]
        actions:
          - "POST /{id}/settle | Settle the trade, update the holding and post to the ledger"
          - "POST /{id}/cancel | Cancel before settlement | reason string(255) nn"
      - resource: treasury-confirmations
        path: /v1/treasury/confirmations
        table: treasury_deal_confirmation
        ops: [list, get, create]
        filters: [deal_type, deal_id, status, channel, direction]
        actions:
          - "POST /generate | Generate and send our outbound confirmation (MT320 / MT300) for a deal | deal_type enum:TreasuryDealType nn, deal_id uuid nn, channel enum:TreasuryConfirmationChannel | treasury_deal_confirmation"
          - "POST /{id}/match | Match an inbound confirmation to a deal (MATCHED confirms a verified deal) | deal_id uuid nn"
          - "POST /{id}/dispute | Flag a confirmation mismatch | reason string(500) nn"
          - "GET /{id}/message | Confirmation message text | | text/plain"
      - resource: treasury-settlements
        path: /v1/treasury/settlements
        table: treasury_settlement
        ops: [list, get]
        filters: [deal_type, deal_id, status, value_date, currency]
        actions:
          - "POST /{id}/instruct | Release the settlement as a payment (pay flows) or await receipt (receive flows)"
          - "POST /{id}/mark-settled | Confirm settlement from nostro statement | reference string(64)"
          - "POST /{id}/fail | Mark settlement failed | reason string(255) nn"
          - "GET /projected-flows?from:date!&to:date!&legal_entity_id:uuid&currency:currency | Contractual cash flows of live deals and open settlements by value date (liquidity projection) | | object"
      - resource: treasury-eod-runs
        path: /v1/treasury/eod-runs
        table: treasury_eod_run
        ops: [list, get]
        filters: [job, business_date, status]
        actions:
          - "POST /mark-to-market?business_date:date! | End of day - revalue live FX deals and securities holdings as of business_date (idempotent per business date) | | object"
          - "POST /accruals?business_date:date! | End of day - accrue money market interest and holding coupons through business_date with ledger postings (idempotent per business date) | | object"
          - "POST /maturities?business_date:date! | End of day - mature or roll over money market deals due on or before business_date (idempotent per business date) | | object"
          - "POST /limit-utilisation?business_date:date! | End of day - expire limits and rebuild utilisation from live deals (idempotent per business date) | | object"

    events:
      - "treasury.counterparty.created | treasury_counterparty | A treasury counterparty was captured (pending approval)"
      - "treasury.counterparty.approved | treasury_counterparty | A treasury counterparty was approved"
      - "treasury.counterparty.suspended | treasury_counterparty | A treasury counterparty was suspended"
      - "treasury.counterparty.reactivated | treasury_counterparty | A suspended counterparty was reactivated"
      - "treasury.ssi.verified | treasury_ssi | A standing settlement instruction was verified"
      - "treasury.limit.approved | treasury_counterparty_limit | A counterparty limit was approved"
      - "treasury.limit.warning_reached | treasury_limit_utilisation | Utilisation crossed the limit's warning threshold"
      - "treasury.limit.breached | treasury_limit_utilisation | A counterparty limit was breached"
      - "treasury.money_market_deal.captured | money_market_deal | A money market deal was captured"
      - "treasury.money_market_deal.verified | money_market_deal | A money market deal was verified"
      - "treasury.money_market_deal.confirmed | money_market_deal | A money market deal was confirmed"
      - "treasury.money_market_deal.settled | money_market_deal | A money market deal settled"
      - "treasury.money_market_deal.called | money_market_deal | A call deal was called"
      - "treasury.money_market_deal.rolled_over | money_market_deal | A money market deal was rolled into a new deal"
      - "treasury.money_market_deal.matured | money_market_deal | A money market deal matured"
      - "treasury.money_market_deal.cancelled | money_market_deal | A money market deal was cancelled"
      - "treasury.fx_deal.captured | treasury_fx_deal | A treasury FX deal was captured"
      - "treasury.fx_deal.verified | treasury_fx_deal | A treasury FX deal was verified"
      - "treasury.fx_deal.confirmed | treasury_fx_deal | A treasury FX deal was confirmed"
      - "treasury.fx_deal.settled | treasury_fx_deal | A treasury FX deal leg settled"
      - "treasury.fx_deal.fixed | treasury_fx_deal | An NDF fixing was recorded"
      - "treasury.fx_deal.revalued | treasury_fx_deal | A treasury FX deal was marked to market"
      - "treasury.fx_deal.cancelled | treasury_fx_deal | A treasury FX deal was cancelled"
      - "treasury.security.priced | treasury_security | A market price was recorded for a security"
      - "treasury.securities_holding.revalued | securities_holding | A securities holding was revalued"
      - "treasury.securities_holding.encumbrance_changed | securities_holding | A holding was pledged or released"
      - "treasury.securities_trade.captured | securities_trade | A securities trade was captured"
      - "treasury.securities_trade.settled | securities_trade | A securities trade settled"
      - "treasury.securities_trade.cancelled | securities_trade | A securities trade was cancelled"
      - "treasury.confirmation.sent | treasury_deal_confirmation | An outbound confirmation was generated and sent"
      - "treasury.confirmation.matched | treasury_deal_confirmation | An inbound confirmation matched its deal"
      - "treasury.confirmation.unmatched | treasury_deal_confirmation | A deal confirmation did not match"
      - "treasury.confirmation.disputed | treasury_deal_confirmation | A confirmation was disputed"
      - "treasury.settlement.instructed | treasury_settlement | A treasury settlement was released"
      - "treasury.settlement.settled | treasury_settlement | A treasury settlement was confirmed settled"
      - "treasury.settlement.failed | treasury_settlement | A treasury settlement failed"
      - "treasury.eod_run.completed | treasury_eod_run | A treasury end-of-day job finished for a business date"

  # ------------------------------------------------------------------ liquidity-service
  - name: liquidity-service
    database: liquidity_db
    description: >
      Real-time and projected cash positions by currency and nostro, maturity ladders, Basel III LCR and
      NSFR calculations, intraday liquidity monitoring and liquidity stress testing.
    tables:
      - name: liquidity_cash_position
        prefix: lcp
        description: Actual or projected cash position by currency, nostro and day
        fr: [TRY-03]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Entity"
          - "position_date date nn | Business date"
          - "currency currency nn | Currency"
          - "nostro_account_id uuid ref=nostro_account | Nostro (empty = all accounts in the currency)"
          - "position_type enum:LiquidityPositionType nn | Actual, projected or forecast"
          - "opening_balance amount nn | Opening balance"
          - "expected_inflows amount nn default=0 | Expected inflows"
          - "expected_outflows amount nn default=0 | Expected outflows"
          - "closing_balance amount nn ro | Closing balance = opening + inflows - outflows"
          - "minimum_buffer amount | Minimum buffer required"
          - "shortfall amount ro | Buffer shortfall (minimum_buffer - closing_balance), if positive"
          - "flows_by_category json ro | Inflows/outflows by LiquidityFlowCategory: {CATEGORY: {inflows, outflows}}"
        unique: [[tenant_id, legal_entity_id, position_date, currency, nostro_account_id, position_type]]

      - name: liquidity_ladder_run
        prefix: llr
        description: A maturity ladder (liquidity gap) computation at an as-of date
        fr: [TRY-03]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Entity"
          - "as_of_date date nn | As-of date"
          - "currency currency | Currency (empty = all, amounts taken as base currency)"
          - "behavioural bool nn default=true | Apply behavioural profiles to non-maturity items"
          - "status enum:RunStatus nn default=QUEUED ro | Run status"
          - "total_inflows amount ro | Sum of inflows over all buckets"
          - "total_outflows amount ro | Sum of outflows over all buckets"
          - "negative_gap_bucket string(16) ro | First bucket whose cumulative gap is negative"
          - "error_message string(500) ro | Why the run failed"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"
        request_only:
          - "items json[] | Flows [{category, direction IN|OUT, amount, currency, maturity_date | days, behavioural_profile [{bucket_code, share}]}]; empty = projected flows of live treasury deals"

      - name: liquidity_bucket
        prefix: lbk
        description: One time bucket of a maturity ladder with inflows, outflows and cumulative gap
        immutable: true
        fr: [TRY-03]
        columns:
          - "liquidity_ladder_run_id uuid nn fk=liquidity_ladder_run idx | Ladder run"
          - "bucket_code string(16) nn | O/N, 2-7D, 8-30D, 1-3M, 3-6M, 6-12M, 1-5Y, >5Y"
          - "bucket_order int nn | Display order"
          - "start_day int nn | First day of the bucket"
          - "end_day int | Last day (empty = open)"
          - "inflows amount nn | Contractual / behavioural inflows"
          - "outflows amount nn | Outflows"
          - "net_gap amount nn | Inflows minus outflows"
          - "cumulative_gap amount nn | Cumulative gap"
          - "breakdown json | Amounts by flow category: {CATEGORY: {inflows, outflows}}"

      - name: lcr_calculation
        prefix: lcr
        description: Basel III Liquidity Coverage Ratio snapshot
        fr: [TRY-03, REG-01]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Entity"
          - "as_of_date date nn | As-of date"
          - "currency currency nn | Reporting currency"
          - "hqla_level1 amount nn ro | Level 1 HQLA after haircuts"
          - "hqla_level2a amount nn ro | Level 2A HQLA after haircuts"
          - "hqla_level2b amount nn ro | Level 2B HQLA after haircuts"
          - "cap_adjustment amount nn default=0 ro | Reduction applied by the 15% (L2B) and 40% (L2) caps"
          - "total_hqla amount nn ro | Total HQLA after caps"
          - "outflows_30d amount nn ro | Weighted 30-day outflows"
          - "inflows_30d amount nn ro | Weighted inflows (capped at 75% of outflows)"
          - "uncapped_inflows amount nn default=0 ro | Weighted inflows before the 75% cap"
          - "net_outflows amount nn ro | Net cash outflows"
          - "lcr_ratio rate nn ro | LCR = HQLA / net outflows"
          - "regulatory_minimum rate nn default=1.0 | Minimum ratio"
          - "breach bool nn default=false ro | Ratio below the regulatory minimum"
          - "components json[] nn ro | Line-level components [{line, code, category, amount, factor, weighted}]"
          - "status enum:LiquidityRatioStatus nn default=CALCULATED ro | Status"
          - "approved_by string(64) ro | Approver (four-eyes)"
          - "approved_at ts ro | Approval time"
        unique: [[tenant_id, legal_entity_id, as_of_date, currency]]

      - name: nsfr_calculation
        prefix: nsf
        description: Basel III Net Stable Funding Ratio snapshot
        fr: [TRY-03, REG-01]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity idx | Entity"
          - "as_of_date date nn | As-of date"
          - "currency currency nn | Reporting currency"
          - "available_stable_funding amount nn ro | ASF"
          - "required_stable_funding amount nn ro | RSF"
          - "nsfr_ratio rate nn ro | ASF / RSF"
          - "regulatory_minimum rate nn default=1.0 | Minimum ratio"
          - "breach bool nn default=false ro | Ratio below the regulatory minimum"
          - "components json[] nn ro | ASF/RSF factors per balance-sheet line [{line, code, side, amount, factor, weighted}]"
          - "status enum:LiquidityRatioStatus nn default=CALCULATED ro | Status"
          - "approved_by string(64) ro | Approver (four-eyes)"
          - "approved_at ts ro | Approval time"
        unique: [[tenant_id, legal_entity_id, as_of_date, currency]]

      - name: liquidity_stress_scenario
        prefix: lss
        description: Definition of a liquidity stress scenario (run-off rates, haircuts, horizon)
        fr: [TRY-03]
        columns:
          - "code string(32) nn uq | Scenario code"
          - "name string(160) nn | Name"
          - "severity enum:LiquidityStressSeverity nn | Severity / type"
          - "horizon_days int nn default=30 | Survival horizon"
          - "assumptions json nn | {runoff_rates {CODE: rate}, inflow_rates {CODE: rate}, hqla_haircuts {L1, L2A, L2B}, runoff_multiplier, runoff_profile LINEAR|UPFRONT, min_survival_days}"
          - "is_active bool nn default=true | Active"
          - "approved_by string(64) ro | Approver (four-eyes)"
          - "approved_at ts ro | Approval time"

      - name: liquidity_stress_result
        prefix: lsr
        description: Outcome of running a stress scenario at an as-of date
        immutable: true
        fr: [TRY-03]
        columns:
          - "liquidity_stress_scenario_id uuid nn fk=liquidity_stress_scenario idx | Scenario"
          - "legal_entity_id uuid nn ref=legal_entity | Entity"
          - "as_of_date date nn | As-of date"
          - "currency currency nn | Currency"
          - "stressed_outflows amount nn | Stressed outflows over the horizon"
          - "stressed_inflows amount nn default=0 | Stressed inflows over the horizon"
          - "counterbalancing_capacity amount nn | Liquidity available to cover them (stressed HQLA)"
          - "net_position amount nn | Surplus / shortfall at the horizon"
          - "survival_days int nn | Days until the buffer is exhausted (horizon + 1 when never)"
          - "daily_profile json[] nn | Day-by-day stressed position [{day, outflows, inflows, cumulative_position}]"
          - "breach bool nn default=false | Breaches the risk appetite (survival below min_survival_days)"

      - name: intraday_liquidity_snapshot
        prefix: ils
        description: Intraday liquidity monitoring per currency and settlement account (BCBS 248)
        immutable: true
        fr: [TRY-03, REG-01]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Entity"
          - "snapshot_at ts nn | Snapshot time"
          - "currency currency nn | Currency"
          - "nostro_account_id uuid ref=nostro_account | Settlement account"
          - "available_liquidity amount nn | Available intraday liquidity at the start of the day (balance + credit lines + collateral)"
          - "used_liquidity amount nn ro | Liquidity used so far today (= largest negative net cumulative position)"
          - "largest_negative_position amount nn ro | Largest net negative cumulative position (reported as a positive number)"
          - "largest_positive_position amount nn default=0 ro | Largest net positive cumulative position"
          - "payments_sent amount nn ro | Gross payments sent"
          - "payments_received amount nn ro | Gross payments received"
          - "throughput_pct rate ro | Share of the day's expected payments sent by snapshot_at"
          - "profile json[] ro | Net cumulative position after each movement [{at, net_cumulative}]"
        request_only:
          - "movements json[] nn | Settled payments up to snapshot_at [{at, direction SENT|RECEIVED, amount}]"
          - "expected_daily_payments amount | Gross payments expected to be sent over the whole day (throughput denominator)"
        indexes: [[currency, snapshot_at]]

      - name: liquidity_eod_run
        prefix: leo
        description: One end-of-day liquidity job execution per tenant, job and business date (idempotency)
        fr: [TRY-03, OPS-01]
        columns:
          - "job enum:TreasuryEodJob nn | Job"
          - "business_date date nn | Business date processed"
          - "status enum:TreasuryEodRunStatus nn default=RUNNING ro | Outcome; COMPLETED runs are replayed, others may be re-run"
          - "attempts int nn default=1 ro | Executions for this job and date"
          - "result json ro | Counts and per-item errors of the last execution"
          - "started_at ts nn default=now ro | Start of the last execution"
          - "completed_at ts ro | End of the last execution"
        unique: [[tenant_id, job, business_date]]

    apis:
      - resource: cash-positions
        path: /v1/treasury/liquidity/cash-positions
        table: liquidity_cash_position
        ops: [list, get, create]
        filters: [legal_entity_id, position_date, currency, nostro_account_id, position_type]
        actions:
          - "POST /project | Recompute projected positions for a horizon from treasury deal flows and scheduled payments | legal_entity_id uuid nn, from_date date nn, days int nn, opening_balances json[] | object"
      - resource: liquidity-ladder-runs
        path: /v1/treasury/liquidity/ladders
        table: liquidity_ladder_run
        ops: [list, get, create]
        filters: [legal_entity_id, as_of_date, currency, status]
        actions:
          - "GET /{id}/buckets | Buckets of a maturity ladder | | liquidity_bucket[]"
      - resource: lcr-calculations
        path: /v1/treasury/liquidity/lcr
        table: lcr_calculation
        ops: [list, get]
        filters: [legal_entity_id, as_of_date, currency, status]
        actions:
          - "POST /calculate | Calculate LCR for a date from position lines [{line, code, category HQLA/OUTFLOW/INFLOW, amount, factor}] | legal_entity_id uuid nn, as_of_date date nn, currency currency nn, positions json[] nn, regulatory_minimum rate | lcr_calculation"
          - "POST /{id}/approve | Approve for regulatory reporting (checker; not the calculator) | comment string(500)"
      - resource: nsfr-calculations
        path: /v1/treasury/liquidity/nsfr
        table: nsfr_calculation
        ops: [list, get]
        filters: [legal_entity_id, as_of_date, currency, status]
        actions:
          - "POST /calculate | Calculate NSFR for a date from balance-sheet lines [{line, code, side ASF/RSF, amount, factor}] | legal_entity_id uuid nn, as_of_date date nn, currency currency nn, positions json[] nn, regulatory_minimum rate | nsfr_calculation"
          - "POST /{id}/approve | Approve for regulatory reporting (checker; not the calculator) | comment string(500)"
      - resource: liquidity-stress-scenarios
        path: /v1/treasury/liquidity/stress-scenarios
        table: liquidity_stress_scenario
        ops: [list, get, create, update]
        filters: [severity, is_active]
        actions:
          - "POST /{id}/approve | Approve the scenario (checker; not the maker) | comment string(500)"
          - "POST /{id}/run | Run the scenario at a date over position lines (LCR line codes) | legal_entity_id uuid nn, as_of_date date nn, currency currency nn, positions json[] nn | liquidity_stress_result"
      - resource: liquidity-stress-results
        path: /v1/treasury/liquidity/stress-results
        table: liquidity_stress_result
        ops: [list, get]
        filters: [liquidity_stress_scenario_id, legal_entity_id, as_of_date, breach]
      - resource: intraday-liquidity
        path: /v1/treasury/liquidity/intraday
        table: intraday_liquidity_snapshot
        ops: [list, get, create]
        filters: [legal_entity_id, currency, nostro_account_id]
      - resource: liquidity-eod-runs
        path: /v1/treasury/liquidity/eod-runs
        table: liquidity_eod_run
        ops: [list, get]
        filters: [job, business_date, status]
        actions:
          - "POST /position-snapshot?business_date:date! | End of day - snapshot ACTUAL cash positions for business_date from the day's flows (idempotent per business date) | | object"

    events:
      - "treasury.liquidity_position.projected | liquidity_cash_position | A projected cash position was (re)computed"
      - "treasury.liquidity_position.shortfall | liquidity_cash_position | A projected position fell below its buffer"
      - "treasury.liquidity_ladder.completed | liquidity_ladder_run | A maturity ladder run completed"
      - "treasury.lcr.calculated | lcr_calculation | LCR was calculated"
      - "treasury.lcr.breached | lcr_calculation | LCR fell below the regulatory minimum"
      - "treasury.lcr.approved | lcr_calculation | LCR was approved for reporting"
      - "treasury.nsfr.calculated | nsfr_calculation | NSFR was calculated"
      - "treasury.nsfr.breached | nsfr_calculation | NSFR fell below the regulatory minimum"
      - "treasury.nsfr.approved | nsfr_calculation | NSFR was approved for reporting"
      - "treasury.liquidity_stress_scenario.approved | liquidity_stress_scenario | A stress scenario was approved"
      - "treasury.liquidity_stress.completed | liquidity_stress_result | A stress test was run"
      - "treasury.liquidity_stress.breached | liquidity_stress_result | A stress test breached the risk appetite"
      - "treasury.intraday_liquidity.recorded | intraday_liquidity_snapshot | An intraday liquidity snapshot was recorded"
      - "treasury.liquidity_eod_run.completed | liquidity_eod_run | A liquidity end-of-day job finished for a business date"

  # ------------------------------------------------------------------ alm-service
  - name: alm-service
    database: alm_db
    description: >
      Interest rate risk in the banking book: repricing gap, NII and EVE sensitivity under rate shocks,
      behavioural assumptions, and funds transfer pricing curves and assignments.
    tables:
      - name: alm_behavioural_assumption
        prefix: aba
        description: Behavioural assumption (prepayment, deposit decay, non-maturity repricing) by product; used once approved
        fr: [TRY-04, TRY-05]
        columns:
          - "assumption_type enum:AlmAssumptionType nn | Assumption type"
          - "product_id uuid ref=product idx | Product (empty = all products of the segment)"
          - "segment string(64) | Customer / product segment"
          - "currency currency | Currency"
          - "parameters json nn | PREPAYMENT {cpr}; DEPOSIT_DECAY {core_ratio, decay_rate, core_max_months, pass_through}; NON_MATURITY_REPRICING {repricing_months, pass_through}"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"
          - "model_version string(32) nn | Model version"
          - "approved_by string(64) ro | Model approver (four-eyes)"
          - "approved_at ts ro | Approval time"

      - name: alm_gap_run
        prefix: agr
        description: Repricing gap report run at an as-of date
        fr: [TRY-04]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Entity"
          - "as_of_date date nn | As-of date"
          - "currency currency | Currency (empty = all, amounts taken as base currency)"
          - "behavioural bool nn default=true | Apply approved behavioural assumptions"
          - "status enum:RunStatus nn default=QUEUED ro | Run status"
          - "total_assets amount ro | Rate-sensitive assets"
          - "total_liabilities amount ro | Rate-sensitive liabilities"
          - "assumptions_used uuid[] ro | Behavioural assumptions applied"
          - "error_message string(500) ro | Why the run failed"
          - "started_at ts ro | Start"
          - "finished_at ts ro | End"
        request_only:
          - "positions json[] nn | Positions [{code, product_id, segment, side ASSET|LIABILITY|OFF_BALANCE, amount, currency, rate, rate_type, repricing_date | maturity_date, non_maturity}]"

      - name: alm_gap_bucket
        prefix: agb
        description: Repricing gap per time bucket (rate-sensitive assets minus liabilities)
        immutable: true
        fr: [TRY-04]
        columns:
          - "alm_gap_run_id uuid nn fk=alm_gap_run idx | Gap run"
          - "bucket_code string(16) nn | Bucket, e.g. 0-1M, 1-3M, 3-6M, 6-12M, 1-2Y, 2-5Y, >5Y"
          - "bucket_order int nn | Display order"
          - "rate_sensitive_assets amount nn | Assets repricing in the bucket"
          - "rate_sensitive_liabilities amount nn | Liabilities repricing in the bucket"
          - "off_balance_net amount nn default=0 | Off-balance-sheet net position"
          - "gap amount nn | Net repricing gap"
          - "cumulative_gap amount nn | Cumulative gap"
          - "breakdown json | Amounts by position code: {CODE: amount}"

      - name: alm_sensitivity_run
        prefix: asr
        description: NII / EVE / EaR sensitivity simulation under a rate shock
        fr: [TRY-04, REG-01]
        columns:
          - "legal_entity_id uuid nn ref=legal_entity | Entity"
          - "as_of_date date nn | As-of date"
          - "measure enum:AlmMeasure nn | NII, EVE or EaR"
          - "shock_type enum:AlmShockType nn | Shock scenario"
          - "shock_bps int | Parallel shock size in basis points (default 200); short 250 / long 100 for rotations"
          - "custom_shock json[] | Tenor-by-tenor shocks for CUSTOM [{tenor_days, bps}] (linear interpolation)"
          - "horizon_months int nn default=12 | NII horizon"
          - "currency currency nn | Reporting currency"
          - "base_value amount ro | Base-case NII or EVE"
          - "shocked_value amount ro | Shocked NII or EVE"
          - "delta amount ro | Change versus base"
          - "delta_pct_tier1 rate ro | Change as share of Tier 1 capital (EVE outlier test)"
          - "outlier bool ro | EVE decline beyond 15% of Tier 1"
          - "status enum:RunStatus nn default=QUEUED ro | Run status"
          - "results json ro | Detail {positions [{code, base, shocked, delta}], shock [{tenor_days, shock_bps, base_rate, shocked_rate}]}"
        request_only:
          - "positions json[] nn | Positions [{code, side ASSET|LIABILITY, amount, rate, rate_type, repricing_date, maturity_date, payment_frequency_months}]"
          - "base_curve json[] | Discount curve [{tenor_days, rate}]; empty = latest published BASE FTP curve of the currency"
          - "tier1_capital amount | Tier 1 capital for the outlier test"

      - name: ftp_curve
        prefix: ftc
        description: Funds transfer pricing curve per currency, type and effective date
        fr: [TRY-05]
        columns:
          - "code string(32) nn | Curve code"
          - "currency currency nn | Currency"
          - "curve_type enum:FtpCurveType nn | Base, liquidity premium, ..."
          - "effective_date date nn | Effective date"
          - "source string(64) | Market source / construction method"
          - "is_published bool nn default=false ro | Published for use (publish action)"
          - "approved_by string(64) ro | ALCO approver (four-eyes)"
          - "published_at ts ro | Publication time"
        unique: [[tenant_id, code, effective_date]]

      - name: ftp_curve_point
        prefix: ftp
        description: Tenor point on an FTP curve (frozen once the curve is published)
        fr: [TRY-05]
        columns:
          - "ftp_curve_id uuid nn fk=ftp_curve idx | Curve"
          - "tenor_days int nn | Tenor in days"
          - "tenor_label string(8) nn | Tenor label, e.g. 3M"
          - "rate rate nn | Rate at the tenor"
        unique: [[ftp_curve_id, tenor_days]]

      - name: ftp_rule
        prefix: ftr
        description: Rule assigning an FTP method and curves to products / segments
        fr: [TRY-05]
        columns:
          - "product_id uuid ref=product idx | Product (empty = default)"
          - "segment string(64) | Segment"
          - "currency currency | Currency"
          - "method enum:FtpMethod nn | Pricing method"
          - "base_curve_code string(32) nn | Base curve code"
          - "liquidity_curve_code string(32) | Liquidity premium curve code"
          - "fixed_spread rate | Spread for FIXED_SPREAD method"
          - "pool_tenor_days int | Pricing tenor for POOLED (default 30)"
          - "priority int nn default=100 | Lower wins"
          - "valid_from date nn | Effective from"
          - "valid_to date | Effective to"

      - name: ftp_assignment
        prefix: fta
        description: FTP rate and margin assigned to an account or loan for a period
        immutable: true
        fr: [TRY-05]
        columns:
          - "period_start date nn | Period start"
          - "period_end date nn | Period end"
          - "exposure_type enum:FtpExposureType nn | Deposit account, term deposit, loan or credit line"
          - "exposure_id uuid nn idx | Account or loan id"
          - "deposit_account_id uuid ref=deposit_account | Deposit account, when applicable"
          - "loan_id uuid ref=loan | Loan, when applicable"
          - "product_id uuid ref=product | Product"
          - "ftp_rule_id uuid fk=ftp_rule | Rule applied"
          - "term_days int | Pricing tenor used"
          - "average_balance amount nn | Average balance for the period"
          - "currency currency nn | Currency"
          - "customer_rate rate nn | Rate paid / earned with the customer"
          - "ftp_rate rate nn | Transfer price"
          - "net_margin rate nn | Customer rate minus FTP for assets, FTP minus customer rate for liabilities"
          - "ftp_charge_credit amount nn | FTP charge (loans) or credit (deposits) for the period (ACT/365)"
        unique: [[tenant_id, exposure_id, period_start]]

    apis:
      - resource: alm-behavioural-assumptions
        path: /v1/treasury/alm/assumptions
        table: alm_behavioural_assumption
        ops: [list, get, create, update]
        filters: [assumption_type, product_id, segment, currency]
        actions:
          - "POST /{id}/approve | Approve the model assumption (model risk checker; not the maker) | comment string(500)"
      - resource: alm-gap-runs
        path: /v1/treasury/alm/gap-runs
        table: alm_gap_run
        ops: [list, get, create]
        filters: [legal_entity_id, as_of_date, currency, status]
        actions:
          - "GET /{id}/buckets | Buckets of a repricing gap run | | alm_gap_bucket[]"
      - resource: alm-sensitivity-runs
        path: /v1/treasury/alm/sensitivity-runs
        table: alm_sensitivity_run
        ops: [list, get, create]
        filters: [legal_entity_id, as_of_date, measure, shock_type, status]
        actions:
          - "POST /standard-shocks | Run all six Basel IRRBB standard shocks for NII and EVE; returns the runs and the outlier test | legal_entity_id uuid nn, as_of_date date nn, currency currency nn, positions json[] nn, base_curve json[], tier1_capital amount, horizon_months int | object"
      - resource: ftp-curves
        path: /v1/treasury/ftp/curves
        table: ftp_curve
        ops: [list, get, create, update]
        filters: [code, currency, curve_type, effective_date, is_published]
        actions:
          - "GET /{id}/points | Points of the curve | | ftp_curve_point[]"
          - "POST /{id}/publish | Publish the curve after ALCO approval (checker; not the maker) | comment string(500)"
          - "GET /{id}/rate?tenor_days:int! | Linearly interpolated rate for a tenor (flat beyond the ends) | | object"
      - resource: ftp-curve-points
        path: /v1/treasury/ftp/curve-points
        table: ftp_curve_point
        ops: [list, get, create, update, delete]
        filters: [ftp_curve_id]
      - resource: ftp-rules
        path: /v1/treasury/ftp/rules
        table: ftp_rule
        ops: [list, get, create, update, delete]
        filters: [product_id, segment, currency, method]
      - resource: ftp-assignments
        path: /v1/treasury/ftp/assignments
        table: ftp_assignment
        ops: [list, get]
        filters: [exposure_type, exposure_id, product_id, period_start, currency]
        actions:
          - "POST /run | Compute FTP for exposures for a period [{exposure_type, exposure_id, product_id, segment, currency, average_balance, customer_rate, term_days}] (existing assignments are kept) | period_start date nn, period_end date nn, exposures json[] nn | object"
          - "POST /quote | Price one exposure without storing it (FTP rate, components and margin) | exposure_type enum:FtpExposureType nn, product_id uuid, segment string(64), currency currency nn, term_days int nn, customer_rate rate, as_of_date date nn, amount amount | object"

    events:
      - "treasury.alm_assumption.approved | alm_behavioural_assumption | A behavioural assumption was approved"
      - "treasury.alm_gap_run.completed | alm_gap_run | A repricing gap run completed"
      - "treasury.alm_gap_run.failed | alm_gap_run | A repricing gap run failed"
      - "treasury.alm_sensitivity.completed | alm_sensitivity_run | An NII/EVE sensitivity run completed"
      - "treasury.alm_sensitivity.outlier_breached | alm_sensitivity_run | An EVE shock exceeded the 15% Tier 1 outlier threshold"
      - "treasury.ftp_curve.published | ftp_curve | An FTP curve was published"
      - "treasury.ftp_assignment.computed | ftp_assignment | FTP was assigned for a period"
