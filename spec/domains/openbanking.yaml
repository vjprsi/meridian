domain: openbanking
title: Open Banking
phase: 4
description: >
  Regulated third-party access (ASPSP side). Registers and certifies TPPs, manages AIS / PIS / CBPII / VRP
  consents and their SCA authorisation, logs every data access, and exposes standard profiles
  (UK OBIE, Berlin Group NextGenPSD2, Brazil Open Finance, FDX, CDR) mapped onto Meridian core APIs.

enums:
  ObStandard: [UK_OBIE, BERLIN_GROUP, BRAZIL_OPEN_FINANCE, FDX, CDR_AU, SAUDI_OB, CUSTOM]
  TppStatus: [PENDING, ACTIVE, SUSPENDED, REVOKED]
  ObCertificateType: [QWAC, QSEAL, OBWAC, OBSEAL, MTLS_CLIENT]
  ObCertificateStatus: [VALID, EXPIRED, REVOKED]
  ObConsentType: [AIS, PIS, CBPII, VRP, FDX_DATA]
  ObConsentStatus: [AWAITING_AUTHORISATION, AUTHORISED, REJECTED, REVOKED, EXPIRED, CONSUMED]
  ObAuthorisationStatus: [STARTED, SCA_REQUIRED, AUTHENTICATED, ACCOUNTS_SELECTED, FINALISED, FAILED, EXPIRED]
  ObPaymentInitiationStatus: [RECEIVED, PENDING, ACCEPTED, REJECTED, EXECUTED, CANCELLED]

services:
  - name: openbanking-service
    database: openbanking_db
    description: >
      ASPSP open banking gateway. Validates TPP identity (eIDAS / directory certificates), manages consents and
      SCA redirect / decoupled flows, enforces consent scope on every call, and translates standard profiles
      to internal account, payment and funds-check APIs.
    tables:
      - name: ob_standard_profile
        prefix: obp
        description: An open banking standard enabled for the tenant, with version and endpoints
        fr: [OBK-01]
        columns:
          - "standard enum:ObStandard nn | Standard"
          - "version string(16) nn | Standard version, e.g. 3.1.11, 1.3.12"
          - "base_path string(255) nn | Public base path for the profile"
          - "directory_url string(500) | Trust directory / registry endpoint"
          - "sca_approaches json nn | Supported SCA approaches (REDIRECT, DECOUPLED, EMBEDDED)"
          - "consent_max_days int nn default=90 | Maximum AIS consent validity"
          - "settings json | Profile settings and field mappings"
          - "is_active bool nn default=true | Active"
        unique: [[tenant_id, standard, version]]

      - name: tpp
        prefix: tpp
        description: Registered third-party provider (AISP, PISP, CBPII)
        fr: [OBK-01]
        columns:
          - "name string(140) nn | TPP legal name"
          - "trading_name string(140) | Trading name shown to customers"
          - "authorisation_number string(64) nn | Regulator authorisation / licence number"
          - "competent_authority string(64) nn | National competent authority (e.g. GB-FCA)"
          - "country country nn | Home country"
          - "roles json nn | PSD2 roles: AISP, PISP, CBPII"
          - "directory_id string(128) | Id in the trust directory"
          - "client_id string(128) uq | OAuth client id issued via dynamic client registration"
          - "redirect_uris json | Registered redirect URIs"
          - "logo_uri string(500) | Logo shown on the consent screen"
          - "contact_email email | Technical contact"
          - "status enum:TppStatus nn default=PENDING | Status"
          - "last_verified_at ts ro | Last regulator / directory check"

      - name: tpp_certificate
        prefix: tpc
        description: Certificate presented by a TPP (eIDAS QWAC/QSEAL or directory cert)
        fr: [OBK-01]
        columns:
          - "tpp_id uuid nn fk=tpp idx | TPP"
          - "certificate_type enum:ObCertificateType nn | Type"
          - "subject_dn string(500) nn | Subject distinguished name"
          - "issuer_dn string(500) nn | Issuer"
          - "serial_number string(128) nn | Serial number"
          - "fingerprint_sha256 string(64) nn uq | Fingerprint"
          - "valid_from ts nn | Not before"
          - "valid_to ts nn | Not after"
          - "status enum:ObCertificateStatus nn default=VALID ro | Status (OCSP / CRL checked)"
          - "last_ocsp_check_at ts ro | Last revocation check"

      - name: ob_consent
        prefix: obc
        description: Customer consent given to a TPP for account information, payment initiation or funds confirmation
        fr: [OBK-01, OBK-02, OBK-03, CIF-04]
        columns:
          - "tpp_id uuid nn fk=tpp idx | TPP"
          - "ob_standard_profile_id uuid nn fk=ob_standard_profile | Standard used"
          - "consent_type enum:ObConsentType nn | Consent type"
          - "external_consent_id string(128) nn uq | Consent id exposed to the TPP"
          - "customer_id uuid ref=customer idx | Customer who authorised (set on authorisation)"
          - "permissions json nn | Granted permissions (ReadAccountsDetail, ReadTransactionsDetail...)"
          - "transaction_from ts | Earliest transaction date visible"
          - "transaction_to ts | Latest transaction date visible"
          - "frequency_per_day int | Allowed unattended accesses per day (Berlin Group)"
          - "recurring bool nn default=true | Recurring access"
          - "vrp_control_parameters json | Variable recurring payment limits (VRP)"
          - "status enum:ObConsentStatus nn default=AWAITING_AUTHORISATION ro | Status"
          - "authorised_at ts ro | Authorisation time"
          - "expires_at ts | Expiry"
          - "revoked_at ts ro | Revocation time"
          - "revoked_by string(16) ro | CUSTOMER, TPP or ASPSP"
          - "last_accessed_at ts ro | Last access by the TPP"
          - "risk json | Payment context / risk indicators supplied by the TPP"

      - name: ob_consent_account
        prefix: oba
        description: Account selected by the customer under a consent
        fr: [OBK-02]
        columns:
          - "ob_consent_id uuid nn fk=ob_consent idx | Consent"
          - "account_id uuid nn ref=deposit_account | Account"
          - "account_resource_id string(128) nn | Account id exposed to the TPP"
          - "permissions json | Account-level permission overrides"
        unique: [[ob_consent_id, account_id]]

      - name: ob_authorisation
        prefix: obz
        description: SCA authorisation session for a consent (redirect, decoupled or embedded)
        fr: [OBK-01]
        columns:
          - "ob_consent_id uuid nn fk=ob_consent idx | Consent being authorised"
          - "sca_approach string(16) nn | REDIRECT, DECOUPLED, EMBEDDED"
          - "redirect_uri string(500) | TPP redirect URI"
          - "state string(255) | OAuth state"
          - "code_challenge string(128) | PKCE code challenge"
          - "status enum:ObAuthorisationStatus nn default=STARTED ro | Status"
          - "customer_id uuid ref=customer | Authenticated customer"
          - "authentication_method string(32) ro | Method used (passkey, app push, OTP)"
          - "failure_reason string(255) ro | Failure reason"
          - "expires_at ts nn | Session expiry"
          - "completed_at ts ro | Completion time"

      - name: ob_payment_initiation
        prefix: obi
        description: Payment initiated by a PISP under a consent; links to the core payment
        fr: [OBK-03, PAY-01]
        columns:
          - "ob_consent_id uuid nn fk=ob_consent idx | Consent"
          - "tpp_id uuid nn fk=tpp idx | Initiating TPP"
          - "external_payment_id string(128) nn uq | Payment id exposed to the TPP"
          - "payment_id uuid ref=payment idx | Core payment created"
          - "payment_product string(64) nn | Product, e.g. domestic-payments, sepa-credit-transfers, instant"
          - "amount amount nn | Amount"
          - "currency currency nn | Currency"
          - "creditor_name string(140) nn pii | Creditor name"
          - "creditor_account string(64) nn pii | Creditor account"
          - "remittance_information string(140) | Remittance information"
          - "status enum:ObPaymentInitiationStatus nn default=RECEIVED ro | Status"
          - "status_reason string(255) ro | Status reason"

      - name: ob_funds_confirmation
        prefix: obf
        description: Confirmation of funds check by a CBPII. Append-only.
        immutable: true
        fr: [OBK-01]
        columns:
          - "ob_consent_id uuid nn fk=ob_consent idx | Consent"
          - "tpp_id uuid nn fk=tpp | TPP"
          - "account_id uuid nn ref=deposit_account | Account checked"
          - "amount amount nn | Amount checked"
          - "currency currency nn | Currency"
          - "funds_available bool nn | Result"

      - name: ob_access_log
        prefix: obl
        description: Every TPP API call under a consent, for audit, regulatory reporting and customer dashboards. Append-only.
        immutable: true
        fr: [OBK-02, ADM-03]
        columns:
          - "tpp_id uuid nn fk=tpp idx | TPP"
          - "ob_consent_id uuid fk=ob_consent idx | Consent"
          - "customer_id uuid ref=customer idx | Customer"
          - "endpoint string(255) nn | Standard endpoint called"
          - "http_method string(8) nn | HTTP method"
          - "http_status int nn | Response status"
          - "psu_present bool nn default=false | Customer present (PSU-IP-Address supplied)"
          - "psu_ip_address inet | Customer IP when present"
          - "interaction_id string(64) | x-fapi-interaction-id"
          - "latency_ms int | Response time"
          - "records_returned int | Records returned"

    apis:
      - resource: ob-standard-profiles
        path: /v1/open-banking/profiles
        table: ob_standard_profile
        ops: [list, get, create, update]
        filters: [standard, is_active]
      - resource: tpps
        path: /v1/open-banking/tpps
        table: tpp
        ops: [list, get, create, update]
        filters: [status, country, competent_authority]
        actions:
          - "POST /register | Dynamic client registration with a signed software statement | software_statement text nn | tpp"
          - "POST /{id}/verify | Re-verify the TPP against the regulator register and directory | | tpp"
          - "POST /{id}/suspend | Suspend TPP access | reason string(255) nn"
          - "POST /{id}/reactivate | Reactivate a suspended TPP"
          - "GET /{id}/certificates | Certificates of the TPP | | tpp_certificate[]"
      - resource: tpp-certificates
        path: /v1/open-banking/tpp-certificates
        table: tpp_certificate
        ops: [list, get, create]
        filters: [tpp_id, certificate_type, status]
      - resource: ob-consents
        path: /v1/open-banking/consents
        table: ob_consent
        ops: [list, get, create]
        filters: [tpp_id, consent_type, status, customer_id]
        actions:
          - "POST /{id}/authorise | Start SCA authorisation for the consent | sca_approach string(16) nn, redirect_uri string(500), state string(255), code_challenge string(128) | ob_authorisation"
          - "POST /{id}/revoke | Revoke a consent (customer or TPP) | revoked_by string(16) nn"
          - "GET /{id}/accounts | Accounts selected under the consent | | ob_consent_account[]"
          - "GET /{id}/access-log | Access log of the consent | | ob_access_log[]"
      - resource: ob-authorisations
        path: /v1/open-banking/authorisations
        table: ob_authorisation
        ops: [get]
        actions:
          - "POST /{id}/select-accounts | Customer selects accounts to share | account_ids json nn | ob_authorisation"
          - "POST /{id}/approve | Customer approves the consent after SCA | | ob_authorisation"
          - "POST /{id}/deny | Customer denies the consent | reason string(255)"
      - resource: ob-payment-initiations
        path: /v1/open-banking/payment-initiations
        table: ob_payment_initiation
        ops: [list, get, create]
        filters: [ob_consent_id, tpp_id, status, payment_id]
        actions:
          - "POST /{id}/cancel | Cancel a future-dated initiation | reason string(255)"
      - resource: ob-funds-confirmations
        path: /v1/open-banking/funds-confirmations
        table: ob_funds_confirmation
        ops: [list, get, create]
        filters: [ob_consent_id, tpp_id, account_id]
      - resource: ob-access-logs
        path: /v1/open-banking/access-logs
        table: ob_access_log
        ops: [list, get]
        filters: [tpp_id, ob_consent_id, customer_id, http_status]

    events:
      - "openbanking.tpp.registered | tpp | A TPP registered"
      - "openbanking.tpp.suspended | tpp | A TPP was suspended"
      - "openbanking.ob_consent.created | ob_consent | A consent request was created"
      - "openbanking.ob_consent.authorised | ob_consent | A customer authorised a consent"
      - "openbanking.ob_consent.revoked | ob_consent | A consent was revoked"
      - "openbanking.ob_consent.expired | ob_consent | A consent expired"
      - "openbanking.ob_payment_initiation.received | ob_payment_initiation | A PISP initiated a payment"
      - "openbanking.ob_payment_initiation.status_changed | ob_payment_initiation | A PISP payment changed status"
