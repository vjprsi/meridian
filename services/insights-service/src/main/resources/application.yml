# insights-service (Engagement: Rewards, Insights and Campaigns). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9154
  shutdown: graceful

spring:
  application:
    name: insights-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/insights_db?currentSchema=insights
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: insights
    default-schema: insights
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  events:
    topic: meridian.engagement.v1
  insights:
    notification-channel: PUSH     # channel of insight and budget alerts (notification-service send-templated)
    insight-expiry-days: 30        # default lifetime of an insight card
    spike-min-excess: 50           # minimum excess over the trailing average for a SPEND_SPIKE insight
    low-balance-threshold: 0       # default threshold of LOW_BALANCE_FORECAST (forecasts may override it)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: insights-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
