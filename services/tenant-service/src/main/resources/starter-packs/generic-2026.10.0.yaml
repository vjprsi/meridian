  # ------------------------------------------------------------------------------------------------ end of day
  - code: end_of_day
    title: Standard EOD job pack and trigger policy (business-day-service)
    items:
      - {key: standard_pack, title: Install the standard EOD job pack, kind: CALL, service: business-day-service,
         path: /v1/operations/eod-jobs/install-standard-pack, body: {}}
      # LEDGER_EOD closes every book of the legal entity (POST /v1/ledgers/end-of-day) and ships active; this clears a
      # ledger_id an earlier version of the pack pinned, so books added later are closed too.
      - {key: ledger_eod_job, title: Run LEDGER_EOD for all of the tenant's books and activate it, kind: PATCH_EXISTING, service: business-day-service,
         path: /v1/operations/eod-jobs, lookup: {query: {owning_service: ledger-service}, match: {code: LEDGER_EOD}},
         body: {parameters: {}, is_active: true}}
      - {key: trigger_policy, title: EOD trigger policy (manual start by default), service: business-day-service,
         path: /v1/operations/eod-trigger-policies, update: PATCH, update_exclude: [legal_entity_id],
         lookup: {query: {legal_entity_id: "${ref.legal_entity}"}, match: {legal_entity_id: "${ref.legal_entity}"}},
         body: {legal_entity_id: "${ref.legal_entity}", is_enabled: "${param.eod_auto_trigger}", cut_off_time: "${param.eod_cut_off_time}",
                time_zone: "${param.timezone}", auto_roll: false, notes: "DEFAULT policy from starter pack ${pack.code} ${pack.version}"}}
