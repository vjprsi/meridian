             approval: commission_plan}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]

  # ------------------------------------------------------------------------------------------------ notifications
  - code: notifications
    title: Notification providers, templates (maker-checker) and payment alert rules
    items:
      - {key: provider_email, title: E-mail provider (SMTP sandbox, DEFAULT), service: notification-service, path: /v1/notification-providers,
         update: PATCH, lookup: {query: {channel: EMAIL}, match: {channel: EMAIL}},
         body: {channel: EMAIL, provider_name: SMTP, priority: 1, sender_id: "${param.email_sender}", status: "${param.provider_status}",
                config: {smtp_host: "${param.smtp_host}", smtp_port: "${param.smtp_port}", sandbox: "${param.email_sandbox}"}}}
      - {key: provider_sms, title: SMS provider (sandbox, DEFAULT), service: notification-service, path: /v1/notification-providers,
         update: PATCH, lookup: {query: {channel: SMS}, match: {channel: SMS}},
         body: {channel: SMS, provider_name: SANDBOX, priority: 1, sender_id: "${param.sms_sender_id}", status: "${param.provider_status}",
                config: {sandbox: true}}}
      - {key: provider_push, title: Push provider (sandbox, DEFAULT), service: notification-service, path: /v1/notification-providers,
         update: PATCH, lookup: {query: {channel: PUSH}, match: {channel: PUSH}},
         body: {channel: PUSH, provider_name: SANDBOX, priority: 1, status: "${param.provider_status}", config: {sandbox: true}}}
      - key: tpl_payment_settled_email
        service: notification-service
        path: /v1/notification-templates
        lookup: {query: {code: PAYMENT_SETTLED, channel: EMAIL, locale: "${param.language}"}, match: {code: PAYMENT_SETTLED, channel: EMAIL}}
        body: {code: PAYMENT_SETTLED, channel: EMAIL, locale: "${param.language}", category: TRANSACTIONAL, subject: "Payment {{status}}",
               body: "Your payment of {{amount}} {{currency}} is {{status}} (ref {{end_to_end_id}})."}
        actions:
          - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PENDING_APPROVAL, ACTIVE, RETIRED], requires_status: [DRAFT], approval: notification_template}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]
      - key: tpl_payment_settled_sms
        service: notification-service
        path: /v1/notification-templates
        lookup: {query: {code: PAYMENT_SETTLED, channel: SMS, locale: "${param.language}"}, match: {code: PAYMENT_SETTLED, channel: SMS}}
        body: {code: PAYMENT_SETTLED, channel: SMS, locale: "${param.language}", category: TRANSACTIONAL,
               body: "Payment of {{amount}} {{currency}} {{status}}. Ref {{end_to_end_id}}."}
        actions:
          - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PENDING_APPROVAL, ACTIVE, RETIRED], requires_status: [DRAFT], approval: notification_template}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]
      - key: tpl_payment_settled_in_app
        service: notification-service
        path: /v1/notification-templates
        lookup: {query: {code: PAYMENT_SETTLED, channel: IN_APP, locale: "${param.language}"}, match: {code: PAYMENT_SETTLED, channel: IN_APP}}
        body: {code: PAYMENT_SETTLED, channel: IN_APP, locale: "${param.language}", category: TRANSACTIONAL, subject: "Payment {{status}}",
               body: "Your payment of {{amount}} {{currency}} is {{status}}."}
        actions:
          - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PENDING_APPROVAL, ACTIVE, RETIRED], requires_status: [DRAFT], approval: notification_template}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]
      - key: tpl_payment_received_sms
        service: notification-service
        path: /v1/notification-templates
        lookup: {query: {code: PAYMENT_RECEIVED, channel: SMS, locale: "${param.language}"}, match: {code: PAYMENT_RECEIVED, channel: SMS}}
        body: {code: PAYMENT_RECEIVED, channel: SMS, locale: "${param.language}", category: TRANSACTIONAL,
               body: "You have received {{amount}} {{currency}}. Ref {{end_to_end_id}}."}
        actions:
          - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PENDING_APPROVAL, ACTIVE, RETIRED], requires_status: [DRAFT], approval: notification_template}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]
      - key: tpl_payment_received_email
        service: notification-service
        path: /v1/notification-templates
        lookup: {query: {code: PAYMENT_RECEIVED, channel: EMAIL, locale: "${param.language}"}, match: {code: PAYMENT_RECEIVED, channel: EMAIL}}
        body: {code: PAYMENT_RECEIVED, channel: EMAIL, locale: "${param.language}", category: TRANSACTIONAL, subject: "Money received",
               body: "You have received {{amount}} {{currency}} (ref {{end_to_end_id}})."}
        actions:
