        pending_status: [PENDING_APPROVAL]
      - key: routing_fx_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: fx-service, status: ACTIVE}, match: {config_key: fx-service}}
        body: {namespace: ledger, config_key: fx-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {position_accounts: {$for_each: "${param.fx_currencies}", "${each}": "${ref.ledger_book/fx_position.${each.lower}}"},
                       clearing_accounts: {$for_each: "${param.fx_currencies}", "${each}": "${ref.ledger_book/fx_clearing.${each.lower}}"}}}
