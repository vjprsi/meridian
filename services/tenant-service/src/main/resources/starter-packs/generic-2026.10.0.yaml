        body: {namespace: ledger, config_key: loan-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {gl: {clearing: "${ref.ledger_book/clearing}", interest_income: "${ref.ledger_book/interest_income}",
                            interest_receivable: "${ref.ledger_book/interest_receivable}", interest_suspense: "${ref.ledger_book/interest_suspense}",
                            fee_income: "${ref.ledger_book/fee_income}", fee_receivable: "${ref.ledger_book/fee_receivable}",
                            penalty_income: "${ref.ledger_book/penalty_income}", penalty_receivable: "${ref.ledger_book/penalty_receivable}",
