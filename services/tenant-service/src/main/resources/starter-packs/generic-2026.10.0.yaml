                    base: AMOUNT, cap_amount: "${param.commission_cash_in_cap}", beneficiary: AGENT, funded_by: PLATFORM, priority: 100, is_active: true}}
          - {key: cash_out_agent, service: commission-service, path: /v1/commission-rules,
