        service: commission-service
        path: /v1/commission-plans
        lookup: {query: {code: SP-AGENT-STD}, match: {code: SP-AGENT-STD}}
        body: {code: SP-AGENT-STD, name: Standard agent commissions (DEFAULT), description: "Created by starter pack ${pack.code} ${pack.version}",
               applies_to: AGENT, currency: "${param.currency}", payout_frequency: MONTHLY, valid_from: "${today}"}
        children:
          - {key: cash_in_agent, service: commission-service, path: /v1/commission-rules,
