  # ------------------------------------------------------------------------------------------------ wallets
  # Platform wallets: created PENDING; activated (which opens their ledger account in the tenant's book) once the
  # ledger routing they post with is approved. The routing entries that point at them are their children.
  - code: wallets
    title: Treasury and commission-pool wallets
    items:
      - key: treasury_wallet
        title: E-money treasury wallet (funds agent float)
        service: wallet-service
        path: /v1/wallets
        body: {wallet_type: TREASURY, display_name: "${param.legal_name} treasury", currency: "${param.currency}",
               opened_channel: SYSTEM, alias: treasury, metadata: {created_by: "starter pack ${pack.code}"}}
        children:
          - key: routing
            title: agent-network-service treasury wallet (config-service)
            service: config-service
            path: /v1/config/entries
            update: RECREATE
            lookup: {query: {namespace: ledger, config_key: agent-network-service, status: ACTIVE}, match: {config_key: agent-network-service}}
            body: {namespace: ledger, config_key: agent-network-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
                   value: {treasury_wallet_id: "${parent}"}}
            actions:
              - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
                 skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
            ready_status: [ACTIVE, SUPERSEDED]
            pending_status: [PENDING_APPROVAL]
        actions:
          - {name: activate, path: "/{id}/activate", body: {reason: "Tenant starter pack ${pack.code}"}, skip_status: [ACTIVE],
             requires_status: [PENDING], after: [routing_default, routing_wallet_service]}
        ready_status: [ACTIVE]
      - key: commission_pool_wallet
        title: Commission pool wallet (funds agent commission payouts)
        service: wallet-service
        path: /v1/wallets
        body: {wallet_type: TREASURY, display_name: "${param.legal_name} commission pool", currency: "${param.currency}",
               opened_channel: SYSTEM, alias: commission-pool, metadata: {created_by: "starter pack ${pack.code}"}}
        children:
          - key: routing
            title: commission-service payout source wallet (config-service)
            service: config-service
            path: /v1/config/entries
            update: RECREATE
            lookup: {query: {namespace: ledger, config_key: commission-service, status: ACTIVE}, match: {config_key: commission-service}}
            body: {namespace: ledger, config_key: commission-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
                   value: {payout_source_wallet_id: "${parent}"}}
            actions:
              - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
                 skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
            ready_status: [ACTIVE, SUPERSEDED]
            pending_status: [PENDING_APPROVAL]
        actions:
          - {name: activate, path: "/{id}/activate", body: {reason: "Tenant starter pack ${pack.code}"}, skip_status: [ACTIVE],
             requires_status: [PENDING], after: [routing_default, routing_wallet_service]}
        ready_status: [ACTIVE]

  # ------------------------------------------------------------------------------------------------ products
  # Product + version (with rates, fees, limits as children); the version is submitted for approval and published
  # by a later run once approved.
  - code: products
    title: Default products (savings, current, wallet) and fee schedules
    items:
      - key: savings
        title: Standard savings account
        service: product-catalog-service
        path: /v1/products
        lookup: {query: {legal_entity_id: "${ref.legal_entity}", family: SAVINGS}, match: {code: SAV-STD}}
        body: {code: SAV-STD, name: Standard Savings, family: SAVINGS, segment: RETAIL, legal_entity_id: "${ref.legal_entity}",
               currency: "${param.currency}", short_description: "Instant-access savings with monthly interest (DEFAULT terms)",
               available_channels: [MOBILE, WEB, BRANCH, AGENT, API], available_countries: ["${param.country}"], is_sellable: false}  # publishing the first version makes it sellable
        children:
          - key: version
            service: product-catalog-service
            path: /v1/product-versions
            body: {product_id: "${parent}", change_summary: "Starter pack ${pack.code} ${pack.version} (DEFAULT terms)", migration_policy: PIN,
                   definition: {account_type: SAVINGS, min_opening_balance: "0", overdraft_allowed: false, dormancy_days: 365}}
            children:
              - key: credit_interest
                service: product-catalog-service
                path: /v1/interest-rate-configs
                body: {product_version_id: "${parent}", rate_kind: CREDIT_INTEREST, rate_type: FIXED, fixed_rate: "${param.savings_rate}",
                       day_count: ACT_365, balance_basis: END_OF_DAY, accrual_frequency: DAILY, capitalisation_frequency: MONTHLY,
                       capitalisation_day: 31, rounding: HALF_EVEN, rounding_scale: 2, currency: "${param.currency}", effective_from: "${today}"}
              - key: fee_statement_copy
                service: product-catalog-service
                path: /v1/fee-definitions
                body: {product_version_id: "${parent}", code: STATEMENT_COPY, name: Paper statement copy, trigger: STATEMENT_COPY,
                       calculation_method: FLAT, flat_amount: "${param.fee_statement_copy}", currency: "${param.currency}", is_refundable: true}
            actions:
              - {name: submit, path: "/{id}/submit", body: {comment: "Starter pack ${pack.code} ${pack.version}"},
                 skip_status: [PENDING_APPROVAL, APPROVED, PUBLISHED, SUPERSEDED, RETIRED], requires_status: [DRAFT], approval: product_version}
              - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PUBLISHED, SUPERSEDED, RETIRED], requires_status: [APPROVED]}
            ready_status: [PUBLISHED, SUPERSEDED]
            pending_status: [PENDING_APPROVAL]
      - key: current
        title: Standard current account
        service: product-catalog-service
        path: /v1/products
        lookup: {query: {legal_entity_id: "${ref.legal_entity}", family: CURRENT_ACCOUNT}, match: {code: CUR-STD}}
        body: {code: CUR-STD, name: Standard Current Account, family: CURRENT_ACCOUNT, segment: RETAIL, legal_entity_id: "${ref.legal_entity}",
               currency: "${param.currency}", short_description: "Everyday current account (DEFAULT terms)",
               available_channels: [MOBILE, WEB, BRANCH, AGENT, API], available_countries: ["${param.country}"], is_sellable: false}  # publishing the first version makes it sellable
        children:
          - key: version
            service: product-catalog-service
            path: /v1/product-versions
            body: {product_id: "${parent}", change_summary: "Starter pack ${pack.code} ${pack.version} (DEFAULT terms)", migration_policy: PIN,
                   definition: {account_type: CURRENT, min_opening_balance: "0", overdraft_allowed: false, dormancy_days: 365}}
            children:
              - key: fee_monthly
                service: product-catalog-service
                path: /v1/fee-definitions
                body: {product_version_id: "${parent}", code: MONTHLY_MAINTENANCE, name: Monthly account fee, trigger: MONTHLY_MAINTENANCE,
                       frequency: MONTHLY, calculation_method: FLAT, flat_amount: "${param.fee_monthly_maintenance}", currency: "${param.currency}",
                       allow_negative_balance: false, is_refundable: true}
              - key: fee_transfer_out
                service: product-catalog-service
                path: /v1/fee-definitions
                body: {product_version_id: "${parent}", code: TRANSFER_OUT, name: Outgoing domestic transfer, trigger: TRANSFER_OUT,
                       calculation_method: FLAT, flat_amount: "${param.fee_transfer_out}", free_count: "${param.fee_transfer_out_free_count}", cap_period: MONTHLY, currency: "${param.currency}",
                       is_refundable: true}
              - key: fee_international
                service: product-catalog-service
                path: /v1/fee-definitions
                body: {product_version_id: "${parent}", code: INTERNATIONAL_TRANSFER, name: International transfer, trigger: INTERNATIONAL_TRANSFER,
                       calculation_method: FLAT_PLUS_PERCENTAGE, flat_amount: "${param.fee_international_flat}", percentage: "0.002", max_amount: "${param.fee_international_max}",
                       currency: "${param.currency}", is_refundable: true}
              - key: fee_statement_copy
                service: product-catalog-service
                path: /v1/fee-definitions
                body: {product_version_id: "${parent}", code: STATEMENT_COPY, name: Paper statement copy, trigger: STATEMENT_COPY,
                       calculation_method: FLAT, flat_amount: "${param.fee_statement_copy}", currency: "${param.currency}", is_refundable: true}
            actions:
              - {name: submit, path: "/{id}/submit", body: {comment: "Starter pack ${pack.code} ${pack.version}"},
                 skip_status: [PENDING_APPROVAL, APPROVED, PUBLISHED, SUPERSEDED, RETIRED], requires_status: [DRAFT], approval: product_version}
              - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PUBLISHED, SUPERSEDED, RETIRED], requires_status: [APPROVED]}
            ready_status: [PUBLISHED, SUPERSEDED]
            pending_status: [PENDING_APPROVAL]
      - key: wallet
        title: Standard mobile wallet
        service: product-catalog-service
        path: /v1/products
        lookup: {query: {legal_entity_id: "${ref.legal_entity}", family: WALLET}, match: {code: WAL-STD}}
        body: {code: WAL-STD, name: Mobile Wallet, family: WALLET, segment: RETAIL, legal_entity_id: "${ref.legal_entity}",
               currency: "${param.currency}", short_description: "Mobile money wallet with KYC tiers (DEFAULT terms)",
               available_channels: [MOBILE, USSD, AGENT, API], available_countries: ["${param.country}"], is_sellable: false}  # publishing the first version makes it sellable
        children:
          - key: version
            service: product-catalog-service
            path: /v1/product-versions
            body: {product_id: "${parent}", change_summary: "Starter pack ${pack.code} ${pack.version} (DEFAULT terms)", migration_policy: PIN,
                   definition: {wallet_type: CUSTOMER, kyc_tiers: [0, 1, 2, 3], dormancy_days: 180}}
            children:
              - {key: limit_tier0_balance, service: product-catalog-service, path: /v1/product-limit-templates,
                 body: {product_version_id: "${parent}", limit_code: WALLET_MAX_BALANCE, period: LIFETIME, metric: BALANCE, kyc_tier: 0, max_value: "${param.wallet_tier0_max_balance}", currency: "${param.currency}"}}
              - {key: limit_tier1_balance, service: product-catalog-service, path: /v1/product-limit-templates,
                 body: {product_version_id: "${parent}", limit_code: WALLET_MAX_BALANCE, period: LIFETIME, metric: BALANCE, kyc_tier: 1, max_value: "${param.wallet_tier1_max_balance}", currency: "${param.currency}"}}
              - {key: limit_tier2_balance, service: product-catalog-service, path: /v1/product-limit-templates,
                 body: {product_version_id: "${parent}", limit_code: WALLET_MAX_BALANCE, period: LIFETIME, metric: BALANCE, kyc_tier: 2, max_value: "${param.wallet_tier2_max_balance}", currency: "${param.currency}"}}
            actions:
              - {name: submit, path: "/{id}/submit", body: {comment: "Starter pack ${pack.code} ${pack.version}"},
                 skip_status: [PENDING_APPROVAL, APPROVED, PUBLISHED, SUPERSEDED, RETIRED], requires_status: [DRAFT], approval: product_version}
              - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PUBLISHED, SUPERSEDED, RETIRED], requires_status: [APPROVED]}
            ready_status: [PUBLISHED, SUPERSEDED]
            pending_status: [PENDING_APPROVAL]

  # ------------------------------------------------------------------------------------------------ onboarding
  # The public sign-up journey of web/customer-web and the mobile app (NEXT_PUBLIC_SIGNUP_JOURNEY, default RETAIL_ONLINE):
  # typed step fields (the client renders and pre-validates them, onboarding-service validates them again), a phone OTP
  # contact step, an identity document upload and the terms. The pack creates a DRAFT; publication is a checker action
  # in onboarding-service (four-eyes: anyone but the pack's acting user), reported as AWAITING_ACTIVATION. A published
  # journey is never changed by the pack: change it through POST /v1/onboarding/journeys/{id}/new-version.
  - code: onboarding
    title: Public sign-up journey RETAIL_ONLINE (onboarding-service, checker publication)
    items:
      - key: journey_retail_online
        title: Retail online sign-up journey (web and mobile)
        service: onboarding-service
        path: /v1/onboarding/journeys
        lookup: {query: {code: RETAIL_ONLINE}, match: {code: RETAIL_ONLINE}}
        body:
          code: RETAIL_ONLINE
          name: Retail online sign-up (DEFAULT)
          customer_type: INDIVIDUAL
          country: "${param.country}"
          channels: [WEB, MOBILE_APP]
          product_ids: ["${ref.current}", "${ref.savings}"]
          target_tier: TIER_1
          legal_entity_id: "${ref.legal_entity}"
          expiry_days: 30
          definition:
            steps:
              - code: PHONE
                type: PHONE_VERIFICATION
                max_attempts: 5
                fields:
                  - {name: phone_number, type: PHONE, label_key: onboarding.field.phone_number, required: true}
              - code: PERSONAL
                type: PERSONAL_DETAILS
                fields:
                  - {name: first_name, type: STRING, label_key: onboarding.field.first_name, required: true, min_length: 1, max_length: 80}
                  - {name: middle_name, type: STRING, label_key: onboarding.field.middle_name, required: false, max_length: 80}
                  - {name: last_name, type: STRING, label_key: onboarding.field.last_name, required: true, min_length: 1, max_length: 80}
                  - {name: date_of_birth, type: DATE, label_key: onboarding.field.date_of_birth, required: true}
                  - {name: nationality, type: COUNTRY, label_key: onboarding.field.nationality, required: true}
                  - {name: email, type: EMAIL, label_key: onboarding.field.email, required: false, max_length: 254}
              - code: ADDRESS
                type: ADDRESS
                fields:
                  - {name: address_line1, type: STRING, label_key: onboarding.field.address_line1, required: true, min_length: 2, max_length: 255}
                  - {name: address_line2, type: STRING, label_key: onboarding.field.address_line2, required: false, max_length: 255}
                  - {name: city, type: STRING, label_key: onboarding.field.city, required: true, min_length: 2, max_length: 120}
                  - {name: postal_code, type: STRING, label_key: onboarding.field.postal_code, required: false, max_length: 20}
                  - {name: country, type: COUNTRY, label_key: onboarding.field.country, required: true}
              - code: ID_DOC
                type: DOCUMENT_CAPTURE
                fields:
                  - {name: id_number, type: STRING, label_key: onboarding.field.id_number, required: true, min_length: 4, max_length: 32}
                  - {name: id_document_id, type: DOCUMENT, label_key: onboarding.field.id_document_id, required: true}
              - code: TERMS
                type: TERMS_ACCEPTANCE
                fields:
                  - {name: terms_accepted, type: BOOLEAN, label_key: onboarding.field.terms_accepted, required: true}
                  - {name: marketing_consent, type: BOOLEAN, label_key: onboarding.field.marketing_consent, required: false}
        actions:
          - {name: publish, path: "/{id}/publish", manual: true, skip_status: [PUBLISHED, RETIRED],
             description: "checker publication in onboarding-service (four-eyes: not the pack's acting user)"}
        ready_status: [PUBLISHED, RETIRED]

  # ------------------------------------------------------------------------------------------------ wallet pricing
  - code: wallet_pricing
    title: Wallet fee rules and KYC tier limits (wallet-service)
    items:
      - {key: fee_p2p, title: P2P transfer fee, service: wallet-service, path: /v1/wallet-fee-rules, update: PATCH, update_exclude: [code],
         lookup: {query: {code: SP-P2P}, match: {code: SP-P2P}},
         body: {code: SP-P2P, txn_type: P2P, wallet_type: CUSTOMER, currency: "${param.currency}", basis: PERCENTAGE, percentage: "0.005",
                min_fee: "0.10", max_fee: "5.00", priority: 100, valid_from: "${today}", is_active: true}}
      - {key: fee_cash_in, title: Cash-in (free), service: wallet-service, path: /v1/wallet-fee-rules, update: PATCH, update_exclude: [code],
         lookup: {query: {code: SP-CASH-IN}, match: {code: SP-CASH-IN}},
         body: {code: SP-CASH-IN, txn_type: CASH_IN, currency: "${param.currency}", basis: FLAT, flat_fee: "0", priority: 100,
                valid_from: "${today}", is_active: true}}
      - {key: fee_cash_out, title: Agent cash-out fee, service: wallet-service, path: /v1/wallet-fee-rules, update: PATCH, update_exclude: [code],
         lookup: {query: {code: SP-CASH-OUT}, match: {code: SP-CASH-OUT}},
         body: {code: SP-CASH-OUT, txn_type: CASH_OUT, wallet_type: CUSTOMER, currency: "${param.currency}", basis: PERCENTAGE,
                percentage: "0.01", min_fee: "0.50", max_fee: "10.00", priority: 100, valid_from: "${today}", is_active: true}}
      - {key: fee_wallet_to_bank, title: Wallet to bank transfer fee, service: wallet-service, path: /v1/wallet-fee-rules, update: PATCH, update_exclude: [code],
         lookup: {query: {code: SP-W2B}, match: {code: SP-W2B}},
         body: {code: SP-W2B, txn_type: WALLET_TO_BANK, wallet_type: CUSTOMER, currency: "${param.currency}", basis: FLAT_PLUS_PERCENTAGE,
                flat_fee: "0.50", percentage: "0.005", max_fee: "10.00", priority: 100, valid_from: "${today}", is_active: true}}
      - {key: fee_bill_payment, title: Bill payment fee, service: wallet-service, path: /v1/wallet-fee-rules, update: PATCH, update_exclude: [code],
         lookup: {query: {code: SP-BILL}, match: {code: SP-BILL}},
         body: {code: SP-BILL, txn_type: BILL_PAYMENT, wallet_type: CUSTOMER, currency: "${param.currency}", basis: FLAT, flat_fee: "0.25",
                priority: 100, valid_from: "${today}", is_active: true}}
      - {key: fee_merchant_payment, title: Merchant payment (free for the payer), service: wallet-service, path: /v1/wallet-fee-rules, update: PATCH, update_exclude: [code],
         lookup: {query: {code: SP-MERCHANT}, match: {code: SP-MERCHANT}},
         body: {code: SP-MERCHANT, txn_type: MERCHANT_PAYMENT, wallet_type: CUSTOMER, currency: "${param.currency}", basis: FLAT, flat_fee: "0",
                priority: 100, valid_from: "${today}", is_active: true}}
      - {key: tier0_limits, title: KYC tier 0 (phone only) limits, service: wallet-service, path: /v1/wallet-tier-limits, update: PATCH,
         update_exclude: [kyc_tier, wallet_type, currency],
         lookup: {query: {kyc_tier: 0, wallet_type: CUSTOMER, currency: "${param.currency}"}, match: {kyc_tier: 0, wallet_type: CUSTOMER, txn_type: null}},
         body: {kyc_tier: 0, wallet_type: CUSTOMER, currency: "${param.currency}", max_balance: "${param.wallet_tier0_max_balance}", per_txn_min: "0.10", per_txn_max: "200",
                daily_amount: "500", daily_count: 20, monthly_amount: "2000", monthly_count: 200, valid_from: "${today}"}}
      - {key: tier1_limits, title: KYC tier 1 limits, service: wallet-service, path: /v1/wallet-tier-limits, update: PATCH,
         update_exclude: [kyc_tier, wallet_type, currency],
         lookup: {query: {kyc_tier: 1, wallet_type: CUSTOMER, currency: "${param.currency}"}, match: {kyc_tier: 1, wallet_type: CUSTOMER, txn_type: null}},
         body: {kyc_tier: 1, wallet_type: CUSTOMER, currency: "${param.currency}", max_balance: "${param.wallet_tier1_max_balance}", per_txn_min: "0.10", per_txn_max: "1000",
                daily_amount: "2000", daily_count: 30, monthly_amount: "10000", monthly_count: 300, valid_from: "${today}"}}
      - {key: tier2_limits, title: KYC tier 2 limits, service: wallet-service, path: /v1/wallet-tier-limits, update: PATCH,
         update_exclude: [kyc_tier, wallet_type, currency],
         lookup: {query: {kyc_tier: 2, wallet_type: CUSTOMER, currency: "${param.currency}"}, match: {kyc_tier: 2, wallet_type: CUSTOMER, txn_type: null}},
         body: {kyc_tier: 2, wallet_type: CUSTOMER, currency: "${param.currency}", max_balance: "${param.wallet_tier2_max_balance}", per_txn_min: "0.10", per_txn_max: "5000",
                daily_amount: "10000", daily_count: 50, monthly_amount: "50000", monthly_count: 500, valid_from: "${today}"}}
      - {key: tier3_limits, title: KYC tier 3 limits, service: wallet-service, path: /v1/wallet-tier-limits, update: PATCH,
         update_exclude: [kyc_tier, wallet_type, currency],
         lookup: {query: {kyc_tier: 3, wallet_type: CUSTOMER, currency: "${param.currency}"}, match: {kyc_tier: 3, wallet_type: CUSTOMER, txn_type: null}},
         body: {kyc_tier: 3, wallet_type: CUSTOMER, currency: "${param.currency}", max_balance: "50000", per_txn_min: "0.10", per_txn_max: "20000",
                daily_amount: "50000", daily_count: 100, monthly_amount: "200000", monthly_count: 1000, valid_from: "${today}"}}

  # ------------------------------------------------------------------------------------------------ limits
  # limits-service has no submit step: a rule is activated by a different user (the checker). The pack creates the
  # rules as DRAFT and reports the activation as pending; it never activates them itself.
  - code: limits
    title: Payment limit rules (limits-service, checker activation)
    items:
      - key: payment_per_txn
        service: limits-service
        path: /v1/risk/limits/rules
        lookup: {query: {scope: TENANT}, match: {code: SP-PAY-TXN-MAX}}
        body: {code: SP-PAY-TXN-MAX, name: Maximum payment amount (DEFAULT), scope: TENANT, period: PER_TRANSACTION, measure: AMOUNT,
               currency: "${param.currency}", max_amount: "${param.limit_payment_per_txn}", breach_action: REVIEW, priority: 100, is_regulatory: false}
        actions:
          - {name: activate, path: "/{id}/activate", manual: true, skip_status: [ACTIVE, INACTIVE], description: "checker activation in limits-service"}
        ready_status: [ACTIVE, INACTIVE]
      - key: payment_daily_amount
        service: limits-service
        path: /v1/risk/limits/rules
        lookup: {query: {scope: TENANT}, match: {code: SP-PAY-DAILY}}
        body: {code: SP-PAY-DAILY, name: Daily outgoing payments (DEFAULT), scope: TENANT, period: DAILY, measure: AMOUNT,
               currency: "${param.currency}", max_amount: "${param.limit_payment_daily}", breach_action: REJECT, priority: 100, is_regulatory: false}
        actions:
          - {name: activate, path: "/{id}/activate", manual: true, skip_status: [ACTIVE, INACTIVE], description: "checker activation in limits-service"}
        ready_status: [ACTIVE, INACTIVE]
      - key: payment_daily_count
        service: limits-service
        path: /v1/risk/limits/rules
        lookup: {query: {scope: TENANT}, match: {code: SP-PAY-DAILY-COUNT}}
        body: {code: SP-PAY-DAILY-COUNT, name: Daily number of payments (DEFAULT), scope: TENANT, period: DAILY, measure: COUNT,
               max_count: "${param.limit_payment_daily_count}", breach_action: STEP_UP, priority: 100, is_regulatory: false}
        actions:
          - {name: activate, path: "/{id}/activate", manual: true, skip_status: [ACTIVE, INACTIVE], description: "checker activation in limits-service"}
        ready_status: [ACTIVE, INACTIVE]
      - key: tier0_daily
        service: limits-service
        path: /v1/risk/limits/rules
        lookup: {query: {scope: KYC_TIER, scope_ref: TIER_0}, match: {code: SP-KYC-T0-DAILY}}
        body: {code: SP-KYC-T0-DAILY, name: KYC tier 0 daily payments (DEFAULT), scope: KYC_TIER, scope_ref: TIER_0, period: DAILY,
               measure: AMOUNT, currency: "${param.currency}", max_amount: "${param.limit_tier0_daily}", breach_action: REJECT, priority: 100, is_regulatory: true}
        actions:
          - {name: activate, path: "/{id}/activate", manual: true, skip_status: [ACTIVE, INACTIVE], description: "checker activation in limits-service"}
        ready_status: [ACTIVE, INACTIVE]
      - key: tier1_daily
        service: limits-service
        path: /v1/risk/limits/rules
        lookup: {query: {scope: KYC_TIER, scope_ref: TIER_1}, match: {code: SP-KYC-T1-DAILY}}
        body: {code: SP-KYC-T1-DAILY, name: KYC tier 1 daily payments (DEFAULT), scope: KYC_TIER, scope_ref: TIER_1, period: DAILY,
               measure: AMOUNT, currency: "${param.currency}", max_amount: "${param.limit_tier1_daily}", breach_action: REJECT, priority: 100, is_regulatory: true}
        actions:
          - {name: activate, path: "/{id}/activate", manual: true, skip_status: [ACTIVE, INACTIVE], description: "checker activation in limits-service"}
        ready_status: [ACTIVE, INACTIVE]

  # ------------------------------------------------------------------------------------------------ commissions
