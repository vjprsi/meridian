                                  nostro_account: "${ref.ledger_book/nostro}", tax_account: "${ref.ledger_book/tax_payable}"}}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]
      - key: routing_card_dispute_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: card-dispute-service, status: ACTIVE}, match: {config_key: card-dispute-service}}
        body: {namespace: ledger, config_key: card-dispute-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {dispute: {suspense_account: "${ref.ledger_book/dispute_suspense}", loss_expense_account: "${ref.ledger_book/dispute_loss_expense}",
                                 scheme_receivable_account: "${ref.ledger_book/chargeback_receivable}"}}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
