        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]
      - key: routing_card_clearing_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: card-clearing-service, status: ACTIVE}, match: {config_key: card-clearing-service}}
        body: {namespace: ledger, config_key: card-clearing-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {clearing: {settlement_accounts: {VISA: "${ref.ledger_book/card_settlement}", MASTERCARD: "${ref.ledger_book/card_settlement}",
                                                        LOCAL: "${ref.ledger_book/card_settlement}"},
