# Meridian tenant starter pack: GENERIC (market-neutral defaults).
#
# Everything below is a DEFAULT chosen so that a freshly provisioned tenant can open accounts, move money, alert
# customers and run end of day. None of it is advice: product, risk, finance and compliance must review every rate,
# tariff, limit, threshold and approval policy before go-live. Amounts are in the tenant's currency (parameter
# `currency`) and are scaled for a hard currency (USD/EUR/GBP); use a market pack (e.g. KE) or override items for
# other currencies.
#
# Format (see docs/SERVICE_IMPLEMENTATION_GUIDE.md "Tenant starter packs"):
#   steps[].items[]  key, service, path (collection), body (create request), optional lookup (pre-existing check),
#                    update (NONE | PATCH | RECREATE), actions (status-driven follow-ups), ready_status,
#                    pending_status, children (created after the parent, before the parent's actions)
#   placeholders     ${param.x}, ${ref.<item key>} (resource id), ${parent}, ${today}, ${tenant_id}; also in object keys
#   repetition       for_each: "${param.<list>}" on an item (one item per value, key <key>.<value lower case>) or
#                    "$for_each": "${param.<list>}" inside an object (one copy of its other entries per value);
#                    ${each} / ${each.lower} is the value
code: GENERIC
version: 2026.10.0
title: Generic bank starter pack
market: GENERIC
description: >
  Market-neutral defaults: one legal entity with its account numbering and a ledger book with a standard chart of
  internal accounts, per-tenant ledger routing for every posting service, treasury and commission-pool wallets,
  savings/current/wallet products, the public sign-up journey RETAIL_ONLINE, wallet tariffs and KYC tier limits,
  payment limits, an agent commission plan, notification providers, templates and payment alert rules, the standard
  EOD job pack with a trigger policy, and maker-checker approval policies.
notice: >
  DEFAULT VALUES. Review every rate, tariff, limit, threshold, role and policy before go-live. Items that need a
  checker (ledger routing, account numbering, products, commission plan, templates, limit activation, sign-up journey
  publication) are submitted or left for the checker, never approved, by the pack.

parameters:
  currency: {type: string, default: USD, tenant_fact: default_currency, description: "Base currency (ISO 4217)"}
  country: {type: string, default: US, tenant_fact: default_country, description: "Country of the legal entity (ISO 3166)"}
  legal_name: {type: string, default: "Demo Bank Ltd (DEFAULT)", tenant_fact: legal_name, description: "Registered name of the main legal entity"}
  timezone: {type: string, default: UTC, description: "IANA time zone for business dates and EOD cut-off"}
  language: {type: string, default: en, description: "Locale of the notification templates"}
  legal_entity_code: {type: string, default: MAIN, description: "Code of the main legal entity"}
  account_number_scheme: {type: string, default: AUTO, description: "Account numbering of the main legal entity: AUTO (IBAN where its country uses IBAN, else the national format), IBAN or NATIONAL"}
  bank_code: {type: string, default: "", description: "DEFAULT empty: national bank code in account numbers / IBANs (GB/IE/NL fall back to the BIC's bank code; KE and NG need one)"}
  branch_code: {type: string, default: "", description: "DEFAULT empty: branch / sort code in account numbers where the country's format has one (e.g. GB sort code, KE branch code)"}
  bic: {type: string, default: "", description: "DEFAULT empty: BIC (ISO 9362) of the main legal entity used on its accounts; must be of the entity's country"}
  license_type: {type: string, default: BANK, description: "Licence type, e.g. BANK, EMI, MFI"}
  regulator: {type: string, default: "UNSPECIFIED (DEFAULT)", description: "Primary regulator"}
  ledger_code: {type: string, default: MAIN, description: "Code of the main ledger book"}
  fx_currencies: {type: array, default: [USD, EUR, GBP], description: "Currencies fx-service deals in, including the base currency: one FX position and one FX clearing account per currency in the main book, routed in config-service"}
  savings_rate: {type: number, default: "0.02", description: "DEFAULT annual credit interest of the standard savings product (fraction)"}
  payment_second_level_amount: {type: number, default: "100000", description: "DEFAULT amount from which payments need a second approval level"}
  high_value_approver_roles: {type: array, default: [], description: "Roles allowed to approve the second level (empty = any user other than the maker)"}
  alert_channels: {type: array, default: [SMS, EMAIL, IN_APP], description: "Channels of payment alerts, in preference order"}
  sms_sender_id: {type: string, default: MERIDIAN, description: "Alphanumeric SMS sender id"}
  email_sender: {type: string, default: "no-reply@bank.example", description: "From address of e-mails"}
  smtp_host: {type: string, default: localhost, description: "SMTP host of the DEFAULT e-mail provider (sandbox/Mailpit)"}
  smtp_port: {type: integer, default: 1025, description: "SMTP port of the DEFAULT e-mail provider"}
  email_sandbox: {type: boolean, default: true, description: "DEFAULT true: e-mails are accepted but not sent; false sends through smtp_host"}
  provider_status: {type: string, default: ACTIVE, description: "Status of the DEFAULT sandbox notification providers (ACTIVE or TESTING)"}
  eod_cut_off_time: {type: string, default: "18:00", description: "Local EOD cut-off time HH:mm"}
  eod_auto_trigger: {type: boolean, default: false, description: "Start EOD automatically at the cut-off (off by default)"}
  # DEFAULT prices and limits in units of `currency` (hard-currency scale)
  fee_statement_copy: {type: number, default: "2.00", description: "DEFAULT paper statement copy fee"}
  fee_monthly_maintenance: {type: number, default: "3.00", description: "DEFAULT monthly current account fee"}
  fee_transfer_out: {type: number, default: "0.50", description: "DEFAULT outgoing domestic transfer fee (after the free allowance)"}
  fee_transfer_out_free_count: {type: integer, default: 10, description: "DEFAULT free outgoing transfers per month"}
  fee_international_flat: {type: number, default: "10.00", description: "DEFAULT international transfer flat fee"}
  fee_international_max: {type: number, default: "50.00", description: "DEFAULT international transfer fee cap"}
  limit_payment_per_txn: {type: number, default: "50000", description: "DEFAULT single payment amount above which a payment goes to review"}
  limit_payment_daily: {type: number, default: "100000", description: "DEFAULT daily outgoing payment amount per customer"}
  limit_payment_daily_count: {type: integer, default: 100, description: "DEFAULT daily number of payments per customer (step-up above)"}
  limit_tier0_daily: {type: number, default: "500", description: "DEFAULT daily payments of KYC tier 0 customers"}
  limit_tier1_daily: {type: number, default: "2000", description: "DEFAULT daily payments of KYC tier 1 customers"}
  wallet_tier0_max_balance: {type: number, default: "500", description: "DEFAULT maximum wallet balance, KYC tier 0"}
  wallet_tier1_max_balance: {type: number, default: "2000", description: "DEFAULT maximum wallet balance, KYC tier 1"}
  wallet_tier2_max_balance: {type: number, default: "10000", description: "DEFAULT maximum wallet balance, KYC tier 2"}
  commission_cash_in_cap: {type: number, default: "5.00", description: "DEFAULT maximum agent commission per cash-in"}

steps:
  # ------------------------------------------------------------------------------------------------ organisation
  - code: organisation
    title: Main legal entity and base currency
    items:
      - key: legal_entity
        title: Main legal entity
        service: tenant-service
        path: /v1/legal-entities
        lookup: {match: {code: "${param.legal_entity_code}"}}
        body:
          code: "${param.legal_entity_code}"
          legal_name: "${param.legal_name}"
          country: "${param.country}"
          base_currency: "${param.currency}"
          timezone: "${param.timezone}"
          fiscal_year_start_month: 1
          license_type: "${param.license_type}"
          regulator: "${param.regulator}"
          status: ACTIVE

  # ------------------------------------------------------------------------------------------------ approvals
  # Created before anything that opens approval requests, so the pack's own submissions are routed by them.
  - code: approvals
    title: Maker-checker approval policies (workflow-service)
    items:
      - key: payment_approve
        title: Payments above the payment-service threshold
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: payment, action: approve}, match: {resource_type: payment, action: approve}}
        body:
          code: AP-PAYMENT
          name: Payment approval (DEFAULT)
          resource_type: payment
          action: approve
          required_approvals: 1
          approval_levels:
            - {level: 1, approver_roles: [], required_approvals: 1}
            - {level: 2, approver_roles: "${param.high_value_approver_roles}", min_amount: "${param.payment_second_level_amount}", required_approvals: 1}
          allow_self_approval: false
          expires_after_hours: 24
          is_active: true
      - key: bulk_payment_approve
        title: Bulk payments
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: bulk_payment, action: approve}, match: {resource_type: bulk_payment, action: approve}}
        body:
          code: AP-BULK-PAYMENT
          name: Bulk payment approval (DEFAULT)
          resource_type: bulk_payment
          action: approve
          required_approvals: 1
          approval_levels:
            - {level: 1, approver_roles: [], required_approvals: 1}
            - {level: 2, approver_roles: "${param.high_value_approver_roles}", min_amount: "${param.payment_second_level_amount}", required_approvals: 1}
          allow_self_approval: false
          expires_after_hours: 24
          is_active: true
      - key: config_entry_activate
        title: Configuration changes (incl. ledger routing)
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: config_entry, action: activate}, match: {resource_type: config_entry, action: activate}}
        body:
          code: AP-CONFIG
          name: Configuration change approval (DEFAULT)
          resource_type: config_entry
          action: activate
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 72
          is_active: true
      - key: product_version_approve
        title: Product versions
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: product_version, action: approve}, match: {resource_type: product_version, action: approve}}
        body:
          code: AP-PRODUCT-VERSION
          name: Product version approval (DEFAULT)
          resource_type: product_version
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true
      - key: notification_template_publish
        title: Customer-facing notification templates
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: notification_template, action: publish}, match: {resource_type: notification_template, action: publish}}
        body:
          code: AP-NOTIFICATION-TEMPLATE
          name: Notification template approval (DEFAULT)
          resource_type: notification_template
          action: publish
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true
      - key: commission_plan_approve
        title: Commission plans
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: commission_plan, action: approve}, match: {resource_type: commission_plan, action: approve}}
        body:
          code: AP-COMMISSION-PLAN
          name: Commission plan approval (DEFAULT)
          resource_type: commission_plan
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true
      - key: deposit_account_approve
        title: Deposit account opening (when the product requires approval)
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: deposit_account, action: approve}, match: {resource_type: deposit_account, action: approve}}
        body:
          code: AP-DEPOSIT-ACCOUNT
          name: Account opening approval (DEFAULT)
          resource_type: deposit_account
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 48
          is_active: true
      - key: customer_kyc_tier_change
        title: Customer KYC tier changes
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: customer_kyc_tier, action: change_tier}, match: {resource_type: customer_kyc_tier, action: change_tier}}
        body:
          code: AP-KYC-TIER
          name: KYC tier change approval (DEFAULT)
          resource_type: customer_kyc_tier
          action: change_tier
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 48
          is_active: true
      - key: agent_float_request_approve
        title: Agent float top-ups and withdrawals
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: agent_float_request, action: approve}, match: {resource_type: agent_float_request, action: approve}}
        body:
          code: AP-AGENT-FLOAT
          name: Agent float request approval (DEFAULT)
          resource_type: agent_float_request
          action: approve
          required_approvals: 1
          approval_levels:
            - {level: 1, approver_roles: [], required_approvals: 1}
            - {level: 2, approver_roles: "${param.high_value_approver_roles}", min_amount: "${param.payment_second_level_amount}", required_approvals: 1}
          allow_self_approval: false
          expires_after_hours: 24
          is_active: true
      - key: loan_write_off_approve
        title: Loan write-offs
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: loan_write_off, action: approve}, match: {resource_type: loan_write_off, action: approve}}
        body:
          code: AP-LOAN-WRITE-OFF
          name: Loan write-off approval (DEFAULT)
          resource_type: loan_write_off
          action: approve
          required_approvals: 1
          approval_levels:
            - {level: 1, approver_roles: [], required_approvals: 1}
            - {level: 2, approver_roles: "${param.high_value_approver_roles}", required_approvals: 1}
          allow_self_approval: false
          expires_after_hours: 72
          is_active: true
      - key: wallet_transaction_reverse
        title: Wallet transaction reversals
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: wallet_transaction, action: reverse}, match: {resource_type: wallet_transaction, action: reverse}}
        body:
          code: AP-WALLET-REVERSAL
          name: Wallet reversal approval (DEFAULT)
          resource_type: wallet_transaction
          action: reverse
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 24
          is_active: true
      - key: tenant_module_enable
        title: Enabling platform modules
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: tenant_module, action: enable}, match: {resource_type: tenant_module, action: enable}}
        body:
          code: AP-MODULE-ENABLE
          name: Module enablement approval (DEFAULT)
          resource_type: tenant_module
          action: enable
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 72
          is_active: true

  # ------------------------------------------------------------------------------------------------ ledger
  - code: ledger
    title: Ledger book and chart of internal accounts
    items:
      - key: ledger_book
        title: Main ledger book
        service: ledger-service
        path: /v1/ledgers
        adopt_children: true
        lookup: {query: {legal_entity_id: "${ref.legal_entity}"}, match: {code: "${param.ledger_code}"}}
        body:
          code: "${param.ledger_code}"
          name: "${param.legal_name} main book"
          legal_entity_id: "${ref.legal_entity}"
          base_currency: "${param.currency}"
          description: Main book created by the starter pack
        children:
          - {key: cash, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1000"}},
             body: {ledger_id: "${parent}", code: "1000", name: Vault cash, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: nostro, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1010"}},
             body: {ledger_id: "${parent}", code: "1010", name: Nostro / central bank settlement, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: treasury_funding, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1020"}},
             body: {ledger_id: "${parent}", code: "1020", name: Treasury funding, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: clearing, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1100"}},
             body: {ledger_id: "${parent}", code: "1100", name: Bank clearing / settlement, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: direct_debit_clearing, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1110"}},
             body: {ledger_id: "${parent}", code: "1110", name: Direct debit clearing, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: wallet_bank_clearing, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1150"}},
             body: {ledger_id: "${parent}", code: "1150", name: E-money trust / bank clearing, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: biller_settlement_clearing, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1160"}},
             body: {ledger_id: "${parent}", code: "1160", name: Biller settlement clearing, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: card_settlement, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1200"}},
             body: {ledger_id: "${parent}", code: "1200", name: Card scheme settlement, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: interest_receivable, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1300"}},
             body: {ledger_id: "${parent}", code: "1300", name: Loan interest receivable, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: fee_receivable, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1310"}},
             body: {ledger_id: "${parent}", code: "1310", name: Loan fee receivable, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: penalty_receivable, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1320"}},
             body: {ledger_id: "${parent}", code: "1320", name: Loan penalty receivable, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: chargeback_receivable, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "1330"}},
             body: {ledger_id: "${parent}", code: "1330", name: Chargeback receivable, account_type: ASSET, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: dispute_suspense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "2300"}},
             body: {ledger_id: "${parent}", code: "2300", name: Provisional credit suspense, account_type: LIABILITY, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: interest_suspense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "2400"}},
             body: {ledger_id: "${parent}", code: "2400", name: Interest in suspense, account_type: LIABILITY, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: tax_payable, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "2500"}},
             body: {ledger_id: "${parent}", code: "2500", name: Tax payable, account_type: LIABILITY, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: overpayment, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "2600"}},
             body: {ledger_id: "${parent}", code: "2600", name: Loan overpayments, account_type: LIABILITY, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: share_capital, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "3000"}},
             body: {ledger_id: "${parent}", code: "3000", name: Share capital, account_type: EQUITY, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: retained_earnings, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "3100"}},
             body: {ledger_id: "${parent}", code: "3100", name: Retained earnings, account_type: EQUITY, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: interest_income, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "4000"}},
             body: {ledger_id: "${parent}", code: "4000", name: Interest income, account_type: INCOME, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: fee_income, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "4100"}},
             body: {ledger_id: "${parent}", code: "4100", name: Fee income, account_type: INCOME, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: penalty_income, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "4200"}},
             body: {ledger_id: "${parent}", code: "4200", name: Penalty income, account_type: INCOME, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: recovery_income, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "4300"}},
             body: {ledger_id: "${parent}", code: "4300", name: Recovery income, account_type: INCOME, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: interchange_income, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "4400"}},
             body: {ledger_id: "${parent}", code: "4400", name: Interchange income, account_type: INCOME, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: merchant_fee_income, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "4500"}},
             body: {ledger_id: "${parent}", code: "4500", name: Merchant service fee income, account_type: INCOME, normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: interest_expense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5000"}},
             body: {ledger_id: "${parent}", code: "5000", name: Interest expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: write_off_expense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5100"}},
             body: {ledger_id: "${parent}", code: "5100", name: Write-off expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: waiver_expense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5200"}},
             body: {ledger_id: "${parent}", code: "5200", name: Waiver expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: agency_commission, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5300"}},
             body: {ledger_id: "${parent}", code: "5300", name: Agency commission expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: dispute_loss_expense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5400"}},
             body: {ledger_id: "${parent}", code: "5400", name: Card dispute loss expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: rewards_expense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5500"}},
             body: {ledger_id: "${parent}", code: "5500", name: Rewards and cashback expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          - {key: redress_expense, service: ledger-service, path: /v1/ledger-accounts, lookup: {query: {ledger_id: "${parent}"}, match: {code: "5600"}},
             body: {ledger_id: "${parent}", code: "5600", name: Customer redress expense, account_type: EXPENSE, normal_balance: DEBIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}}
          # one FX position and one FX clearing account per currency of fx_currencies (keys fx_position.usd, ...)
          - {key: fx_position, for_each: "${param.fx_currencies}", service: ledger-service, path: /v1/ledger-accounts,
             lookup: {query: {ledger_id: "${parent}"}, match: {code: "1400-${each}"}},
             body: {ledger_id: "${parent}", code: "1400-${each}", name: "FX position ${each}", account_type: ASSET, normal_balance: DEBIT, currency: "${each}", allow_negative: true, owner_type: BANK}}
          - {key: fx_clearing, for_each: "${param.fx_currencies}", service: ledger-service, path: /v1/ledger-accounts,
             lookup: {query: {ledger_id: "${parent}"}, match: {code: "1410-${each}"}},
             body: {ledger_id: "${parent}", code: "1410-${each}", name: "FX clearing ${each}", account_type: ASSET, normal_balance: DEBIT, currency: "${each}", allow_negative: true, owner_type: BANK}}

  # ------------------------------------------------------------------------------------------------ account numbering
  # config-service namespace "account_numbering" (docs/SERVICE_IMPLEMENTATION_GUIDE.md "Account numbering"): how
  # deposit-service numbers the accounts of the main legal entity (key = legal entity code). Country and BIC default to
  # the legal entity; empty values mean "not set". Maker-checker like the ledger routing below.
  - code: account_numbering
    title: Account numbering of the main legal entity (config-service, maker-checker)
    items:
      - key: numbering_main
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: account_numbering, config_key: "le-${ref.legal_entity}", status: ACTIVE}, match: {config_key: "le-${ref.legal_entity}"}}
        body: {namespace: account_numbering, config_key: "le-${ref.legal_entity}", change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {scheme: "${param.account_number_scheme}", bank_code: "${param.bank_code}", branch_code: "${param.branch_code}",
                       bic: "${param.bic}"}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]

  # ------------------------------------------------------------------------------------------------ ledger routing
  # config-service namespace "ledger" (docs/SERVICE_IMPLEMENTATION_GUIDE.md "Per-tenant ledger settings"). Each entry is
  # a DRAFT submitted for approval; it becomes ACTIVE when a checker approves it. A newer pack version creates a new
  # version of the entry (RECREATE) and submits it again. An entry the tenant already activated is left alone.
  - code: ledger_routing
    title: Per-tenant ledger routing (config-service, maker-checker)
    items:
      - key: routing_default
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: default, status: ACTIVE}, match: {config_key: default}}
        body: {namespace: ledger, config_key: default, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {ledger_id: "${ref.ledger_book}"}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]
      - key: routing_deposit_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: deposit-service, status: ACTIVE}, match: {config_key: deposit-service}}
        body: {namespace: ledger, config_key: deposit-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {gl: {clearing: "${ref.ledger_book/clearing}", fee_income: "${ref.ledger_book/fee_income}",
