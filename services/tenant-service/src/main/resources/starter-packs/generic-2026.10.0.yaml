        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: wallet-service, status: ACTIVE}, match: {config_key: wallet-service}}
        body: {namespace: ledger, config_key: wallet-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {gl: {bank_clearing: "${ref.ledger_book/wallet_bank_clearing}", fee_income: "${ref.ledger_book/fee_income}",
                            tax_payable: "${ref.ledger_book/tax_payable}"}}}
        actions:
