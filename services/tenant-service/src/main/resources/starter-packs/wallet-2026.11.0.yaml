# Meridian tenant starter pack: WALLET (Meridian Core — Wallet Edition; mobile money / e-money). Extends GENERIC.
#
# This is the country-NEUTRAL, configurable, English-first base for the Wallet Edition (the mobiquity Pay equivalent).
# It inherits everything a working tenant needs from GENERIC (legal entity, ledger chart + per-service ledger routing,
# treasury + commission-pool wallets, savings/current/wallet products, KYC tier limits, wallet tariffs, agent
# commission plan, notification providers/templates/rules, the standard EOD pack and maker-checker approval policies),
# tilts the defaults towards an e-money issuer (EMI licence, wallet-first branding), and adds the e-money system
# accounts (the mobiquity IND-series — trust liability, suspense, unclaimed, churn, churn-suspense, rewards payable)
# mapped onto the existing double-entry ledger (decision D-ED-03: no new ledger engine).
#
# Country specifics (currency, KYC-tier thresholds, tariffs, USSD codes, regulator) are PARAMETERS or a per-country
# overlay pack that `extends: WALLET` (mirroring how KE extends GENERIC). The base stays English and currency-neutral:
# `currency` defaults to USD and `language` to en; set them per deployment. Nothing here is advice — product, risk,
# finance and compliance must review every rate, tariff, limit, threshold and policy before go-live.
code: WALLET
version: 2026.11.0
extends: GENERIC@2026.10.0
title: Wallet Edition (mobile money / e-money) starter pack
market: GLOBAL
description: >
  Meridian Core — Wallet Edition base: GENERIC localised for a stored-value e-money issuer. Country-neutral and
  English-first (currency and language are parameters). Adds the e-money system-account set (customer e-money
  liability, suspense, unclaimed, churn, churn-suspense, rewards payable) to the main ledger book on top of every
  GENERIC item, so a freshly provisioned wallet tenant can onboard, cash-in/out, transfer, pay bills/merchants and
  run end of day. Extend this pack per country (e.g. a SL/DRC/KE overlay) to set concrete currencies and tariffs.
notice: >
  DEFAULT VALUES for a Wallet Edition (e-money) tenant. Country-neutral English defaults, not regulatory or provider
  tariffs: review every rate, tariff, limit, threshold, role and policy before go-live, and set the currency,
  language, regulator and KYC-tier limits for the target market (parameter overrides or a country overlay pack).

parameters:
  legal_name: {default: "Demo Wallet Co (DEFAULT)"}
  license_type: {default: EMI}
  regulator: {default: "UNSPECIFIED e-money regulator (DEFAULT)"}

steps:
  # ---------------------------------------------------------------------------------------- e-money system accounts
  # The mobiquity IND-series mapped onto the main ledger book (created by the inherited GENERIC `ledger` step).
  # All are e-money liabilities (the issuer owes the holder), in the tenant's base currency. They are created here;
  # the transaction features that post to them (unregistered/voucher flows, churn settlement) wire their ledger
  # routing in later waves. Idempotent: looked up by code in the book, like the GENERIC chart accounts.
  - code: emoney_system_accounts
    title: E-money system accounts (mobiquity IND-series mapped onto the ledger)
    items:
      - key: emoney_liability
        title: E-money customer liability (IND04 trust liability)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2700"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2700", name: E-money customer liability, account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}
      - key: emoney_suspense
        title: E-money suspense (IND02 unregistered / pending claims)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2710"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2710", name: E-money suspense (unregistered), account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}
      - key: emoney_unclaimed
        title: E-money unclaimed funds (IND06)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2720"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2720", name: E-money unclaimed funds, account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}
      - key: emoney_churn
        title: E-money churn account (IND10)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2730"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2730", name: E-money churn, account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}
      - key: emoney_churn_suspense
        title: E-money churn suspense (IND11)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2740"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2740", name: E-money churn suspense, account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}
      - key: emoney_rewards_payable
        title: E-money rewards / cashback payable (IND08)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2750"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2750", name: E-money rewards payable, account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}
      - key: emoney_escheatment
        title: E-money due to regulator / escheatment (WE-FIN-2, D-ED-07)
        service: ledger-service
        path: /v1/ledger-accounts
        lookup: {query: {ledger_id: "${ref.ledger_book}"}, match: {code: "2760"}}
        body: {ledger_id: "${ref.ledger_book}", code: "2760", name: "E-money due to regulator (escheatment)", account_type: LIABILITY,
               normal_balance: CREDIT, currency: "${param.currency}", allow_negative: true, owner_type: BANK}

  # ---------------------------------------------------------------------------------------- WE-FLOAT-1: stock / float ledger routing
  # agent-network-service e-money system accounts and capital pool, per tenant in config-service (namespace ledger).
  # Supersedes the GENERIC agent-network-service routing (RECREATE), adding the e-money trust/suspense/unclaimed
  # accounts seeded above and the capital pool wallet (= treasury wallet, IND01). gl.capital maps the IND01 capital
  # pool to the share-capital GL for the GL<->GL unclaimed-settlement final leg (finance to confirm the mapping).
  # WE-FIN-2 (D-ED-07): gl.escheatment wires the e-money due-to-regulator liability (2760) — the compliant DEFAULT
  # destination of aged unclaimed funds; gl.capital / gl.income stay explicit, operator-selected (non-default) options.
  - code: stock_float_routing
    title: Operator stock / float ledger routing (config-service, maker-checker)
    items:
      - key: routing_agent_network
        title: agent-network-service e-money accounts and capital pool
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: agent-network-service, status: ACTIVE}, match: {config_key: agent-network-service}}
        body:
          namespace: ledger
          config_key: agent-network-service
          change_reason: "Tenant starter pack ${pack.code} ${pack.version}"
          value:
            treasury_wallet_id: "${ref.treasury_wallet}"
            capital_wallet_id: "${ref.treasury_wallet}"
            ledger_id: "${ref.ledger_book}"
            gl:
              trust: "${ref.emoney_liability}"
              suspense: "${ref.emoney_suspense}"
              unclaimed: "${ref.emoney_unclaimed}"
              bank_clearing: "${ref.ledger_book/wallet_bank_clearing}"
              capital: "${ref.ledger_book/share_capital}"
              income: "${ref.ledger_book/fee_income}"
              escheatment: "${ref.emoney_escheatment}"
            sweep: {schedule_enabled: false, default_min_residual: "0"}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]

  # ---------------------------------------------------------------------------------------- WE-TXN-1: voucher ledger routing
  # Supersedes the GENERIC wallet-service ledger routing (RECREATE), adding the e-money suspense (2710 / IND02) and
  # unclaimed (2720 / IND06) accounts the unregistered / voucher flows post to. Keeps every GENERIC field (bank
  # clearing, fee income, tax payable) so none is dropped by the recreate.
  - code: voucher_routing
    title: Wallet-service voucher ledger routing (config-service, maker-checker)
    items:
      - key: routing_wallet_voucher
        title: wallet-service e-money suspense / unclaimed accounts for voucher flows
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: wallet-service, status: ACTIVE}, match: {config_key: wallet-service}}
        body:
          namespace: ledger
          config_key: wallet-service
          change_reason: "Tenant starter pack ${pack.code} ${pack.version}"
          value:
            gl:
              bank_clearing: "${ref.ledger_book/wallet_bank_clearing}"
              fee_income: "${ref.ledger_book/fee_income}"
              tax_payable: "${ref.ledger_book/tax_payable}"
              suspense: "${ref.emoney_suspense}"
              unclaimed: "${ref.emoney_unclaimed}"
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]

  # ---------------------------------------------------------------------------------------- WE-FLOAT-1: stock maker-checker
  # Approval policies for operator stock operations, auto-deallocation sweeps and unclaimed settlements (agent-network-
  # service owns the resource types; workflow-service routes the decision). Cloned from the agent_float_request policy;
  # four-eyes, no self-approval.
  - code: stock_approvals
    title: Approval policies for operator stock / float administration (maker-checker)
    items:
      - key: stock_operation_approve
        title: Operator stock creation and reimbursement
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: stock_operation, action: approve}, match: {resource_type: stock_operation, action: approve}}
        body:
          code: AP-STOCK-OPERATION
          name: Stock operation approval (DEFAULT)
          resource_type: stock_operation
          action: approve
          required_approvals: 1
          approval_levels:
            - {level: 1, approver_roles: [], required_approvals: 1}
            - {level: 2, approver_roles: "${param.high_value_approver_roles}", min_amount: "${param.payment_second_level_amount}", required_approvals: 1}
          allow_self_approval: false
          expires_after_hours: 24
          is_active: true
      - key: stock_sweep_run_approve
        title: Auto-deallocation sweep runs
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: stock_sweep_run, action: approve}, match: {resource_type: stock_sweep_run, action: approve}}
        body:
          code: AP-STOCK-SWEEP-RUN
          name: Auto-deallocation sweep approval (DEFAULT)
          resource_type: stock_sweep_run
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 24
          is_active: true
      - key: unclaimed_settlement_approve
        title: Unclaimed-money settlement runs
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: unclaimed_settlement, action: approve}, match: {resource_type: unclaimed_settlement, action: approve}}
        body:
          code: AP-UNCLAIMED-SETTLEMENT
          name: Unclaimed settlement approval (DEFAULT)
          resource_type: unclaimed_settlement
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true

  # ---------------------------------------------------------------------------------------- WE-HIER-1: hierarchy maker-checker
  # Approval policies for the configurable Domain -> Category -> Grade config (agent-network-service owns the resource
  # types; workflow-service routes the decision). Same level-1 four-eyes policy as the inherited commission_plan one.
  - code: hierarchy_approvals
    title: Approval policies for the configurable distribution hierarchy (maker-checker)
    items:
      - key: distribution_domain_approve
        title: Distribution domains
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: distribution_domain, action: approve}, match: {resource_type: distribution_domain, action: approve}}
        body:
          code: AP-DISTRIBUTION-DOMAIN
          name: Distribution domain approval (DEFAULT)
          resource_type: distribution_domain
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true
      - key: domain_category_approve
        title: Domain categories
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: domain_category, action: approve}, match: {resource_type: domain_category, action: approve}}
        body:
          code: AP-DOMAIN-CATEGORY
          name: Domain category approval (DEFAULT)
          resource_type: domain_category
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true
      - key: grade_approve
        title: Grades
        service: workflow-service
        path: /v1/approval-policies
        update: PATCH
        update_exclude: [code, resource_type, action]
        lookup: {query: {resource_type: grade, action: approve}, match: {resource_type: grade, action: approve}}
        body:
          code: AP-GRADE
          name: Grade approval (DEFAULT)
          resource_type: grade
          action: approve
          required_approvals: 1
          approval_levels: [{level: 1, approver_roles: [], required_approvals: 1}]
          allow_self_approval: false
          expires_after_hours: 120
          is_active: true

  # ---------------------------------------------------------------------------------------- WE-HIER-1: factory hierarchy
  # The factory "Distribution" domain, its owner category, the three standard categories (which the legacy AgentLevel
  # SUPER_AGENT/AGENT/SUB_AGENT compat path maps onto) and a grade per category plus the singleton un-registered grade.
  # Idempotent: looked up by code, like the e-money accounts. Created as DRAFT; a checker submits/approves them (and
  # GET /v1/grades/unregistered lazily bootstraps the un-registered grade so the hot path never 404s before then).
  - code: distribution_hierarchy
    title: Factory distribution domain, categories and grades (configurable hierarchy)
    items:
      - key: hier_domain
        title: Factory distribution domain
        service: agent-network-service
        path: /v1/distribution-domains
        lookup: {query: {code: DISTRIBUTION}, match: {code: DISTRIBUTION}}
        body: {code: DISTRIBUTION, name: Distribution, description: "Factory distribution domain (${pack.code} ${pack.version})"}
      - key: hier_cat_owner
        title: Owner category (level 1)
        service: agent-network-service
        path: /v1/domain-categories
        lookup: {query: {distribution_domain_id: "${ref.hier_domain}", code: DISTRIBUTION}, match: {code: DISTRIBUTION}}
        body: {distribution_domain_id: "${ref.hier_domain}", code: DISTRIBUTION, name: Distribution (owner)}
      - key: hier_cat_super
        title: Super-agent category
        service: agent-network-service
        path: /v1/domain-categories
        lookup: {query: {distribution_domain_id: "${ref.hier_domain}", code: SUPER_AGENT}, match: {code: SUPER_AGENT}}
        body: {distribution_domain_id: "${ref.hier_domain}", code: SUPER_AGENT, name: Super agent, parent_category_id: "${ref.hier_cat_owner}"}
      - key: hier_cat_agent
        title: Agent category
        service: agent-network-service
        path: /v1/domain-categories
        lookup: {query: {distribution_domain_id: "${ref.hier_domain}", code: AGENT}, match: {code: AGENT}}
        body: {distribution_domain_id: "${ref.hier_domain}", code: AGENT, name: Agent, parent_category_id: "${ref.hier_cat_owner}"}
      - key: hier_cat_sub
        title: Sub-agent category
        service: agent-network-service
        path: /v1/domain-categories
        lookup: {query: {distribution_domain_id: "${ref.hier_domain}", code: SUB_AGENT}, match: {code: SUB_AGENT}}
        body: {distribution_domain_id: "${ref.hier_domain}", code: SUB_AGENT, name: Sub agent, parent_category_id: "${ref.hier_cat_owner}"}
      - key: hier_grade_unregistered
        title: Factory un-registered grade (singleton)
        service: agent-network-service
        path: /v1/grades
        lookup: {query: {code: UNREGISTERED}, match: {code: UNREGISTERED}}
        body: {domain_category_id: "${ref.hier_cat_owner}", code: UNREGISTERED, name: Un-registered,
               description: Default grade of an un-onboarded holder, is_unregistered: true}
      - key: hier_grade_super
        title: Standard super-agent grade
        service: agent-network-service
        path: /v1/grades
        lookup: {query: {code: SA-STD}, match: {code: SA-STD}}
        body: {domain_category_id: "${ref.hier_cat_super}", code: SA-STD, name: Super agent (standard)}
      - key: hier_grade_agent
        title: Standard agent grade
        service: agent-network-service
        path: /v1/grades
        lookup: {query: {code: AG-STD}, match: {code: AG-STD}}
        body: {domain_category_id: "${ref.hier_cat_agent}", code: AG-STD, name: Agent (standard)}
      - key: hier_grade_sub
        title: Standard sub-agent grade
        service: agent-network-service
        path: /v1/grades
        lookup: {query: {code: SB-STD}, match: {code: SB-STD}}
        body: {domain_category_id: "${ref.hier_cat_sub}", code: SB-STD, name: Sub agent (standard)}
