        lookup: {query: {code: NEW_DEVICE_SIGN_IN, channel: EMAIL, locale: "${param.language}"}, match: {code: NEW_DEVICE_SIGN_IN, channel: EMAIL}}
        body: {code: NEW_DEVICE_SIGN_IN, channel: EMAIL, locale: "${param.language}", category: SECURITY, subject: "Nuevo inicio de sesión en tu cuenta",
               body: "Se inició sesión en tu cuenta desde un dispositivo nuevo: {{device_label}} (dirección {{ip_address}}) el {{seen_at}}. Si no fuiste tú, entra a Seguridad en la app, elige Cerrar todas las sesiones y comunícate con nosotros."}
        actions:
          - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PENDING_APPROVAL, ACTIVE, RETIRED], requires_status: [DRAFT], approval: notification_template}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]
      - key: tpl_new_device_sign_in_sms
        service: notification-service
        path: /v1/notification-templates
        lookup: {query: {code: NEW_DEVICE_SIGN_IN, channel: SMS, locale: "${param.language}"}, match: {code: NEW_DEVICE_SIGN_IN, channel: SMS}}
        body: {code: NEW_DEVICE_SIGN_IN, channel: SMS, locale: "${param.language}", category: SECURITY,
               body: "Nuevo inicio de sesión desde {{device_label}}. ¿No fuiste tú? Cierra todas las sesiones en la app y llámanos."}
        actions:
          - {name: publish, path: "/{id}/publish", body: {}, skip_status: [PENDING_APPROVAL, ACTIVE, RETIRED], requires_status: [DRAFT], approval: notification_template}
        ready_status: [ACTIVE]
        pending_status: [PENDING_APPROVAL]

  # Colombian calendars (global reference data, idempotent by code): national festivos, ACH Colombia (festivos) and
  # Bre-B (24x7x365: no weekends, no holidays). reference-data-service generates the festivos of the current and
  # next two years when a CO-* / ACH-CO calendar is created (rule feed CO); the import action adds later years.
  - code: calendars
    items:
      - key: calendar_co
        title: Colombia national holidays (festivos, Ley 51 de 1983)
        service: reference-data-service
        path: /v1/reference/holiday-calendars
        lookup: {query: {country: CO, calendar_type: COUNTRY}, match: {code: CO-FESTIVOS}}
        body: {code: CO-FESTIVOS, name: "Festivos de Colombia", calendar_type: COUNTRY, country: CO, timezone: America/Bogota,
               weekend_days: [SATURDAY, SUNDAY], description: "Generated from the CO rule feed (fixed, Emiliani and Easter-based festivos)"}
      - key: calendar_ach_co
        title: ACH Colombia rail calendar (business days, festivos)
        service: reference-data-service
        path: /v1/reference/holiday-calendars
        lookup: {query: {country: CO, calendar_type: PAYMENT_RAIL}, match: {code: ACH-CO}}
        body: {code: ACH-CO, name: "ACH Colombia", calendar_type: PAYMENT_RAIL, country: CO, timezone: America/Bogota,
               weekend_days: [SATURDAY, SUNDAY], description: "ACH Colombia / CENIT batch rail: closed on weekends and festivos"}
      - key: calendar_breb
        title: Bre-B instant payments rail calendar (24x7x365)
        service: reference-data-service
        path: /v1/reference/holiday-calendars
        lookup: {query: {country: CO, calendar_type: PAYMENT_RAIL}, match: {code: BRE-B}}
        body: {code: BRE-B, name: "Bre-B (Banco de la República)", calendar_type: PAYMENT_RAIL, country: CO, timezone: America/Bogota,
               weekend_days: [], description: "Bre-B instant payments operate 24x7x365: no weekend or holiday closures"}

  # Colombian tax rules (tenant rules in config-service, for the main legal entity). Applied by the money flows
  # through config-service /v1/config/tax-rules/calculate.
  - code: taxes
    items:
      - key: tax_gmf
        title: "GMF 4x1000 on debits (Gravamen a los Movimientos Financieros)"
        service: config-service
        path: /v1/config/tax-rules
        update: PATCH
        update_exclude: [country, tax_type, applies_to, legal_entity_id]
        lookup: {query: {country: CO, tax_type: FINANCIAL_TRANSACTION_TAX, applies_to: TRANSFER, legal_entity_id: "${ref.legal_entity}"},
                 match: {country: CO, tax_type: FINANCIAL_TRANSACTION_TAX, applies_to: TRANSFER}}
        body: {legal_entity_id: "${ref.legal_entity}", country: CO, tax_type: FINANCIAL_TRANSACTION_TAX, name: "GMF 4x1000",
               rate: "${param.gmf_rate}", applies_to: TRANSFER, currency: COP, tax_gl_code: "2441", valid_from: "${today}"}
      - key: tax_gmf_withdrawal
        title: "GMF 4x1000 on cash withdrawals"
        service: config-service
        path: /v1/config/tax-rules
        update: PATCH
        update_exclude: [country, tax_type, applies_to, legal_entity_id]
        lookup: {query: {country: CO, tax_type: FINANCIAL_TRANSACTION_TAX, applies_to: WITHDRAWAL, legal_entity_id: "${ref.legal_entity}"},
                 match: {country: CO, tax_type: FINANCIAL_TRANSACTION_TAX, applies_to: WITHDRAWAL}}
        body: {legal_entity_id: "${ref.legal_entity}", country: CO, tax_type: FINANCIAL_TRANSACTION_TAX, name: "GMF 4x1000 retiro",
               rate: "${param.gmf_rate}", applies_to: WITHDRAWAL, currency: COP, tax_gl_code: "2441", valid_from: "${today}"}
      - key: tax_iva_fees
        title: "IVA 19% on financial service fees"
        service: config-service
        path: /v1/config/tax-rules
        update: PATCH
        update_exclude: [country, tax_type, applies_to, legal_entity_id]
        lookup: {query: {country: CO, tax_type: VAT, applies_to: FEE, legal_entity_id: "${ref.legal_entity}"},
                 match: {country: CO, tax_type: VAT, applies_to: FEE}}
        body: {legal_entity_id: "${ref.legal_entity}", country: CO, tax_type: VAT, name: "IVA comisiones",
               rate: "${param.iva_rate}", applies_to: FEE, currency: COP, tax_gl_code: "2408", valid_from: "${today}"}
      - key: tax_retencion_interest
        title: "Retención en la fuente on financial returns (interest paid)"
        service: config-service
        path: /v1/config/tax-rules
        update: PATCH
        update_exclude: [country, tax_type, applies_to, legal_entity_id]
        lookup: {query: {country: CO, tax_type: WITHHOLDING, applies_to: INTEREST_PAID, legal_entity_id: "${ref.legal_entity}"},
                 match: {country: CO, tax_type: WITHHOLDING, applies_to: INTEREST_PAID}}
        body: {legal_entity_id: "${ref.legal_entity}", country: CO, tax_type: WITHHOLDING, name: "Retención en la fuente rendimientos financieros",
               rate: "${param.retencion_rendimientos_rate}", applies_to: INTEREST_PAID, currency: COP, tax_gl_code: "2365", valid_from: "${today}"}

  # payment-service settings of the tenant: the GENERIC ledger routing plus COP approval levels (one approval from
  # payment_first_level_amount, two from payment_second_level_amount).
  - code: ledger_routing
    items:
      - key: routing_payment_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: payment-service, status: ACTIVE}, match: {config_key: payment-service}}
        body: {namespace: ledger, config_key: payment-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {gl: {clearing: "${ref.ledger_book/clearing}", fee_income: "${ref.ledger_book/fee_income}",
                            direct_debit_clearing: "${ref.ledger_book/direct_debit_clearing}",
                            tax_payable: "${ref.ledger_book/tax_payable}"},
                       fees: {DOMESTIC: "0", INSTANT: "${param.breb_fee}", CROSS_BORDER: "${param.cross_border_fee}"},
                       taxes: {scale: 0, timezone: "${param.timezone}",
                               gmf: {name: "GMF 4x1000", rate: "${param.gmf_rate}", directions: [OUTBOUND, INTERNAL],
                                     exempt_same_holder: true, exempt_monthly_amount: "${param.gmf_exempt_monthly_amount}"},
                               fee_vat: {name: "IVA", rate: "${param.iva_rate}"}},
                       approval: {levels: [{min_amount: "${param.payment_first_level_amount}", approvals: 1},
                                           {min_amount: "${param.payment_second_level_amount}", approvals: 2}]}}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]
      # loan-service: GENERIC ledger book + the usury cap (tasa de usura certified monthly by the SFC; bookings above
      # it, or after valid_until, are refused). The default values are placeholders: set them from the certification.
      - key: routing_loan_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: loan-service, status: ACTIVE}, match: {config_key: loan-service}}
        body: {namespace: ledger, config_key: loan-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {gl: {clearing: "${ref.ledger_book/clearing}", interest_income: "${ref.ledger_book/interest_income}",
                            interest_receivable: "${ref.ledger_book/interest_receivable}", interest_suspense: "${ref.ledger_book/interest_suspense}",
                            fee_income: "${ref.ledger_book/fee_income}", fee_receivable: "${ref.ledger_book/fee_receivable}",
                            penalty_income: "${ref.ledger_book/penalty_income}", penalty_receivable: "${ref.ledger_book/penalty_receivable}",
                            overpayment: "${ref.ledger_book/overpayment}", waiver_expense: "${ref.ledger_book/waiver_expense}",
                            write_off_expense: "${ref.ledger_book/write_off_expense}", recovery_income: "${ref.ledger_book/recovery_income}",
                            agency_commission: "${ref.ledger_book/agency_commission}", tax_payable: "${ref.ledger_book/tax_payable}"},
                       usury: {max_effective_annual_rate: "${param.usury_rate_consumo}",
                               by_modality: {MICROCREDITO: "${param.usury_rate_microcredito}", BAJO_MONTO: "${param.usury_rate_bajo_monto}"},
                               reference: "${param.usury_reference}", valid_until: "${param.usury_valid_until}"}}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]
      # deposit-service: GENERIC ledger book + retención en la fuente on interest paid (when the product sets none).
      - key: routing_deposit_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: deposit-service, status: ACTIVE}, match: {config_key: deposit-service}}
        body: {namespace: ledger, config_key: deposit-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {gl: {clearing: "${ref.ledger_book/clearing}", fee_income: "${ref.ledger_book/fee_income}",
                            interest_expense: "${ref.ledger_book/interest_expense}", interest_income: "${ref.ledger_book/interest_income}",
                            tax_payable: "${ref.ledger_book/tax_payable}"},
                       withholding_tax_rate: "${param.retencion_rendimientos_rate}"}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]
      # fraud-service: the models were calibrated on KES amounts; COP amounts are scaled into that range for the
      # amount-valued features (rules keep raw COP), so a COP 9.5M transfer scores like ~KES 300k, not KES 9.5M.
      - key: routing_fraud_service
        service: config-service
        path: /v1/config/entries
        update: RECREATE
        lookup: {query: {namespace: ledger, config_key: fraud-service, status: ACTIVE}, match: {config_key: fraud-service}}
        body: {namespace: ledger, config_key: fraud-service, change_reason: "Tenant starter pack ${pack.code} ${pack.version}",
               value: {amount_scale: {COP: "${param.fraud_amount_scale_cop}"}}}
        actions:
          - {name: submit, path: "/{id}/submit", body: {change_reason: "Tenant starter pack ${pack.code} ${pack.version}"},
             skip_status: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, ROLLED_BACK], requires_status: [DRAFT], approval: config_entry}
        ready_status: [ACTIVE, SUPERSEDED]
        pending_status: [PENDING_APPROVAL]

  # Bre-B: 24x7 instant rail, real-time gross settlement, two access nodes (routing-service ranks them by health,
  # latency and cost and fails over; protocol BREB_JSON_V1, requests signed with MERIDIAN_BREB_SIGNING_SECRET).
  - code: rails
    items:
      - key: rail_breb
        title: Bre-B instant payments rail (Banco de la República, 24x7, real-time gross settlement)
        service: routing-service
        path: /v1/payment-rails
        update: PATCH
        update_exclude: [code]
        lookup: {query: {code: BRE_B}, match: {code: BRE_B}}
        body: {code: BRE_B, name: "Bre-B", rail_type: INSTANT, country: CO, currencies: [COP], message_standard: ISO20022,
               settlement_model: RTGS, is_instant: true, holiday_calendar_id: "${ref.calendar_breb}", cost_per_payment: "0",
               settlement_minutes: 0, participant_bic: "${param.breb_participant_code}", operating_hours: {mode: "24x7"}}
      - key: rail_breb_node_a
        title: Bre-B access node A (primary)
        service: routing-service
        path: /v1/rail-adapters
        update: PATCH
        update_exclude: [payment_rail_id]
        lookup: {query: {payment_rail_id: "${ref.rail_breb}"}, match: {name: "Bre-B node A"}}
        body: {payment_rail_id: "${ref.rail_breb}", name: "Bre-B node A", connection_type: DIRECT, provider: "${param.breb_node_a_provider}",
               participant_id: "${param.breb_participant_code}", endpoint_url: "${param.breb_node_a_url}", is_primary: true, status: ACTIVE,
               config: {protocol: BREB_JSON_V1, participant_name: "${param.legal_name}", timeout_ms: 8000, latency_ms: 60, cost: 0,
                        signing_secret_env: MERIDIAN_BREB_SIGNING_SECRET}}
      - key: rail_breb_node_b
        title: Bre-B access node B (secondary)
        service: routing-service
        path: /v1/rail-adapters
        update: PATCH
        update_exclude: [payment_rail_id]
        lookup: {query: {payment_rail_id: "${ref.rail_breb}"}, match: {name: "Bre-B node B"}}
        body: {payment_rail_id: "${ref.rail_breb}", name: "Bre-B node B", connection_type: DIRECT, provider: "${param.breb_node_b_provider}",
               participant_id: "${param.breb_participant_code}", endpoint_url: "${param.breb_node_b_url}", is_primary: false, status: ACTIVE,
               config: {protocol: BREB_JSON_V1, participant_name: "${param.legal_name}", timeout_ms: 8000, latency_ms: 90, cost: 0.5,
                        signing_secret_env: MERIDIAN_BREB_SIGNING_SECRET}}
