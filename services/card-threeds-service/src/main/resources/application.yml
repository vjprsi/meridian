# card-threeds-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9107
  shutdown: graceful

spring:
  application:
    name: card-threeds-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_3ds_db?currentSchema=card_3ds
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_3ds
    default-schema: card_3ds
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.cards.v1
  cards:
    callback-secret: dev-callback-secret   # HMAC secret shared with the directory servers
    threeds:
      cavv-key: dev-cavv-key               # key for CAVV / AAV generation (HSM in production)
      otp-key: dev-3ds-otp-key             # HMAC key for challenge OTP hashes
      challenge-ttl-minutes: 5
      max-otp-attempts: 3
      three-ri-max-amount: 100             # merchant-initiated (3RI) frictionless ceiling

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-threeds-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
