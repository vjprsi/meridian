# business-day-service (Operations: Batch, Files, Search and Archive). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9157
  shutdown: graceful

spring:
  application:
    name: business-day-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/business_day_db?currentSchema=business_day
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: business_day
    default-schema: business_day
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  events:
    topic: meridian.operations.v1
  business-day:
    # Cross-tenant EOD trigger (G8). The scheduler is off by default; operators can always run a sweep with
    # POST /v1/operations/eod-sweeps/run (meridian:admin). In JWT mode set meridian.service-auth.token-uri /
    # client-id / client-secret so downstream job calls carry a meridian:internal service token.
    auto-eod:
      enabled: ${MERIDIAN_AUTO_EOD_ENABLED:false}
      interval: PT5M
      initial-delay: PT1M
      default-enabled: true        # tenants without an eod_trigger_policy get automatic EOD
      default-cut-off: "22:00"     # local time in the legal entity's (else tenant's) time zone
      default-time-zone: UTC
      tenant-concurrency: 8
      tenant-timeout: PT2M

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: business-day-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
