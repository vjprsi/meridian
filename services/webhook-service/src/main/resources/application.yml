# webhook-service (Platform and Administration). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9131
  shutdown: graceful

spring:
  application:
    name: webhook-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/webhook_db?currentSchema=webhook
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: webhook
    default-schema: webhook
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.platform.v1
  webhooks:
    # AES-256-GCM key (base64, 32 bytes) encrypting signing secrets at rest. DEV-ONLY default: set
    # MERIDIAN_WEBHOOKS_KEY from the secret store in every other environment. Startup fails if it is invalid.
    key: ${MERIDIAN_WEBHOOKS_KEY:ZGV2LW9ubHktd2ViaG9vay1rZXktMzItYnl0ZXMhISE=}
    allow-insecure-localhost: false   # http://localhost endpoints (tests / local dev only)
    disable-after-failures: 20        # consecutive failed attempts before an endpoint is auto-disabled
    timeout-ms: 10000
    dispatch-interval-ms: 1000
    dispatch-batch-size: 100
    consumer-enabled: true            # fan out events from meridian.<domain>.v1 topics
    scheduler-enabled: true           # dispatch due deliveries / run replay jobs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: webhook-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
