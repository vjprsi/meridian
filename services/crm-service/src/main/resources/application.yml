# crm-service (Servicing and CRM). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9144
  shutdown: graceful

spring:
  application:
    name: crm-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/crm_db?currentSchema=crm
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: crm
    default-schema: crm
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.servicing.v1
  crm:
    default-country: GB          # jurisdiction for complaint timelines and SLA policy matching when none is given
    redress:                     # per tenant: config-service namespace ledger, key crm-service: redress.ledger_id / .funding_account_id
      ledger-id: ${MERIDIAN_CRM_REDRESS_LEDGER_ID:}                 # default ledger book for redress postings
      funding-account-id: ${MERIDIAN_CRM_REDRESS_FUNDING_ACCOUNT_ID:} # bank redress expense / suspense account
    timeline:
      consumer-enabled: true     # project other domains' events into the customer timeline
      topics: meridian.party.v1,meridian.accounts.v1,meridian.payments.v1,meridian.cards.v1,meridian.lending.v1,meridian.wallets.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: crm-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
