# card-vault-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9104
  shutdown: graceful

spring:
  application:
    name: card-vault-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_vault_db?currentSchema=card_vault
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_vault
    default-schema: card_vault
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.cards.v1
  cards:
    vault:
      # Software HSM master key (base64, 32 bytes): NEVER committed. Supply it from the secret store as
      # MERIDIAN_CARDS_VAULT_MASTER_KEY or as a mounted file (MERIDIAN_CARDS_VAULT_MASTER_KEY_FILE), or replace the
      # software HSM with a KMS / network HSM adapter bean. Without one the service refuses to start, except with
      # security-mode=dev, where a clearly labelled local development key is used.
      master-key: ${MERIDIAN_CARDS_VAULT_MASTER_KEY:}
      master-key-file: ${MERIDIAN_CARDS_VAULT_MASTER_KEY_FILE:}
      # SEC-11: dedicated scopes for clear-data reveal / vault administration plus recent step-up for user tokens
      step-up-max-age-seconds: 300
      step-up-acr-values: [ "2", "3", "mfa", "aal2", "aal3", "urn:meridian:acr:mfa" ]
      step-up-amr-values: [ "mfa", "otp", "totp", "hwk", "swk", "webauthn", "sms" ]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-vault-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
