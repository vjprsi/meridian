# card-vault-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9104
  shutdown: graceful

spring:
  application:
    name: card-vault-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_vault_db?currentSchema=card_vault
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_vault
    default-schema: card_vault
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  security:
    # SEC-14: only the ops console and Meridian services may call the vault (developer-portal / agent-app tokens are
    # refused even if they carried a cards scope)
    allowed-clients: ${MERIDIAN_CARD_VAULT_ALLOWED_CLIENTS:meridian-console,${meridian.service-auth.client-id:meridian-service}}
  events:
    topic: meridian.cards.v1
  cards:
    vault:
      # Software HSM master key (base64, 32 bytes): NEVER committed. Supply it from the secret store as
      # MERIDIAN_CARDS_VAULT_MASTER_KEY or as a mounted file (MERIDIAN_CARDS_VAULT_MASTER_KEY_FILE), or replace the
      # software HSM with a KMS / network HSM adapter bean. Without one the service refuses to start, except with
      # security-mode=dev, where a clearly labelled local development key is used.
      master-key: ${MERIDIAN_CARDS_VAULT_MASTER_KEY:}
      master-key-file: ${MERIDIAN_CARDS_VAULT_MASTER_KEY_FILE:}
      # GAP-01: software (dev; envelope under the master key above) | aws-kms (CDE KMS key, IRSA) | pkcs11 (HSM)
      key-management: ${MERIDIAN_CARDS_VAULT_KEY_MANAGEMENT:software}
      master-key-previous: ${MERIDIAN_CARDS_VAULT_MASTER_KEY_PREVIOUS:}   # software rotation: old keys, comma separated
      data-key-cache-ttl: ${MERIDIAN_CARDS_VAULT_DATA_KEY_CACHE_TTL:PT5M}  # unwrapped data keys kept in memory
      data-key-cache-max-entries: 10000
      kms:
        key-id: ${MERIDIAN_CARDS_VAULT_KMS_KEY_ID:}          # key ARN or alias/meridian-<cell>-cde (infra/tofu cell)
        region: ${MERIDIAN_CARDS_VAULT_KMS_REGION:}
        endpoint: ${MERIDIAN_CARDS_VAULT_KMS_ENDPOINT:}      # optional VPC interface endpoint
      pkcs11:
        config: ${MERIDIAN_CARDS_VAULT_PKCS11_CONFIG:}       # SunPKCS11 configuration file (library, slot, attributes)
        pin: ${MERIDIAN_CARDS_VAULT_PKCS11_PIN:}             # HSM crypto-user PIN, from a Secret
        key-alias-prefix: "meridian/"
        pin-block-key-algorithm: GenericSecret
      master-key-rotation:                                   # daily re-wrap of data keys under the current master
        enabled: ${MERIDIAN_CARDS_VAULT_MASTER_KEY_ROTATION_ENABLED:true}
        cron: "0 40 2 * * *"
      # GAP-02: services allowed per operation when a service token names its service (defaults in VaultAccessPolicy)
      # callers:
      #   verify: [card-authorization-service]
      # SEC-11: dedicated scopes for clear-data reveal / vault administration plus recent step-up for user tokens
      step-up-max-age-seconds: 300
      step-up-acr-values: [ "2", "3", "mfa", "aal2", "aal3", "urn:meridian:acr:mfa" ]
      step-up-amr-values: [ "mfa", "otp", "totp", "hwk", "swk", "webauthn", "sms" ]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-vault-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
