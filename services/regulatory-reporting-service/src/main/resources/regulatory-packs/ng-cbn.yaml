      - {line: MBR_L040, from: "2800", to: "2999"}
      - {line: MBR_E010, from: "3000", to: "3009", attributes: {capital: T1}}
      - {line: MBR_E020, from: "3010", to: "3099", attributes: {capital: T1}}
      - {line: MBR_E030, from: "3100", to: "3199", attributes: {capital: T1}}
      - {line: MBR_E040, from: "3200", to: "3299", attributes: {capital: T1}}
      - {line: MBR_E050, from: "3300", to: "3899"}
      - {line: MBR_E060, from: "3900", to: "3999"}
