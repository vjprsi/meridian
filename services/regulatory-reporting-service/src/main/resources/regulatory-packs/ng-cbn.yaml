# Meridian regulatory pack NG_CBN: Nigeria (Central Bank of Nigeria; CTR / STR statistics for the Nigerian Financial
# Intelligence Unit).
#
# ILLUSTRATIVE TEMPLATES. Cell codes, row/column layouts, thresholds (capital adequacy, liquidity ratio, single
# obligor limit, CTR thresholds), risk weights and deadlines are realistic samples in the shape of CBN / NFIU returns
# (e.g. the monthly balance sheet return), NOT copies of the regulator's forms or of its e-FASS / reporting portal
# templates. Validate every report against the regulator's current templates, taxonomy, circulars and deadlines
# before using it for a filing.
#
# Structure: see ke-cbk.yaml and docs/SERVICE_IMPLEMENTATION_GUIDE.md "Regulatory packs".
pack_code: NG_CBN
version: 2026.10.0
country: NG
regulator: Central Bank of Nigeria
currency: NGN
title: Nigeria prudential, AML, conduct and agent banking returns (illustrative)
notice: >
  ILLUSTRATIVE layouts and thresholds in the shape of CBN / NFIU returns, not the regulator's forms. Validate against
  the regulator's current templates, circulars and deadlines before use; review the GL mapping table against the
  bank's chart of accounts.

calendar:
  business_day_convention: FOLLOWING
  # Nigerian public holidays 2026-2027 (illustrative; Islamic holidays follow the government's declaration - verify)
  holidays: ["2026-01-01", "2026-03-20", "2026-04-03", "2026-04-06", "2026-05-01", "2026-05-27", "2026-06-12",
             "2026-10-01", "2026-12-25", "2026-12-28",
             "2027-01-01", "2027-03-10", "2027-03-26", "2027-03-29", "2027-05-01", "2027-05-17", "2027-06-14",
             "2027-10-01", "2027-12-27", "2027-12-28"]

