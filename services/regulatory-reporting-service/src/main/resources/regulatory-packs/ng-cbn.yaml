    description: Meridian reference chart -> monthly balance sheet return style lines, Tier 1 / Tier 2 capital, simplified risk weights and liquidity ratio classes (illustrative)
    account_field: gl_account_code
    rules:
      - {line: MBR_A010, from: "1000", to: "1009", attributes: {exposure_class: CASH, risk_weight: "0", liquidity: LIQUID}}
      - {line: MBR_A010, from: "1010", to: "1019", attributes: {exposure_class: SOVEREIGN, risk_weight: "0", liquidity: LIQUID}}
      - {line: MBR_A020, from: "1020", to: "1099", attributes: {exposure_class: BANKS, risk_weight: "0.20", liquidity: LIQUID}}
      - {line: MBR_A050, from: "1100", to: "1399", attributes: {exposure_class: OTHER, risk_weight: "1.00"}}
      - {line: MBR_A030, from: "1400", to: "1499", attributes: {exposure_class: SOVEREIGN, risk_weight: "0", liquidity: LIQUID}}
      - {line: MBR_A040, from: "1500", to: "1509", attributes: {exposure_class: RETAIL, risk_weight: "0.75"}}
      - {line: MBR_A040, from: "1510", to: "1529", attributes: {exposure_class: CORPORATE, risk_weight: "1.00"}}
      - {line: MBR_A040, from: "1530", to: "1539", attributes: {exposure_class: MORTGAGE, risk_weight: "0.50"}}
      - {line: MBR_A040, from: "1540", to: "1589", attributes: {exposure_class: CORPORATE, risk_weight: "1.00"}}
      - {line: MBR_A045, from: "1590", to: "1599", attributes: {exposure_class: PROVISIONS, risk_weight: "1.00"}}
      - {line: MBR_A060, from: "1600", to: "1699", attributes: {exposure_class: OTHER, risk_weight: "1.00"}}
      - {line: MBR_A070, from: "1700", to: "1799", attributes: {exposure_class: DEDUCTED, risk_weight: "0", capital: DEDUCT_T1}}
      - {line: MBR_A080, from: "1800", to: "1899", attributes: {exposure_class: DEDUCTED, risk_weight: "0", capital: DEDUCT_T1}}
      - {line: MBR_A050, from: "1900", to: "1999", attributes: {exposure_class: OTHER, risk_weight: "1.00"}}
