# fx-service (Payments Hub). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9123
  shutdown: graceful

spring:
  application:
    name: fx-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/fx_db?currentSchema=fx
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: fx
    default-schema: fx
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.payments.v1
  fx:
    quote-ttl-seconds: 30     # firm quote validity
    default-margin-bps: 50    # when no fx_margin_rule matches
    spot-days: 2              # value date of deals not linked to a payment (T+2)
    # ledger-id: <ledger book id>
    # position-accounts: { EUR: <ledger account id>, USD: <ledger account id> }
    # clearing-accounts: { EUR: <ledger account id>, USD: <ledger account id> }

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: fx-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
