# card-clearing-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9108
  shutdown: graceful

spring:
  application:
    name: card-clearing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_clearing_db?currentSchema=card_clearing
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_clearing
    default-schema: card_clearing
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.cards.v1
  cards:
    # Ledger book and internal accounts used by clearing postings (dev placeholders; override per environment).
    ledger-id: 0199a000-0000-7000-8000-0000000000aa
    clearing:
      match-tolerance-pct: 0.20
      atm-fee: 2.50
      settlement-accounts:
        VISA: 0199a000-0000-7000-8000-00000000c501
        MASTERCARD: 0199a000-0000-7000-8000-00000000c502
      fee-income-account: 0199a000-0000-7000-8000-00000000c510
      interchange-income-account: 0199a000-0000-7000-8000-00000000c511
      nostro-account: 0199a000-0000-7000-8000-00000000c512
      tax-account: 0199a000-0000-7000-8000-00000000c513

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-clearing-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
