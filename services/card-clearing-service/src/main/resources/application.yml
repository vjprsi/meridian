# card-clearing-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9108
  shutdown: graceful

spring:
  application:
    name: card-clearing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_clearing_db?currentSchema=card_clearing
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_clearing
    default-schema: card_clearing
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  events:
    topic: meridian.cards.v1
  cards:
    # Ledger book and internal accounts of clearing postings are tenant data: set them per tenant in config-service
    # (namespace ledger, key card-clearing-service: ledger_id, clearing.settlement_accounts.<SCHEME>,
    # clearing.fee_income_account, clearing.interchange_income_account, clearing.nostro_account, clearing.tax_account).
    # The deployment values are only a fallback for single-tenant installs; with neither, postings fail with
    # 422 ledger_not_configured / ledger_account_not_configured (the clearing record goes to EXCEPTION).
    ledger-id: ${MERIDIAN_CARDS_LEDGER_ID:}
    clearing:
      match-tolerance-pct: 0.20
      atm-fee: 2.50
      # settlement-accounts: { VISA: <id>, MASTERCARD: <id> }
      # fee-income-account / interchange-income-account / nostro-account / tax-account: <id>

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-clearing-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
