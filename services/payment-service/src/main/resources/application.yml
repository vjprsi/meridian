# payment-service (Payments Hub). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9121
  shutdown: graceful

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/payment_db?currentSchema=payment
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: payment
    default-schema: payment
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  data-lifecycle:
    # GAP-08: records kept on a data subject erasure while the statutory retention period of the relationship
    # runs (customer-service decides; within_retention). Every other pii column of the customer is anonymised.
    retain-on-erasure:
      payment: "AML/CFT record keeping and accounting: payment records"
      payment_mandate: "Direct debit mandates: scheme and accounting record keeping"
      bulk_payment_item: "AML/CFT record keeping and accounting: payment records"
      request_to_pay: "AML/CFT record keeping: payment request records"
  events:
    topic: meridian.payments.v1
  payment:
    # Ledger book and internal accounts (ids in ledger-service); set per environment.
    ledger-id: ${MERIDIAN_PAYMENT_LEDGER_ID:}
    bank-bic: MERIGB2LXXX
    bank-code: MERI
    bank-name: Meridian Bank
    gl:
      clearing: ${MERIDIAN_PAYMENT_GL_CLEARING:}
      fee-income: ${MERIDIAN_PAYMENT_GL_FEE_INCOME:}
      direct-debit-clearing: ${MERIDIAN_PAYMENT_GL_DD_CLEARING:}
    fees:
      DOMESTIC: 0.00
      INSTANT: 0.25
      CROSS_BORDER: 15.00
    approval:
      levels:
        - min-amount: 10000
          approvals: 1
        - min-amount: 100000
          approvals: 2
      bulk-min-approvals: 1
      expiry-hours: 72
    cop:
      match-threshold: 0.98
      close-match-threshold: 0.80
    payee-cooling-off-hours: 24
    link-base-url: https://pay.meridian.example
    qr-guid: IO.MERIDIAN.PAY
    screening-enabled: true
    limits-enabled: true
    refund-days: 56
    fraud:
      enabled: true                    # score outbound and internal payments in fraud-service before release
      timeout-ms: 2000                 # evaluation budget; slower = unavailable
      fail-closed-amount: 1000         # scoring unavailable: hold for review at or above (payment currency), continue below
      # channel-fail-closed-amount:    # per channel override of fail-closed-amount, e.g. BULK_FILE: 0, OPEN_BANKING: 500
      step-up-action: REVIEW           # STEP_UP decision: REVIEW (hold) or ALLOW
      alert-consumer-enabled: true     # risk.fraud_alert.resolved releases / rejects held payments
      alert-topic: meridian.risk.v1
      alert-group: payment-service-fraud-alerts
      auto-rescore:                    # holds of unavailable scoring (fraud_degraded) are re-scored with the same key
        enabled: true                  # internal scheduler over every tenant (execute-due also rescores due holds)
        interval-ms: 60000
        initial-backoff: 1m            # then doubling: 2m, 4m, ... capped at max-backoff
        max-backoff: 1h
        max-attempts: 12               # afterwards the hold waits for an analyst (fraud-rescore / fraud-review-decision)
        batch-size: 100
      upstream:                        # reuse the originating service's evaluation instead of scoring twice
        services: [wallet-service]     # internal token + X-Meridian-Service only; never from channel or user tokens
        max-age-seconds: 900           # only a recent ALLOW of the same customer, amount and currency

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: payment-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
