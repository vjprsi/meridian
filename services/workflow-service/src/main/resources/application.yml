# workflow-service (Platform and Administration). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9129
  shutdown: graceful

spring:
  application:
    name: workflow-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/workflow_db?currentSchema=workflow
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: workflow
    default-schema: workflow
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.platform.v1
  workflow:
    # SEC-03: generic request types a user may open directly (no service executes them). Empty: users open none.
    user-request-types: []
    # SEC-03: resource type -> owning service. Only the owner (service identity) opens requests for its types and only
    # the owner's handler receives the decision. Keep in sync with the ApprovalOutcomeHandlers (ApprovalOwnersRegistryTest).
    approval-owners:
      agent_float_request: agent-network-service
      agent_kyc_document: agent-network-service
      cash_management_request: agent-network-service
      copilot_action: ai-platform-service
      ml_model_version: ai-platform-service
      alm_behavioural_assumption: alm-service
      analytics_kpi: analytics-service
      purge_request: archive-service
      data_export_request: audit-service
      biller_settlement: biller-service
      campaign: campaign-service
      card_dispute: card-dispute-service
      card_program: card-service
      aml_case_disposition: case-management-service
      sar_report: case-management-service
      collateral: collateral-service
      legal_proceeding: collections-service
      payment_plan: collections-service
      commission_payout_run: commission-service
      commission_plan: commission-service
      config_entry: config-service
      complaint_redress: crm-service
      knowledge_article: crm-service
      customer_kyc_tier: customer-service
      account_closure: deposit-service
      deposit_account: deposit-service
      overdraft_facility: deposit-service
      disbursement_batch: disbursement-service
      document_template: document-service
      accounting_period_close: gl-service
      gl_journal: gl-service
      app_user: identity-service
      role: identity-service
      user_role: identity-service
      kyc_document: kyc-service
      limit_override: limits-service
      lcr_calculation: liquidity-service
      nsfr_calculation: liquidity-service
      liquidity_stress_scenario: liquidity-service
      credit_decision_request: loan-origination-service
      loan_application_document: loan-origination-service
      loan_restructure: loan-service
      loan_write_off: loan-service
      merchant: merchant-service
      merchant_refund: merchant-service
      merchant_settlement: merchant-service
      notification_template: notification-service
      onboarding_application: onboarding-service
      bulk_payment: payment-service
      payment: payment-service
      decision_table_version: pricing-rules-service
      product_script: product-catalog-service
      product_version: product-catalog-service
      report_adjustment: regulatory-reporting-service
      report_definition_version: regulatory-reporting-service
      report_submission: regulatory-reporting-service
      points_adjustment: rewards-service
      screening_result: sanctions-service
      tenant_module: tenant-service
      customer_risk_rating: transaction-monitoring-service
      treasury_counterparty: treasury-deal-service
      treasury_counterparty_limit: treasury-deal-service
      treasury_ssi: treasury-deal-service
      wallet_bank_link: wallet-service
      wallet_pin_reset: wallet-service
      wallet_transaction: wallet-service
      workflow_definition: workflow-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: workflow-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
