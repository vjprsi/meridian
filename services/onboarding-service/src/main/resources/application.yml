# onboarding-service (Customer and Onboarding). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9119
  shutdown: graceful

spring:
  application:
    name: onboarding-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/onboarding_db?currentSchema=onboarding
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: onboarding
    default-schema: onboarding
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.party.v1
  onboarding:
    public:                       # self-service applicant surface (/v1/onboarding/public/applications)
      client-ip-header: ""        # e.g. X-Forwarded-For behind the gateway, which must overwrite it; empty = socket peer
      token-ttl-minutes: 30       # applicant token lifetime; rotate with token/refresh
      starts-per-ip-per-hour: 20
      starts-per-device-per-hour: 5
      attestation-required: false # true: start needs attestation_token (CAPTCHA / app attestation verdict)
      otp-ttl-seconds: 300
      otp-max-attempts: 5
      otp-max-sends: 5            # codes per application
      otp-resend-seconds: 30
      otp-secret: ${MERIDIAN_ONBOARDING_OTP_SECRET:dev-only-otp-secret}
      max-documents: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: onboarding-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
