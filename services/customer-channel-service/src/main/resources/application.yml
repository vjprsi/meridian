# customer-channel-service (Customer Channels). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9164
  shutdown: graceful

spring:
  application:
    name: customer-channel-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/customer_channel_db?currentSchema=customer_channel
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: customer_channel
    default-schema: customer_channel
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  events:
    topic: meridian.channels.v1
  channels:
    # Step-up (money movement, payee add/trust, contact changes, card unfreeze and limits, standing orders, loan
    # repayment, device revocation): acr level (Keycloak Levels of Authentication, realm acr.loa.map) and the age of
    # the authentication (auth_time). Per-operation overrides by operation id; amr = methods of which one is required.
    step-up:
      acr: "2"                # password + second factor (WebAuthn / passkey / authenticator app)
      max-age: PT5M
      amr: []
      operations: {}          # e.g. myCardsReplaceLimits: {acr: "1", max-age: PT15M}
    acr-levels: {"0": 0, "1": 1, "2": 2}
    sessions:
      enabled: true           # register sessions by sid; refuse signed-out ones (401 session_revoked)
      new-device-alerts: true # channels.customer_session.new_device -> notification rule NEW_DEVICE_SIGN_IN
      touch-interval: PT1M
      # Keycloak admin client used to list / end the customer's own sessions and list their factors (optional; without
      # it revocation is enforced by the channel only and the factor list is empty).
      # identity-provider:
      #   base-url: http://localhost:15180
      #   realm: meridian
      #   client-id: meridian-customer-sessions
      #   client-secret: meridian-customer-sessions-secret
  # JWT mode: the channel never forwards a customer's token; it calls the domain services with this service identity
  # for the customer's tenant (required, else customer requests fail with 503 service_identity_not_configured).
  # service-auth:
  #   token-uri: http://localhost:15180/realms/meridian/protocol/openid-connect/token
  #   client-id: meridian-service
  #   client-secret: meridian-service-secret

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: customer-channel-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
