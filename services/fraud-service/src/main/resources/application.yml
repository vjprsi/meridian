# fraud-service (Risk, Fraud, AML and Limits). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9139
  shutdown: graceful

spring:
  application:
    name: fraud-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/fraud_db?currentSchema=fraud
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: fraud
    default-schema: fraud
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  events:
    topic: meridian.risk.v1
  fraud:
    ml:
      environment: PRODUCTION          # ai-platform deployments (of FRAUD models) this instance serves
      refresh-ttl-ms: 300000           # background refresh of a tenant's models (deployment events reload at once)
      failure-backoff-ms: 30000        # retry interval after ai-platform-service was unreachable (rules decide meanwhile)
      feature-logging: true            # read real-time features for every evaluation (training data), not only ML policies
      feature-topics: meridian.payments.v1,meridian.cards.v1,meridian.wallets.v1,meridian.risk.v1
      feature-group: fraud-service-feature-store
      model-events-topic: meridian.reporting.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: fraud-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
