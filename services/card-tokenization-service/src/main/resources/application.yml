# card-tokenization-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9106
  shutdown: graceful

spring:
  application:
    name: card-tokenization-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_token_db?currentSchema=card_token
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_token
    default-schema: card_token
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  # SEC-02: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets).
  required-secrets:
    - meridian.cards.callback-secret
    - meridian.cards.tokens.otp-key
    - meridian.cards.tokens.payload-key
  events:
    topic: meridian.cards.v1
  cards:
    callback-secret: dev-callback-secret   # HMAC secret shared with the scheme token services (VTS / MDES)
    tokens:
      max-per-card: 10                     # live (active, suspended, pending) tokens per card
      otp-key: dev-token-otp-key           # HMAC key for step-up OTP hashes
      payload-key: dev-token-payload-key   # key for the opaque push-provisioning payload
      otp-ttl-minutes: 10
      max-step-up-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-tokenization-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
