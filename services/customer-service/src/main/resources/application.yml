# customer-service (Customer and Onboarding). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9118
  shutdown: graceful

spring:
  application:
    name: customer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/customer_db?currentSchema=customer
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: customer
    default-schema: customer
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  # SEC-02 / GAP-14: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets); the local
  # defaults below therefore only ever work in dev mode.
  required-secrets:
    - meridian.contact-lookup.key
    - meridian.customer.secret-key
  events:
    topic: meridian.party.v1
  contact-lookup:
    # Key of the contact lookup hash (customer_contact.lookup_hash): customer-service and search-service MUST share
    # it (MERIDIAN_CONTACT_LOOKUP_KEY, from the vault outside the local stack); the default is for the local stack only.
    key: ${MERIDIAN_CONTACT_LOOKUP_KEY:local-dev-only-contact-lookup-key}
  approvals:
    # KYC tier upgrades have no local approve endpoint: their checker always decides in workflow-service, so this
    # service defaults to central approvals (override with MERIDIAN_APPROVALS_MODE).
    mode: workflow
  customer:
    # Key for identifier hashes, OTP peppering and passkey challenges. Supply from the vault in every
    # non-local environment (MERIDIAN_CUSTOMER_SECRET_KEY); the default is for the local stack only.
    secret-key: ${MERIDIAN_CUSTOMER_SECRET_KEY:local-dev-only-secret-key-change-me}
    webauthn:
      rp-id: meridian.example
      rp-name: Meridian Bank
      origins: https://app.meridian.example

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: customer-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
