# card-authorization-service (Card Issuing and Processing). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9105
  shutdown: graceful

spring:
  application:
    name: card-authorization-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/card_auth_db?currentSchema=card_auth
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: card_auth
    default-schema: card_auth
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  # SEC-08/18 shared outbound URL policy for tenant-configured provider URLs. These relaxations (plain http,
  # local / private simulators) apply ONLY with security-mode=dev; jwt mode is always https + public addresses.
  outbound:
    allow-http: true
    allow-private-networks: true
  # SEC-02: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets).
  required-secrets:
    - meridian.cards.auth.jit-secret
  events:
    topic: meridian.cards.v1
  cards:
    auth:
      jit-secret: dev-jit-secret        # HMAC key for JIT webhooks (override per environment)
      rule-cache-ttl-ms: 5000
      default-hold-days: 7
      default-fraud-timeout-ms: 80
      default-scheme: VISA
      reference-rates:                  # fallback when the network sends no conversion rate (DE10)
        EUR_USD: 1.0850
        GBP_USD: 1.2700
        USD_EUR: 0.9200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: card-authorization-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
