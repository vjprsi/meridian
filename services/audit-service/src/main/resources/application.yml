# audit-service (Platform and Administration). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9132
  shutdown: graceful

spring:
  application:
    name: audit-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/audit_db?currentSchema=audit
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: audit
    default-schema: audit
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  # SEC-02: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets).
  required-secrets:
    - meridian.audit.download-signing-key
    - meridian.audit.pseudonym-key
    - meridian.audit.worm.secret-key
  events:
    topic: meridian.platform.v1
  audit:
    # GAP-07: personal data in stored before/after states is replaced by tenant-keyed psn: pseudonyms (spec pii columns
    # of every service + personal field names). MERIDIAN_AUDIT_PSEUDONYM_KEY from the vault outside the local stack.
    pseudonym-key: ${MERIDIAN_AUDIT_PSEUDONYM_KEY:dev-only-audit-pseudonym-key-not-for-production}
    ingest:
      # Batch ingestion of consumed domain events (DomainEventAuditListener): records per poll, threads that parse and
      # mask a poll (0 = CPU count, max 8), tenant chains appended concurrently (each holds one DB connection).
      # Measured locally (AuditIngestionThroughputIT, 20k events, 4 tenants): ~460 events/s per-record, ~4,000-4,400 batched.
      max-poll-records: ${MERIDIAN_AUDIT_INGEST_MAX_POLL_RECORDS:1000}
      mask-parallelism: ${MERIDIAN_AUDIT_INGEST_MASK_PARALLELISM:0}
      tenant-parallelism: ${MERIDIAN_AUDIT_INGEST_TENANT_PARALLELISM:4}
    integrity:
      enabled: true                # daily per tenant: incremental hash-chain verification, then seal of yesterday
      cron: "0 15 1 * * *"          # UTC
    worm:
      # Sealed daily batches (events + manifest) on S3 with Object Lock (bucket created with object lock enabled:
      # infra/tofu module cell, aws_s3_bucket.audit). Local stack: SeaweedFS (no object lock -> NONE).
      endpoint: ${MERIDIAN_AUDIT_WORM_ENDPOINT:http://localhost:19000}
      bucket: ${MERIDIAN_AUDIT_WORM_BUCKET:meridian-audit}
      region: ${MERIDIAN_AUDIT_WORM_REGION:us-east-1}
      access-key: ${MERIDIAN_AUDIT_WORM_ACCESS_KEY:meridian}
      secret-key: ${MERIDIAN_AUDIT_WORM_SECRET_KEY:meridian-secret}
      object-lock-mode: ${MERIDIAN_AUDIT_WORM_OBJECT_LOCK_MODE:COMPLIANCE}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: audit-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
