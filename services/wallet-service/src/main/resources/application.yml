# wallet-service (Wallets, Agents and Merchants). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9145
  shutdown: graceful

spring:
  application:
    name: wallet-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/wallet_db?currentSchema=wallet
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: wallet
    default-schema: wallet
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  data-lifecycle:
    # GAP-08: records kept on a data subject erasure while the statutory retention period of the relationship
    # runs (customer-service decides; within_retention). Every other pii column of the customer is anonymised.
    retain-on-erasure:
      wallet: "E-money account records: AML/CFT record keeping"
      wallet_transaction: "AML/CFT record keeping and accounting: e-money transaction records"
  events:
    topic: meridian.wallets.v1
  # wallet:                       # set per environment
  #   ledger-id: <ledger book of wallet accounts>
  #   # gl.atm-clearing (D-ED-09) = ATM settlement / clearing GL for CLEARING_GL ATM OTP dispense (daily-settled):
  #   gl: { fee-income: <id>, tax-payable: <id>, bank-clearing: <id>, suspense: <2710/IND02>, unclaimed: <2720/IND06>,
  #         atm-clearing: <ATM settlement/clearing GL> }
  #   pin: { iterations: 120000, max-attempts: 3, lock-minutes: 30, otp-max-attempts: 3 }
  #   confirmation-minutes: 10
  #   pin-reset-minutes: 10
  #   dormancy-days: 180
  #   risk: { limits-enabled: true, fraud-enabled: true, fail-open: false }
  #   # WE-TXN-1 unregistered / voucher flows (gl.suspense is wired per tenant by the WALLET starter pack):
  #   # refund-fee-on-expiry (D-ED-08, default true): an expired unclaimed voucher also refunds the issuance fee+tax.
  #   voucher: { expiry-hours: 72, passcode-length: 6, passcode-max-attempts: 3, rollback-target: SENDER,
  #              schedule-enabled: false, interval-ms: 3600000, refund-fee-on-expiry: true }
  #   # WE-TXN-2 cash-out authorisations. refund-fee-on-expiry (D-ED-08, default true): an expired unredeemed
  #   # authorisation refunds the hold-leg fee+tax. atm-settlement-mode (D-ED-09, default WALLET): WALLET settles an
  #   # ATM OTP to the settlement float wallet; CLEARING_GL settles GL->GL to gl.atm-clearing (daily-settled, reconciled).
  #   cashout-auth: { code-length: 6, code-max-attempts: 3, agent-passcode-expiry-minutes: 1440,
  #                   atm-otp-expiry-minutes: 15, auth-code-expiry-minutes: 60, schedule-enabled: false,
  #                   interval-ms: 300000, refund-fee-on-expiry: true, atm-settlement-mode: WALLET }

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: wallet-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
