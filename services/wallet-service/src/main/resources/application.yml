# wallet-service (Wallets, Agents and Merchants). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9145
  shutdown: graceful

spring:
  application:
    name: wallet-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/wallet_db?currentSchema=wallet
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: wallet
    default-schema: wallet
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  events:
    topic: meridian.wallets.v1
  # wallet:                       # set per environment
  #   ledger-id: <ledger book of wallet accounts>
  #   gl: { fee-income: <id>, tax-payable: <id>, bank-clearing: <id> }
  #   pin: { iterations: 120000, max-attempts: 3, lock-minutes: 30, otp-max-attempts: 3 }
  #   confirmation-minutes: 10
  #   pin-reset-minutes: 10
  #   dormancy-days: 180
  #   risk: { limits-enabled: true, fraud-enabled: true, fail-open: false }

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: wallet-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
