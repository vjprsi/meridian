# search-service (Operations: Batch, Files, Search and Archive). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL, MERIDIAN_SECURITY_MODE=jwt).
server:
  port: 9159
  shutdown: graceful

spring:
  application:
    name: search-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/search_db?currentSchema=search
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: search
    default-schema: search
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: dev          # dev = X-Tenant-Id header; jwt = OAuth2 tokens (all non-local environments)
  # SEC-02: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets).
  required-secrets:
    - meridian.contact-lookup.key
  events:
    topic: meridian.operations.v1
  contact-lookup:
    # Key of the contact lookup hash (customer_contact.lookup_hash): customer-service and search-service MUST share
    # it (MERIDIAN_CONTACT_LOOKUP_KEY, from the vault outside the local stack); the default is for the local stack only.
    key: ${MERIDIAN_CONTACT_LOOKUP_KEY:local-dev-only-contact-lookup-key}
  search:
    indexer:
      enabled: true                     # domain-event indexing feed (DomainEventIndexListener)
      group-id: search-service-indexer
      mappings: classpath:search-mappings.yaml
      metadata-max-age-ms: 60000        # how fast new meridian.<domain>.v1 topics are discovered

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: search-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
