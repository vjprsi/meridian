# routing-service (Payments Hub). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9122
  shutdown: graceful

spring:
  application:
    name: routing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/routing_db?currentSchema=routing
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: routing
    default-schema: routing
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  # SEC-08/18 shared outbound URL policy for tenant-configured provider URLs. These relaxations (plain http,
  # local / private simulators) apply ONLY with security-mode=dev; jwt mode is always https + public addresses.
  outbound:
    allow-http: true
    allow-private-networks: true
  # SEC-02: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets).
  required-secrets:
    - meridian.routing.callback-secret
    - meridian.routing.callback-secrets.*
  events:
    topic: meridian.payments.v1
  routing:
    ledger-id: ${MERIDIAN_ROUTING_LEDGER_ID:}
    # HMAC secret for inbound rail callbacks (X-Rail-Signature); per-rail overrides under callback-secrets.<RAIL_CODE>.
    # Inject from the secret store in every non-local environment.
    callback-secret: ${MERIDIAN_ROUTING_CALLBACK_SECRET:local-dev-rail-callback-secret}
    degraded-threshold: 0.95
    test-timeout-ms: 3000
    gl:
      treasury-funding: ${MERIDIAN_ROUTING_TREASURY_FUNDING:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: routing-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
