# document-service (Platform and Administration). Defaults target the local stack in infra/local; override with env vars in
# other environments (e.g. SPRING_DATASOURCE_URL). Security mode is jwt unless MERIDIAN_SECURITY_MODE=dev.
server:
  port: 9128
  shutdown: graceful

spring:
  application:
    name: document-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/document_db?currentSchema=document
    username: meridian_app
    password: meridian_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: meridian
    password: meridian
    schemas: document
    default-schema: document
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:15180/realms/meridian

meridian:
  security-mode: jwt          # jwt = OAuth2 tokens (default, every environment); dev = X-Tenant-Id headers, only when set
                              # explicitly (tools/dev.py and tests: MERIDIAN_SECURITY_MODE=dev); SEC-13
  # SEC-02: secrets injected from the secret store (Helm secretKeyRef). Outside security-mode=dev the service
  # refuses to start when one is missing, short or a committed development default (RequiredSecrets).
  required-secrets:
    - meridian.esign.callback-secret
    - meridian.documents.s3.secret-key
  events:
    topic: meridian.platform.v1
  documents:
    s3:                        # S3-compatible object store (local: SeaweedFS); path-style SigV4 presigned URLs
      endpoint: http://localhost:19000
      bucket: meridian-documents
      region: us-east-1
      access-key: meridian
      secret-key: meridian-secret
    upload-url-ttl: PT15M
    download-url-ttl: PT5M
    expiry-warning-days: 30
    jobs-enabled: true
    jobs-interval-ms: 300000
    # template publish decisions arrive through libs/meridian-approvals
    # (meridian.approvals.listener-enabled / meridian.approvals.topic, default meridian.platform.v1)
  esign:
    callback-secret: change-me-esign-callback-secret   # HMAC key for X-Esign-Signature on provider callbacks
    default-validity: P30D

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: document-service
  otlp:
    metrics:
      export:
        url: http://localhost:14318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
