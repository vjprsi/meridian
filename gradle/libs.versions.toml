[versions]
spring-boot = "4.1.1"
openapi-generator = "7.14.0"
testcontainers = "2.0.5"
archunit = "1.5.1"
jqwik = "1.10.2"
uuid-creator = "6.1.1"
temporal = "1.40.0"
resilience4j = "2.4.0"
cyclonedx = "3.5.0"
awssdk = "2.57.8"        # GAP-01: AWS KMS client of the card vault
aws-msk-iam-auth = "2.3.9"   # GAP-16: MSK IAM SASL client (inactive unless the Helm chart sets global.kafka.iam)
# GAP-04 SCA overrides above the Spring Boot BOM (drop when Spring Boot ships these or newer)
tomcat = "11.0.27"        # CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (CRITICAL) in 11.0.24
jackson = "3.2.4"         # CVE-2026-89407/89425/68497/91776/91777 (HIGH, DoS) in 3.1.5

[libraries]
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
openapi-generator-gradle-plugin = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }
cyclonedx-gradle-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
aws-msk-iam-auth = { module = "software.amazon.msk:aws-msk-iam-auth", version.ref = "aws-msk-iam-auth" }
