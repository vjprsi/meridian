[versions]
spring-boot = "4.1.1"
openapi-generator = "7.14.0"
testcontainers = "2.0.5"
archunit = "1.5.1"
jqwik = "1.10.1"
uuid-creator = "6.1.1"
temporal = "1.40.0"
resilience4j = "2.4.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
openapi-generator-gradle-plugin = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
