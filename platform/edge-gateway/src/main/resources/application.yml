# Edge gateway: one URL for every Meridian API (http://localhost:18000/v1/...).
server:
  port: 18000
  shutdown: graceful

spring:
  application:
    name: edge-gateway
  threads:
    virtual:
      enabled: true

meridian:
  gateway:
    timeout: 30s
    # services:
    #   ledger-service: http://ledger-service.meridian.svc:8080   # override per environment

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
