# Edge gateway: one URL for every Meridian API (http://localhost:18000/v1/...).
server:
  port: 18000
  shutdown: graceful
  tomcat:
    max-swallow-size: 2MB          # SEC-26: do not drain huge rejected bodies
    max-http-form-post-size: 2MB

spring:
  application:
    name: edge-gateway
  threads:
    virtual:
      enabled: true

meridian:
  # SEC-13: jwt (default) drops internal identity headers (X-Tenant-Id, X-User, X-Roles, X-MFA-Verified,
  # X-Customer-Id, X-On-Behalf-Of-Customer, X-Meridian-Service, ...) from every request. dev (set by tools/dev.py via
  # MERIDIAN_SECURITY_MODE=dev) forwards them, which is how the local stack and tools/e2e authenticate.
  security-mode: jwt
  gateway:
    timeout: 30s
    # SEC-16: load balancers / ingress controllers in front of the gateway (IPs or CIDRs). Only their
    # X-Forwarded-For / -Proto / -Host are believed; the reported client is the right-most untrusted hop.
    trusted-proxies: []
    # SEC-26: request body caps (Content-Length checked up front, chunked bodies counted while streaming).
    max-body-size: 16MB
    service-max-body-size:
      file-gateway-service: 64MB
      document-service: 64MB
      archive-service: 64MB
    # services:
    #   ledger-service: http://ledger-service.meridian.svc:8080   # override per environment

management:
  server:
    port: 18001                       # SEC-31: actuator (metrics) off the routed port; Helm uses 9090. The routed
                                      # port keeps status-only /actuator/health[/readiness|/liveness] (RoutedHealthController)
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # GAP-10: scraped on the management port only, never through the ingress
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      cell: ${meridian.cell.id:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s
