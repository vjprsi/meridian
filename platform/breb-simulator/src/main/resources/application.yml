# Bre-B simulator (sandbox / CI only): in-memory SPBVI + DICE per access node.
server:
  port: ${BREB_SIM_PORT:18190}
spring:
  application:
    name: breb-simulator
breb:
  sim:
    secret: ${BREB_SIM_SECRET:local-dev-breb-secret}
    slow-millis: ${BREB_SIM_SLOW_MILLIS:25000}
management:
  endpoints:
    web:
      exposure:
        include: health
