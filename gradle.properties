org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=24
# JDK 25 for compilation/tests via toolchains; the Gradle daemon itself may run on the system JDK.
org.gradle.java.installations.paths=D:/DevTools/jdk-25
org.gradle.java.installations.auto-download=false
