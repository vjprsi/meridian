    RewardRule:
      type: object
      description: Earn rule - what earns points or cashback, at what rate, with caps, multipliers and time windows
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        rewards_program_id:
          type: string
          format: uuid
          description: Program
        name:
          type: string
          maxLength: 120
          description: Rule name
        trigger:
          type: string
          enum:
          - CARD_SPEND
          - WALLET_PAYMENT
          - BILL_PAYMENT
          - ACCOUNT_OPENING
          - DIRECT_DEPOSIT
          - BALANCE_HELD
          - LOAN_REPAYMENT
          - REFERRAL
          - MANUAL
          description: Event that earns
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          description: Status (changes through activate / deactivate)
          readOnly: true
        priority:
          type: integer
          format: int32
          description: Lower evaluates first
        stackable:
          type: boolean
          description: Can combine with other matching rules; a non-stackable rule that wins on priority is applied alone
        mcc_include:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          description: MCC codes that qualify (empty = any)
        mcc_exclude:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          description: MCC codes excluded (e.g. gambling, quasi-cash)
        merchant_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          description: Merchant / card acceptor ids that qualify (partner offers; empty = any)
        product_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Products that qualify (empty = any)
        channels:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - POS
            - ECOM
            - CONTACTLESS
            - ATM
            - WALLET
            - BILL_PAYMENT
            - TRANSFER
            - BRANCH
            - OTHER
          description: Channels that qualify (empty = any)
        countries:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: ^[A-Z]{2}$
            description: ISO 3166-1 alpha-2
          description: Merchant countries that qualify (empty = any)
        min_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Minimum transaction amount
        points_per_unit:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Points earned per unit of currency spent
        cashback_rate:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Cashback as a fraction of the amount
        fixed_award:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Fixed points or cashback per qualifying event
        multiplier:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Promotional multiplier
        cap_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Maximum award (points or cashback) per customer and cap period
        cap_period:
          type:
          - string
          - 'null'
          enum:
          - TRANSACTION
          - DAY
          - WEEK
          - MONTH
          - QUARTER
          - YEAR
          - LIFETIME
          description: Period the cap applies to
        valid_days_of_week:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: ISO days of week the rule applies (1=Monday..7=Sunday; empty = every day)
        valid_time_from:
          type:
          - string
          - 'null'
          maxLength: 5
          description: Daily window start HH:mm in the rule time zone (empty = all day)
        valid_time_to:
          type:
          - string
          - 'null'
          maxLength: 5
          description: Daily window end HH:mm (exclusive; may wrap past midnight)
        time_zone:
          type: string
          maxLength: 40
          description: IANA time zone of the day and time windows and cap periods
        valid_from:
          type: string
          format: date-time
          description: Effective from
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
          description: Effective to
        settle_after_days:
          type: integer
          format: int32
          description: Days before pending awards confirm (dispute window)
        status_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason of the last deactivation
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
