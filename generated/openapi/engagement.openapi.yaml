components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    Problem:
      description: RFC 9457 problem details
      properties:
        code:
          description: Stable machine-readable error code
          type: string
        detail:
          type: string
        errors:
          items:
            properties:
              code:
                type: string
              field:
                type: string
              message:
                type: string
            type: object
          type: array
        instance:
          type: string
        request_id:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      required:
      - type
      - title
      - status
      - code
      type: object
    RewardsProgramPage:
      type: object
      description: One page of RewardsProgram results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RewardsProgram'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RewardsProgramsActivateRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    RewardsProgramsPauseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    RewardsProgramsEndRequest:
      type: object
      properties:
        ends_on:
          type: string
          format: date
      required:
      - ends_on
    RewardTierPage:
      type: object
      description: One page of RewardTier results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RewardTier'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RewardRulePage:
      type: object
      description: One page of RewardRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RewardRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RewardRulesDeactivateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    RewardRulesSimulateRequest:
      type: object
      properties:
        rewards_program_id:
          type: string
          format: uuid
        transaction:
          type: object
          additionalProperties: true
      required:
      - rewards_program_id
      - transaction
    PointsAccountPage:
      type: object
      description: One page of PointsAccount results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PointsAccount'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PointsLedgerEntryPage:
      type: object
      description: One page of PointsLedgerEntry results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PointsLedgerEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PointsAccountsAdjustRequest:
      type: object
      properties:
        points:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 255
      required:
      - points
      - reason
    PointsAccountsTransferRequest:
      type: object
      properties:
        to_points_account_id:
          type: string
          format: uuid
        points:
          type: integer
