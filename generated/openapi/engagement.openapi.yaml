      type: object
      description: In-app banner or announcement targeted to all customers or segments
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        title:
          type: string
          maxLength: 160
          description: Title
        body:
          type: string
          maxLength: 2000
          description: Body
        placement:
          type: string
          enum:
          - HOME_BANNER
          - LOGIN
          - INBOX
          - MODAL
          description: Where it is shown
        status:
          type: string
          enum:
          - DRAFT
          - SCHEDULED
          - LIVE
          - EXPIRED
          - WITHDRAWN
          description: Status (changes through publish / withdraw and the schedule)
          readOnly: true
        segment_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Target customer segments (empty = everyone)
        apps:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - CUSTOMER_MOBILE
            - CUSTOMER_WEB
            - BUSINESS_PORTAL
            - AGENT_APP
          description: Target apps (empty = all)
        languages:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Translations per language ({"fr": {"title": ..., "body": ...}})'
        image_document_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Image
        deeplink:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Call to action
        priority:
          type: integer
          format: int32
          description: Display priority (lower first)
        dismissible:
          type: boolean
          description: Customer can dismiss
        starts_at:
          type: string
          format: date-time
          description: Start
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
          description: End
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Publication time
          readOnly: true
        published_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that published
          readOnly: true
        withdrawn_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Withdrawal time
          readOnly: true
        status_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason of the withdrawal
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - title
      - body
      - placement
      - status
      - priority
      - dismissible
      - starts_at
