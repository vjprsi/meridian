components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CustomerPage:
      type: object
      description: One page of Customer results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CustomersSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CustomersReactivateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CustomersCloseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CustomersMarkDeceasedRequest:
      type: object
      properties:
        deceased_on:
          type: string
          format: date
        document_id:
          type: string
          format: uuid
      required:
      - deceased_on
      - document_id
    CustomersMergeRequest:
      type: object
      properties:
        duplicate_customer_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 255
      required:
      - duplicate_customer_id
      - reason
    CustomersChangeTierRequest:
      type: object
      properties:
        to_tier:
          type: string
          enum:
          - TIER_0
          - TIER_1
