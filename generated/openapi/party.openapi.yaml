openapi: 3.1.0
info:
  title: Meridian Core — Customer and Onboarding API
  version: 1.0.0
  description: 'Single customer view for individuals and businesses (CIF), relationships and UBOs, tiered KYC, devices and
    credentials, consent and privacy, configurable onboarding journeys, and KYC/KYB checks through pluggable providers.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Customers
  description: A party that holds or applies for products; an individual or a legal entity
- name: Customer Identifiers
  description: Government or registry identifiers of a customer (national id, passport, tax id, company number)
- name: Customer Addresses
  description: Postal addresses of a customer with history
- name: Customer Contacts
  description: Phone numbers, emails and messaging handles of a customer
- name: Customer Relationships
  description: Relationship between two customers (director, UBO, guardian, joint holder, signatory, spouse)
- name: Customer Groups
  description: Household, corporate group or connected-exposure group of customers
- name: Customer Segments
  description: Segment definitions used for pricing, servicing and reporting (e.g. Mass, Affluent, SME)
- name: Customer Segment Assignments
  description: Segment assigned to a customer, with history
- name: Customer Devices
  description: Devices bound to a customer for authentication, push notifications and fraud signals
- name: Customer Credentials
  description: Authentication credentials of a customer (passkeys, PIN, password, TOTP); secrets stored as hashes only
- name: Consents
  description: Consent given or withdrawn by a customer for a purpose and scope (GDPR, LGPD, DPDP, POPIA, open banking)
- name: Privacy Requests
  description: Data subject request (access, export, rectification, erasure) with statutory deadline
- name: Onboarding Journeys
  description: Versioned onboarding journey definition built in the no-code flow builder
- name: Onboarding Applications
  description: One customer's run through an onboarding journey
- name: Onboarding Offline Batches
  description: Batch of applications captured offline by an agent device and synced later
- name: Kyc Providers
  description: Configured external KYC/KYB provider (e.g. Onfido, Jumio, Sumsub, Smile ID, registry APIs)
- name: Kyc Profiles
  description: 'The KYC state of a customer: verification status, risk level and next review date'
- name: Kyc Documents
  description: Identity, address or corporate document captured for KYC/KYB
- name: Kyc Checks
  description: One verification call to a provider (OCR, liveness, face match, database, registry, address)
- name: Kyc Screenings
  description: PEP, sanctions, adverse-media and watchlist screening of a customer at onboarding and on change
- name: Kyc Risk Assessments
  description: Customer risk rating with its factors (country, product, channel, occupation, PEP, behaviour). Append-only.
- name: Kyc Reviews
  description: Periodic or event-driven KYC review (refresh) of a customer
paths:
  /v1/customers:
    get:
      operationId: customersList
      summary: List customers
      tags:
      - Customers
      security:
      - oauth2:
        - party:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
