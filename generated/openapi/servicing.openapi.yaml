openapi: 3.1.0
info:
  title: Meridian Core — Servicing and CRM API
  version: 1.0.0
  description: 'Customer servicing and CRM for the back-office console: service requests and cases, complaints with regulatory
    SLAs and redress, a unified interaction timeline across channels, notes, work queues with SLA policies, a knowledge base,
    and an AI copilot that summarises history and drafts responses with a full audit trail.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Sla Policies
  description: Response and resolution targets per case type, priority or complaint category (incl. regulatory deadlines)
- name: Work Queues
  description: A queue of work items (cases, complaints, reviews) served by a team
- name: Work Items
  description: An item of work in a queue, pointing at a case, complaint or any other business object
- name: Service Cases
  description: A customer service request or issue handled by servicing staff
- name: Complaints
  description: A formal complaint handled under regulatory rules with deadlines, root cause and redress
- name: Complaint Redress
  description: Redress action for a complaint (refund, fee reversal, goodwill); money moves via payments/ledger
- name: Interactions
  description: One contact with a customer on any channel; together these form the customer timeline
- name: Customer Notes
  description: Free-text note about a customer, optionally pinned as an alert in the console
- name: Customer Timeline
  description: Read model of the customer timeline, projected from interactions, cases and domain events. Append-only.
- name: Knowledge Articles
  description: Knowledge-base article for staff and customers; also grounding content for the copilot
- name: Canned Responses
  description: Approved reply template for cases and complaints, with placeholders
- name: Copilot Sessions
  description: One AI copilot invocation by a staff member, with inputs, output, sources and feedback (audit trail)
paths:
  /v1/servicing/sla-policies:
    get:
      operationId: slaPoliciesList
      summary: List sla policies
      tags:
      - Sla Policies
      security:
      - oauth2:
        - servicing:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: applies_to
        in: query
        schema:
          type: string
          maxLength: 20
      - name: case_type
        in: query
        schema:
          type: string
          enum:
          - SERVICE_REQUEST
          - INQUIRY
          - CARD_ISSUE
          - PAYMENT_ISSUE
          - ACCOUNT_MAINTENANCE
          - DOCUMENT_REQUEST
          - FRAUD_REPORT
          - TECHNICAL_ISSUE
          - LOAN_SERVICING
          - KYC_UPDATE
          - CLOSURE_REQUEST
          - OTHER
      - name: complaint_category
        in: query
        schema:
          type: string
          enum:
          - FEES_AND_CHARGES
          - SERVICE_QUALITY
          - FRAUD_AND_SCAMS
          - PAYMENTS
          - CARDS
          - LENDING
          - ACCOUNT_OPENING
          - ACCOUNT_CLOSURE
          - DATA_PRIVACY
          - DISCRIMINATION
          - MIS_SELLING
          - COLLECTIONS_CONDUCT
          - DIGITAL_CHANNELS
          - OTHER
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - URGENT
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaPolicyPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - SRV-01
      x-service: crm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("servicing:read")'
      x-table: sla_policy
      x-crud: true
      x-crud-list: true
    post:
      operationId: slaPoliciesCreate
      summary: Create sla policie
      tags:
      - Sla Policies
      security:
      - oauth2:
        - servicing:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaPolicy'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaPolicyCreate'
      x-requirements:
      - SRV-01
      x-service: crm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("servicing:write")'
      x-table: sla_policy
      x-crud: true
