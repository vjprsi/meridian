          maxLength: 64
        name:
          type: string
          maxLength: 160
      required:
      - code
      - name
    ProductsSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    ProductsRetireRequest:
      type: object
      properties:
        retire_date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 255
      required:
      - retire_date
    ProductsQuoteRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        term_months:
          type: integer
          format: int32
        channel:
          type: string
          enum:
          - MOBILE
          - WEB
          - BRANCH
          - AGENT
          - USSD
          - API
          - CALL_CENTER
          - PARTNER
