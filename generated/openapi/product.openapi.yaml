components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    ProductTemplatePage:
      type: object
      description: One page of ProductTemplate results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductTemplate'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ProductPage:
      type: object
      description: One page of Product results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ProductsFromTemplateRequest:
      type: object
      properties:
        template_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        legal_entity_id:
          type: string
          format: uuid
      required:
      - template_id
      - code
      - name
      - currency
      - legal_entity_id
    ProductVersionPage:
      type: object
      description: One page of ProductVersion results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductVersion'
        next_cursor:
          type:
