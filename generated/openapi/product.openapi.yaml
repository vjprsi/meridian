openapi: 3.1.0
info:
  title: Meridian Core — Product Studio and Pricing API
  version: 1.0.0
  description: 'Versioned, configuration-driven product catalogue for every product family (deposits, wallets, cards, loans,
    lines, BNPL, overdrafts), with interest, fees, tax, limits, eligibility, bundles, sandboxed WASM scripts and simulation;
    plus a DMN-compatible pricing and decision engine.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Product Templates
  description: Starter template for a product family with default parameters and allowed overrides
- name: Products
  description: A sellable product (catalogue entry); its behaviour lives in versions
- name: Product Versions
  description: Immutable-once-published definition of a product; existing accounts stay on their version
- name: Product Parameters
  description: Typed parameter of a product version (key/value with validation)
- name: Interest Rate Configs
  description: Interest configuration of a product version (credit, debit, overdraft, penalty, APRs)
- name: Interest Rate Tiers
  description: Balance tier or band of a tiered/banded/stepped rate
- name: Rate Indexes
  description: Benchmark rate index (SOFR, EURIBOR 3M, central-bank policy rate, internal base rate)
- name: Fee Definitions
  description: A fee charged by a product version (event-based or periodic)
- name: Fee Tiers
  description: Tier of a tiered fee (by amount, count or balance)
- name: Fee Waiver Rules
  description: Condition under which a fee is waived or discounted
- name: Tax Rules
  description: Tax applied to interest or fees in a jurisdiction (WHT, VAT, GST, stamp duty)
- name: Product Limit Templates
  description: Default limit a product imposes (applied to accounts; overridable per customer by risk)
- name: Eligibility Rules
  description: Who may buy the product (age, residency, KYC tier, score, existing products)
- name: Product Bundles
  description: Package of products sold together with shared pricing (e.g. account + card + overdraft)
- name: Product Bundle Items
  description: Product included in a bundle, with bundle-specific overrides
- name: Product Scripts
  description: Sandboxed WASM module implementing custom product behaviour at a lifecycle hook
- name: Product Simulations
  description: Simulation of a product version against a synthetic customer over a time horizon
- name: Promotional Rates
  description: Time-limited promotional interest rate or fee discount on a product
- name: Relationship Pricing Rules
  description: Pricing adjustment based on the customer's total relationship (balances, products, segment)
- name: Product Availability
  description: Where and to whom a product is available (channel, country, branch, partner)
- name: Product Disclosures
  description: Customer-facing legal document of a product version (T&Cs, key facts, fee schedule)
- name: Decision Tables
  description: A named decision (pricing, eligibility, fee, limit, routing) with versions
- name: Decision Table Versions
  description: Versioned content of a decision table (inputs, outputs, rules) in DMN form
- name: Rule Evaluations
  description: Every decision evaluation with inputs, matched rules and outputs (explainability). Append-only.
- name: Price Quotes
  description: Price quote given to a customer (rate, fees, APR) valid until expiry
