openapi: 3.1.0
info:
  title: Meridian Core — Lending and Collections API
  version: 1.0.0
  description: 'Loan origination with bureau, scoring and explainable decisions; loan servicing for instalment loans, revolving
    credit lines, BNPL and nano-loans; collateral management; and collections and recovery.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Loan Applications
  description: An application for a loan, credit line, BNPL plan or nano-loan
- name: Loan Applicants
  description: A person or business on an application (primary, co-applicant, guarantor)
- name: Loan Financial Items
  description: Declared or verified income and expense lines used in affordability
- name: Loan Application Documents
  description: Documents requested and supplied for an application
- name: Bureau Reports
  description: A credit bureau pull for an applicant
- name: Scorecards
  description: A credit scorecard / model family (application, behavioural, collections, wallet)
- name: Scorecard Versions
  description: 'A versioned points-based scorecard with cut-offs; champion/challenger supported. Each feature has ordered
    bins ({min, max} numeric ranges or {values} categories) with points and an adverse reason code.

    '
- name: Credit Scores
  description: A score produced for an application with explainable reason codes. Append-only.
- name: Affordability Assessments
  description: Affordability calculation (income, commitments, stressed instalment). Append-only.
- name: Credit Decisions
  description: The credit decision for an application. Append-only; a new decision supersedes the last.
- name: Credit Decision Requests
  description: A manual decision or override proposed by an underwriter (maker) awaiting a second approver (checker)
- name: Loan Offers
  description: A priced offer made to the applicant
- name: E Signature Requests
  description: E-signature envelope for the loan agreement
- name: Loans
  description: A booked loan (instalment, BNPL, nano, merchant financing, mortgage, SME term)
- name: Loan Eod Runs
  description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
- name: Loan Disbursements
  description: A disbursement (single or tranche) of loan funds
- name: Schedule Installments
  description: One instalment of a repayment schedule with paid and due components
- name: Allocation Rules
  description: Repayment allocation waterfall configuration per product and loan state
- name: Loan Repayments
  description: A repayment received, with its allocation across components and instalments. Append-only.
- name: Loan Accruals
  description: Daily interest and penalty accrual per loan. Append-only.
- name: Loan Fee Charges
  description: A fee charged to a loan
- name: Loan Restructures
  description: Restructuring request (reschedule, refinance, payment holiday) with maker-checker
- name: Loan Prepayment Quotes
  description: A pay-off / partial prepayment quote valid until a time
- name: Loan Write Offs
  description: Write-off of a loan balance with approval and ledger posting
- name: Loan Recoveries
  description: Recovery received after write-off. Append-only.
- name: Credit Lines
  description: A revolving credit facility (credit line, credit card account, working capital, BNPL limit)
- name: Credit Line Drawdowns
  description: A draw on a credit line (purchase, cash advance, transfer, instalment conversion)
- name: Credit Line Statements
  description: Monthly statement of a credit line
- name: Bnpl Plans
  description: A buy-now-pay-later plan for a merchant purchase (pay-in-N or financed instalments)
- name: Collaterals
  description: A pledged asset or guarantee securing one or more exposures
- name: Collateral Eod Runs
  description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
- name: Collateral Valuations
  description: Valuation history of a collateral item. Append-only.
- name: Collateral Links
  description: Allocation of collateral to an exposure (loan or credit line) with LTV
- name: Collateral Insurances
  description: Insurance policy covering a collateral item
- name: Collection Strategies
  description: A collection strategy for a segment and DPD range
- name: Collection Strategy Steps
  description: An action of a strategy triggered at a DPD or after an event
- name: Collection Queues
  description: A work queue for collectors
- name: Collection Cases
  description: A collections case for one delinquent exposure
- name: Collections Eod Runs
  description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
- name: Collection Actions
  description: A contact or action taken on a case. Append-only.
- name: Promises To Pay
  description: A customer's promise to pay an amount by a date
- name: Payment Plans
  description: An arrangement to clear arrears in instalments
- name: Next Best Actions
  description: Suggested next action for a case (channel, time, offer) from a deterministic scoring model with reason codes
- name: Legal Proceedings
  description: Legal action on a collections case
paths:
  /v1/loan-applications:
    get:
      operationId: loanApplicationsList
      summary: List loan applications
      tags:
      - Loan Applications
      security:
      - oauth2:
        - lending:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_REVIEW
          - BUREAU_PENDING
          - SCORED
          - REFERRED
          - APPROVED
          - COUNTER_OFFERED
          - DECLINED
          - OFFER_ACCEPTED
          - SIGNED
          - BOOKED
          - DISBURSED
          - WITHDRAWN
          - EXPIRED
          - CANCELLED
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - MOBILE
          - WEB
          - BRANCH
          - AGENT
          - API
          - USSD
          - MERCHANT_POS
      - name: loan_type
        in: query
        schema:
          type: string
          enum:
          - INSTALMENT
          - BNPL
          - NANO
          - MERCHANT_FINANCING
          - MORTGAGE
          - VEHICLE
          - OVERDRAFT_TERM
          - SME_TERM
      - name: merchant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: assigned_to
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - LND-01
      - LND-06
      - LND-07
      x-service: loan-origination-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:read")'
      x-required-scope: lending:read
      x-table: loan_application
      x-crud: true
      x-crud-list: true
    post:
      operationId: loanApplicationsCreate
      summary: Create loan application
      tags:
      - Loan Applications
      security:
      - oauth2:
        - lending:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationCreate'
      x-requirements:
      - LND-01
      - LND-06
      - LND-07
      x-service: loan-origination-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:write")'
      x-required-scope: lending:write
      x-table: loan_application
      x-crud: true
      x-crud-create: true
  /v1/loan-applications/{id}:
