      x-required-scope: channels:customer
      x-table: customer_action
  /v1/me/notification-preferences:
    get:
      operationId: myNotificationPreferencesList
      summary: The customer's notification preferences
      tags:
      - My Notification Preferences
      security:
      - oauth2:
        - channels:customer
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
