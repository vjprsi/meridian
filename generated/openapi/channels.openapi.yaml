          description: Debited wallet
        payee_wallet_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Credited wallet
        payee_msisdn:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{6,14}$
          description: Payee mobile number as entered (E.164)
        payee_name:
