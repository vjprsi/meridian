        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyContactsVerifyRequest'
      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
