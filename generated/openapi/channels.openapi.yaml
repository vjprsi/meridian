          - P2P
          - CASH_IN
          - CASH_OUT
          - MERCHANT_PAYMENT
          - BILL_PAYMENT
          - AIRTIME
          - G2P
          - BULK_DISBURSEMENT
          - WALLET_TO_BANK
          - BANK_TO_WALLET
          - FLOAT_TRANSFER
          - COMMISSION_PAYOUT
          - INTEROP_OUT
          - INTEROP_IN
          - REFUND
          - REVERSAL
          - FEE
          - ADJUSTMENT
          - LOAN_DISBURSEMENT
          - LOAN_REPAYMENT
          description: Transaction type
        status:
          type: string
          enum:
          - INITIATED
          - PENDING_CONFIRMATION
          - PENDING_APPROVAL
          - PROCESSING
          - COMPLETED
          - FAILED
          - REVERSED
          - EXPIRED
          - CANCELLED
          description: Lifecycle status
          readOnly: true
        channel:
          type: string
          enum:
          - USSD
          - SMS
          - APP
          - WEB
          - API
          - AGENT_APP
          - POS
          - QR
          - BULK
          - SYSTEM
          description: Initiating channel
        payer_wallet_id:
          type:
          - string
          - 'null'
