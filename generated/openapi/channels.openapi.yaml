openapi: 3.1.0
info:
  title: Meridian Core — Customer, Agent and Business Channels API
  version: 1.0.0
  description: 'Experience APIs for the bank''s own apps. Customer apps (web banking, mobile) use /v1/me: every operation
    acts for the signed-in customer only: the customer comes from the access token (customer_id claim, scope channels:customer),
    never from a path, query or body. The service calls the domain services with its own service identity and the customer''s
    tenant, checks that every referenced account, card, loan, wallet, payment, payee, standing order, thread, notification
    and document belongs to the customer (an object of someone else answers 404), rebuilds request bodies server-side and
    requires a recent authentication (step-up) for money movement and security changes. Agent outlet apps use /v1/agent the
    same way (agent_id claim, scope channels:agent; see agent-channel-service), and the business banking portal uses /v1/business
    (business_customer_id and business_user_id claims, scope channels:business; see business-channel-service). Domain services
    keep their operator APIs; customer, agent and business tokens carry no domain scope and are rejected there.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: My Profile
  description: The signed-in customer's own customer record
- name: My Contacts
  description: The customer's phone numbers and e-mail addresses, with OTP verification
- name: My Addresses
  description: The customer's postal addresses (read-only; changes need proof of address)
- name: My Devices
  description: Devices bound to the customer's digital banking
- name: My Notification Preferences
  description: Notification channels the customer opted in to or out of
- name: My Accounts
  description: Deposit accounts the customer owns or holds (joint holder, signatory with view rights)
- name: My Standing Orders
  description: Standing orders on the customer's accounts
- name: My Payees
  description: The customer's saved beneficiaries
- name: My Payments
  description: Payments initiated by or for the customer
- name: My Cards
  description: The customer's cards, their channel blocks and spend limits
- name: My Loans
  description: The customer's loans
- name: My Wallets
  description: The customer's mobile money wallets
- name: My Insights
  description: Spending analytics and insight cards for the customer
- name: My Budgets
  description: The customer's budgets
- name: My Rewards
  description: The customer's points and cashback
- name: My Threads
  description: Secure messaging between the customer and the bank (staff-only notes never shown)
- name: My Announcements
  description: Announcements targeted at the customer
- name: My Notifications
  description: In-app notifications sent to the customer
- name: My Kyc
  description: The customer's KYC status and identity documents
- name: My Documents
  description: Files the customer uploads (owner = the customer)
- name: My Activity
  description: The customer's own channel activity (security log)
- name: Agent Me
  description: The signed-in agent, its outlets, floats, wallets, KPIs, sub-agents and channel activity
- name: Agent Me Devices
  description: The agent's devices and their signing keys (device binding)
- name: Agent Me Float Requests
  description: Float top-up and rebalance requests of the agent
- name: Agent Me Cash Requests
  description: Cash-in-transit delivery and pickup requests for the agent's outlets
- name: Agent Me Tills
  description: Tills at the agent's outlets, opened and closed per shift with cash counts
- name: Agent Me Customers
  description: Customer wallet lookup for cash-in / cash-out (masked data only; rate-limited and logged)
- name: Agent Me Transactions
  description: Wallet transactions the agent took part in (cash-in, cash-out, float, bills and airtime from its float wallet)
    and receipts
- name: Agent Me Cash In
  description: Cash-in from the agent's float wallet to a customer wallet
- name: Agent Me Cash Out
  description: Cash-out at the agent (funds held on the customer wallet until the customer confirms)
- name: Agent Me Billers
  description: Biller catalogue for bill payments and airtime (reference data)
- name: Agent Me Bill Payments
  description: Bill payments paid from the agent's float wallet for walk-in customers
- name: Agent Me Airtime
  description: Airtime and bundle top-ups paid from the agent's float wallet
- name: Agent Me Commissions
  description: Commissions earned by the agent
- name: Agent Me Journeys
  description: Onboarding journeys the agent may run (published, agent channel)
- name: Agent Me Applications
  description: Assisted onboarding of prospects by the agent (onboarding-service; channel AGENT)
- name: Agent Me Offline Batches
  description: Onboarding applications captured offline on a registered device, signed with its key
- name: Business Me
  description: The signed-in business user
- name: Business Users
  description: Users of the business, their roles, daily limits and account entitlements (changes by ADMIN users only)
- name: Business Approval Rules
  description: The business's approval matrix (amount bands per currency)
- name: Business Accounts
  description: Accounts of the business the user may see (ADMIN users see all of them)
- name: Business Cash Position
  description: Cash position across the business's accounts
- name: Business Payees
  description: Beneficiaries of the business
- name: Business Payments
  description: Payments with multi-level approvals per the business's approval matrix
- name: Business Approval Queue
  description: Payments waiting for the signed-in user's approval
- name: Business Bulk Payments
  description: Bulk payments and payroll uploaded as CSV, validated and approved like single payments
- name: Business Fx Quotes
  description: FX quotes priced for the business (bound to one international payment when used)
- name: Business Fx Deals
  description: FX deals booked for the business's released international payments
- name: Business Mandates
  description: Direct-debit mandates under which the business collects as creditor
- name: Business Virtual Accounts
  description: Virtual accounts routing collections to the business's accounts
- name: Business Payment Links
  description: Payment links collecting into the business's accounts
- name: Business Cards
  description: Expense cards for employees, linked to the business's accounts (issued and controlled by ADMIN users)
- name: Business Card Products
  description: Card products expense cards can be issued on
- name: Business Loans
  description: Business loans
- name: Business Credit Lines
  description: Credit lines (working capital, overdraft facilities) of the business
- name: Business Api Clients
  description: API clients and keys of the business (ADMIN users only)
- name: Business Webhooks
  description: Webhook endpoints of the business; subscriptions only ever deliver the business's own events
- name: Business Activity
  description: The business's portal activity (security log)
paths:
  /v1/me/profile:
    get:
      operationId: myProfileGet
      summary: The signed-in customer's profile
      tags:
      - My Profile
      security:
      - oauth2:
        - channels:customer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
    patch:
      operationId: myProfileUpdate
      summary: Change the customer's own preferences (allow-listed fields only; name and identity changes go through KYC)
      tags:
      - My Profile
      security:
      - oauth2:
        - channels:customer
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyProfileUpdateRequest'
      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
  /v1/me/contacts:
    get:
      operationId: myContactsList
      summary: The customer's contact points
      tags:
      - My Contacts
      security:
      - oauth2:
        - channels:customer
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContactPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
    post:
      operationId: myContactsCreate
      summary: Add a contact point (step-up; unverified until the OTP is confirmed)
      tags:
