      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
  /v1/me/contacts/{contact_id}/send-verification:
    post:
      operationId: myContactsSendVerification
      summary: Send a verification code to one of the customer's contact points
      tags:
      - My Contacts
      security:
