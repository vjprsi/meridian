components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    MyProfileUpdateRequest:
      type: object
      properties:
        preferred_language:
          type: string
          maxLength: 10
      required:
      - preferred_language
    CustomerContactPage:
      type: object
      description: One page of CustomerContact results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerContact'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    MyContactsCreateRequest:
      type: object
      properties:
        contact_type:
          type: string
          enum:
          - MOBILE
          - LANDLINE
          - EMAIL
          - WHATSAPP
          - FAX
        phone:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: E.164
        email:
          type: string
          format: email
          maxLength: 320
        label:
          type: string
          maxLength: 40
      required:
      - contact_type
    MyContactsVerifyRequest:
