        in: query
        schema:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
      - name: funding_model
        in: query
        schema:
          type: string
          enum:
          - DEBIT
          - PREPAID
          - CREDIT
          - JIT
      - name: program_type
        in: query
        schema:
          type: string
          enum:
          - CONSUMER
          - BUSINESS
          - CORPORATE
          - EXPENSE
          - GIFT
          - PAYROLL
          - GOVERNMENT
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - CERTIFICATION
          - ACTIVE
          - SUSPENDED
          - RETIRED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardProgram'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                required:
                - data
                - has_more
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-01
      x-service: card-service
    post:
      operationId: cardProgramsCreate
      summary: Create card program
      tags:
      - Card Programs
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgram'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardProgramCreate'
      x-requirements:
