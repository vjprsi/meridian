openapi: 3.1.0
info:
  title: 'Meridian Core — Operations: Batch, Files, Search and Archive API'
  version: 1.0.0
  description: 'Business-day processing and EOD/EOM/EOY batch orchestration, secure file exchange with partners, enterprise
    search across all entities, and data retention, archival, legal hold and certified purge.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Business Days
  description: Current and historical business date per legal entity with its processing state
- name: Eod Job Definitions
  description: 'A step in an end-of-period job graph, executed by an owning service. Cross-service EOD contract: for every
    tenant, EOD run, job and partition the orchestrator calls <http_method> <owning_service><http_path> with headers X-Tenant-Id
    (the tenant whose EOD runs) and Idempotency-Key = "eod:<eod_run_id>:<job code>:<partition_no>" (identical for every retry
    of the partition, so a lost response is executed once downstream). Placeholders {business_date}, {legal_entity_id}, {cycle_type},
    {eod_run_id}, {eod_job_run_id}, {job_code}, {partition_no}, {partition_count} and {attempt} are substituted (URL-encoded)
    in http_path and in the string values of body_template. Without body_template the body is the job context (eod_run_id,
    eod_job_run_id, job_code, job_type, cycle_type, legal_entity_id, business_date, is_month_end, is_quarter_end, is_year_end,
    partition_no, partition_count, partition_key, attempt, parameters, checkpoint). Example: deposit-service POST /v1/deposit-accounts/eod/accrue?business_date={business_date}.
    The job answers 2xx with optional records_processed, records_failed and checkpoint; 408, 409, 429 and 5xx are retried
    per the failure policy, other 4xx fail the job.

    '
- name: Eod Runs
  description: Execution of a full end-of-period cycle for one legal entity and business date
- name: Eod Job Runs
  description: Execution of one job (or partition) inside an EOD run
- name: Date Rolls
  description: Record of moving a legal entity from one business date to the next. Append-only.
- name: Job Schedules
  description: Cron schedule for non-EOD batch jobs (sweeps, report generation, file pulls, reindexing)
- name: Batch Job Locks
  description: Distributed lock preventing concurrent execution of the same batch job or partition
- name: File Channels
  description: A configured endpoint for exchanging files with a counterparty
- name: File Formats
  description: Layout of a file type (record types, fields, positions, validation) used to parse or generate files
- name: File Routes
  description: Routing rule sending matching inbound files to a consumer service
- name: Inbound Files
  description: A file received from a counterparty
- name: Outbound Files
  description: A file generated for and delivered to a counterparty
- name: File Transfer Logs
  description: Immutable audit of every action on a file or channel
- name: Files
  description: Object-store access through pre-signed links
- name: Search
  description: Federated search across entity types with masking by caller permissions
- name: Search Indexes
  description: Definition of a searchable index for one entity type
- name: Search Index Jobs
  description: A reindex, incremental catch-up or alias swap job
- name: Search Synonyms
  description: Synonym set applied to search analysers (e.g. abbreviations, transliterations)
- name: Saved Searches
  description: A saved search query of a staff user, optionally shared with a role
- name: Data Classifications
  description: Catalogue entry classifying a table (or column set) by sensitivity and data class
- name: Retention Policies
  description: How long a data class is kept per jurisdiction and what happens after
- name: Archive Jobs
  description: A run moving aged records from a service database to the archive store
- name: Archived Objects
  description: Manifest of an archived batch in immutable (WORM) object storage. Append-only.
- name: Legal Holds
  description: A legal or regulatory hold that suspends archival purge and deletion for its scope
- name: Purge Requests
  description: Request to permanently delete or anonymise data that reached end of retention
