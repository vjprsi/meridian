components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    Problem:
      description: RFC 9457 problem details
      properties:
        code:
          description: Stable machine-readable error code
          type: string
        detail:
          type: string
        errors:
          items:
            properties:
              code:
                type: string
              field:
                type: string
              message:
                type: string
            type: object
          type: array
        instance:
          type: string
        request_id:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      required:
      - type
      - title
      - status
      - code
      type: object
    LedgerPage:
      type: object
      description: One page of Ledger results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ledger'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LedgersLockRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    LedgersEodRequest:
      type: object
      properties:
        business_date:
          type: string
          format: date
      required:
      - business_date
    LedgerAccountPage:
      type: object
      description: One page of LedgerAccount results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccount'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BalanceSnapshotPage:
      type: object
      description: One page of BalanceSnapshot results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalanceSnapshot'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LedgerEntryPage:
      type: object
      description: One page of LedgerEntry results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LedgerAccountsFreezeRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - FROZEN_DEBIT
          - FROZEN_CREDIT
          - FROZEN
          - CLOSED
        reason:
          type: string
          maxLength: 255
      required:
