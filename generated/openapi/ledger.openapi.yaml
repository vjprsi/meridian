        schema:
          type: string
          enum:
          - ACTIVE
          - LOCKED
          - ARCHIVED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: base_currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - GL-05
      - LED-01
      x-service: ledger-service
      x-table: ledger
      x-crud: true
      x-crud-list: true
    post:
      operationId: ledgersCreate
      summary: Create ledger
      tags:
      - Ledgers
      security:
      - oauth2:
        - ledger:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
