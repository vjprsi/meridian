      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: account_type
        in: query
        schema:
          type: string
          enum:
          - CURRENT
          - SAVINGS
          - CALL
          - NOTICE
          - MONEY_MARKET
          - ESCROW
          - BASIC
          - STUDENT
          - MINOR
          - PAYROLL
          - NOSTRO
          - VOSTRO
          - SUSPENSE
          - SETTLEMENT
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - PENDING_FUNDING
          - ACTIVE
          - DORMANT
          - INACTIVE
          - FROZEN
          - BLOCKED_DEBIT
          - BLOCKED_CREDIT
          - BLOCKED
          - CLOSING
          - CLOSED
          - REJECTED
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: account_number
        in: query
        schema:
          type: string
          maxLength: 34
      - name: iban
        in: query
        schema:
          type: string
          maxLength: 34
      - name: external_ref
        in: query
        schema:
          type: string
          maxLength: 128
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositAccountPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CIF-02
      - DEP-01
      - DEP-04
      - PRD-01
      x-service: deposit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-required-scope: accounts:read
      x-table: deposit_account
      x-crud: true
      x-crud-list: true
    post:
      operationId: depositAccountsCreate
      summary: Create deposit account
      tags:
      - Deposit Accounts
      security:
      - oauth2:
        - accounts:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositAccount'
        '400': *id001
