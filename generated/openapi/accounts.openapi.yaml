openapi: 3.1.0
info:
  title: Meridian Core — Deposits and Accounts API
  version: 1.0.0
  description: 'Deposit account servicing on top of the ledger: current, savings, call and notice accounts, term deposits,
    savings pots, sweeps, standing orders, overdrafts, holders and mandates, blocks, dormancy, closure, cheques, virtual accounts,
    daily interest accrual and capitalisation, fee charging, statements and tax certificates.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Deposit Accounts
  description: A customer or internal deposit account (current, savings, call, notice, escrow, settlement)
- name: Deposit Eod Runs
  description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
- name: Account Holders
  description: Customer linked to an account in a role (joint holder, minor, guardian, signatory, POA)
- name: Account Mandates
  description: Signing mandate for an account (who must approve which operations above which amount)
- name: Account Status History
  description: Every status change of an account with reason and actor. Append-only.
- name: Account Blocks
  description: Restriction on an account (legal order, garnishment, AML, fraud, deceased, lien)
- name: Overdraft Facilities
  description: Overdraft facility on an account (arranged, temporary, salary advance)
- name: Account Rate Overrides
  description: Negotiated or relationship rate on a single account overriding the product rate
- name: Interest Accruals
  description: Daily interest accrual per account and rate kind. Append-only.
- name: Interest Capitalisations
  description: Posting of accrued interest to the account (and tax withheld). Append-only.
- name: Fee Charges
  description: A fee charged (or refunded) on an account. Append-only; refunds are new rows.
- name: Term Deposits
  description: Fixed-term deposit (placement, maturity, rollover, premature withdrawal)
- name: Savings Pots
  description: Savings goal inside an account (ring-fenced balance as a ledger sub-account)
- name: Savings Pot Rules
  description: Automatic saving rule feeding a pot (round-ups, % of income, fixed schedule)
- name: Sweep Rules
  description: Automatic sweep between accounts (target balance, thresholds, zero-balance, concentration)
- name: Standing Orders
  description: Recurring or future-dated payment instruction from an account
- name: Dormancy Events
  description: Dormancy lifecycle events (warnings, dormant, reactivated, escheated to the state). Append-only.
- name: Account Closures
  description: Request to close an account, settle interest/fees and transfer the remaining balance
- name: Cheque Books
  description: Cheque book issued on an account
- name: Cheques
  description: Individual cheque leaf (issued, presented, cleared, returned, stopped)
- name: Virtual Accounts
  description: Virtual account number routing incoming funds to a master account / sub-ledger
- name: Statements
  description: Account statement for a period
- name: Statement Schedules
  description: Statement delivery preferences per account
- name: Tax Certificates
  description: Interest / withholding tax certificate or annual summary for a customer
paths:
  /v1/deposit-accounts:
    get:
      operationId: depositAccountsList
      summary: List deposit accounts
      tags:
      - Deposit Accounts
      security:
      - oauth2:
        - accounts:read
