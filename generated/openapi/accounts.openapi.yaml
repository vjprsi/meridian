              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    DepositAccountPage:
      type: object
      description: One page of DepositAccount results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DepositAccount'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    DepositAccountsApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    DepositAccountsFreezeRequest:
