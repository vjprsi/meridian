components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    Problem:
      description: RFC 9457 problem details
      properties:
        code:
          description: Stable machine-readable error code
          type: string
        detail:
          type: string
        errors:
          items:
            properties:
              code:
                type: string
              field:
                type: string
              message:
                type: string
            type: object
          type: array
        instance:
          type: string
        request_id:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      required:
      - type
      - title
      - status
      - code
      type: object
    TppsRegisterRequest:
      type: object
      properties:
        software_statement:
          type: string
      required:
      - software_statement
    TppsSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    ObConsentsAuthoriseRequest:
      type: object
      properties:
        sca_approach:
          type: string
          maxLength: 16
        redirect_uri:
          type: string
          maxLength: 500
        state:
          type: string
          maxLength: 255
        code_challenge:
          type: string
          maxLength: 128
      required:
      - sca_approach
    ObConsentsRevokeRequest:
      type: object
      properties:
        revoked_by:
          type: string
          maxLength: 16
      required:
      - revoked_by
    ObAuthorisationsSelectAccountsRequest:
      type: object
      properties:
        account_ids:
          type: object
          additionalProperties: true
      required:
      - account_ids
    ObAuthorisationsDenyRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    ObPaymentInitiationsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    ObAccessLog:
      type: object
      description: Every TPP API call under a consent, for audit, regulatory reporting and customer dashboards. Append-only.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        tpp_id:
          type: string
          format: uuid
          description: TPP
        ob_consent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Consent
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer
        endpoint:
          type: string
          maxLength: 255
          description: Standard endpoint called
        http_method:
          type: string
          maxLength: 8
          description: HTTP method
        http_status:
          type: integer
          format: int32
          description: Response status
        psu_present:
          type: boolean
          description: Customer present (PSU-IP-Address supplied)
        psu_ip_address:
          type:
          - string
          - 'null'
          description: Customer IP when present (IPv4 or IPv6 address)
        interaction_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: x-fapi-interaction-id
        latency_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: Response time
        records_returned:
          type:
          - integer
          - 'null'
          format: int32
          description: Records returned
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
