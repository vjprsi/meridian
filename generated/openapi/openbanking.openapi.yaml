openapi: 3.1.0
info:
  title: Meridian Core — Open Banking API
  version: 1.0.0
  description: 'Regulated third-party access (ASPSP side). Registers and certifies TPPs, manages AIS / PIS / CBPII / VRP consents
    and their SCA authorisation, logs every data access, and exposes standard profiles (UK OBIE, Berlin Group NextGenPSD2,
    Brazil Open Finance, FDX, CDR) mapped onto Meridian core APIs.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Ob Standard Profiles
  description: An open banking standard enabled for the tenant, with version and endpoints
- name: Tpps
  description: Registered third-party provider (AISP, PISP, CBPII)
- name: Tpp Certificates
  description: Certificate presented by a TPP (eIDAS QWAC/QSEAL or directory cert)
- name: Ob Consents
  description: Customer consent given to a TPP for account information, payment initiation or funds confirmation
- name: Ob Authorisations
  description: SCA authorisation session for a consent (redirect, decoupled or embedded)
- name: Ob Payment Initiations
  description: Payment initiated by a PISP under a consent; links to the core payment
- name: Ob Funds Confirmations
  description: Confirmation of funds check by a CBPII. Append-only.
- name: Ob Access Logs
  description: Every TPP API call under a consent, for audit, regulatory reporting and customer dashboards. Append-only.
paths:
  /v1/open-banking/profiles:
    get:
      operationId: obStandardProfilesList
      summary: List ob standard profiles
      tags:
      - Ob Standard Profiles
      security:
      - oauth2:
        - openbanking:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: standard
        in: query
        schema:
          type: string
          enum:
          - UK_OBIE
          - BERLIN_GROUP
          - BRAZIL_OPEN_FINANCE
          - FDX
          - CDR_AU
          - SAUDI_OB
          - CUSTOM
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObStandardProfile'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                required:
                - data
                - has_more
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - OBK-01
      x-service: openbanking-service
    post:
      operationId: obStandardProfilesCreate
      summary: Create ob standard profile
      tags:
      - Ob Standard Profiles
      security:
      - oauth2:
        - openbanking:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObStandardProfile'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObStandardProfileCreate'
      x-requirements:
      - OBK-01
      x-service: openbanking-service
  /v1/open-banking/profiles/{id}:
    get:
      operationId: obStandardProfilesGet
      summary: Retrieve ob standard profile
      tags:
      - Ob Standard Profiles
      security:
      - oauth2:
        - openbanking:read
      parameters:
      - &id005
