components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    AlmBehaviouralAssumptionPage:
      type: object
      description: One page of AlmBehaviouralAssumption results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlmBehaviouralAssumption'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AlmBehaviouralAssumptionsApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    AlmGapRunPage:
      type: object
      description: One page of AlmGapRun results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlmGapRun'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AlmGapBucketPage:
      type: object
      description: One page of AlmGapBucket results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlmGapBucket'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AlmSensitivityRunPage:
      type: object
      description: One page of AlmSensitivityRun results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlmSensitivityRun'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AlmSensitivityRunsStandardShocksRequest:
      type: object
      properties:
        legal_entity_id:
          type: string
          format: uuid
        as_of_date:
          type: string
          format: date
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
      required:
      - legal_entity_id
      - as_of_date
      - currency
    FtpCurvePage:
      type: object
      description: One page of FtpCurve results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FtpCurve'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FtpCurvePointPage:
      type: object
      description: One page of FtpCurvePoint results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FtpCurvePoint'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FtpCurvesPublishRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    FtpRulePage:
      type: object
      description: One page of FtpRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FtpRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FtpAssignmentPage:
      type: object
      description: One page of FtpAssignment results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FtpAssignment'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FtpAssignmentsRunRequest:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
      required:
      - period_start
      - period_end
    AlmBehaviouralAssumption:
      type: object
      description: Behavioural assumption (prepayment, deposit decay, non-maturity repricing) by product
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        assumption_type:
          type: string
          enum:
          - PREPAYMENT
          - DEPOSIT_DECAY
          - NON_MATURITY_REPRICING
          - EARLY_WITHDRAWAL
          - DRAWDOWN
          description: Assumption type
        product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Product (empty = all products of the segment)
        segment:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Customer / product segment
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        parameters:
