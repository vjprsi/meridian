openapi: 3.1.0
info:
  title: Meridian Core — alm-service
  version: 1.0.0
  description: 'Front-to-back treasury: money market, FX and securities deals with confirmations and settlement, counterparty
    limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and asset-liability management (repricing
    gap, NII/EVE sensitivity) with funds transfer pricing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Alm Behavioural Assumptions
  description: Behavioural assumption (prepayment, deposit decay, non-maturity repricing) by product
- name: Alm Gap Runs
  description: Repricing gap report run at an as-of date
- name: Alm Sensitivity Runs
  description: NII / EVE / EaR sensitivity simulation under a rate shock
- name: Ftp Curves
  description: Funds transfer pricing curve per currency, type and effective date
- name: Ftp Curve Points
  description: Tenor point on an FTP curve
- name: Ftp Rules
  description: Rule assigning an FTP method and curves to products / segments
- name: Ftp Assignments
  description: FTP rate and margin assigned to an account or loan for a period
paths:
  /v1/treasury/alm/assumptions:
    get:
      operationId: almBehaviouralAssumptionsList
      summary: List alm behavioural assumptions
      tags:
      - Alm Behavioural Assumptions
      security:
      - oauth2:
        - treasury:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: assumption_type
        in: query
        schema:
          type: string
          enum:
          - PREPAYMENT
          - DEPOSIT_DECAY
          - NON_MATURITY_REPRICING
          - EARLY_WITHDRAWAL
          - DRAWDOWN
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: segment
        in: query
        schema:
          type: string
          maxLength: 64
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlmBehaviouralAssumptionPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - TRY-04
      - TRY-05
      x-service: alm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("treasury:read")'
      x-table: alm_behavioural_assumption
      x-crud: true
      x-crud-list: true
    post:
      operationId: almBehaviouralAssumptionsCreate
      summary: Create alm behavioural assumption
      tags:
      - Alm Behavioural Assumptions
      security:
      - oauth2:
        - treasury:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlmBehaviouralAssumption'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlmBehaviouralAssumptionCreate'
      x-requirements:
      - TRY-04
      - TRY-05
      x-service: alm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("treasury:write")'
      x-table: alm_behavioural_assumption
      x-crud: true
      x-crud-create: true
