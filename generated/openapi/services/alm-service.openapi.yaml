info:
  description: 'Front-to-back treasury: money market, FX and securities deals with confirmations and settlement, counterparty
    limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and asset-liability management (repricing
    gap, NII/EVE sensitivity) with funds transfer pricing.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — alm-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/treasury/alm/assumptions:
    get:
      operationId: almBehaviouralAssumptionsList
      summary: List alm behavioural assumptions
      tags:
      - Alm Behavioural Assumptions
      security:
      - oauth2:
        - treasury:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: assumption_type
        in: query
        schema:
          type: string
          enum:
          - PREPAYMENT
          - DEPOSIT_DECAY
          - NON_MATURITY_REPRICING
          - EARLY_WITHDRAWAL
          - DRAWDOWN
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: segment
        in: query
        schema:
          type: string
          maxLength: 64
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
