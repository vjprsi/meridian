        reason:
          type: string
          maxLength: 255
      required:
      - reason
    LegalProceedingPage:
      type: object
      description: One page of LegalProceeding results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalProceeding'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollectionAction:
      type: object
      description: A contact or action taken on a case. Append-only.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        collection_case_id:
          type: string
          format: uuid
          description: Case
        action_type:
          type: string
          enum:
          - SMS
          - PUSH
          - EMAIL
          - WHATSAPP
          - CALL
          - FIELD_VISIT
          - LETTER
          - LEGAL_NOTICE
          - AUTO_DEBIT_RETRY
          - SKIP_TRACE
          description: Action
        collection_strategy_step_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Step that triggered it (empty if manual)
        performed_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Collector or SYSTEM
        outcome:
          type: string
          enum:
          - SENT
          - DELIVERED
          - FAILED
          - NO_ANSWER
          - RIGHT_PARTY_CONTACT
          - WRONG_PARTY
          - PROMISE_MADE
          - REFUSED
          - PAID
          - DISPUTED
          description: Outcome
        contact_channel_address:
          type:
          - string
          - 'null'
          maxLength: 320
          description: Phone / email used
        notes:
          type:
          - string
          - 'null'
          description: Notes
        recording_document_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Call recording / letter copy
        notification_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Notification sent
        performed_at:
          type: string
          format: date-time
          description: Time
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - collection_case_id
      - action_type
      - outcome
      - performed_at
    CollectionCase:
      type: object
      description: A collections case for one delinquent exposure
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        case_number:
          type: string
          maxLength: 32
          description: Case number
          readOnly: true
        customer_id:
          type: string
          format: uuid
          description: Customer
        exposure_type:
          type: string
          enum:
          - LOAN
          - CREDIT_LINE
          - CARD
          - OVERDRAFT
          - BNPL
          description: Exposure type
        exposure_id:
          type: string
          format: uuid
          description: Loan, credit line, card account or overdraft id
        collection_strategy_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Strategy in force
        collection_queue_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Queue
        assigned_to:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Collector
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - PROMISE_ACTIVE
          - PLAN_ACTIVE
          - LEGAL
          - RESOLVED
          - CLOSED
          - WRITTEN_OFF
          description: Status
        days_past_due:
          type: integer
          format: int32
          description: Current DPD
          readOnly: true
        delinquency_bucket:
          type: string
          enum:
          - CURRENT
          - DPD_1_29
          - DPD_30_59
          - DPD_60_89
          - DPD_90_119
          - DPD_120_179
          - DPD_180_PLUS
          description: Bucket
          readOnly: true
        overdue_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Overdue amount
          readOnly: true
        total_outstanding:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Total outstanding
          readOnly: true
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        priority_score:
          type:
          - integer
          - 'null'
          format: int32
          description: AI / rules priority for working the queue
          readOnly: true
        last_contact_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last contact attempt
          readOnly: true
        next_action_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Next scheduled action
        is_disputed:
          type: boolean
          description: Customer disputes the debt
        is_vulnerable:
          type: boolean
          description: Vulnerable-customer flag (adjusted treatment)
        agency_name:
          type:
          - string
          - 'null'
          maxLength: 120
          description: External agency if outsourced
        opened_at:
          type: string
          format: date-time
          description: Opening time
          readOnly: true
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Resolution time
          readOnly: true
        resolution:
          type:
          - string
          - 'null'
          maxLength: 40
          description: CURED, PAID_OFF, RESTRUCTURED, SETTLED, WRITTEN_OFF, SOLD
          readOnly: true
        custom_field_1:
