components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    CollectionAction:
      description: A contact or action taken on a case. Append-only.
      properties:
        action_type:
          description: Action
          enum:
          - SMS
          - PUSH
          - EMAIL
          - WHATSAPP
          - CALL
          - FIELD_VISIT
          - LETTER
          - LEGAL_NOTICE
          - AUTO_DEBIT_RETRY
          - SKIP_TRACE
          type: string
        collection_case_id:
          description: Case
          format: uuid
          type: string
        collection_strategy_step_id:
          description: Step that triggered it (empty if manual)
          format: uuid
          type:
          - string
          - 'null'
        contact_channel_address:
          description: Phone / email used
          maxLength: 320
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        notes:
          description: Notes
          type:
          - string
          - 'null'
        notification_id:
          description: Notification sent
          format: uuid
          type:
          - string
          - 'null'
        outcome:
          description: Outcome
          enum:
          - SENT
          - DELIVERED
          - FAILED
          - NO_ANSWER
          - RIGHT_PARTY_CONTACT
          - WRONG_PARTY
          - PROMISE_MADE
          - REFUSED
          - PAID
          - DISPUTED
          type: string
        performed_at:
          description: Time
          format: date-time
          type: string
        performed_by:
          description: Collector or SYSTEM
          maxLength: 64
          type:
          - string
          - 'null'
        recording_document_id:
          description: Call recording / letter copy
          format: uuid
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - collection_case_id
      - action_type
      - outcome
      - performed_at
      type: object
    CollectionActionPage:
      description: One page of CollectionAction results (newest first)
      properties:
        data:
