openapi: 3.1.0
info:
  title: Meridian Core — collections-service
  version: 1.0.0
  description: 'Loan origination with bureau, scoring and explainable decisions; loan servicing for instalment loans, revolving
    credit lines, BNPL and nano-loans; collateral management; and collections and recovery.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Collection Strategies
  description: A collection strategy for a segment and DPD range
- name: Collection Strategy Steps
  description: An action of a strategy triggered at a DPD or after an event
- name: Collection Queues
  description: A work queue for collectors
- name: Collection Cases
  description: A collections case for one delinquent exposure
- name: Collection Actions
  description: A contact or action taken on a case. Append-only.
- name: Promises To Pay
  description: A customer's promise to pay an amount by a date
- name: Payment Plans
  description: An arrangement to clear arrears in instalments
- name: Next Best Actions
  description: AI-suggested next action for a case (channel, time, offer) with explanation
- name: Legal Proceedings
  description: Legal action on a collections case
paths:
  /v1/collections/strategies:
    get:
      operationId: collectionStrategiesList
      summary: List collection strategies
      tags:
      - Collection Strategies
      security:
      - oauth2:
        - lending:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: exposure_type
        in: query
