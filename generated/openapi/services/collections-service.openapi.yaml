            $ref: '#/components/schemas/PaymentPlan'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PaymentPlansCancelRequest:
      type: object
