components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CollectionStrategyPage:
      type: object
      description: One page of CollectionStrategy results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionStrategy'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollectionStrategyStepPage:
      type: object
      description: One page of CollectionStrategyStep results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionStrategyStep'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollectionQueuePage:
      type: object
      description: One page of CollectionQueue results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionQueue'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollectionCasePage:
      type: object
      description: One page of CollectionCase results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionCase'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollectionCasesAssignRequest:
      type: object
      properties:
        assigned_to:
          type: string
          maxLength: 64
        collection_queue_id:
          type: string
          format: uuid
    CollectionCasesLogActionRequest:
      type: object
      properties:
        action_type:
          type: string
          enum:
          - SMS
          - PUSH
          - EMAIL
          - WHATSAPP
          - CALL
          - FIELD_VISIT
          - LETTER
          - LEGAL_NOTICE
          - AUTO_DEBIT_RETRY
          - SKIP_TRACE
        outcome:
          type: string
          enum:
          - SENT
          - DELIVERED
          - FAILED
          - NO_ANSWER
          - RIGHT_PARTY_CONTACT
          - WRONG_PARTY
          - PROMISE_MADE
          - REFUSED
          - PAID
          - DISPUTED
        notes:
          type: string
      required:
      - action_type
      - outcome
    CollectionCasesPromiseRequest:
      type: object
      properties:
        promised_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        promised_date:
          type: string
          format: date
        channel:
          type: string
          maxLength: 32
      required:
      - promised_amount
      - promised_date
    CollectionCasesPaymentPlanRequest:
      type: object
      properties:
        installment_count:
          type: integer
          format: int32
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - FORTNIGHTLY
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUAL
          - ANNUAL
          - AT_MATURITY
        start_date:
          type: string
          format: date
        interest_frozen:
          type: boolean
      required:
      - installment_count
      - frequency
      - start_date
    CollectionCasesSendToAgencyRequest:
      type: object
      properties:
        agency_name:
          type: string
          maxLength: 120
      required:
      - agency_name
    CollectionCasesStartLegalRequest:
      type: object
      properties:
        claim_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - claim_amount
    CollectionCasesMarkDisputeRequest:
      type: object
      properties:
        is_disputed:
          type: boolean
        notes:
          type: string
      required:
      - is_disputed
    CollectionCasesCloseRequest:
      type: object
      properties:
        resolution:
          type: string
          maxLength: 40
      required:
      - resolution
    CollectionActionPage:
      type: object
      description: One page of CollectionAction results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionAction'
        next_cursor:
