openapi: 3.1.0
info:
  title: Meridian Core — card-tokenization-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Card Tokens
  description: A network token (DPAN) linked to a card
paths:
  /v1/card-tokens:
    get:
      operationId: cardTokensList
      summary: List card tokens
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: card_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: token_requestor
        in: query
        schema:
          type: string
          enum:
          - APPLE_PAY
          - GOOGLE_PAY
          - SAMSUNG_PAY
          - MERCHANT_COF
          - CLICK_TO_PAY
          - OTHER
      - name: status
        in: query
        schema:
          type: string
          enum:
          - REQUESTED
          - PENDING_VERIFICATION
          - ACTIVE
          - SUSPENDED
          - DEACTIVATED
          - DECLINED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTokenPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_token
      x-crud: true
      x-crud-list: true
  /v1/card-tokens/{id}:
    get:
      operationId: cardTokensGet
      summary: Retrieve card token
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_token
      x-crud: true
      x-crud-get: true
  /v1/card-tokens/push-provision:
    post:
      operationId: cardTokensPushProvision
      summary: 'Push-provision a card to a wallet from the issuer app (cardholder already authenticated: GREEN unless the
        card is not active)'
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensPushProvisionRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_token
  /v1/card-tokens/network/provision-requests:
    post:
      operationId: cardTokensNetworkProvisionRequests
      summary: 'Token service (VTS / MDES) provisioning request: the card is resolved by PAN through the vault and the issuer
        decides GREEN (activate), YELLOW (OTP step-up) or RED (decline); HMAC-SHA256 over the raw body in X-Signature'
      tags:
      - Card Tokens
      security: []
      parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensNetworkProvisionRequestsRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-public: true
      description: 'Public endpoint for an external provider callback: no bearer token; the service verifies the provider
        signature and resolves the tenant from the referenced entity.'
      x-table: card_token
  /v1/card-tokens/network/events:
    post:
      operationId: cardTokensNetworkEvents
      summary: Token lifecycle notification from the token service (activated, suspended, resumed, deactivated, PAN updated);
        HMAC-SHA256 over the raw body in X-Signature
      tags:
      - Card Tokens
      security: []
      parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensNetworkEventsRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-public: true
      description: 'Public endpoint for an external provider callback: no bearer token; the service verifies the provider
        signature and resolves the tenant from the referenced entity.'
      x-table: card_token
  /v1/card-tokens/card-status-sync:
    post:
      operationId: cardTokensCardStatusSync
      summary: Apply a card status change to every token of the card (FROZEN suspends, ACTIVE resumes, BLOCKED / LOST / STOLEN
        / CLOSED / EXPIRED deactivate); returns {card_id, updated}
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensCardStatusSyncRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_token
  /v1/card-tokens/{id}/suspend:
    post:
      operationId: cardTokensSuspend
      summary: Suspend a token
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensSuspendRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_token
  /v1/card-tokens/{id}/resume:
    post:
      operationId: cardTokensResume
      summary: Resume a suspended token
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_token
  /v1/card-tokens/{id}/deactivate:
    post:
      operationId: cardTokensDeactivate
      summary: Permanently deactivate a token
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensDeactivateRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_token
  /v1/card-tokens/{id}/verify-step-up:
    post:
      operationId: cardTokensVerifyStepUp
      summary: Verify OTP / step-up for a yellow-path provisioning
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokensVerifyStepUpRequest'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_token
  /v1/card-tokens/{id}/events:
    get:
      operationId: cardTokensEvents
      summary: Token lifecycle events
      tags:
      - Card Tokens
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTokenEventPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-05
      x-service: card-tokenization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_token
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CardTokenPage:
      type: object
      description: One page of CardToken results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardToken'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardTokensPushProvisionRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        token_requestor:
          type: string
          enum:
          - APPLE_PAY
          - GOOGLE_PAY
          - SAMSUNG_PAY
          - MERCHANT_COF
          - CLICK_TO_PAY
          - OTHER
        token_requestor_id:
          type: string
          maxLength: 16
        device_info:
          type: object
          additionalProperties: true
      required:
      - card_id
      - token_requestor
      - device_info
    CardTokensNetworkProvisionRequestsRequest:
      type: object
      properties:
        pan:
          type: string
          maxLength: 19
        expiry_month:
          type: integer
          format: int32
        expiry_year:
          type: integer
          format: int32
        token_requestor:
          type: string
          enum:
          - APPLE_PAY
          - GOOGLE_PAY
          - SAMSUNG_PAY
          - MERCHANT_COF
          - CLICK_TO_PAY
          - OTHER
        token_requestor_id:
          type: string
          maxLength: 16
        network_token_ref:
          type: string
          maxLength: 64
        dpan_last4:
          type: string
          maxLength: 4
        device_type:
          type: string
          maxLength: 32
        device_name:
          type: string
          maxLength: 120
        device_id_hash:
          type: string
          maxLength: 64
        wallet_account_score:
          type: integer
          format: int32
        device_score:
          type: integer
          format: int32
        merchant_name:
          type: string
          maxLength: 120
      required:
      - pan
      - expiry_month
      - expiry_year
      - token_requestor
      - network_token_ref
    CardTokensNetworkEventsRequest:
      type: object
      properties:
        network_token_ref:
          type: string
          maxLength: 64
        event_type:
          type: string
          enum:
          - PROVISIONING_REQUESTED
          - PROVISIONING_APPROVED
          - PROVISIONING_DECLINED
          - STEP_UP_SENT
          - STEP_UP_VERIFIED
          - STEP_UP_FAILED
          - ACTIVATED
          - SUSPENDED
          - RESUMED
          - DEACTIVATED
          - PAN_UPDATED
        reason:
          type: string
          maxLength: 255
      required:
      - network_token_ref
      - event_type
    CardTokensCardStatusSyncRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        card_status:
          type: string
          enum:
          - CREATED
          - ACTIVE
          - FROZEN
          - BLOCKED
          - LOST
          - STOLEN
          - EXPIRED
          - CLOSED
          - REPLACED
      required:
      - card_id
      - card_status
    CardTokensSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    CardTokensDeactivateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    CardTokensVerifyStepUpRequest:
      type: object
      properties:
        otp:
          type: string
          maxLength: 10
      required:
      - otp
    CardTokenEventPage:
      type: object
      description: One page of CardTokenEvent results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardTokenEvent'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardToken:
      type: object
      description: A network token (DPAN) linked to a card
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        card_id:
          type: string
          format: uuid
          description: Card
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Cardholder (from the card)
          readOnly: true
        token_requestor:
          type: string
          enum:
          - APPLE_PAY
          - GOOGLE_PAY
          - SAMSUNG_PAY
          - MERCHANT_COF
          - CLICK_TO_PAY
          - OTHER
          description: Wallet or token requestor
        token_requestor_id:
          type:
          - string
          - 'null'
          maxLength: 16
          description: Scheme token requestor id
        network_token_ref:
          type: string
          maxLength: 64
          description: Scheme token reference (TUR / token id)
          readOnly: true
        dpan_last4:
          type:
          - string
          - 'null'
          maxLength: 4
          description: Last four of the device PAN
          readOnly: true
        dpan_expiry_month:
          type:
          - integer
          - 'null'
          format: int32
          description: Token expiry month
          readOnly: true
        dpan_expiry_year:
          type:
          - integer
          - 'null'
          format: int32
          description: Token expiry year
          readOnly: true
        status:
          type: string
          enum:
          - REQUESTED
          - PENDING_VERIFICATION
          - ACTIVE
          - SUSPENDED
          - DEACTIVATED
          - DECLINED
          description: Status
          readOnly: true
        status_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason for the current status
          readOnly: true
        device_type:
          type:
          - string
          - 'null'
          maxLength: 32
          description: PHONE, WATCH, TABLET, BROWSER
        device_name:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Device name
        device_id_hash:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Hash of the device id
        wallet_account_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Wallet provider risk score 1-5 (5 = most trusted)
        device_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Device risk score 1-5 (5 = most trusted)
        provisioning_decision:
          type:
          - string
          - 'null'
          enum:
          - GREEN
          - YELLOW
          - RED
          description: GREEN, YELLOW or RED
          readOnly: true
        step_up_method:
          type:
          - string
          - 'null'
          maxLength: 32
          description: OTP_SMS, OTP_EMAIL, APP, CALL_CENTER
          readOnly: true
        step_up_attempts:
          type: integer
          format: int32
          description: Failed step-up attempts
          readOnly: true
        merchant_name:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Merchant for card-on-file tokens
        activated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Activation time
          readOnly: true
        suspended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last suspension time
          readOnly: true
        deactivated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Deactivation time
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
