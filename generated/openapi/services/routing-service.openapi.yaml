info:
  description: 'ISO 20022-native payments hub. Initiates, screens, approves, routes, submits and settles payments on every
    rail (instant, batch, RTGS, mobile money, cross-border); manages payees, aliases, bulk files, direct-debit mandates, request-to-pay,
    payment links and QR codes; runs rail routing, settlement, liquidity and FX.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — routing-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/payment-rails:
    get:
      operationId: paymentRailsList
      summary: List payment rails
      tags:
      - Payment Rails
      security:
      - oauth2:
        - payments:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: rail_type
        in: query
        schema:
          type: string
          enum:
          - INSTANT
          - BATCH
          - RTGS
          - MOBILE_MONEY
          - CROSS_BORDER
          - CARD_PUSH
          - INTERNAL
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - DEGRADED
          - SUSPENDED
          - RETIRED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRailPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - PAY-02
      - PAY-05
      x-service: routing-service
      x-table: payment_rail
      x-crud: true
      x-crud-list: true
    post:
      operationId: paymentRailsCreate
      summary: Create payment rail
      tags:
      - Payment Rails
      security:
      - oauth2:
        - payments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
