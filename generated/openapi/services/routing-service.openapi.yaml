          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        institution_bic:
          description: Institution BIC
          maxLength: 11
          type:
          - string
          - 'null'
        institution_name:
          description: Holding institution
          maxLength: 140
          type: string
        is_active:
          description: Active
          type: boolean
        ledger_account_id:
          description: Mirror ledger account
          format: uuid
          type: string
        min_balance:
          description: Minimum balance before alerting
          examples:
          - '125.50'
          format: decimal
          type: string
        name:
          description: Account name
          maxLength: 120
          type: string
        payment_rail_id:
