          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRail'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
