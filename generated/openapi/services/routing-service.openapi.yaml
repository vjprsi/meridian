openapi: 3.1.0
info:
  title: Meridian Core — routing-service
  version: 1.0.0
  description: 'ISO 20022-native payments hub. Initiates, screens, approves, routes, submits and settles payments on every
    rail (instant, batch, RTGS, mobile money, cross-border); manages payees, aliases, bulk files, direct-debit mandates, request-to-pay,
    payment links and QR codes; runs rail routing, settlement, liquidity and FX.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Payment Rails
  description: A payment rail / scheme the platform can send to or receive from
- name: Rail Adapters
  description: Technical connection to a rail (direct participant, sponsor bank, aggregator API)
- name: Rail Cutoffs
  description: Cut-off times per rail, payment type and currency
- name: Routing Rules
  description: Rule choosing a rail and adapter for a payment
- name: Rail Messages
  description: Raw message exchanged with a rail (pacs, pain, camt, ISO 8583, NACHA). Append-only, for audit and replay.
- name: Rail Settlement Batches
  description: Settlement cycle / batch on a rail (net positions, files submitted)
- name: Nostro Accounts
  description: Nostro / vostro / settlement / prefunding account held at a correspondent, central bank or partner
- name: Liquidity Positions
  description: Intraday liquidity position per nostro / rail, refreshed from statements and flows
- name: Rail Participants
  description: Bank / PSP directory entry (BIC, clearing codes, rail reachability)
paths:
  /v1/payment-rails:
    get:
      operationId: paymentRailsList
      summary: List payment rails
      tags:
      - Payment Rails
      security:
      - oauth2:
        - payments:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: rail_type
        in: query
        schema:
          type: string
          enum:
          - INSTANT
          - BATCH
          - RTGS
          - MOBILE_MONEY
          - CROSS_BORDER
          - CARD_PUSH
          - INTERNAL
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - DEGRADED
          - SUSPENDED
          - RETIRED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRailPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - PAY-02
      - PAY-05
      x-service: routing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:read")'
      x-required-scope: payments:read
      x-table: payment_rail
      x-crud: true
      x-crud-list: true
    post:
      operationId: paymentRailsCreate
      summary: Create payment rail
      tags:
      - Payment Rails
      security:
      - oauth2:
        - payments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRail'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRailCreate'
      x-requirements:
      - PAY-02
      - PAY-05
      x-service: routing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:write")'
      x-required-scope: payments:write
      x-table: payment_rail
      x-crud: true
      x-crud-create: true
