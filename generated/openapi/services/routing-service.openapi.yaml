components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    PaymentRailPage:
      type: object
      description: One page of PaymentRail results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRail'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PaymentRailsSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    PaymentRailsResumeRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    PaymentRailsMetricsRequest:
      type: object
      properties:
        success_rate_7d:
          type: string
          format: decimal
          examples:
          - '125.50'
        p95_latency_ms:
          type: integer
          format: int32
      required:
      - success_rate_7d
      - p95_latency_ms
    RailCutoffPage:
      type: object
      description: One page of RailCutoff results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RailCutoff'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PaymentRailsInboundRequest:
      type: object
      properties:
        message_type:
          type: string
          maxLength: 32
        payload:
          type: string
      required:
      - message_type
      - payload
    RailAdapterPage:
      type: object
      description: One page of RailAdapter results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RailAdapter'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RailAdaptersRotateCredentialsRequest:
      type: object
      properties:
        credentials_ref:
          type: string
          maxLength: 255
        reason:
          type: string
          maxLength: 255
      required:
      - credentials_ref
    PaymentRoutingRulePage:
      type: object
      description: One page of PaymentRoutingRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRoutingRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RoutingRulesSimulateRequest:
      type: object
      properties:
        payment:
          type: object
          additionalProperties: true
      required:
      - payment
    RoutingRulesRouteRequest:
      type: object
      properties:
        payment:
          type: object
          additionalProperties: true
      required:
      - payment
    RailMessagePage:
      type: object
      description: One page of RailMessage results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RailMessage'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RailMessagesPacs008Request:
      type: object
      properties:
        payment_rail_id:
          type: string
          format: uuid
        payment:
          type: object
          additionalProperties: true
      required:
      - payment_rail_id
      - payment
    RailMessagesReplayRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
