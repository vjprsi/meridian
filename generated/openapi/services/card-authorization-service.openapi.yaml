components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    CardAuthorization:
      description: One authorisation message and its decision (auth, incremental, reversal, advice)
      properties:
        acquirer_id:
          description: Acquiring institution id (DE32)
          maxLength: 16
          type:
          - string
          - 'null'
        approved_amount:
          description: Approved amount (partial approvals)
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type:
          - string
          - 'null'
        auth_code:
          description: Approval code (DE38)
          maxLength: 6
          readOnly: true
          type:
          - string
          - 'null'
        avs_result:
          description: Address verification result
          maxLength: 1
          type:
          - string
          - 'null'
        billing_amount:
          description: Amount in card billing currency (DE6)
          examples:
          - '125.50'
          format: decimal
          type: string
        billing_currency:
          description: Billing currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        card_id:
          description: Card
          format: uuid
          type: string
        card_present:
          description: Card present
          type: boolean
        card_program_id:
          description: Program
          format: uuid
          type: string
        card_token_id:
          description: Network token used, if any
          format: uuid
          type:
          - string
          - 'null'
        cardholder_present:
          description: Cardholder present
          type: boolean
        channel:
          description: Channel
          enum:
          - ECOM
          - POS
          - ATM
          - CONTACTLESS
          - MOTO
          - RECURRING
          - ANY
          type: string
        cleared_amount:
          description: Amount cleared so far
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        conversion_rate:
          description: Billing conversion rate
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Cardholder
          format: uuid
          type:
          - string
          - 'null'
        cvv_result:
          description: CVV2 verification result
          maxLength: 1
          type:
          - string
          - 'null'
        decision:
          description: Decision
          enum:
          - APPROVED
          - DECLINED
          - PARTIAL
          readOnly: true
          type:
          - string
          - 'null'
        decline_reason:
          description: Internal decline reason
          enum:
          - INSUFFICIENT_FUNDS
          - CARD_INACTIVE
          - CARD_FROZEN
          - CARD_EXPIRED
          - INVALID_PIN
          - PIN_TRIES_EXCEEDED
          - CONTROL_MCC
          - CONTROL_MERCHANT
          - CONTROL_COUNTRY
          - CONTROL_CHANNEL
          - LIMIT_EXCEEDED
          - VELOCITY_EXCEEDED
          - FRAUD_SUSPECTED
          - JIT_DECLINED
          - JIT_TIMEOUT
          - INVALID_CVV
          - INVALID_EXPIRY
          - THREEDS_FAILED
          - SYSTEM_ERROR
          - OTHER
          readOnly: true
          type:
          - string
          - 'null'
        eci:
          description: Electronic commerce indicator
          maxLength: 2
          type:
          - string
          - 'null'
        expires_at:
          description: Time the hold auto-releases
          format: date-time
          type:
          - string
          - 'null'
        fraud_alert_id:
          description: Fraud alert raised
          format: uuid
          type:
          - string
          - 'null'
        fraud_score:
          description: Fraud score 0-1000
          format: int32
          readOnly: true
          type:
          - integer
          - 'null'
        fx_markup:
          description: Issuer FX markup
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        hold_id:
