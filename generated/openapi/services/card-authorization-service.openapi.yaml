        mti:
          description: ISO 8583 message type indicator
          maxLength: 4
          type: string
        network_transaction_id:
          description: Scheme transaction id (trace id / banknet ref)
          maxLength: 64
          type:
          - string
          - 'null'
        parent_authorization_id:
          description: Original auth for incremental, reversal or advice
          format: uuid
          type:
          - string
          - 'null'
        pin_verified:
          description: PIN verification outcome
          type:
          - boolean
          - 'null'
        pos_entry_mode:
          description: POS entry mode
          enum:
          - CHIP
          - CONTACTLESS
          - MAGSTRIPE
          - MANUAL
          - ECOMMERCE
          - CREDENTIAL_ON_FILE
          - TOKEN
          - FALLBACK
          - UNKNOWN
          type: string
        processing_code:
          description: ISO 8583 DE3
          maxLength: 6
          type:
          - string
          - 'null'
        processing_time_ms:
          description: End-to-end decision time inside Meridian
          format: int32
          readOnly: true
          type:
          - integer
          - 'null'
        raw_message:
          additionalProperties: true
          description: Parsed ISO 8583 fields (sensitive fields removed)
          type:
          - object
          - 'null'
        response_code:
          description: ISO response code (DE39)
          maxLength: 3
          readOnly: true
          type:
          - string
          - 'null'
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        rrn:
          description: Retrieval reference number (DE37)
          maxLength: 12
          type:
          - string
          - 'null'
        settlement_amount:
          description: Settlement amount (DE5)
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        settlement_currency:
          description: Settlement currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type:
          - string
          - 'null'
        stan:
          description: System trace audit number (DE11)
          maxLength: 12
          type:
          - string
          - 'null'
        stand_in:
          description: Decided in stand-in
          readOnly: true
          type: boolean
        status:
          description: Lifecycle status
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - REVERSED
          - PARTIALLY_REVERSED
          - EXPIRED
          - CLEARED
          - PARTIALLY_CLEARED
