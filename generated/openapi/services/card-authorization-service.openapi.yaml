components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CardAuthorizationPage:
      type: object
      description: One page of CardAuthorization results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardAuthorization'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardAuthorizationsSimulateRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        mcc:
          type: string
          maxLength: 4
        merchant_id:
          type: string
          maxLength: 32
        merchant_name:
          type: string
          maxLength: 64
        merchant_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        channel:
          type: string
          enum:
          - ECOM
          - POS
          - ATM
          - CONTACTLESS
          - MOTO
          - RECURRING
          - ANY
        pos_entry_mode:
          type: string
          enum:
          - CHIP
          - CONTACTLESS
          - MAGSTRIPE
          - MANUAL
          - ECOMMERCE
          - CREDENTIAL_ON_FILE
          - TOKEN
          - FALLBACK
          - UNKNOWN
        partial_approval_capable:
          type: boolean
      required:
      - card_id
      - amount
      - currency
    CardAuthorizationsSimulateReversalRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
    CardAuthorizationsSimulateIncrementalRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - amount
    CardAuthorizationsSimulateClearingRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - amount
    CardAuthorizationsClearRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        clearing_record_id:
          type: string
          format: uuid
        final:
          type: boolean
      required:
      - amount
    CardAuthorizationsExpireRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    CardJitFundingRequestPage:
      type: object
      description: One page of CardJitFundingRequest results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardJitFundingRequest'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardStandInRecordPage:
