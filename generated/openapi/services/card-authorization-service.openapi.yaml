          type: string
        terminal_id:
          description: Terminal id (DE41)
          maxLength: 16
          type:
          - string
          - 'null'
        threeds_authentication_id:
          description: 3DS authentication
          format: uuid
          type:
          - string
          - 'null'
        transaction_amount:
          description: Amount in transaction currency (DE4)
          examples:
          - '125.50'
          format: decimal
          type: string
        transaction_currency:
          description: Transaction currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - card_id
      - card_program_id
      - message_type
      - mti
      - pos_entry_mode
      - channel
      - card_present
