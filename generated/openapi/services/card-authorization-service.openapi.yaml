openapi: 3.1.0
info:
  title: Meridian Core — card-authorization-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Card Authorizations
  description: Live authorisations arrive from the ISO 8583 gateway as create (0100/0200 auth, incremental, 0400 reversal,
    0120 advice with parent_authorization_id); responses carry the ISO response code. Sandbox simulation endpoints run the
    same decision path.
- name: Card Stand In Records
  description: Authorisation approved in stand-in, awaiting replay against the ledger
- name: Card Authorization Rules
  description: Program or tenant level authorisation rule (beyond card controls), e.g. velocity or risky MCC step-up
paths:
  /v1/card-authorizations:
    get:
      operationId: cardAuthorizationsList
      summary: List card authorizations
      tags:
      - Card Authorizations
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: card_id
        in: query
        schema:
          type: string
          format: uuid
      - name: card_program_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - REVERSED
          - PARTIALLY_REVERSED
          - EXPIRED
          - CLEARED
          - PARTIALLY_CLEARED
      - name: decision
        in: query
        schema:
          type: string
          enum:
          - APPROVED
          - DECLINED
          - PARTIAL
      - name: message_type
        in: query
        schema:
          type: string
          enum:
          - AUTHORIZATION
          - FINANCIAL
          - INCREMENTAL
          - REVERSAL
          - PARTIAL_REVERSAL
          - ADVICE
          - BALANCE_INQUIRY
          - ACCOUNT_VERIFICATION
          - REFUND_AUTH
      - name: mcc
        in: query
        schema:
          type: string
          maxLength: 4
      - name: merchant_id
        in: query
        schema:
          type: string
          maxLength: 32
      - name: rrn
        in: query
        schema:
          type: string
          maxLength: 12
      - name: network_transaction_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: auth_code
        in: query
        schema:
          type: string
          maxLength: 6
      - name: parent_authorization_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-03
      - CRD-09
      - FRM-01
      - LED-04
      x-service: card-authorization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_authorization
      x-crud: true
      x-crud-list: true
    post:
      operationId: cardAuthorizationsCreate
      summary: Create card authorization
      tags:
      - Card Authorizations
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorization'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAuthorizationCreate'
      x-requirements:
      - CRD-03
      - CRD-09
      - FRM-01
      - LED-04
      x-service: card-authorization-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_authorization
      x-crud: true
      x-crud-create: true
