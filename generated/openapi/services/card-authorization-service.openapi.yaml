    CardAuthorizationRule:
      type: object
      description: Program or tenant level authorisation rule (beyond card controls), e.g. velocity or risky MCC step-up
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        card_program_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Program (empty = all programs)
        name:
          type: string
          maxLength: 120
          description: Rule name
        priority:
          type: integer
          format: int32
          description: Lower evaluates first
        condition_expression:
          type: string
          description: 'Expression over the authorisation context (CEL subset: == != < <= > >= in [..] && || ! and parentheses
            over amount, currency, mcc, merchant_id, merchant_country, channel, pos_entry_mode, is_international, card_present,
            hour, fraud_score), e.g. mcc in [''7995''] && amount > 500'
        action:
          type: string
          enum:
          - APPROVE
          - DECLINE
          - REVIEW
          - STEP_UP
          description: Action when the condition is true
        decline_reason:
          type:
          - string
          - 'null'
          enum:
          - INSUFFICIENT_FUNDS
          - CARD_INACTIVE
          - CARD_FROZEN
          - CARD_EXPIRED
          - INVALID_PIN
          - PIN_TRIES_EXCEEDED
          - CONTROL_MCC
          - CONTROL_MERCHANT
          - CONTROL_COUNTRY
          - CONTROL_CHANNEL
          - LIMIT_EXCEEDED
          - VELOCITY_EXCEEDED
          - FRAUD_SUSPECTED
          - JIT_DECLINED
          - JIT_TIMEOUT
          - INVALID_CVV
          - INVALID_EXPIRY
          - THREEDS_FAILED
          - SYSTEM_ERROR
          - OTHER
          - CARD_LOST
          - CARD_STOLEN
          - CARD_BLOCKED
          - PROGRAM_SUSPENDED
          - RULE_DECLINED
          - CONTROL_AMOUNT
          - CONTROL_TIME
          - CONTROL_CURRENCY
          - ORIGINAL_NOT_FOUND
          description: Decline reason when action is DECLINE
        is_active:
          type: boolean
          description: Active
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
          description: Start
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
          description: End
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
