        in: query
        schema:
          type: string
          format: uuid
      - name: card_program_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - REVERSED
          - PARTIALLY_REVERSED
          - EXPIRED
          - CLEARED
          - PARTIALLY_CLEARED
      - name: decision
        in: query
        schema:
          type: string
          enum:
          - APPROVED
          - DECLINED
          - PARTIAL
      - name: message_type
        in: query
        schema:
          type: string
          enum:
          - AUTHORIZATION
          - FINANCIAL
          - INCREMENTAL
          - REVERSAL
          - PARTIAL_REVERSAL
          - ADVICE
          - BALANCE_INQUIRY
          - ACCOUNT_VERIFICATION
          - REFUND_AUTH
      - name: mcc
        in: query
        schema:
          type: string
          maxLength: 4
      - name: merchant_id
        in: query
        schema:
          type: string
          maxLength: 32
      - name: rrn
        in: query
        schema:
          type: string
          maxLength: 12
      - name: network_transaction_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationPage'
        '400': &id001
