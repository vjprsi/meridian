          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementProgramPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - WAL-07
      x-service: disbursement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: disbursement_program
      x-crud: true
      x-crud-list: true
    post:
      operationId: disbursementProgramsCreate
      summary: Create disbursement program
      tags:
      - Disbursement Programs
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementProgram'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
