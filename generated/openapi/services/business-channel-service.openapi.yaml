openapi: 3.1.0
info:
  title: Meridian Core — business-channel-service
  version: 1.0.0
  description: 'Experience APIs for the bank''s own apps. Customer apps (web banking, mobile) use /v1/me: every operation
    acts for the signed-in customer only: the customer comes from the access token (customer_id claim, scope channels:customer),
    never from a path, query or body. The service calls the domain services with its own service identity and the customer''s
    tenant, checks that every referenced account, card, loan, wallet, payment, payee, standing order, thread, notification
    and document belongs to the customer (an object of someone else answers 404), rebuilds request bodies server-side and
    requires a recent authentication (step-up) for money movement and security changes. Agent outlet apps use /v1/agent the
    same way (agent_id claim, scope channels:agent; see agent-channel-service), and the business banking portal uses /v1/business
    (business_customer_id and business_user_id claims, scope channels:business; see business-channel-service). Domain services
    keep their operator APIs; customer, agent and business tokens carry no domain scope and are rejected there.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Business Me
  description: The signed-in business user
- name: Business Users
  description: Users of the business, their roles, daily limits and account entitlements (changes by ADMIN users only)
- name: Business Approval Rules
  description: The business's approval matrix (amount bands per currency)
- name: Business Accounts
  description: Accounts of the business the user may see (ADMIN users see all of them)
- name: Business Cash Position
  description: Cash position across the business's accounts
- name: Business Payees
  description: Beneficiaries of the business
- name: Business Payments
  description: Payments with multi-level approvals per the business's approval matrix
- name: Business Approval Queue
  description: Payments waiting for the signed-in user's approval
- name: Business Bulk Payments
  description: Bulk payments and payroll uploaded as CSV, validated and approved like single payments
- name: Business Fx Quotes
  description: FX quotes priced for the business (bound to one international payment when used)
- name: Business Fx Deals
  description: FX deals booked for the business's released international payments
- name: Business Mandates
  description: Direct-debit mandates under which the business collects as creditor
- name: Business Virtual Accounts
  description: Virtual accounts routing collections to the business's accounts
- name: Business Payment Links
  description: Payment links collecting into the business's accounts
- name: Business Cards
  description: Expense cards for employees, linked to the business's accounts (issued and controlled by ADMIN users)
- name: Business Card Products
  description: Card products expense cards can be issued on
- name: Business Loans
  description: Business loans
- name: Business Credit Lines
  description: Credit lines (working capital, overdraft facilities) of the business
- name: Business Api Clients
  description: API clients and keys of the business (ADMIN users only)
- name: Business Webhooks
  description: Webhook endpoints of the business; subscriptions only ever deliver the business's own events
- name: Business Activity
  description: The business's portal activity (security log)
paths:
  /v1/business/me:
    get:
      operationId: businessMeGet
      summary: 'The signed-in user, the business (customer record) and the user''s account entitlements: {user, business,
        entitlements[]}'
      tags:
      - Business Me
      security:
      - oauth2:
        - channels:business
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: business-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:business")'
      x-required-scope: channels:business
      x-table: business_user
  /v1/business/users:
    get:
      operationId: businessUsersList
      summary: Users of the business
      tags:
      - Business Users
      security:
      - oauth2:
        - channels:business
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REMOVED
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUserPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: business-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:business")'
      x-required-scope: channels:business
      x-table: business_user
    post:
      operationId: businessUsersCreate
      summary: Add a user (ADMIN; step-up); the returned id is set as the person's business_user_id attribute in the identity
        provider
      tags:
      - Business Users
      security:
