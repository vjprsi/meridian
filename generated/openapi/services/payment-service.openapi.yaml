          format: int32
          readOnly: true
          type: integer
        status:
          description: Status
          enum:
          - UPLOADED
          - VALIDATING
          - VALIDATED
          - PENDING_APPROVAL
          - APPROVED
          - PROCESSING
          - COMPLETED
          - PARTIALLY_COMPLETED
          - REJECTED
          - CANCELLED
