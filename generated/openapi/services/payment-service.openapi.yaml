openapi: 3.1.0
info:
  title: Meridian Core — payment-service
  version: 1.0.0
  description: 'ISO 20022-native payments hub. Initiates, screens, approves, routes, submits and settles payments on every
    rail (instant, batch, RTGS, mobile money, cross-border); manages payees, aliases, bulk files, direct-debit mandates, request-to-pay,
    payment links and QR codes; runs rail routing, settlement, liquidity and FX.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Payments
  description: Initiate and track payments on any rail. Status follows the PaymentStatus state machine.
- name: Payment Returns
  description: Return of a settled payment (pacs.004), inbound or outbound
- name: Payment Recalls
  description: Request to recall a payment (camt.056) and its resolution (camt.029)
- name: Payment Repairs
  description: Repair queue item for a payment that failed validation, routing or submission
- name: Payment Approvals
  description: Approval step for payments needing one or more approvers (business multi-signature)
- name: Payees
  description: Saved beneficiary in a customer's payee book
- name: Payee Aliases
  description: Proxy / alias directory entry (phone, email, UPI VPA, PIX key) mapping to an account
- name: Payee Verifications
  description: Stand-alone account name checks (Confirmation of Payee, name enquiry)
- name: Bulk Payments
  description: A batch of payments (payroll, supplier run) uploaded as a file or via API
- name: Bulk Payment Items
  description: One line of a bulk payment
- name: Payment Mandates
  description: Direct-debit mandate authorising a creditor to pull funds (SEPA DD, Bacs, ACH, PIX Automático, UPI Autopay)
- name: Direct Debit Collections
  description: One collection under a mandate (pacs.003 / ACH debit entry)
- name: Requests To Pay
  description: A request for payment sent to a payer (SEPA RTP, UPI collect, PIX cobrança)
- name: Payment Links
  description: Shareable payment link (pay-by-link) for collecting money online
- name: Payment Qr Codes
  description: EMVCo merchant-presented or person-to-person QR code (static or dynamic)
paths:
  /v1/payments:
    get:
      operationId: paymentsList
      summary: List payments
      tags:
      - Payments
      security:
      - oauth2:
        - payments:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - INITIATED
          - SCREENING
          - PENDING_APPROVAL
          - APPROVED
          - SUBMITTED
          - ACCEPTED
          - SETTLED
          - REJECTED
          - RETURNED
          - FAILED
          - CANCELLED
          - IN_REPAIR
      - name: payment_type
        in: query
        schema:
          type: string
          enum:
          - INTERNAL_TRANSFER
          - P2P
          - DOMESTIC
          - INSTANT
          - CROSS_BORDER
          - BULK_ITEM
          - PAYROLL
          - DIRECT_DEBIT
          - REQUEST_TO_PAY
          - BILL_PAYMENT
          - QR_PAYMENT
          - LINK_PAYMENT
          - REFUND
          - RETURN
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - OUTBOUND
          - INBOUND
          - INTERNAL
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - API
          - MOBILE
          - WEB
          - BRANCH
          - USSD
          - AGENT
          - BULK_FILE
          - OPEN_BANKING
          - SCHEDULER
          - INBOUND_RAIL
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: debtor_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: creditor_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: bulk_payment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: mandate_id
        in: query
        schema:
          type: string
          format: uuid
      - name: end_to_end_id
        in: query
        schema:
          type: string
          maxLength: 35
      - name: uetr
        in: query
        schema:
          type: string
          format: uuid
      - name: rail_id
        in: query
        schema:
          type: string
          format: uuid
      - name: requested_execution_date
        in: query
        schema:
          type: string
          format: date
      - name: ob_consent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - LED-05
      - PAY-01
      - PAY-02
      - PAY-03
      - PAY-04
      - PAY-06
      x-service: payment-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:read")'
      x-table: payment
      x-crud: true
      x-crud-list: true
    post:
      operationId: paymentsCreate
      summary: Create payment
      tags:
      - Payments
      security:
      - oauth2:
        - payments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
