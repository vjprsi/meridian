components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    PaymentPage:
      type: object
      description: One page of Payment results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PaymentsValidateRequest:
      type: object
      properties:
        payment:
          type: object
          additionalProperties: true
      required:
      - payment
    PaymentsInboundRequest:
      type: object
      properties:
        rail_code:
          type: string
          maxLength: 32
        rail_message_id:
          type: string
          format: uuid
        end_to_end_id:
          type: string
          maxLength: 35
        uetr:
          type: string
          format: uuid
        transaction_id:
          type: string
          maxLength: 35
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        debtor_name:
          type: string
          maxLength: 140
        debtor_account_number:
          type: string
          maxLength: 64
        debtor_agent_bic:
          type: string
          maxLength: 11
        creditor_name:
          type: string
          maxLength: 140
        creditor_account_number:
          type: string
          maxLength: 64
        remittance_unstructured:
          type: string
          maxLength: 140
        settlement_date:
          type: string
          format: date
      required:
      - rail_code
      - end_to_end_id
      - amount
      - currency
      - debtor_name
      - creditor_account_number
    PaymentsApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    PaymentsRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    PaymentsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    PaymentsScreeningDecisionRequest:
      type: object
      properties:
        status:
          type: string
          maxLength: 32
        screening_result_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 255
      required:
      - status
    PaymentsStatusReportRequest:
      type: object
      properties:
        status:
          type: string
          maxLength: 4
        reason_code:
          type: string
          maxLength: 8
        reason:
          type: string
          maxLength: 255
        clearing_system_ref:
          type: string
          maxLength: 64
        rail_message_id:
          type: string
          format: uuid
        settlement_date:
          type: string
          format: date
      required:
      - status
    PaymentsReturnRequest:
      type: object
      properties:
        reason_code:
          type: string
          maxLength: 8
        reason:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - reason_code
    PaymentsRecallRequest:
      type: object
      properties:
        reason_code:
          type: string
          maxLength: 8
        reason:
          type: string
          maxLength: 255
      required:
      - reason_code
    PaymentsRefundRequest:
