components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CampaignPage:
      type: object
      description: One page of Campaign results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CampaignsApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    CampaignsRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CampaignsScheduleRequest:
      type: object
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
      required:
      - start_at
    CampaignsBuildAudienceRequest:
      type: object
      properties:
        customer_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - customer_ids
    CampaignsPreviewAudienceRequest:
      type: object
      properties:
        customer_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - customer_ids
    CampaignsPauseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CampaignsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CampaignVariantPage:
      type: object
      description: One page of CampaignVariant results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignVariant'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CampaignMetricPage:
      type: object
      description: One page of CampaignMetric results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignMetric'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CampaignAudienceMemberPage:
      type: object
      description: One page of CampaignAudienceMember results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignAudienceMember'
        next_cursor:
          type:
