openapi: 3.1.0
info:
  title: Meridian Core — campaign-service
  version: 1.0.0
  description: 'Customer engagement: loyalty rewards, points and cashback, referral programs, transaction enrichment and personal
    finance insights (PFM), targeted campaigns and personalised offers, and secure customer messaging.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Campaigns
  description: A marketing campaign targeting one or more customer segments across channels
- name: Campaign Variants
  description: A/B variant of a campaign with its message content per channel
- name: Campaign Offers
  description: A personalised offer (pre-approved loan, card upgrade, rate promotion) with eligibility and terms
- name: Offer Assignments
  description: An offer assigned to a specific customer, tracked from shown to accepted or expired
- name: Marketing Consent Snapshots
  description: Immutable record of the customer's marketing consent at the time a campaign or offer targeted them
- name: Campaign Audience
  description: Customer selected into a campaign with variant or control-group allocation and engagement tracking
- name: Campaign Metrics
  description: Daily performance metrics per campaign and variant (counts for the day; rates and uplift cumulative). Append-only.
- name: Campaign Job Runs
  description: One batch job execution per tenant, job and business date (makes the batch actions idempotent)
paths:
  /v1/campaigns:
    get:
      operationId: campaignsList
      summary: List campaigns
      tags:
      - Campaigns
      security:
      - oauth2:
        - engagement:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - SCHEDULED
          - RUNNING
          - PAUSED
          - COMPLETED
          - CANCELLED
      - name: owner_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ENG-04
      x-service: campaign-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:read")'
      x-required-scope: engagement:read
      x-table: campaign
      x-crud: true
      x-crud-list: true
    post:
      operationId: campaignsCreate
      summary: Create campaign
      tags:
      - Campaigns
      security:
      - oauth2:
        - engagement:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      x-requirements:
      - ENG-04
      x-service: campaign-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:write")'
      x-required-scope: engagement:write
      x-table: campaign
      x-crud: true
      x-crud-create: true
