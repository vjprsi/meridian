info:
  description: 'Customer engagement: loyalty rewards, points and cashback, referral programs, transaction enrichment and personal
    finance insights (PFM), targeted campaigns and personalised offers, and secure customer messaging.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — campaign-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/campaigns:
    get:
      operationId: campaignsList
      summary: List campaigns
      tags:
      - Campaigns
      security:
      - oauth2:
        - engagement:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - SCHEDULED
          - RUNNING
          - PAUSED
          - COMPLETED
          - CANCELLED
      - name: owner_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ENG-04
      x-service: campaign-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:read")'
      x-table: campaign
      x-crud: true
      x-crud-list: true
    post:
      operationId: campaignsCreate
      summary: Create campaign
      tags:
      - Campaigns
      security:
      - oauth2:
        - engagement:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      x-requirements:
      - ENG-04
      x-service: campaign-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:write")'
      x-table: campaign
      x-crud: true
      x-crud-create: true
  /v1/campaigns/{id}:
    get:
      operationId: campaignsGet
      summary: Retrieve campaign
      tags:
      - Campaigns
      security:
      - oauth2:
        - engagement:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ENG-04
      x-service: campaign-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:read")'
      x-table: campaign
      x-crud: true
      x-crud-get: true
    patch:
      operationId: campaignsUpdate
      summary: Update campaign
      tags:
      - Campaigns
      security:
      - oauth2:
        - engagement:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
