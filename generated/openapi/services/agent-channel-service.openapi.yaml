  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical request; replays return the original response for 24h
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            channels:customer: Customer, Agent, Business and Merchant Channels (signed-in customer)
            channels:agent: Customer, Agent, Business and Merchant Channels (signed-in agent)
            channels:business: Customer, Agent, Business and Merchant Channels (signed-in business)
            channels:merchant: Customer, Agent, Business and Merchant Channels (signed-in merchant)
            channels:admin: Narrow scope channels:admin
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            channels:customer: Customer, Agent, Business and Merchant Channels (signed-in customer)
            channels:agent: Customer, Agent, Business and Merchant Channels (signed-in agent)
            channels:business: Customer, Agent, Business and Merchant Channels (signed-in business)
            channels:merchant: Customer, Agent, Business and Merchant Channels (signed-in merchant)
            channels:admin: Narrow scope channels:admin
