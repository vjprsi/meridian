openapi: 3.1.0
info:
  title: Meridian Core — agent-channel-service
  version: 1.0.0
  description: 'Experience APIs for the bank''s own apps. Customer apps (web banking, mobile) use /v1/me: every operation
    acts for the signed-in customer only: the customer comes from the access token (customer_id claim, scope channels:customer),
    never from a path, query or body. The service calls the domain services with its own service identity and the customer''s
    tenant, checks that every referenced account, card, loan, wallet, payment, payee, standing order, thread, notification
    and document belongs to the customer (an object of someone else answers 404), rebuilds request bodies server-side and
    requires a recent authentication (step-up) for money movement and security changes. Agent outlet apps use /v1/agent the
    same way (agent_id claim, scope channels:agent; see agent-channel-service), the business banking portal uses /v1/business
    (business_customer_id and business_user_id claims, scope channels:business; see business-channel-service), and the merchant
    app uses /v1/merchant (merchant_id and merchant_user_id claims, scope channels:merchant; see merchant-channel-service).
    Domain services keep their operator APIs; customer, agent, business and merchant tokens carry no domain scope and are
    rejected there.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Agent Me
  description: The signed-in agent, its outlets, floats, wallets, KPIs, sub-agents and channel activity
- name: Agent Me Devices
  description: The agent's devices and their signing keys (device binding)
- name: Agent Me Float Requests
  description: Float top-up and rebalance requests of the agent
- name: Agent Me Cash Requests
  description: Cash-in-transit delivery and pickup requests for the agent's outlets
- name: Agent Me Tills
  description: Tills at the agent's outlets, opened and closed per shift with cash counts
- name: Agent Me Customers
  description: Customer wallet lookup for cash-in / cash-out (masked data only; rate-limited and logged)
- name: Agent Me Transactions
  description: Wallet transactions the agent took part in (cash-in, cash-out, float, bills and airtime from its float wallet)
    and receipts
- name: Agent Me Cash In
  description: Cash-in from the agent's float wallet to a customer wallet
- name: Agent Me Cash Out
  description: Cash-out at the agent (funds held on the customer wallet until the customer confirms)
- name: Agent Me Billers
  description: Biller catalogue for bill payments and airtime (reference data)
- name: Agent Me Bill Payments
  description: Bill payments paid from the agent's float wallet for walk-in customers
- name: Agent Me Airtime
  description: Airtime and bundle top-ups paid from the agent's float wallet
- name: Agent Me Commissions
  description: Commissions earned by the agent
- name: Agent Me Journeys
  description: Onboarding journeys the agent may run (published, agent channel)
- name: Agent Me Applications
  description: Assisted onboarding of prospects by the agent (onboarding-service; channel AGENT)
- name: Agent Me Offline Batches
  description: Onboarding applications captured offline on a registered device, signed with its key
paths:
  /v1/agent/me:
    get:
      operationId: agentMeGet
      summary: The signed-in agent (from the token's agent_id)
      tags:
      - Agent Me
      security:
      - oauth2:
        - channels:agent
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: agent-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:agent")'
      x-required-scope: channels:agent
      x-table: agent_action
  /v1/agent/me/outlets:
    get:
      operationId: agentMeOutlets
