          type:
          - string
          - 'null'
          format: uuid
          description: Object acted on, or the object id that was refused
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - DENIED
          - STEP_UP_REQUIRED
          - SIGNATURE_INVALID
          - RATE_LIMITED
          - FAILED
