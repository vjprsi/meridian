components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    WalletTransactionPage:
      type: object
      description: One page of WalletTransaction results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AgentOutletPage:
      type: object
      description: One page of AgentOutlet results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentOutlet'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AgentFloatPage:
      type: object
      description: One page of AgentFloat results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentFloat'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AgentPerformanceDailyPage:
      type: object
      description: One page of AgentPerformanceDaily results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentPerformanceDaily'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AgentPage:
      type: object
      description: One page of Agent results (newest first)
      properties:
