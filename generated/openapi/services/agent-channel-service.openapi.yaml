        error_code:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Problem code when not SUCCEEDED
        result_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the record created downstream (transaction, float request, batch...)
        agent_device_id:
