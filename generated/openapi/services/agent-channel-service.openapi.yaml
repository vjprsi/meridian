      type: object
      description: Current balances per ledger account, updated in the same transaction as each posting
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        ledger_account_id:
          type: string
          format: uuid
          description: Account
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Account currency (ISO 4217)
        posted_debits:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Lifetime posted debits
          readOnly: true
        posted_credits:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Lifetime posted credits
          readOnly: true
        posted_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Posted (ledger) balance in normal-balance terms
          readOnly: true
        pending_debits:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Active holds and pending debits
          readOnly: true
        pending_credits:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Pending credits not yet available
          readOnly: true
        available_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Posted - pending debits + overdraft limit
          readOnly: true
        account_version:
          type: integer
          format: int64
          description: Last applied ledger entry version
          readOnly: true
        last_entry_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of the last posting
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
