openapi: 3.1.0
info:
  title: Meridian Core — biller-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Billers
  description: A company or agency that customers can pay bills to
- name: Biller Products
  description: A fixed product sold through a biller (airtime denomination, data bundle, TV package)
- name: Bill Inquiries
  description: A bill lookup at the biller returning the customer name and amount due
- name: Bill Payments
  description: A payment of a bill from a wallet to a biller
- name: Airtime Topups
  description: An airtime or data top-up for any mobile number
- name: Biller Settlements
  description: Settlement of collected bill payments to a biller for a period
paths:
  /v1/billers:
    get:
      operationId: billersList
      summary: List billers
      tags:
      - Billers
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: category
        in: query
        schema:
          type: string
          enum:
          - ELECTRICITY
          - WATER
          - GAS
          - TELECOM
          - AIRTIME
          - DATA
          - TV
          - INTERNET
          - EDUCATION
          - GOVERNMENT
          - TAX
          - INSURANCE
          - LOAN
          - OTHER
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - RETIRED
      - name: integration_type
        in: query
        schema:
          type: string
          enum:
          - API
          - ISO8583
          - FILE
          - AGGREGATOR
      - name: biller_code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillerPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - WAL-05
      x-service: biller-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: biller
      x-crud: true
      x-crud-list: true
    post:
      operationId: billersCreate
      summary: Create biller
      tags:
      - Billers
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Biller'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillerCreate'
      x-requirements:
      - WAL-05
      x-service: biller-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: biller
      x-crud: true
