components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    BillerPage:
      type: object
      description: One page of Biller results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Biller'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BillerProductPage:
      type: object
      description: One page of BillerProduct results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillerProduct'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BillersValidateReferenceRequest:
      type: object
      properties:
        account_reference:
          type: string
          maxLength: 64
      required:
      - account_reference
    BillersSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    BillInquiryPage:
      type: object
      description: One page of BillInquiry results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillInquiry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BillPaymentPage:
      type: object
      description: One page of BillPayment results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillPayment'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BillPaymentsReverseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    AirtimeTopupPage:
      type: object
      description: One page of AirtimeTopup results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AirtimeTopup'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BillerSettlementPage:
      type: object
      description: One page of BillerSettlement results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillerSettlement'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BillerSettlementsApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    BillerSettlementsRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    BillerSettlementsMarkPaidRequest:
      type: object
      properties:
        payment_reference:
          type: string
          maxLength: 64
      required:
      - payment_reference
    AirtimeTopup:
      type: object
      description: An airtime or data top-up for any mobile number
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        biller_id:
          type: string
          format: uuid
          description: Mobile operator
        biller_product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Bundle, if any
        payer_wallet_id:
          type: string
          format: uuid
          description: Paying wallet
        channel:
          type: string
          enum:
          - USSD
          - SMS
          - APP
          - WEB
          - API
          - AGENT_APP
          - POS
          - QR
          - BULK
          - SYSTEM
          description: Initiating channel
        wallet_transaction_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Wallet transaction
          readOnly: true
        target_msisdn:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: Number topped up (E.164)
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        status:
          type: string
          enum:
          - INITIATED
          - VALIDATED
          - PROCESSING
          - PENDING_PROVIDER
          - COMPLETED
          - FAILED
          - REVERSED
          description: Status
          readOnly: true
        provider_reference:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Operator reference
          readOnly: true
        retry_count:
          type: integer
          format: int32
          description: Operator retries
          readOnly: true
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Completion time
          readOnly: true
        failure_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Failure reason
          readOnly: true
        biller_settlement_id:
          type:
          - string
          - 'null'
          format: uuid
