          format: uuid
          readOnly: true
          type: string
        largest_negative_position:
          description: Largest net negative position so far
          examples:
          - '125.50'
          format: decimal
          type: string
        legal_entity_id:
          description: Entity
          format: uuid
          type: string
        nostro_account_id:
          description: Settlement account
          format: uuid
          type:
          - string
          - 'null'
        payments_received:
