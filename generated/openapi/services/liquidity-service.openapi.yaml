openapi: 3.1.0
info:
  title: Meridian Core — liquidity-service
  version: 1.0.0
  description: 'Front-to-back treasury: money market, FX and securities deals with confirmations and settlement, counterparty
    limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and asset-liability management (repricing
    gap, NII/EVE sensitivity) with funds transfer pricing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Liquidity Positions
  description: Actual or projected cash position by currency, nostro and day
- name: Liquidity Ladder Runs
  description: A maturity ladder (liquidity gap) computation at an as-of date
- name: Lcr Calculations
  description: Basel III Liquidity Coverage Ratio snapshot
- name: Nsfr Calculations
  description: Basel III Net Stable Funding Ratio snapshot
- name: Liquidity Stress Scenarios
  description: Definition of a liquidity stress scenario (run-off rates, haircuts, horizon)
- name: Liquidity Stress Results
  description: Outcome of running a stress scenario at an as-of date
- name: Intraday Liquidity
  description: Intraday liquidity monitoring per currency and settlement account (BCBS 248)
paths:
  /v1/treasury/liquidity/positions:
    get:
      operationId: liquidityPositionsList2
      summary: List liquidity positions
      tags:
      - Liquidity Positions
      security:
      - oauth2:
        - treasury:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: position_date
        in: query
        schema:
          type: string
          format: date
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: nostro_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: position_type
        in: query
        schema:
          type: string
          enum:
          - ACTUAL
          - PROJECTED
          - FORECAST
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityCashPositionPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - TRY-03
      x-service: liquidity-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("treasury:read")'
      x-table: liquidity_cash_position
      x-crud: true
      x-crud-list: true
  /v1/treasury/liquidity/positions/{id}:
    get:
      operationId: liquidityPositionsGet2
      summary: Retrieve liquidity position
      tags:
      - Liquidity Positions
      security:
      - oauth2:
        - treasury:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityCashPosition'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
