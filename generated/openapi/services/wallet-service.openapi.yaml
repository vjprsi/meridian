openapi: 3.1.0
info:
  title: Meridian Core — wallet-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Wallets
  description: A stored-value account held by a customer, merchant, agent or the platform
- name: Wallet Transactions
  description: A wallet money movement of any type, with its full lifecycle
- name: Wallet Tier Limits
  description: Balance and transaction limits per KYC tier, wallet type and transaction type
- name: Wallet Fee Rules
  description: Customer fee charged on a wallet transaction; the most specific matching active rule wins
- name: Wallet Bank Links
  description: A bank account linked to a wallet for wallet-to-bank and bank-to-wallet transfers
- name: Wallet Pin Resets
  description: A PIN reset request verified by OTP, agent or ID check
- name: Wallet Favorites
  description: A saved payee (wallet, biller account, merchant, bank account) for quick payments
paths:
  /v1/wallets:
    get:
      operationId: walletsList
      summary: List wallets
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: wallet_type
        in: query
        schema:
          type: string
          enum:
          - CUSTOMER
          - MERCHANT
          - AGENT
          - SUPER_AGENT
          - FLOAT
          - COMMISSION
          - ESCROW
          - G2P
          - TREASURY
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DORMANT
          - SUSPENDED
          - BLOCKED
          - CLOSED
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: merchant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: msisdn
        in: query
        schema:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: kyc_tier
        in: query
        schema:
          type: integer
          format: int32
      - name: wallet_number
        in: query
        schema:
          type: string
          maxLength: 32
      - name: alias
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
      x-crud: true
      x-crud-list: true
    post:
      operationId: walletsCreate
      summary: Create wallet
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreate'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
      x-crud: true
      x-crud-create: true
  /v1/wallets/{id}:
    get:
      operationId: walletsGet
      summary: Retrieve wallet
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
      x-crud: true
      x-crud-get: true
    patch:
      operationId: walletsUpdate
      summary: Update wallet
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletUpdate'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
      x-crud: true
      x-crud-update: true
  /v1/wallets/lookup:
    get:
      operationId: walletsLookup
      summary: Resolve an active wallet by msisdn, alias or wallet number for payee name confirmation
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - name: msisdn
        in: query
        required: false
        schema:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
      - name: alias
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: wallet_number
        in: query
        required: false
        schema:
          type: string
          maxLength: 32
      - name: currency
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
  /v1/wallets/{id}/balance:
    get:
      operationId: walletsBalance
      summary: Current balance (posted, available, held) from the ledger
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
  /v1/wallets/{id}/transactions:
    get:
      operationId: walletsTransactions
      summary: Transactions of the wallet (as payer or payee), newest first
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: txn_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - P2P
          - CASH_IN
          - CASH_OUT
          - MERCHANT_PAYMENT
          - BILL_PAYMENT
          - AIRTIME
          - G2P
          - BULK_DISBURSEMENT
          - WALLET_TO_BANK
          - BANK_TO_WALLET
          - FLOAT_TRANSFER
          - COMMISSION_PAYOUT
          - INTEROP_OUT
          - INTEROP_IN
          - REFUND
          - REVERSAL
          - FEE
          - ADJUSTMENT
          - LOAN_DISBURSEMENT
          - LOAN_REPAYMENT
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - INITIATED
          - PENDING_CONFIRMATION
          - PENDING_APPROVAL
          - PROCESSING
          - COMPLETED
          - FAILED
          - REVERSED
          - EXPIRED
          - CANCELLED
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
  /v1/wallets/{id}/limits:
    get:
      operationId: walletsLimits
      summary: 'Effective tier limits with used and remaining daily/monthly amount and count: {kyc_tier, wallet_type, currency,
        limits[{txn_type, per_txn_min, per_txn_max, max_balance, daily_amount, daily_used, daily_remaining, daily_count, daily_count_used,
        monthly_amount, monthly_used, monthly_remaining, monthly_count, monthly_count_used}]}'
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: txn_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - P2P
          - CASH_IN
          - CASH_OUT
          - MERCHANT_PAYMENT
          - BILL_PAYMENT
          - AIRTIME
          - G2P
          - BULK_DISBURSEMENT
          - WALLET_TO_BANK
          - BANK_TO_WALLET
          - FLOAT_TRANSFER
          - COMMISSION_PAYOUT
          - INTEROP_OUT
          - INTEROP_IN
          - REFUND
          - REVERSAL
          - FEE
          - ADJUSTMENT
          - LOAN_DISBURSEMENT
          - LOAN_REPAYMENT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
  /v1/wallets/{id}/status-history:
    get:
      operationId: walletsStatusHistory
      summary: Status change history
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletStatusHistoryPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
  /v1/wallets/{id}/statement:
    get:
      operationId: walletsStatement
      summary: 'Mini statement from the ledger: {wallet_id, from, to, opening_balance, closing_balance, total_credits, total_debits,
        entries[]}'
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: wallet
  /v1/wallets/{id}/upgrade-tier:
    post:
      operationId: walletsUpgradeTier
      summary: Upgrade the KYC tier after verification (tiers only go up)
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletsUpgradeTierRequest'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
  /v1/wallets/{id}/activate:
    post:
      operationId: walletsActivate
      summary: Activate a pending or dormant wallet; opens the ledger account on first activation
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletsActivateRequest'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
  /v1/wallets/{id}/suspend:
    post:
      operationId: walletsSuspend
      summary: Suspend the wallet (ledger account frozen for debits)
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletsSuspendRequest'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
  /v1/wallets/{id}/block:
    post:
      operationId: walletsBlock
      summary: Block the wallet (fraud or legal; ledger account fully frozen)
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletsBlockRequest'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
  /v1/wallets/{id}/reactivate:
    post:
      operationId: walletsReactivate
      summary: 'Lift a suspension or block (checker: a different principal from the one who suspended or blocked)'
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletsReactivateRequest'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
  /v1/wallets/{id}/close:
    post:
      operationId: walletsClose
      summary: Close a wallet, sweeping any residual balance to another wallet of the same currency
      tags:
      - Wallets
      security:
      - oauth2:
        - wallets:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletsCloseRequest'
      x-requirements:
      - CIF-03
      - LND-07
      - WAL-01
      x-service: wallet-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: wallet
  /v1/wallets/{id}/set-pin:
