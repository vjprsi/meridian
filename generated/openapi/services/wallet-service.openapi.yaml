          format: uuid
          type: string
        product_version_id:
          description: Product version the wallet is on
          format: uuid
          type: string
        status:
          description: Lifecycle status
          enum:
          - PENDING
          - ACTIVE
          - DORMANT
          - SUSPENDED
          - BLOCKED
          - CLOSED
          type: string
        status_reason:
          description: Reason for the current status
          maxLength: 255
          type: string
        wallet_number:
          description: Public wallet number
          maxLength: 32
          type: string
        wallet_type:
          description: Kind of wallet
          enum:
          - CUSTOMER
          - MERCHANT
          - AGENT
          - SUPER_AGENT
          - FLOAT
          - COMMISSION
          - ESCROW
          - G2P
          - TREASURY
          type: string
      type: object
    WalletsActivateRequest:
      properties:
        reason:
          maxLength: 255
          type: string
      type: object
    WalletsBlockRequest:
      properties:
        reason:
          maxLength: 255
          type: string
      required:
      - reason
      type: object
    WalletsCloseRequest:
      properties:
        reason:
          maxLength: 255
          type: string
        sweep_to_wallet_id:
          format: uuid
          type: string
      required:
      - reason
      type: object
    WalletsReactivateRequest:
      properties:
        reason:
          maxLength: 255
          type: string
      required:
      - reason
      type: object
    WalletsSetPinRequest:
      properties:
        current_pin:
          maxLength: 12
          type: string
        new_pin:
          maxLength: 12
          type: string
      required:
      - new_pin
      type: object
    WalletsStatementsRequest:
      properties:
        format:
          maxLength: 8
          type: string
        from_date:
          format: date
          type: string
        to_date:
          format: date
          type: string
      required:
      - from_date
      - to_date
      type: object
    WalletsSuspendRequest:
      properties:
        reason:
          maxLength: 255
          type: string
      required:
      - reason
      type: object
    WalletsUpgradeTierRequest:
      properties:
        kyc_profile_id:
          format: uuid
          type: string
        kyc_tier:
          format: int32
          type: integer
      required:
      - kyc_tier
      - kyc_profile_id
      type: object
    WalletsVerifyPinRequest:
      properties:
        pin:
          maxLength: 12
          type: string
      required:
      - pin
      type: object
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          scopes:
            wallets:read: Read Wallets, Agents and Merchants
            wallets:write: Change Wallets, Agents and Merchants
          tokenUrl: https://auth.meridian.example/oauth2/token
        clientCredentials:
          scopes:
            wallets:read: Read Wallets, Agents and Merchants
            wallets:write: Change Wallets, Agents and Merchants
          tokenUrl: https://auth.meridian.example/oauth2/token
      type: oauth2
info:
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — wallet-service
  version: 1.0.0
openapi: 3.1.0
