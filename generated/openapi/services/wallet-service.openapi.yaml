components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    WalletPage:
      type: object
      description: One page of Wallet results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WalletTransactionPage:
      type: object
      description: One page of WalletTransaction results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WalletStatusHistoryPage:
      type: object
      description: One page of WalletStatusHistory results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletStatusHistory'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WalletsUpgradeTierRequest:
      type: object
      properties:
        kyc_tier:
          type: integer
          format: int32
        kyc_profile_id:
          type: string
          format: uuid
      required:
      - kyc_tier
      - kyc_profile_id
    WalletsActivateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    WalletsSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    WalletsBlockRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    WalletsReactivateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    WalletsCloseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
        sweep_to_wallet_id:
          type: string
          format: uuid
      required:
      - reason
    WalletsSetPinRequest:
      type: object
      properties:
        new_pin:
          type: string
          maxLength: 12
        current_pin:
          type: string
          maxLength: 12
      required:
      - new_pin
    WalletsVerifyPinRequest:
      type: object
      properties:
        pin:
          type: string
          maxLength: 12
      required:
      - pin
    WalletsStatementsRequest:
      type: object
      properties:
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        format:
          type: string
          maxLength: 8
      required:
      - from_date
      - to_date
    WalletTransactionsQuoteRequest:
      type: object
      properties:
        txn_type:
          type: string
          enum:
          - P2P
          - CASH_IN
          - CASH_OUT
          - MERCHANT_PAYMENT
          - BILL_PAYMENT
          - AIRTIME
          - G2P
          - BULK_DISBURSEMENT
          - WALLET_TO_BANK
          - BANK_TO_WALLET
          - FLOAT_TRANSFER
          - COMMISSION_PAYOUT
          - INTEROP_OUT
          - INTEROP_IN
          - REFUND
          - REVERSAL
          - FEE
          - ADJUSTMENT
          - LOAN_DISBURSEMENT
          - LOAN_REPAYMENT
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        payer_wallet_id:
          type: string
          format: uuid
        payee_wallet_id:
          type: string
          format: uuid
        payee_msisdn:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: E.164
        channel:
          type: string
          enum:
          - USSD
          - SMS
          - APP
          - WEB
          - API
          - AGENT_APP
          - POS
          - QR
          - BULK
          - SYSTEM
      required:
      - txn_type
      - amount
      - currency
    WalletTransactionsP2pRequest:
      type: object
      properties:
        payer_wallet_id:
          type: string
          format: uuid
        payee_wallet_id:
          type: string
          format: uuid
        payee_msisdn:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: E.164
        payee_alias:
          type: string
          maxLength: 64
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        channel:
          type: string
          enum:
          - USSD
          - SMS
          - APP
          - WEB
          - API
          - AGENT_APP
          - POS
          - QR
          - BULK
          - SYSTEM
        description:
          type: string
          maxLength: 255
        customer_note:
          type: string
          maxLength: 160
        pin:
          type: string
          maxLength: 12
      required:
      - payer_wallet_id
      - amount
      - currency
    WalletTransactionsCashInRequest:
      type: object
      properties:
        agent_wallet_id:
          type: string
          format: uuid
        agent_outlet_id:
          type: string
          format: uuid
        payee_msisdn:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: E.164
        amount:
          type: string
          format: decimal
          examples:
