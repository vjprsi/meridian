components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    OnboardingApplication:
      description: One customer's run through an onboarding journey
      properties:
        agent_id:
          description: Agent assisting (agent channel)
          format: uuid
          type:
          - string
          - 'null'
        application_number:
          description: Human-readable reference
          maxLength: 32
          type: string
        branch_id:
          description: Branch (branch channel)
          format: uuid
          type:
          - string
          - 'null'
        channel:
          description: Channel
          enum:
          - MOBILE_APP
          - WEB
          - USSD
          - AGENT
          - BRANCH
          - API
          type: string
        collected_data:
          additionalProperties: true
          description: Data captured so far (encrypted)
          type:
          - object
          - 'null'
        completed_at:
          description: Completion time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        created_product_refs:
          additionalProperties: true
          description: Accounts / wallets / cards opened on approval
          readOnly: true
          type:
          - object
          - 'null'
        current_step:
          description: Code of the current step
          maxLength: 64
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Customer created or matched
          format: uuid
          type:
          - string
          - 'null'
        decision:
          description: Automated decision
          enum:
          - AUTO_APPROVE
          - REFER
          - REJECT
          readOnly: true
          type:
          - string
          - 'null'
        decision_reasons:
          additionalProperties: true
          description: Rule outcomes and reason codes
          readOnly: true
          type:
          - object
          - 'null'
        device_fingerprint:
          description: Device used
          maxLength: 128
          type:
          - string
          - 'null'
        email:
          description: Email used to start the application
          format: email
          maxLength: 320
          type:
          - string
          - 'null'
        expires_at:
          description: Expiry of an idle application
          format: date-time
          type:
          - string
          - 'null'
        geo_location:
          additionalProperties: true
          description: Coarse location at start
          type:
          - object
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        ip_address:
          description: IP address at start (IPv4 or IPv6 address)
          type:
          - string
          - 'null'
        onboarding_journey_id:
          description: Journey version
          format: uuid
          type: string
        phone:
          description: Phone used to start the application (E.164)
          pattern: ^\+[1-9]\d{6,14}$
          type:
          - string
          - 'null'
        product_ids:
          additionalProperties: true
          description: Products requested
          type:
          - object
          - 'null'
        progress_percent:
          description: Completion percentage
          format: int32
          readOnly: true
          type: integer
        rejection_reason:
          description: Reason when rejected
          maxLength: 255
          readOnly: true
          type:
          - string
          - 'null'
        reviewed_at:
          description: Review time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        reviewer_id:
          description: Manual reviewer
          format: uuid
          type:
          - string
          - 'null'
        risk_level:
          description: Risk level
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - PROHIBITED
          readOnly: true
          type:
          - string
          - 'null'
        risk_score:
          description: Onboarding risk score 0..1000
          format: int32
          readOnly: true
          type:
          - integer
          - 'null'
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        staff_user_id:
          description: Staff member assisting
          format: uuid
          type:
          - string
          - 'null'
        status:
          description: Status
          enum:
          - STARTED
          - IN_PROGRESS
          - SUBMITTED
          - UNDER_REVIEW
          - REFERRED
          - APPROVED
          - REJECTED
          - ABANDONED
          - EXPIRED
          type: string
        submitted_at:
          description: Submission time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        utm:
          additionalProperties: true
          description: Marketing attribution
          type:
          - object
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - application_number
      - onboarding_journey_id
      - status
      - channel
      - progress_percent
