openapi: 3.1.0
info:
  title: Meridian Core — onboarding-service
  version: 1.0.0
  description: 'Single customer view for individuals and businesses (CIF), relationships and UBOs, tiered KYC, devices and
    credentials, consent and privacy, configurable onboarding journeys, and KYC/KYB checks through pluggable providers.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Onboarding Journeys
  description: Versioned onboarding journey definition built in the no-code flow builder
- name: Onboarding Applications
  description: One customer's run through an onboarding journey
- name: Onboarding Applicant
  description: 'Public applicant surface for unauthenticated prospects. Every action except start needs the applicant token
    in X-Applicant-Token (401 applicant_token_required / applicant_token_invalid / applicant_token_expired); a token only
    opens its own application (404 for any other id). Risk and review fields are never returned.

    '
- name: Onboarding Offline Batches
  description: Batch of applications captured offline by an agent device and synced later
paths:
  /v1/onboarding/journeys:
    get:
      operationId: onboardingJourneysList
      summary: List onboarding journeys
      tags:
      - Onboarding Journeys
      security:
      - oauth2:
        - party:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - RETIRED
      - name: customer_type
        in: query
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - SOLE_TRADER
          - COMPANY
          - PARTNERSHIP
          - TRUST
          - NON_PROFIT
          - GOVERNMENT
          - GROUP
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingJourneyPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ONB-01
      x-service: onboarding-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:read")'
      x-required-scope: party:read
      x-table: onboarding_journey
      x-crud: true
      x-crud-list: true
    post:
      operationId: onboardingJourneysCreate
      summary: Create onboarding journey
      tags:
      - Onboarding Journeys
      security:
      - oauth2:
        - party:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingJourney'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingJourneyCreate'
      x-requirements:
      - ONB-01
      x-service: onboarding-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:write")'
      x-required-scope: party:write
      x-table: onboarding_journey
      x-crud: true
      x-crud-create: true
  /v1/onboarding/journeys/{id}:
    get:
      operationId: onboardingJourneysGet
      summary: Retrieve onboarding journey
      tags:
      - Onboarding Journeys
      security:
      - oauth2:
        - party:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
