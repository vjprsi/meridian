components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    OnboardingJourneyPage:
      type: object
      description: One page of OnboardingJourney results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingJourney'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    OnboardingJourneysRetireRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    OnboardingJourneysSimulateRequest:
      type: object
      properties:
        sample_data:
          type: object
          additionalProperties: true
      required:
      - sample_data
    OnboardingApplicationPage:
      type: object
      description: One page of OnboardingApplication results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingApplication'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    OnboardingApplicationsStepsRequest:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
      required:
      - input
    OnboardingStepPage:
      type: object
      description: One page of OnboardingStep results (newest first)
      properties:
        data:
          type: array
          items:
