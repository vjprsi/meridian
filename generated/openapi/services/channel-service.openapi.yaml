  /v1/ussd-sessions/callback:
    post:
      operationId: ussdSessionsCallback
      summary: MNO gateway callback (HMAC-SHA256 (hex) of the canonical JSON body (keys sorted, no whitespace) in X-Gateway-Signature;
        tenant_id is part of the callback URL registered with the gateway) that processes one USSD request and returns the
        next screen as 'CON <text>' (continue) or 'END <text>'
      tags:
      - Ussd Sessions
      security: []
      parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UssdSessionsCallbackRequest'
      x-requirements:
      - WAL-03
      x-service: channel-service
      x-public: true
      description: 'Public endpoint for an external provider callback: no bearer token; the service verifies the provider
        signature and resolves the tenant from the referenced entity.'
      x-table: ussd_session
