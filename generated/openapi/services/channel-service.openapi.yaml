          - string
          - 'null'
        help_text:
          description: Help reply
          maxLength: 160
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        is_active:
          description: Active
          type: boolean
        keyword:
          description: Keyword
          maxLength: 32
          type: string
        language:
          description: Language
          maxLength: 8
          type: string
        requires_pin:
          description: PIN required in the message
