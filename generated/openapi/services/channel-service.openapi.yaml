openapi: 3.1.0
info:
  title: Meridian Core — channel-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Ussd Menus
  description: A versioned USSD menu tree for one short code and language
- name: Ussd Menu Nodes
  description: A screen in a USSD menu tree
- name: Ussd Sessions
  description: One USSD dialogue between a subscriber and the platform
- name: Sms Commands
  description: A keyword command customers can send by SMS (e.g. BAL, SEND)
- name: Sms Messages
  description: Inbound and outbound SMS log
paths:
  /v1/ussd-menus:
    get:
      operationId: ussdMenusList
      summary: List ussd menus
      tags:
      - Ussd Menus
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: short_code
        in: query
        schema:
          type: string
          maxLength: 16
      - name: language
        in: query
        schema:
          type: string
          maxLength: 8
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - RETIRED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UssdMenuPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - WAL-03
      x-service: channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: ussd_menu
      x-crud: true
      x-crud-list: true
    post:
      operationId: ussdMenusCreate
      summary: Create ussd menu
      tags:
      - Ussd Menus
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UssdMenu'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UssdMenuCreate'
      x-requirements:
      - WAL-03
      x-service: channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: ussd_menu
      x-crud: true
      x-crud-create: true
  /v1/ussd-menus/{id}:
    get:
      operationId: ussdMenusGet
