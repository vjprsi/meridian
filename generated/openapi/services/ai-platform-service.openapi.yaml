components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    MlModelPage:
      type: object
      description: One page of MlModel results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MlModel'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    MlModelVersionPage:
      type: object
      description: One page of MlModelVersion results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MlModelVersion'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ModelDeploymentPage:
      type: object
      description: One page of ModelDeployment results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelDeployment'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    MlModelVersionsSubmitForApprovalRequest:
      type: object
      properties:
        comment:
          type: string
    MlModelVersionsApproveRequest:
      type: object
      properties:
        comment:
          type: string
    MlModelVersionsRejectRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    MlModelVersionsDeployRequest:
      type: object
      properties:
        environment:
          type: string
          maxLength: 32
        mode:
          type: string
          enum:
          - SHADOW
          - CANARY
          - CHAMPION
          - CHALLENGER
        traffic_percent:
          type: integer
          format: int32
        thresholds:
          type: object
          additionalProperties: true
        auto_rollback:
          type: boolean
      required:
      - environment
      - mode
    ModelDeploymentsPromoteRequest:
      type: object
      properties:
        traffic_percent:
          type: integer
          format: int32
        comment:
          type: string
    ModelDeploymentsRollbackRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    ModelDeploymentsRetireRequest:
      type: object
      properties:
        reason:
          type: string
    ModelMonitoringMetricPage:
      type: object
      description: One page of ModelMonitoringMetric results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelMonitoringMetric'
        next_cursor:
