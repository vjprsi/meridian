openapi: 3.1.0
info:
  title: Meridian Core — ai-platform-service
  version: 1.0.0
  description: 'Country-pack regulatory reporting (definitions, runs, validation, submission, CRS/FATCA), self-service analytics
    over the lakehouse (dashboards, saved queries, exports, data shares), and the AI platform: model registry and model risk
    management, deployments and monitoring, copilots with a full audit trail, and the LLM gateway policy.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Ml Models
  description: A registered ML model (fraud, credit, AML, collections, LLM, ...) under model risk governance
- name: Ml Model Versions
  description: A trained version with metrics, bias tests, explainability and approval record
- name: Model Deployments
  description: Deployment of a model version to an environment in shadow, canary, champion or challenger mode
- name: Model Metrics
  description: Monitoring measurement of a deployed model (drift, stability, performance, latency). Append-only.
- name: Ml Features
  description: Feature catalogue entry (Feast) used by fraud, credit and AML models
- name: Copilots
  description: A copilot configuration (purpose, tools, model, guardrails, human-approval rules)
- name: Copilot Interactions
  description: Immutable audit of one copilot turn (redacted prompt/response, hashes, tool calls, citations, outcome)
- name: Ai Copilot Feedback
  description: User rating and comment on a copilot interaction. Append-only.
- name: Llm Gateway Policies
  description: Tenant policy for LLM use (opt-in, allowed models, PII redaction, residency, budgets, logging)
- name: Ai Job Runs
  description: One scheduled job execution per tenant, job and business date (makes the scheduled actions idempotent)
paths:
  /v1/ai/models:
    get:
      operationId: mlModelsList
      summary: List ml models
      tags:
      - Ml Models
      security:
      - oauth2:
        - reporting:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: model_type
        in: query
        schema:
          type: string
          enum:
          - FRAUD
          - CREDIT_SCORE
          - AML
          - COLLECTIONS
          - CHURN
          - PROPENSITY
          - RECON_MATCHING
          - DOCUMENT_AI
          - LLM
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - UNDER_REVIEW
          - RETIRED
      - name: risk_tier
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - name: owner_team
        in: query
        schema:
          type: string
          maxLength: 64
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlModelPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - AI-02
      x-service: ai-platform-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("reporting:read")'
      x-required-scope: reporting:read
      x-table: ml_model
      x-crud: true
      x-crud-list: true
    post:
      operationId: mlModelsCreate
      summary: Create ml model
      tags:
      - Ml Models
      security:
      - oauth2:
        - reporting:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlModel'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlModelCreate'
      x-requirements:
      - AI-02
      x-service: ai-platform-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("reporting:write")'
      x-required-scope: reporting:write
      x-table: ml_model
      x-crud: true
