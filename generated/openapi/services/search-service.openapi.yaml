components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    SearchQueryRequest:
      type: object
      properties:
        query_text:
          type: string
          maxLength: 500
        entity_types:
          type: array
          items: {}
        filters:
          type: object
          additionalProperties: true
        limit:
          type: integer
          format: int32
        cursor:
          type: string
          maxLength: 255
    SearchDocumentsRequest:
      type: object
      properties:
        documents:
          type: array
          items: {}
      required:
      - documents
    SearchIndexPage:
      type: object
      description: One page of SearchIndex results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchIndex'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    SearchIndexesCatchUpRequest:
      type: object
      properties:
        from_timestamp:
