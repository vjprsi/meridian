openapi: 3.1.0
info:
  title: Meridian Core — search-service
  version: 1.0.0
  description: 'Business-day processing and EOD/EOM/EOY batch orchestration, secure file exchange with partners, enterprise
    search across all entities, and data retention, archival, legal hold and certified purge.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Search
  description: Federated search across entity types with masking by caller permissions
- name: Search Indexes
  description: Definition of a searchable index for one entity type
- name: Search Index Jobs
  description: A reindex, incremental catch-up or alias swap job
- name: Search Synonyms
  description: Synonym set applied to search analysers (e.g. abbreviations, transliterations)
- name: Saved Searches
  description: A saved search query of a staff user, optionally shared with a role
paths:
  /v1/search/query:
    post:
      operationId: searchQuery
      summary: Search across entity types (free text + filters, paged; read-only, never replayed)
      tags:
      - Search
      security:
      - oauth2:
        - operations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
      x-requirements:
      - OPS-03
      x-service: search-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:write")'
      x-table: search_index
  /v1/search/suggest:
    get:
      operationId: searchSuggest
      summary: 'Type-ahead suggestions on titles (q: 2+ characters, limit max 25)'
      tags:
      - Search
      security:
      - oauth2:
        - operations:read
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 255
      - name: entity_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - CUSTOMER
          - DEPOSIT_ACCOUNT
          - WALLET
          - CARD
          - LOAN
          - PAYMENT
          - WALLET_TRANSACTION
          - SERVICE_CASE
          - AML_CASE
          - MERCHANT
          - AGENT
          - DOCUMENT
          - LEDGER_ACCOUNT
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - OPS-03
      x-service: search-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:read")'
      x-table: search_index
  /v1/search/documents:
    post:
      operationId: searchDocuments
      summary: Index entity documents pushed by owning services or the CDC consumer (1..500 per call; each entity_type, entity_id,
        document or deleted, event_id, version, occurred_at)
      tags:
      - Search
      security:
      - oauth2:
        - operations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDocumentsRequest'
      x-requirements:
      - OPS-03
      x-service: search-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:write")'
      x-table: search_index
  /v1/search/documents/{entity_type}/{entity_ref}:
    delete:
      operationId: searchRemoveDocuments
      summary: Remove an entity (entity_ref = its id in the owning service) from its search index
      tags:
      - Search
      security:
      - oauth2:
        - operations:write
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: entity_ref
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - OPS-03
      x-service: search-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:write")'
      x-table: search_index
  /v1/search/indexes:
    get:
      operationId: searchIndexesList
      summary: List search indexes
      tags:
      - Search Indexes
      security:
      - oauth2:
        - operations:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: entity_type
        in: query
        schema:
          type: string
          enum:
          - CUSTOMER
          - DEPOSIT_ACCOUNT
          - WALLET
          - CARD
          - LOAN
          - PAYMENT
          - WALLET_TRANSACTION
          - SERVICE_CASE
          - AML_CASE
          - MERCHANT
          - AGENT
          - DOCUMENT
          - LEDGER_ACCOUNT
      - name: status
        in: query
        schema:
          type: string
          enum:
          - BUILDING
          - ACTIVE
          - REINDEXING
          - DEGRADED
          - RETIRED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIndexPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - OPS-03
      x-service: search-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:read")'
      x-table: search_index
      x-crud: true
      x-crud-list: true
    post:
      operationId: searchIndexesCreate
      summary: Create search indexe
      tags:
      - Search Indexes
      security:
      - oauth2:
        - operations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIndex'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchIndexCreate'
      x-requirements:
      - OPS-03
      x-service: search-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:write")'
      x-table: search_index
      x-crud: true
      x-crud-create: true
  /v1/search/indexes/{id}:
    get:
      operationId: searchIndexesGet
      summary: Retrieve search indexe
      tags:
      - Search Indexes
      security:
      - oauth2:
        - operations:read
      parameters:
      - &id005
