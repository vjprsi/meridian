      - name: job_type
        in: query
        schema:
          type: string
          enum:
          - FULL_REINDEX
          - INCREMENTAL
          - ALIAS_SWAP
          - DELETE_BY_QUERY
      - name: status
        in: query
        schema:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - PARTIALLY_SUCCEEDED
      - name: custom_field_1
        in: query
