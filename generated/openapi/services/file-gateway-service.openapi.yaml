components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    FileChannelPage:
      type: object
      description: One page of FileChannel results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileChannel'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FileChannelsRotateCredentialsRequest:
      type: object
      properties:
        credential_secret_ref:
          type: string
          maxLength: 255
      required:
      - credential_secret_ref
    FileChannelsDisableRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    FileFormatDefinitionPage:
      type: object
      description: One page of FileFormatDefinition results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileFormatDefinition'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FileFormatsValidateSampleRequest:
      type: object
      properties:
