        code:
          description: Channel code
          maxLength: 64
          type: string
        counterparty_name:
          description: Counterparty name
          maxLength: 160
          type:
          - string
          - 'null'
        counterparty_type:
          description: Counterparty kind
          enum:
          - BANK
          - CARD_SCHEME
          - PAYMENT_RAIL
          - CREDIT_BUREAU
          - CARD_BUREAU
          - REGULATOR
          - PARTNER
          - ERP
          - BILLER
          - OTHER
          type: string
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        delete_after_download:
          description: Remove remote file after successful download
          type: boolean
        direction:
          description: Inbound, outbound or both
          enum:
          - INBOUND
          - OUTBOUND
          - BOTH
          type: string
        file_name_pattern:
          description: Regex of inbound file names to pick up
          maxLength: 255
          type:
          - string
          - 'null'
        health_status:
          description: UP, DEGRADED or DOWN
          maxLength: 32
          readOnly: true
          type:
          - string
          - 'null'
        host:
          description: Host / bucket / base URL
          maxLength: 255
          type:
          - string
          - 'null'
        host_key_fingerprint:
          description: Expected SFTP host key fingerprint
          maxLength: 128
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        ip_allowlist:
          additionalProperties: true
          description: Allowed source IPs for push channels
          type:
          - object
          - 'null'
        is_active:
