info:
  description: 'Business-day processing and EOD/EOM/EOY batch orchestration, secure file exchange with partners, enterprise
    search across all entities, and data retention, archival, legal hold and certified purge.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — file-gateway-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/files/channels:
    get:
      operationId: fileChannelsList
      summary: List file channels
      tags:
      - File Channels
      security:
      - oauth2:
        - operations:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: counterparty_type
        in: query
        schema:
          type: string
          enum:
          - BANK
          - CARD_SCHEME
          - PAYMENT_RAIL
          - CREDIT_BUREAU
          - CARD_BUREAU
          - REGULATOR
          - PARTNER
          - ERP
          - BILLER
          - OTHER
      - name: protocol
        in: query
        schema:
          type: string
          enum:
          - SFTP
          - FTPS
          - S3
          - AZURE_BLOB
          - GCS
          - HTTPS_API
          - AS2
          - CONNECT_DIRECT
          - EMAIL
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          - BOTH
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileChannelPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - OPS-02
      x-service: file-gateway-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:read")'
      x-table: file_channel
      x-crud: true
      x-crud-list: true
    post:
      operationId: fileChannelsCreate
      summary: Create file channel
      tags:
      - File Channels
      security:
      - oauth2:
        - operations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileChannel'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileChannelCreate'
      x-requirements:
