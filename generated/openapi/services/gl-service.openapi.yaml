          format: date
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        legal_entity_id:
          description: Legal entity
          format: uuid
          type: string
        period_type:
          description: Day, month, quarter or year
