openapi: 3.1.0
info:
  title: Meridian Core — gl-service
  version: 1.0.0
  description: 'The single source of truth for money. A real-time, append-only double-entry ledger that every other service
    posts through, the general ledger and period close, and automated reconciliation.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Gl Accounts
  description: General ledger account in a legal entity's chart of accounts
- name: Gl Mapping Rules
  description: Maps ledger account types / products / transaction types to GL accounts
- name: Accounting Periods
  description: Accounting period per legal entity; closing is a logical cut-off with no downtime
- name: Gl Balances
  description: GL balance per account, period and currency, aggregated in real time from ledger events
- name: Gl Journals
  description: GL-level journal (aggregated from ledger postings or manual GL adjustments). Append-only. Manual journals post
    to the GL balances only once a gl_journal_approval exists for them; a gl_journal_rejection closes a manual journal without
    posting it (it no longer blocks the period close).
- name: Gl Journal Approvals
  description: Checker sign-off of a GL journal (four-eyes); posts the journal to the GL balances. Append-only.
- name: Gl Journal Rejections
  description: Checker rejection of a manual GL journal (four-eyes); the journal never posts. Append-only.
- name: Period Close Runs
  description: Execution of an EOD / EOM / EOY close with its checklist steps
- name: Ecl Provisions
  description: IFRS 9 expected credit loss provision per exposure and reporting date
- name: Erp Exports
  description: GL export batch sent to an external ERP (SAP, Oracle, NetSuite)
paths:
  /v1/gl/accounts:
    get:
      operationId: glAccountsList
      summary: List gl accounts
      tags:
      - Gl Accounts
      security:
      - oauth2:
        - ledger:read
