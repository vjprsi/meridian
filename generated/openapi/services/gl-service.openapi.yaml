info:
  description: 'The single source of truth for money. A real-time, append-only double-entry ledger that every other service
    posts through, the general ledger and period close, and automated reconciliation.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — gl-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/gl/accounts:
    get:
      operationId: glAccountsList
      summary: List gl accounts
      tags:
      - Gl Accounts
      security:
      - oauth2:
        - ledger:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: account_class
        in: query
        schema:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - INCOME
          - EXPENSE
          - CONTINGENT
      - name: parent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - CLOSED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlAccountPage'
        '400': &id001
