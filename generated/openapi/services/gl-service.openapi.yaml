          - ASSET
          - LIABILITY
          - EQUITY
          - INCOME
          - EXPENSE
          - CONTINGENT
      - name: parent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - CLOSED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlAccountPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - GL-01
      x-service: gl-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("ledger:read")'
      x-required-scope: ledger:read
      x-table: gl_account
      x-crud: true
      x-crud-list: true
    post:
      operationId: glAccountsCreate
      summary: Create gl account
      tags:
      - Gl Accounts
      security:
      - oauth2:
        - ledger:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlAccount'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlAccountCreate'
      x-requirements:
      - GL-01
      x-service: gl-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("ledger:write")'
      x-required-scope: ledger:write
      x-table: gl_account
      x-crud: true
      x-crud-create: true
