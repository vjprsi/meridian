openapi: 3.1.0
info:
  title: Meridian Core — reference-data-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Currencies
  description: ISO 4217 currency (plus supported digital currencies)
- name: Countries
  description: ISO 3166 country with banking and compliance attributes
- name: Languages
  description: Supported language / locale
- name: Holiday Calendars
  description: Business calendar for a country, rail, scheme or market (global or tenant-specific)
- name: Holidays
  description: A non-business day in a calendar
- name: Fx Rate Sources
  description: A provider of FX rates (market data feed, central bank, treasury desk)
- name: Fx Rates
  description: An FX rate observation for a currency pair and rate type (tenant rates include margins). Append-only.
- name: Banks
  description: Directory of banks and branches (BIC, national clearing codes, rail participation)
- name: Mcc Codes
  description: ISO 18245 merchant category code with risk attributes
- name: Purpose Codes
  description: ISO 20022 external purpose code for payments
paths:
