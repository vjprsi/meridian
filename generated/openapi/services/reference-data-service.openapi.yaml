        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-04
      - LED-03
      x-service: reference-data-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: currency
      x-crud: true
      x-crud-list: true
    post:
      operationId: currenciesCreate
      summary: Create currencie
      tags:
      - Currencies
      security:
      - oauth2:
        - platform:operator
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
        '400': *id001
