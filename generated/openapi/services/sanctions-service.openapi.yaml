openapi: 3.1.0
info:
  title: Meridian Core — sanctions-service
  version: 1.0.0
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Sanctions Lists
  description: A sanctions / PEP / adverse-media list and its loaded version (global lists have no tenant)
- name: Sanctions List Entries
  description: A listed person, entity, vessel or aircraft with aliases and identifiers
- name: Screening Requests
  description: A request to screen a customer, related party, payee or payment
- name: Screening Results
  description: Outcome of a screening request, reviewed by compliance when there are potential matches
- name: Screening Matches
  description: A candidate list entry matched for a screening result, with its disposition
- name: Screening Whitelist
  description: Good-guy list suppressing a known false positive for one subject and list entry
- name: Screening Batches
  description: Asynchronous bulk screening of up to 10,000 subjects (periodic rescreen, list update)
paths:
  /v1/risk/sanctions/lists:
    get:
      operationId: sanctionsListsList
      summary: List sanctions lists
      tags:
      - Sanctions Lists
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: source
        in: query
        schema:
          type: string
          enum:
          - OFAC_SDN
          - OFAC_CONSOLIDATED
          - UN
          - EU
          - UK_HMT
          - LOCAL_REGULATOR
          - PEP
          - ADVERSE_MEDIA
          - INTERNAL
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsListPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FRM-03
      - ONB-03
      x-service: sanctions-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-required-scope: risk:read
      x-table: sanctions_list
      x-crud: true
      x-crud-list: true
    post:
      operationId: sanctionsListsCreate
      summary: Create sanctions list
      tags:
      - Sanctions Lists
      security:
      - oauth2:
        - risk:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanctionsListCreate'
      x-requirements:
      - FRM-03
      - ONB-03
      x-service: sanctions-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("meridian:admin")'
      x-required-scope: meridian:admin
      x-table: sanctions_list
      x-crud: true
      x-crud-create: true
  /v1/risk/sanctions/lists/{id}:
    get:
      operationId: sanctionsListsGet
      summary: Retrieve sanctions list
      tags:
      - Sanctions Lists
      security:
      - oauth2:
        - risk:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FRM-03
      - ONB-03
      x-service: sanctions-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-required-scope: risk:read
      x-table: sanctions_list
      x-crud: true
      x-crud-get: true
    patch:
      operationId: sanctionsListsUpdate
      summary: Update sanctions list
      tags:
      - Sanctions Lists
      security:
      - oauth2:
        - risk:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanctionsListUpdate'
      x-requirements:
      - FRM-03
      - ONB-03
      x-service: sanctions-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("meridian:admin")'
      x-required-scope: meridian:admin
      x-table: sanctions_list
      x-crud: true
      x-crud-update: true
  /v1/risk/sanctions/lists/{id}/sync:
