components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    SanctionsListPage:
      type: object
      description: One page of SanctionsList results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SanctionsList'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    SanctionsListsSyncRequest:
      type: object
      properties:
        content:
          type: string
        format:
          type: string
          maxLength: 8
        list_version:
          type: string
          maxLength: 64
        published_at:
          type: string
          format: date-time
    SanctionsListEntryPage:
      type: object
      description: One page of SanctionsListEntry results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SanctionsListEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    SanctionsListsImportRequest:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        content:
          type: string
        format:
          type: string
          maxLength: 8
    ScreeningRequestPage:
      type: object
      description: One page of ScreeningRequest results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningRequest'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ScreeningRequestsScreenPaymentRequest:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
        threshold:
          type: string
          format: decimal
          examples:
          - '125.50'
        correlation_id:
          type: string
          maxLength: 128
      required:
      - payment_id
      - payload
    ScreeningRequestsBatchRequest:
      type: object
      properties:
        subjects:
          type: array
          items: {}
        trigger:
          type: string
          enum:
          - ONBOARDING
          - CUSTOMER_CHANGE
          - PERIODIC_RESCREEN
          - LIST_UPDATE
          - PAYMENT
          - MANUAL
        threshold:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - subjects
      - trigger
    ScreeningResultPage:
      type: object
      description: One page of ScreeningResult results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningResult'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ScreeningMatchPage:
      type: object
      description: One page of ScreeningMatch results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningMatch'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ScreeningResultsReviewRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - CLEAR
          - POTENTIAL_MATCH
          - CONFIRMED_MATCH
          - FALSE_POSITIVE
          - ERROR
        decision_reason:
          type: string
        whitelist_false_positives:
          type: boolean
      required:
      - status
      - decision_reason
    ScreeningWhitelistPage:
      type: object
      description: One page of ScreeningWhitelist results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningWhitelist'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ScreeningBatchPage:
      type: object
      description: One page of ScreeningBatch results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningBatch'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    SanctionsList:
      type: object
      description: A sanctions / PEP / adverse-media list and its loaded version (global lists have no tenant)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        owner_tenant_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Owning tenant (lists created through the API); empty for platform-managed global lists
          readOnly: true
        source:
          type: string
          enum:
          - OFAC_SDN
          - OFAC_CONSOLIDATED
          - UN
          - EU
          - UK_HMT
          - LOCAL_REGULATOR
          - PEP
          - ADVERSE_MEDIA
          - INTERNAL
          description: Publisher
        code:
          type: string
          maxLength: 64
          description: List code, e.g. OFAC_SDN
        name:
          type: string
          maxLength: 160
          description: List name
        list_version:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Publisher version / publication id
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Publication time
        loaded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time loaded into Meridian
          readOnly: true
        entry_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Active entries
          readOnly: true
        content_sha256:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Hash of the last loaded file (unchanged files are skipped)
          readOnly: true
        source_url:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Download location
        is_active:
          type: boolean
          description: Used for screening
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
