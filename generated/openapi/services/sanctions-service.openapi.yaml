info:
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — sanctions-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/risk/sanctions/lists:
    get:
      operationId: sanctionsListsList
      summary: List sanctions lists
      tags:
      - Sanctions Lists
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: source
        in: query
        schema:
          type: string
          enum:
          - OFAC_SDN
          - OFAC_CONSOLIDATED
          - UN
          - EU
          - UK_HMT
          - LOCAL_REGULATOR
          - PEP
          - ADVERSE_MEDIA
          - INTERNAL
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsListPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FRM-03
      - ONB-03
      x-service: sanctions-service
      x-table: sanctions_list
      x-crud: true
      x-crud-list: true
    post:
      operationId: sanctionsListsCreate
      summary: Create sanctions list
      tags:
      - Sanctions Lists
      security:
      - oauth2:
        - risk:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
