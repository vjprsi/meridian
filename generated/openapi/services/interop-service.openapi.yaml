openapi: 3.1.0
info:
  title: Meridian Core — interop-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Interop Switches
  description: A connected switch or partner network
- name: Interop Participants
  description: Another wallet, bank or MFI reachable through a switch
- name: Interop Quotes
  description: A quote for an interoperable transfer (fees and amounts agreed before transfer)
- name: Interop Transfers
  description: A two-phase transfer to or from another participant
paths:
  /v1/interop-switches:
    get:
      operationId: interopSwitchesList
      summary: List interop switches
      tags:
      - Interop Switches
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: switch_type
        in: query
        schema:
          type: string
          enum:
          - NATIONAL_SWITCH
          - MOJALOOP_HUB
          - WALLET_PARTNER
          - BANK_PARTNER
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteropSwitchPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - WAL-08
      x-service: interop-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: interop_switch
      x-crud: true
      x-crud-list: true
    post:
      operationId: interopSwitchesCreate
      summary: Create interop switche
      tags:
      - Interop Switches
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteropSwitch'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteropSwitchCreate'
      x-requirements:
      - WAL-08
      x-service: interop-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: interop_switch
      x-crud: true
      x-crud-create: true
