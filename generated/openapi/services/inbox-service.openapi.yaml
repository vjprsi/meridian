      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureMessageThread'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureMessageThreadUpdate'
      x-requirements:
      - ENG-05
      x-service: inbox-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:write")'
      x-required-scope: engagement:write
      x-table: secure_message_thread
      x-crud: true
      x-crud-update: true
  /v1/inbox/threads/{id}/messages:
