openapi: 3.1.0
info:
  title: Meridian Core — inbox-service
  version: 1.0.0
  description: 'Customer engagement: loyalty rewards, points and cashback, referral programs, transaction enrichment and personal
    finance insights (PFM), targeted campaigns and personalised offers, and secure customer messaging.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Secure Message Threads
  description: A secure conversation between a customer and the bank
- name: Secure Messages
  description: One message in a secure thread with attachments and read receipt. Append-only.
- name: Announcements
  description: In-app banner or announcement targeted to all customers or segments
paths:
  /v1/inbox/threads:
    get:
      operationId: secureMessageThreadsList
      summary: List secure message threads
      tags:
      - Secure Message Threads
      security:
      - oauth2:
        - engagement:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - AWAITING_CUSTOMER
          - AWAITING_BANK
          - CLOSED
      - name: topic
        in: query
        schema:
          type: string
          maxLength: 64
      - name: assigned_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: work_queue_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureMessageThreadPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ENG-05
      x-service: inbox-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:read")'
      x-required-scope: engagement:read
      x-table: secure_message_thread
      x-crud: true
      x-crud-list: true
    post:
      operationId: secureMessageThreadsCreate
      summary: Create secure message thread
      tags:
      - Secure Message Threads
      security:
      - oauth2:
        - engagement:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureMessageThread'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureMessageThreadCreate'
      x-requirements:
      - ENG-05
      x-service: inbox-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:write")'
      x-required-scope: engagement:write
      x-table: secure_message_thread
      x-crud: true
      x-crud-create: true
  /v1/inbox/threads/{id}:
