info:
  description: 'Customer engagement: loyalty rewards, points and cashback, referral programs, transaction enrichment and personal
    finance insights (PFM), targeted campaigns and personalised offers, and secure customer messaging.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — inbox-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/inbox/threads:
    get:
      operationId: secureMessageThreadsList
      summary: List secure message threads
      tags:
      - Secure Message Threads
      security:
      - oauth2:
        - engagement:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - AWAITING_CUSTOMER
          - AWAITING_BANK
          - CLOSED
      - name: topic
        in: query
        schema:
          type: string
          maxLength: 64
      - name: assigned_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
