components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    StatementPage:
      type: object
      description: One page of Statement results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Statement'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    StatementLinePage:
      type: object
      description: One page of StatementLine results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    StatementsResendRequest:
      type: object
      properties:
        delivery_channel:
          type: string
          enum:
          - EMAIL
          - IN_APP
          - POST
          - SFTP
          - API
        email:
          type: string
          format: email
          maxLength: 320
    StatementSchedulePage:
      type: object
      description: One page of StatementSchedule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatementSchedule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TaxCertificatePage:
      type: object
      description: One page of TaxCertificate results (newest first)
      properties:
