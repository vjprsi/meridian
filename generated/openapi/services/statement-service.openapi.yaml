      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: deposit_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: delivery_channel
        in: query
        schema:
          type: string
          enum:
          - EMAIL
          - IN_APP
          - POST
          - SFTP
          - API
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementSchedulePage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - DEP-06
      - NOT-02
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: statement_schedule
      x-crud: true
      x-crud-list: true
    post:
      operationId: statementSchedulesCreate
      summary: Create statement schedule
      tags:
      - Statement Schedules
      security:
      - oauth2:
        - accounts:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementSchedule'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementScheduleCreate'
      x-requirements:
      - DEP-06
      - NOT-02
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: statement_schedule
      x-crud: true
      x-crud-create: true
  /v1/statement-schedules/{id}:
    get:
      operationId: statementSchedulesGet
      summary: Retrieve statement schedule
      tags:
      - Statement Schedules
      security:
      - oauth2:
        - accounts:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementSchedule'
        '400': *id001
