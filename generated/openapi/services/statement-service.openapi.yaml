        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type: string
        customer_id:
          description: Customer
          format: uuid
          type: string
        deposit_account_id:
          description: Account (empty = all accounts)
          format: uuid
          type: string
        period_end:
          description: Period end
          format: date
          type: string
        period_start:
          description: Period start
          format: date
          type: string
        tax_year:
          description: Tax year
          format: int32
          type: integer
      required:
      - customer_id
      - certificate_type
      - tax_year
      - period_start
      - period_end
      - currency
      type: object
    TaxCertificatePage:
      description: One page of TaxCertificate results (newest first)
      properties:
        data:
          items:
            $ref: '#/components/schemas/TaxCertificate'
          type: array
        has_more:
          type: boolean
        next_cursor:
          description: Pass as ?cursor= to fetch the next page
          type:
          - string
          - 'null'
      required:
      - data
      - has_more
      type: object
