openapi: 3.1.0
info:
  title: Meridian Core — statement-service
  version: 1.0.0
  description: 'Deposit account servicing on top of the ledger: current, savings, call and notice accounts, term deposits,
    savings pots, sweeps, standing orders, overdrafts, holders and mandates, blocks, dormancy, closure, cheques, virtual accounts,
    daily interest accrual and capitalisation, fee charging, statements and tax certificates.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Statements
  description: Account statement for a period
- name: Statement Schedules
  description: Statement delivery preferences per account
- name: Tax Certificates
  description: Interest / withholding tax certificate or annual summary for a customer
paths:
  /v1/statements:
    get:
      operationId: statementsList
      summary: List statements
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: deposit_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: period_end
        in: query
        schema:
          type: string
          format: date
      - name: format
        in: query
        schema:
          type: string
          enum:
          - PDF
          - CSV
          - CAMT_053
          - MT940
          - OFX
          - JSON
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - GENERATING
          - READY
          - DELIVERED
          - FAILED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: statement
      x-crud: true
      x-crud-list: true
    post:
      operationId: statementsCreate
      summary: Create statement
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementCreate'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: statement
      x-crud: true
      x-crud-create: true
  /v1/statements/{id}:
    get:
      operationId: statementsGet
      summary: Retrieve statement
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: statement
      x-crud: true
      x-crud-get: true
  /v1/statements/{id}/lines:
    get:
      operationId: statementsLines
      summary: Lines of the statement
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementLinePage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: statement
  /v1/statements/{id}/download:
    get:
      operationId: statementsDownload
      summary: Statement file; Content-Type follows the format (application/pdf, text/csv, application/xml, text/plain, application/x-ofx,
        application/json); expires and signature come from download-link
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expires
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: signature
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: statement
  /v1/statements/{id}/download-link:
    get:
      operationId: statementsDownloadLink
      summary: Signed, expiring download URL (url, expires_at, checksum)
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: statement
  /v1/statements/{id}/resend:
    post:
      operationId: statementsResend
      summary: Deliver the statement again
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementsResendRequest'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: statement
  /v1/statements/{id}/regenerate:
    post:
      operationId: statementsRegenerate
      summary: Regenerate a failed statement
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: statement
  /v1/statements/cycle:
    post:
      operationId: statementsCycle
      summary: End of day - generate and deliver statements for schedules whose cycle ends on business_date (idempotent per
        business date)
      tags:
      - Statements
      security:
      - oauth2:
        - accounts:write
      parameters:
      - name: business_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - DEP-06
      x-service: statement-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: statement
  /v1/statement-schedules:
