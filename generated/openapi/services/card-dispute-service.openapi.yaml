    CardDispute:
      type: object
      description: A cardholder dispute and its scheme chargeback lifecycle
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        card_id:
          type: string
          format: uuid
          description: Card
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Cardholder (from the card)
          readOnly: true
        ledger_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Cardholder account (from the card)
          readOnly: true
        card_authorization_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Disputed authorisation
        clearing_record_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Disputed presentment
        category:
          type: string
          enum:
          - FRAUD
          - AUTHORIZATION
          - PROCESSING_ERROR
          - CONSUMER_DISPUTE
          - NOT_RECEIVED
          - NOT_AS_DESCRIBED
          - DUPLICATE
          - CANCELLED_RECURRING
          - CREDIT_NOT_PROCESSED
          - ATM_DISPUTE
          description: Dispute category
        scheme:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
          description: Scheme
        reason_code:
          type:
          - string
          - 'null'
          maxLength: 8
          description: Scheme reason code, e.g. 10.4, 4837
        transaction_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of the disputed transaction (drives scheme time limits)
        stage:
          type: string
          enum:
          - INQUIRY
          - RETRIEVAL
          - FIRST_CHARGEBACK
          - REPRESENTMENT
          - PRE_ARBITRATION
          - ARBITRATION
          - CLOSED
          description: Scheme stage
          readOnly: true
        status:
          type: string
          enum:
          - OPEN
          - AWAITING_CUSTOMER
          - AWAITING_MERCHANT
          - SUBMITTED
          - WON
          - LOST
          - WITHDRAWN
          - EXPIRED
          description: Status
          readOnly: true
        disputed_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount disputed
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        chargeback_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount charged back to the acquirer
          readOnly: true
        representment_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount the merchant re-presented
          readOnly: true
        provisional_credit_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Provisional credit given
          readOnly: true
        provisional_credit_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Provisional credit posting
          readOnly: true
        provisional_credit_reversed:
          type: boolean
          description: Provisional credit was reversed
          readOnly: true
        scheme_case_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Scheme case number
        customer_description:
          type:
          - string
          - 'null'
          description: Cardholder statement
        assigned_to:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Analyst (changed by assign)
          readOnly: true
        stage_deadline:
          type:
          - string
          - 'null'
          format: date
          description: Deadline for the current stage
          readOnly: true
        regulatory_deadline:
          type:
          - string
          - 'null'
          format: date
          description: Regulation E / Z or local deadline
          readOnly: true
        submitted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Chargeback submission time
          readOnly: true
        outcome:
          type:
          - string
          - 'null'
          enum:
          - WON
          - LOST
          - SPLIT
          - WITHDRAWN
          - EXPIRED
          description: WON, LOST, SPLIT, WITHDRAWN, EXPIRED
          readOnly: true
        recovered_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount recovered from the merchant
          readOnly: true
        written_off_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount written off
          readOnly: true
        outcome_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Final outcome posting
          readOnly: true
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Closure time
          readOnly: true
        suggested_reason_code:
          type:
          - string
          - 'null'
          maxLength: 8
          description: Reason code suggested by the copilot
          readOnly: true
        ai_summary:
          type:
          - string
          - 'null'
          description: Copilot summary and suggested reason code
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - card_id
      - category
      - scheme
      - stage
      - status
      - disputed_amount
      - currency
      - provisional_credit_amount
      - provisional_credit_reversed
      - recovered_amount
      - written_off_amount
