openapi: 3.1.0
info:
  title: Meridian Core — card-dispute-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Card Disputes
  description: A cardholder dispute and its scheme chargeback lifecycle
- name: Card Dispute Evidence
  description: Evidence attached to a dispute
paths:
  /v1/card-disputes:
    get:
      operationId: cardDisputesList
      summary: List card disputes
      tags:
      - Card Disputes
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: card_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - AWAITING_CUSTOMER
          - AWAITING_MERCHANT
          - SUBMITTED
          - WON
          - LOST
          - WITHDRAWN
          - EXPIRED
      - name: stage
        in: query
        schema:
          type: string
          enum:
          - INQUIRY
          - RETRIEVAL
          - FIRST_CHARGEBACK
          - REPRESENTMENT
          - PRE_ARBITRATION
          - ARBITRATION
          - CLOSED
      - name: category
        in: query
        schema:
          type: string
          enum:
          - FRAUD
          - AUTHORIZATION
          - PROCESSING_ERROR
          - CONSUMER_DISPUTE
          - NOT_RECEIVED
          - NOT_AS_DESCRIBED
          - DUPLICATE
          - CANCELLED_RECURRING
          - CREDIT_NOT_PROCESSED
          - ATM_DISPUTE
      - name: scheme
        in: query
        schema:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
      - name: assigned_to
        in: query
        schema:
          type: string
          maxLength: 64
      - name: scheme_case_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: clearing_record_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDisputePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-08
      x-service: card-dispute-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_dispute
      x-crud: true
      x-crud-list: true
    post:
      operationId: cardDisputesCreate
      summary: Create card dispute
      tags:
      - Card Disputes
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardDisputeCreate'
      x-requirements:
      - CRD-08
      x-service: card-dispute-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_dispute
      x-crud: true
      x-crud-create: true
  /v1/card-disputes/{id}:
