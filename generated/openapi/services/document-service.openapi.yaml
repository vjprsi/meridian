      x-requirements:
      - ADM-03
      - DEP-06
      - ONB-02
      x-service: document-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-table: document
      x-crud: true
      x-crud-update: true
    delete:
      operationId: documentsDelete
      summary: Delete document
      tags:
