openapi: 3.1.0
info:
  title: Meridian Core — document-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Documents
  description: A stored file (KYC document, statement, contract, report) owned by a business object
- name: Document Templates
  description: Versioned template for generated documents (statements, contracts, letters, receipts)
- name: Generated Documents
  description: A document produced from a template and input data
- name: Esign Requests
  description: Electronic signature envelope for one or more signers
paths:
  /v1/documents:
    get:
      operationId: documentsList
      summary: List documents
      tags:
      - Documents
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: owner_type
        in: query
        schema:
          type: string
          maxLength: 40
      - name: owner_id
        in: query
        schema:
          type: string
          format: uuid
      - name: document_type
        in: query
        schema:
          type: string
          enum:
          - ID_CARD
          - PASSPORT
          - DRIVING_LICENSE
          - RESIDENCE_PERMIT
          - PROOF_OF_ADDRESS
          - SELFIE
          - VIDEO
          - BANK_STATEMENT
          - ACCOUNT_STATEMENT
          - CONTRACT
          - LOAN_AGREEMENT
          - INVOICE
          - RECEIPT
          - REPORT
          - CERTIFICATE
          - CORPORATE_DOCUMENT
          - LOGO
          - EXPORT
          - OTHER
      - name: status
        in: query
        schema:
          type: string
          enum:
          - UPLOADING
          - SCANNING
          - AVAILABLE
          - QUARANTINED
          - ARCHIVED
          - DELETED
      - name: classification
        in: query
        schema:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - RESTRICTED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-03
      - DEP-06
      - ONB-02
      x-service: document-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-table: document
      x-crud: true
      x-crud-list: true
    post:
      operationId: documentsCreate
      summary: Create document
      tags:
      - Documents
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      x-requirements:
      - ADM-03
      - DEP-06
      - ONB-02
      x-service: document-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-table: document
      x-crud: true
      x-crud-create: true
  /v1/documents/{id}:
