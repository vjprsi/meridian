      security:
      - oauth2:
        - platform:write
      parameters: *id006
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      - DEP-06
      - ONB-02
      x-service: document-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-table: document
      x-crud: true
      x-crud-delete: true
