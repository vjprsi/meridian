      type: object
      description: A card program on a BIN range with a scheme, funding model and sponsor
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        code:
          type: string
          maxLength: 32
          description: Short program code
        name:
          type: string
          maxLength: 120
          description: Program name
        legal_entity_id:
          type: string
          format: uuid
          description: Issuing legal entity
        scheme:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
          description: Card scheme
        program_type:
          type: string
          enum:
          - CONSUMER
          - BUSINESS
          - CORPORATE
          - EXPENSE
          - GIFT
          - PAYROLL
          - GOVERNMENT
          description: Program segment
        funding_model:
          type: string
          enum:
          - DEBIT
          - PREPAID
          - CREDIT
          - JIT
          description: How authorisations are funded
        bin:
          type: string
          maxLength: 11
          description: Issuer BIN (6 or 8 digits)
        bin_range_start:
          type: string
          maxLength: 19
          description: First PAN prefix in the account range (starts with the BIN)
        bin_range_end:
          type: string
          maxLength: 19
          description: Last PAN prefix in the account range (same length as the start)
        pan_length:
          type: integer
          format: int32
          description: PAN length (13-19, including the Luhn check digit)
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Billing currency (ISO 4217)
        country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Issuing country; a merchant in another country makes the transaction international (ISO 3166-1 alpha-2)
        sponsor_bank:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Sponsor / BIN sponsor bank
        processor_member_id:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Scheme member / ICA / BID
        ledger_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Program settlement / funding account (JIT holds are placed here)
        jit_webhook_url:
          type:
          - string
          - 'null'
          maxLength: 500
          description: JIT funding endpoint of the client
        jit_timeout_ms:
          type: integer
          format: int32
          description: JIT response budget in milliseconds
        stand_in_enabled:
          type: boolean
          description: Approve under stand-in rules when the core is unavailable
        stand_in_max_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Maximum amount approved in stand-in
        fraud_policy:
          type: string
          enum:
          - FAIL_OPEN
          - FAIL_CLOSED
          description: Decision when fraud scoring times out or fails
        fraud_timeout_ms:
          type: integer
          format: int32
          description: Fraud scoring budget in milliseconds
        fraud_decline_score:
          type: integer
          format: int32
          description: Decline when the fraud score is at or above this value (0-1000)
        fx_markup_rate:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Issuer FX markup on cross-currency transactions, e.g. 0.02 = 2%
        auth_hold_days:
          type: integer
          format: int32
          description: Days before an uncleared authorisation hold expires
        renewal_window_days:
          type: integer
          format: int32
          description: Days before expiry a card is reported as expiring
        default_controls:
          type:
