          - object
          - 'null'
        response_code:
          description: ISO response code (DE39)
          maxLength: 3
          readOnly: true
          type:
          - string
          - 'null'
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        rrn:
          description: Retrieval reference number (DE37)
          maxLength: 12
          type:
          - string
          - 'null'
        settlement_amount:
