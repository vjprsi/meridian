info:
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — card-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/card-programs:
    get:
      operationId: cardProgramsList
      summary: List card programs
      tags:
      - Card Programs
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: scheme
        in: query
        schema:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
      - name: funding_model
        in: query
        schema:
          type: string
          enum:
          - DEBIT
          - PREPAID
          - CREDIT
          - JIT
      - name: program_type
        in: query
        schema:
          type: string
          enum:
          - CONSUMER
          - BUSINESS
          - CORPORATE
          - EXPENSE
          - GIFT
          - PAYROLL
          - GOVERNMENT
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - CERTIFICATION
          - ACTIVE
          - SUSPENDED
          - RETIRED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgramPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-01
      x-service: card-service
      x-table: card_program
      x-crud: true
      x-crud-list: true
    post:
      operationId: cardProgramsCreate
      summary: Create card program
      tags:
      - Card Programs
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
