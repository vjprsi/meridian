components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    Card:
      description: A payment card. Holds only tokens and masked data; PAN and CVV live in the vault.
      properties:
        activated_at:
          description: Activation time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        bin:
          description: BIN
          maxLength: 11
          readOnly: true
          type: string
        business_customer_id:
          description: Company for business / corporate cards
          format: uuid
          type:
          - string
          - 'null'
        card_product_id:
          description: Product
          format: uuid
          type: string
        card_program_id:
          description: Program
          format: uuid
          type: string
        cardholder_name:
          description: Name as embossed
          maxLength: 26
          type: string
        closed_at:
          description: Closure time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        credit_line_id:
          description: Linked credit line (credit cards)
          format: uuid
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Cardholder customer
          format: uuid
          type: string
        deposit_account_id:
          description: Linked deposit account (debit cards)
          format: uuid
          type:
          - string
          - 'null'
        expiry_month:
          description: Expiry month 1-12
          format: int32
          readOnly: true
          type: integer
        expiry_year:
          description: Expiry year (4 digits)
          format: int32
          readOnly: true
          type: integer
        form_factor:
          description: Virtual or physical
          enum:
          - VIRTUAL
          - PHYSICAL
          type: string
        frozen_at:
          description: Last freeze time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        last4:
          description: Last four digits
          maxLength: 4
          readOnly: true
          type: string
        ledger_account_id:
          description: Ledger account authorisations hold and post against
          format: uuid
          type: string
        linked_account_type:
          description: Kind of funding account
          enum:
          - DEPOSIT_ACCOUNT
          - WALLET
          - CREDIT_LINE
          - PREPAID_LEDGER
          - JIT_PROGRAM
          type: string
        metadata:
          additionalProperties: true
          description: Client-defined key/value metadata
          type:
          - object
          - 'null'
        nickname:
          description: Cardholder nickname
          maxLength: 64
          type:
          - string
          - 'null'
        pan_fingerprint:
          description: Keyed hash of the PAN for de-duplication and lookup
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        pan_token:
          description: Vault token of the PAN
          maxLength: 64
          readOnly: true
          type: string
        pin_set:
          description: Whether a PIN has been set
          readOnly: true
          type: boolean
        pin_try_count:
          description: Consecutive wrong PIN attempts
          format: int32
          readOnly: true
          type: integer
        replaces_card_id:
          description: Card this one replaced
          format: uuid
          type:
          - string
          - 'null'
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        sequence_number:
          description: PAN sequence number (PSN)
          format: int32
          readOnly: true
          type: integer
        status:
          description: Lifecycle status
          enum:
          - CREATED
          - ACTIVE
          - FROZEN
          - BLOCKED
          - LOST
          - STOLEN
          - EXPIRED
          - CLOSED
          - REPLACED
          type: string
        status_reason:
          description: Reason for the current status
          maxLength: 255
          type:
          - string
          - 'null'
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        wallet_id:
          description: Linked wallet (prepaid / wallet cards)
          format: uuid
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - card_program_id
      - card_product_id
      - customer_id
      - pan_token
      - bin
      - last4
      - expiry_month
      - expiry_year
      - sequence_number
      - cardholder_name
      - form_factor
      - status
      - linked_account_type
      - ledger_account_id
      - pin_set
      - pin_try_count
