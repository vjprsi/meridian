          type:
          - string
          - 'null'
          format: uuid
          description: Linked deposit account (debit cards)
        wallet_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Linked wallet (prepaid / wallet cards)
        credit_line_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Linked credit line (credit cards)
        replaces_card_id:
          type:
          - string
          - 'null'
          format: uuid
