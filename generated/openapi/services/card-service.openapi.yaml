          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        settlement_currency:
          description: Settlement currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type:
          - string
          - 'null'
        stan:
