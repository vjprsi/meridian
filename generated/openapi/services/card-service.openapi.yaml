          readOnly: true
          type:
          - string
          - 'null'
        avs_result:
          description: Address verification result
          maxLength: 1
          type:
          - string
          - 'null'
        billing_amount:
          description: Amount in card billing currency (DE6)
          examples:
          - '125.50'
          format: decimal
          type: string
        billing_currency:
          description: Billing currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        card_id:
          description: Card
          format: uuid
          type: string
        card_present:
          description: Card present
          type: boolean
        card_program_id:
          description: Program
          format: uuid
          type: string
        card_token_id:
