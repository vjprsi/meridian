          type: string
          enum:
          - VIRTUAL
          - PHYSICAL
          description: Virtual or physical
        status:
          type: string
          enum:
          - CREATED
          - ACTIVE
          - FROZEN
          - BLOCKED
          - LOST
          - STOLEN
          - EXPIRED
          - CLOSED
          - REPLACED
          description: Lifecycle status (changed by actions only)
