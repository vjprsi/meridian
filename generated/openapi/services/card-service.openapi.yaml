      description: One authorisation message and its decision (auth, incremental, reversal, advice)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        card_id:
          type: string
          format: uuid
          description: Card
        card_program_id:
          type: string
          format: uuid
          description: Program (from the card)
          readOnly: true
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Cardholder (from the card)
          readOnly: true
        message_type:
          type: string
          enum:
          - AUTHORIZATION
          - FINANCIAL
          - INCREMENTAL
          - REVERSAL
          - PARTIAL_REVERSAL
          - ADVICE
          - BALANCE_INQUIRY
          - ACCOUNT_VERIFICATION
          - REFUND_AUTH
          description: Message type
        mti:
          type: string
          maxLength: 4
          description: ISO 8583 message type indicator
        processing_code:
          type:
          - string
          - 'null'
          maxLength: 6
          description: ISO 8583 DE3 (00 purchase, 01 cash, 20 refund, 30 balance inquiry)
        stan:
          type:
          - string
          - 'null'
          maxLength: 12
          description: System trace audit number (DE11)
        rrn:
          type:
          - string
          - 'null'
          maxLength: 12
          description: Retrieval reference number (DE37)
        auth_code:
          type:
          - string
          - 'null'
          maxLength: 6
          description: Approval code (DE38)
          readOnly: true
        response_code:
          type:
          - string
          - 'null'
          maxLength: 3
          description: ISO response code (DE39)
          readOnly: true
        network_transaction_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Scheme transaction id (trace id / banknet ref)
        parent_authorization_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Original auth for incremental, reversal or advice
        pos_entry_mode:
          type: string
          enum:
          - CHIP
          - CONTACTLESS
          - MAGSTRIPE
          - MANUAL
          - ECOMMERCE
          - CREDENTIAL_ON_FILE
          - TOKEN
          - FALLBACK
          - UNKNOWN
          description: POS entry mode
        channel:
          type: string
          enum:
          - ECOM
          - POS
          - ATM
          - CONTACTLESS
          - MOTO
          - RECURRING
          - ANY
          description: Channel
        card_present:
          type: boolean
          description: Card present
        cardholder_present:
          type: boolean
          description: Cardholder present
        merchant_id:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Card acceptor id (DE42)
        merchant_name:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Card acceptor name
        merchant_city:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Merchant city
        merchant_country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Merchant country (ISO 3166-1 alpha-2)
        mcc:
          type:
          - string
          - 'null'
          maxLength: 4
          description: Merchant category code
        acquirer_id:
          type:
          - string
          - 'null'
          maxLength: 16
          description: Acquiring institution id (DE32)
        terminal_id:
          type:
          - string
          - 'null'
          maxLength: 16
          description: Terminal id (DE41)
        transaction_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount in transaction currency (DE4)
        transaction_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Transaction currency (ISO 4217)
        billing_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount in card billing currency (DE6), incl. issuer FX markup
          readOnly: true
        billing_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Billing currency (program currency) (ISO 4217)
          readOnly: true
        settlement_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Settlement amount (DE5)
        settlement_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Settlement currency (ISO 4217)
        conversion_rate:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Billing conversion rate (DE10); reference rate used when absent
        fx_markup:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Issuer FX markup included in billing_amount
          readOnly: true
        approved_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Approved amount in billing currency (partial approvals)
          readOnly: true
        reversed_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount reversed so far
          readOnly: true
        decision:
          type:
          - string
          - 'null'
          enum:
          - APPROVED
          - DECLINED
          - PARTIAL
          description: Decision
          readOnly: true
        decline_reason:
          type:
          - string
          - 'null'
          enum:
          - INSUFFICIENT_FUNDS
          - CARD_INACTIVE
          - CARD_FROZEN
          - CARD_EXPIRED
          - INVALID_PIN
          - PIN_TRIES_EXCEEDED
          - CONTROL_MCC
          - CONTROL_MERCHANT
          - CONTROL_COUNTRY
          - CONTROL_CHANNEL
          - LIMIT_EXCEEDED
          - VELOCITY_EXCEEDED
          - FRAUD_SUSPECTED
          - JIT_DECLINED
          - JIT_TIMEOUT
          - INVALID_CVV
          - INVALID_EXPIRY
          - THREEDS_FAILED
          - SYSTEM_ERROR
          - OTHER
          - CARD_LOST
          - CARD_STOLEN
          - CARD_BLOCKED
          - PROGRAM_SUSPENDED
          - RULE_DECLINED
          - CONTROL_AMOUNT
          - CONTROL_TIME
          - CONTROL_CURRENCY
          - ORIGINAL_NOT_FOUND
          description: Internal decline reason
          readOnly: true
        decline_detail:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Human-readable explanation of the decline
          readOnly: true
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - REVERSED
          - PARTIALLY_REVERSED
          - EXPIRED
          - CLEARED
          - PARTIALLY_CLEARED
          description: Lifecycle status
          readOnly: true
        funding_source:
          type:
          - string
          - 'null'
          enum:
          - LEDGER_HOLD
          - JIT
          - STAND_IN
          - NONE
          description: How the approval was funded
          readOnly: true
        fraud_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Fraud score 0-1000
          readOnly: true
        fraud_decision:
          type:
          - string
          - 'null'
          maxLength: 16
          description: ALLOW, REVIEW, BLOCK, STEP_UP, UNAVAILABLE
          readOnly: true
        fraud_score_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Fraud evaluation
          readOnly: true
        fraud_alert_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Fraud alert raised
        authorization_rule_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Rule that decided, if any
          readOnly: true
        hold_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Ledger hold placed
          readOnly: true
        hold_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Ledger account the hold is on
          readOnly: true
        jit_used:
          type: boolean
          description: JIT funding was called
          readOnly: true
        jit_result:
          type:
          - string
          - 'null'
          enum:
          - APPROVED
          - DECLINED
          - TIMEOUT
          - ERROR
          description: JIT outcome
          readOnly: true
        jit_latency_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: JIT round-trip latency
          readOnly: true
        stand_in:
          type: boolean
          description: Decided in stand-in
          readOnly: true
        card_token_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Network token used, if any
        threeds_authentication_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 3DS authentication
        eci:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Electronic commerce indicator
        cvv_result:
          type:
          - string
          - 'null'
          maxLength: 1
          description: CVV2 verification result (M match, N no match, P not processed)
          readOnly: true
        avs_result:
          type:
          - string
          - 'null'
          maxLength: 1
          description: Address verification result
        pin_verified:
          type:
          - boolean
          - 'null'
          description: PIN verification outcome
          readOnly: true
        is_recurring:
          type: boolean
          description: Recurring / credential on file
        is_international:
          type: boolean
          description: Cross-border (merchant country differs from the program country)
          readOnly: true
        processing_time_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: End-to-end decision time inside Meridian
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time the hold auto-releases
          readOnly: true
        cleared_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount cleared so far
          readOnly: true
        raw_message:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Parsed ISO 8583 fields (sensitive fields removed)
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - card_id
      - card_program_id
      - message_type
      - mti
      - pos_entry_mode
      - channel
      - card_present
      - cardholder_present
      - transaction_amount
      - transaction_currency
      - billing_amount
      - billing_currency
      - reversed_amount
      - status
