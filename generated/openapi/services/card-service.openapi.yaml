openapi: 3.1.0
info:
  title: Meridian Core — card-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Card Programs
  description: A card program on a BIN range with a scheme, funding model and sponsor
- name: Card Products
  description: A card product inside a program (design, plastic, validity, PIN and fee settings)
- name: Card Bureaus
  description: Card manufacturing / personalisation bureau configuration
- name: Cards
  description: Issue and manage cards. A virtual card is issued ACTIVE instantly; the PAN is generated from the program's
    account range (Luhn) and stored only in card-vault-service. Sensitive card data is shown only through the vault reveal
    endpoint.
- name: Card Orders
  description: A physical card production and shipping order
- name: Card Controls
  description: A spending control on a card or on all cards of a program
- name: Card Spend Limits
  description: Amount and velocity limits per period on a card or program
- name: Card Replacements
  description: A request to replace a card (lost, stolen, damaged, expiring)
- name: Card Statement Cycles
  description: Billing cycle of a credit card, linked to the credit line in lending
paths:
  /v1/card-programs:
    get:
      operationId: cardProgramsList
      summary: List card programs
      tags:
      - Card Programs
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: scheme
        in: query
        schema:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
      - name: funding_model
        in: query
        schema:
          type: string
          enum:
          - DEBIT
          - PREPAID
          - CREDIT
          - JIT
      - name: program_type
        in: query
        schema:
          type: string
          enum:
          - CONSUMER
          - BUSINESS
          - CORPORATE
          - EXPENSE
          - GIFT
          - PAYROLL
          - GOVERNMENT
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - CERTIFICATION
          - ACTIVE
          - SUSPENDED
          - RETIRED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgramPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-01
      x-service: card-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_program
      x-crud: true
      x-crud-list: true
    post:
      operationId: cardProgramsCreate
      summary: Create card program
      tags:
      - Card Programs
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgram'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardProgramCreate'
      x-requirements:
      - CRD-01
      x-service: card-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_program
      x-crud: true
      x-crud-create: true
