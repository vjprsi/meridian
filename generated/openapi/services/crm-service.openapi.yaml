      security:
      - oauth2:
        - servicing:write
      parameters: *id006
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - SRV-01
      x-service: crm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("servicing:write")'
      x-table: sla_policy
      x-crud: true
      x-crud-delete: true
