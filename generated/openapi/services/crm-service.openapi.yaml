          - SERVICE_REQUEST
          - INQUIRY
          - CARD_ISSUE
          - PAYMENT_ISSUE
          - ACCOUNT_MAINTENANCE
          - DOCUMENT_REQUEST
          - FRAUD_REPORT
          - TECHNICAL_ISSUE
          - LOAN_SERVICING
          - KYC_UPDATE
          - CLOSURE_REQUEST
          - OTHER
          type:
          - string
          - 'null'
        channel:
          description: Channel
          enum:
          - MOBILE_APP
          - WEB
          - PHONE
          - EMAIL
          - CHAT
          - WHATSAPP
          - BRANCH
          - AGENT
          - SOCIAL_MEDIA
          - LETTER
          - USSD
          - API
          type:
          - string
          - 'null'
        code:
          description: Template code
          maxLength: 64
          type: string
        complaint_category:
          description: Complaint category
          enum:
          - FEES_AND_CHARGES
          - SERVICE_QUALITY
          - FRAUD_AND_SCAMS
          - PAYMENTS
          - CARDS
          - LENDING
          - ACCOUNT_OPENING
          - ACCOUNT_CLOSURE
          - DATA_PRIVACY
          - DISCRIMINATION
          - MIS_SELLING
          - COLLECTIONS_CONDUCT
          - DIGITAL_CHANNELS
          - OTHER
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
