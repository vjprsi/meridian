      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaPolicy'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaPolicyUpdate'
      x-requirements:
      - SRV-01
      x-service: crm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("servicing:write")'
      x-table: sla_policy
      x-crud: true
      x-crud-update: true
    delete:
