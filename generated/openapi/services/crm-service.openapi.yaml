info:
  description: 'Customer servicing and CRM for the back-office console: service requests and cases, complaints with regulatory
    SLAs and redress, a unified interaction timeline across channels, notes, work queues with SLA policies, a knowledge base,
    and an AI copilot that summarises history and drafts responses with a full audit trail.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — crm-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/servicing/sla-policies:
    get:
      operationId: slaPoliciesList
      summary: List sla policies
      tags:
      - Sla Policies
      security:
      - oauth2:
        - servicing:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: applies_to
        in: query
        schema:
          type: string
          enum:
          - CASE
          - COMPLAINT
      - name: case_type
        in: query
        schema:
          type: string
          enum:
          - SERVICE_REQUEST
          - INQUIRY
          - CARD_ISSUE
          - PAYMENT_ISSUE
          - ACCOUNT_MAINTENANCE
          - DOCUMENT_REQUEST
          - FRAUD_REPORT
          - TECHNICAL_ISSUE
          - LOAN_SERVICING
          - KYC_UPDATE
          - CLOSURE_REQUEST
          - OTHER
      - name: complaint_category
        in: query
        schema:
          type: string
          enum:
          - FEES_AND_CHARGES
          - SERVICE_QUALITY
          - FRAUD_AND_SCAMS
          - PAYMENTS
          - CARDS
          - LENDING
          - ACCOUNT_OPENING
          - ACCOUNT_CLOSURE
          - DATA_PRIVACY
          - DISCRIMINATION
          - MIS_SELLING
          - COLLECTIONS_CONDUCT
          - DIGITAL_CHANNELS
          - OTHER
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - URGENT
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaPolicyPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - SRV-01
      x-service: crm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("servicing:read")'
      x-table: sla_policy
      x-crud: true
      x-crud-list: true
    post:
      operationId: slaPoliciesCreate
      summary: Create sla policie
      tags:
      - Sla Policies
      security:
      - oauth2:
        - servicing:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaPolicy'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaPolicyCreate'
      x-requirements:
      - SRV-01
      x-service: crm-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("servicing:write")'
      x-table: sla_policy
      x-crud: true
      x-crud-create: true
  /v1/servicing/sla-policies/{id}:
    get:
      operationId: slaPoliciesGet
      summary: Retrieve sla policie
      tags:
      - Sla Policies
      security:
      - oauth2:
        - servicing:read
      parameters: &id006
      - &id005
        name: id
        in: path
        required: true
