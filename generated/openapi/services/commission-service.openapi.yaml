components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CommissionPlanPage:
      type: object
      description: One page of CommissionPlan results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionPlan'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CommissionRulePage:
      type: object
      description: One page of CommissionRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionRule'
        next_cursor:
          type:
          - string
          - 'null'
