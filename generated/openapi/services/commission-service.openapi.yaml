openapi: 3.1.0
info:
  title: Meridian Core — commission-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Commission Plans
  description: A versioned set of commission rules assigned to agents, merchants or billers
- name: Commission Rules
  description: One commission rule; the most specific matching rule per beneficiary wins
- name: Commission Earnings
  description: Commission accrued for one beneficiary on one transaction. Append-only; clawbacks are negative rows.
- name: Commission Payout Runs
  description: A payout run paying accrued commissions to beneficiary wallets
paths:
  /v1/commission-plans:
    get:
      operationId: commissionPlansList
      summary: List commission plans
      tags:
      - Commission Plans
      security:
      - oauth2:
        - wallets:read
      parameters:
