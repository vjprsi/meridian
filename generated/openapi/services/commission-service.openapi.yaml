          type:
          - string
          - 'null'
          enum:
          - REGISTER
          - FIRST_CASH_IN
          - FIRST_DEBIT
          description: 'WE-PRICE-1 (PE-11): which joining milestone fired (REGISTER, FIRST_CASH_IN, FIRST_DEBIT)'
