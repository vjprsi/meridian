          - string
          - 'null'
          enum:
          - P2P
          - CASH_IN
          - CASH_OUT
          - MERCHANT_PAYMENT
          - BILL_PAYMENT
          - AIRTIME
          - G2P
          - BULK_DISBURSEMENT
          - WALLET_TO_BANK
          - BANK_TO_WALLET
          - FLOAT_TRANSFER
