          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Applies from this transaction amount
        max_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Applies up to this transaction amount
        basis:
          type: string
          enum:
          - FLAT
          - PERCENTAGE
          - TIERED
          - FLAT_PLUS_PERCENTAGE
          description: Calculation basis
        flat_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Flat commission
        percentage:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Percentage of the base (0.005 = 0.5%)
        tiers:
          type:
          - array
          - 'null'
          items: {}
          description: 'Tier table for TIERED basis: [{from, to, flat, percentage}]'
        cap_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Maximum commission per transaction
        base:
          type: string
          maxLength: 16
          description: 'Base of the percentage: AMOUNT or FEE'
        beneficiary:
          type: string
          enum:
          - AGENT
          - SUPER_AGENT
          - SUB_AGENT
          - MERCHANT
          - BILLER
          - PLATFORM
          - CUSTOMER
          - AGGREGATOR
          - SERVICE_PROVIDER
          description: Who earns it (AGENT = transacting agent, SUB_AGENT / SUPER_AGENT resolved through the hierarchy)
        beneficiary_wallet_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Fixed wallet credited for PLATFORM, BILLER or CUSTOMER beneficiaries
        beneficiary_share:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Share of the computed commission for this beneficiary
        funded_by:
          type: string
          maxLength: 32
          description: FEE, PLATFORM, BILLER, MERCHANT
        tax_withholding_rate:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Withholding tax on commission
        tier_mode:
          type: string
          enum:
          - BAND
          - TELESCOPIC
          description: 'WE-PRICE-1 (PE-7): BAND = band charges the whole base (today); TELESCOPIC = sum of per-slice charges'
        charge_scope:
          type: string
          enum:
          - INSTRUMENT
          - CUMULATIVE
          description: 'WE-PRICE-1 (PE-7): INSTRUMENT = this transaction; CUMULATIVE = f(cumulative_before + base) - f(cumulative_before)'
        accumulation_period:
          type:
          - string
          - 'null'
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          - LIFETIME
          description: 'WE-PRICE-1 (PE-7): window a CUMULATIVE commission accumulates over (empty = LIFETIME)'
        charge_direction:
          type:
          - string
          - 'null'
          enum:
          - DEBIT
          - CREDIT
          description: 'WE-PRICE-1 (PE-7): side the commission applies to (empty = any)'
        milestone_from_nth:
          type:
          - integer
          - 'null'
          format: int32
          description: 'WE-PRICE-1 (PE-18): applies from the nth matching transaction in the window (inclusive; empty = no
            milestone gate)'
        milestone_to_nth:
          type:
          - integer
          - 'null'
          format: int32
          description: 'WE-PRICE-1 (PE-18): applies up to the nth matching transaction (inclusive; empty = unbounded)'
        milestone_period:
          type:
          - string
          - 'null'
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - LIFETIME
          description: 'WE-PRICE-1 (PE-18): window the nth count is measured in (empty = LIFETIME)'
        milestone_count_scope:
          type:
          - string
          - 'null'
          maxLength: 32
          description: 'WE-PRICE-1 (PE-18): count scope (SERVICE = this txn_type, ALL = any; empty = SERVICE)'
        remote_txn_type:
          type:
          - string
          - 'null'
          enum:
          - ONSITE
          - OFFSITE
          - NOT_CLASSIFIED
          description: 'WE-PRICE-1 (PE-16): applies only to this onsite/offsite classification (empty = any)'
        inactive_customer_only:
          type: boolean
          description: 'WE-PRICE-1 (PE-13): rule fires only when the credited customer is inactive'
        inactive_days:
          type:
          - integer
          - 'null'
          format: int32
          description: 'WE-PRICE-1 (PE-13): days of inactivity that qualify the customer as inactive'
        reward_trigger:
          type:
          - string
          - 'null'
          enum:
          - IMMEDIATE
          - AFTER_FIRST_DEBIT
          - AFTER_DURATION
          description: 'WE-PRICE-1 (PE-13): when the reward is released (IMMEDIATE, AFTER_FIRST_DEBIT, AFTER_DURATION)'
        reward_delay_days:
          type:
          - integer
          - 'null'
          format: int32
          description: 'WE-PRICE-1 (PE-13): delay in days for AFTER_DURATION release'
        share_enabled:
          type: boolean
          description: 'WE-PRICE-1 (PE-14): this rule participates in a Merchant->Aggregator->SP commission-sharing split
            (CP/CR journal posted at accrual)'
        is_active:
          type: boolean
          description: Active
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - commission_plan_id
      - name
      - priority
      - txn_type
      - basis
      - base
      - beneficiary
      - beneficiary_share
      - funded_by
      - tier_mode
      - charge_scope
      - inactive_customer_only
      - share_enabled
      - is_active
