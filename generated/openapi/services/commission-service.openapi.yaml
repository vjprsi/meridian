          - VOUCHER_ROLLBACK
          - CASHOUT_SETTLE
          - CASHOUT_ROLLBACK
          description: Transaction type (empty for a REGISTER joining-commission earning, PE-11)
        beneficiary:
          type: string
          enum:
          - AGENT
          - SUPER_AGENT
          - SUB_AGENT
          - MERCHANT
          - BILLER
          - PLATFORM
          - CUSTOMER
          - AGGREGATOR
          - SERVICE_PROVIDER
          description: Beneficiary type
        joining_commission_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'WE-PRICE-1 (PE-11): joining-commission configuration this earning came from'
