openapi: 3.1.0
info:
  title: Meridian Core — commission-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Commission Plans
  description: A versioned set of commission rules assigned to agents, merchants or billers
- name: Commission Rules
  description: One commission rule; the most specific matching rule per beneficiary wins
- name: Commission Earnings
  description: Commission accrued for one beneficiary on one transaction. Append-only; clawbacks are negative rows.
- name: Joining Commissions
  description: 'WE-PRICE-1 (PE-11): joining-commission configuration rewarding the registering business user for a new customer''s
    registration, first cash-in and first debit. Maker-checker (clones the commission_plan approval lifecycle). Each milestone
    carries its own amount; payout goes to the registering agent''s commission wallet.

    '
- name: Pending Commission Rewards
  description: 'WE-PRICE-1 (PE-13): a cash-in-to-inactive-customer reward held for deferred release (AFTER_FIRST_DEBIT or
    AFTER_DURATION). The EOD POST /pending-commission-rewards/release-due turns due rewards into earnings.

    '
- name: Commission Payout Runs
  description: A payout run paying accrued commissions to beneficiary wallets
paths:
  /v1/commission-plans:
    get:
      operationId: commissionPlansList
      summary: List commission plans
      tags:
      - Commission Plans
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - ACTIVE
          - RETIRED
      - name: applies_to
        in: query
        schema:
          type: string
          maxLength: 32
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlanPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - WAL-04
      x-service: commission-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: commission_plan
      x-crud: true
      x-crud-list: true
    post:
      operationId: commissionPlansCreate
      summary: Create commission plan
      tags:
      - Commission Plans
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanCreate'
      x-requirements:
      - WAL-04
      x-service: commission-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: commission_plan
      x-crud: true
      x-crud-create: true
