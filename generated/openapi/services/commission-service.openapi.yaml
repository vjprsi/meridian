          type:
          - string
          - 'null'
          format: uuid
          description: Rule applied (empty for a joining-commission earning, PE-11)
        wallet_transaction_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Source transaction (empty for a REGISTER joining-commission earning, PE-11)
