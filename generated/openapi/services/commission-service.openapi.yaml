      type: object
      description: Commission accrued for one beneficiary on one transaction. Append-only; clawbacks are negative rows.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        commission_plan_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Plan (empty for a joining-commission earning, PE-11)
