components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    CommissionEarning:
      description: Commission accrued for one beneficiary on one transaction. Append-only; clawbacks are negative rows.
      properties:
        base_amount:
          description: Base the commission was computed on
          examples:
          - '125.50'
          format: decimal
          type: string
        beneficiary:
          description: Beneficiary type
          enum:
          - AGENT
          - SUPER_AGENT
          - SUB_AGENT
          - MERCHANT
          - BILLER
          - PLATFORM
          - CUSTOMER
          type: string
        beneficiary_agent_id:
          description: Agent beneficiary
          format: uuid
          type:
          - string
          - 'null'
        beneficiary_merchant_id:
          description: Merchant beneficiary
          format: uuid
          type:
          - string
          - 'null'
        beneficiary_wallet_id:
          description: Wallet to pay
          format: uuid
          type: string
        commission_amount:
          description: Gross commission (negative for clawback)
          examples:
          - '125.50'
          format: decimal
          type: string
        commission_plan_id:
          description: Plan
          format: uuid
          type: string
        commission_rule_id:
          description: Rule applied
          format: uuid
          type: string
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        earned_at:
          description: Transaction completion time
          format: date-time
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        is_clawback:
          description: Clawback of an earlier earning (reversal)
          type: boolean
        net_amount:
          description: Net commission
          examples:
          - '125.50'
          format: decimal
          type: string
        payout_due_on:
          description: Payout date per plan frequency
          format: date
          type: string
        tax_amount:
          description: Withholding tax
          examples:
          - '125.50'
          format: decimal
          type: string
        wallet_transaction_id:
          description: Source transaction
          format: uuid
          type: string
      required:
      - id
      - created_at
      - commission_plan_id
      - commission_rule_id
      - wallet_transaction_id
      - beneficiary
      - beneficiary_wallet_id
      - base_amount
      - commission_amount
      - tax_amount
      - net_amount
      - currency
      - is_clawback
      - earned_at
      - payout_due_on
