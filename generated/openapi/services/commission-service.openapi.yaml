          - RETIRED
      - name: applies_to
        in: query
        schema:
          type: string
          maxLength: 32
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlanPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - WAL-04
      x-service: commission-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-table: commission_plan
      x-crud: true
      x-crud-list: true
    post:
      operationId: commissionPlansCreate
      summary: Create commission plan
      tags:
      - Commission Plans
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlan'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
