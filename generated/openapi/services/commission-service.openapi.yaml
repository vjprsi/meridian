          type:
          - string
          - 'null'
          format: uuid
          description: Agent beneficiary
        beneficiary_merchant_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Merchant beneficiary
        beneficiary_wallet_id:
          type: string
          format: uuid
          description: Wallet to pay
        base_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Base the commission was computed on
        commission_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Gross commission (negative for clawback)
        tax_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Withholding tax
        net_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Net commission
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        payout_frequency:
          type: string
          enum:
          - REALTIME
          - DAILY
          - WEEKLY
          - MONTHLY
          description: Payout frequency of the plan
        is_clawback:
          type: boolean
          description: Clawback of an earlier earning (reversal)
        clawback_of_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Earning clawed back
        share_group_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'WE-PRICE-1 (PE-14): groups the earnings of one commission-sharing split (reversed together)'
        share_role:
          type:
          - string
          - 'null'
          maxLength: 32
          description: 'WE-PRICE-1 (PE-14): role in the sharing split (MERCHANT, AGGREGATOR, SERVICE_PROVIDER)'
        ledger_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'WE-PRICE-1 (PE-14): CP/CR ledger journal entry posted for this shared earning'
        earned_at:
          type: string
          format: date-time
          description: Transaction completion time
        payout_due_on:
          type: string
          format: date
          description: Payout date per plan frequency
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
