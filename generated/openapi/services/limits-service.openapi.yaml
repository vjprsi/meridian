components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    LimitRulePage:
      type: object
      description: One page of LimitRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LimitRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LimitRulesActivateRequest:
      type: object
      properties:
        comment:
          type: string
    LimitRulesDeactivateRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    LimitRulesSimulateRequest:
      type: object
      properties:
        subject_type:
          type: string
          maxLength: 32
        subject_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        kyc_tier:
          type: string
          maxLength: 32
        customer_segment:
          type: string
          maxLength: 64
        product_id:
          type: string
          format: uuid
        transaction_type:
          type: string
          maxLength: 40
        channel:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        current_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - subject_type
      - subject_id
      - transaction_type
      - amount
      - currency
    LimitUsagePage:
      type: object
      description: One page of LimitUsage results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LimitUsage'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LimitUsagesResetRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    LimitOverridePage:
      type: object
      description: One page of LimitOverride results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LimitOverride'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LimitOverridesApproveRequest:
      type: object
      properties:
        comment:
          type: string
    LimitOverridesRejectRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    LimitOverridesRevokeRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    LimitCheckPage:
      type: object
      description: One page of LimitCheck results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LimitCheck'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LimitChecksCommitRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
    LimitChecksReleaseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    LimitChecksEvaluateRequest:
      type: object
      properties:
        subject_type:
          type: string
          maxLength: 32
        subject_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        kyc_tier:
          type: string
          maxLength: 32
        customer_segment:
          type: string
          maxLength: 64
        product_id:
          type: string
          format: uuid
        transaction_type:
          type: string
          maxLength: 40
        channel:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        current_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - subject_type
      - subject_id
      - transaction_type
      - amount
      - currency
    LimitChecksExpireReservationsRequest:
      type: object
      properties:
        max_checks:
          type: integer
          format: int32
    RiskAppetiteMetricPage:
      type: object
      description: One page of RiskAppetiteMetric results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RiskAppetiteMetric'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RiskAppetiteMetricsMeasurementsRequest:
      type: object
      properties:
        current_value:
          type: string
          format: decimal
          examples:
          - '125.50'
        measured_at:
          type: string
          format: date-time
        source:
          type: string
          maxLength: 64
      required:
      - current_value
      - measured_at
    RiskAppetiteMeasurementPage:
      type: object
      description: One page of RiskAppetiteMeasurement results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RiskAppetiteMeasurement'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LimitCheck:
      type: object
      description: Result of a limit check; a reservation is committed or released when the transaction completes
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        subject_type:
          type: string
          maxLength: 32
          description: 'Primary subject type: CUSTOMER, ACCOUNT, CARD, WALLET, AGENT, MERCHANT'
        subject_id:
          type: string
          format: uuid
          description: Primary subject
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer (customer-level limits are counted per customer)
        kyc_tier:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Customer KYC tier code (matches KYC_TIER limits)
        customer_segment:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Customer segment (matches CUSTOMER_SEGMENT limits)
        product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Product (matches PRODUCT limits)
        transaction_type:
          type: string
          maxLength: 40
          description: Transaction type
        channel:
          type:
          - string
          - 'null'
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
          description: Channel
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        current_balance:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Balance before the transaction (BALANCE limits)
        allowed:
          type: boolean
          description: Whether the transaction is within limits
          readOnly: true
        status:
          type: string
          enum:
          - RESERVED
          - COMMITTED
          - RELEASED
          - REJECTED
          - DRY_RUN
          - EXPIRED
          description: Reservation status (RESERVED until committed, released or expired)
          readOnly: true
        action:
          type:
          - string
          - 'null'
          enum:
          - REJECT
