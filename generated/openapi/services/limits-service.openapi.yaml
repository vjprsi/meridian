components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    LimitCheck:
      description: Result of a limit check; a reservation is committed or released when the transaction completes
      properties:
        action:
          description: Action when a limit was breached
          enum:
          - REJECT
          - REVIEW
          - STEP_UP
          - ALLOW_AND_ALERT
          type:
          - string
          - 'null'
        allowed:
          description: Whether the transaction is within limits
          type: boolean
        amount:
          description: Amount
          examples:
          - '125.50'
          format: decimal
          type: string
        breached_rule_ids:
          additionalProperties: true
          description: Rules breached
          type:
          - object
          - 'null'
        channel:
          description: Channel
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
          type:
          - string
          - 'null'
        correlation_id:
          description: Business transaction / saga id
          maxLength: 128
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Customer
          format: uuid
          type:
          - string
          - 'null'
        evaluated_rule_ids:
          additionalProperties: true
          description: Rules evaluated
          type: object
        expires_at:
          description: Reservation expiry (auto-release)
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        idempotency_key:
          description: Client key
          maxLength: 128
          readOnly: true
          type: string
        latency_ms:
          description: Evaluation time
          format: int32
          type:
          - integer
          - 'null'
        remaining:
          additionalProperties: true
          description: Remaining amount/count per rule and period
          type:
          - object
          - 'null'
        status:
          description: Reservation status at creation
          enum:
          - RESERVED
          - COMMITTED
          - RELEASED
          - REJECTED
          - DRY_RUN
          type: string
        subject_id:
          description: Primary subject
          format: uuid
          type: string
        subject_type:
          description: Primary subject type
          maxLength: 32
          type: string
        transaction_type:
          description: Transaction type
          maxLength: 40
          type: string
      required:
      - id
      - created_at
      - subject_type
      - subject_id
      - transaction_type
      - amount
      - currency
      - allowed
      - status
      - evaluated_rule_ids
