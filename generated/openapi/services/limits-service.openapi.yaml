      type: object
      description: 'WE-LIMIT-1 (MQ-TCP-1/3/5/6): cumulative (Rank-1) Transfer Control Profile. Authoring row keyed by regulatory
        profile (KYC id), currency, direction and optional domain/category; it is compiled into synthetic, windowed limit
        rules counted against the regulatory-profile id so usage aggregates across all of a customer''s account groups. Rank-1
