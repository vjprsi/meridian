openapi: 3.1.0
info:
  title: Meridian Core — limits-service
  version: 1.0.0
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Limit Rules
  description: A limit definition; the most specific matching rule wins, then the lowest priority number
- name: Limit Usages
  description: Usage counter of a limit for one subject and period
- name: Limit Overrides
  description: Temporary limit increase or decrease for one subject, approved by a checker
- name: Limit Checks
  description: Check limits and reserve usage atomically; commit on success or release on failure.
- name: Risk Appetite Metrics
  description: Board-approved risk appetite metric with amber/red thresholds and its latest value
- name: Transfer Control Profiles
  description: Cumulative (Rank-1) Transfer Control Profiles, compiled into the limit engine on activation.
- name: Instrument Tcps
  description: Instrument/grade (Rank-2) Transfer Control Profiles; Rank-2 must be a subset of Rank-1 (checked on activation).
- name: Transfer Rules
  description: Transfer-rule matrix (allow/deny by sender/receiver attributes and hierarchy scope).
paths:
  /v1/risk/limits/rules:
    get:
      operationId: limitRulesList
      summary: List limit rules
      tags:
      - Limit Rules
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - GLOBAL
          - TENANT
          - PRODUCT
          - KYC_TIER
          - CUSTOMER_SEGMENT
          - CUSTOMER
          - ACCOUNT
          - CARD
          - WALLET
          - AGENT
          - MERCHANT
          - REGULATORY_PROFILE
          - INSTRUMENT_GRADE
      - name: scope_ref
        in: query
        schema:
          type: string
          maxLength: 128
      - name: period
        in: query
        schema:
          type: string
          enum:
          - PER_TRANSACTION
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          - LIFETIME
          - ROLLING_24H
          - ROLLING_7D
          - ROLLING_30D
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
      - name: transaction_type
        in: query
        schema:
          type: string
          maxLength: 40
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
      - name: is_regulatory
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitRulePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CIF-03
      - LIM-01
      x-service: limits-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-required-scope: risk:read
      x-table: limit_rule
      x-crud: true
      x-crud-list: true
    post:
      operationId: limitRulesCreate
      summary: Create limit rule
      tags:
      - Limit Rules
      security:
      - oauth2:
        - risk:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitRule'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitRuleCreate'
      x-requirements:
      - CIF-03
      - LIM-01
      x-service: limits-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:write")'
      x-required-scope: risk:write
      x-table: limit_rule
      x-crud: true
      x-crud-create: true
