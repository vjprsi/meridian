        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitRuleUpdate'
      x-requirements:
      - CIF-03
      - LIM-01
      x-service: limits-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:write")'
      x-required-scope: risk:write
      x-table: limit_rule
      x-crud: true
      x-crud-update: true
