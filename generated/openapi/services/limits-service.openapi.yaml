        in: query
        schema:
          type: string
          enum:
          - GLOBAL
          - TENANT
          - PRODUCT
          - KYC_TIER
          - CUSTOMER_SEGMENT
          - CUSTOMER
          - ACCOUNT
          - CARD
          - WALLET
          - AGENT
          - MERCHANT
      - name: scope_ref
        in: query
        schema:
          type: string
          maxLength: 128
      - name: period
        in: query
        schema:
          type: string
          enum:
          - PER_TRANSACTION
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          - LIFETIME
          - ROLLING_24H
          - ROLLING_7D
          - ROLLING_30D
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
      - name: transaction_type
        in: query
        schema:
          type: string
          maxLength: 40
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
      - name: is_regulatory
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitRulePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CIF-03
      - LIM-01
