components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    AffordabilityAssessment:
      description: Affordability calculation (income, commitments, stressed instalment). Append-only.
      properties:
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        debt_to_income:
          description: Debt-to-income ratio
          examples:
          - '125.50'
          format: decimal
          type: string
        disposable_income:
          description: Disposable income after the new loan
          examples:
          - '125.50'
          format: decimal
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        living_costs:
          description: Living costs (declared or statistical floor)
          examples:
          - '125.50'
          format: decimal
          type: string
        loan_application_id:
          description: Application
          format: uuid
          type: string
        max_affordable_amount:
          description: Largest affordable amount
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        monthly_commitments:
          description: Existing monthly commitments
          examples:
          - '125.50'
          format: decimal
          type: string
        policy_version:
          description: Affordability policy version
          maxLength: 32
          type: string
        proposed_instalment:
          description: Instalment of the requested loan
          examples:
          - '125.50'
          format: decimal
          type: string
        result:
          description: Outcome
          enum:
          - PASS
          - FAIL
          - MARGINAL
          type: string
        stressed_instalment:
          description: Instalment at stressed rate
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        verified_monthly_income:
          description: Verified monthly income
          examples:
          - '125.50'
          format: decimal
          type: string
