security:
- oauth2: []
servers:
- description: Production
  url: https://api.meridian.example
- description: Sandbox
  url: https://sandbox.api.meridian.example
tags:
- description: An application for a loan, credit line, BNPL plan or nano-loan
  name: Loan Applications
- description: A person or business on an application (primary, co-applicant, guarantor)
  name: Loan Applicants
- description: Declared or verified income and expense lines used in affordability
  name: Loan Financial Items
- description: Documents requested and supplied for an application
  name: Loan Application Documents
- description: A credit bureau pull for an applicant
  name: Bureau Reports
- description: A credit scorecard / model family (application, behavioural, collections, wallet)
  name: Scorecards
- description: A versioned scorecard or ML model with cut-offs; champion/challenger supported
  name: Scorecard Versions
- description: A score produced for an application with explainable reason codes. Append-only.
  name: Credit Scores
- description: Affordability calculation (income, commitments, stressed instalment). Append-only.
  name: Affordability Assessments
- description: The credit decision for an application. Append-only; a new decision supersedes the last.
  name: Credit Decisions
- description: A priced offer made to the applicant
  name: Loan Offers
- description: E-signature envelope for the loan agreement
  name: E Signature Requests
