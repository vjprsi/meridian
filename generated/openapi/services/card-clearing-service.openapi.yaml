              schema:
                $ref: '#/components/schemas/ClearingFile'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - CRD-06
      x-service: card-clearing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: clearing_file
  /v1/card-clearing/files/{id}/records:
