          maxLength: 255
          type:
          - string
          - 'null'
        fee_type:
          description: Fee type
          enum:
          - ISSUANCE
          - REPLACEMENT
          - MONTHLY
          - ANNUAL
          - ATM_WITHDRAWAL
          - FX_MARKUP
          - CROSS_BORDER
          - EXPRESS_SHIPPING
          - INACTIVITY
          - LATE_PAYMENT
          - CASH_ADVANCE
          - INTERCHANGE_INCOME
          - SCHEME_FEE
