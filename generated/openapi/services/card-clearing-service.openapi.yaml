openapi: 3.1.0
info:
  title: Meridian Core — card-clearing-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Clearing Files
  description: Upload (create) parses the file synchronously, matches presentments to authorisations, captures holds into
    ledger postings and updates settlement positions.
- name: Clearing Records
  description: One clearing record (presentment, refund, chargeback, fee). Append-only.
- name: Card Settlements
  description: Scheme settlement position per settlement date and currency (net amount due to / from scheme)
- name: Card Fees
  description: Fee charged to a cardholder or interchange earned, linked to the posting
paths:
  /v1/card-clearing/files:
    get:
      operationId: clearingFilesList
      summary: List clearing files
      tags:
      - Clearing Files
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: scheme
        in: query
        schema:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - UNIONPAY
          - JCB
          - DISCOVER
          - RUPAY
          - ELO
          - LOCAL
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - INCOMING
          - OUTGOING
      - name: status
        in: query
        schema:
          type: string
          enum:
          - RECEIVED
          - PARSING
          - PARSED
          - POSTED
          - FAILED
      - name: processing_date
        in: query
        schema:
          type: string
          format: date
      - name: card_program_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingFilePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-06
      x-service: card-clearing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: clearing_file
      x-crud: true
      x-crud-list: true
    post:
      operationId: clearingFilesCreate
      summary: Create clearing file
      tags:
      - Clearing Files
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingFile'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearingFileCreate'
      x-requirements:
      - CRD-06
      x-service: card-clearing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: clearing_file
      x-crud: true
      x-crud-create: true
  /v1/card-clearing/files/{id}:
    get:
      operationId: clearingFilesGet
      summary: Retrieve clearing file
      tags:
      - Clearing Files
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingFile'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-06
      x-service: card-clearing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: clearing_file
      x-crud: true
      x-crud-get: true
  /v1/card-clearing/files/{id}/reprocess:
