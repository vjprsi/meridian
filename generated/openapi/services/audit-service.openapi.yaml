info:
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — audit-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/audit-events:
    get:
      operationId: auditEventsList
      summary: List audit events
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: actor_type
        in: query
        schema:
          type: string
          enum:
          - STAFF_USER
          - CUSTOMER
          - API_CLIENT
          - SERVICE
          - SYSTEM
          - PLATFORM_OPERATOR
          - AGENT
      - name: actor_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: action
        in: query
        schema:
          type: string
          maxLength: 128
      - name: resource_type
        in: query
        schema:
          type: string
          maxLength: 64
      - name: resource_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: outcome
        in: query
        schema:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - DENIED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: request_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-table: audit_event
      x-crud: true
      x-crud-list: true
  /v1/audit-events/{id}:
    get:
      operationId: auditEventsGet
      summary: Retrieve audit event
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-table: audit_event
      x-crud: true
      x-crud-get: true
  /v1/audit-events/verify-chain:
    post:
      operationId: auditEventsVerifyChain
      summary: Verify the hash chain for a range
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
