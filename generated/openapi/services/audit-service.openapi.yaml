openapi: 3.1.0
info:
  title: Meridian Core — audit-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Audit Events
  description: One audited action. Append-only and hash-chained per tenant; stored on WORM storage.
- name: Audit Retention Policies
  description: Retention rule for audit and business records per resource type and jurisdiction
- name: Data Exports
  description: Export of audit or personal data for regulators, auditors or data-subject requests
paths:
  /v1/audit-events:
    get:
      operationId: auditEventsList
      summary: List audit events
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: actor_type
        in: query
        schema:
          type: string
          enum:
          - STAFF_USER
          - CUSTOMER
          - API_CLIENT
          - SERVICE
          - SYSTEM
          - PLATFORM_OPERATOR
          - AGENT
      - name: actor_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: action
        in: query
        schema:
          type: string
          maxLength: 128
      - name: resource_type
        in: query
        schema:
          type: string
          maxLength: 64
      - name: resource_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: outcome
        in: query
        schema:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - DENIED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: request_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: audit_event
      x-crud: true
      x-crud-list: true
  /v1/audit-events/{id}:
    get:
      operationId: auditEventsGet
      summary: Retrieve audit event
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: audit_event
      x-crud: true
      x-crud-get: true
  /v1/audit-events/verify-chain:
    post:
      operationId: auditEventsVerifyChain
      summary: Verify the hash chain for a range
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventsVerifyChainRequest'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: audit_event
  /v1/audit-events/search:
    post:
      operationId: auditEventsSearch
      summary: Full-text and structured search over audit events
      tags:
      - Audit Events
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventsSearchRequest'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: audit_event
  /v1/audit-retention-policies:
    get:
      operationId: auditRetentionPoliciesList
      summary: List audit retention policies
      tags:
      - Audit Retention Policies
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: resource_type
        in: query
        schema:
          type: string
          maxLength: 64
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRetentionPolicyPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: audit_retention_policy
      x-crud: true
      x-crud-list: true
    post:
      operationId: auditRetentionPoliciesCreate
      summary: Create audit retention policie
      tags:
      - Audit Retention Policies
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRetentionPolicy'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRetentionPolicyCreate'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: audit_retention_policy
      x-crud: true
      x-crud-create: true
  /v1/audit-retention-policies/{id}:
    get:
      operationId: auditRetentionPoliciesGet
      summary: Retrieve audit retention policie
      tags:
      - Audit Retention Policies
      security:
      - oauth2:
        - platform:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRetentionPolicy'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: audit_retention_policy
      x-crud: true
      x-crud-get: true
    patch:
      operationId: auditRetentionPoliciesUpdate
      summary: Update audit retention policie
      tags:
      - Audit Retention Policies
      security:
      - oauth2:
        - platform:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRetentionPolicy'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRetentionPolicyUpdate'
      x-requirements:
      - ADM-03
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: audit_retention_policy
      x-crud: true
      x-crud-update: true
  /v1/data-exports:
    get:
      operationId: dataExportsList
      summary: List data exports
      tags:
      - Data Exports
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: export_type
        in: query
        schema:
          type: string
          enum:
          - AUDIT_LOG
          - DATA_SUBJECT_ACCESS
          - DATA_PORTABILITY
          - REGULATOR_EXTRACT
          - LEGAL_DISCOVERY
      - name: subject_type
        in: query
        schema:
          type: string
          maxLength: 40
      - name: subject_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - PARTIALLY_SUCCEEDED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportRequestPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - ADM-03
      - CIF-04
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: data_export_request
      x-crud: true
      x-crud-list: true
    post:
      operationId: dataExportsCreate
      summary: Create data export
      tags:
      - Data Exports
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportRequest'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataExportRequestCreate'
      x-requirements:
      - ADM-03
      - CIF-04
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: data_export_request
      x-crud: true
      x-crud-create: true
  /v1/data-exports/{id}:
    get:
      operationId: dataExportsGet
      summary: Retrieve data export
      tags:
      - Data Exports
      security:
      - oauth2:
        - platform:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportRequest'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      - CIF-04
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: data_export_request
      x-crud: true
      x-crud-get: true
  /v1/data-exports/{id}/download-url:
    get:
      operationId: dataExportsDownloadUrl
      summary: Signed download URL once approved and complete (url, expires_at)
      tags:
      - Data Exports
      security:
      - oauth2:
        - platform:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      - CIF-04
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: data_export_request
  /v1/data-exports/{id}/cancel:
    post:
      operationId: dataExportsCancel
      summary: Cancel a pending export
      tags:
      - Data Exports
      security:
      - oauth2:
        - platform:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportRequest'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataExportsCancelRequest'
      x-requirements:
      - ADM-03
      - CIF-04
      x-service: audit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: data_export_request
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    AuditEventPage:
      type: object
      description: One page of AuditEvent results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AuditEventsVerifyChainRequest:
      type: object
      properties:
        from_sequence:
          type: integer
          format: int64
        to_sequence:
          type: integer
          format: int64
      required:
      - from_sequence
      - to_sequence
    AuditEventsSearchRequest:
      type: object
      properties:
        query:
          type: object
          additionalProperties: true
      required:
      - query
    AuditRetentionPolicyPage:
      type: object
      description: One page of AuditRetentionPolicy results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditRetentionPolicy'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    DataExportRequestPage:
      type: object
      description: One page of DataExportRequest results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataExportRequest'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    DataExportsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    AuditEvent:
      type: object
      description: One audited action. Append-only and hash-chained per tenant; stored on WORM storage.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          description: Time of the action
        sequence_no:
          type: integer
          format: int64
          description: Gapless sequence per tenant
          readOnly: true
        actor_type:
          type: string
          enum:
          - STAFF_USER
          - CUSTOMER
          - API_CLIENT
          - SERVICE
          - SYSTEM
          - PLATFORM_OPERATOR
          - AGENT
          description: Actor type
        actor_id:
          type: string
          maxLength: 64
          description: Actor id
        actor_display:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Actor display name at the time
        impersonator_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Operator acting on behalf of the actor
        action:
          type: string
          maxLength: 128
          description: Action, e.g. payments.payment.approve
        resource_type:
          type: string
          maxLength: 64
          description: Resource type
        resource_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Resource id
        outcome:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - DENIED
          description: Outcome
        reason:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Reason or justification
        before_state:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: State before (PII masked)
        after_state:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: State after (PII masked)
        legal_entity_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Legal entity
        approval_request_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Approval, if maker-checker
        ip_address:
          type:
          - string
          - 'null'
          description: Client IP (IPv4 or IPv6 address)
        user_agent:
          type:
          - string
          - 'null'
          maxLength: 500
          description: User agent
        session_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Session id
        request_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Request id
        trace_id:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Trace id
        service_name:
          type: string
          maxLength: 64
          description: Service that emitted the event
        source_event_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: CloudEvents id of the consumed domain event (de-duplication)
          readOnly: true
        hash:
          type: string
          maxLength: 64
          description: SHA-256 over this event and prev_hash
          readOnly: true
        prev_hash:
          type: string
          maxLength: 64
          description: Hash of the previous event
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
