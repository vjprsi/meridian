components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    AuditEvent:
      description: One audited action. Append-only and hash-chained per tenant; stored on WORM storage.
      properties:
        action:
          description: Action, e.g. payments.payment.approve
          maxLength: 128
          type: string
        actor_display:
          description: Actor display name at the time
          maxLength: 255
          type:
          - string
          - 'null'
        actor_id:
          description: Actor id
          maxLength: 64
          type: string
        actor_type:
          description: Actor type
          enum:
          - STAFF_USER
          - CUSTOMER
          - API_CLIENT
          - SERVICE
          - SYSTEM
          - PLATFORM_OPERATOR
          - AGENT
          type: string
        after_state:
          additionalProperties: true
          description: State after (PII masked)
          type:
          - object
          - 'null'
        approval_request_id:
          description: Approval, if maker-checker
          format: uuid
          type:
          - string
          - 'null'
        before_state:
          additionalProperties: true
          description: State before (PII masked)
          type:
          - object
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        hash:
          description: SHA-256 over this event and prev_hash
          maxLength: 64
          readOnly: true
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        impersonator_id:
          description: Operator acting on behalf of the actor
          maxLength: 64
          type:
          - string
          - 'null'
        ip_address:
          description: Client IP (IPv4 or IPv6 address)
          type:
          - string
          - 'null'
        legal_entity_id:
          description: Legal entity
          format: uuid
          type:
          - string
          - 'null'
        occurred_at:
          description: Time of the action
          format: date-time
          type: string
        outcome:
          description: Outcome
          enum:
          - SUCCESS
          - FAILURE
          - DENIED
          type: string
        prev_hash:
          description: Hash of the previous event
          maxLength: 64
          readOnly: true
          type: string
        reason:
          description: Reason or justification
          maxLength: 500
          type:
          - string
          - 'null'
        request_id:
          description: Request id
          maxLength: 64
          type:
          - string
          - 'null'
        resource_id:
          description: Resource id
          maxLength: 64
          type:
          - string
          - 'null'
        resource_type:
          description: Resource type
          maxLength: 64
          type: string
        sequence_no:
          description: Gapless sequence per tenant
          format: int64
          readOnly: true
          type: integer
        service_name:
          description: Service that emitted the event
          maxLength: 64
          type: string
        session_id:
          description: Session id
          maxLength: 64
          type:
          - string
          - 'null'
        source_event_id:
          description: CloudEvents id of the consumed domain event (de-duplication)
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        trace_id:
          description: Trace id
          maxLength: 32
          type:
          - string
          - 'null'
        user_agent:
          description: User agent
          maxLength: 500
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - occurred_at
      - sequence_no
      - actor_type
      - actor_id
      - action
      - resource_type
      - outcome
      - service_name
      - hash
      - prev_hash
      type: object
    AuditEventPage:
      description: One page of AuditEvent results (newest first)
      properties:
        data:
          items:
            $ref: '#/components/schemas/AuditEvent'
          type: array
        has_more:
          type: boolean
        next_cursor:
          description: Pass as ?cursor= to fetch the next page
          type:
          - string
          - 'null'
      required:
      - data
      - has_more
