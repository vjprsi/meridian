components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    ApprovalPolicyPage:
      type: object
      description: One page of ApprovalPolicy results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalPolicy'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ApprovalRequestPage:
      type: object
      description: One page of ApprovalRequest results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ApprovalRequestsApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
    ApprovalRequestsRejectRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
      required:
      - comment
    ApprovalRequestsRequestChangesRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
      required:
      - comment
    ApprovalRequestsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    ApprovalDecisionPage:
      type: object
      description: One page of ApprovalDecision results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalDecision'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WorkflowDefinitionPage:
      type: object
      description: One page of WorkflowDefinition results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WorkflowInstancePage:
      type: object
      description: One page of WorkflowInstance results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstance'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WorkflowInstancesSignalRequest:
      type: object
      properties:
        signal:
          type: string
          maxLength: 64
        data:
          type: object
          additionalProperties: true
      required:
      - signal
    WorkflowInstancesCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    WorkTaskPage:
      type: object
      description: One page of WorkTask results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkTask'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TasksAssignRequest:
      type: object
      properties:
        assignee:
          type: string
          maxLength: 64
      required:
      - assignee
    TasksCompleteRequest:
      type: object
      properties:
        outcome:
          type: string
          maxLength: 64
        form_data:
          type: object
          additionalProperties: true
      required:
      - outcome
    TasksEscalateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    ApprovalDecision:
      type: object
      description: A checker's decision on an approval request. Append-only.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        approval_request_id:
          type: string
          format: uuid
          description: Request
        approver:
          type: string
          maxLength: 64
          description: Approving user
        level:
          type: integer
