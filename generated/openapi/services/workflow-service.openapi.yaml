          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        decision:
          description: Approve, reject, request changes
          enum:
          - APPROVE
          - REJECT
          - REQUEST_CHANGES
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        level:
          description: Level approved
          format: int32
          type: integer
        mfa_verified:
          description: Step-up MFA performed
          type: boolean
      required:
      - id
      - created_at
      - approval_request_id
      - approver
      - level
      - decision
      - mfa_verified
