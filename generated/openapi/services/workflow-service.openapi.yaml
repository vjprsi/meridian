      x-table: approval_policy
      x-crud: true
      x-crud-list: true
    post:
      operationId: approvalPoliciesCreate
      summary: Create approval policie
      tags:
      - Approval Policies
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
