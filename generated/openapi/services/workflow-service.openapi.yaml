openapi: 3.1.0
info:
  title: Meridian Core — workflow-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Approval Policies
  description: Defines when an operation needs approval and by whom
- name: Approval Requests
  description: A pending sensitive operation awaiting checker approval (four-eyes)
- name: Workflow Definitions
  description: Versioned workflow definition executed by the workflow engine (Temporal)
- name: Workflow Instances
  description: A running or completed workflow
- name: Tasks
  description: A human task in a work queue (review, approve, investigate) with SLA
paths:
