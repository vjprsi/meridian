    EodJobDefinition:
      type: object
      description: 'A step in an end-of-period job graph, executed by an owning service. Cross-service EOD contract: for every
        tenant, EOD run, job and partition the orchestrator calls <http_method> <owning_service><http_path> with headers X-Tenant-Id
        (the tenant whose EOD runs) and Idempotency-Key = "eod:<eod_run_id>:<job code>:<partition_no>" (identical for every
        retry of the partition, so a lost response is executed once downstream). Placeholders {business_date}, {legal_entity_id},
        {cycle_type}, {eod_run_id}, {eod_job_run_id}, {job_code}, {partition_no}, {partition_count} and {attempt} are substituted
        (URL-encoded) in http_path and in the string values of body_template. Without body_template the body is the job context
        (eod_run_id, eod_job_run_id, job_code, job_type, cycle_type, legal_entity_id, business_date, is_month_end, is_quarter_end,
        is_year_end, partition_no, partition_count, partition_key, attempt, parameters, checkpoint). Example: deposit-service
        POST /v1/deposit-accounts/eod/accrue?business_date={business_date}. The job answers 2xx with optional records_processed,
        records_failed and checkpoint; 408, 409, 429 and 5xx are retried per the failure policy, other 4xx fail the job.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        legal_entity_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Legal entity (empty = all entities)
        code:
          type: string
          maxLength: 64
          description: Job code, e.g. DEP_INTEREST_ACCRUAL
        name:
          type: string
          maxLength: 160
          description: Display name
        job_type:
          type: string
          enum:
          - INTEREST_ACCRUAL
          - INTEREST_CAPITALISATION
          - FEE_CHARGING
          - DORMANCY
          - STATEMENTS
          - LOAN_ACCRUAL
          - DELINQUENCY_AGEING
          - ECL_PROVISION
          - RECONCILIATION
          - FX_REVALUATION
          - GL_CLOSE
          - REGULATORY_REPORTS
          - BALANCE_SNAPSHOT
          - STANDING_ORDERS
          - TERM_DEPOSIT_MATURITY
          - CARD_STATEMENT_CYCLE
          - ARCHIVAL
          - CUSTOM
          description: Kind of job
        cycle_types:
          type: array
          items: {}
          description: Cycles the job runs in, e.g. [EOD, EOM]
        owning_service:
          type: string
          maxLength: 64
          description: Service that executes the job, e.g. deposit-service
        http_method:
          type: string
          enum:
          - POST
          - PUT
          - PATCH
          - GET
          description: HTTP method of the job endpoint
        http_path:
          type: string
          maxLength: 500
          description: Path and query template on the owning service, e.g. /v1/deposit-accounts/eod/accrue?business_date={business_date}
        body_template:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: JSON body template (placeholders in string values); empty = the standard job context
        depends_on:
          type:
          - array
          - 'null'
          items: {}
          description: Codes of jobs that must finish first
        sequence:
          type: integer
          format: int32
          description: Ordering hint within the same dependency level
        parallelism:
          type: integer
          format: int32
          description: Number of partitions run in parallel
        partition_key:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Partitioning key, e.g. ACCOUNT_ID_HASH
        timeout_minutes:
          type: integer
          format: int32
          description: Maximum run time per attempt
        max_retries:
          type: integer
          format: int32
          description: Automatic retries before the failure policy applies
        failure_policy:
          type: string
          enum:
          - STOP_CYCLE
          - CONTINUE
          - RETRY_THEN_STOP
          - RETRY_THEN_CONTINUE
          description: What happens on final failure
        is_critical:
          type: boolean
          description: Blocks the date roll when it fails
        is_active:
          type: boolean
          description: Active
        parameters:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Default parameters passed to the job
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - code
      - name
      - job_type
      - cycle_types
      - owning_service
      - http_method
      - http_path
      - sequence
      - parallelism
