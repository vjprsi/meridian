info:
  description: 'Business-day processing and EOD/EOM/EOY batch orchestration, secure file exchange with partners, enterprise
    search across all entities, and data retention, archival, legal hold and certified purge.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — business-day-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/operations/business-days:
    get:
      operationId: businessDaysList
      summary: List business days
      tags:
      - Business Days
      security:
      - oauth2:
        - operations:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: business_date
        in: query
        schema:
          type: string
          format: date
      - name: state
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - CUT_OFF
          - EOD_RUNNING
          - EOD_FAILED
          - CLOSED
      - name: is_current
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDayPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - GL-03
      - OPS-01
      x-service: business-day-service
      x-table: business_day
      x-crud: true
      x-crud-list: true
  /v1/operations/business-days/{id}:
    get:
      operationId: businessDaysGet
      summary: Retrieve business day
      tags:
      - Business Days
      security:
      - oauth2:
        - operations:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDay'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - GL-03
      - OPS-01
      x-service: business-day-service
      x-table: business_day
      x-crud: true
      x-crud-get: true
  /v1/operations/business-days/current:
    get:
      operationId: businessDaysCurrent
      summary: Current business date per legal entity (?legal_entity_id=)
      tags:
      - Business Days
      security:
      - oauth2:
        - operations:read
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDay'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - GL-03
      - OPS-01
      x-service: business-day-service
      x-table: business_day
  /v1/operations/business-days/{id}/cut-off:
    post:
      operationId: businessDaysCutOff
      summary: Apply transaction cut-off for the business date
      tags:
      - Business Days
      security:
      - oauth2:
        - operations:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDay'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessDaysCutOffRequest'
      x-requirements:
      - GL-03
      - OPS-01
      x-service: business-day-service
      x-table: business_day
  /v1/operations/business-days/{id}/start-eod:
