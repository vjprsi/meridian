          maxLength: 500
          type:
          - string
          - 'null'
        fx_quote_id:
          description: Quote accepted
          format: uuid
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        journal_entry_id:
          description: Ledger posting
          format: uuid
          readOnly: true
          type:
          - string
          - 'null'
        liquidity_provider:
          description: Cover counterparty
          maxLength: 64
          type:
          - string
          - 'null'
        payment_id:
          description: Payment funded by the deal
          format: uuid
          type:
          - string
          - 'null'
        rate:
          description: Deal rate
          examples:
          - '125.50'
          format: decimal
          type: string
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        sell_amount:
          description: Sold amount
          examples:
          - '125.50'
          format: decimal
          type: string
        sell_currency:
          description: Sold currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        side:
          description: Buy or sell from the bank's view
          enum:
          - BUY
          - SELL
          type: string
        status:
          description: Status
          enum:
          - BOOKED
          - SETTLED
          - CANCELLED
          - FAILED
          readOnly: true
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        value_date:
          description: Settlement value date
          format: date
          type: string
