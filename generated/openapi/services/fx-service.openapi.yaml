openapi: 3.1.0
info:
  title: Meridian Core — fx-service
  version: 1.0.0
  description: 'ISO 20022-native payments hub. Initiates, screens, approves, routes, submits and settles payments on every
    rail (instant, batch, RTGS, mobile money, cross-border); manages payees, aliases, bulk files, direct-debit mandates, request-to-pay,
    payment links and QR codes; runs rail routing, settlement, liquidity and FX.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Fx Quotes
  description: A firm FX quote valid until expiry
- name: Fx Deals
  description: A booked FX conversion (from an accepted quote)
- name: Fx Margin Rules
  description: Margin rules per currency pair, segment and amount band
- name: Remittance Partners
  description: Payout / correspondent partner used for cross-border remittances
- name: Remittance Corridors
  description: Send-receive corridor with limits, pricing and partner routing
paths:
  /v1/fx/quotes:
    get:
      operationId: fxQuotesList
      summary: List fx quotes
      tags:
      - Fx Quotes
      security:
      - oauth2:
        - payments:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: sell_currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: buy_currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - ACCEPTED
          - EXPIRED
          - CANCELLED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuotePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - LED-03
      - PAY-06
      x-service: fx-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:read")'
      x-required-scope: payments:read
      x-table: fx_quote
      x-crud: true
      x-crud-list: true
    post:
      operationId: fxQuotesCreate
      summary: Create fx quote
      tags:
      - Fx Quotes
      security:
      - oauth2:
        - payments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuote'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxQuoteCreate'
      x-requirements:
      - LED-03
      - PAY-06
      x-service: fx-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:write")'
      x-required-scope: payments:write
      x-table: fx_quote
      x-crud: true
      x-crud-create: true
  /v1/fx/quotes/{id}:
    get:
      operationId: fxQuotesGet
      summary: Retrieve fx quote
      tags:
      - Fx Quotes
      security:
      - oauth2:
        - payments:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuote'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - LED-03
      - PAY-06
      x-service: fx-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:read")'
      x-required-scope: payments:read
      x-table: fx_quote
      x-crud: true
      x-crud-get: true
  /v1/fx/quotes/{id}/accept:
    post:
      operationId: fxQuotesAccept
      summary: 'Accept the quote and book the deal. Single use (row lock; a replay for the same payment_id returns its deal).
        With payment_id the binding is mandatory and checked atomically: customer_id must match the quote customer, sell/buy
        currencies must match, sell_amount (and buy_amount when given) must equal the quote within meridian.fx.accept-amount-tolerance
        (default 0)'
      tags:
      - Fx Quotes
      security:
      - oauth2:
        - payments:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxDeal'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxQuotesAcceptRequest'
      x-requirements:
      - LED-03
      - PAY-06
      x-service: fx-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:write")'
      x-required-scope: payments:write
      x-table: fx_quote
  /v1/fx/quotes/{id}/cancel:
    post:
      operationId: fxQuotesCancel
      summary: Cancel an unused quote
      tags:
      - Fx Quotes
      security:
      - oauth2:
        - payments:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuote'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - LED-03
      - PAY-06
      x-service: fx-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:write")'
      x-required-scope: payments:write
      x-table: fx_quote
  /v1/fx/deals:
