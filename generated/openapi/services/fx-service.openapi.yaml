components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    FxQuotePage:
      type: object
      description: One page of FxQuote results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FxQuote'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FxQuotesAcceptRequest:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        sell_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        sell_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        buy_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        buy_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
    FxDealPage:
      type: object
      description: One page of FxDeal results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FxDeal'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FxDealsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    FxMarginRulePage:
      type: object
      description: One page of FxMarginRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FxMarginRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RemittancePartnerPage:
      type: object
      description: One page of RemittancePartner results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RemittancePartner'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RemittanceCorridorPage:
      type: object
      description: One page of RemittanceCorridor results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RemittanceCorridor'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RemittanceCorridorsQuoteRequest:
      type: object
      properties:
        send_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        receive_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        customer_id:
          type: string
          format: uuid
    RemittanceCorridorsSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    RemittanceCorridorsResumeRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    FxDeal:
      type: object
      description: A booked FX conversion (from an accepted quote)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        fx_quote_id:
          type: string
          format: uuid
          description: Quote accepted
          readOnly: true
        payment_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Payment funded by the deal
          readOnly: true
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: 'Bank side on the sell currency: BUY (bank buys what the customer sells)'
          readOnly: true
        sell_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Sold currency (ISO 4217)
          readOnly: true
        sell_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Sold amount
          readOnly: true
        buy_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Bought currency (ISO 4217)
          readOnly: true
        buy_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Bought amount
          readOnly: true
        rate:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Deal rate
          readOnly: true
        value_date:
          type: string
          format: date
          description: Settlement value date
          readOnly: true
        journal_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Ledger posting
          readOnly: true
        liquidity_provider:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Cover counterparty
        status:
          type: string
          enum:
          - BOOKED
          - SETTLED
          - CANCELLED
          - FAILED
          description: Status
          readOnly: true
        cancellation_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason when cancelled
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - fx_quote_id
      - side
      - sell_currency
      - sell_amount
      - buy_currency
      - buy_amount
      - rate
      - value_date
      - status
