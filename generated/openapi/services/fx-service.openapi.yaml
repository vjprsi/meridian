        buy_amount:
          description: Bought amount
          examples:
          - '125.50'
          format: decimal
          type: string
        buy_currency:
          description: Bought currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
