openapi: 3.1.0
info:
  title: Meridian Core — billing-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Price Plans
  description: A published price plan (platform fee, per active account, per transaction tiers)
- name: Subscriptions
  description: A tenant's subscription to a price plan
- name: Usage
  description: Metered usage aggregated per day and metric. Append-only.
- name: Invoices
  description: Invoice issued to a tenant for a billing period
paths:
  /v1/billing/price-plans:
    get:
      operationId: pricePlansList
      summary: List price plans
      tags:
      - Price Plans
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
      - name: currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: billing_period
        in: query
        schema:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          - ANNUAL
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePlanPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-05
      x-service: billing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: price_plan
      x-crud: true
      x-crud-list: true
    post:
      operationId: pricePlansCreate
      summary: Create price plan
      tags:
      - Price Plans
      security:
      - oauth2:
        - platform:operator
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePlan'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricePlanCreate'
      x-requirements:
      - ADM-05
      x-service: billing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:operator")'
      x-required-scope: platform:operator
      x-table: price_plan
      x-crud: true
      x-crud-create: true
  /v1/billing/price-plans/{id}:
    get:
      operationId: pricePlansGet
      summary: Retrieve price plan
      tags:
      - Price Plans
      security:
      - oauth2:
        - platform:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
