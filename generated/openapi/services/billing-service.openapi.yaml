        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
      required:
      - period_start
      - period_end
    PricePlan:
      type: object
      description: A published price plan (platform fee, per active account, per transaction tiers)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        code:
          type: string
          maxLength: 32
          description: Plan code
        name:
          type: string
          maxLength: 120
          description: Plan name
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Billing currency (ISO 4217)
        billing_period:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          description: Billing period
        platform_fee:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Fixed fee per period
        included_active_accounts:
          type: integer
          format: int32
          description: Active accounts included
        price_per_active_account:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Price per extra active account
        metric_prices:
          type: object
          additionalProperties: true
          description: Tiered prices per usage metric
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
          description: Status (changed by /publish, /retire)
          readOnly: true
        valid_from:
          type: string
          format: date
          description: Available from
        valid_to:
          type:
          - string
          - 'null'
          format: date
          description: Available to
        retire_reason:
