components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    InvoicesGenerateRequest:
      properties:
        period_end:
          format: date
          type: string
        period_start:
          format: date
          type: string
      required:
      - period_start
      - period_end
      type: object
    InvoicesRecordPaymentRequest:
      properties:
        amount:
          examples:
          - '125.50'
          format: decimal
          type: string
        paid_at:
          format: date-time
          type: string
        reference:
          maxLength: 64
          type: string
      required:
      - amount
      - paid_at
      type: object
    InvoicesVoidRequest:
      properties:
        reason:
          maxLength: 255
          type: string
      required:
      - reason
      type: object
    PricePlan:
