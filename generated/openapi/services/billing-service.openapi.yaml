          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - code
      - name
      - currency
      - billing_period
      - platform_fee
      - included_active_accounts
