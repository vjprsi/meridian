          - string
          - 'null'
          maxLength: 255
          description: Reason given on /retire
          readOnly: true
        retired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Retirement time
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
