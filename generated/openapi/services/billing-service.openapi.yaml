      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePlan'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricePlanUpdate'
      x-requirements:
      - ADM-05
      x-service: billing-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:operator")'
      x-required-scope: platform:operator
      x-table: price_plan
      x-crud: true
      x-crud-update: true
