components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    PricePlanPage:
      type: object
      description: One page of PricePlan results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PricePlan'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PricePlansRetireRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    TenantSubscriptionPage:
      type: object
      description: One page of TenantSubscription results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantSubscription'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    SubscriptionsChangePlanRequest:
      type: object
      properties:
        price_plan_id:
          type: string
          format: uuid
        effective_date:
          type: string
          format: date
      required:
      - price_plan_id
      - effective_date
    SubscriptionsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    UsageRecordPage:
      type: object
      description: One page of UsageRecord results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TenantInvoicePage:
      type: object
      description: One page of TenantInvoice results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantInvoice'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    InvoicesVoidRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    InvoicesRecordPaymentRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        paid_at:
          type: string
          format: date-time
        reference:
          type: string
          maxLength: 64
      required:
      - amount
      - paid_at
    TenantInvoiceLinePage:
      type: object
