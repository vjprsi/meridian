info:
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — merchant-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/merchants:
    get:
      operationId: merchantsList
      summary: List merchants
      tags:
      - Merchants
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: merchant_type
        in: query
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - SOLE_TRADER
          - COMPANY
          - GOVERNMENT
          - NGO
      - name: mcc
        in: query
        schema:
          type: string
          maxLength: 4
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ONBOARDING
          - ACTIVE
          - SUSPENDED
          - TERMINATED
      - name: acquiring_agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: merchant_code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
