openapi: 3.1.0
info:
  title: Meridian Core — merchant-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Merchants
  description: A business accepting wallet payments
- name: Merchant Stores
  description: A physical or online store of a merchant
- name: Merchant Terminals
  description: A POS, soft-POS, e-commerce or vending terminal of a merchant
- name: Merchant Qr Codes
  description: An EMVCo merchant-presented QR code (static or dynamic)
- name: Merchant Payment Links
  description: A shareable link that lets anyone pay a merchant
- name: Merchant Fee Plans
  description: Merchant discount rate and fees charged to merchants
- name: Merchant Settlements
  description: Periodic settlement of merchant collections net of fees and refunds
- name: Merchant Refunds
  description: A full or partial refund of a merchant payment
paths:
  /v1/merchants:
    get:
      operationId: merchantsList
      summary: List merchants
      tags:
      - Merchants
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: merchant_type
        in: query
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - SOLE_TRADER
          - COMPANY
          - GOVERNMENT
          - NGO
      - name: mcc
        in: query
        schema:
          type: string
          maxLength: 4
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ONBOARDING
          - ACTIVE
          - SUSPENDED
          - TERMINATED
      - name: acquiring_agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: merchant_code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: country
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ONB-04
      - WAL-06
      x-service: merchant-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: merchant
      x-crud: true
      x-crud-list: true
    post:
      operationId: merchantsCreate
      summary: Create merchant
      tags:
      - Merchants
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCreate'
      x-requirements:
      - ONB-04
      - WAL-06
      x-service: merchant-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
