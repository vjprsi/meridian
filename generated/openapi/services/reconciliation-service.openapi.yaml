components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    ReconSourcePage:
      type: object
      description: One page of ReconSource results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconSource'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconFilePage:
      type: object
      description: One page of ReconFile results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconFile'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconFilesImportRequest:
      type: object
      properties:
        recon_source_id:
          type: string
          format: uuid
        file_name:
          type: string
          maxLength: 255
        content:
          type: string
        records:
          type: array
          items: {}
        statement_date:
          type: string
          format: date
        opening_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
        closing_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - recon_source_id
      - file_name
    ReconRecordPage:
      type: object
      description: One page of ReconRecord results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconRecord'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconRulePage:
      type: object
      description: One page of ReconRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconRunPage:
      type: object
      description: One page of ReconRun results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconRun'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconMatchPage:
      type: object
      description: One page of ReconMatch results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconMatch'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconMatchesUnmatchRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    ReconExceptionPage:
      type: object
      description: One page of ReconException results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReconException'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReconExceptionsAssignRequest:
      type: object
      properties:
        assigned_to:
          type: string
          maxLength: 64
      required:
      - assigned_to
    ReconExceptionsResolveRequest:
      type: object
      properties:
        resolution_note:
          type: string
        adjustment:
          type: object
          additionalProperties: true
      required:
      - resolution_note
    ReconException:
      type: object
      description: A reconciliation break awaiting investigation
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        recon_run_id:
          type: string
          format: uuid
          description: Run
        reason:
          type: string
          enum:
          - MISSING_INTERNAL
          - MISSING_EXTERNAL
          - AMOUNT_MISMATCH
          - DATE_MISMATCH
          - DUPLICATE
          - CURRENCY_MISMATCH
          - OTHER
          description: Break reason
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - RESOLVED
          - WRITTEN_OFF
          - IGNORED
          description: Status
        external_record_id:
          type:
          - string
          - 'null'
          format: uuid
          description: External record, if any
        internal_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Internal entry, if any
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Break amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        age_days:
          type: integer
          format: int32
          description: Days open
          readOnly: true
        assigned_to:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Assignee
        suggested_match:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: AI-suggested counterpart records with confidence
          readOnly: true
        resolution_note:
          type:
          - string
          - 'null'
          description: How it was resolved
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Resolution time
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - recon_run_id
      - reason
      - status
      - amount
      - currency
      - age_days
    ReconExceptionUpdate:
