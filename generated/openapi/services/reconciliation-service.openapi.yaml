    ReconSafeguardingConfig:
      type: object
      description: 'WE-RECON-1 (G-10, decision D-ED-12): per-tenant configuration of the trust / e-money safeguarding stock
        reconciliation A-(B+C+D+E). Defines how the backing trust bank balance A is sourced and the ordered set of e-money
        liability components B..E that must sum to the backing requirement, plus the de-minimis and timing tolerances. Additive
        and gated: with no active config the tenant runs no safeguarding reconciliation. The Wallet-Edition default component
        set is wallet liability (GL 2700 / IND04), e-money suspense (GL 2710 / IND02), e-money unclaimed (GL 2720 / IND06,
        a LIABILITY per decision D-ED-07) and agent / distributor float.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        name:
          type: string
          maxLength: 120
          description: Display name
        is_active:
          type: boolean
          description: 'The per-tenant gate: when true the safeguarding reconciliation runs at EOD'
        legal_entity_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Legal entity whose GL balances back the figures
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency of the safeguarding account set (empty = sum across currencies) (ISO 4217)
        trust_recon_source_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Recon source whose latest statement closing balance is A (the trust bank figure), when A is ingested
        trust_gl_code:
          type:
          - string
          - 'null'
          maxLength: 32
          description: GL code of the trust / safeguarding bank account, when A is read from gl-service instead
        liability_components:
          type: array
          items: {}
          description: Ordered backing components B..E [{role (SafeguardingComponentRole), gl_code, label}]; the Wallet-Edition
            default set is 2700, 2710, 2720 and the agent float
        tolerance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: De-minimis absolute band treated as BALANCED (rounding)
        timing_tolerance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Surplus band treated as an auto-clearing TIMING break rather than an AMOUNT break
        schedule_enabled:
          type: boolean
          description: Whether the EOD job runs this config automatically
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
