      operationId: safeguardingRunsRun
      summary: 'WE-RECON-1 (G-10): run the trust / e-money safeguarding stock reconciliation A-(B+C+D+E) for a business date
        over every active config (or recon_safeguarding_config_id when given); idempotent per (tenant, config, business date).
        Component figures may be supplied as a documented fallback / override when a live GL read is not wired: trust_balance
        is A, components is the B..E set [{role, label, amount}]; omitted figures are read live from gl-service. A zero result
        (within tolerance) is BALANCED; a negative result is a SHORTFALL (CRITICAL, regulator-reportable, opens a high-priority
        break); a small surplus is a held TIMING break; a persistent surplus is an AMOUNT break in the exception queue'
      tags:
      - Safeguarding Runs
      security:
      - oauth2:
        - ledger:write
      parameters:
      - name: business_date
        in: query
