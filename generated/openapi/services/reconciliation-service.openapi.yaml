info:
  description: 'The single source of truth for money. A real-time, append-only double-entry ledger that every other service
    posts through, the general ledger and period close, and automated reconciliation.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — reconciliation-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/reconciliation/sources:
    get:
      operationId: reconSourcesList
      summary: List recon sources
      tags:
      - Recon Sources
      security:
      - oauth2:
        - ledger:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: source_type
        in: query
        schema:
          type: string
          enum:
          - BANK_STATEMENT
          - CARD_SCHEME
          - PAYMENT_RAIL
          - PARTNER_REPORT
          - INTERNAL_LEDGER
          - WALLET_OPERATOR
      - name: ledger_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconSourcePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - REC-01
      x-service: reconciliation-service
      x-table: recon_source
      x-crud: true
      x-crud-list: true
    post:
      operationId: reconSourcesCreate
      summary: Create recon source
      tags:
      - Recon Sources
      security:
      - oauth2:
        - ledger:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconSource'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconSourceCreate'
      x-requirements:
      - REC-01
      x-service: reconciliation-service
      x-table: recon_source
      x-crud: true
      x-crud-create: true
  /v1/reconciliation/sources/{id}:
    get:
      operationId: reconSourcesGet
      summary: Retrieve recon source
      tags:
      - Recon Sources
      security:
      - oauth2:
        - ledger:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
