    ReconSafeguardingRun:
      type: object
      description: 'WE-RECON-1 (G-10): one immutable, audited safeguarding stock-reconciliation record for a config and business
        date - the component snapshot (A and each of B..E), the result A-(B+C+D+E), the status and the source references.
        Idempotent per (tenant, config, business date): a re-run returns the same record and only advances the status forward
        (never regresses it within the day); the component snapshot is write-once. A SHORTFALL emits a CRITICAL, regulator-reportable
        event and opens a high-priority recon_exception.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        recon_safeguarding_config_id:
          type: string
          format: uuid
          description: Config applied
        business_date:
          type: string
          format: date
          description: As-of business date
        status:
          type: string
          enum:
          - BALANCED
          - TIMING
          - AMOUNT
          - SHORTFALL
          description: Reconciliation outcome
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        trust_balance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: A - trust / safeguarding bank balance (write-once snapshot)
          readOnly: true
        liability_total:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: B+C+D+E - total e-money liability (write-once snapshot)
          readOnly: true
        difference:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: A-(B+C+D+E); zero (within tolerance) = fully backed, negative = shortfall
          readOnly: true
        components:
          type: array
          items: {}
          description: Per-component snapshot [{role, label, amount}] (write-once)
          readOnly: true
        tolerance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: De-minimis tolerance applied
          readOnly: true
        timing_tolerance:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Timing-surplus tolerance applied
          readOnly: true
        backed:
          type: boolean
          description: Whether the e-money was fully backed (difference >= -tolerance)
          readOnly: true
        alarm_raised:
          type: boolean
          description: Whether a safeguarding shortfall alarm was emitted
        recon_exception_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The high-priority break opened for a shortfall / persistent surplus, if any
        age_days:
          type: integer
          format: int32
          description: Days the break has been open
          readOnly: true
        source_refs:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: References for A and the GL balances (statement / GL snapshot)
          readOnly: true
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start
          readOnly: true
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: End
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - recon_safeguarding_config_id
      - business_date
      - status
      - trust_balance
      - liability_total
      - difference
