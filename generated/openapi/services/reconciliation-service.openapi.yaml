openapi: 3.1.0
info:
  title: Meridian Core — reconciliation-service
  version: 1.0.0
  description: 'The single source of truth for money. A real-time, append-only double-entry ledger that every other service
    posts through, the general ledger and period close, and automated reconciliation.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Recon Sources
  description: A configured external source to reconcile (bank account, scheme, rail, partner)
- name: Recon Files
  description: An imported statement or settlement file
- name: Recon Rules
  description: Matching rule, evaluated in priority order
- name: Recon Rule Sets
  description: 'Versioned, ordered matching configuration (exact keys, reference extraction, fuzzy scoring, one-to-many /
    many-to-one with bounded subset-sum, reversal pairing, fee / FX tolerances). Published with four-eyes through central
    approvals; a published version is immutable and supersedes the previous one of its scope.

    '
- name: Recon Runs
  description: A matching run over a source and date range
- name: Recon Matches
  description: A confirmed link between external records and internal ledger entries. Append-only.
- name: Recon Exceptions
  description: A reconciliation break awaiting investigation
- name: Recon Adjustments
  description: 'A requested ledger adjustment or write-off for a break. Four-eyes: the approver (direct or through central
    approvals) must differ from the requester; on approval the journal entry is posted to ledger-service and the break closes
    (RESOLVED for an adjustment, WRITTEN_OFF for a write-off).

    '
- name: Safeguarding Configs
  description: 'WE-RECON-1 (G-10, decision D-ED-12): per-tenant configuration of the trust / e-money safeguarding stock reconciliation
    A-(B+C+D+E). Defines how the backing trust bank balance A is sourced and the ordered set of e-money liability components
    B..E that must sum to the backing requirement, plus the de-minimis and timing tolerances. Additive and gated: with no
    active config the tenant runs no safeguarding reconciliation. The Wallet-Edition default component set is wallet liability
    (GL 2700 / IND04), e-money suspense (GL 2710 / IND02), e-money unclaimed (GL 2720 / IND06, a LIABILITY per decision D-ED-07)
    and agent / distributor float.

    '
- name: Safeguarding Runs
  description: 'WE-RECON-1 (G-10): one immutable, audited safeguarding stock-reconciliation record for a config and business
    date - the component snapshot (A and each of B..E), the result A-(B+C+D+E), the status and the source references. Idempotent
    per (tenant, config, business date): a re-run returns the same record and only advances the status forward (never regresses
    it within the day); the component snapshot is write-once. A SHORTFALL emits a CRITICAL, regulator-reportable event and
    opens a high-priority recon_exception.

    '
