openapi: 3.1.0
info:
  title: Meridian Core — card-threeds-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Threeds Authentications
  description: One 3DS authentication request and its outcome
paths:
  /v1/threeds-authentications:
    get:
      operationId: threedsAuthenticationsList
      summary: List threeds authentications
      tags:
      - Threeds Authentications
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: card_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: result
        in: query
        schema:
          type: string
          enum:
          - AUTHENTICATED
          - ATTEMPTED
          - FAILED
          - REJECTED
          - UNAVAILABLE
          - CHALLENGE_PENDING
      - name: challenge_type
        in: query
        schema:
          type: string
          enum:
          - FRICTIONLESS
          - OTP_SMS
          - OTP_EMAIL
          - APP_PUSH
          - BIOMETRIC
          - DECOUPLED
      - name: ds_transaction_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthenticationPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: threeds_authentication
      x-crud: true
      x-crud-list: true
  /v1/threeds-authentications/{id}:
    get:
      operationId: threedsAuthenticationsGet
      summary: Retrieve threeds authentication
      tags:
      - Threeds Authentications
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthentication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: threeds_authentication
      x-crud: true
      x-crud-get: true
  /v1/threeds-authentications/authenticate:
    post:
      operationId: threedsAuthenticationsAuthenticate
      summary: 'Authentication request (AReq) from the directory server: the card is resolved by PAN through the vault, the
        issuer scores the risk and answers frictionless (ECI + CAVV), challenge or reject; HMAC-SHA256 over the raw body in
        X-Signature'
      tags:
      - Threeds Authentications
      security: []
      parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthentication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreedsAuthenticationsAuthenticateRequest'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-public: true
      description: 'Public endpoint for an external provider callback: no bearer token; the service verifies the provider
        signature and resolves the tenant from the referenced entity.'
      x-table: threeds_authentication
  /v1/threeds-authentications/{id}/result:
    get:
      operationId: threedsAuthenticationsResult
      summary: 'Results request for the directory server: final result, ECI and CAVV; HMAC-SHA256 of the ds_transaction_id
        in X-Signature'
      tags:
      - Threeds Authentications
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: ds_transaction_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthentication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-public: true
      description: 'Public endpoint for an external provider callback: no bearer token; the service verifies the provider
        signature and resolves the tenant from the referenced entity.'
      x-table: threeds_authentication
  /v1/threeds-authentications/{id}/approve:
    post:
      operationId: threedsAuthenticationsApprove
      summary: Cardholder approves an app-push / decoupled challenge
      tags:
      - Threeds Authentications
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthentication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreedsAuthenticationsApproveRequest'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: threeds_authentication
  /v1/threeds-authentications/{id}/decline:
    post:
      operationId: threedsAuthenticationsDecline
      summary: Cardholder declines the challenge
      tags:
      - Threeds Authentications
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthentication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreedsAuthenticationsDeclineRequest'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: threeds_authentication
  /v1/threeds-authentications/{id}/verify-otp:
    post:
      operationId: threedsAuthenticationsVerifyOtp
      summary: Verify an OTP challenge (3 attempts, 5 minutes)
      tags:
      - Threeds Authentications
      security:
      - oauth2:
        - cards:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreedsAuthentication'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreedsAuthenticationsVerifyOtpRequest'
      x-requirements:
      - CRD-05
      x-service: card-threeds-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: threeds_authentication
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    ThreedsAuthenticationPage:
      type: object
      description: One page of ThreedsAuthentication results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ThreedsAuthentication'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ThreedsAuthenticationsAuthenticateRequest:
      type: object
      properties:
        pan:
          type: string
          maxLength: 19
        ds_transaction_id:
          type: string
          maxLength: 64
        threeds_server_transaction_id:
          type: string
          maxLength: 64
        protocol_version:
          type: string
          maxLength: 8
        merchant_name:
          type: string
          maxLength: 64
        merchant_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        mcc:
          type: string
          maxLength: 4
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        device_channel:
          type: string
          maxLength: 16
        preferred_challenge:
          type: string
          enum:
          - FRICTIONLESS
          - OTP_SMS
          - OTP_EMAIL
          - APP_PUSH
          - BIOMETRIC
          - DECOUPLED
      required:
      - pan
      - ds_transaction_id
      - protocol_version
    ThreedsAuthenticationsApproveRequest:
      type: object
      properties:
        biometric_assertion:
          type: string
    ThreedsAuthenticationsDeclineRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    ThreedsAuthenticationsVerifyOtpRequest:
      type: object
      properties:
        otp:
          type: string
          maxLength: 10
      required:
      - otp
    ThreedsAuthentication:
      type: object
      description: One 3DS authentication request and its outcome
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        card_id:
          type: string
          format: uuid
          description: Card
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Cardholder
        card_last4:
          type:
          - string
          - 'null'
          maxLength: 4
          description: Last four digits of the card
        acs_transaction_id:
          type: string
          maxLength: 64
          description: ACS transaction id
        ds_transaction_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Directory server transaction id
        threeds_server_transaction_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: 3DS server transaction id
        protocol_version:
          type: string
          maxLength: 8
          description: 2.1.0, 2.2.0, 2.3.1
        merchant_name:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Merchant
        merchant_country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Merchant country (ISO 3166-1 alpha-2)
        mcc:
          type:
          - string
          - 'null'
          maxLength: 4
          description: MCC
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Purchase amount
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        risk_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Issuer risk score 0-1000
          readOnly: true
        risk_reasons:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 64
          description: Factors that raised the risk score
          readOnly: true
        challenge_type:
          type:
          - string
          - 'null'
          enum:
          - FRICTIONLESS
          - OTP_SMS
          - OTP_EMAIL
          - APP_PUSH
          - BIOMETRIC
          - DECOUPLED
          description: Challenge method used
          readOnly: true
        result:
          type: string
          enum:
          - AUTHENTICATED
          - ATTEMPTED
          - FAILED
          - REJECTED
          - UNAVAILABLE
          - CHALLENGE_PENDING
          description: Outcome
          readOnly: true
        eci:
          type:
          - string
          - 'null'
          maxLength: 2
          description: ECI returned
          readOnly: true
        challenge_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Challenge expiry
          readOnly: true
        attempts:
          type: integer
          format: int32
          description: Challenge attempts
          readOnly: true
        decline_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Why the authentication failed or was rejected
          readOnly: true
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Completion time
          readOnly: true
        device_channel:
          type:
          - string
          - 'null'
          maxLength: 16
          description: APP, BROWSER, 3RI
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
        cavv:
          type: string
          maxLength: 64
          description: CAVV / AAV for the directory server (ARes and results request only) (returned once; never stored)
          readOnly: true
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - card_id
      - acs_transaction_id
      - protocol_version
      - result
      - attempts
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical request; replays return the original response for 24h
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            cards:read: Read Card Issuing and Processing
            cards:write: Change Card Issuing and Processing
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            cards:read: Read Card Issuing and Processing
            cards:write: Change Card Issuing and Processing
