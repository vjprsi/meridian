components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    DataClassificationPage:
      type: object
      description: One page of DataClassification results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataClassification'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RetentionPolicyPage:
      type: object
      description: One page of RetentionPolicy results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RetentionPolicy'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ArchiveJobPage:
      type: object
      description: One page of ArchiveJob results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveJob'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ArchivedObjectPage:
      type: object
      description: One page of ArchivedObject results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedObject'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ArchivedObjectsRestoreRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    LegalHoldPage:
      type: object
      description: One page of LegalHold results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalHold'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LegalHoldsReleaseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    PurgeRequestPage:
      type: object
      description: One page of PurgeRequest results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PurgeRequest'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    PurgeRequestsRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    PurgeRequestsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    ArchiveJob:
      type: object
      description: A run moving aged records from a service database to the archive store
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        retention_policy_id:
          type: string
          format: uuid
          description: Policy applied
        data_classification_id:
          type: string
          format: uuid
          description: Table archived
        cutoff_date:
          type: string
          format: date
          description: Records older than this date are archived
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - PARTIALLY_SUCCEEDED
          description: Status
          readOnly: true
        records_archived:
          type:
          - integer
          - 'null'
          format: int64
          description: Records archived
          readOnly: true
        records_skipped_hold:
          type:
          - integer
          - 'null'
          format: int64
          description: Records skipped because of legal holds
          readOnly: true
        bytes_archived:
          type:
          - integer
          - 'null'
          format: int64
          description: Bytes written
          readOnly: true
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start
          readOnly: true
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: End
          readOnly: true
        error:
          type:
          - string
          - 'null'
          description: Error details
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
