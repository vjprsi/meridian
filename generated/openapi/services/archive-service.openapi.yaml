openapi: 3.1.0
info:
  title: Meridian Core — archive-service
  version: 1.0.0
  description: 'Business-day processing and EOD/EOM/EOY batch orchestration, secure file exchange with partners, enterprise
    search across all entities, and data retention, archival, legal hold and certified purge.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Data Classifications
  description: Catalogue entry classifying a table (or column set) by sensitivity and data class
- name: Retention Policies
  description: How long a data class is kept per jurisdiction and what happens after
- name: Archive Jobs
  description: A run moving aged records from a service database to the archive store
- name: Archived Objects
  description: Manifest of an archived batch in immutable (WORM) object storage. Append-only.
- name: Legal Holds
  description: A legal or regulatory hold that suspends archival purge and deletion for its scope
- name: Purge Requests
  description: Request to permanently delete or anonymise data that reached end of retention
paths:
  /v1/archive/classifications:
    get:
      operationId: dataClassificationsList
      summary: List data classifications
      tags:
      - Data Classifications
      security:
      - oauth2:
        - operations:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: data_class
        in: query
        schema:
          type: string
          maxLength: 64
      - name: service_name
        in: query
        schema:
          type: string
          maxLength: 64
      - name: database_name
        in: query
        schema:
          type: string
          maxLength: 64
      - name: sensitivity
        in: query
        schema:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - RESTRICTED
          - PCI
          - PII
          - SPECIAL_CATEGORY
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataClassificationPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - OPS-04
      x-service: archive-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:read")'
      x-table: data_classification
      x-crud: true
      x-crud-list: true
    post:
      operationId: dataClassificationsCreate
      summary: Create data classification
      tags:
      - Data Classifications
      security:
      - oauth2:
        - operations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataClassification'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataClassificationCreate'
      x-requirements:
      - OPS-04
      x-service: archive-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("operations:write")'
      x-table: data_classification
      x-crud: true
      x-crud-create: true
