          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        cutoff_date:
          description: Records older than this date are archived
          format: date
          type: string
        data_classification_id:
          description: Table archived
          format: uuid
          type: string
        error:
          description: Error details
          readOnly: true
          type:
          - string
          - 'null'
        finished_at:
          description: End
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        records_archived:
          description: Records archived
          format: int64
          readOnly: true
          type:
          - integer
          - 'null'
        records_skipped_hold:
          description: Records skipped because of legal holds
          format: int64
          readOnly: true
          type:
          - integer
          - 'null'
        retention_policy_id:
          description: Policy applied
          format: uuid
          type: string
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        started_at:
          description: Start
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        status:
          description: Status
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - PARTIALLY_SUCCEEDED
          readOnly: true
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
