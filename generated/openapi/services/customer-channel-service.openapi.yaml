openapi: 3.1.0
info:
  title: Meridian Core — customer-channel-service
  version: 1.0.0
  description: 'Experience APIs for the bank''s own apps. Customer apps (web banking, mobile) use /v1/me: every operation
    acts for the signed-in customer only: the customer comes from the access token (customer_id claim, scope channels:customer),
    never from a path, query or body. The service calls the domain services with its own service identity and the customer''s
    tenant, checks that every referenced account, card, loan, wallet, payment, payee, standing order, thread, notification
    and document belongs to the customer (an object of someone else answers 404), rebuilds request bodies server-side and
    requires a recent authentication (step-up) for money movement and security changes. Agent outlet apps use /v1/agent the
    same way (agent_id claim, scope channels:agent; see agent-channel-service), the business banking portal uses /v1/business
    (business_customer_id and business_user_id claims, scope channels:business; see business-channel-service), and the merchant
    app uses /v1/merchant (merchant_id and merchant_user_id claims, scope channels:merchant; see merchant-channel-service).
    Domain services keep their operator APIs; customer, agent, business and merchant tokens carry no domain scope and are
    rejected there.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: My Profile
  description: The signed-in customer's own customer record
- name: My Contacts
  description: The customer's phone numbers and e-mail addresses, with OTP verification
- name: My Addresses
  description: The customer's postal addresses (read-only; changes need proof of address)
- name: My Devices
  description: Devices bound to the customer's digital banking
- name: My Notification Preferences
  description: Notification channels the customer opted in to or out of
- name: My Accounts
  description: Deposit accounts the customer owns or holds (joint holder, signatory with view rights)
- name: My Standing Orders
  description: Standing orders on the customer's accounts
- name: My Payees
  description: The customer's saved beneficiaries
- name: My Payments
  description: Payments initiated by or for the customer
- name: My Cards
  description: The customer's cards, their channel blocks and spend limits
- name: My Loans
  description: The customer's loans
- name: My Wallets
  description: The customer's mobile money wallets
- name: My Insights
  description: Spending analytics and insight cards for the customer
- name: My Budgets
  description: The customer's budgets
- name: My Rewards
  description: The customer's points and cashback
- name: My Threads
  description: Secure messaging between the customer and the bank (staff-only notes never shown)
- name: My Announcements
  description: Announcements targeted at the customer
- name: My Notifications
  description: In-app notifications sent to the customer
- name: My Kyc
  description: The customer's KYC status and identity documents
- name: My Documents
  description: Files the customer uploads (owner = the customer)
- name: My Activity
  description: The customer's own channel activity (security log)
paths:
  /v1/me/profile:
    get:
      operationId: myProfileGet
      summary: The signed-in customer's profile
      tags:
      - My Profile
      security:
      - oauth2:
        - channels:customer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
    patch:
      operationId: myProfileUpdate
      summary: Change the customer's own preferences (allow-listed fields only; name and identity changes go through KYC)
      tags:
      - My Profile
      security:
      - oauth2:
        - channels:customer
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyProfileUpdateRequest'
      x-service: customer-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:customer")'
      x-required-scope: channels:customer
      x-table: customer_action
  /v1/me/contacts:
    get:
      operationId: myContactsList
