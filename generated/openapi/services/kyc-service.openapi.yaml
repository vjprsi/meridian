        kyc_provider_id:
          type: string
          format: uuid
          description: Provider
        kyc_document_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Document checked
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - PASSED
          - FAILED
          - INCONCLUSIVE
          - ERROR
          - EXPIRED
          description: Status
        score:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Provider score / confidence 0..1
        result_summary:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Human-readable outcome
        reason_codes:
          type:
