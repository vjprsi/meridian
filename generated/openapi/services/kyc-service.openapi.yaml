openapi: 3.1.0
info:
  title: Meridian Core — kyc-service
  version: 1.0.0
  description: 'Single customer view for individuals and businesses (CIF), relationships and UBOs, tiered KYC, devices and
    credentials, consent and privacy, configurable onboarding journeys, and KYC/KYB checks through pluggable providers.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Kyc Providers
  description: Configured external KYC/KYB provider (e.g. Onfido, Jumio, Sumsub, Smile ID, registry APIs)
- name: Kyc Profiles
  description: 'The KYC state of a customer: verification status, risk level and next review date'
- name: Kyc Documents
  description: Identity, address or corporate document captured for KYC/KYB
- name: Kyc Checks
  description: One verification call to a provider (OCR, liveness, face match, database, registry, address)
- name: Kyc Screenings
  description: PEP, sanctions, adverse-media and watchlist screening of a customer at onboarding and on change
- name: Kyc Risk Assessments
  description: Customer risk rating with its factors (country, product, channel, occupation, PEP, behaviour). Append-only.
- name: Kyc Reviews
  description: Periodic or event-driven KYC review (refresh) of a customer
paths:
  /v1/kyc/providers:
    get:
      operationId: kycProvidersList
      summary: List kyc providers
      tags:
      - Kyc Providers
      security:
      - oauth2:
        - party:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: code
        in: query
        schema:
          type: string
          maxLength: 40
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycProviderPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ONB-02
      - ONB-04
      x-service: kyc-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:read")'
      x-required-scope: party:read
      x-table: kyc_provider
      x-crud: true
      x-crud-list: true
    post:
      operationId: kycProvidersCreate
      summary: Create kyc provider
      tags:
      - Kyc Providers
      security:
      - oauth2:
        - party:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycProvider'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycProviderCreate'
      x-requirements:
      - ONB-02
      - ONB-04
      x-service: kyc-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:write")'
      x-required-scope: party:write
      x-table: kyc_provider
      x-crud: true
      x-crud-create: true
  /v1/kyc/providers/{id}:
    get:
      operationId: kycProvidersGet
      summary: Retrieve kyc provider
      tags:
      - Kyc Providers
      security:
      - oauth2:
        - party:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycProvider'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ONB-02
      - ONB-04
      x-service: kyc-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:read")'
      x-required-scope: party:read
      x-table: kyc_provider
      x-crud: true
      x-crud-get: true
    patch:
