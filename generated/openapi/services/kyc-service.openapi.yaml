          - INTERNAL_BLACKLIST
          type: string
        status:
          description: Outcome
          enum:
          - CLEAR
          - POTENTIAL_MATCH
          - CONFIRMED_MATCH
          - FALSE_POSITIVE
          - ERROR
          type: string
        trigger:
          description: ONBOARDING, DATA_CHANGE, LIST_UPDATE, PERIODIC, MANUAL
          maxLength: 40
          type: string
      required:
      - kyc_profile_id
      - customer_id
      - screening_type
      - trigger
      - screened_name
      - status
      type: object
    KycScreeningPage:
      description: One page of KycScreening results (newest first)
      properties:
        data:
          items:
            $ref: '#/components/schemas/KycScreening'
          type: array
        has_more:
          type: boolean
        next_cursor:
          description: Pass as ?cursor= to fetch the next page
          type:
          - string
          - 'null'
      required:
      - data
      - has_more
      type: object
    KycScreeningsDispositionRequest:
      properties:
        review_comment:
          type: string
        status:
          enum:
          - CLEAR
          - POTENTIAL_MATCH
          - CONFIRMED_MATCH
          - FALSE_POSITIVE
          - ERROR
          type: string
      required:
      - status
      - review_comment
      type: object
    Problem:
      description: RFC 9457 problem details
      properties:
        code:
          description: Stable machine-readable error code
          type: string
        detail:
          type: string
        errors:
          items:
            properties:
              code:
                type: string
              field:
                type: string
              message:
                type: string
            type: object
          type: array
        instance:
          type: string
        request_id:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      required:
      - type
      - title
      - status
      - code
      type: object
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          scopes:
            party:read: Read Customer and Onboarding
            party:write: Change Customer and Onboarding
          tokenUrl: https://auth.meridian.example/oauth2/token
        clientCredentials:
          scopes:
            party:read: Read Customer and Onboarding
            party:write: Change Customer and Onboarding
          tokenUrl: https://auth.meridian.example/oauth2/token
      type: oauth2
