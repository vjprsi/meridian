          maxLength: 128
          type:
          - string
          - 'null'
        reason_codes:
          description: Provider reason codes
          items: {}
          type:
          - array
          - 'null'
        requested_at:
          description: Request time
          format: date-time
          type: string
        result_summary:
          description: Human-readable outcome
          maxLength: 500
          type:
          - string
          - 'null'
        row_version:
