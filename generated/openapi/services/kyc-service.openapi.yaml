      tags:
      - Kyc Providers
      security:
      - oauth2:
        - party:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycProvider'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycProviderUpdate'
      x-requirements:
      - ONB-02
      - ONB-04
      x-service: kyc-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:write")'
      x-required-scope: party:write
      x-table: kyc_provider
      x-crud: true
      x-crud-update: true
