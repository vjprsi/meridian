        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsKpiPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-service: analytics-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("reporting:read")'
      x-table: analytics_kpi
      x-crud: true
      x-crud-list: true
    post:
      operationId: analyticsKpisCreate
      summary: Create analytics kpi
      tags:
      - Analytics Kpis
      security:
      - oauth2:
        - reporting:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsKpi'
        '400': *id001
