components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    AnalyticsKpiPage:
      type: object
      description: One page of AnalyticsKpi results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsKpi'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AnalyticsKpisCertifyRequest:
      type: object
      properties:
        comment:
          type: string
    AnalyticsSavedQueryPage:
      type: object
      description: One page of AnalyticsSavedQuery results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSavedQuery'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AnalyticsSavedQueriesRunRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
    AnalyticsSavedQueriesExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
          - CSV
          - PARQUET
          - JSON
          - XLSX
        parameters:
          type: object
          additionalProperties: true
      required:
      - format
    AnalyticsSavedQueriesValidateRequest:
      type: object
      properties:
        sql:
          type: string
      required:
      - sql
    AnalyticsDashboardPage:
      type: object
      description: One page of AnalyticsDashboard results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDashboard'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AnalyticsWidgetPage:
      type: object
      description: One page of AnalyticsWidget results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsWidget'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AnalyticsDashboardsDuplicateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
      required:
      - name
    AnalyticsExportJobPage:
      type: object
      description: One page of AnalyticsExportJob results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsExportJob'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AnalyticsExportsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    AnalyticsDataSharePage:
      type: object
      description: One page of AnalyticsDataShare results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDataShare'
        next_cursor:
          type:
