          - SUBCATEGORY
      - name: parent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: is_income
        in: query
        schema:
          type: boolean
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
