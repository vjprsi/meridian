security:
- oauth2: []
servers:
- description: Production
  url: https://api.meridian.example
- description: Sandbox
  url: https://sandbox.api.meridian.example
tags:
- description: Spending category taxonomy (group, category, subcategory) used for enrichment and budgets
  name: Spend Categories
- description: Enrichment result for one customer transaction (clean merchant, logo, category, geo, recurring). Append-only.
  name: Transaction Enrichments
- description: Customer-defined rule to recategorise matching transactions (e.g. always tag merchant X as Business)
  name: Category Override Rules
- description: A customer budget, overall or per category, with alert thresholds
  name: Budgets
- description: Actuals for one period of a budget
  name: Budget Periods
- description: Detected subscription or recurring payment (streaming, utilities, rent) with next expected charge
  name: Recurring Payments
- description: An insight card for a customer (spend spike, low-balance forecast, new subscription) and its delivery
  name: Financial Insights
- description: Projected daily balance for a customer account over the next 30-90 days. Append-only snapshots.
  name: Cash Flow Forecasts
- description: Spending analytics computed from enrichments
  name: Spending Summaries
