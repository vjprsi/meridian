            application/json:
              schema:
                $ref: '#/components/schemas/SpendCategoryPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ENG-03
      x-service: insights-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:read")'
      x-table: spend_category
      x-crud: true
      x-crud-list: true
    post:
      operationId: spendCategoriesCreate
      summary: Create spend categorie
      tags:
      - Spend Categories
      security:
      - oauth2:
        - engagement:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
