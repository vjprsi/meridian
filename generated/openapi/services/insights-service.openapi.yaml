          type: string
        mcc:
          maxLength: 4
          type: string
        raw_description:
          maxLength: 500
          type: string
        source_id:
          format: uuid
          type: string
        source_type:
          enum:
          - CARD_AUTHORIZATION
          - CARD_CLEARING
          - PAYMENT
          - WALLET_TRANSACTION
          - DEPOSIT_TRANSACTION
          type: string
      required:
      - source_type
      - source_id
      - amount
      - currency
      type: object
    TransactionEnrichmentsRecategoriseRequest:
      properties:
        create_rule:
          type: boolean
        spend_category_id:
          format: uuid
          type: string
      required:
      - spend_category_id
      type: object
