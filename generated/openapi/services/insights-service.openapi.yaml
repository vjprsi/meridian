          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Customer
          format: uuid
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        name:
          description: Budget name
          maxLength: 120
          type: string
        period_type:
          description: Budget period
          enum:
          - WEEKLY
          - MONTHLY
          - QUARTERLY
          - YEARLY
          type: string
        rollover:
          description: Carry unspent amount to next period
          type: boolean
        row_version:
