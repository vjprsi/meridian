openapi: 3.1.0
info:
  title: Meridian Core — webhook-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Webhook Endpoints
  description: A client HTTPS endpoint receiving events
- name: Webhook Subscriptions
  description: An event type (or wildcard) an endpoint subscribes to, with an optional filter
- name: Webhook Deliveries
  description: Delivery of one event to one endpoint, with retry state
- name: Event Replays
  description: A request to re-deliver past events to an endpoint
