          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Account holder
          format: uuid
          type: string
        date_of_birth:
          description: Date of birth (individuals)
          format: date
          type:
          - string
          - 'null'
        gross_dividends:
          description: Gross dividends
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        gross_interest:
          description: Gross interest paid
          examples:
          - '125.50'
          format: decimal
