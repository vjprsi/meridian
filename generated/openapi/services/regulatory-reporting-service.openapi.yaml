components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    ReportDefinitionPage:
      type: object
      description: One page of ReportDefinition results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDefinition'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReportDefinitionVersionPage:
      type: object
      description: One page of ReportDefinitionVersion results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDefinitionVersion'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReportDefinitionsAddVersionsRequest:
      type: object
      properties:
        template_document_id:
          type: string
          format: uuid
        data_sources:
          type: array
          items: {}
        field_mappings:
          type: array
          items: {}
        validation_rules:
          type: array
          items: {}
        xbrl_taxonomy:
          type: string
          maxLength: 255
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        change_note:
          type: string
      required:
      - data_sources
      - field_mappings
      - effective_from
    ReportDefinitionsPublishRequest:
      type: object
      properties:
        definition_version:
          type: integer
          format: int32
        comment:
          type: string
      required:
      - definition_version
    ReportDefinitionsDeprecateRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    ReportSchedulePage:
      type: object
      description: One page of ReportSchedule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportSchedule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ReportRunPage:
      type: object
      description: One page of ReportRun results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportRun'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
