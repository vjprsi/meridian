info:
  description: 'Loan origination with bureau, scoring and explainable decisions; loan servicing for instalment loans, revolving
    credit lines, BNPL and nano-loans; collateral management; and collections and recovery.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — loan-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/loans:
    get:
      operationId: loansList
      summary: List loans
      tags:
      - Loans
      security:
      - oauth2:
        - lending:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_DISBURSEMENT
          - ACTIVE
          - IN_ARREARS
          - RESTRUCTURED
          - PAID_OFF
          - CLOSED
          - WRITTEN_OFF
          - CHARGED_OFF
          - CANCELLED
      - name: loan_type
        in: query
        schema:
          type: string
          enum:
          - INSTALMENT
          - BNPL
          - NANO
          - MERCHANT_FINANCING
          - MORTGAGE
          - VEHICLE
          - OVERDRAFT_TERM
          - SME_TERM
      - name: delinquency_bucket
        in: query
        schema:
          type: string
          enum:
          - CURRENT
          - DPD_1_29
          - DPD_30_59
          - DPD_60_89
          - DPD_90_119
          - DPD_120_179
          - DPD_180_PLUS
      - name: ecl_stage
        in: query
        schema:
          type: string
          enum:
          - STAGE_1
          - STAGE_2
          - STAGE_3
          - POCI
      - name: credit_line_id
        in: query
        schema:
          type: string
          format: uuid
      - name: merchant_id
        in: query
        schema:
