openapi: 3.1.0
info:
  title: Meridian Core — loan-service
  version: 1.0.0
  description: 'Loan origination with bureau, scoring and explainable decisions; loan servicing for instalment loans, revolving
    credit lines, BNPL and nano-loans; collateral management; and collections and recovery.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Loans
  description: A booked loan (instalment, BNPL, nano, merchant financing, mortgage, SME term)
- name: Loan Disbursements
  description: A disbursement (single or tranche) of loan funds
- name: Schedule Installments
  description: One instalment of a repayment schedule with paid and due components
- name: Allocation Rules
  description: Repayment allocation waterfall configuration per product and loan state
- name: Loan Repayments
  description: A repayment received, with its allocation across components and instalments. Append-only.
- name: Loan Accruals
  description: Daily interest and penalty accrual per loan. Append-only.
- name: Loan Fee Charges
  description: A fee charged to a loan
- name: Loan Restructures
  description: Restructuring request (reschedule, refinance, payment holiday) with maker-checker
- name: Loan Prepayment Quotes
  description: A pay-off / partial prepayment quote valid until a date
- name: Loan Write Offs
  description: Write-off of a loan balance with approval and ledger posting
- name: Loan Recoveries
  description: Recovery received after write-off. Append-only.
- name: Credit Lines
  description: A revolving credit facility (credit line, credit card account, working capital, BNPL limit)
- name: Credit Line Drawdowns
  description: A draw on a credit line (purchase, cash advance, transfer, instalment conversion)
- name: Credit Line Statements
  description: Monthly statement of a credit line
- name: Bnpl Plans
  description: A buy-now-pay-later plan for a merchant purchase (pay-in-N or financed instalments)
paths:
  /v1/loans:
    get:
      operationId: loansList
      summary: List loans
      tags:
      - Loans
      security:
      - oauth2:
        - lending:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_DISBURSEMENT
          - ACTIVE
          - IN_ARREARS
          - RESTRUCTURED
          - PAID_OFF
          - CLOSED
          - WRITTEN_OFF
          - CHARGED_OFF
          - CANCELLED
      - name: loan_type
        in: query
        schema:
          type: string
          enum:
          - INSTALMENT
          - BNPL
          - NANO
          - MERCHANT_FINANCING
          - MORTGAGE
          - VEHICLE
          - OVERDRAFT_TERM
          - SME_TERM
      - name: delinquency_bucket
        in: query
        schema:
          type: string
          enum:
          - CURRENT
          - DPD_1_29
          - DPD_30_59
          - DPD_60_89
          - DPD_90_119
          - DPD_120_179
          - DPD_180_PLUS
      - name: ecl_stage
        in: query
        schema:
          type: string
          enum:
          - STAGE_1
          - STAGE_2
          - STAGE_3
          - POCI
      - name: credit_line_id
        in: query
        schema:
          type: string
          format: uuid
      - name: merchant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - LND-01
      - LND-02
      - LND-05
      - LND-06
      - LND-07
      x-service: loan-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:read")'
      x-required-scope: lending:read
      x-table: loan
      x-crud: true
      x-crud-list: true
    post:
      operationId: loansCreate
      summary: Create loan
      tags:
      - Loans
      security:
      - oauth2:
        - lending:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
      x-requirements:
      - LND-01
      - LND-02
      - LND-05
      - LND-06
      - LND-07
      x-service: loan-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:write")'
      x-required-scope: lending:write
      x-table: loan
      x-crud: true
