components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    LoanPage:
      type: object
      description: One page of Loan results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Loan'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LoansDisburseRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        method:
          type: string
          enum:
          - DEPOSIT_ACCOUNT
          - WALLET
          - EXTERNAL_TRANSFER
          - MERCHANT_SETTLEMENT
          - CASH
          - CARD
        destination_account_id:
          type: string
          format: uuid
        destination_wallet_id:
          type: string
          format: uuid
      required:
      - method
    LoansRepayRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        source:
          type: string
          enum:
          - AUTO_DEBIT
          - MANUAL
          - WALLET
          - CARD
          - EXTERNAL_TRANSFER
          - CASH
          - COLLATERAL_LIQUIDATION
          - RECOVERY
          - PAYROLL
        value_date:
          type: string
          format: date
        external_reference:
          type: string
          maxLength: 128
      required:
      - amount
      - source
    LoansPrepaymentQuoteRequest:
      type: object
      properties:
        quote_type:
          type: string
          maxLength: 16
        requested_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - quote_type
    LoansPrepayRequest:
      type: object
      properties:
        loan_prepayment_quote_id:
          type: string
          format: uuid
      required:
      - loan_prepayment_quote_id
    LoansChangeRateRequest:
      type: object
      properties:
        new_rate:
          type: string
          format: decimal
          examples:
          - '125.50'
        effective_date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 255
      required:
      - new_rate
      - effective_date
      - reason
    LoansRestructureRequest:
      type: object
      properties:
        restructure_type:
          type: string
          enum:
          - RESCHEDULE
          - REFINANCE
          - PAYMENT_HOLIDAY
          - TERM_EXTENSION
          - RATE_REDUCTION
          - CAPITALISATION
          - SETTLEMENT
        reason:
          type: string
          maxLength: 500
        new_term_months:
          type: integer
          format: int32
        new_interest_rate:
          type: string
          format: decimal
          examples:
          - '125.50'
        holiday_months:
          type: integer
          format: int32
        capitalise_arrears:
          type: boolean
      required:
      - restructure_type
      - reason
    LoansWriteOffRequest:
      type: object
      properties:
        write_off_type:
          type: string
          enum:
          - FULL
          - PARTIAL
        reason:
          type: string
          maxLength: 500
        principal_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
      required:
      - write_off_type
      - reason
    LoansCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    LoansSetAutoDebitRequest:
      type: object
      properties:
        auto_debit_enabled:
