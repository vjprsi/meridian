          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmScenario'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TmScenarioUpdate'
      x-requirements:
      - FRM-02
      x-service: transaction-monitoring-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:write")'
      x-required-scope: risk:write
      x-table: tm_scenario
      x-crud: true
      x-crud-update: true
