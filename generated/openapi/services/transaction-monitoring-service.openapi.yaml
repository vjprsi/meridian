        from_type:
          type: string
          enum:
          - CUSTOMER
          - ACCOUNT
          - CARD
          - DEVICE
          - IP_ADDRESS
          - PHONE
          - EMAIL
          - ADDRESS
          - BENEFICIARY
          - MERCHANT
        from_ref:
          type: string
          maxLength: 128
        from_customer_id:
          type: string
