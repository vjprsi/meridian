openapi: 3.1.0
info:
  title: Meridian Core — transaction-monitoring-service
  version: 1.0.0
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Tm Scenarios
  description: AML monitoring scenario (structuring, rapid movement, mule, dormant reactivation, ...)
- name: Tm Scenario Versions
  description: Versioned thresholds and parameters of a scenario (tuning history kept for audit)
- name: Tm Runs
  description: Execution of scenarios in batch, backtest or a streaming checkpoint window
- name: Tm Alerts
  description: AML alert raised by a scenario, with score and aggregate figures
- name: Tm Transactions
  description: Transaction feed. Each ingested leg updates the risk graph and runs the active streaming scenarios for the
    customer.
- name: Customer Risk Ratings
  description: Customer AML risk rating (CRR) with contributing factors and next review date
- name: Risk Graph Entities
  description: Node in the risk graph (customer, account, device, IP, phone, beneficiary, ...)
- name: Risk Graph Links
  description: Edge between two graph entities (shared device, transfer, shared address, ...)
paths:
  /v1/risk/monitoring/scenarios:
    get:
      operationId: tmScenariosList
      summary: List tm scenarios
      tags:
      - Tm Scenarios
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: scenario_type
        in: query
        schema:
          type: string
          enum:
          - STRUCTURING
          - RAPID_MOVEMENT
          - MULE_ACCOUNT
          - DORMANT_REACTIVATION
          - HIGH_RISK_JURISDICTION
          - LARGE_CASH
          - ROUND_AMOUNTS
          - FAN_IN
          - FAN_OUT
          - PROFILE_DEVIATION
          - TERRORIST_FINANCING
          - CUSTOM
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - TUNING
          - RETIRED
      - name: run_mode
        in: query
        schema:
          type: string
          enum:
          - STREAMING
          - BATCH
          - BACKTEST
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmScenarioPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FRM-02
      x-service: transaction-monitoring-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-required-scope: risk:read
      x-table: tm_scenario
      x-crud: true
      x-crud-list: true
    post:
      operationId: tmScenariosCreate
      summary: Create tm scenario
      tags:
      - Tm Scenarios
      security:
      - oauth2:
        - risk:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmScenario'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TmScenarioCreate'
      x-requirements:
      - FRM-02
      x-service: transaction-monitoring-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:write")'
      x-required-scope: risk:write
      x-table: tm_scenario
      x-crud: true
      x-crud-create: true
  /v1/risk/monitoring/scenarios/{id}:
    get:
      operationId: tmScenariosGet
      summary: Retrieve tm scenario
      tags:
