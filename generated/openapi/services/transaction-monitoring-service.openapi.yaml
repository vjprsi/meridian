security:
- oauth2: []
servers:
- description: Production
  url: https://api.meridian.example
- description: Sandbox
  url: https://sandbox.api.meridian.example
tags:
- description: AML monitoring scenario (structuring, rapid movement, mule, dormant reactivation, ...)
  name: Tm Scenarios
- description: Versioned thresholds and parameters of a scenario (tuning history kept for audit)
  name: Tm Scenario Versions
- description: Execution of scenarios in batch, backtest or a streaming checkpoint window
  name: Tm Runs
- description: AML alert raised by a scenario, with score and aggregate figures
  name: Tm Alerts
- description: Customer AML risk rating (CRR) with contributing factors and next review date
  name: Customer Risk Ratings
- description: Node in the risk graph (customer, account, device, IP, phone, beneficiary, ...)
  name: Risk Graph Entities
- description: Edge between two graph entities (shared device, transfer, shared address, ...)
  name: Risk Graph Links
