          description: Counterparty
        counterparty_account:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Counterparty account / IBAN / wallet reference
        counterparty_country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Counterparty country (ISO 3166-1 alpha-2)
        occurred_at:
