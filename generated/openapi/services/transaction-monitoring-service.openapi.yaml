components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    AmlCase:
      description: An AML / fraud / sanctions investigation case consolidating related alerts
      properties:
        ai_summary:
          description: AI-generated case summary with citations
          readOnly: true
          type:
          - string
          - 'null'
        assigned_to:
          description: Investigator
          maxLength: 64
          type:
          - string
          - 'null'
        case_number:
          description: Human-readable case number
          maxLength: 32
          readOnly: true
          type: string
        case_type:
          description: Case type
          enum:
          - AML
          - FRAUD
          - SANCTIONS
          - KYC
          - MULE
          - TERRORIST_FINANCING
          - BRIBERY_CORRUPTION
          type: string
        closed_at:
          description: Closed
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Primary subject
          format: uuid
          type:
          - string
          - 'null'
        description:
          description: Investigation scope
          type:
          - string
          - 'null'
        due_at:
          description: Regulatory / internal deadline
          format: date-time
          type:
          - string
          - 'null'
        escalated_to:
          description: MLRO or senior reviewer
          maxLength: 64
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        opened_at:
          description: Opened
          format: date-time
          readOnly: true
          type: string
        priority:
          description: Priority
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          type: string
        risk_score:
          description: Aggregate risk score 0-1000
          format: int32
          type:
          - integer
          - 'null'
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        status:
          description: Status
          enum:
          - OPEN
          - INVESTIGATING
          - PENDING_APPROVAL
          - ESCALATED
          - SAR_FILED
          - CLOSED
          type: string
        tags:
          additionalProperties: true
          description: Free tags
          type:
          - object
          - 'null'
        team:
          description: Team / queue
          maxLength: 64
          type:
          - string
          - 'null'
        title:
          description: Short summary
          maxLength: 255
          type: string
        total_amount:
          description: Total suspicious amount
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - case_number
      - case_type
      - status
      - priority
      - title
      - opened_at
