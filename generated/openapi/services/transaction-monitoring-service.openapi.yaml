    TmTransaction:
      type: object
      description: Monitored transaction feed (one row per customer leg), ingested from payments, cards, wallets and the ledger.
        Append-only.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
