      type: object
      description: An AML / fraud / sanctions investigation case consolidating related alerts
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        case_number:
          type: string
          maxLength: 32
          description: Human-readable case number
          readOnly: true
        case_type:
          type: string
          enum:
          - AML
          - FRAUD
          - SANCTIONS
          - KYC
          - MULE
          - TERRORIST_FINANCING
          - BRIBERY_CORRUPTION
          description: Case type
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - PENDING_APPROVAL
          - ESCALATED
          - SAR_FILED
          - CLOSED
          description: Status (changed only by actions)
          readOnly: true
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          description: Priority
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Primary subject
        title:
          type: string
          maxLength: 255
          description: Short summary
        description:
          type:
          - string
          - 'null'
          description: Investigation scope
        risk_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Aggregate risk score 0-1000
        total_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Total suspicious amount
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        assigned_to:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Investigator
        team:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Team / queue
        opened_at:
          type: string
          format: date-time
          description: Opened
          readOnly: true
        due_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Regulatory / internal deadline
        escalated_to:
          type:
          - string
          - 'null'
          maxLength: 64
          description: MLRO or senior reviewer (use /escalate)
          readOnly: true
        escalation_reason:
          type:
          - string
          - 'null'
          description: Why the case was escalated
          readOnly: true
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Closed
          readOnly: true
        ai_summary:
          type:
          - string
          - 'null'
          description: AI-generated case summary with citations
          readOnly: true
        tags:
          type:
          - array
          - 'null'
          items: {}
