components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    TmScenarioPage:
      type: object
      description: One page of TmScenario results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TmScenario'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TmScenarioVersionPage:
      type: object
      description: One page of TmScenarioVersion results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TmScenarioVersion'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TmScenariosAddVersionsRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
        lookback_days:
          type: integer
          format: int32
        min_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        min_count:
          type: integer
          format: int32
        risk_weight:
          type: string
          format: decimal
          examples:
          - '125.50'
        tuning_rationale:
          type: string
      required:
      - parameters
      - lookback_days
      - tuning_rationale
    TmScenariosActivateRequest:
      type: object
      properties:
        scenario_version:
          type: integer
          format: int32
      required:
      - scenario_version
    TmScenariosRetireRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    TmScenariosBacktestRequest:
      type: object
      properties:
        scenario_version:
          type: integer
          format: int32
        from_ts:
          type: string
          format: date-time
        to_ts:
          type: string
          format: date-time
      required:
      - scenario_version
      - from_ts
      - to_ts
    TmScenarioVersionsSubmitRequest:
      type: object
      properties:
        comment:
          type: string
    TmScenarioVersionsRejectRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    TmRunPage:
