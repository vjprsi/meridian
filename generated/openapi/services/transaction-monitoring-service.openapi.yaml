          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        transaction_id:
          type: string
          format: uuid
          description: Business transaction id
        transaction_type:
          type: string
          maxLength: 40
          description: PAYMENT, CARD, WALLET, CASH, TRANSFER
        customer_id:
          type: string
          format: uuid
          description: Customer the leg belongs to
        account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer account
        journal_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Ledger posting
        direction:
          type: string
          enum:
          - DEBIT
          - CREDIT
          description: DEBIT = money out of the customer, CREDIT = money in
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount (positive)
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        is_cash:
          type: boolean
          description: Cash deposit / withdrawal
        channel:
          type:
          - string
          - 'null'
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
