openapi: 3.1.0
info:
  title: Meridian Core — card-vault-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Card Vault
  description: Internal PCI APIs (create = tokenize) plus a reveal endpoint for the cardholder app. PAN, CVV and PIN data
    are accepted as write-only fields and returned only by reveal.
- name: Card Vault Keys
  description: Key metadata for HSM-held keys (no key material stored)
- name: Card Vault Access Logs
  description: Immutable log of every detokenisation and reveal request
paths:
  /v1/card-vault:
    post:
      operationId: cardVaultCreate
      summary: Create card vault
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardDataVaultCreate'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
      x-crud: true
      x-crud-create: true
  /v1/card-vault/{id}:
    get:
      operationId: cardVaultGet
      summary: Retrieve card vault
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_data_vault
      x-crud: true
      x-crud-get: true
  /v1/card-vault/reveal:
    post:
      operationId: cardVaultReveal
      summary: Reveal PAN, CVV and expiry of a card's active record (step-up done by the caller); every access is audit-logged;
        with public_key the values come back RSA-OAEP encrypted in encrypted_payload
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultRevealRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/lookup:
    post:
      operationId: cardVaultLookup
      summary: Find the active vault record of a PAN by its keyed fingerprint (3DS, token provisioning)
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultLookupRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/verify:
    post:
      operationId: cardVaultVerify
      summary: Verify CVV2, expiry and/or a PIN block for a token (authorisation path); returns {cvv_result, expiry_result,
        pin_result, pin_try_count}
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultVerifyRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/pin:
    post:
      operationId: cardVaultPin
      summary: Set or change the PIN from an ISO 9564 format 0 PIN block wrapped under a zone key; returns {pan_token, pin_set,
        event_type}
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultPinRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/pin/unblock:
    post:
      operationId: cardVaultPinUnblock
      summary: Reset the PIN try counter; returns {pan_token, pin_try_count}
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultPinUnblockRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/reissue:
    post:
      operationId: cardVaultReissue
      summary: Copy a PAN under a new token with a new expiry and CVV (renewal, replacement keeping the PAN); the source record
        becomes inactive
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultReissueRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/rotate-keys:
    post:
      operationId: cardVaultRotateKeys
      summary: Create a new key version, retire the old one and re-encrypt every record under the new DEK (operator only);
        returns {key_type, new_key_id, version, re_encrypted}
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultRotateKeysRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/keys:
    get:
      operationId: cardVaultKeysList
      summary: List card vault keys
      tags:
      - Card Vault Keys
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: key_type
        in: query
        schema:
          type: string
          enum:
          - PAN_DEK
          - CVV_KEY
          - PIN_KEY
          - ZPK
          - CVK
          - MDK
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultKeyPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_key
      x-crud: true
      x-crud-list: true
    post:
      operationId: cardVaultKeysCreate
      summary: Create card vault key
      tags:
      - Card Vault Keys
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultKey'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultKeyCreate'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_vault_key
      x-crud: true
      x-crud-create: true
  /v1/card-vault/keys/{id}:
    get:
      operationId: cardVaultKeysGet
      summary: Retrieve card vault key
      tags:
      - Card Vault Keys
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultKey'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_key
      x-crud: true
      x-crud-get: true
  /v1/card-vault/access-logs:
    get:
      operationId: cardVaultAccessLogsList
      summary: List card vault access logs
      tags:
      - Card Vault Access Logs
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: pan_token
        in: query
        schema:
          type: string
          maxLength: 64
      - name: card_id
        in: query
        schema:
          type: string
          format: uuid
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - AUTHORIZATION
          - TOKENIZATION
          - REVEAL
          - BUREAU_FILE
          - SCHEME_FILE
          - PIN_MANAGEMENT
          - LOOKUP
          - REISSUE
          - THREEDS
          - KEY_ROTATION
      - name: caller_service
        in: query
        schema:
          type: string
          maxLength: 64
      - name: success
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultAccessLogPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - ADM-03
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_access_log
      x-crud: true
      x-crud-list: true
  /v1/card-vault/access-logs/{id}:
    get:
      operationId: cardVaultAccessLogsGet
      summary: Retrieve card vault access log
      tags:
      - Card Vault Access Logs
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultAccessLog'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_access_log
      x-crud: true
      x-crud-get: true
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CardVaultRevealRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - AUTHORIZATION
          - TOKENIZATION
          - REVEAL
          - BUREAU_FILE
          - SCHEME_FILE
          - PIN_MANAGEMENT
          - LOOKUP
          - REISSUE
          - THREEDS
          - KEY_ROTATION
        public_key:
          type: string
      required:
      - card_id
      - purpose
    CardVaultLookupRequest:
      type: object
      properties:
        pan:
          type: string
          maxLength: 19
        purpose:
          type: string
          enum:
          - AUTHORIZATION
          - TOKENIZATION
          - REVEAL
          - BUREAU_FILE
          - SCHEME_FILE
          - PIN_MANAGEMENT
          - LOOKUP
          - REISSUE
          - THREEDS
          - KEY_ROTATION
      required:
      - pan
      - purpose
    CardVaultVerifyRequest:
      type: object
      properties:
        pan_token:
          type: string
          maxLength: 64
        cvv:
          type: string
          maxLength: 4
        expiry_month:
          type: integer
          format: int32
        expiry_year:
          type: integer
          format: int32
        encrypted_pin_block:
          type: string
          maxLength: 128
        pin_key_id:
          type: string
          maxLength: 64
      required:
      - pan_token
    CardVaultPinRequest:
      type: object
      properties:
        pan_token:
          type: string
          maxLength: 64
        encrypted_pin_block:
          type: string
          maxLength: 128
        pin_key_id:
          type: string
          maxLength: 64
      required:
      - pan_token
      - encrypted_pin_block
      - pin_key_id
    CardVaultPinUnblockRequest:
      type: object
      properties:
        pan_token:
          type: string
          maxLength: 64
        reason:
          type: string
          maxLength: 255
      required:
      - pan_token
    CardVaultReissueRequest:
      type: object
      properties:
        pan_token:
          type: string
          maxLength: 64
        card_id:
          type: string
          format: uuid
        expiry_month:
          type: integer
          format: int32
        expiry_year:
          type: integer
          format: int32
      required:
      - pan_token
      - card_id
      - expiry_month
      - expiry_year
    CardVaultRotateKeysRequest:
      type: object
      properties:
        key_type:
          type: string
          enum:
          - PAN_DEK
          - CVV_KEY
          - PIN_KEY
          - ZPK
          - CVK
          - MDK
      required:
      - key_type
    CardVaultKeyPage:
      type: object
      description: One page of CardVaultKey results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardVaultKey'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardVaultAccessLogPage:
      type: object
      description: One page of CardVaultAccessLog results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardVaultAccessLog'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardDataVault:
      type: object
      description: Encrypted sensitive card data keyed by PAN token
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        pan_token:
          type: string
          maxLength: 64
          description: Random token of the PAN (not derived from it)
          readOnly: true
        pan_fingerprint:
          type: string
          maxLength: 64
          description: Keyed HMAC-SHA256 of the PAN for de-duplication and lookup
          readOnly: true
