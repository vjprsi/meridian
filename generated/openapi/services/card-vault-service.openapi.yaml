openapi: 3.1.0
info:
  title: Meridian Core — card-vault-service
  version: 1.0.0
  description: 'Card issuing processor: card programs and products, virtual and physical cards, card controls, PCI card data
    vault, real-time ISO 8583 authorisation inside the ledger with JIT funding and stand-in, network tokenisation, 3-D Secure,
    clearing and settlement, interchange and fees, and scheme disputes.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Card Vault
  description: Internal PCI APIs plus a reveal endpoint that returns PAN/CVV inside an encrypted, single-use response for
    the cardholder app.
- name: Card Vault Keys
  description: Key metadata for HSM-held keys (no key material stored)
- name: Card Vault Access Logs
  description: Immutable log of every detokenisation and reveal request
paths:
  /v1/card-vault/{id}:
    get:
      operationId: cardVaultGet
      summary: Retrieve card vault
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_data_vault
      x-crud: true
      x-crud-get: true
  /v1/card-vault/tokenize:
    post:
      operationId: cardVaultTokenize
      summary: Store a PAN and return its token (internal)
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDataVault'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultTokenizeRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/reveal:
    post:
      operationId: cardVaultReveal
      summary: Return PAN, CVV and expiry encrypted to the cardholder app's public key (step-up required)
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultRevealRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/rotate-keys:
    post:
      operationId: cardVaultRotateKeys
      summary: Re-encrypt records under a new DEK (operator only)
      tags:
      - Card Vault
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultRotateKeysRequest'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_data_vault
  /v1/card-vault/keys:
    get:
      operationId: cardVaultKeysList
      summary: List card vault keys
      tags:
      - Card Vault Keys
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: key_type
        in: query
        schema:
          type: string
          enum:
          - PAN_DEK
          - CVV_KEY
          - PIN_KEY
          - ZPK
          - CVK
          - MDK
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultKeyPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_key
      x-crud: true
      x-crud-list: true
    post:
      operationId: cardVaultKeysCreate
      summary: Create card vault key
      tags:
      - Card Vault Keys
      security:
      - oauth2:
        - cards:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultKey'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVaultKeyCreate'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:write")'
      x-required-scope: cards:write
      x-table: card_vault_key
      x-crud: true
      x-crud-create: true
  /v1/card-vault/keys/{id}:
    get:
      operationId: cardVaultKeysGet
      summary: Retrieve card vault key
      tags:
      - Card Vault Keys
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultKey'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_key
      x-crud: true
      x-crud-get: true
  /v1/card-vault/access-logs:
    get:
      operationId: cardVaultAccessLogsList
      summary: List card vault access logs
      tags:
      - Card Vault Access Logs
      security:
      - oauth2:
        - cards:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: pan_token
        in: query
        schema:
          type: string
          maxLength: 64
      - name: purpose
        in: query
        schema:
          type: string
          maxLength: 32
      - name: caller_service
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultAccessLogPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
      x-requirements:
      - ADM-03
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_access_log
      x-crud: true
      x-crud-list: true
  /v1/card-vault/access-logs/{id}:
    get:
      operationId: cardVaultAccessLogsGet
      summary: Retrieve card vault access log
      tags:
      - Card Vault Access Logs
      security:
      - oauth2:
        - cards:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardVaultAccessLog'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-03
      - CRD-07
      x-service: card-vault-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("cards:read")'
      x-required-scope: cards:read
      x-table: card_vault_access_log
      x-crud: true
      x-crud-get: true
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CardVaultTokenizeRequest:
      type: object
      properties:
        pan:
          type: string
          maxLength: 19
        cvv:
          type: string
          maxLength: 4
        expiry_month:
          type: integer
          format: int32
        expiry_year:
          type: integer
          format: int32
      required:
      - pan
      - expiry_month
      - expiry_year
    CardVaultRevealRequest:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        public_key:
          type: string
      required:
      - card_id
      - public_key
    CardVaultRotateKeysRequest:
      type: object
      properties:
        key_type:
          type: string
          enum:
          - PAN_DEK
          - CVV_KEY
          - PIN_KEY
          - ZPK
          - CVK
          - MDK
      required:
      - key_type
    CardVaultKeyPage:
      type: object
      description: One page of CardVaultKey results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardVaultKey'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardVaultAccessLogPage:
      type: object
      description: One page of CardVaultAccessLog results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardVaultAccessLog'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CardDataVault:
      type: object
      description: Encrypted sensitive card data keyed by PAN token
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        pan_token:
          type: string
          maxLength: 64
          description: Token of the PAN
        pan_fingerprint:
          type: string
          maxLength: 64
          description: Keyed HMAC of the PAN for lookup
        dek_key_id:
          type: string
          format: uuid
          description: Data encryption key used
        card_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Card
        last_detokenized_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last detokenisation time
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - pan_token
      - pan_fingerprint
      - dek_key_id
    CardVaultAccessLog:
      type: object
      description: Immutable log of every detokenisation and reveal request
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        pan_token:
          type: string
          maxLength: 64
          description: Token accessed
        purpose:
          type: string
          maxLength: 32
          description: AUTHORIZATION, TOKENIZATION, REVEAL, BUREAU_FILE, SCHEME_FILE
        caller_service:
          type: string
          maxLength: 64
          description: Calling workload identity
        actor_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: User or customer for reveal requests
        success:
          type: boolean
          description: Outcome
        ip_address:
          type:
          - string
          - 'null'
          description: Caller IP (IPv4 or IPv6 address)
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - pan_token
      - purpose
      - caller_service
      - success
    CardVaultKey:
      type: object
      description: Key metadata for HSM-held keys (no key material stored)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        key_type:
          type: string
          enum:
          - PAN_DEK
          - CVV_KEY
          - PIN_KEY
          - ZPK
          - CVK
          - MDK
          description: Key purpose
        hsm_key_label:
          type: string
          maxLength: 128
          description: Label of the key inside the HSM
        kcv:
          type: string
          maxLength: 6
          description: Key check value
        algorithm:
          type: string
          maxLength: 32
          description: AES-256, TDES, etc.
        version:
          type: integer
          format: int32
          description: Key version
        active_from:
          type: string
          format: date-time
          description: Activation
        retire_after:
          type:
          - string
          - 'null'
          format: date-time
          description: Scheduled rotation
        is_active:
          type: boolean
          description: Active
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - key_type
      - hsm_key_label
      - kcv
      - algorithm
      - version
      - active_from
      - is_active
    CardVaultKeyCreate:
      type: object
      properties:
        key_type:
          type: string
          enum:
          - PAN_DEK
          - CVV_KEY
          - PIN_KEY
          - ZPK
          - CVK
          - MDK
          description: Key purpose
        hsm_key_label:
          type: string
          maxLength: 128
          description: Label of the key inside the HSM
        kcv:
          type: string
          maxLength: 6
          description: Key check value
        algorithm:
          type: string
          maxLength: 32
          description: AES-256, TDES, etc.
        version:
          type: integer
          format: int32
          description: Key version
        active_from:
          type: string
          format: date-time
          description: Activation
        retire_after:
          type: string
          format: date-time
          description: Scheduled rotation
        is_active:
          type: boolean
          description: Active
        custom_field_1:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - key_type
      - hsm_key_label
      - kcv
      - algorithm
      - active_from
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical request; replays return the original response for 24h
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
