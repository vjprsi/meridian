components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    ApprovalRequest:
      description: A pending sensitive operation awaiting checker approval (four-eyes)
      properties:
        action:
          description: Action
          maxLength: 40
          type: string
        amount:
          description: Amount, for threshold routing
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        approval_policy_id:
          description: Policy applied
          format: uuid
          type:
          - string
          - 'null'
        approvals_received:
          description: Approvals received
          format: int32
          readOnly: true
          type: integer
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Currency of the amount (ISO 4217)
          pattern: ^[A-Z]{3}$
          type:
          - string
          - 'null'
        current_level:
          description: Current approval level
          format: int32
          readOnly: true
          type: integer
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        decided_at:
          description: Final decision time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        diff:
          additionalProperties: true
          description: Before/after diff for updates
          type:
          - object
          - 'null'
        executed_at:
          description: Execution time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        execution_result:
          additionalProperties: true
          description: Result or error from executing the operation
          readOnly: true
          type:
          - object
          - 'null'
        expires_at:
          description: Expiry
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        maker:
          description: Requesting user
          maxLength: 64
          readOnly: true
          type: string
        payload:
          additionalProperties: true
          description: Operation to execute once approved
          type: object
        priority:
          description: Priority
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          type: string
        required_approvals:
          description: Approvals required
          format: int32
          readOnly: true
          type: integer
        resource_id:
          description: Resource id (empty for creates)
          format: uuid
          type:
          - string
          - 'null'
        resource_type:
          description: Resource type
          maxLength: 64
          type: string
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        status:
          description: Status
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CANCELLED
          - EXPIRED
          - EXECUTED
          - EXECUTION_FAILED
          readOnly: true
          type: string
        summary:
          description: Human-readable description of the change
          type:
          - string
          - 'null'
        title:
          description: Short title shown in the approvals queue
          maxLength: 255
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - resource_type
      - action
      - title
      - payload
      - priority
      - status
      - maker
      - required_approvals
      - approvals_received
      - current_level
