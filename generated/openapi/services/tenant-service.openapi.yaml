openapi: 3.1.0
info:
  title: Meridian Core — tenant-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Cells
  description: Platform-operator API for deployment cells
- name: Tenants
  description: Platform-operator API for tenant lifecycle
- name: Modules
  description: Platform modules enabled for the tenant and their module-level configuration
- name: Legal Entities
  description: A licensed or registered legal entity of the tenant that owns books, products and customers
- name: Branches
  description: A branch, service centre or virtual unit of a legal entity
- name: Settings
  description: Typed tenant-level setting (key/value) used by all services
- name: Feature Flags
  description: Feature flag with targeting rules and gradual rollout
- name: Branding
  description: White-label branding per channel (logo, colours, fonts, copy, domains, senders)
paths:
  /v1/platform/cells:
    get:
      operationId: cellsList
      summary: List cells
      tags:
      - Cells
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: region
        in: query
        schema:
          type: string
          maxLength: 32
      - name: cloud_provider
        in: query
        schema:
          type: string
          enum:
          - AWS
          - GCP
          - AZURE
          - ON_PREMISES
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PROVISIONING
          - ACTIVE
          - DRAINING
          - READ_ONLY
          - DECOMMISSIONED
      - name: is_dedicated
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-01
      x-service: tenant-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: cell
      x-crud: true
      x-crud-list: true
    post:
      operationId: cellsCreate
      summary: Create cell
      tags:
      - Cells
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cell'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellCreate'
      x-requirements:
      - ADM-01
      x-service: tenant-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("meridian:admin")'
      x-required-scope: meridian:admin
      x-table: cell
      x-crud: true
      x-crud-create: true
