openapi: 3.1.0
info:
  title: Meridian Core — notification-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Notifications
  description: A message sent (or to be sent) to a recipient on one channel
- name: Notification Templates
  description: Localised message template per channel
- name: Notification Providers
  description: Delivery provider per channel with priority for failover
- name: Notification Rules
  description: Maps a domain event to notifications (template, channels, recipient, conditions)
- name: Notification Preferences
  description: A recipient's channel preferences and quiet hours per category
paths:
  /v1/notifications:
    get:
      operationId: notificationsList
      summary: List notifications
      tags:
      - Notifications
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: recipient_type
        in: query
        schema:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - AGENT
          - MERCHANT
          - EXTERNAL
      - name: recipient_id
        in: query
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - PUSH
          - SMS
          - EMAIL
          - WHATSAPP
          - IN_APP
          - USSD
          - VOICE
      - name: category
        in: query
        schema:
          type: string
          enum:
          - TRANSACTIONAL
          - SECURITY
          - SERVICE
          - MARKETING
          - REGULATORY
          - COLLECTIONS
      - name: status
        in: query
        schema:
          type: string
          enum:
          - QUEUED
          - SCHEDULED
          - SENT
          - DELIVERED
          - READ
          - FAILED
          - SUPPRESSED
          - EXPIRED
          - CANCELLED
      - name: source_event_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - NOT-01
      - NOT-02
      x-service: notification-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: notification
      x-crud: true
      x-crud-list: true
    post:
      operationId: notificationsCreate
      summary: Create notification
      tags:
      - Notifications
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      x-requirements:
      - NOT-01
      - NOT-02
      x-service: notification-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: notification
      x-crud: true
      x-crud-create: true
  /v1/notifications/{id}:
    get:
      operationId: notificationsGet
      summary: Retrieve notification
      tags:
      - Notifications
      security:
      - oauth2:
        - platform:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
