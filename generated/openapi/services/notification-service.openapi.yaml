info:
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — notification-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/notifications:
    get:
      operationId: notificationsList
      summary: List notifications
      tags:
      - Notifications
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: recipient_type
        in: query
        schema:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - AGENT
          - MERCHANT
          - EXTERNAL
      - name: recipient_id
        in: query
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - PUSH
          - SMS
          - EMAIL
          - WHATSAPP
          - IN_APP
          - USSD
          - VOICE
      - name: category
        in: query
        schema:
          type: string
          enum:
          - TRANSACTIONAL
          - SECURITY
          - SERVICE
          - MARKETING
          - REGULATORY
          - COLLECTIONS
      - name: status
        in: query
        schema:
          type: string
          enum:
          - QUEUED
          - SCHEDULED
          - SENT
          - DELIVERED
          - READ
          - FAILED
          - SUPPRESSED
          - EXPIRED
      - name: source_event_id
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
