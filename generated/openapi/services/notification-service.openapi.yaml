components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    NotificationPage:
      type: object
      description: One page of Notification results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    NotificationDeliveryAttemptPage:
      type: object
      description: One page of NotificationDeliveryAttempt results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDeliveryAttempt'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    NotificationsSendTemplatedRequest:
      type: object
      properties:
        template_code:
          type: string
          maxLength: 64
        recipient_type:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - AGENT
          - MERCHANT
          - EXTERNAL
        recipient_id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - PUSH
          - SMS
          - EMAIL
          - WHATSAPP
          - IN_APP
          - USSD
          - VOICE
        destination:
          type: string
          maxLength: 512
        locale:
          type: string
          maxLength: 10
        category:
          type: string
          enum:
          - TRANSACTIONAL
          - SECURITY
          - SERVICE
          - MARKETING
          - REGULATORY
          - COLLECTIONS
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        scheduled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true
      required:
      - template_code
      - recipient_type
      - recipient_id
    NotificationsProviderCallbacksEventsRequest:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
      required:
      - payload
    NotificationTemplatePage:
      type: object
      description: One page of NotificationTemplate results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplate'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    NotificationTemplatesPreviewRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: true
      required:
      - variables
    NotificationTemplatesTestSendRequest:
      type: object
      properties:
        destination:
          type: string
          maxLength: 320
      required:
      - destination
    NotificationProviderPage:
      type: object
      description: One page of NotificationProvider results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationProvider'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    NotificationProvidersTestRequest:
      type: object
      properties:
        destination:
          type: string
          maxLength: 320
      required:
      - destination
    NotificationRulePage:
      type: object
      description: One page of NotificationRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    NotificationPreferencePage:
      type: object
      description: One page of NotificationPreference results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ApprovalRequest:
      type: object
      description: A pending sensitive operation awaiting checker approval (four-eyes)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        approval_policy_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Policy applied
        resource_type:
          type: string
          maxLength: 64
          description: Resource type
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Resource id (empty for creates)
        action:
          type: string
          maxLength: 40
          description: Action
        title:
          type: string
          maxLength: 255
          description: Short title shown in the approvals queue
        summary:
          type:
          - string
          - 'null'
          description: Human-readable description of the change
        payload:
          type: object
          additionalProperties: true
          description: Operation to execute once approved
        diff:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Before/after diff for updates
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount, for threshold routing (a request without an amount gets every level of an amount-tiered policy)
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency of the amount (ISO 4217)
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          description: Priority
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CHANGES_REQUESTED
          - CANCELLED
          - EXPIRED
          - EXECUTED
          - EXECUTION_FAILED
          description: Status
          readOnly: true
        maker:
          type: string
          maxLength: 64
          description: Requesting user
          readOnly: true
        owner_service:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Service that owns the resource type and executes the decision; set from the caller's service identity
            (X-Meridian-Service with an internal token), workflow-service for generic requests opened by users (SEC-03)
          readOnly: true
        required_approvals:
          type: integer
          format: int32
          description: Approvals required
          readOnly: true
        approvals_received:
          type: integer
          format: int32
          description: Approvals received
          readOnly: true
        current_level:
          type: integer
          format: int32
          description: Current approval level
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiry
          readOnly: true
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Final decision time
          readOnly: true
        executed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Execution time
          readOnly: true
        execution_result:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Result or error from executing the operation
          readOnly: true
        approval_route:
          type:
          - array
          - 'null'
          items: {}
          description: Snapshot of the applicable levels taken at creation (policy edits do not affect it)
          readOnly: true
        cancel_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason given by the maker when cancelling
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
