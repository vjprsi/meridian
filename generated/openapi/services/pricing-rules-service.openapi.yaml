openapi: 3.1.0
info:
  title: Meridian Core — pricing-rules-service
  version: 1.0.0
  description: 'Versioned, configuration-driven product catalogue for every product family (deposits, wallets, cards, loans,
    lines, BNPL, overdrafts), with interest, fees, tax, limits, eligibility, bundles, sandboxed WASM scripts and simulation;
    plus a DMN-compatible pricing and decision engine.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Decision Tables
  description: A named decision (pricing, eligibility, fee, limit, routing) with versions
- name: Decision Table Versions
  description: Versioned content of a decision table (inputs, outputs, rules) in DMN form
- name: Rule Evaluations
  description: Every decision evaluation with inputs, matched rules and outputs (explainability). Append-only.
- name: Price Quotes
  description: Price quote given to a customer (rate, fees, APR) valid until expiry
paths:
  /v1/decision-tables:
    get:
      operationId: decisionTablesList
      summary: List decision tables
      tags:
      - Decision Tables
      security:
      - oauth2:
        - product:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - PRICING
          - ELIGIBILITY
          - FEE
          - LIMIT
          - ROUTING
          - RISK
          - CUSTOM
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - PUBLISHED
          - RETIRED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionTablePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - PRD-04
      x-service: pricing-rules-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("product:read")'
      x-table: decision_table
      x-crud: true
      x-crud-list: true
    post:
      operationId: decisionTablesCreate
      summary: Create decision table
      tags:
      - Decision Tables
      security:
      - oauth2:
        - product:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionTable'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionTableCreate'
      x-requirements:
      - PRD-04
      x-service: pricing-rules-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("product:write")'
      x-table: decision_table
      x-crud: true
