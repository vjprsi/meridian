openapi: 3.1.0
info:
  title: Meridian Core — agent-network-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Agents
  description: A cash-in/cash-out agent business at any level of the hierarchy
- name: Agent Territories
  description: Geographic territory used to organise and manage the agent network
- name: Agent Outlets
  description: A physical point of service operated by an agent
- name: Agent Floats
  description: Float position configuration and alerting for an agent or outlet float wallet
- name: Agent Float Requests
  description: A float top-up, rebalance, withdrawal or transfer between agents
- name: Agent Tills
  description: A cash till at an outlet, opened and closed per shift with cash counts
- name: Agent Devices
  description: A POS terminal or phone used by an agent
- name: Agent Kyc Documents
  description: KYB document held for an agent (licence, tax certificate, contract)
- name: Cash Management Requests
  description: Cash-in-transit delivery or pickup request for an outlet
paths:
  /v1/agents:
    get:
      operationId: agentsList
      summary: List agents
      tags:
      - Agents
      security:
      - oauth2:
        - wallets:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: agent_level
        in: query
        schema:
          type: string
          enum:
          - SUPER_AGENT
          - AGENT
          - SUB_AGENT
      - name: parent_agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: super_agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ONBOARDING
          - ACTIVE
          - SUSPENDED
          - TERMINATED
      - name: agent_territory_id
        in: query
        schema:
          type: string
          format: uuid
      - name: agent_code
        in: query
        schema:
          type: string
          maxLength: 32
      - name: risk_rating
        in: query
        schema:
          type: string
          maxLength: 16
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ONB-04
      - WAL-01
      - WAL-02
      x-service: agent-network-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:read")'
      x-required-scope: wallets:read
      x-table: agent
      x-crud: true
      x-crud-list: true
    post:
      operationId: agentsCreate
      summary: Create agent
      tags:
      - Agents
      security:
      - oauth2:
        - wallets:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      x-requirements:
      - ONB-04
      - WAL-01
      - WAL-02
      x-service: agent-network-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("wallets:write")'
      x-required-scope: wallets:write
      x-table: agent
      x-crud: true
      x-crud-create: true
