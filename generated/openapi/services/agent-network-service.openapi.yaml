    StockOperation:
      type: object
      description: 'WE-FLOAT-1 (MQ-STK-1/4/14): an operator-level e-money stock operation. STOCK_CREATION mints e-money against
        a physical bank deposit (DEBIT 1150 bank clearing / CREDIT the capital pool wallet IND01); REIMBURSEMENT converts
        e-money back to cash (DEBIT the entity wallet / CREDIT capital, then DEBIT capital / CREDIT 1150). Maker-checker;
        money moves only on approval; idempotent retry on an unknown (5xx) wallet-service outcome. Account roles are per-tenant
        config (namespace ledger, key agent-network-service): bank_clearing, capital_wallet_id.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
