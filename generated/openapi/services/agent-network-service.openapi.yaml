              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    AgentPage:
      type: object
      description: One page of Agent results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AgentsActivateRequest:
      type: object
      properties:
        comment:
