openapi: 3.1.0
info:
  title: Meridian Core — agent-network-service
  version: 1.0.0
  description: 'Mobile money and e-wallets (the Mobiquity / Inswitch use case): customer, merchant, agent and system wallets
    with KYC-tier limits; agent networks with float, tills and devices; a multi-level commission engine; biller catalogue,
    bill payments and airtime; merchant acceptance (QR, terminals, payment links) and settlement; USSD and SMS channels; G2P
    and bulk disbursements; interoperability with national switches and other wallets. Every money movement posts through
    the ledger.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Agents
  description: A cash-in/cash-out agent business at any level of the hierarchy
- name: Agent Territories
  description: Geographic territory used to organise and manage the agent network
- name: Agent Outlets
  description: A physical point of service operated by an agent
- name: Agent Floats
  description: Float position configuration and alerting for an agent or outlet float wallet
- name: Agent Float Requests
  description: A float top-up, rebalance, withdrawal or transfer between agents
- name: Agent Tills
  description: A cash till at an outlet, opened and closed per shift with cash counts
- name: Agent Devices
  description: A POS terminal or phone used by an agent
- name: Agent Kyc Documents
  description: KYB document held for an agent (licence, tax certificate, contract)
- name: Cash Management Requests
  description: Cash-in-transit delivery or pickup request for an outlet
- name: Distribution Domains
  description: 'WE-HIER-1 (MQ-DOM-1/2): a top-level distribution domain of the configurable agent/customer hierarchy (e.g.
    the factory "Distribution" domain). Maker-checker; the code is permanent.

    '
- name: Domain Categories
  description: 'WE-HIER-1 (MQ-HIER-1/2): an n-level category inside a distribution domain. A root category (level 1) is the
    domain owner; deeper levels report to a parent category (derived level, cycle-guarded). Maker-checker.

    '
- name: Category Service Preferences
  description: 'WE-HIER-1 (MQ-DOM-2): the service map of a category per bearer role (payer / payee / initiator); which financial
    transaction types or non-financial services the category may perform.

    '
- name: Grades
  description: 'WE-HIER-1 (MQ-GRADE-1/2): a grade within a category (the finest classification of an agent, wallet or merchant).
    Exactly one grade per tenant is the un-registered grade (default for un-onboarded holders). Maker-checker; the code is
    permanent; a grade cannot be deleted while referenced.

    '
- name: Grade Services
  description: 'WE-HIER-1 (MQ-GRADE-2): the service map of a grade; which financial transaction types or non-financial services
    a grade may perform, optionally per bearer role. Narrows the category''s preferences.

    '
- name: Stock Operations
  description: 'WE-FLOAT-1 (MQ-STK-1/4/14): an operator-level e-money stock operation. STOCK_CREATION mints e-money against
    a physical bank deposit (DEBIT 1150 bank clearing / CREDIT the capital pool wallet IND01); REIMBURSEMENT converts e-money
    back to cash (DEBIT the entity wallet / CREDIT capital, then DEBIT capital / CREDIT 1150). Maker-checker; money moves
    only on approval; idempotent retry on an unknown (5xx) wallet-service outcome. Account roles are per-tenant config (namespace
    ledger, key agent-network-service): bank_clearing, capital_wallet_id.

    '
- name: Stock Sweep Runs
  description: 'WE-FLOAT-1 (MQ-STK-6): an auto-deallocation batch. /plan builds a PENDING_APPROVAL run of float wallets whose
    balance exceeds their min residual; a checker approves (money never moves unattended, even when the scheduler built the
    plan) and each candidate is swept float -> trust (2700). Per-line idempotent.

    '
- name: Unclaimed Settlements
  description: 'WE-FLOAT-1 (MQ-STK-13): aging of unregistered / unclaimed e-money. /plan builds a PENDING_APPROVAL run; a
    checker approves and GL->GL journals post via ledger-service: suspense 2710 -> unclaimed 2720 after suspense_age_days,
    then unclaimed 2720 -> capital (IND01) or income (IND03) after unclaimed_age_days.

    '
