    UnclaimedSettlementRun:
      type: object
      description: 'WE-FLOAT-1 (MQ-STK-13): aging of unregistered / unclaimed e-money. /plan builds a PENDING_APPROVAL run;
        a checker approves and GL->GL journals post via ledger-service: suspense 2710 -> unclaimed 2720 after suspense_age_days,
        then unclaimed 2720 -> capital (IND01) or income (IND03) after unclaimed_age_days.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        suspense_age_days:
          type: integer
          format: int32
          description: Days in suspense before -> unclaimed
        unclaimed_age_days:
          type: integer
          format: int32
          description: Days in unclaimed before -> final destination
        settle_to:
          type: string
          maxLength: 16
          description: 'Final destination of aged unclaimed funds: CAPITAL (IND01) or INCOME (IND03)'
        status:
          type: string
          enum:
          - PENDING_APPROVAL
          - RUNNING
          - SUCCEEDED
          - PARTIALLY_SUCCEEDED
          - FAILED
          - CANCELLED
          description: Status
          readOnly: true
        line_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Journal lines planned
          readOnly: true
        total_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Total amount aged
          readOnly: true
        settled_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Lines posted
          readOnly: true
        settled_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount posted
          readOnly: true
        failed_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Lines whose posting failed
          readOnly: true
        suspense_ledger_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Suspense GL (2710) resolved at approval
          readOnly: true
        unclaimed_ledger_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unclaimed GL (2720) resolved at approval
          readOnly: true
        capital_ledger_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Capital GL (IND01) resolved at approval
          readOnly: true
        income_ledger_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Income GL (IND03) resolved at approval
          readOnly: true
        approved_by:
          type:
