          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        operation_type:
          type: string
          enum:
          - STOCK_CREATION
          - REIMBURSEMENT
          description: Stock creation or reimbursement
        instrument:
          type: string
          enum:
          - CASH
          - CHEQUE
          - DD
          - BANK_TRANSFER
          description: Funding instrument (cash, cheque, demand draft, bank transfer)
