info:
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — fraud-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/risk/fraud/scores:
    get:
      operationId: fraudScoresList
      summary: List fraud scores
      tags:
      - Fraud Scores
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: subject_type
        in: query
        schema:
          type: string
          enum:
          - CARD_AUTHORIZATION
          - PAYMENT
          - WALLET_TRANSACTION
          - LOGIN
          - ONBOARDING
          - BENEFICIARY_CHANGE
          - DEVICE_CHANGE
          - PROFILE_CHANGE
          - LOAN_APPLICATION
      - name: subject_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: decision
        in: query
        schema:
          type: string
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - STEP_UP
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
      - name: device_fingerprint_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
