        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - subject_type
      - step_up_threshold
      - review_threshold
      - block_threshold
      - timeout_ms
      - fallback_decision
      - is_active
      - combination
      - model_weight
      - model_confidence
      - model_timeout_ms
      - use_model_thresholds
