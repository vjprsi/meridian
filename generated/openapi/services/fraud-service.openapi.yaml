openapi: 3.1.0
info:
  title: Meridian Core — fraud-service
  version: 1.0.0
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Fraud Scores
  description: Immutable fraud evaluation of one event (authorisation, payment, login, ...) with decision and reasons
- name: Fraud Rules
  description: Fraud rule expressed in CEL, evaluated in priority order; supports shadow mode
- name: Fraud Decision Policies
  description: Score thresholds that turn a score into ALLOW / STEP_UP / REVIEW / BLOCK per event type
- name: Fraud Alerts
  description: A suspicious event queued for analyst review
- name: Fraud Devices
  description: Device intelligence profile (app attestation, emulator/root flags, reputation)
- name: Behavioural Signals
  description: Behavioural biometrics captured during a session (typing cadence, navigation, call/remote-access flags)
- name: Fraud Lists
  description: Block, allow or watch list of devices, IPs, accounts, BINs, emails and more
- name: Fraud List Entries
  description: A value on a fraud list (stored hashed; masked value for display)
- name: Fraud Feedback
  description: Confirmed outcome label for a scored event, used for model training and rule tuning
- name: Fraud Model Scores
  description: Score of one ML model deployment for one evaluation (champion, canary, challenger or shadow). Append-only;
    feeds monitoring
paths:
  /v1/risk/fraud/scores:
    get:
      operationId: fraudScoresList
      summary: List fraud scores
      tags:
      - Fraud Scores
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: subject_type
        in: query
        schema:
          type: string
          enum:
          - CARD_AUTHORIZATION
          - PAYMENT
          - WALLET_TRANSACTION
          - LOGIN
          - ONBOARDING
          - BENEFICIARY_CHANGE
          - DEVICE_CHANGE
          - PROFILE_CHANGE
          - LOAN_APPLICATION
      - name: subject_id
        in: query
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: decision
        in: query
        schema:
          type: string
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - STEP_UP
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
      - name: device_fingerprint_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudScorePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FRM-01
      - FRM-05
      x-service: fraud-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-required-scope: risk:read
      x-table: fraud_score
      x-crud: true
      x-crud-list: true
  /v1/risk/fraud/scores/{id}:
    get:
      operationId: fraudScoresGet
