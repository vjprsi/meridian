          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        subject_type:
          type: string
          enum:
          - CARD_AUTHORIZATION
          - PAYMENT
          - WALLET_TRANSACTION
          - LOGIN
          - ONBOARDING
          - BENEFICIARY_CHANGE
          - DEVICE_CHANGE
          - PROFILE_CHANGE
          - LOAN_APPLICATION
          description: Event type
        step_up_threshold:
          type: integer
          format: int32
          description: Score at or above which strong authentication is required
        review_threshold:
          type: integer
          format: int32
          description: Score at or above which the event is queued for review
        block_threshold:
          type: integer
          format: int32
          description: Score at or above which the event is blocked
        model_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Champion model
        shadow_model_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Challenger model evaluated in shadow
        timeout_ms:
          type: integer
          format: int32
          description: Time budget; on timeout the fallback decision applies
        fallback_decision:
          type: string
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - STEP_UP
          description: Decision when scoring times out
        is_active:
          type: boolean
          description: Active
        combination:
          type: string
          enum:
          - ADDITIVE
          - MAX
          - WEIGHTED
          - MODEL_ONLY_ABOVE_CONFIDENCE
          - RULES_ONLY
          description: How an ML score (model_id = an ai-platform FRAUD model) combines with the rule-based score - ADDITIVE
            (ML score + rule adjustments), MAX, WEIGHTED, MODEL_ONLY_ABOVE_CONFIDENCE, RULES_ONLY (ML only logged)
        model_weight:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: WEIGHTED - share of the ML score (0..1)
        model_confidence:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: MODEL_ONLY_ABOVE_CONFIDENCE - confidence abs(2p - 1) at or above which the ML score alone decides
        model_timeout_ms:
          type: integer
          format: int32
          description: In-process inference budget; a slower or failing model falls back to rules (degraded)
        channel_thresholds:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Threshold overrides per channel {CHANNEL: {step_up, review, block}}'
        use_model_thresholds:
          type: boolean
          description: Use the thresholds shipped in the ML artefact when the ML model decides (channel overrides still win)
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
