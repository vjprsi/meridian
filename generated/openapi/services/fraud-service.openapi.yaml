    FraudDecisionPolicy:
      type: object
      description: Score thresholds that turn a score into ALLOW / STEP_UP / REVIEW / BLOCK per event type
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
