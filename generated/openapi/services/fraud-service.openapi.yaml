    FraudScore:
      type: object
      description: Immutable fraud evaluation of one event (authorisation, payment, login, ...) with decision and reasons
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        subject_type:
          type: string
          enum:
          - CARD_AUTHORIZATION
          - PAYMENT
          - WALLET_TRANSACTION
          - LOGIN
          - ONBOARDING
          - BENEFICIARY_CHANGE
          - DEVICE_CHANGE
          - PROFILE_CHANGE
          - LOAN_APPLICATION
          description: Kind of event scored
        subject_id:
          type: string
          format: uuid
          description: Id of the event in its service (payment, authorisation, ...)
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer
        account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Account debited, if any
        card_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Card, for card events
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Transaction amount
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Transaction currency (ISO 4217)
        channel:
          type:
          - string
          - 'null'
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
          description: Channel the event came from
        merchant_category_code:
          type:
          - string
          - 'null'
          maxLength: 4
          description: MCC, for card events
        counterparty_country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Counterparty or merchant country (ISO 3166-1 alpha-2)
        device_fingerprint_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Device used
        ip_address:
          type:
          - string
          - 'null'
          description: Client IP address (IPv4 or IPv6 address)
        score:
          type: integer
          format: int32
          description: Final risk score 0-1000 (higher = riskier)
        model_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Raw ML model score 0-1000
        rule_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Net score adjustment from rules
        model_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Model used
        model_version:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Model version used
        decision:
          type: string
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - STEP_UP
          description: Decision returned to the caller
        reason_codes:
          type: array
          items: {}
          description: Ordered reason codes explaining the decision
        features:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Feature values used (for audit, explainability and rule backtesting)
        shadow_decision:
          type:
          - string
          - 'null'
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - STEP_UP
          description: Decision of the shadow / challenger model
        latency_ms:
          type: integer
          format: int32
          description: Evaluation time in milliseconds
        correlation_id:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Trace / saga correlation id
        session_id:
          type:
          - string
          - 'null'
          maxLength: 128
          description: App session (links behavioural signals)
        fraud_alert_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Alert raised for REVIEW / BLOCK decisions
          readOnly: true
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Client key; a replay returns the original evaluation
          readOnly: true
        rules_component_score:
          type:
          - integer
          - 'null'
          format: int32
          description: Rule-based score (built-in heuristic model + rule adjustments) before it is combined with the ML score
          readOnly: true
        combination:
          type:
          - string
          - 'null'
          enum:
          - ADDITIVE
          - MAX
          - WEIGHTED
          - MODEL_ONLY_ABOVE_CONFIDENCE
          - RULES_ONLY
          description: How the rule-based and ML scores were combined (empty = no ML model in the policy)
          readOnly: true
        ml_model_version_id:
          type:
          - string
          - 'null'
          format: uuid
          description: ML model version (ai-platform) that decided
          readOnly: true
        ml_deployment_id:
          type:
          - string
          - 'null'
          format: uuid
          description: ai-platform deployment (champion or canary) that decided
          readOnly: true
        degraded:
          type: boolean
          description: The ML model was unavailable, failed or exceeded its budget; rules decided
          readOnly: true
        degraded_reason:
          type:
          - string
          - 'null'
          maxLength: 64
          description: MODEL_UNAVAILABLE, NO_CHAMPION, CHECKSUM_MISMATCH, INVALID_ARTIFACT, MODEL_ERROR, MODEL_TIMEOUT, FEATURES_UNAVAILABLE
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - subject_type
      - subject_id
      - score
      - decision
      - reason_codes
      - latency_ms
      - degraded
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical request; replays return the original response for 24h
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current row_version of the resource (optimistic locking)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            risk:read: Read Risk, Fraud, AML and Limits
            risk:write: Change Risk, Fraud, AML and Limits
            platform:operator: Platform operator (operator tenant or service only)
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            risk:read: Read Risk, Fraud, AML and Limits
            risk:write: Change Risk, Fraud, AML and Limits
            platform:operator: Platform operator (operator tenant or service only)
