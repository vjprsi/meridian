openapi: 3.1.0
info:
  title: Meridian Core — rewards-service
  version: 1.0.0
  description: 'Customer engagement: loyalty rewards, points and cashback, referral programs, transaction enrichment and personal
    finance insights (PFM), targeted campaigns and personalised offers, and secure customer messaging.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Rewards Programs
  description: A loyalty program (points, cashback or miles) with currency, expiry and funding settings
- name: Reward Tiers
  description: Status level within a program (e.g. Silver, Gold) with qualification thresholds and benefits
- name: Reward Rules
  description: Earn rule - what earns points or cashback, at what rate, with caps, multipliers and time windows
- name: Points Accounts
  description: A customer's points account within a program with running balances and tier
- name: Points Ledger Entries
  description: Append-only movement of points (earn, redeem, expire, adjust); balances derive from it
- name: Cashback Transactions
  description: A cashback award for a qualifying transaction, paid to the customer's account after settlement
- name: Reward Catalog Items
  description: Something points can be redeemed for (statement credit, voucher, partner miles, merchandise)
- name: Redemptions
  description: A customer's redemption of points for a catalogue item or statement credit
- name: Referral Programs
  description: Refer-a-friend program with qualification criteria and rewards for referrer and referee
- name: Referrals
  description: One referral from a referrer to a referee, tracked through qualification to payout
paths:
  /v1/rewards/programs:
    get:
      operationId: rewardsProgramsList
      summary: List rewards programs
      tags:
      - Rewards Programs
      security:
      - oauth2:
        - engagement:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - ENDED
      - name: program_type
        in: query
        schema:
          type: string
          enum:
          - POINTS
          - CASHBACK
          - MILES
          - HYBRID
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardsProgramPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ENG-01
      x-service: rewards-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("engagement:read")'
      x-required-scope: engagement:read
      x-table: rewards_program
      x-crud: true
      x-crud-list: true
    post:
      operationId: rewardsProgramsCreate
      summary: Create rewards program
      tags:
      - Rewards Programs
      security:
      - oauth2:
        - engagement:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardsProgram'
        '400': *id001
