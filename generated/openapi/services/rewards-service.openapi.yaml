servers:
- description: Production
  url: https://api.meridian.example
- description: Sandbox
  url: https://sandbox.api.meridian.example
tags:
- description: A loyalty program (points, cashback or miles) with currency, expiry and funding settings
  name: Rewards Programs
- description: Status level within a program (e.g. Silver, Gold) with qualification thresholds and benefits
  name: Reward Tiers
- description: Earn rule - what earns points or cashback, at what rate, with caps, multipliers and time windows
  name: Reward Rules
- description: A customer's points account within a program with running balances and tier
  name: Points Accounts
- description: Append-only movement of points (earn, redeem, expire, adjust); balances derive from it
  name: Points Ledger Entries
- description: A cashback award for a qualifying transaction, paid to the customer's account after settlement
  name: Cashback Transactions
- description: Something points can be redeemed for (statement credit, voucher, partner miles, merchandise)
  name: Reward Catalog Items
- description: A customer's redemption of points for a catalogue item or statement credit
  name: Redemptions
- description: Refer-a-friend program with qualification criteria and rewards for referrer and referee
  name: Referral Programs
- description: One referral from a referrer to a referee, tracked through qualification to payout
  name: Referrals
