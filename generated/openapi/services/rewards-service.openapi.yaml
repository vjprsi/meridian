components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    RewardsProgramPage:
      type: object
      description: One page of RewardsProgram results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RewardsProgram'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RewardsProgramsActivateRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    RewardsProgramsPauseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    RewardsProgramsEndRequest:
      type: object
      properties:
        ends_on:
          type: string
          format: date
      required:
      - ends_on
    RewardTierPage:
      type: object
      description: One page of RewardTier results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RewardTier'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    RewardRulePage:
