components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    CashbackTransaction:
      description: A cashback award for a qualifying transaction, paid to the customer's account after settlement
      properties:
        cashback_amount:
          description: Cashback awarded
          examples:
          - '125.50'
          format: decimal
          type: string
        confirm_after:
          description: When the award confirms (after dispute window)
          format: date-time
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        credit_account_id:
          description: Account credited
          format: uuid
          type:
          - string
          - 'null'
        currency:
          description: Currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Customer
          format: uuid
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        journal_entry_id:
          description: Ledger posting of the payout
          format: uuid
          type:
          - string
          - 'null'
        paid_at:
          description: Payout time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        reversal_reason:
          description: Why reversed (refund, chargeback)
          maxLength: 255
          type:
          - string
          - 'null'
        reward_rule_id:
          description: Rule applied
          format: uuid
          type:
          - string
          - 'null'
        rewards_program_id:
          description: Program
          format: uuid
          type: string
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        source_id:
          description: Qualifying transaction
          format: uuid
          type: string
        source_type:
          description: CARD_AUTHORIZATION, PAYMENT, WALLET_TRANSACTION
          maxLength: 40
          type: string
        status:
          description: Status
          enum:
          - PENDING
          - CONFIRMED
          - PAID
          - REVERSED
          - CANCELLED
          type: string
        transaction_amount:
          description: Qualifying amount
          examples:
          - '125.50'
          format: decimal
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - rewards_program_id
      - customer_id
      - source_type
      - source_id
      - transaction_amount
      - cashback_amount
      - currency
      - status
      type: object
