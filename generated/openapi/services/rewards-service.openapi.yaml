          - array
          - 'null'
          items:
            type: string
            enum:
            - POS
            - ECOM
            - CONTACTLESS
            - ATM
            - WALLET
            - BILL_PAYMENT
            - TRANSFER
            - BRANCH
            - OTHER
          description: Channels that qualify (empty = any)
        countries:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: ^[A-Z]{2}$
            description: ISO 3166-1 alpha-2
          description: Merchant countries that qualify (empty = any)
