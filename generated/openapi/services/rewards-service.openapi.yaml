          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        rewards_program_id:
          type: string
          format: uuid
          description: Program
        name:
          type: string
          maxLength: 120
          description: Rule name
        trigger:
          type: string
          enum:
          - CARD_SPEND
          - WALLET_PAYMENT
          - BILL_PAYMENT
          - ACCOUNT_OPENING
          - DIRECT_DEPOSIT
          - BALANCE_HELD
          - LOAN_REPAYMENT
          - REFERRAL
          - MANUAL
          description: Event that earns
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          description: Status (changes through activate / deactivate)
          readOnly: true
        priority:
          type: integer
          format: int32
          description: Lower evaluates first
        stackable:
          type: boolean
          description: Can combine with other matching rules; a non-stackable rule that wins on priority is applied alone
        mcc_include:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          description: MCC codes that qualify (empty = any)
        mcc_exclude:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          description: MCC codes excluded (e.g. gambling, quasi-cash)
        merchant_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          description: Merchant / card acceptor ids that qualify (partner offers; empty = any)
        product_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Products that qualify (empty = any)
        channels:
