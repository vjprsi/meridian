components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CollateralPage:
      type: object
      description: One page of Collateral results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Collateral'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollateralsRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CollateralsPledgeRequest:
      type: object
      properties:
        registration_reference:
          type: string
          maxLength: 128
        lien_registered_at:
          type: string
          format: date
      required:
      - registration_reference
      - lien_registered_at
    CollateralsReleaseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
        force:
          type: boolean
      required:
      - reason
    CollateralsLiquidateRequest:
      type: object
      properties:
        proceeds:
          type: string
          format: decimal
          examples:
          - '125.50'
        sale_date:
          type: string
          format: date
        costs:
          type: string
          format: decimal
          examples:
          - '125.50'
        reference:
          type: string
          maxLength: 128
      required:
      - proceeds
      - sale_date
    CollateralEodRunPage:
      type: object
      description: One page of CollateralEodRun results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollateralEodRun'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollateralValuationPage:
      type: object
      description: One page of CollateralValuation results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollateralValuation'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollateralLinkPage:
      type: object
      description: One page of CollateralLink results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollateralLink'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CollateralLinksReleaseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    CollateralInsurancePage:
      type: object
      description: One page of CollateralInsurance results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollateralInsurance'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    Collateral:
      type: object
      description: A pledged asset or guarantee securing one or more exposures
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        collateral_number:
          type: string
          maxLength: 32
          description: Registry number (server-generated)
          readOnly: true
        owner_customer_id:
          type: string
          format: uuid
          description: Owner / guarantor
        collateral_type:
          type: string
          enum:
          - PROPERTY
          - VEHICLE
          - DEPOSIT
          - GUARANTEE
          - GOLD
          - EQUIPMENT
          - INVENTORY
          - RECEIVABLES
          - SECURITIES
          - CROP
          - OTHER
          description: Type
        description:
          type: string
          maxLength: 500
          description: Description of the asset
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Valuation currency (ISO 4217)
        market_value:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Latest market value (changed by valuations)
        forced_sale_value:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Latest forced-sale value
        haircut_pct:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Haircut applied for lending value (empty = type default)
        lending_value:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Value after haircut
          readOnly: true
        allocated_value:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Lending value allocated to active links
          readOnly: true
        registration_reference:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Land registry / vehicle registration / lien reference (set by /pledge)
          readOnly: true
        registration_authority:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Registry authority
        lien_registered_at:
          type:
          - string
          - 'null'
          format: date
          description: Lien registration date
          readOnly: true
        location:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Address or geo-location for property and field visits
        deposit_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Pledged deposit (cash-collateral)
        asset_details:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Type-specific attributes (PROPERTY title_number; VEHICLE vin, registration_number; GOLD carat, weight_grams;
            SECURITIES isin, quantity; GUARANTEE guarantor_name)
        status:
          type: string
          enum:
          - PROPOSED
          - VERIFIED
          - PLEDGED
          - RELEASED
          - LIQUIDATED
          - REJECTED
          description: Status
          readOnly: true
        status_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason of the last rejection, release or liquidation
          readOnly: true
        next_valuation_date:
          type:
          - string
          - 'null'
          format: date
          description: Next revaluation due
        verified_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Verifier
          readOnly: true
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Verification time
          readOnly: true
        liquidation_proceeds:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Net proceeds of the liquidation
          readOnly: true
        liquidated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Liquidation time
          readOnly: true
        released_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Release time
          readOnly: true
        custom_field_1:
