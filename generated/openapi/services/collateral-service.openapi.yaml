          - CREDIT_LINE_STATEMENTS
          - COLLECTIONS_STRATEGY_RUN
          - COLLATERAL_MONITORING
      - name: business_date
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - COMPLETED_WITH_ERRORS
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
