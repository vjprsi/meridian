openapi: 3.1.0
info:
  title: Meridian Core — collateral-service
  version: 1.0.0
  description: 'Loan origination with bureau, scoring and explainable decisions; loan servicing for instalment loans, revolving
    credit lines, BNPL and nano-loans; collateral management; and collections and recovery.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Collaterals
  description: A pledged asset or guarantee securing one or more exposures
- name: Collateral Eod Runs
  description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
- name: Collateral Valuations
  description: Valuation history of a collateral item. Append-only.
- name: Collateral Links
  description: Allocation of collateral to an exposure (loan or credit line) with LTV
- name: Collateral Insurances
  description: Insurance policy covering a collateral item
paths:
  /v1/collaterals:
    get:
      operationId: collateralsList
      summary: List collaterals
      tags:
      - Collaterals
      security:
      - oauth2:
        - lending:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: owner_customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: collateral_type
        in: query
        schema:
          type: string
          enum:
          - PROPERTY
          - VEHICLE
          - DEPOSIT
          - GUARANTEE
          - GOLD
          - EQUIPMENT
          - INVENTORY
          - RECEIVABLES
          - SECURITIES
          - CROP
          - OTHER
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PROPOSED
          - VERIFIED
          - PLEDGED
          - RELEASED
          - LIQUIDATED
          - REJECTED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollateralPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - LND-06
      x-service: collateral-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:read")'
      x-required-scope: lending:read
      x-table: collateral
      x-crud: true
      x-crud-list: true
    post:
      operationId: collateralsCreate
      summary: Create collateral
      tags:
      - Collaterals
      security:
      - oauth2:
        - lending:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collateral'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollateralCreate'
      x-requirements:
      - LND-06
      x-service: collateral-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:write")'
      x-required-scope: lending:write
      x-table: collateral
      x-crud: true
      x-crud-create: true
  /v1/collaterals/{id}:
    get:
      operationId: collateralsGet
      summary: Retrieve collateral
      tags:
      - Collaterals
      security:
      - oauth2:
        - lending:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collateral'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - LND-06
      x-service: collateral-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:read")'
      x-required-scope: lending:read
      x-table: collateral
      x-crud: true
      x-crud-get: true
    patch:
      operationId: collateralsUpdate
      summary: Update collateral
      tags:
      - Collaterals
      security:
      - oauth2:
        - lending:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collateral'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollateralUpdate'
      x-requirements:
      - LND-06
      x-service: collateral-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:write")'
      x-required-scope: lending:write
      x-table: collateral
      x-crud: true
      x-crud-update: true
  /v1/collaterals/{id}/verify:
    post:
      operationId: collateralsVerify
      summary: Mark collateral verified (type-specific attributes and a valuation required)
      tags:
      - Collaterals
      security:
      - oauth2:
        - lending:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collateral'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - LND-06
      x-service: collateral-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("lending:write")'
      x-required-scope: lending:write
      x-table: collateral
  /v1/collaterals/{id}/reject:
    post:
      operationId: collateralsReject
