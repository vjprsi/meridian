          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - collateral_number
      - owner_customer_id
      - collateral_type
      - description
      - currency
      - market_value
