  /v1/collaterals/eod/monitor:
    post:
      operationId: collateralsEodMonitor
      summary: End of day - recompute LTV (alerts), insurance expiry and revaluation due (idempotent per business date)
      tags:
      - Collaterals
      security:
      - oauth2:
        - lending:write
      parameters:
      - name: business_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
