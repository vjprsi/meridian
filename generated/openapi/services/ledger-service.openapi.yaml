      - status
      - holds_expired
      - snapshots_written
      - snapshots_skipped
      - started_at
      - finished_at
    LedgerVerification:
      type: object
      description: Result of an integrity verification of a ledger (balances, versions, balancing, content hashes)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        ledger_id:
          type: string
          format: uuid
          description: Ledger verified
        accounts_checked:
          type: integer
          format: int32
          description: Accounts whose balance was recomputed from entries
        entries_checked:
          type: integer
          format: int32
          description: Journal entries checked
        balance_mismatches:
          type: integer
          format: int32
          description: Accounts whose stored balance differs from the sum of entries
        version_gaps:
          type: integer
          format: int32
          description: Accounts with non-consecutive entry versions
        unbalanced_entries:
          type: integer
          format: int32
          description: Journal entries whose debits and credits differ in a currency
        hash_mismatches:
          type: integer
          format: int32
          description: Journal entries whose content hash no longer matches (tampering)
        chain_head:
          type: string
          maxLength: 64
          description: SHA-256 chain over all entry hashes in booking order
        passed:
          type: boolean
          description: True when every check passed
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: First findings per check (capped)
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - ledger_id
      - accounts_checked
      - entries_checked
      - balance_mismatches
      - version_gaps
      - unbalanced_entries
      - hash_mismatches
      - chain_head
      - passed
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical request; replays return the original response for 24h
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current row_version of the resource (optimistic locking)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            ledger:read: Read Ledger and Accounting
            ledger:write: Change Ledger and Accounting
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            ledger:read: Read Ledger and Accounting
            ledger:write: Change Ledger and Accounting
