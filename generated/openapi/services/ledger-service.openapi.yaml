    JournalEntry:
      type: object
      description: One balanced, atomic set of ledger entries (a ledger transaction). Append-only.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        ledger_id:
          type: string
          format: uuid
          description: Ledger book
        idempotency_key:
          type: string
          maxLength: 128
          description: Taken from the Idempotency-Key header; a replay returns the original entry
          readOnly: true
        entry_type:
          type: string
          enum:
          - STANDARD
          - REVERSAL
          - ADJUSTMENT
          - ACCRUAL
          - FEE
          - INTEREST
          - FX
          - TRANSFER
          - CARD_SETTLEMENT
          - PAYMENT
          - LOAN
          - OPENING_BALANCE
          - MIGRATION
          - CORRECTION
          description: Business classification
        description:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Narrative shown on statements
        effective_at:
          type: string
          format: date-time
          description: 'Economic time of the transaction (default: now)'
        value_date:
          type: string
          format: date
          description: 'Date interest starts or stops counting (default: today)'
        booked_at:
          type: string
          format: date-time
          description: Time the ledger committed the entry
          readOnly: true
        reversal_of_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Entry this one reverses (set by POST /{id}/reverse)
          readOnly: true
        source_service:
          type: string
          maxLength: 64
          description: Service or client that requested the posting (from the caller identity)
          readOnly: true
        source_type:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Business object type, e.g. PAYMENT, CARD_AUTHORIZATION
        source_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Business object id
        correlation_id:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Trace / saga correlation id
        reference:
          type:
          - string
          - 'null'
          maxLength: 128
          description: External reference for reconciliation (e.g. ISO 20022 end-to-end id, bank or scheme reference); copied
            to every ledger entry
        entry_count:
          type: integer
          format: int32
          description: Number of ledger entries
          readOnly: true
        total_debits:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Sum of debits in base currency (equals credits)
          readOnly: true
        hash:
          type:
          - string
          - 'null'
          maxLength: 64
          description: SHA-256 over this entry and the previous hash (tamper evidence)
          readOnly: true
        prev_hash:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Hash of the previous journal entry in the ledger
          readOnly: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Client-defined key/value metadata
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
          readOnly: true
          description: Debit and credit lines; must balance per currency
