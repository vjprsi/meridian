openapi: 3.1.0
info:
  title: Meridian Core — ledger-service
  version: 1.0.0
  description: 'The single source of truth for money. A real-time, append-only double-entry ledger that every other service
    posts through, the general ledger and period close, and automated reconciliation.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Ledgers
  description: A book of accounts for one legal entity (a tenant may run several ledgers)
- name: Ledger Accounts
  description: 'An account in the ledger: customer accounts, wallets, cards, loans, internal and GL control accounts'
- name: Journal Entries
  description: Post balanced transactions. Body carries the entries array (see LedgerEntry).
- name: Ledger Entries
  description: One debit or credit line of a journal entry against one ledger account. Append-only.
- name: Holds
  description: A reservation of funds (card authorisation, pending payment, legal block) reducing available balance
- name: Ledger Eod Runs
  description: End-of-day processing of one ledger for one business date (hold expiry, balance snapshots)
- name: Ledger Verifications
  description: Result of an integrity verification of a ledger (balances, versions, balancing, content hashes)
- name: Balance Snapshots
  description: End-of-day balance per account; used for statements, interest and point-in-time queries
paths:
  /v1/ledgers:
    get:
      operationId: ledgersList
      summary: List ledgers
      tags:
      - Ledgers
      security:
      - oauth2:
        - ledger:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - LOCKED
          - ARCHIVED
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: base_currency
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - GL-05
      - LED-01
      x-service: ledger-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("ledger:read")'
      x-required-scope: ledger:read
      x-table: ledger
      x-crud: true
      x-crud-list: true
    post:
      operationId: ledgersCreate
      summary: Create ledger
      tags:
      - Ledgers
      security:
      - oauth2:
        - ledger:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCreate'
      x-requirements:
      - GL-05
      - LED-01
      x-service: ledger-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("ledger:write")'
      x-required-scope: ledger:write
      x-table: ledger
      x-crud: true
      x-crud-create: true
  /v1/ledgers/{id}:
