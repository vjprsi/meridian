security:
- oauth2: []
servers:
- description: Production
  url: https://api.meridian.example
- description: Sandbox
  url: https://sandbox.api.meridian.example
tags:
- description: A book of accounts for one legal entity (a tenant may run several ledgers)
  name: Ledgers
- description: 'An account in the ledger: customer accounts, wallets, cards, loans, internal and GL control accounts'
  name: Ledger Accounts
- description: Post balanced transactions. Body carries the entries array (see LedgerEntry).
  name: Journal Entries
- description: One debit or credit line of a journal entry against one ledger account. Append-only.
  name: Ledger Entries
- description: A reservation of funds (card authorisation, pending payment, legal block) reducing available balance
  name: Holds
- description: End-of-day processing of one ledger for one business date (hold expiry, balance snapshots)
  name: Ledger Eod Runs
- description: Result of an integrity verification of a ledger (balances, versions, balancing, content hashes)
  name: Ledger Verifications
- description: End-of-day balance per account; used for statements, interest and point-in-time queries
  name: Balance Snapshots
