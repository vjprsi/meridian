    LedgerEntry:
      type: object
      description: One debit or credit line of a journal entry against one ledger account. Append-only.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        journal_entry_id:
          type: string
          format: uuid
          description: Parent journal entry
          readOnly: true
        ledger_account_id:
          type: string
          format: uuid
          description: Account posted to
        line_no:
          type: integer
          format: int32
          description: Line number within the journal entry (order sent)
          readOnly: true
        direction:
          type: string
          enum:
          - DEBIT
          - CREDIT
          description: Debit or credit
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Positive amount in the account currency
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Account currency (ISO 4217)
        fx_rate:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Rate to ledger base currency at posting time
        base_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount in ledger base currency (amount x fx_rate)
          readOnly: true
        effective_at:
          type: string
          format: date-time
          description: Copied from the journal entry for range queries
          readOnly: true
        value_date:
          type: string
          format: date
          description: Copied from the journal entry (reconciliation matches on value date)
          readOnly: true
        reference:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Copied from the journal entry (reconciliation matches on reference)
          readOnly: true
        account_version:
          type: integer
          format: int64
          description: Account balance version after this entry (gapless per account)
          readOnly: true
        balance_after:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Posted balance of the account after this entry
          readOnly: true
        description:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Line narrative
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - journal_entry_id
      - ledger_account_id
      - line_no
      - direction
      - amount
      - currency
      - base_amount
      - effective_at
      - value_date
      - account_version
      - balance_after
