        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        ledger_account_id:
          description: Account
          format: uuid
          type: string
        opening_balance:
          description: Balance at start of day
          examples:
          - '125.50'
          format: decimal
          type: string
        total_credits:
          description: Credits during the day
          examples:
          - '125.50'
