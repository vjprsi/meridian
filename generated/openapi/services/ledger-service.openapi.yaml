    LedgerEodRun:
      type: object
      description: End-of-day processing of one ledger for one business date (hold expiry, balance snapshots)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        ledger_id:
          type: string
          format: uuid
          description: Ledger processed
        business_date:
          type: string
          format: date
          description: Business date closed
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - PARTIALLY_SUCCEEDED
          description: Outcome
        holds_expired:
          type: integer
          format: int32
          description: Holds released because they passed expires_at
        snapshots_written:
          type: integer
          format: int32
          description: Balance snapshots written
        snapshots_skipped:
          type: integer
          format: int32
          description: Accounts already snapshotted for the date (idempotent rerun)
