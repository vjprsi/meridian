components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    LedgerPage:
      type: object
      description: One page of Ledger results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ledger'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LedgersLockRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    LedgersEodRequest:
      type: object
      properties:
        business_date:
          type: string
          format: date
      required:
      - business_date
    LedgersEndOfDayRequest:
      type: object
      properties:
        business_date:
          type: string
          format: date
        legal_entity_id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
      required:
      - business_date
    LedgerAccountPage:
      type: object
      description: One page of LedgerAccount results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccount'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    BalanceSnapshotPage:
      type: object
      description: One page of BalanceSnapshot results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalanceSnapshot'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LedgerEntryPage:
      type: object
      description: One page of LedgerEntry results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    LedgerAccountsFreezeRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - FROZEN_DEBIT
          - FROZEN_CREDIT
          - FROZEN
          - CLOSED
        reason:
          type: string
          maxLength: 255
      required:
      - status
      - reason
    LedgerAccountsUnfreezeRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    LedgerAccountsOverdraftLimitRequest:
      type: object
      properties:
        limit:
          type: string
