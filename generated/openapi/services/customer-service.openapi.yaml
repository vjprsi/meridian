openapi: 3.1.0
info:
  title: Meridian Core — customer-service
  version: 1.0.0
  description: 'Single customer view for individuals and businesses (CIF), relationships and UBOs, tiered KYC, devices and
    credentials, consent and privacy, configurable onboarding journeys, and KYC/KYB checks through pluggable providers.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Customers
  description: A party that holds or applies for products; an individual or a legal entity
- name: Customer Identifiers
  description: Government or registry identifiers of a customer (national id, passport, tax id, company number)
- name: Customer Addresses
  description: Postal addresses of a customer with history
- name: Customer Contacts
  description: Phone numbers, emails and messaging handles of a customer
- name: Customer Relationships
  description: Relationship between two customers (director, UBO, guardian, joint holder, signatory, spouse)
- name: Customer Groups
  description: Household, corporate group or connected-exposure group of customers
- name: Customer Segments
  description: Segment definitions used for pricing, servicing and reporting (e.g. Mass, Affluent, SME)
- name: Customer Segment Assignments
  description: Segment assigned to a customer, with history
- name: Customer Devices
  description: Devices bound to a customer for authentication, push notifications and fraud signals
- name: Customer Credentials
  description: Authentication credentials of a customer (passkeys, PIN, password, TOTP); secrets stored as hashes only
- name: Consents
  description: Consent given or withdrawn by a customer for a purpose and scope (GDPR, LGPD, DPDP, POPIA, open banking)
- name: Privacy Requests
  description: Data subject request (access, export, rectification, erasure) with statutory deadline
paths:
  /v1/customers:
    get:
      operationId: customersList
      summary: List customers
      tags:
      - Customers
      security:
      - oauth2:
        - party:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_type
        in: query
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - SOLE_TRADER
          - COMPANY
          - PARTNERSHIP
          - TRUST
          - NON_PROFIT
          - GOVERNMENT
          - GROUP
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PROSPECT
          - PENDING_KYC
          - ACTIVE
          - DORMANT
          - SUSPENDED
          - BLOCKED
          - DECEASED
          - CLOSED
      - name: kyc_tier
        in: query
        schema:
          type: string
          enum:
          - TIER_0
          - TIER_1
          - TIER_2
          - TIER_3
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: home_branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: relationship_manager_id
        in: query
        schema:
          type: string
          format: uuid
      - name: registration_number
        in: query
        schema:
          type: string
          maxLength: 64
      - name: external_ref
        in: query
        schema:
          type: string
          maxLength: 64
      - name: risk_level
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - PROHIBITED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:read")'
      x-required-scope: party:read
      x-table: customer
      x-crud: true
      x-crud-list: true
    post:
      operationId: customersCreate
      summary: Create customer
      tags:
      - Customers
      security:
      - oauth2:
        - party:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("party:write")'
      x-required-scope: party:write
      x-table: customer
      x-crud: true
      x-crud-create: true
