info:
  description: 'Single customer view for individuals and businesses (CIF), relationships and UBOs, tiered KYC, devices and
    credentials, consent and privacy, configurable onboarding journeys, and KYC/KYB checks through pluggable providers.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — customer-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/customers:
    get:
      operationId: customersList
      summary: List customers
      tags:
      - Customers
      security:
      - oauth2:
        - party:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: customer_type
        in: query
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - SOLE_TRADER
          - COMPANY
          - PARTNERSHIP
          - TRUST
          - NON_PROFIT
          - GOVERNMENT
          - GROUP
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PROSPECT
          - PENDING_KYC
          - ACTIVE
          - DORMANT
          - SUSPENDED
          - BLOCKED
          - DECEASED
          - CLOSED
      - name: kyc_tier
        in: query
        schema:
          type: string
          enum:
          - TIER_0
          - TIER_1
          - TIER_2
          - TIER_3
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: home_branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: relationship_manager_id
        in: query
        schema:
          type: string
          format: uuid
      - name: registration_number
        in: query
        schema:
          type: string
          maxLength: 64
      - name: external_ref
        in: query
        schema:
          type: string
          maxLength: 64
      - name: risk_level
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - PROHIBITED
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
      x-crud: true
      x-crud-list: true
    post:
      operationId: customersCreate
      summary: Create customer
      tags:
      - Customers
      security:
      - oauth2:
        - party:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
      x-crud: true
      x-crud-create: true
  /v1/customers/{id}:
    get:
      operationId: customersGet
      summary: Retrieve customer
      tags:
      - Customers
      security:
      - oauth2:
        - party:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
      x-crud: true
      x-crud-get: true
    patch:
      operationId: customersUpdate
      summary: Update customer
      tags:
      - Customers
      security:
      - oauth2:
        - party:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
      x-crud: true
      x-crud-update: true
  /v1/customers/search:
    get:
      operationId: customersSearch
      summary: Fuzzy search by name, phone, email, identifier or customer number (?q=)
      tags:
      - Customers
      security:
      - oauth2:
        - party:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
  /v1/customers/{id}/view:
    get:
      operationId: customersView
      summary: 'Single customer view: profile, products, balances, cases, KYC summary'
      tags:
      - Customers
      security:
      - oauth2:
        - party:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
  /v1/customers/{id}/activate:
    post:
      operationId: customersActivate
      summary: Activate a customer once KYC requirements are met
      tags:
      - Customers
      security:
      - oauth2:
        - party:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - CIF-01
      - CIF-02
      - CIF-03
      x-service: customer-service
      x-table: customer
  /v1/customers/{id}/suspend:
    post:
      operationId: customersSuspend
      summary: Suspend all channels and activity
      tags:
      - Customers
      security:
      - oauth2:
        - party:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
