components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    Consent:
      description: Consent given or withdrawn by a customer for a purpose and scope (GDPR, LGPD, DPDP, POPIA, open banking)
      properties:
        channel:
          description: Channel where consent was captured
          enum:
          - MOBILE_APP
          - WEB
          - USSD
          - AGENT
          - BRANCH
          - API
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        customer_id:
          description: Customer
          format: uuid
          type: string
        evidence:
          additionalProperties: true
          description: 'Capture evidence: IP, device, screen version, text hash'
          type:
          - object
          - 'null'
        expires_at:
          description: Expiry
          format: date-time
          type:
          - string
          - 'null'
        given_at:
          description: Time consent was given
          format: date-time
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        lawful_basis:
          description: CONSENT, CONTRACT, LEGAL_OBLIGATION, LEGITIMATE_INTEREST
          maxLength: 40
          type:
          - string
          - 'null'
        policy_version:
          description: Version of the policy / terms consented to
          maxLength: 32
          type: string
        purpose:
          description: Purpose
          enum:
          - MARKETING
          - PROFILING
          - DATA_SHARING_THIRD_PARTY
          - OPEN_BANKING_AIS
          - OPEN_BANKING_PIS
          - CREDIT_BUREAU
          - BIOMETRIC_PROCESSING
          - TERMS_AND_CONDITIONS
          - PRIVACY_POLICY
          - LOCATION
          - ANALYTICS
          type: string
        recipient:
          description: Third party receiving data (open banking TPP, bureau)
          maxLength: 200
          type:
          - string
          - 'null'
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        scope:
          additionalProperties: true
          description: Data categories, accounts or permissions covered
          type:
          - object
          - 'null'
        status:
          description: Status
          enum:
          - GIVEN
          - WITHDRAWN
          - EXPIRED
          - REJECTED
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        withdrawn_at:
          description: Withdrawal time
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
