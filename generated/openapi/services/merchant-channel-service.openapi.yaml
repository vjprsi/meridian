components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    DepositAccountPage:
      type: object
      description: One page of DepositAccount results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DepositAccount'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WalletTransactionPage:
      type: object
      description: One page of WalletTransaction results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ApiClientPage:
      type: object
      description: One page of ApiClient results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiClient'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ApiKeyPage:
      type: object
      description: One page of ApiKey results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    WebhookEndpointPage:
      type: object
      description: One page of WebhookEndpoint results (newest first)
      properties:
        data:
          type: array
