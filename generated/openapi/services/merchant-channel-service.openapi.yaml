    ApiClient:
      type: object
      description: An OAuth 2.1 client (server integration, app, partner or open banking TPP)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        name:
          type: string
          maxLength: 120
          description: Client name
        description:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Purpose
        client_type:
          type: string
          enum:
          - SERVER
          - PUBLIC_APP
          - PARTNER
          - TPP
          - INTERNAL
          description: Kind of client
        client_id:
          type: string
          maxLength: 64
          description: Public client identifier
          readOnly: true
        auth_method:
          type: string
          enum:
          - CLIENT_SECRET_BASIC
          - CLIENT_SECRET_POST
          - PRIVATE_KEY_JWT
          - TLS_CLIENT_AUTH
          - NONE
          description: Token endpoint authentication
        jwks_uri:
          type:
          - string
          - 'null'
          maxLength: 500
          description: JWKS URL for private_key_jwt
        mtls_cert_thumbprint:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Bound certificate (RFC 8705)
        redirect_uris:
          type:
          - array
          - 'null'
          items: {}
          description: Allowed redirect URIs
        allowed_scopes:
          type: array
          items: {}
          description: Scopes this client may request
        allowed_ip_ranges:
          type:
          - array
          - 'null'
          items: {}
          description: CIDR allow-list
        rate_limit_policy_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Rate limits
        environment:
          type: string
          enum:
          - SANDBOX
          - PRODUCTION
          description: Sandbox or production
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
          description: Status (changed by /suspend, /reactivate)
          readOnly: true
        owner_email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 320
          description: Technical owner
        tpp_registration_id:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Open banking TPP registration / eIDAS id
        fapi_profile:
          type: boolean
          description: Enforce FAPI 2.0 security profile
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last token issued
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiry
        business_customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Business that owns the client (machine-to-machine business API: its tokens carry business_customer_id,
            business_user_id and the m2m marker; only channels:business allowed)'
        business_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: TECHNICAL business portal user (business-channel-service) the client's tokens act as
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
        client_secret:
          type: string
          maxLength: 128
          description: Plaintext client secret for CLIENT_SECRET_* clients (on create and rotate-secret) (returned once; never
            stored)
          readOnly: true
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - name
      - client_type
      - client_id
      - auth_method
      - allowed_scopes
      - environment
      - status
      - fapi_profile
