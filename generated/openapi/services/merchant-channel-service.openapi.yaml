openapi: 3.1.0
info:
  title: Meridian Core — merchant-channel-service
  version: 1.0.0
  description: 'Experience APIs for the bank''s own apps. Customer apps (web banking, mobile) use /v1/me: every operation
    acts for the signed-in customer only: the customer comes from the access token (customer_id claim, scope channels:customer),
    never from a path, query or body. The service calls the domain services with its own service identity and the customer''s
    tenant, checks that every referenced account, card, loan, wallet, payment, payee, standing order, thread, notification
    and document belongs to the customer (an object of someone else answers 404), rebuilds request bodies server-side and
    requires a recent authentication (step-up) for money movement and security changes. Agent outlet apps use /v1/agent the
    same way (agent_id claim, scope channels:agent; see agent-channel-service), the business banking portal uses /v1/business
    (business_customer_id and business_user_id claims, scope channels:business; see business-channel-service), and the merchant
    app uses /v1/merchant (merchant_id and merchant_user_id claims, scope channels:merchant; see merchant-channel-service).
    Domain services keep their operator APIs; customer, agent, business and merchant tokens carry no domain scope and are
    rejected there.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Merchant App Me
  description: The signed-in merchant user
- name: Merchant App Stores
  description: Stores of the merchant the user may work in
- name: Merchant App Terminals
  description: Terminals (tills) of the stores the user may work in
- name: Merchant App Sales
  description: Sales collected with a dynamic EMVCo QR code per sale
- name: Merchant App Transactions
  description: Payments received and other wallet transactions of the merchant
- name: Merchant App Payment Links
  description: Payment links of the merchant
- name: Merchant App Refunds
  description: Refund requests with four-eyes approval
- name: Merchant App Settlements
  description: Settlements of the merchant's collections (OWNER, MANAGER or VIEWER)
- name: Merchant App Fees
  description: Fee (MDR) statement of the merchant (OWNER, MANAGER or VIEWER)
- name: Merchant App Payout Account
  description: The merchant's payout (settlement) bank account (OWNER or MANAGER)
- name: Merchant App Payout Changes
  description: Payout account changes, requested by an OWNER and approved by another OWNER or MANAGER (both with step-up)
- name: Merchant App Staff
  description: Users of the merchant, their roles and store scopes (changes by OWNER users only)
- name: Merchant App Api Clients
  description: API clients and keys of the merchant (OWNER users only)
- name: Merchant App Webhooks
  description: Webhook endpoints of the merchant; subscriptions only ever deliver the merchant's own events
- name: Merchant App Activity
  description: The merchant's app activity (security log)
paths:
  /v1/merchant/me:
    get:
      operationId: merchantAppMeGet
      summary: 'The signed-in user, the merchant (code, trading name, currency, status) and the stores the user may work in:
        {user, merchant, stores[]}'
      tags:
      - Merchant App Me
      security:
      - oauth2:
        - channels:merchant
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/stores:
    get:
      operationId: merchantAppStoresList
      summary: 'Stores the user may work in (OWNER and all-stores users: every store of the merchant)'
      tags:
      - Merchant App Stores
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStorePage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/stores/{store_id}:
    get:
      operationId: merchantAppStoresGet
      summary: One store
      tags:
      - Merchant App Stores
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStore'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/terminals:
    get:
      operationId: merchantAppTerminalsList
      summary: Terminals of the stores the user may work in
      tags:
      - Merchant App Terminals
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: store_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantTerminalPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/terminals/{terminal_id}:
    get:
      operationId: merchantAppTerminalsGet
      summary: One terminal
      tags:
      - Merchant App Terminals
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: terminal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantTerminal'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/terminals/{terminal_id}/deactivate:
    post:
      operationId: merchantAppTerminalsDeactivate
      summary: Deactivate a lost or retired terminal (OWNER or MANAGER of its store; step-up)
      tags:
      - Merchant App Terminals
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: terminal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantTerminal'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantAppTerminalsDeactivateRequest'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/sales:
    get:
      operationId: merchantAppSalesList
      summary: Sales of the stores the user may work in, newest first
      tags:
      - Merchant App Sales
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: store_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - PAID
          - EXPIRED
          - CANCELLED
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSalePage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_sale
    post:
      operationId: merchantAppSalesCreate
      summary: 'Start a sale in a store the user works in (OWNER, MANAGER or CASHIER): merchant-service issues a dynamic EMVCo
        QR for exactly the amount, in the merchant''s currency'
      tags:
      - Merchant App Sales
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSale'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantAppSalesCreateRequest'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_sale
  /v1/merchant/sales/{sale_id}:
    get:
      operationId: merchantAppSalesGet
      summary: One sale; while PENDING its status is refreshed from merchant-service (poll it to see the payment arrive)
      tags:
      - Merchant App Sales
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: sale_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSale'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_sale
  /v1/merchant/sales/{sale_id}/cancel:
    post:
      operationId: merchantAppSalesCancel
      summary: Cancel a pending sale (its QR is deactivated; a sale paid meanwhile is returned PAID)
      tags:
      - Merchant App Sales
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: sale_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSale'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_sale
  /v1/merchant/transactions:
    get:
      operationId: merchantAppTransactionsList
      summary: 'Wallet transactions of the merchant in the stores the user may work in (transactions not attributable to a
        store: OWNER and all-stores users only), newest first'
      tags:
      - Merchant App Transactions
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: store_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: txn_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - P2P
          - CASH_IN
          - CASH_OUT
          - MERCHANT_PAYMENT
          - BILL_PAYMENT
          - AIRTIME
          - G2P
          - BULK_DISBURSEMENT
          - WALLET_TO_BANK
          - BANK_TO_WALLET
          - FLOAT_TRANSFER
          - COMMISSION_PAYOUT
          - INTEROP_OUT
          - INTEROP_IN
          - REFUND
          - REVERSAL
          - FEE
          - ADJUSTMENT
          - LOAN_DISBURSEMENT
          - LOAN_REPAYMENT
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - INITIATED
          - PENDING_CONFIRMATION
          - PENDING_APPROVAL
          - PROCESSING
          - COMPLETED
          - FAILED
          - REVERSED
          - EXPIRED
          - CANCELLED
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/transactions/{transaction_id}:
    get:
      operationId: merchantAppTransactionsGet
      summary: One transaction
      tags:
      - Merchant App Transactions
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/transactions/{transaction_id}/refundable:
    get:
      operationId: merchantAppTransactionsRefundable
      summary: 'What can still be refunded on one payment: {transaction_id, currency, amount, refunded, pending, refundable}'
      tags:
      - Merchant App Transactions
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Computed result (see operation summary)
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/payment-links:
    get:
      operationId: merchantAppPaymentLinksList
      summary: Payment links of the merchant (OWNER, MANAGER or VIEWER)
      tags:
      - Merchant App Payment Links
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPaymentLinkPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
    post:
      operationId: merchantAppPaymentLinksCreate
      summary: Create a payment link in the merchant's currency (OWNER or MANAGER)
      tags:
      - Merchant App Payment Links
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPaymentLink'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantAppPaymentLinksCreateRequest'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/payment-links/{link_id}:
    get:
      operationId: merchantAppPaymentLinksGet
      summary: One payment link
      tags:
      - Merchant App Payment Links
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPaymentLink'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/payment-links/{link_id}/cancel:
    post:
      operationId: merchantAppPaymentLinksCancel
      summary: Cancel (deactivate) a payment link (OWNER or MANAGER)
      tags:
      - Merchant App Payment Links
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPaymentLink'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_user
  /v1/merchant/refunds:
    get:
      operationId: merchantAppRefundsList
      summary: Refund requests of the stores the user may work in, newest first
      tags:
      - Merchant App Refunds
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - PENDING_BANK_APPROVAL
          - COMPLETED
          - REJECTED
          - CANCELLED
          - FAILED
      - name: store_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRefundRequestPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_refund_request
    post:
      operationId: merchantAppRefundsCreate
      summary: Request a refund of a completed payment of a store the user works in (OWNER, MANAGER or CASHIER); the amount
        may not exceed what remains of the payment after completed and pending refunds
      tags:
      - Merchant App Refunds
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRefundRequest'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantAppRefundsCreateRequest'
      x-service: merchant-channel-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("channels:merchant")'
      x-required-scope: channels:merchant
      x-table: merchant_refund_request
  /v1/merchant/refunds/{refund_id}:
    get:
      operationId: merchantAppRefundsGet
      summary: One refund request
      tags:
      - Merchant App Refunds
      security:
      - oauth2:
        - channels:merchant
      parameters:
      - name: refund_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRefundRequest'
