      operationId: virtualAccountsClose
      summary: Close a virtual account
      tags:
      - Virtual Accounts
      security:
      - oauth2:
        - accounts:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccount'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualAccountsCloseRequest'
      x-requirements:
      - DEP-01
      - LED-08
      x-service: deposit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: virtual_account
  /v1/virtual-accounts/{id}/balance:
    get:
      operationId: virtualAccountsBalance
      summary: Sub-ledger balance
      tags:
      - Virtual Accounts
      security:
      - oauth2:
        - accounts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - DEP-01
      - LED-08
      x-service: deposit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:read")'
      x-table: virtual_account
  /v1/virtual-accounts/{id}/transactions:
    get:
      operationId: virtualAccountsTransactions
      summary: Credits routed through the virtual account
      tags:
      - Virtual Accounts
      security:
      - oauth2:
        - accounts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
