      x-requirements:
      - CIF-02
      - DEP-01
      - DEP-04
      - PRD-01
      x-service: deposit-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("accounts:write")'
      x-table: deposit_account
      x-crud: true
      x-crud-create: true
