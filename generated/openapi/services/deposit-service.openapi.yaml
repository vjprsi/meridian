components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    AccountBalance:
      description: Current balances per ledger account, updated in the same transaction as each posting
      properties:
        account_version:
          description: Last applied ledger entry version
          format: int64
          readOnly: true
          type: integer
        available_balance:
          description: Posted - pending debits + overdraft limit
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Account currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        last_entry_at:
          description: Time of the last posting
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        ledger_account_id:
          description: Account
          format: uuid
          type: string
        pending_credits:
          description: Pending credits not yet available
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        pending_debits:
          description: Active holds and pending debits
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        posted_balance:
          description: Posted (ledger) balance in normal-balance terms
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        posted_credits:
          description: Lifetime posted credits
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        posted_debits:
          description: Lifetime posted debits
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
      required:
