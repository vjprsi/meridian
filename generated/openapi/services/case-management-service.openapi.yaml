        in: query
        schema:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - PENDING_APPROVAL
          - ESCALATED
          - SAR_FILED
          - CLOSED
      - name: case_type
        in: query
        schema:
          type: string
          enum:
          - AML
          - FRAUD
          - SANCTIONS
          - KYC
          - MULE
          - TERRORIST_FINANCING
          - BRIBERY_CORRUPTION
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: assigned_to
        in: query
        schema:
          type: string
          maxLength: 64
      - name: team
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCasePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FRM-02
      - FRM-04
      x-service: case-management-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-required-scope: risk:read
      x-table: aml_case
      x-crud: true
      x-crud-list: true
    post:
      operationId: amlCasesCreate
      summary: Create aml case
      tags:
      - Aml Cases
      security:
      - oauth2:
        - risk:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCase'
        '400': *id001
