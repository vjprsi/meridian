    WalletTxnCorrection:
      type: object
      description: 'WE-OPS-1: a maker-checker reversal/correction of a specific wallet transaction for a GSMA reason. The
        maker requests it; a different user (checker) approves; on approval it executes once through the existing wallet-service
        reversal path (POST /wallet-transactions/{id}/reverse) and records the resulting REVERSAL transaction id. Idempotent
        (deterministic key; status re-checked under row lock before executing).

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        wallet_transaction_id:
          type: string
          format: uuid
          description: Originating wallet transaction to reverse/correct
        wallet_dispute_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Dispute whose resolution raised this correction (empty for a standalone correction)
        reason:
          type: string
          enum:
          - WRONG_RECIPIENT
          - DUPLICATE
          - FRAUDULENT
          - ERRONEOUS_AMOUNT
          - OTHER
          description: Reason code (GSMA set)
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount to reverse (empty = full reversal)
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        rationale:
          type: string
          description: Why the correction is needed
        status:
          type: string
          enum:
          - REQUESTED
          - PENDING_APPROVAL
          - APPROVED
          - EXECUTED
          - REJECTED
          - FAILED
          description: Maker-checker + execution status
          readOnly: true
        requested_by:
          type: string
          maxLength: 64
          description: Maker who requested the correction
          readOnly: true
        approved_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Checker who approved / rejected
          readOnly: true
        approval_request_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Central maker-checker approval (workflow-service)
        approval_comment:
          type:
          - string
          - 'null'
          description: Checker comment or rejection reason
          readOnly: true
        reversal_transaction_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Resulting wallet REVERSAL transaction id (set once executed)
          readOnly: true
        idempotency_key:
          type: string
          maxLength: 128
          description: Deterministic key for the single reversal execution
          readOnly: true
        executed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the reversal executed
          readOnly: true
        failure_reason:
          type:
          - string
          - 'null'
          description: Why execution failed (for retry / manual handling)
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - wallet_transaction_id
      - reason
      - rationale
      - status
      - requested_by
      - idempotency_key
