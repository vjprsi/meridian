          type: string
          format: date-time
          description: When the dispute was raised (SLA start)
          readOnly: true
        due_at:
          type:
          - string
          - 'null'
          format: date-time
          description: SLA deadline (raised_at + per-tenant SLA hours)
          readOnly: true
