info:
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — case-management-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/risk/cases:
    get:
      operationId: amlCasesList
      summary: List aml cases
      tags:
      - Aml Cases
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - PENDING_APPROVAL
          - ESCALATED
          - SAR_FILED
          - CLOSED
      - name: case_type
        in: query
        schema:
          type: string
          enum:
          - AML
          - FRAUD
          - SANCTIONS
          - KYC
          - MULE
          - TERRORIST_FINANCING
          - BRIBERY_CORRUPTION
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: assigned_to
        in: query
        schema:
          type: string
          maxLength: 64
      - name: team
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCasePage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FRM-02
      - FRM-04
      x-service: case-management-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-table: aml_case
      x-crud: true
      x-crud-list: true
    post:
      operationId: amlCasesCreate
      summary: Create aml case
      tags:
      - Aml Cases
      security:
      - oauth2:
        - risk:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCase'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmlCaseCreate'
      x-requirements:
      - FRM-02
      - FRM-04
      x-service: case-management-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:write")'
      x-table: aml_case
      x-crud: true
      x-crud-create: true
  /v1/risk/cases/{id}:
    get:
      operationId: amlCasesGet
      summary: Retrieve aml case
      tags:
      - Aml Cases
      security:
      - oauth2:
        - risk:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCase'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FRM-02
      - FRM-04
      x-service: case-management-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("risk:read")'
      x-table: aml_case
      x-crud: true
      x-crud-get: true
    patch:
      operationId: amlCasesUpdate
      summary: Update aml case
      tags:
      - Aml Cases
      security:
      - oauth2:
        - risk:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCase'
        '400': *id001
        '401': *id002
        '403': *id003
