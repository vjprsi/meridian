    WalletDispute:
      type: object
      description: 'WE-OPS-1: a provider-initiated dispute case for a non-card wallet transaction (P2P, cash-in/out, merchant,
        bill, airtime, G2P, wallet-to-bank). Tracker only (no new approval type); its resolution may trigger a maker-checker
        wallet_txn_correction or close with no financial action. Lifecycle RAISED -> UNDER_INVESTIGATION -> RESOLVED | REJECTED
        | WITHDRAWN. Additive and per-tenant gated.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        wallet_transaction_id:
          type: string
          format: uuid
          description: Disputed wallet transaction (in wallet-service)
        txn_type:
          type:
          - string
          - 'null'
          maxLength: 40
          description: Disputed transaction type (P2P, CASH_OUT, MERCHANT, BILL, AIRTIME, G2P, WALLET_TO_BANK)
        claimant_customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer who raised the dispute (repeat-claimant screening key)
        claimant_msisdn:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Claimant MSISDN (repeat-claimant screening key when no customer id)
        counterparty:
          type:
          - string
          - 'null'
          maxLength: 160
          description: Counterparty wallet / MSISDN / merchant named by the claimant
        reason:
          type: string
          enum:
          - WRONG_RECIPIENT
          - DUPLICATE
          - FRAUDULENT
          - ERRONEOUS_AMOUNT
          - OTHER
          description: Reason code (GSMA set)
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Disputed amount
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217)
        description:
          type:
          - string
          - 'null'
          description: What the claimant disputes
        status:
          type: string
          enum:
          - RAISED
          - UNDER_INVESTIGATION
          - RESOLVED
          - REJECTED
          - WITHDRAWN
