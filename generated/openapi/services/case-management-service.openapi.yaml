components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    AmlCasePage:
      type: object
      description: One page of AmlCase results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AmlCase'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AmlCasesAssignRequest:
      type: object
      properties:
        assigned_to:
          type: string
          maxLength: 64
        team:
          type: string
          maxLength: 64
      required:
      - assigned_to
    AmlCasesEscalateRequest:
      type: object
      properties:
        escalated_to:
          type: string
          maxLength: 64
        reason:
          type: string
      required:
      - escalated_to
      - reason
    AmlCasesCloseRequest:
      type: object
      properties:
        disposition:
          type: string
          enum:
          - NO_SUSPICION
          - SAR_FILED
          - EXIT_RELATIONSHIP
          - ENHANCED_MONITORING
          - ACCOUNT_RESTRICTED
          - REFERRED_TO_LAW_ENFORCEMENT
        rationale:
          type: string
        actions_taken:
          type: array
          items: {}
      required:
      - disposition
      - rationale
    AmlCasesReopenRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    AmlCaseAlertPage:
      type: object
      description: One page of AmlCaseAlert results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AmlCaseAlert'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    AmlCasesAddAlertsRequest:
      type: object
      properties:
        source:
          type: string
          enum:
          - FRAUD_ALERT
          - TM_ALERT
          - SCREENING_RESULT
