openapi: 3.1.0
info:
  title: Meridian Core — case-management-service
  version: 1.0.0
  description: 'Real-time fraud scoring, transaction monitoring, sanctions and PEP screening, AML case management with SAR/STR
    filing, and the limits engine. Every payment, card authorisation and wallet movement is scored, screened and limit-checked
    before money moves.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Aml Cases
  description: An AML / fraud / sanctions investigation case consolidating related alerts
- name: Aml Case Tasks
  description: Investigation task (request for information, account review, customer outreach)
- name: Aml Case Evidence
  description: Evidence attached to a case (statements, KYC documents, screenshots, graph exports)
- name: Aml Case Dispositions
  description: Proposed final decision on a case with rationale; the MLRO approves (case closes) or rejects it (maker-checker)
- name: Sar Reports
  description: Suspicious activity / transaction report (SAR/STR/CTR) prepared and filed with the FIU
- name: Wallet Disputes
  description: 'WE-OPS-1: provider-initiated dispute tracker for non-card wallet transactions. Per-tenant gated; resolving
    a dispute may raise a maker-checker wallet_txn_correction or close with no financial action.

    '
- name: Wallet Txn Corrections
  description: 'WE-OPS-1: maker-checker correction (reversal) of a non-card wallet transaction. Create = maker request; approve
    (a different user) executes once through the wallet-service reversal path. Reuses the platform approval mechanism; no
    bank-style auto-chargeback.

    '
paths:
  /v1/risk/cases:
    get:
      operationId: amlCasesList
      summary: List aml cases
      tags:
      - Aml Cases
      security:
      - oauth2:
        - risk:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
