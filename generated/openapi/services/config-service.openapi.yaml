      summary: Update custom field definition
      tags:
      - Custom Field Definitions
      security:
      - oauth2:
        - platform:write
      parameters:
      - *id005
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
