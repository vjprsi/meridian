      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionUpdate'
      x-requirements:
      - ADM-01
      x-service: config-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: custom_field_definition
      x-crud: true
      x-crud-update: true
    delete:
      operationId: customFieldDefinitionsDelete
      summary: Delete custom field definition
      tags:
      - Custom Field Definitions
      security:
      - oauth2:
        - platform:write
      parameters: *id006
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - ADM-01
      x-service: config-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: custom_field_definition
      x-crud: true
      x-crud-delete: true
  /v1/config/custom-fields/validate:
    post:
      operationId: customFieldDefinitionsValidate
      summary: Validate values against a table's custom field definitions
      tags:
      - Custom Field Definitions
      security:
      - oauth2:
