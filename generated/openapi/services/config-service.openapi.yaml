components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    CustomFieldDefinitionPage:
      type: object
      description: One page of CustomFieldDefinition results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CustomFieldDefinitionsValidateRequest:
      type: object
      properties:
        table_name:
          type: string
          maxLength: 64
        values:
          type: object
          additionalProperties: true
      required:
      - table_name
      - values
    ConfigEntryPage:
      type: object
      description: One page of ConfigEntry results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ConfigEntriesSubmitRequest:
      type: object
      properties:
        change_reason:
          type: string
          maxLength: 500
      required:
      - change_reason
    ConfigEntriesRollbackRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    ConfigChangePage:
      type: object
      description: One page of ConfigChange results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigChange'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    ConfigEntriesExportRequest:
      type: object
      properties:
        namespaces:
          type: array
          items: {}
        environment:
          type: string
          maxLength: 32
    ConfigEntriesImportRequest:
      type: object
      properties:
        bundle:
          type: object
          additionalProperties: true
      required:
      - bundle
    CountryPackPage:
      type: object
      description: One page of CountryPack results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CountryPack'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    CountryPacksInstallRequest:
      type: object
      properties:
        legal_entity_id:
          type: string
          format: uuid
        overrides:
          type: object
          additionalProperties: true
      required:
      - legal_entity_id
    TenantCountryPackPage:
      type: object
      description: One page of TenantCountryPack results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantCountryPack'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    InstalledCountryPacksUpgradeRequest:
      type: object
      properties:
        country_pack_id:
          type: string
          format: uuid
      required:
      - country_pack_id
    InstalledCountryPacksUninstallRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    TaxRateRulePage:
      type: object
      description: One page of TaxRateRule results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaxRateRule'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TaxRateRulesCalculateRequest:
      type: object
      properties:
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        applies_to:
          type: string
          maxLength: 64
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        customer_segment:
          type: string
          maxLength: 64
        legal_entity_id:
          type: string
          format: uuid
      required:
      - country
      - applies_to
      - amount
      - currency
    ApprovalRequest:
      type: object
      description: A pending sensitive operation awaiting checker approval (four-eyes)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        approval_policy_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Policy applied
        resource_type:
          type: string
          maxLength: 64
          description: Resource type
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Resource id (empty for creates)
        action:
          type: string
          maxLength: 40
          description: Action
        title:
          type: string
          maxLength: 255
          description: Short title shown in the approvals queue
        summary:
          type:
          - string
          - 'null'
          description: Human-readable description of the change
        payload:
          type: object
          additionalProperties: true
          description: Operation to execute once approved
        diff:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Before/after diff for updates
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount, for threshold routing (a request without an amount gets every level of an amount-tiered policy)
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency of the amount (ISO 4217)
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          description: Priority
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CHANGES_REQUESTED
          - CANCELLED
          - EXPIRED
          - EXECUTED
          - EXECUTION_FAILED
          description: Status
          readOnly: true
        maker:
          type: string
          maxLength: 64
          description: Requesting user
          readOnly: true
        owner_service:
          type:
          - string
          - 'null'
