openapi: 3.1.0
info:
  title: Meridian Core — config-service
  version: 1.0.0
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Custom Field Definitions
  description: Defines what a tenant stores in the custom_field_1..5 slots of any table/API (label, type, validation, UI)
- name: Config Entries
  description: A versioned configuration document (configuration as data); one ACTIVE version per key
- name: Config Changes
  description: Immutable history of configuration changes with diffs
- name: Country Packs
  description: Released bundle of jurisdiction content (reports, tax rules, holidays, schemes, KYC rules)
- name: Installed Country Packs
  description: A country pack installed for a tenant's legal entity, with local overrides
- name: Tax Rate Rules
  description: Tax rule (withholding tax on interest, VAT/GST on fees, stamp duty) per jurisdiction
paths:
  /v1/config/custom-fields:
    get:
      operationId: customFieldDefinitionsList
      summary: List custom field definitions
      tags:
      - Custom Field Definitions
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: table_name
        in: query
        schema:
          type: string
          maxLength: 64
      - name: slot
        in: query
        schema:
          type: integer
          format: int32
      - name: field_key
        in: query
        schema:
          type: string
          maxLength: 64
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinitionPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-01
      x-service: config-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-required-scope: platform:read
      x-table: custom_field_definition
      x-crud: true
      x-crud-list: true
    post:
      operationId: customFieldDefinitionsCreate
      summary: Create custom field definition
      tags:
      - Custom Field Definitions
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionCreate'
      x-requirements:
      - ADM-01
      x-service: config-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-required-scope: platform:write
      x-table: custom_field_definition
      x-crud: true
      x-crud-create: true
  /v1/config/custom-fields/{id}:
    get:
      operationId: customFieldDefinitionsGet
      summary: Retrieve custom field definition
      tags:
      - Custom Field Definitions
      security:
      - oauth2:
        - platform:read
      parameters: &id006
      - &id005
