info:
  description: 'Cross-cutting platform capabilities: multi-tenancy and cells, legal entities and branches, staff identity
    and access (RBAC + ABAC, SSO, MFA), API clients and keys, versioned configuration and country packs, reference data, documents
    and e-signature, maker-checker approvals and workflows, notifications, webhooks, the tamper-evident audit log, and SaaS
    usage metering and billing.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — identity-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/users:
    get:
      operationId: usersList
      summary: List users
      tags:
      - Users
      security:
      - oauth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - LOCKED
          - SUSPENDED
          - DEACTIVATED
      - name: user_type
        in: query
        schema:
          type: string
          enum:
          - STAFF
          - PLATFORM_OPERATOR
          - AGENT_STAFF
          - AUDITOR
          - SERVICE_ACCOUNT
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: email
        in: query
        schema:
          type: string
          format: email
          maxLength: 320
      - name: username
        in: query
        schema:
          type: string
          maxLength: 120
      - name: sso_provider_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ADM-02
      x-service: identity-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:read")'
      x-table: app_user
      x-crud: true
      x-crud-list: true
    post:
      operationId: usersCreate
      summary: Create user
      tags:
      - Users
      security:
      - oauth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserCreate'
      x-requirements:
      - ADM-02
      x-service: identity-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("platform:write")'
      x-table: app_user
      x-crud: true
      x-crud-create: true
  /v1/users/{id}:
    get:
