    ApprovalRequest:
      type: object
      description: A pending sensitive operation awaiting checker approval (four-eyes)
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        approval_policy_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Policy applied
        resource_type:
          type: string
          maxLength: 64
          description: Resource type
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Resource id (empty for creates)
        action:
          type: string
          maxLength: 40
          description: Action
        title:
          type: string
          maxLength: 255
          description: Short title shown in the approvals queue
        summary:
          type:
          - string
          - 'null'
          description: Human-readable description of the change
        payload:
          type: object
          additionalProperties: true
          description: Operation to execute once approved
        diff:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Before/after diff for updates
        amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Amount, for threshold routing (a request without an amount gets every level of an amount-tiered policy)
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          description: Currency of the amount (ISO 4217)
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          description: Priority
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CHANGES_REQUESTED
          - CANCELLED
          - EXPIRED
          - EXECUTED
          - EXECUTION_FAILED
          description: Status
          readOnly: true
        maker:
          type: string
          maxLength: 64
          description: Requesting user
          readOnly: true
        owner_service:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Service that owns the resource type and executes the decision; set from the caller's service identity
            (X-Meridian-Service with an internal token), workflow-service for generic requests opened by users (SEC-03)
          readOnly: true
        required_approvals:
          type: integer
          format: int32
          description: Approvals required
          readOnly: true
        approvals_received:
          type: integer
          format: int32
          description: Approvals received
          readOnly: true
        current_level:
          type: integer
          format: int32
          description: Current approval level
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiry
          readOnly: true
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Final decision time
          readOnly: true
        executed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Execution time
          readOnly: true
        execution_result:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Result or error from executing the operation
          readOnly: true
        approval_route:
          type:
          - array
          - 'null'
          items: {}
          description: Snapshot of the applicable levels taken at creation (policy edits do not affect it)
          readOnly: true
        cancel_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Reason given by the maker when cancelling
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
