      description: An authenticated staff session; revocable
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        user_id:
          type: string
          format: uuid
          description: User
        auth_method:
          type: string
          maxLength: 32
          description: PASSWORD, SSO_OIDC, SSO_SAML, PASSKEY
        mfa_verified:
          type: boolean
          description: MFA completed
        ip_address:
          type:
          - string
          - 'null'
          description: Client IP (IPv4 or IPv6 address)
        user_agent:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Browser user agent
        device_fingerprint:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Device fingerprint
        geo_country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Country resolved from IP (ISO 3166-1 alpha-2)
        started_at:
          type: string
          format: date-time
          description: Session start
          readOnly: true
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last activity
          readOnly: true
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Revocation time
          readOnly: true
        revoke_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Revocation reason
          readOnly: true
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - user_id
      - auth_method
      - mfa_verified
      - started_at
      - expires_at
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per logical request; replays return the original response for 24h
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current row_version of the resource (optimistic locking)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            platform:read: Read Platform and Administration
            platform:write: Change Platform and Administration
            platform:routing-read: Narrow scope platform:routing-read
            platform:operator: Platform operator (operator tenant or service only)
        authorizationCode:
          authorizationUrl: https://auth.meridian.example/oauth2/authorize
          tokenUrl: https://auth.meridian.example/oauth2/token
          scopes:
            platform:read: Read Platform and Administration
            platform:write: Change Platform and Administration
            platform:routing-read: Narrow scope platform:routing-read
            platform:operator: Platform operator (operator tenant or service only)
