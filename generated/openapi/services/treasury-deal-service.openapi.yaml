info:
  description: 'Front-to-back treasury: money market, FX and securities deals with confirmations and settlement, counterparty
    limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and asset-liability management (repricing
    gap, NII/EVE sensitivity) with funds transfer pricing.

    '
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Meridian Core — treasury-deal-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/treasury/counterparties:
    get:
      operationId: treasuryCounterpartiesList
      summary: List treasury counterparties
      tags:
      - Treasury Counterparties
      security:
      - oauth2:
        - treasury:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: counterparty_type
        in: query
        schema:
          type: string
          enum:
          - BANK
          - CENTRAL_BANK
          - BROKER
          - CORPORATE
          - FUND
          - SOVEREIGN
          - SUPRANATIONAL
          - INTERNAL
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - ACTIVE
          - SUSPENDED
          - CLOSED
      - name: country_code
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: bic
        in: query
        schema:
          type: string
          maxLength: 11
      - name: lei
        in: query
        schema:
          type: string
          maxLength: 20
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreasuryCounterpartyPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - TRY-01
      - TRY-02
      x-service: treasury-deal-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("treasury:read")'
      x-table: treasury_counterparty
      x-crud: true
      x-crud-list: true
    post:
      operationId: treasuryCounterpartiesCreate
      summary: Create treasury counterpartie
      tags:
      - Treasury Counterparties
      security:
      - oauth2:
        - treasury:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreasuryCounterparty'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreasuryCounterpartyCreate'
      x-requirements:
      - TRY-01
      - TRY-02
      x-service: treasury-deal-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("treasury:write")'
      x-table: treasury_counterparty
      x-crud: true
      x-crud-create: true
  /v1/treasury/counterparties/{id}:
    get:
      operationId: treasuryCounterpartiesGet
      summary: Retrieve treasury counterpartie
      tags:
      - Treasury Counterparties
      security:
      - oauth2:
        - treasury:read
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
