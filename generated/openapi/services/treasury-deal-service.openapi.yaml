components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    TreasuryCounterpartyPage:
      type: object
      description: One page of TreasuryCounterparty results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCounterparty'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TreasuryCounterpartiesApproveRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    TreasuryCounterpartiesSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    TreasuryCounterpartyLimitPage:
      type: object
      description: One page of TreasuryCounterpartyLimit results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCounterpartyLimit'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TreasurySsiPage:
      type: object
      description: One page of TreasurySsi results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreasurySsi'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    TreasurySsisVerifyRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    TreasuryCounterpartyLimitsCheckRequest:
      type: object
      properties:
        treasury_counterparty_id:
          type: string
          format: uuid
        limit_type:
          type: string
          enum:
          - SETTLEMENT
          - PRE_SETTLEMENT
          - MONEY_MARKET
          - FX
          - ISSUER
          - COUNTRY
          - TENOR
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        tenor_days:
          type: integer
          format: int32
      required:
      - treasury_counterparty_id
      - limit_type
      - amount
      - currency
    TreasuryLimitUtilisationPage:
      type: object
      description: One page of TreasuryLimitUtilisation results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryLimitUtilisation'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    MoneyMarketDealPage:
      type: object
      description: One page of MoneyMarketDeal results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MoneyMarketDeal'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    MoneyMarketDealsRolloverRequest:
      type: object
      properties:
        new_rate:
          type: string
          format: decimal
          examples:
          - '125.50'
        new_maturity_date:
          type: string
          format: date
        rollover_type:
          type: string
          enum:
          - NONE
          - PRINCIPAL_ONLY
          - PRINCIPAL_AND_INTEREST
      required:
      - new_rate
      - rollover_type
    MoneyMarketDealsCallRequest:
      type: object
      properties:
        call_date:
          type: string
          format: date
      required:
      - call_date
    MoneyMarketDealsCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    MoneyMarketDealsAccrueRequest:
      type: object
      properties:
        as_of:
          type: string
          format: date
      required:
      - as_of
