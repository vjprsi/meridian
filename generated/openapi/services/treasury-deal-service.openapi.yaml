openapi: 3.1.0
info:
  title: Meridian Core — treasury-deal-service
  version: 1.0.0
  description: 'Front-to-back treasury: money market, FX and securities deals with confirmations and settlement, counterparty
    limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and asset-liability management (repricing
    gap, NII/EVE sensitivity) with funds transfer pricing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Treasury Counterparties
  description: Treasury counterparty (bank, central bank, broker, corporate) with identifiers and rating
- name: Treasury Ssis
  description: Standing settlement instructions per counterparty and currency
- name: Treasury Counterparty Limits
  description: Credit / settlement / tenor limit on a counterparty (or its group)
- name: Treasury Limit Utilisations
  description: Immutable record of a deal consuming or releasing a counterparty limit
- name: Money Market Deals
  description: Money market placement, borrowing, call, repo or CD with full lifecycle
- name: Treasury Fx Deals
  description: Treasury FX deal (spot, forward, swap, NDF) — distinct from customer FX in payments
- name: Treasury Fx Deal Legs
  description: A leg of a treasury FX deal (one for spot/forward, two for swaps)
- name: Treasury Securities
  description: Security master record (bonds, bills, CP, CDs)
- name: Securities Holdings
  description: Position in a security by portfolio and accounting classification
- name: Securities Trades
  description: Purchase or sale of a security that changes a holding
- name: Treasury Confirmations
  description: Confirmation of a treasury deal (SWIFT MT300 FX, MT320 MM, MT541/543 securities) and matching
- name: Treasury Settlements
  description: Settlement instruction generated for a treasury deal cash flow
paths:
  /v1/treasury/counterparties:
    get:
      operationId: treasuryCounterpartiesList
      summary: List treasury counterparties
      tags:
      - Treasury Counterparties
      security:
      - oauth2:
        - treasury:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: counterparty_type
        in: query
        schema:
          type: string
          enum:
          - BANK
          - CENTRAL_BANK
          - BROKER
          - CORPORATE
          - FUND
          - SOVEREIGN
          - SUPRANATIONAL
          - INTERNAL
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - ACTIVE
          - SUSPENDED
          - CLOSED
      - name: country_code
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: bic
        in: query
        schema:
          type: string
          maxLength: 11
      - name: lei
        in: query
        schema:
          type: string
          maxLength: 20
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreasuryCounterpartyPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - TRY-01
      - TRY-02
      x-service: treasury-deal-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("treasury:read")'
      x-required-scope: treasury:read
      x-table: treasury_counterparty
      x-crud: true
      x-crud-list: true
    post:
      operationId: treasuryCounterpartiesCreate
      summary: Create treasury counterpartie
      tags:
      - Treasury Counterparties
      security:
      - oauth2:
        - treasury:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreasuryCounterparty'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreasuryCounterpartyCreate'
      x-requirements:
