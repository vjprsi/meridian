components:
  parameters:
    CreatedAfter:
      in: query
      name: created_after
      schema:
        format: date-time
        type: string
    CreatedBefore:
      in: query
      name: created_before
      schema:
        format: date-time
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    IdempotencyKey:
      description: Unique key per logical request; replays return the original response for 24h
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        type: string
    IfMatch:
      description: Current row_version of the resource (optimistic locking)
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Malformed request
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Version or idempotency conflict
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not allowed
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Resource not found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Rate limit exceeded
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Missing or invalid credentials
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Business rule violation
  schemas:
    MoneyMarketDeal:
      description: Money market placement, borrowing, call, repo or CD with full lifecycle
      properties:
        accrued_interest:
          description: Accrued interest to date
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type: string
        cancel_reason:
          description: Cancellation reason
          maxLength: 255
          type:
          - string
          - 'null'
        collateral_description:
          description: Repo collateral details
          type:
          - string
          - 'null'
        created_at:
          description: Creation time
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: Principal that created the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        currency:
          description: Currency (ISO 4217)
          pattern: ^[A-Z]{3}$
          type: string
        custom_field_1:
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_2:
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_3:
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_4:
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        custom_field_5:
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
          maxLength: 500
          type:
          - string
          - 'null'
        day_count:
          description: Day-count basis
          enum:
          - ACT_360
          - ACT_365
          - ACT_365L
          - ACT_ACT_ISDA
          - THIRTY_360
          - THIRTY_E_360
          type: string
        deal_ref:
          description: Deal reference
          maxLength: 32
          type: string
        deal_type:
          description: Placement, borrowing, repo, ...
          enum:
          - PLACEMENT
          - BORROWING
          - CALL_PLACEMENT
          - CALL_BORROWING
          - REPO
          - REVERSE_REPO
          - CD_ISSUED
          - CD_PURCHASED
          type: string
        dealer_id:
          description: Dealer
          format: uuid
          type: string
        id:
          description: Unique id (UUIDv7, time-ordered)
          format: uuid
          readOnly: true
          type: string
        interest_amount:
          description: Interest to maturity
          examples:
          - '125.50'
          format: decimal
          readOnly: true
          type:
          - string
          - 'null'
        interest_rate:
          description: All-in rate
          examples:
          - '125.50'
          format: decimal
          type: string
        is_call:
          description: Call (open-ended) deal
          type: boolean
        ledger_account_id:
          description: Ledger account carrying the deal
          format: uuid
          type:
          - string
          - 'null'
        legal_entity_id:
          description: Booking entity
          format: uuid
          type: string
        maturity_date:
          description: Maturity date (empty for call deals)
          format: date
          type:
          - string
          - 'null'
        maturity_journal_entry_id:
          description: Posting on maturity
          format: uuid
          type:
          - string
          - 'null'
        notice_days:
          description: Notice period for call deals
          format: int32
          type:
          - integer
          - 'null'
        principal:
          description: Principal amount
          examples:
          - '125.50'
          format: decimal
          type: string
        rate_index:
          description: Index for floating deals, e.g. SOFR
          maxLength: 32
          type:
          - string
          - 'null'
        rate_type:
          description: Fixed or floating
          enum:
          - FIXED
          - FLOATING
          type: string
        rolled_from_deal_id:
          description: Previous deal when rolled
          format: uuid
          type:
          - string
          - 'null'
        rollover_type:
          description: Rollover instruction
          enum:
          - NONE
          - PRINCIPAL_ONLY
          - PRINCIPAL_AND_INTEREST
          type: string
        row_version:
          description: Optimistic lock version; send as If-Match
          format: int32
          readOnly: true
          type: integer
        settlement_journal_entry_id:
          description: Posting on settlement
          format: uuid
          type:
          - string
          - 'null'
        spread:
          description: Spread over index
          examples:
          - '125.50'
          format: decimal
          type:
          - string
          - 'null'
        status:
          description: Lifecycle status
          enum:
          - CAPTURED
          - VERIFIED
          - CONFIRMED
          - SETTLED
          - MATURED
          - CANCELLED
          - AMENDED
          readOnly: true
          type: string
        trade_date:
          description: Trade date
          format: date
          type: string
        treasury_counterparty_id:
          description: Counterparty
          format: uuid
          type: string
        updated_at:
          description: Last update time
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: Principal that last updated the row
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
        value_date:
          description: Value (start) date
          format: date
          type: string
        verified_by:
          description: Back-office verifier
          maxLength: 64
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - id
      - created_at
      - updated_at
      - row_version
