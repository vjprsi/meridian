        value_date:
          type: string
          format: date
          description: Value (start) date
        maturity_date:
          type:
          - string
          - 'null'
          format: date
          description: Maturity date (empty for call deals)
        is_call:
          type: boolean
          description: Call (open-ended) deal
        notice_days:
          type:
          - integer
          - 'null'
          format: int32
          description: Notice period for call deals
        rate_type:
          type: string
          enum:
          - FIXED
          - FLOATING
          description: Fixed or floating
        interest_rate:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: All-in rate
        rate_index:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Index for floating deals, e.g. SOFR
        spread:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Spread over index
        day_count:
          type: string
          enum:
          - ACT_360
          - ACT_365
          - ACT_365L
          - ACT_ACT_ISDA
          - THIRTY_360
          - THIRTY_E_360
          description: Day-count basis
        interest_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: Interest to maturity
          readOnly: true
        accrued_interest:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Accrued interest to date
          readOnly: true
        rollover_type:
          type: string
          enum:
          - NONE
          - PRINCIPAL_ONLY
          - PRINCIPAL_AND_INTEREST
          description: Rollover instruction
        rolled_from_deal_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Previous deal when rolled
        collateral_description:
          type:
          - string
          - 'null'
          description: Repo collateral details
        dealer_id:
          type: string
          format: uuid
          description: Dealer
        verified_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Back-office verifier
          readOnly: true
        status:
          type: string
          enum:
