openapi: 3.1.0
info:
  title: Meridian Core — Regulatory Reporting, Analytics and AI API
  version: 1.0.0
  description: 'Country-pack regulatory reporting (definitions, runs, validation, submission, CRS/FATCA), self-service analytics
    over the lakehouse (dashboards, saved queries, exports, data shares), and the AI platform: model registry and model risk
    management, deployments and monitoring, copilots with a full audit trail, and the LLM gateway policy.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Report Definitions
  description: A regulatory or statutory report in a country pack (e.g. central-bank balance sheet, liquidity, CRS)
- name: Report Definition Versions
  description: Versioned template, data mapping and validation rules of a report definition
- name: Report Schedules
  description: Automatic schedule for producing a report for a legal entity
- name: Report Runs
  description: One production of a report for a legal entity and reporting date, reproducible from a data snapshot
- name: Report Outputs
  description: A file produced by a report run. Append-only.
- name: Report Adjustments
  description: Manual adjustment (overlay) to a reported value, with justification and four-eyes approval
- name: Report Submissions
  description: Submission of a report output to the regulator, with acknowledgement tracking
- name: Crs Fatca Records
  description: Reportable account record for CRS or FATCA for one account holder and year
- name: Report Job Runs
  description: One scheduled job execution per tenant, job and business date (makes the scheduled actions idempotent)
- name: Analytics Kpis
  description: Governed KPI definition (metric spec, unit, dataset, owner)
- name: Analytics Saved Queries
  description: Saved, parameterised query in the Meridian query DSL over a whitelisted dataset (read-only, tenant-scoped)
- name: Analytics Dashboards
  description: Dashboard shown in the console (portfolio, liquidity, delinquency, agents, fraud, ...)
- name: Analytics Widgets
  description: A chart, table or KPI tile on a dashboard
- name: Analytics Exports
  description: Asynchronous export of a saved query's results to a file
- name: Analytics Data Shares
  description: Scheduled delivery of datasets to the tenant's warehouse, bucket or Iceberg catalog
- name: Analytics Job Runs
  description: One scheduled job execution per tenant, job and business date (makes the scheduled actions idempotent)
- name: Ml Models
  description: A registered ML model (fraud, credit, AML, collections, LLM, ...) under model risk governance
- name: Ml Model Versions
  description: A trained version with metrics, bias tests, explainability and approval record
- name: Model Deployments
  description: Deployment of a model version to an environment in shadow, canary, champion or challenger mode
- name: Model Metrics
  description: Monitoring measurement of a deployed model (drift, stability, performance, latency). Append-only.
- name: Ml Features
  description: Feature catalogue entry (Feast) used by fraud, credit and AML models
- name: Copilots
  description: A copilot configuration (purpose, tools, model, guardrails, human-approval rules)
- name: Copilot Interactions
  description: Immutable audit of one copilot turn (redacted prompt/response, hashes, tool calls, citations, outcome)
- name: Ai Copilot Feedback
  description: User rating and comment on a copilot interaction. Append-only.
- name: Llm Gateway Policies
  description: Tenant policy for LLM use (opt-in, allowed models, PII redaction, residency, budgets, logging)
- name: Ai Job Runs
  description: One scheduled job execution per tenant, job and business date (makes the scheduled actions idempotent)
paths:
  /v1/reporting/definitions:
    get:
      operationId: reportDefinitionsList
      summary: List report definitions
      tags:
      - Report Definitions
      security:
      - oauth2:
        - reporting:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: country_pack
        in: query
        schema:
          type: string
          maxLength: 16
      - name: jurisdiction
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: regulator
        in: query
        schema:
          type: string
          maxLength: 64
      - name: report_family
        in: query
        schema:
          type: string
          maxLength: 40
      - name: frequency
        in: query
        schema:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUAL
          - ANNUAL
          - AD_HOC
          - EVENT_DRIVEN
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - DEPRECATED
      - name: code
        in: query
        schema:
          type: string
          maxLength: 64
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinitionPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - REG-01
      x-service: regulatory-reporting-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("reporting:read")'
      x-required-scope: reporting:read
      x-table: report_definition
      x-crud: true
      x-crud-list: true
    post:
      operationId: reportDefinitionsCreate
      summary: Create report definition
      tags:
      - Report Definitions
      security:
      - oauth2:
        - reporting:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinition'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDefinitionCreate'
      x-requirements:
      - REG-01
      x-service: regulatory-reporting-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("reporting:write")'
      x-required-scope: reporting:write
      x-table: report_definition
      x-crud: true
      x-crud-create: true
