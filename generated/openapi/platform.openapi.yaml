          type: string
          enum:
          - PROVISIONING
          - ACTIVE
          - DRAINING
          - READ_ONLY
          - DECOMMISSIONED
      - name: is_dedicated
        in: query
        schema:
          type: boolean
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
