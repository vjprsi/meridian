          maxLength: 160
        legal_name:
          type: string
          maxLength: 255
        tenant_type:
          type: string
          enum:
          - BANK
          - FINTECH
          - TELCO
          - ENTERPRISE
          - CENTRAL_BANK
          - PLATFORM_OPERATOR
        default_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        default_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        primary_contact_email:
