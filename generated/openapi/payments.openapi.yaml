    PaymentCreate:
      type: object
      properties:
        payment_type:
          type: string
          enum:
          - INTERNAL_TRANSFER
          - P2P
          - DOMESTIC
          - INSTANT
          - CROSS_BORDER
          - BULK_ITEM
          - PAYROLL
          - DIRECT_DEBIT
          - REQUEST_TO_PAY
          - BILL_PAYMENT
          - QR_PAYMENT
          - LINK_PAYMENT
          - REFUND
          - RETURN
          description: Business type of payment
        direction:
          type: string
          enum:
          - OUTBOUND
          - INBOUND
          - INTERNAL
          description: Outbound, inbound or internal (book transfer)
        channel:
          type: string
          enum:
          - API
          - MOBILE
          - WEB
          - BRANCH
          - USSD
          - AGENT
          - BULK_FILE
          - OPEN_BANKING
          - SCHEDULER
          - INBOUND_RAIL
          description: Channel that initiated the payment
        priority:
          type: string
          enum:
          - NORMAL
          - HIGH
          - URGENT
          description: Requested priority
        customer_id:
          type: string
          format: uuid
          description: Initiating or receiving customer
        debtor_account_id:
          type: string
          format: uuid
          description: Internal source account (outbound / internal)
        debtor_wallet_id:
          type: string
          format: uuid
          description: Internal source wallet
        debtor_name:
          type: string
          maxLength: 140
          description: Debtor (payer) name
        debtor_account_id_type:
          type: string
          enum:
          - IBAN
          - BBAN
          - ACCOUNT_NUMBER
          - WALLET
          - PROXY
          - CARD_PAN_TOKEN
          - INTERNAL
          description: Scheme of debtor account identifier
        debtor_account_number:
          type: string
          maxLength: 64
          description: Debtor IBAN / account number / wallet id
        debtor_agent_bic:
          type: string
          maxLength: 11
          description: Debtor agent BIC
        debtor_agent_clearing_id:
          type: string
          maxLength: 35
          description: Debtor agent clearing id (sort code, ABA, IFSC)
        debtor_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Debtor country (ISO 3166-1 alpha-2)
        payee_id:
          type: string
          format: uuid
          description: Saved payee used, if any
        creditor_name:
          type: string
          maxLength: 140
          description: Creditor (payee) name (required unless payee_id or creditor_account_id is given)
        creditor_account_id_type:
          type: string
          enum:
          - IBAN
          - BBAN
          - ACCOUNT_NUMBER
          - WALLET
          - PROXY
          - CARD_PAN_TOKEN
          - INTERNAL
          description: Scheme of creditor account identifier (required with creditor_account_number)
        creditor_account_number:
          type: string
          maxLength: 64
          description: Creditor IBAN / account number / wallet id / proxy
        creditor_agent_bic:
          type: string
          maxLength: 11
          description: Creditor agent BIC
        creditor_agent_clearing_id:
          type: string
          maxLength: 35
          description: Creditor agent clearing id (sort code, ABA, IFSC)
        creditor_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Creditor country (ISO 3166-1 alpha-2)
        creditor_address:
          type: object
          additionalProperties: true
          description: Structured postal address (ISO 20022 PostalAddress24)
        creditor_account_id:
          type: string
          format: uuid
          description: Internal destination account (inbound / internal)
        creditor_wallet_id:
          type: string
          format: uuid
          description: Internal destination wallet
        creditor_merchant_id:
          type: string
          format: uuid
          description: Merchant paid (QR, link payments)
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount debited from the debtor in currency
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Debit currency (ISO 4217)
        instructed_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Amount instructed to arrive (cross-border)
        instructed_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency of the instructed amount (ISO 4217)
        fx_quote_id:
          type: string
          format: uuid
          description: FX quote accepted for this payment
        charge_bearer:
          type: string
          enum:
          - DEBT
          - CRED
          - SHAR
          - SLEV
          description: Who bears charges (ISO 20022 ChrgBr)
        purpose_code:
          type: string
          maxLength: 4
          description: ISO 20022 external purpose code
        category_purpose:
          type: string
          maxLength: 4
          description: ISO 20022 category purpose (e.g. SALA, SUPP)
        remittance_unstructured:
          type: string
          maxLength: 140
          description: Unstructured remittance information
        remittance_structured:
          type: object
          additionalProperties: true
          description: Structured remittance (creditor reference, invoices)
        reference:
          type: string
          maxLength: 35
          description: Payer reference shown on statements
        requested_execution_date:
          type: string
          format: date
          description: Requested execution date (future-dated payments)
        risk_context:
          type: object
          additionalProperties: true
          description: Session context for fraud scoring, set server-side by the channel (device_fingerprint, ip_address,
            ip_country, session_id, user_agent)
        bulk_payment_id:
          type: string
          format: uuid
          description: Parent bulk payment
        mandate_id:
          type: string
          format: uuid
          description: Mandate used (direct debits)
        request_to_pay_id:
          type: string
          format: uuid
          description: Request-to-pay being paid
        original_payment_id:
          type: string
          format: uuid
          description: Original payment for returns and refunds
        ob_consent_id:
          type: string
          format: uuid
          description: Open banking consent (PIS)
        metadata:
          type: object
          additionalProperties: true
          description: Client-defined key/value metadata
        custom_field_1:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type: string
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
        upstream_fraud_score_id:
          type: string
          format: uuid
          description: 'Server-to-server only (wallet-service payouts, internal token): fraud-service evaluation the originating
            service already made; ignored from any other caller (write-only; not stored as a column)'
          writeOnly: true
        debtor_clearing_ledger_account_id:
          type: string
          format: uuid
          description: 'Server-to-server only (wallet-service payouts): ledger account the wallet transaction already credited,
            debited by the payment instead of a deposit account (write-only; not stored as a column)'
          writeOnly: true
      required:
      - payment_type
      - direction
      - channel
      - amount
      - currency
