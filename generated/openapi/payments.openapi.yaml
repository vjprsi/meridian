    PaymentOrder:
      type: object
      description: 'WE-ETM-1 (G-08): an Order & Pay (ETM) order. The order (what the customer buys / the bill), the payment
        (the money movement, held in the payment table) and the fulfilment (delivery / confirmation of the goods or service)
        are tracked as SEPARATE lifecycle states linked to one order, so paid-but-not-fulfilled, fulfilled-but-not-paid and
        both-done are represented independently. Carries the ambiguous-case settlement state (retry / rollback / roll-forward
        decided from a payment-gateway heartbeat) and a derived green / yellow / red health alert. Gated per tenant (meridian.payment.etm.enabled;
        default off).

        '
      properties:
        id:
          type: string
          format: uuid
          description: Unique id (UUIDv7, time-ordered)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        created_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the row
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update time
          readOnly: true
        updated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that last updated the row
          readOnly: true
        row_version:
          type: integer
          format: int32
          description: Optimistic lock version; send as If-Match
          readOnly: true
        order_reference:
          type: string
          maxLength: 35
          description: Server-generated order reference shown to the customer
          readOnly: true
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer placing the order
        merchant_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Merchant / biller being paid
        order_status:
          type: string
          enum:
          - CREATED
          - AWAITING_PAYMENT
          - PAID
          - FULFILLING
          - COMPLETED
          - CANCELLED
          - FAILED
          description: Order lifecycle (what is being bought)
          readOnly: true
        fulfilment_status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - FULFILLED
          - FAILED
          - CANCELLED
          description: Delivery / confirmation of the goods or service (segregated from the payment)
          readOnly: true
        payment_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The payment (money movement) leg; segregated from order and fulfilment
          readOnly: true
        payment_status:
          type:
          - string
          - 'null'
          enum:
          - INITIATED
          - SCREENING
          - PENDING_APPROVAL
          - APPROVED
          - SUBMITTED
          - ACCEPTED
          - SETTLED
          - REJECTED
          - RETURNED
          - FAILED
          - CANCELLED
          - IN_REPAIR
          - ON_HOLD
          description: Last observed status of the payment leg (denormalised for segregation queries)
          readOnly: true
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
          description: Order amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Order currency (ISO 4217)
        description:
          type:
          - string
          - 'null'
          maxLength: 255
          description: What the order is for
        external_order_id:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Merchant / caller order id
        channel:
          type:
          - string
          - 'null'
          enum:
          - API
          - MOBILE
          - WEB
          - BRANCH
          - USSD
          - AGENT
          - BULK_FILE
          - OPEN_BANKING
          - SCHEDULER
          - INBOUND_RAIL
          description: Channel that placed the order
        alert_level:
          type: string
          enum:
          - GREEN
          - YELLOW
          - RED
          description: 'Derived health: GREEN settled cleanly, YELLOW ambiguous / in-resolution / aging, RED failed / needs
            manual intervention'
          readOnly: true
        ambiguous:
          type: boolean
          description: The payment-gateway / rail outcome is uncertain and awaiting deterministic settlement resolution
          readOnly: true
        settlement_action:
          type:
          - string
          - 'null'
          enum:
          - RETRY
          - ROLLBACK
          - ROLL_FORWARD
          - WAIT
          description: Last ambiguous-case resolution action decided (retry / rollback / roll-forward / wait)
          readOnly: true
        settlement_attempts:
          type: integer
          format: int32
          description: Ambiguous-settlement resolution attempts made
          readOnly: true
        next_settlement_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the ambiguous case is next evaluated by the resolver (exponential backoff; empty = none scheduled)
          readOnly: true
        pg_heartbeat_status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DOWN
          - UNKNOWN
          description: Last recorded payment-gateway liveness / status probe
          readOnly: true
        pg_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of the last payment-gateway heartbeat (staleness drives the resolution decision)
          readOnly: true
        payment_deadline_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When an unpaid order is considered to have timed out
          readOnly: true
        fulfilment_deadline_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When fulfilment is considered to have timed out (a fulfilment timeout forces ambiguous settlement to
            auto-resolve)
          readOnly: true
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time the payment leg settled
          readOnly: true
        fulfilled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time fulfilment completed
          readOnly: true
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time the order reached a terminal state
          readOnly: true
        resolution_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Why the last settlement action was taken
          readOnly: true
        rollback_recall_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Recall opened on the existing reversal path when the order was rolled back after its payment settled
          readOnly: true
        settlement_suspense_amount:
          type:
          - string
          - 'null'
          format: decimal
          examples:
          - '125.50'
          description: 'WE-FIN-1 / D-ED-10: on a roll-forward whose gateway outcome was never positively confirmed, the not-yet-confirmed
            amount routed through the ETM settlement-suspense GL (meridian.payment.etm.settlement-suspense) - a tracked, reconciling
            merchant exposure cleared by WE-RECON-1 against the rail settlement file, not a silent write-off; a later confirmed
            failure clears it via the compensating reversal'
          readOnly: true
        initiated_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Principal that created the order
          readOnly: true
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Client key; a replay returns the original order
          readOnly: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Client-defined key/value metadata
        custom_field_1:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 1; label, type and validation configured in custom_field_definition
        custom_field_2:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 2; label, type and validation configured in custom_field_definition
        custom_field_3:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 3; label, type and validation configured in custom_field_definition
        custom_field_4:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 4; label, type and validation configured in custom_field_definition
        custom_field_5:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Tenant-defined custom field 5; label, type and validation configured in custom_field_definition
      required:
      - id
      - created_at
      - updated_at
      - row_version
      - order_reference
      - order_status
      - fulfilment_status
      - amount
      - currency
      - alert_level
