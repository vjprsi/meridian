          readOnly: true
        fraud_alert_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Fraud alert whose resolution releases or rejects a payment held for review
          readOnly: true
        fraud_degraded:
          type: boolean
          description: Fraud scoring timed out or was unavailable; the configured fallback decided
          readOnly: true
        fraud_rescore_attempts:
