        in: query
        schema:
          type: string
          enum:
          - INITIATED
          - SCREENING
          - PENDING_APPROVAL
          - APPROVED
          - SUBMITTED
          - ACCEPTED
          - SETTLED
          - REJECTED
          - RETURNED
          - FAILED
          - CANCELLED
          - IN_REPAIR
          - ON_HOLD
      - name: payment_type
        in: query
        schema:
          type: string
          enum:
          - INTERNAL_TRANSFER
          - P2P
          - DOMESTIC
          - INSTANT
          - CROSS_BORDER
          - BULK_ITEM
          - PAYROLL
          - DIRECT_DEBIT
          - REQUEST_TO_PAY
          - BILL_PAYMENT
          - QR_PAYMENT
          - LINK_PAYMENT
          - REFUND
          - RETURN
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - OUTBOUND
          - INBOUND
          - INTERNAL
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - API
          - MOBILE
          - WEB
          - BRANCH
          - USSD
          - AGENT
          - BULK_FILE
          - OPEN_BANKING
          - SCHEDULER
          - INBOUND_RAIL
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: debtor_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: creditor_account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: bulk_payment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: mandate_id
        in: query
        schema:
          type: string
          format: uuid
      - name: end_to_end_id
        in: query
        schema:
          type: string
          maxLength: 35
      - name: uetr
        in: query
        schema:
          type: string
          format: uuid
      - name: rail_id
        in: query
        schema:
          type: string
          format: uuid
      - name: requested_execution_date
        in: query
        schema:
          type: string
          format: date
      - name: ob_consent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - LED-05
      - PAY-01
      - PAY-02
      - PAY-03
      - PAY-04
      - PAY-06
      x-service: payment-service
      x-operation-extra-annotation: '@io.meridian.web.security.RequiredScope("payments:read")'
      x-required-scope: payments:read
      x-table: payment
      x-crud: true
      x-crud-list: true
    post:
      operationId: paymentsCreate
      summary: Create payment
      tags:
      - Payments
      security:
      - oauth2:
        - payments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      x-requirements:
      - LED-05
      - PAY-01
      - PAY-02
      - PAY-03
      - PAY-04
      - PAY-06
