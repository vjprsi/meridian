openapi: 3.1.0
info:
  title: Meridian Core — Payments Hub API
  version: 1.0.0
  description: 'ISO 20022-native payments hub. Initiates, screens, approves, routes, submits and settles payments on every
    rail (instant, batch, RTGS, mobile money, cross-border); manages payees, aliases, bulk files, direct-debit mandates, request-to-pay,
    payment links and QR codes; runs rail routing, settlement, liquidity and FX.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Payments
  description: Initiate and track payments on any rail. Status follows the PaymentStatus state machine.
- name: Payment Returns
  description: Return of a settled payment (pacs.004), inbound or outbound
- name: Payment Recalls
  description: Request to recall a payment (camt.056) and its resolution (camt.029)
- name: Payment Repairs
  description: Repair queue item for a payment that failed validation, routing or submission
- name: Payment Approvals
  description: Approval step for payments needing one or more approvers (business multi-signature)
- name: Payees
  description: Saved beneficiary in a customer's payee book
- name: Payee Aliases
  description: Proxy / alias directory entry (phone, email, UPI VPA, PIX key) mapping to an account
- name: Payee Verifications
  description: Stand-alone account name checks (Confirmation of Payee, name enquiry)
- name: Bulk Payments
  description: A batch of payments (payroll, supplier run) uploaded as a file or via API
- name: Bulk Payment Items
  description: One line of a bulk payment
- name: Payment Mandates
  description: Direct-debit mandate authorising a creditor to pull funds (SEPA DD, Bacs, ACH, PIX Automático, UPI Autopay)
- name: Direct Debit Collections
  description: One collection under a mandate (pacs.003 / ACH debit entry)
- name: Requests To Pay
  description: A request for payment sent to a payer (SEPA RTP, UPI collect, PIX cobrança)
- name: Payment Links
  description: Shareable payment link (pay-by-link) for collecting money online
- name: Payment Qr Codes
  description: EMVCo merchant-presented or person-to-person QR code (static or dynamic)
- name: Payment Orders
  description: 'Order & Pay (ETM, G-08): orders with segregated order / payment / fulfilment states, ambiguous-case settlement
    (retry / rollback / roll-forward from a payment-gateway heartbeat) and a green / yellow / red health alert. Gated per
    tenant (meridian.payment.etm.enabled; default off preserves current behaviour).

    '
- name: Payment Rails
  description: A payment rail / scheme the platform can send to or receive from
- name: Rail Adapters
  description: Technical connection to a rail (direct participant, sponsor bank, aggregator API)
- name: Rail Cutoffs
  description: Cut-off times per rail, payment type and currency
- name: Routing Rules
  description: Rule choosing a rail and adapter for a payment
- name: Rail Messages
  description: Raw message exchanged with a rail (pacs, pain, camt, ISO 8583, NACHA). Append-only, for audit and replay.
- name: Rail Settlement Batches
  description: Settlement cycle / batch on a rail (net positions, files submitted)
- name: Nostro Accounts
  description: Nostro / vostro / settlement / prefunding account held at a correspondent, central bank or partner
- name: Liquidity Positions
  description: Intraday liquidity position per nostro / rail, refreshed from statements and flows
- name: Rail Participants
  description: Bank / PSP directory entry (BIC, clearing codes, rail reachability)
- name: Fx Quotes
  description: A firm FX quote valid until expiry
- name: Fx Deals
  description: A booked FX conversion (from an accepted quote)
- name: Fx Margin Rules
  description: Margin rules per currency pair, segment and amount band
- name: Remittance Partners
  description: Payout / correspondent partner used for cross-border remittances
- name: Remittance Corridors
  description: Send-receive corridor with limits, pricing and partner routing
paths:
  /v1/payments:
    get:
      operationId: paymentsList
      summary: List payments
      tags:
      - Payments
      security:
      - oauth2:
        - payments:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
