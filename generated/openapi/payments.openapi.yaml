          - object
          - 'null'
          additionalProperties: true
          description: Structured remittance (creditor reference, invoices)
        reference:
          type:
          - string
          - 'null'
          maxLength: 35
          description: Payer reference shown on statements
        requested_execution_date:
          type:
          - string
          - 'null'
          format: date
          description: Requested execution date (future-dated payments)
        value_date:
          type:
          - string
          - 'null'
          format: date
          description: Interbank value date
          readOnly: true
        rail_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Rail chosen by routing
          readOnly: true
        rail_code:
          type:
          - string
          - 'null'
          maxLength: 32
          description: Rail code at submission time
          readOnly: true
        hold_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Ledger hold placed on the debtor account
          readOnly: true
        journal_entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Ledger posting on settlement
          readOnly: true
        screening_result_id:
          type:
          - string
          - 'null'
