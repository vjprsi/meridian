          type:
          - string
          - 'null'
          format: uuid
          description: Maker-checker approval
        approved_by:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Checker
          readOnly: true
        deactivation_reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Why the rule was disabled
          readOnly: true
