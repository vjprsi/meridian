          type: string
          maxLength: 160
          description: Rule name
        description:
          type:
          - string
          - 'null'
          description: What the rule detects
        subject_type:
          type: string
          enum:
          - CARD_AUTHORIZATION
          - PAYMENT
          - WALLET_TRANSACTION
          - LOGIN
          - ONBOARDING
          - BENEFICIARY_CHANGE
          - DEVICE_CHANGE
          - PROFILE_CHANGE
          - LOAN_APPLICATION
          description: Events the rule applies to
        expression:
          type: string
          description: CEL expression over the event, features and lists
        action:
          type: string
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - STEP_UP
          - SCORE_ADJUST
          - TAG
          description: Action when the rule fires
        score_adjustment:
          type: integer
          format: int32
          description: Points added to the score when it fires
        priority:
          type: integer
          format: int32
          description: Lower runs first; BLOCK rules short-circuit
        status:
          type: string
          enum:
          - DRAFT
          - SHADOW
          - ACTIVE
          - DISABLED
          description: Lifecycle (changed only by activate/deactivate); SHADOW logs hits without acting
          readOnly: true
        rule_version:
          type: integer
          format: int32
          description: Incremented on every change
          readOnly: true
        tags:
          type:
