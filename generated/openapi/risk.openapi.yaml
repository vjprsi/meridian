components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    FraudScorePage:
      type: object
      description: One page of FraudScore results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FraudScore'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FraudScoresEvaluateRequest:
      type: object
      properties:
        subject_type:
          type: string
          enum:
          - CARD_AUTHORIZATION
          - PAYMENT
          - WALLET_TRANSACTION
          - LOGIN
          - ONBOARDING
          - BENEFICIARY_CHANGE
          - DEVICE_CHANGE
          - PROFILE_CHANGE
          - LOAN_APPLICATION
        subject_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
        channel:
          type: string
          enum:
          - MOBILE_APP
          - WEB
          - API
          - USSD
          - AGENT
          - BRANCH
          - POS
          - ATM
          - ECOMMERCE
          - CONTACTLESS
          - OPEN_BANKING
        merchant_category_code:
          type: string
          maxLength: 4
        counterparty_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        device_fingerprint:
          type: string
          maxLength: 128
        device:
          type: object
          additionalProperties: true
        ip_address:
          type: string
          description: IPv4 or IPv6 address
        ip_country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        session_id:
          type: string
          maxLength: 128
        correlation_id:
          type: string
          maxLength: 128
        context:
          type: object
          additionalProperties: true
      required:
      - subject_type
      - subject_id
    FraudRuleHitPage:
      type: object
      description: One page of FraudRuleHit results (newest first)
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FraudRuleHit'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as ?cursor= to fetch the next page
        has_more:
          type: boolean
      required:
      - data
      - has_more
    FraudScoresFeedbackRequest:
      type: object
      properties:
        label:
          type: string
          enum:
          - FRAUD
          - NOT_FRAUD
          - UNKNOWN
        typology:
          type: string
          enum:
          - ACCOUNT_TAKEOVER
          - CARD_NOT_PRESENT
          - CARD_PRESENT_COUNTERFEIT
          - AUTHORISED_PUSH_PAYMENT_SCAM
          - FIRST_PARTY
          - SYNTHETIC_IDENTITY
          - MONEY_MULE
          - FRIENDLY_FRAUD
          - SIM_SWAP
          - INSIDER
          - OTHER
        source:
          type: string
          maxLength: 32
        loss_amount:
          type: string
          format: decimal
          examples:
          - '125.50'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217
      required:
      - label
      - source
    FraudRulePage:
      type: object
      description: One page of FraudRule results (newest first)
      properties:
        data:
          type: array
          items:
