openapi: 3.1.0
info:
  title: Meridian Core — Treasury and ALM API
  version: 1.0.0
  description: 'Front-to-back treasury: money market, FX and securities deals with confirmations and settlement, counterparty
    limits, liquidity positions and Basel III ratios (LCR/NSFR) with stress testing, and asset-liability management (repricing
    gap, NII/EVE sensitivity) with funds transfer pricing.

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.meridian.example
  description: Production
- url: https://sandbox.api.meridian.example
  description: Sandbox
security:
- oauth2: []
tags:
- name: Treasury Counterparties
  description: Treasury counterparty (bank, central bank, broker, corporate) with identifiers and rating
- name: Treasury Ssis
  description: Standing settlement instructions per counterparty and currency (used only once verified)
- name: Treasury Counterparty Limits
  description: Credit / settlement / tenor limit on a counterparty (or its group); usable once approved
- name: Treasury Limit Utilisations
  description: Immutable record of a deal consuming or releasing a counterparty limit
- name: Money Market Deals
  description: Money market placement, borrowing, call, repo or CD with full lifecycle
- name: Treasury Fx Deals
  description: Treasury FX deal (spot, forward, swap, NDF) with its legs — distinct from customer FX in payments
- name: Treasury Fx Deal Legs
  description: A leg of a treasury FX deal (one for spot/forward, two for swaps)
- name: Treasury Securities
  description: Security master record (bonds, bills, CP, CDs)
- name: Securities Holdings
  description: Position in a security by portfolio and accounting classification (maintained by trade settlement)
- name: Securities Trades
  description: Purchase or sale of a security that changes a holding (holding resolved or opened on capture)
- name: Treasury Confirmations
  description: Confirmation of a treasury deal (SWIFT MT300 FX, MT320 MM, MT541/543 securities) and matching
- name: Treasury Settlements
  description: Settlement instruction generated for a treasury deal cash flow
- name: Treasury Eod Runs
  description: One end-of-day job execution per tenant, job and business date (makes the EOD actions idempotent)
- name: Cash Positions
  description: Actual or projected cash position by currency, nostro and day
- name: Liquidity Ladder Runs
  description: A maturity ladder (liquidity gap) computation at an as-of date
- name: Lcr Calculations
  description: Basel III Liquidity Coverage Ratio snapshot
- name: Nsfr Calculations
  description: Basel III Net Stable Funding Ratio snapshot
- name: Liquidity Stress Scenarios
  description: Definition of a liquidity stress scenario (run-off rates, haircuts, horizon)
- name: Liquidity Stress Results
  description: Outcome of running a stress scenario at an as-of date
- name: Intraday Liquidity
  description: Intraday liquidity monitoring per currency and settlement account (BCBS 248)
- name: Liquidity Eod Runs
  description: One end-of-day liquidity job execution per tenant, job and business date (idempotency)
- name: Alm Behavioural Assumptions
  description: Behavioural assumption (prepayment, deposit decay, non-maturity repricing) by product; used once approved
- name: Alm Gap Runs
  description: Repricing gap report run at an as-of date
- name: Alm Sensitivity Runs
  description: NII / EVE / EaR sensitivity simulation under a rate shock
- name: Ftp Curves
  description: Funds transfer pricing curve per currency, type and effective date
- name: Ftp Curve Points
  description: Tenor point on an FTP curve (frozen once the curve is published)
- name: Ftp Rules
  description: Rule assigning an FTP method and curves to products / segments
- name: Ftp Assignments
  description: FTP rate and margin assigned to an account or loan for a period
paths:
  /v1/treasury/counterparties:
