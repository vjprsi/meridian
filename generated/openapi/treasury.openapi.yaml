          type: string
          enum:
          - BANK
          - CENTRAL_BANK
          - BROKER
          - CORPORATE
          - FUND
          - SOVEREIGN
          - SUPRANATIONAL
          - INTERNAL
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - ACTIVE
          - SUSPENDED
          - CLOSED
      - name: country_code
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: bic
        in: query
        schema:
          type: string
          maxLength: 11
      - name: lei
        in: query
        schema:
          type: string
          maxLength: 20
      - name: legal_entity_id
        in: query
        schema:
          type: string
          format: uuid
      - name: custom_field_1
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_2
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_3
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_4
        in: query
        schema:
          type: string
          maxLength: 500
      - name: custom_field_5
        in: query
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreasuryCounterpartyPage'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
